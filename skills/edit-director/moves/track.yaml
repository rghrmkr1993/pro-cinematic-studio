id: track.roam
family: track
group: camera
level: B
aliases: [roaming camera, roving camera, wandering camera, camera as a guest, camera stroll, walkthrough, one-take walk through a space]
what: a camera with no subject slowly wanders through a space like an invisible guest — drifting past people and details in a single take, turning its "gaze" now to one, now to another
frames: |
  1. A single take of 4.6–8 s with no anchor subject: the camera at eye level or lower moves forward at walking speed —
     the scene "opens up" ×1.3–2 per second (×1.01–1.03 per frame @25 fps), nonrigid 0.15–0.33 (real parallax).
  2. The path curves: the camera turns toward new objects — lateral shifts of 18–78 % of the frame over 1–2.8 s change side
     2–4 times per take, a soft roll of 13–40° on turns (with a light drone indoors — up to 90°).
  3. Each point of interest (a person, an object, a screen) is in frame for 0.5–1.5 s, then the camera drifts on; people
     go about their lives and look into the camera only in passing, if at all.
  4. Ending: arriving at the main object — a screen, a counter, a shop window, a person; often a pass through a screen or window
     into another place, or a dash toward the next group of people.
  Smoothness: gimbal or stabilizer — shake 0.46–1.2 % of the frame; handheld — up to 3.3 %.
variants:
  - through a crowd: a bar, a party, fans — the camera weaves between people and tables
  - through an interior: an apartment room by room, through doors and over tables; on a light drone — with deep rolls
  - skimming: low along lying people or objects, roll up to 40°
  - along a facade: the camera glides outside past the windows, peeks inside and turns around its axis
  - backstage: a walk across a film set past lights, equipment and people to the main spot
  - into another place: the wandering leads to a screen or window and passes through it (see pass.through)
