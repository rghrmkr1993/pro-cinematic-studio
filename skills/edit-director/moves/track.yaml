  cut 2–4 s in fast genres, 5–9 s in calm ones; put the arrival point on the downbeat.
  code: reframe(aspect, target=track(person), zoom=1.6–2.2, smooth=0.85) — a virtual tracking shot from a wide shot;
  stabilize(strength=0.8, anchor=track(person)) — "glue" the subject in a handheld shot.
