id: track.lead
family: track
group: camera
level: A
aliases: [leading shot, lead tracking, reverse tracking, camera backs up, walks toward the camera, walk and talk, front tracking]
what: the subject walks or rides straight toward the camera while the camera retreats ahead of them at the same speed — the face and the outfit stay in frame the whole time, while the space behind recedes into depth
frames: |
  1. The subject faces the camera in the center (x 0.45–0.55): a waist-up or medium shot — 70–100 % of the frame height, the head
     in the upper third; or full-length — 35–50 % of the height, often in the symmetrical perspective of a street or corridor.
  2. The camera retreats at their speed: the subject's size is constant, while the background "shrinks" toward the vanishing point — at walking pace
     ×0.8–0.88 per second (×0.991–0.995 per frame @25 fps). Walls and columns at the sides slide off the frame edges.
  3. Handheld, the camera bobs in time with the operator's steps: a vertical shift of 5–7 % of the frame every 0.45–0.55 s;
     on a stabilizer or a vehicle — shake of 0.14–0.3 %.
  4. Ending: the subject reaches the goal (sits down, meets people) and the camera stops; or they walk right into the lens —
     the frame is covered by the body or by darkness, a handy wipe for a cut.
variants:
  - walking with a phone, or a monologue to camera: waist-up shot, 2–3 s, light bobbing
  - squad walk-out: the leader in the center, the group behind them in a narrow passage, wide angle
  - symmetrical street or corridor: full-length, vanishing point behind the head, smooth tracking for 3–4 s
  - oncoming vehicle: a boat, a bicycle, a car "glued" to the frame, spray and road flow around them
  - underwater: a swimmer swims toward the camera, roll ±14°
  - entering from behind a wipe and exiting into the lens: starts on a dark foreground, ends with the subject blocking the frame
