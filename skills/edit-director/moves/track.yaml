id: track.follow
family: track
group: camera
level: A
aliases: [follow shot, following shot, follow from behind, camera walks behind the subject, behind the back, travel follow-me shot, chase cam]
what: the camera follows a subject who walks away from it at a constant distance — the viewer sees the back and the path ahead and seems to be walking along behind
frames: |
  1. The subject with their back to the camera, usually centered (x 0.4–0.6): back and head — 40–70 % of the frame height, or only the legs
     and lower body with a low camera; a car — 10–25 %.
  2. The camera moves at their speed: the subject stays in place in the frame, while the space ahead "opens up" from the vanishing
     point. At walking pace the background grows ×1.1–1.3 per second, running ×1.5–1.9, right at the ground up to ×3.7 — grass and floor fly under the camera.
  3. Camera height: shoulder (normal), hip or knee (low, the subject "looms"), at the ground (legs only).
  4. Ending: the subject reaches the goal — a meeting, a door, other people — and the camera stops or circles around them;
     or the subject walks on ahead, getting smaller, while the camera falls behind.
  A smooth stabilizer or gimbal — shake 0.1–0.5 % of the frame; a handheld chase — 0.7–1.6 %, running at ground level — up to 5.6 %.
variants:
  - at walking pace behind one subject or a pair — smooth, tight, 2–7 s
  - chase: a handheld camera behind a runner, the subject bounces in the frame, shake up to 1.6 %
  - low: the camera at hip or knee height, legs and an object in the hand are visible; at ground level — only sneakers and flying grass
  - walking off into the distance: the camera falls behind or stands still, the subject shrinks to half size in 10–11 s — a final shot, a farewell
  - walking backward: the subject moves away but looks into the camera (walks backward, sings, looks back)
  - behind a car: the car in the center, a night street opens up ahead
status: footage
fallback: |
  Code: from a static shot where the subject walks away — a smooth digital zoom-in that keeps their size constant
  (the subject does not shrink, the background grows; there will be no parallax, ×1.5–2 resolution headroom is needed); from a handheld "tail" —
  stabilization on the subject's back. Generation — with the user's consent.
params:
  duration: 1.3–11 s (typically 2–4 s, 50–100 frames @25 fps)
  subject_size: 40–70 % of the frame height (back with head); low variant — the bottom 50 % of the frame; a car 10–25 %
  subject_pos: x 0.4–0.6, below center
  background_zoom: walking ×1.004–1.011 per frame @25 fps (×1.1–1.3/s); running ×1.016–1.026; at ground level up to ×1.054
  lock_ratio: 0.14–0.25 smooth tracking; 0.9–1.45 chase
  camera_height: shoulder | hip-knee | ground
  jitter: 0.1–0.5 % smooth, 0.7–1.6 % chase, up to 5.6 % at ground level
  receding: the "walking off into the distance" variant — subject size ×0.5 in 10–11 s
when: |
  A journey, entering a new place, "follow me" in travel, a chase, tension (what is ahead?), an introduction from behind before
  the face is revealed. Hook — a tight follow of 2–3 s; build — a long one of 4–7 s; outro — walking off into the distance. A back that fills
  the frame in a dark passage is a handy wipe for a cut.
avoid: a back with no goal ahead (boring beyond 3–4 s); sudden jerks in distance; following from behind and leading from the front with the same subject cut back to back without a reason; a shot where the background is empty and no movement is visible (unclear that the camera is moving)
sfx: footsteps in rhythm, breathing, ambience of the place; in a chase — percussion in step; at ground level — rustling grass
genres: {travel: signature, sport: allowed, drama: allowed, epic: allowed, fashion: allowed, ugc: allowed, motivation: allowed, teaser: allowed, clips: allowed, viral: allowed, fanedit: allowed, calm: allowed, product: allowed}
detect: |
  ed_motion: a long ZOOM-IN of almost linear shape ×1.2–5.5 over 1.3–4 s, nonrigid 0.14–0.36 (the background "pushes in"
  with parallax), zoom center at the vanishing point behind the subject; no cuts.
  Own measurement: in the subject's box the flow is 4–7 times weaker than at the edges (lock 0.14–0.25); the radial component
  at the edges is positive (expansion). Visually — the back of the head or the back in the center.
  Unlike a dolly push-in on a standing person: there they grow. Unlike track.lead: the background shrinks (ZOOM-OUT), the face is visible.
  The "walking off into the distance" variant: ZOOM-OUT ×0.72–0.85 as the subject shrinks — the camera falls behind.
