id: track.subject
family: track
group: camera
level: A
aliases: [tracking shot, tracking, camera tracking, camera follows the subject, camera travels with the subject, subject tracking]
what: the camera moves together with a walking or riding subject at the same speed — the subject is "glued" to one spot in the frame while the world flows past
frames: |
  1. The subject (a person, a group, a car, an animal) is moving; the camera travels with them, so their size and position in the frame
     barely change for 2–9 s: usually centered horizontally (x 0.4–0.6), a medium or waist-up shot — 40–90 % of the frame
     height; a car — 10–25 %.
  2. The world flows: from behind the subject the background "opens up" from the vanishing point (×1.2–3.5 in 2–4 s), from the front it "shrinks"
     (×0.27–0.57 in 3–6 s), from the side it slides horizontally while foreground objects fly past as a wipe;
     from above the ground or the crowd moves under the subject. The flow at the frame edges is 3–15 times stronger than on the subject.
  3. Ending: the subject arrives (a meeting, sits down at a table, a door) and the camera settles into a static composition for 1–2 s
     or circles around them in an arc; or a cut right in motion.
  Shake: stabilizer or gimbal — 0.1–0.5 % of the frame; handheld chase — 0.8–7 %.
variants:
  - from behind, the subject walks away from the camera — a separate card, track.follow
  - from the front, the subject walks toward the camera — a separate card, track.lead
  - from the side: a long lens next to a fast subject (a car, a runner), passers-by in the foreground fly past as a wipe, shift up to 15 % of the frame per frame
  - from above: the camera above a subject who is being carried or is moving; the crowd or the ground flows beneath them
  - with arrival: the tracking ends when the subject reaches people or sits down — a transition into a static wide shot or two-shot
  - chase: a handheld camera behind a runner, strong shake, the subject "wanders" around the frame
status: footage
fallback: |
  Code: a virtual tracking shot from a static wide shot — a ×1.6–2.2 crop that smoothly follows the subject
  (works for movement across the frame and diagonally, there will be no parallax); from a shaky handheld "tail" —
  stabilization on the subject so they settle into place. No suitable shot — generation with the user's consent.
params:
  duration: 2–9 s (typically 3–4 s, 75–100 frames @25 fps); in fast editing — fragments of 1–2 s
  subject_size: 40–90 % of the frame height (person), 10–25 % (car)
  subject_pos: x 0.4–0.6; feet at the bottom edge or in the lower third
  lock_ratio: flow on the subject / flow at the edges — 0.06–0.2 for tight tracking; 0.7–1.3 if the subject actively moves within the frame
  background_flow: 0.3–3 % of the frame width per frame @25 fps; from the side on a long lens — up to 15 %
  background_zoom: from behind ×1.004–1.03 per frame, from the front ×0.98–0.995 per frame (the background, not the subject)
  jitter: 0.1–0.5 % (stabilizer), up to 7 % (chase)
  ending: arrival and a 1–2 s static hold, or a cut in motion
when: |
  Introducing the subject (an entrance, a walk-through), dialogue on the move, a journey and the road, a chase, entering a new space.
  Build and verse — a long tracking shot of 4–8 s; hook and drop — a 1–2 s fragment in motion. A side tracking shot with a foreground
  pass is convenient to cut on the pass — the wipe hides the cut.
avoid: the subject "jumps" around the frame or leaves it (the operator could not keep up); cutting a tracking shot from behind straight into a tracking shot from the front of the same subject without a reason; longer than 8 s without an event in a short video; waves and "jelly" after aggressive stabilization
sfx: footsteps and the ambience of the place; on a side tracking shot — short whooshes as foreground objects pass; chase — rhythmic percussion in step
genres: {travel: signature, sport: signature, fashion: signature, drama: allowed, epic: allowed, calm: allowed, ugc: allowed, motivation: allowed, teaser: allowed, clips: allowed, viral: allowed, product: allowed, fanedit: allowed, explainer: allowed}
detect: |
  ed_motion: 2+ s without cuts; a long ZOOM-IN (camera behind) or ZOOM-OUT (in front) of almost linear shape with
  nonrigid 0.2–0.35 — this is camera movement with parallax, not a zoom; from the side — a long SHIFT along X with peaks
  on foreground passes; from above — an even SHIFT along Y.
  Own measurement (dense Farneback flow on textured pixels): in the subject's central box the flow is 3–15 times weaker
  than in the side strips (lock 0.06–0.3).
  Unlike a dolly push-in and zoom.in: there the subject grows. Unlike a pan from a fixed position following the subject: the background shifts as a whole,
  nonrigid < 0.15. Unlike a lateral camera move (truck) past a static scene: nothing is "glued" to the frame.
