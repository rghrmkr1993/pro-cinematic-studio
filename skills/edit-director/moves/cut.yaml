id: cut.stutter
family: cut
group: editing
level: B
aliases: [stutter, stutter edit, frame stutter, loop stutter, stuck motion, motion loop]
what: the motion "gets stuck" — a 3-frame fragment repeats 7–9 times in a row (about a second), a run, a gesture or a swing twitches in place at ≈8 Hz, then comes a cut, or the motion is released and carries on
frames: |
  1. Lead-in: 0–8 frames @25 fps of normal motion (0–0.32 s) — or the stutter starts right from the cut.
     The fragment is taken from the last frames before the stopping point, when the camera has almost come to rest.
  2. Loop: 3 frames (0.12 s) repeat 7–9 times in a row — 21–27 frames, 0.84–1.08 s, about two beats at
     120 BPM. A runner, a dancer's arm, a racket swing get stuck in one phase and vibrate at ≈8.3 Hz.
     At the loop seam the frame jumps back: the difference between adjacent frames is 1.4–2 times the normal step —
     this jump is what makes the "stutter" visible.
  3. Repeats: exact copies (1 of 3 examples), or a slow digital zoom-out continues over the loop —
     scale ×0.997 per cycle, ×0.976–0.977 over 18–24 frames (about −0.1 % per frame): the action is stuck
     while the frame keeps breathing (2 of 3).
  4. Exit: a cut to the next shot, which immediately stutters with its own loop (a chain of two stutters of
     ≈1 s each); or the loop releases the motion — 3–4 frames of slowdown and normal playback; or the loop spreads apart,
     and for another half second every third step is bigger than the rest (×1.3) — residual twitching.
variants:
  - "clean loop: 3 identical frames × 8–9, then a cut"
  - "stutter chain: two shots in a row, each with its own loop of ≈1 s, the second one stutters from its first frame"
  - "loop with drift: the repeats run under a slow zoom-out of ≈2.3 % per second — the action is stuck, the camera is alive"
  - "spreading loop: the repeats gradually drift apart, and the loop flows into normal motion with a twitch every 3 frames"
  - "short hiccup (from editing practice, not in the sample): 2–6 frames × 2–4 repeats on a single hit"
status: code
fallback: it needs a shot with large fast motion (running, dancing, a swing, a hit) — 2–5 % of the frame per frame; if the motion is small, the loop is not visible — take another piece from the source footage or boost the shot with a ×1.2–1.5 crop on the moving object; no suitable action — generate a short shot with a repeated sharp movement with the user's consent
params:
  fragment: 3 frames @25 fps (0.12 s) — in all 4 measured loops; in practice 2–6 frames (0.08–0.24 s), length = 1/16 beat (exactly 3 frames at 125 BPM)
  repeats: 7–9 in a row (0.84–1.08 s) — measured; short hiccup 2–4 repeats (≈)
  lead_in: 0–8 frames of normal motion before the loop; place the loop point when the camera has almost stopped
  seam_jump: the jump at the seam is 1.4–2 times the normal step; motion within the fragment at least 2–5 % of the frame per frame, otherwise the stutter does not read
  repeat_mode: exact (exact copies) | drift — zoom-out ×0.997 per cycle (≈ −0.1 % of scale per frame, ×0.976 per second), centered on the frame center
  exit: cut (a cut; the next shot may stutter on its own) | release (3–4 frames of slowdown → normal speed) | decay (the repeats drift apart, 0.5 s of twitching every 3 frames)
  chain: up to 2 stutters in a row of ≈1 s each
  sync: fragment length = 1/16 or 1/32 beat of the track; the loop starts on a beat and ends on the next downbeat
when: |
  On an audio stutter or roll in the track (a repeated syllable, a drum roll, a glitch-chopped sample), in the build before
  the drop, at the peak of a dance move or a hit, when you want to "suspend" the subject for a second. Works well with running,
  dancing, sport, flapping fabric. Limit: 1–2 stutters (or one chain of two shots) per 30 s of video.
avoid: small or slow motion — the loop reads as the video freezing; on-screen speech (the mouth "stutters" without sound); a loop longer than 1.5 s — it turns into a GIF; a stutter that misses the sound event; strong camera movement during the loop — the whole frame jerks at the seam; calm and explainer videos
sfx: |
  The same technique in the audio: the last syllable, a hit or a 1/16 slice of the track's sample repeats in sync with the picture (the same
  0.12 s period); or a short glitch roll or a scratch over the whole loop; on the exit — a hit or the track coming back on the beat.
genres: {fanedit: signature, phonk: signature, viral: allowed, clips: allowed, teaser: allowed, fashion: allowed, sport: allowed, ugc: allowed, motivation: allowed, epic: allowed, drama: allowed, calm: forbidden, explainer: forbidden, travel: forbidden}
detect: |
  Custom check (the main cue): frame i ≈ frame i+N for N = 2–6 over 4+ repeats in a row — the difference over the moving
  area ≤ 0.5 of the normal step between adjacent frames (≈0 in an exact loop, 0.15–0.7 with drift); the autocorrelation
  of adjacent-frame differences peaks at lag N (N = 3 in the sample); at the seam point — a jump 1.4–2 times the
  normal step. The drift of the repeats is measured with ECC: scale ×0.997 per cycle.
  ed_motion: periodic one-frame SHIFT or ZOOM events every N frames against the direction of motion
  (backward jumps of 4.7–4.8 % of the frame every 3 frames for a runner), high x_dir_flips and jitter_pct > 1 % with no cuts
  inside the shot; no holds — the frames do not freeze, they repeat in a cycle.
  Unlike time.boomerang: there a 0.25–1 s segment plays forward and then mirrored backward, the difference profile is symmetric;
  here a short fragment repeats forward only (a sawtooth) with a jump back. Unlike time.step_print: there each
  phase freezes for 2–6 frames and playback only goes forward, with no repeating cycle. Unlike time.freeze: there it is a single frame.
  Unlike cut.flash: there it is a new image every time.
engine: |
  stutter(clip, at=t, frag=3 (frames @25 fps) | frag='1/16', repeats=8, mode='loop'|'drift'|'decay', lead_in=0–8,
          drift={scale_per_frame: 0.999, center: [0.5, 0.5]}, exit='cut'|'release'|'decay', release_frames=4)
          — new primitive: sawtooth time remapping of the source (t_src = t0 + (t − t0) mod frag);
          drift = transform(scale=[1, 0.976], t=[t0, t0+1.0], ease='linear') over the loop;
          decay — each next cycle starts 1 frame later, by the end of the loop it transitions into speed(1.0).
  + beat_sync(event='stutter', grid='1/16') — fragment length from the BPM (3 frames at 125 BPM, 4 at 94);
  + audio_stutter(track, at=t, slice=frag, repeats) — new: the same slice repeat in the music or the voice;
  + sfx('glitch'|'scratch', t=[t0, t0+dur]) if needed.
gen_hint: "a short static-camera shot of <subject> doing one sharp, repeated, large movement (sprinting stride, dance arm swing, racket swing), fast shutter, crisp frames, clean background, subject large in frame — footage for a loop stutter edit"
commands: ["stutter on #4: loop 3 frames 8 times before the drop", "make the runner stutter on the downbeat, then release into normal motion", "a chain of stutters on #6 and #7, a second each", "make the dancer stutter in sync with the glitch in the track"]
related: [time.boomerang, time.step_print, time.freeze, cut.flash, cut.jump, fx.glitch, time.speed_ramp]
evidence: {examples: 3, sources: 1, measured: "frame-by-frame analysis of 3 excerpts at 25 fps (2.3–4 s) from one clip: 4 loops — a 3-frame fragment (0.12 s) in all of them, 7–9 repeats (0.84–1.08 s); exact copies in 1 example (difference 0.4–0.7 out of 255), in 2 — a zoom-out ×0.997 per cycle, ×0.976–0.977 over 18–24 frames (ECC); jump at the seam 1.4–2× the normal step; lead-in 0–8 frames; exits — a cut to a second stutter, a release with 3–4 frames of slowdown, spreading apart with a twitch every 3 frames (autocorrelation at lag 3 — 0.41, at lag 6 — 0.55); the sample is narrow — one source, no sound", confidence: medium}
