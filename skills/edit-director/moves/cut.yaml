id: cut.crash
family: cut
group: editing
level: B
aliases: [crash cut, smash cut, abrupt cut, contrast cut, cut to silence, chaos to silence]
what: smash cut — at the peak of a jolt (a sharp push-in or pull-out) the shot breaks off and crashes into a contrasting world (from a crowd to a quiet landscape, from darkness to color, from macro to a top-down view); the new shot flies out of the same motion and brakes to a standstill within 0.25–0.55 s
frames: |
  1. Lead-in (shot A): the frame picks up speed — an accelerating push-in ×1.5–2.2 over 0.2–1 s (5–26 frames @25 fps,
     ease-in, peak ×1.09–1.3 per frame on the last frame), a one-frame "jab" ×1.3–1.4 right before the cut, or a sharp
     pull-out ×0.7 over 0.2 s. Sharpness on the last frames drops by a factor of 2–20 — motion blur.
  2. The cut lands on the frame of maximum speed, with no filler (0–1 frame of blur).
  3. Impact (shot B): the first frame is already flying in the same direction (×1.26–1.42 per frame for a push-in,
     ×0.76–0.85 for a pull-out) and brakes with ease-out — a fast phase of 3–8 frames, a full stop after 5–14 frames
     (0.25–0.55 s); in one example a soft settle drags on for another ≈1 s.
  4. Contrast (5 of 6): brightness changes by −20…+83 %, saturation by −59…+92 %, detail density ×0.27–×10, shot size
     jumps several steps — feet on sand → a top-down view of a valley, a crowded market → a dawn expanse with balloons,
     a dark face → a bright face against a colored wall, the belly of a passing plane → a white sky with a bird.
  5. After: B stands still — motion in the frame drops to ×0.05–0.44 of shot A within 0.3–0.8 s (4 of 6); hold for
     at least 0.5–1 s so that the "silence" that has set in reads.
variants:
  - "chaos to silence: a noisy crowded shot with a jolt → a quiet landscape that stops dead within 5 frames"
  - "darkness to color: an accelerating push-in on a face in shadow → a bright saturated face, the push-in dies out within 9 frames"
  - "scale jump: a blurred pull-out from a detail → a sharp top-down view of a similar texture, the pull-out continues and dies out"
  - "through a flash: a static shot ≈0.9 s → a jolt toward a passing object → an almost white sky with a lone bird"
  - "reverse, from silence into a jolt: a calm shot breaks off, and each next shot starts from a blurred pull-out ×0.5–0.62 that dies out within 0.24–0.44 s; 2–3 such cuts 0.4–0.5 s apart"
  - "pure smash cut without a zoom (the classic meaning of the term, not in the sample): loud and fast → silence and stillness, or the other way round, on one hard cut; the sound breaks off together with the picture"
status: code
fallback: if the source footage has no contrasting shot B — take the calmest wide shot (minimum motion and detail) or the one that differs most in brightness and color; if there is none either — generate a quiet empty landscape or an almost white frame with a single object, with the user's consent
params:
  out: push-in ×1.5–2.2 over 0.2–1 s (5–26 frames @25 fps), ease inExpo or inCubic, peak ×1.09–1.3 per frame on the last frame | "jab" ×1.3–1.4 in 1 frame | pull-out ×0.7 over 0.2 s
  seam: on the frame of peak speed; filler 0–1 frame of blur; sharpness of A at the seam ×0.05–0.5
  in: starting speed ×1.26–1.42 per frame (push-in) or ×0.76–0.85 (pull-out); total ×1.4–2.4; ease outExpo; stop after 5–14 frames (0.25–0.55 s)
  contrast: at least two cues — brightness ±20 % or more, saturation ±40 % or more, detail density ×2 or ×0.5, a shot-size change of 2+ steps
  calm_after: motion in B after 0.3–0.8 s — no more than 0.5 of the motion in A (×0.05–0.44 in the sample); hold B for at least 0.6 s
  reverse_chain: calm A → B starting from a blur ×0.5–0.62 that dies out over 0.24–0.44 s; 2–3 cuts 0.4–0.5 s apart
  center: zoom center on the detail in A and on the point of interest in B, ≈0.45–0.55 of the frame
when: |
  A change of world and mood in a single hit: from city bustle into the quiet of nature, from night into day, from tension
  into a pause, and the reverse move — from a lull into an explosion. Travel and teaser — a transition between locations or
  parts; music video and fan edit — on the drop or where the music breaks off; comedy — "promise → reality". The cut lands
  exactly on the downbeat or where the sound breaks off. Limit: 1–2 times per 30–60 s video; the reverse chain — once per chorus.
avoid: two shots similar in light and pace (the hit does not read — it is just a zoom transition); a slow acceleration with no peak at the cut; B braking for longer than 0.6 s (the hit gets mushy); frequent repetition; videos that are calm throughout; a shot B with strong motion of its own — there will be no "silence"
sfx: |
  Chaos → silence: the sound breaks off together with the picture — music and noise die at the cut, leaving the quiet
  ambience of the place (wind, birds) or full silence for 0.5–1 s; on the seam — a short hit or a whoosh, chopped off at the cut.
  Silence → explosion: a pause or an inhale before the cut, at the cut — a hit, bass and the music coming in. On the
  acceleration of A — a short riser of 0.2–1 s.
genres: {travel: signature, teaser: signature, fanedit: allowed, viral: allowed, epic: allowed, drama: allowed, sport: allowed, phonk: allowed, clips: allowed, motivation: allowed, ugc: allowed, product: allowed, fashion: allowed, explainer: allowed, calm: forbidden}
detect: |
  ed_motion: one cut between two ZOOM events of the same sign — before: ZOOM-IN ease-in (50 % of the path after 0.78
  of the duration), a one-frame ZOOM ×1.3–1.4 before the cut or ZOOM-OUT ×0.7 over 4 frames; after: ZOOM ease-out (50 %
  of the path by 0.07–0.34 of the duration) peaking on the first frame, no further events. Custom check: 3 frames before and
  frames 3–5 after the cut — brightness changes by 20 % or more, saturation by 40 % or more, edge density (Canny) ×2 or
  more or ×0.5 or less — at least two cues are required; the difference between adjacent frames 0.3–0.8 s after the cut
  is no more than 0.5 of that over the last 0.5 s of shot A.
  Unlike trans.zoom: there the zoom hides the seam — tone and center of A and B are close, the motion flows on; here the
  cut has to be felt — the world, light and pace are sharply different, B brakes to a standstill. Unlike zoom.crash: it has
  no cut. Unlike cut.match: there the shape matches and contrast is secondary. Unlike cut.quick: that is a series, this is one hit.
engine: |
  crash_cut(a, b, at=beat, mode='zoom_in'|'zoom_out'|'punch'|'hard'|'reverse',
            out={scale: 1.8, dur: 0.4, ease: 'inExpo'}, inn={scale: 1.8, dur: 0.4, ease: 'outExpo'},
            blur='zoom', center=[track(detail_a), track(subject_b)], audio='cut_to_ambience'|'cut_to_silence'|'hit')
  — new primitive = transform(A, scale=[1, out.scale], t=[at − out.dur, at], ease) + cut(at)
    + transform(B, scale=[1, inn.scale], t=[at, at + inn.dur], ease) + blur(kind='zoom', amount∝speed);
  pick_contrast(clips, ref=a, want='calm'|'busy', by=['luma', 'sat', 'edges', 'motion']) — new: picks B
    with maximum contrast (at least two cues);
  + duck(music, to=−40 dB, at=at, dur=0.8) or mute(music, at) + ambience(b) + sfx('impact', at=at, align='attack')
  + sfx('riser', at=at − out.dur).
gen_hint: "two shots for a crash cut — shot A: <busy, loud, crowded scene>, the camera rapidly accelerates forward with heavy motion blur; shot B: <calm, empty, quiet wide landscape at dawn>, it starts with a fast zoom that brakes hard to a complete stop within a quarter of a second, then stays perfectly still"
commands: ["crash cut from the bazaar into the dawn landscape at 0:14", "cut the noise off into silence on the drop", "sharp push-in on the face, then slam into the bright shot #5", "reverse crash: from silence into three jolting pull-outs on the chorus"]
related: [trans.zoom, zoom.crash, cut.match, cut.quick, trans.flash, time.freeze]
evidence: {examples: 6, sources: 2, measured: "ed_motion and custom measurements on 6 cuts (20–25 fps): A accelerates ×1.5–2.2 over 0.2–1 s peaking at ×1.09–1.39 per frame on the last frame, one-frame jab ×1.39, pull-out ×0.7 over 0.2 s; sharpness at the seam ×0.05–0.5; B starts at ×1.26–1.42 (push-in) or ×0.76–0.85 (pull-out) per frame and stops within 5–14 frames (0.25–0.55 s); contrast in 5 of 6 — brightness −20…+83 %, saturation −59…+92 %, edge density ×0.27–×10; motion 0.3–0.8 s after the cut ×0.05–0.44 of A in 4 of 6; reverse chain — 3 shots of 0.4–0.48 s, each starting from a blurred pull-out ×0.5–0.62; 5 examples from one travel film, no sound — the \"silence\" was judged by motion and detail, not by audio", confidence: medium}
---
id: cut.dance
family: cut
group: editing
level: C
aliases: [dance edit, dance video, choreography edit, dance editing, choreography editing, cutting to body movement, on-screen choreography]
what: editing and camera serve the dance — a shot holds a whole movement phrase, the camera either stays still so the group's pattern reads or follows the body's trajectory, and cuts, light and effects hit the movement accents and the beats
frames: |
  1. The base is a long shot for a whole phrase: in 12 of 16 examples 1–4.5 s without a single cut; in the edited ones
     pieces of 1–2.8 s (25–70 frames @25 fps), 3–10 times longer than in quick cutting. In 11 of 16 the dancers are seen
     full-length in at least one shot (≈): the figure takes 35–90 % of the frame height, feet in frame, the lead in the center.
  2. The camera picks a role. Spectator (8 of 16): tripod, frontal or straight overhead, frame shift < 0.15 % of the width
     per 40 ms — the pattern reads: a line, a circle, a diagonal, the lead with backing dancers on the sides, a pass through the frame.
     Partner: the camera repeats the body's trajectory — arms go up → the frame rises by 56 % of the height over 2.4 s
     with a push-in ×1.6 (accelerating toward the end); a jump to the side → a pan following it, 44 % of the width in 1 s (peak 9.5 %/frame);
     a couple spins → an orbit in the same direction, 70–90 % of the frame width per second; a wave along a line → a track along the line
     at ≈ 25 % of the width per second (scale ×25 over 4.5 s), accelerating ×2–2.5 on the last beat.
  3. Cuts only on an accent: the new shot starts just before a body hit, and the hit falls within its first
     0–200 ms (0, 2, 3 and 4 frames @20 fps after the four measured cuts); the cuts themselves sit within ±1.5 frames of
     the beat grid. Shot size follows the body: wide → feet only when the tap dancing starts; solo →
     ensemble through a 0.4 s blur; medium shot → wide shot of the trio on the beat after the light has held.
  4. Group: unison (3–4 heads turn at once, cycle ≈ 0.8 s) or canon — one movement travels along
     the line from dancer to dancer every 5–8 frames @25 fps (0.2–0.32 s, faster toward the end), the wave crosses the frame
     left to right in ≈ 2.6 s.
  5. Light and effects double the rhythm: in-frame light flashes on a 1/8 grid (225 ms, ≈ 133 BPM, ±0.5 frame),
     +15–35 to mean brightness for 1 frame; bright light holds for 0.5 s and is broken off by a cut on the beat.
variants:
  - frontal wide on a tripod: the group full-length against a wall, a car or shelving; the lead in the center, backing dancers on the sides, or dancers pass right through the frame; 2–3.5 s without cuts
  - pattern from above: people lie or sit on stairs, sand, a stage with rings of light — a diagonal or circles; a slow push-in ×1.27 over 1.6 s or a camera "nod" — down by 51 % of the height in 0.55 s, a 0.3 s pause, back up
  - partner camera: a rise following raised arms, a pan following a jump, an orbit together with a couple's spin, a track along the line of dancers
  - canon wave: a line of 4–8 people repeats one movement in turn with a 0.2–0.32 s delay
  - unison close-up: several heads or hands in one close-up move at the same time
  - shot-size change by the body: wide shot → feet only during the tap, the step hit 2 frames after the cut
  - clones and echo: one dancer multiplied into a line of 6–8 copies or leading 2 echo copies with a trail; the entry into the line of clones — through a 0.4 s horizontal blur
  - split screen: a close-up and a wide of the same movement side by side (panels ≈ 59/41 % of the width), in sync
  - foreshadowing: 4 frames before the cut — a 1-frame (50 ms) flash of the next shot at the peak of a jump
  - tableau: the group freezes in a pose for ≈1 s with almost no movement — a full stop at the end of the phrase
status: footage
fallback: |
  No group — build the choreography in code from one dancer (hybrid): a person mask and 4–8 copies in a line (unison)
  or each next copy delayed by 5–8 frames (canon). No camera movement — a digital "partner" on 4K:
  a crop ×1.2–1.6 that follows the center of the body (rising with the arms, shifting with a jump). No dance at all — search
  the source footage for shots with rhythmic body movement to music, or generate a motion transfer: a reference dance
  is transferred onto the user's subject with the user's consent.
params:
  shot_len: 1–4.5 s (25–110 frames @25 fps), typically 2 s; no shorter than a whole combination (4–8 counts), except for short inserts
  framing: full-length, the figure takes 35–90 % of the frame height, feet in frame, the lead in the center; close-ups — only faces (unison) and feet (tap)
  static_cam: frame shift < 0.15 % of the width per 40 ms; frontal or straight overhead
  follow_cam: camera speed and axis = body speed and axis — a rise of 20–25 % of the height per second, a pan following a jump 40–45 % of the width per second, an orbit 70–90 %, a track along the line ≈ 25 %; acceleration toward the end of the phrase (inCubic)
  cut_lead: the cut 0–5 frames @25 fps (0–200 ms) before the body accent, typically 2–3 frames; on the beat grid ±1 frame
  canon_delay: 5–8 frames @25 fps (0.2–0.32 s) between neighboring dancers; speeding up toward the end is acceptable
  light_pulse: +15–35 to mean brightness (out of 255) for 1 frame every 1/8 or 1/4 beat
  split: 2 panels ≈ 0.59/0.41 of the width, the very same moment (offset 0 frames)
  clones: 2–8 copies evenly spaced across the width, delay 0 (unison) or 5–8 frames (canon)
  whip_to_group: horizontal blur of 8 frames @20 fps (0.4 s) between solo and ensemble
when: |
  Music videos and fashion videos with a pronounced beat, dance trends and challenges, introducing a team or a collection,
  the ensemble's entrance on the drop, a final pose as the full stop at the end. A dance phrase = a piece of the edit: a shot per 1–2 bars;
  group unison — on the chorus, canon wave — on the build before the drop, solo — on the verse; shot-size changes are best
  placed on count "1" or "5" of an eight-count. One short insert (feet, hands) is acceptable between long shots.
avoid: a cut in the middle of a combination (breaks the movement and the count); quick cutting of 2–6 frames per piece on a dance (the body does not read); framing that cuts off the feet during tap or the arms during a wave; a camera that moves against the dancer or overtakes them; an angle change without a change of movement; a shaky handheld camera on a synchronized group (the pattern gets lost); clones and echo copies that lag behind the music
sfx: |
  The music itself comes first: cuts and flashes on its beats, with no extra effects on top. Boost the body sounds: soles
  and heels striking during tap, claps, fabric rustle on spins (3–6 dB louder than in reality). Blur into the ensemble —
  whoosh; the ensemble's entrance on the drop — a hit; the final pose — silence or the music stopping for 0.3–0.5 s.
genres: {fashion: signature, viral: signature, fanedit: allowed, ugc: allowed, teaser: allowed, product: allowed, sport: allowed, motivation: allowed, epic: allowed, drama: allowed, travel: allowed, clips: allowed, phonk: allowed, calm: allowed, explainer: allowed}
detect: |
  Custom measurement: the residual motion of people after subtracting camera motion (p95 of dense flow) is large — 1.5–4 %
  of the width per 40 ms — with little camera motion (< 0.15 %) or with camera motion tied to the center of the
  body (ed_motion: a long SHIFT or ZOOM without cuts for 1–4.5 s, the center of body motion shifts in the same direction).
  2+ full-length people in the same pose at the same moment — unison; the same pose offset by 5–8 frames along
  the line — canon (the center of residual motion drifts evenly across the frame). Cuts are few (≤ 1 per 1–2 s), and they sit
  0–5 frames before the peak of residual motion; ed_motion flashes (flash) at an even step of 1/8–1/4 beat.
  Unlike cut.quick: there the pieces are 0.07–0.6 s and each one is a new action; here the shot holds a phrase.
  Unlike track.subject: there the camera follows a walking subject at a constant speed; here it responds to the body's rhythm.
  Unlike time.echo_trail and fx.duplicate: those are effects in their own right; here the copies dance in unison or in canon.
engine: |
  dance_accents(clip, by='motion'|'audio'|'both') — new: body hits = p95 peaks of the residual flow (after
  subtracting camera motion) and sharp stops; matched against the track's beats.
  cut(at=accent - lead, lead=2–3 frames, snap='beat') — a cut before the accent; a shot no shorter than a phrase (1–2 bars).
  follow_cam(target=track(person), axis='y'|'x'|'orbit'|'along', gain=0.8–1.0, crop=1.2–1.6, ease='inCubic') —
  new: a digital partner camera following the center of the body (crop from 4K; rising with the arms, shifting with a jump).
  canon_clone(clip, mask='mediapipe_person', copies=4–8, spacing=[dx, 0], delay=0|5–8 frames) — new: unison
  or canon from a single take. split_screen(layout='2v', ratio=[0.59, 0.41], sync=True);
  flash(color='white', t=beats('1/8'), dur=1 frame, gain=0.1–0.15); transition('whip', dur=0.4) — solo → ensemble;
  echo(trails=2, decay=0.5); sfx('impact', at=ensemble entrance); sfx('whoosh', at=blur).
gen_hint: "music video choreography: <a group of 4–6 dancers> performs a sharp synchronized routine <on a staircase | in front of a plain wall | on a dark stage with rings of light>, full body visible head to toe, locked-off frontal wide shot (or the camera rises together with their raised arms), every move hits on the beat, then a wave passes along the line from one dancer to the next"
commands: ["cut the dance by phrases: a shot per 2 bars, cuts 2 frames before the hit", "on the drop — the whole group enters in a wide shot", "make a canon from one dancer: 6 copies delayed by 6 frames", "switch to the feet on the tap section", "make the camera rise with the arms in #4"]
related: [cut.quick, cut.vector_match, track.subject, time.echo_trail, fx.duplicate, layout.split_screen, light.flash, trans.whip, angle.overhead, frame.tableau, frame.central]
evidence: {examples: 16, sources: 8, measured: "16 clips from all 8 sources of the section: 12 — a single shot of 1–4.5 s without cuts, in 4 — 6 cuts, pieces of 1.05–2.8 s (some cut off by the clip edge); the camera is static in 8 of 16 (shift < 0.15 % of the width per 40 ms); camera following the body per ed_motion: a rise of 56 % of the height over 2.4 s with a push-in ×1.59, a pan of 44 % of the width in 1 s (peak 9.5 %/frame), an orbit of 255 % of the width over 2.85 s, a track ×25 over 4.5 s (≈1 % of the width per 40 ms, ×2–2.5 toward the end); body hit 0, 2, 3 and 4 frames @20 fps after the cut (residual flow); light flashes on a 4.5-frame grid @20 fps (225 ms) from frame 48, two cuts within ±1.5 frames of it; canon — peaks 8, 7 and 5 frames apart @25 fps; split panels are in sync (motion correlation 0.70 at offset 0, 0.5 at ±1); the \"full-length\" shares are a visual estimate; periodicity of the movement by autocorrelation is weak (r ≤ 0.33), the tempo was not derived from the dances themselves", confidence: medium}
---
id: cut.flash
family: cut
group: editing
level: B
aliases: [flash cut, flash montage, flicker montage, rapid image montage, flickering frames, image barrage, photo flipbook, subliminal flash, ultra-short inserts]
what: a stream of dozens of different images at 1–2 frames each (12–25 changes per second) — most often the eyes, face, figure or object stay at one point of the frame while people, places, outfits and color flicker around them; energy, "the whole collection in a couple of seconds", a flash of memory
frames: |
  1. Entry: on a downbeat the normal pace breaks off — or the video opens straight away with the stream.
  2. Stream: 13–97 changes over 0.5–7.3 s (median excerpt 2.7 s). Each image holds for 1–2 frames @25 fps
     (40–80 ms): the median across all pieces is 70 ms, 10 % — 40 ms, 90 % — up to 140 ms; in excerpts at the full rate
     of 25 fps, 71 % of the pieces are exactly 1 frame long. The "readable" variant — 3–4 frames (100–160 ms, 6–10 changes per second).
     Hard cuts, no separators (29 of 30); there is almost no motion inside a piece — these are photos, freeze frames
     or 1–2 frames of video.
  3. Match (24 of 30): the main object — eyes, a face, a full-length figure, a traffic light, a butterfly, an ornament — stays
     at the same point and the same size in all the images, so the averaged frame of the whole series stays
     sharp; the person, place, era, outfit and light color change. In 5 of 30 — a free stream of unrelated
     shots from the video (music video, trip) with motion blur, flares and a single white frame.
  4. Rhythm inside: even (20 of 29); speeding up 100 → 50 ms or 350 → 140 → 70 ms over 2–4 s (4 of 29);
     a breather of 0.36–1 s on one image in the middle of a long stream (2); a landing of 0.5–1 s (12–25 frames)
     on a key image at the end (5).
  5. Exit: a landing on the final frame, a hard return to the main shot or, less often, 2–4 frames
     of semi-transparent overlay of the last images.
variants:
  - "one subject, many worlds: the same person in dozens of places, outfits, looks or concerts, the face or figure at one point; mirrored and upside-down frames turn up among the normal ones"
  - "a collection of one kind: dozens of different faces, eyes, animals, traffic lights, butterflies, cards with the same pose — all aligned on the object; the ending on the \"main\" specimen"
  - "texture and pattern: ceiling coffers, a facade with rows of windows, reliefs, a crowd, night traffic — adjacent frames are almost identical in structure, only the content flickers"
  - "free stream: unrelated shots of the video itself at 1–2 frames each with motion blur, flares and an occasional white frame — the energy of a music video or a trip"
  - "takes of one shot: the same setup and shot size, while the take, the expression and the hood change — 1–3 frames each (borderline with cut.jump)"
  - "stack collage: photos land on top of each other with a rotation, the stack grows, then it switches to a full-screen stream (borderline with look.photo_prints)"
  - "styling: a single tone (green monochrome, B&W, cold stone) or a deliberately different light color on each frame; a rounded \"film\" frame border; a paper tear over the cut frame"
  - "order: a small set cycles round (repeating every 8–15 changes) or runs back and forth as a palindrome — in the sample 13 % of changes repeat an image already shown"
  - "single insert (the classic meaning of the term, not found in the sample): 1–6 frames of a different shot inside a normal scene — a flash of memory or premonition"
status: code
fallback: |
  It needs a set of 12–100 images of one kind. No ready set — assemble one from the user's source footage: the best frame
  of the subject from each shot (face detection, alignment by the eyes), freeze frames of all clips of the same shot size, photos
  from the user's gallery. Too few options — cycle the set or play it as a palindrome. No material at all — generate
  a series "the same subject or object, the same pose and shot size, different places and looks" with the user's consent.
params:
  image_len: 1–2 frames @25 fps (0.04–0.08 s), typically 2 frames; "readable" variant 3–4 frames (0.12–0.16 s); measured 30–160 ms, median 70 ms
  rate: 6–25 changes per second, typically 12–15 (at least 12 in 20 of 29 examples)
  burst: 1–4 s (25–100 frames @25 fps), typically 2.5 s; at least 12 images; ceiling ≈ 7 s
  pool: 12–100 different images; a cycle of 8–15 or a palindrome is acceptable, repeats no more than 15–20 % of changes
  anchor: the eyes, the center of the face or object at one point ± ≈3–5 % of the frame, size ±10 % (≈, judged by the sharpness of the series' averaged frame)
  rhythm: even | speed-up 3 → 2 → 1 frame over 1.5–3 s | a 0.4–1 s breather inside a stream longer than 3 s
  landing: 12–25 frames (0.5–1 s) on a key image — optional
  grade: a single tone (shared LUT, monochrome) or a deliberately different color on each frame; in safe mode adjacent images differ in mean relative luminance by no more than 0.1
  separators: none; optionally 1 white frame (brightness ≥ 240 out of 255) or a flare once every 8–16 changes, a paper tear on 1 frame at the cut
  exit: landing | hard return to the main shot | overlay of the last 2–4 frames
  safety: in the sample the median is ≈ 4.6 large brightness jumps per second (more than 3 in 18 of 29) — by default the engine evens out the brightness of adjacent images and keeps it to no more than 3 jumps per second, otherwise it warns
when: |
  The drop and the climax (a stream for a whole bar, landing on the next downbeat), the hook of the first 1–2 s ("all the subject's looks",
  "the whole collection"), the intro and ending of a fan edit, a lookbook in fashion, a product in dozens of settings, a teaser, a flashback or a "flash
  of memory", a transition between parts of the video. Limit: 1–2 streams per 30–60 s video; the stream starts and ends on a
  downbeat, while the changes inside go by frames, not by beats.
avoid: unaligned images in the "matched" variant (the face jumps around the frame and reads as junk); sharp brightness swings, red or white alternating frame by frame with dark — a risk for photosensitive viewers; fewer than 10 images (then it is cut.quick); a stream longer than 5–7 s without a breather; small details and text — they do not read in 1–2 frames; a calm contemplative tone and moments where the viewer has to understand something
sfx: |
  A continuous texture for the whole stream: a riser, projector or shutter clatter, ticking, a glitch trill; on the landing — a hit
  or a sub; before the stream — an inhale or the music stopping for 1 frame. A click on every change — only at 8 changes
  per second or fewer, otherwise the clicks merge into noise.
genres: {fanedit: signature, teaser: signature, fashion: signature, viral: allowed, phonk: allowed, epic: allowed, drama: allowed, travel: allowed, clips: allowed, product: allowed, ugc: allowed, motivation: allowed, sport: allowed, calm: forbidden}
detect: |
  ed_motion: cuts on almost every pair of frames (8–25 cuts per second over a stretch of 1 s or longer), methods ecc/fail,
  no global motion; many flash frames and strobe flips — these are brightness jumps between different images,
  not white frames (a flat frame with brightness spread < 10 — in 1 of 30). Custom check: 12+ pieces in a row of
  1–4 frames @25 fps; segmentation on 96 px thumbnails — a cut if the HSV histogram distance is > 0.5, or the mean
  difference is > 30, or the difference is > 9 with a correlation < 0.85 that does not disappear after shift compensation.
  Match: the averaged frame of the series keeps its structure — structure index 0.3–0.78 (random frames give
  0.22 ± 0.03), edge-map correlation of adjacent images ≥ 0.1 (random ones give 0.04).
  Unlike cut.quick: there 2–6 cuts per second and pieces of 2–15 frames, each one reads and carries an action; here
  8–25 changes per second, images of 1–2 frames each, usually aligned on the object. Unlike cut.match: there a series of rhymes at
  0.4–1.5 s per link. Unlike trans.flash: there a flat white or colored frame at the cut, not images. Unlike
  light.flash: only the light changes within one shot. Unlike cut.stutter: there the same fragment repeats.
  Unlike time.step_print: phases of one shot freeze. Unlike look.photo_prints: photo prints with borders, 3–12 frames each.
