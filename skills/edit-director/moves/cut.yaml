id: cut.quick
family: cut
group: editing
level: B
aliases: [quick cuts, fast cutting, rapid cutting, rapid-fire montage, hip hop montage, quick cutting, music-video-style cutting, burst of cuts, machine-gun editing]
what: a burst of 3–20 short shots in a row, 2–15 frames @25 fps each (0.07–0.6 s) — each holds one action, detail or face, the cuts hit the beats or the hits of the action, and the burst usually discharges into a long held shot
frames: |
  1. Lead-in: the normal pace (1–3 s per shot) or a long shot — the burst needs contrast to be "heard".
  2. Burst: 3–20 shots in a row, 2–6 cuts per second (median across examples ≈3). Piece length — 2–15 frames @25 fps:
     overall median 0.2 s (5 frames), the middle of the distribution 0.14–0.35 s (3.5–9 frames), 10 % shorter than
     0.07 s (1–2 frames), 10 % longer than 0.49 s (12 frames); the median of a single burst — from 0.14 to 0.6 s, typically 0.3 s.
     Within a burst the lengths are multiples of one unit: in an even series 3–4 pieces in a row of the same length (0.4/0.4/0.4 s,
     0.32/0.32 s, a 0.14 s pulse), in a musical one — 1 or 2 units (0.16 and 0.32 s, 0.2 and 0.3 s).
  3. Each piece is one thought: a complete micro-action (pressed, turned, splashed, zipped up), one detail
     of the place, one face or one shape; a close-up or an extreme close-up, the object in the center. The cut comes right after
     the peak of the action: the hit + 0.14–0.28 s of follow-through (≈3–7 frames: a bounce, a splash, a blur), never before the peak.
  4. Acceleration (in 5 of 18): toward the climax the pieces get 3–7 times shorter — 0.5 → 0.07 s, 0.35–0.55 → 0.1–0.15 s;
     at the peak — 1–2-frame inserts (a burst of fire, a flare, a black frame), then the result.
  5. Landing (visible in 6 of 18, in the rest the clip ends earlier): the burst ends with a hold of 0.84–2.3 s
     (typically 1.2 s, 2.5–10 times longer than the average piece) — a reaction face, a wide shot of the place, the result of the action.
variants:
  - routine or process: 3–6 close-ups of hands and objects at 0.28–0.77 s (7–19 frames), one action per piece, in process order; the sound of each action is exaggerated; landing on a face or a wide shot
  - mechanism from inside: parts, pistons, a spark, a burst of fire filling the frame — pieces of 0.07–0.21 s accelerating toward the burst, plus a result shot (a gauge needle, a start)
  - graphic strobe: 1–2-frame pieces (an even 0.14 s pulse) of abstract images with repeating shapes (a dome, a triangle, a profile) and alternating warm and cold, up to 7 cuts per second; landing of 1.2 s
  - musical pulse: 0.16–0.4 s, lengths of 1 or 2 grid units; two angles alternate A-B-A, 1-frame returns to the previous shot, flares on the cuts, axial jumps "wide → closer → closer" at 0.25 s each, whip blurs as joins
  - burst of reactions: 6–8 different faces at 2–3 frames each (0.1–0.15 s), the main character returns every other piece, the ending — an extreme close-up of an eye or a face
  - parallel burst: two lines of action alternate at 0.25–0.3 s, at the climax pieces of 1–2 frames (0.05–0.1 s), afterwards 0.4–0.6 s again (V-shaped pace)
  - accelerating montage: over 5–7 s the length drops from 0.5 s to 1 frame; on the early cuts — a one-frame overlay of two shots
  - through black: pieces of 0.18–0.42 s separated by 1–2 black frames (0.06–0.12 s), the pauses get shorter, the ending — a long close-up
  - details of a place: still details at exactly 0.4 s (10 frames) each, then a wide shot of 1 s or longer
status: code
fallback: too few different shots — cut long shots into pieces from different moments and shot sizes (crop ×1.3–2 from 4K, mirroring), alternate two angles A-B-A; no "actions" — find moments with a motion peak in the source footage (hands, objects, faces) or generate a series of extreme close-up micro-actions with the user's consent
params:
  shot_len: 2–15 frames @25 fps (0.07–0.6 s); typically 5–8 frames (0.2–0.32 s); strobe 2–4 frames (0.07–0.15 s); routine 8–15 frames (0.3–0.6 s)
  unit: grid unit of 1/16 or 1/8 beat — at 120 BPM 0.125 s (3 frames) or 0.25 s (6.25 frames); pieces = 1–2 units in a strobe, 2–4 in a pulse, 4–8 in a routine
  count: 3–20 pieces in a row, typically 4–8; strobe up to 15–40
  cut_rate: 2–6 cuts per second (median ≈3); above 6 — only for 1–2 s
  accel: optional — lengths drop 3–7 times toward the peak in steps (2–4 pieces of the same length, then half as long — 0.28 → 0.14 → 0.07 s); 1–2-frame inserts at the peak
  cut_point: on the beat grid ±1 frame; in action — 0.14–0.28 s (≈3–7 frames) after the motion peak
  landing: a hold of 0.8–2.3 s (typically 1.2 s = 30 frames), no shorter than 2.5× the average piece length of the burst
  framing: close-up and extreme close-up, the object in the center; the centers of attention of adjacent pieces within ≈0.2 of the diagonal
  contrast: in a routine adjacent pieces are close in brightness (|ΔL| ≤ 20 out of 255); in a strobe and a parallel burst — light/dark alternation (|ΔL| 40–75)
  inner_motion: 64 % of pieces have motion inside; still pieces (faces, details, graphics) — only on a strict grid
  bridges: optional 1–2-frame joins — black (0.04–0.12 s), a flare or a flash (0.04–0.3 s), a 1-frame overlay, a whip blur of 2–4 frames
when: |
  The build before the drop (the burst accelerating into the hit), the drop itself (a pulse on 1/8), "getting ready" and processes (dressing, cooking,
  repairs, preparing gear), introducing a place (details → wide shot), a crowd's reaction to an event,
  the climax of parallel action, the hook of the first 1–2 s. Limit: 1–2 bursts of 1–4 s per 30 s of video, with
  at least 3–4 s of calm pace between them; after a burst — a landing on an important shot.
avoid: the same length with no landing for longer than 4–5 s (tiring, the hit gets lost); small details and text on pieces shorter than 0.3 s (they do not read); wide shots with different centers of attention on pieces shorter than 0.25 s; a cut before the peak of the action; random off-grid lengths over music; shots that need the character's line or emotion (they need 1 s or more); a calm and contemplative tone
sfx: |
  Routine: each piece gets its own short exaggerated action sound (a click, a splash, a zipper, a hit) exactly on the cut
  or the peak, louder than real life; the musical version — cuts on the kick and hi-hats, no extra effects; before the landing —
  the sound stops or an inhale, on the landing — a hit or silence; 1-frame inserts and black joins — a tick, a glitch or
  a bass hit; acceleration — a riser over the whole burst.
genres: {viral: signature, fanedit: signature, clips: signature, phonk: signature, sport: signature, teaser: signature, travel: signature, ugc: allowed, motivation: allowed, product: allowed, fashion: allowed, epic: allowed, drama: allowed, explainer: allowed, calm: forbidden}
detect: |
  Custom segmentation on 64 px thumbnails: a cut if the frame correlation with a shift of up to ±4 px is < 0.45 or
  the HSV histogram distance (Bhattacharyya) is > 0.45 with a correlation < 0.7 — on 18 examples precision 0.80, recall
  0.83 (misses — one-frame overlays and joins within one palette; false positives — strong blur); ed_motion: the list of
  cuts gives 0.75/0.80. Check doubtful pairs with blur by sharpness and content.
  Signature of the move: 3+ pieces in a row no longer than 15 frames @25 fps (0.6 s) with a median ≤ 0.35 s; in 5 of 18 the series
  contains 1–3-frame black, white or flared pieces (ed_motion: black / flash / white); at the end — a hold ≥ 0.8 s.
  Unlike cut.flash: there a stream of 12+ different images at 1–2 frames each (8–25 changes per second), usually with the point of interest in one place of the frame; here pieces of 3–12 frames, and they are ordinary shots.
  Unlike cut.stutter: there the same fragment repeats; here every piece is new (an A-B-A return is a different moment).
  Unlike cut.jump: there the same angle and background with a jump in time (axial jumps are a borderline case).
  Unlike cut.vector_match: there the continuity of camera motion across the cut matters, the length is secondary.
  Unlike time.step_print: there phases of one shot freeze, with no new shots.
engine: |
  cut_series(clips[], n=4–8, unit='1/8'|'1/16', lengths=[2,2,1,1,...] (in units) | pattern='even'|'accelerate'|'v'|'alternate',
             snap='beat'|'action_peak', order='process'|'contrast'|'alternate_ab', bridge=None|'black'|'flash'|'mix1',
             landing={clip, dur: 1.2}) — new primitive; lengths are computed from beat times, not as a sum of frames
             (1/8 at 120 BPM = 6.25 frames → 6-6-6-7); minimum piece 2 frames (1 — only for flashes and inserts).
  action_peak(clip, by='motion'|'audio') — new: the time of the motion peak in a piece; cut = peak + 0.14–0.28 s.
  pick_hits(source, n, min_motion=3, scale='close', dedupe=0.9) — new: candidates from the source footage (close-ups,
  motion peak, no repeats). Joins: fade(to='black', dur=0.04–0.12) | flash(color='white', dur=0.04) |
  transition('dissolve', dur=0.04). Sound: sfx('click'|'impact'|'whoosh', at=cut, align='attack'); landing —
  sfx('impact') or duck(music) for 0.3 s. Stepped acceleration: 2–4 pieces of length L, then L/2, until it reaches 2 frames.
gen_hint: "a set of separate 1-second extreme close-up shots for a fast-cut montage: <hand zips a jacket>, <finger presses a button>, <water splashes into a sink>, <key turns in a lock>; each shot shows one short decisive action centered in frame, fast shutter, strong clear motion, consistent lighting and color, plain background"
commands: ["quick cuts of getting ready: one shot per action and a landing on the face", "accelerate #3–#9 into the drop — from a half-beat down to 2 frames", "a burst of reactions at 3 frames each between #12 and #13", "cut the details of the place at 0.4 s each, then a wide shot for a second"]
related: [cut.flash, cut.stutter, cut.jump, cut.insert, cut.vector_match, cut.match, cut.dance, time.speed_ramp, time.step_print, trans.whip, zoom.punch]
evidence: {examples: 18, sources: 18, measured: "frame-by-frame segmentation of 18 clips (source 10–25 fps, accuracy ±1 frame = 40–100 ms): 168 complete pieces — median 0.2 s (5 frames @25 fps), IQR 0.14–0.35 s, p10 0.07 s, p90 0.49 s, maximum 0.9 s; burst medians 0.14–0.6 s (median 0.3 s); 1.35–6 cuts/s; landing of 0.84–2.3 s in 6 of 18; acceleration in 5 of 18; adjacent pieces by brightness |ΔL| 8–21 in routines and 40–74 in strobes; motion inside in 64 % of pieces; the cut 0.14–0.28 s after the action peak (≈, 5 examples); no sound — the link to the beats was inferred from the regularity of the grid (0.4/0.4/0.4, 0.16/0.32, 0.14, 0.25 s), not from audio", confidence: high}
