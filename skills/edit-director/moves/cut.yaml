id: cut.match
family: cut
group: editing
level: B
aliases: [match cut, match editing, graphic match cut, shape match cut, visual rhyme, graphic match, same pose different place]
what: a cut in which two different shots share the main thing — the shape, the subject's pose and position, an object or the composition; the world around changes while the eye sees continuity and a "rhyme"
frames: |
  1. Shot A reaches the moment when the key element sits in a precisely set place: a round object in the center,
     the subject's head from behind in the center, a pose of the hands, the lines of a row or an arch, an object on a white background.
  2. The cut lands exactly on that frame (hard; less often a 2–6 frame dissolve). In shot B the element is the same size
     and at the same point: a ball → another round thing (a record, a target, a game chip, a planet), a drawing of a tree →
     a real tree on a hill, a graffiti eye → a living eye, rows of a vineyard → corrugated roofing →
     field markings, a tunnel arch → cathedral vaults, a bullet → a megaphone → a spray can (elongated objects on white).
  3. Subject version: the same person in the same pose and shot size, but the place, time, outfit or
     reality has changed — the back of the subject's head in the center in a bakery → a train car → a bookshop; a couple on a bicycle among tulips →
     on a snowmobile in the mountains; the heroine's face against different worlds; different people in the same bed seen from above.
  4. Series: 2–6 such cuts in a row at 0.4–1.5 s per shot, usually on every beat; the movement (a step, a turn,
     a gesture) continues through the cut at the same speed.
variants:
  - graphic: shape and size match (a circle, an arch, parallel lines, an elongated object), the objects are different
  - subject "same pose — different place": the subject and their pose stay the same, the world, outfit and time change
  - object → reality: a drawing, a photo, a model → the real object in the same composition
  - compositional: the vanishing point, the horizon, the arrangement of a group at a table match, the people and place are different
  - detail → detail: a hand on a shoulder → a hand on fabric, a foot in a sneaker → a car wheel (by movement and position in the frame)
  - time across the cut: the same overhead angle, a bed or a table, but different people or a different age
  - extreme close-up match: eye ↔ circle, mouth ↔ hole, pupil ↔ tunnel
status: code
fallback: pairs are picked in code from the user's source footage (a search for matching shapes, poses and subject positions — see engine); if the match is imprecise, shot B is fitted to A by crop, shift and rotation (≤10 % scale, ≤5°); no pair — generate shot B from the first frame of A (the same angle and pose in a different place) with the user's consent
params:
  align_pos: the center of the key element matches to within 2–5 % of the frame
  align_scale: element size ±5–15 %
  align_rot: angle ±3–8°
  cut_frame: the cut on the frame where the match is greatest (IoU of the element mask ≥ 0.5)
  shot_len: 0.4–1.5 s per shot in a series (10–38 frames @25 fps), a single rhyme — 1.5–4 s before and after
  series: 2–6 cuts in a row, typically 3–4, on beats or bars
  dissolve: 0 (hard) or 2–6 frames (match dissolve)
  motion: the speed and direction of the element's movement match across the cut (±20 %)
  contrast: everything else differs strongly — color, place, time (histograms far apart), otherwise the rhyme does not read
when: a change of place or time without losing the subject (travel "me in different cities", growing up, "years have passed"), linking ideas (drawing → reality, object → metaphor), intro and hook (a series of graphic rhymes on the beats), advertising — the product rhymes with a shape from life, music video — one gesture across different worlds; a series — on a verse or a build, a single rhyme — on a section change
avoid: a "rough" match (a jump of 10–20 % of the frame reads as a mistake); shots identical in both shape and background (that is already a jump cut); a series of rhymes without rhythm; a rhyme that breaks the meaning of the scene; more than 6–8 cuts in a row without a breather
sfx: at the cut — a click, a hit or bass on the beat; for graphic rhymes — a sound shared by both objects (a ball hit → a hit on a target); a sound bridge — the sound of scene A carries on into B; in a subject series — the ambience of the places changes under continuous music
genres: {travel: signature, fanedit: signature, fashion: signature, teaser: signature, viral: allowed, product: allowed, ugc: allowed, clips: allowed, epic: allowed, drama: allowed, motivation: allowed, explainer: allowed, sport: allowed, phonk: allowed, calm: allowed}
detect: |
  ed_motion: a cut with high hist (> 0.5) — the shots differ in color and place — but a custom check on the last frame of A
  and the first frame of B shows a structural match: edge-map correlation (Canny, smoothed by 3–5 px) > 0.3,
  IoU of the main object mask (saliency / person mask) ≥ 0.5, the center of the subject's or face bbox shifted ≤ 5 % of the frame,
  size ±15 %. Series: 2+ such cuts in a row with a similar placement of the element.
  Subject version: the face/person embedding is the same, the pose (keypoints) almost the same, the background different.
  Unlike cut.jump: in a jump the background and place are the same, the time or pose changes. Unlike cut.vector_match: there what decides is
  the motion vector on both sides of the seam (cos ≥ 0.55, speed ≥ 0.3 %/frame), the shape can be anything; here it is
  the match of shape and position in the cut frame with any motion, even zero; if both match — both tags. Unlike trans.morph: there
  in-between frames flow smoothly into each other. Unlike trans.dissolve: there is no shape match there.
engine: |
  match_cut(a, b, on='shape'|'pose'|'position'|'object'|'vanishing_point', anchor_a=track(...), anchor_b=track(...),
            align=True, tol_pos=0.04, tol_scale=0.12, tol_rot=6, at='best_overlap', dissolve=0)
  — searches a ±0.5 s window for the frame of maximum match and fits B to A with transform(scale, shift, rotate);
  finding pairs in the source footage: find_matches(clips, by='silhouette'|'circle'|'lines'|'pose'|'face', top_k=10);
  series: match_chain(clips[], on='pose', per_link=beat, anchor=track(person)) — "same pose, different places";
  + sfx('impact'|'click', at=cut, align='attack').
gen_hint: "two shots for a match cut: <shot A description>; shot B shows <new place or object> with the same <shape | pose | composition>, identical framing, subject in exactly the same position and size, same camera angle and lens"
commands: ["a series of \"same pose — different city\" cuts on every beat", "find a rhyme for the ball in #3 in the source footage", "match-cut the drawing to the real house by shape", "match cut between #2 and #3 on the face"]
related: [cut.jump, trans.morph, trans.dissolve, trans.hidden_cut, layout.frame_division]
evidence: {examples: 60, sources: "≈50 (different works, judging by appearance)", measured: "only a visual review of about 60 examples from the section at 5–7 points of each animation (scripted frame capture was blocked by browser permissions); match types were counted from frames, alignment accuracy and shot durations are \"≈\" estimates, not measured", confidence: medium}
