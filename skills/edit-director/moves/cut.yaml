id: cut.jump
family: cut
group: editing
level: B
aliases: [jump cut, jump, time jump, elliptical cut, choppy cut, jump cut with punch-in, punch-in jump cut, cut out pauses]
what: a cut within one camera setup with a chunk of time removed — the background stays put while the subject's pose, position or surroundings change in a jump; it compresses speech and action, shows that time has passed, sets a nervous rhythm
frames: |
  1. The base is one shot with a static camera (tripod, a mount on a car or a wall) or an almost static handheld one.
     The background on both sides of the cut matches: in 30 of 69 measured joins scale 0.996–1.003 and shift ≤ 0.3 % of the frame;
     with a handheld camera scale 0.97–1.02, shift 2–8 % of the frame, roll ≤ 1°.
  2. A chunk is cut out of the action: the subject's pose, gesture, position or distance to the camera "jumps". Sometimes
     the surroundings jump — the light (night → morning, blue dusk ↔ golden sunset), wall color, people around, an object nearby.
  3. At the join the change in the frame is 3–15 times larger than the normal frame-to-frame change in a moving shot and 20–85 times in a static one;
     the changed area is the subject itself (5–70 % of the frame), the rest does not move.
  4. Piece length: in a rhythmic series 5–20 frames @25 fps (median 12.5 frames ≈ 0.5 s, sometimes an even grid of 6+6+6+6 frames
     of 0.24 s each); in a narrative "time passes" series — 21–44 frames (0.85–1.75 s). A series is 2–7 jumps, the last piece
     is usually longer (1.3–1.75 s) or gives way to a close-up.
  5. The join is hard (0 frames) in 19 of 24 examples; in the rest — 1–3 frames of white flash with a "ghost" of both poses
     (brightness +38…+52 out of 255, saturation −10), or the jumps are hidden in a continuous camera spin with blur.
variants:
  - pose after pose: the camera stays still, between cuts the subject lies, sits, stands, moves around the sofa or the room; a group or choreography rearranges in jerks
  - time passes: the same frame, but the light and the time of day have changed, someone has left, it has got dark outside; pieces of 0.85–1.75 s
  - leaving or arriving: with each cut the subject is closer or farther across a field, along a corridor, down a street — the journey without the movement itself (the figure's height changes 1.5–2.1 times per cut)
  - the world around a fixed frame: elevator doors open on different floors, a camera on a car — the landscape changes, an object or an animal "pops up" or jumps in the frame
  - look change on the rhythm: glasses, clothes, an accessory or even a different person in the same composition on every beat (6 frames @25 fps)
  - nervous handheld: a scene or dialogue shot handheld, pieces of 0.3–0.8 s, the frame shifts by 2–8 % between them
  - jump with a punch-in: shot size alternates ×1.0 ↔ ×1.14–1.29 (centered on the face in the middle of the frame) on every cut of a talking head or a wide-angle selfie; inside a piece there may be a quick zoom-in ×1.13 over 4 frames
  - soft: 1–3 frames of white flash or a dissolve with doubled poses — for a dream, waiting, a memory
  - jump in a blur: the camera spins continuously around the subject with the background blurred, while the pose jumps at the joins — the jump is only 1.5–2.6× the frame-to-frame change and drowns in the overall motion
  - continuous zoom-in: a slow digital zoom-in ×1.2 over 1.3 s runs over the whole series of jumps, the scale does not jump at the joins
  - through a blink: the eyes close in one time and open in another (extreme close-up, the light or the age has changed)
status: code
fallback: |
  Handheld camera without a common background — first stabilize + align the pieces by the background (crop ×1.05–1.1), then cut.
  A change of look, place or time within the same framing is needed but there are no such takes — search the source footage for series of shots with
  a matching setup (find_same_setup); none of those either — generate several clips from one starting frame (the same
  angle and lens, a different pose, clothes or light) with the user's consent.
params:
  remove: speech — pauses > 0.25 s and filler words (a cut of 0.15–1.5 s); action — 0.3–5 s, the pose must change noticeably; "time passes" — minutes and hours (a change of light)
  segment: rhythmic series 5–20 frames @25 fps (0.2–0.8 s), typically 10–14 frames (0.4–0.55 s); talking head — by phrases, 1.5–4 s; "time passes" 21–44 frames (0.85–1.75 s); final piece 1.3–1.75 s
  grid: on the beat at 110–125 BPM (0.48–0.55 s, 12–14 frames) or on 1/8 (6 frames @25 fps); in speech — on word boundaries
  framing_match: the background matches — scale 1.00 ± 0.03, shift ≤ 3 % of the frame (tripod ≤ 0.3 %), roll ≤ 1°; nervous handheld variant — shift 2–8 %
  punch: alternate ×1.0 and ×1.15–1.3 (measured ×1.14–1.29, median ×1.23), centered on the face track(face); less than ×1.15 reads as a mistake
  jump_magnitude: the change at the join ≥ 3× the normal frame-to-frame change (otherwise it looks like a dropped frame)
  soft: 0 frames (main option) | a flash of 1–3 frames — brightness +40…+50, saturation −10, overlay of both poses 30–70 % | a dissolve of 2–3 frames
  series: 2–7 jumps in a row; then a hold or a change of technique
  audio: speech is cut together with the picture with a 10–20 ms micro-crossfade; the music runs continuously on top
when: |
  Talking head (UGC, explainer, viral): cut out pauses, breaths and slips of the tongue, a cut every 1.5–4 s, a punch-in on every other
  cut — the pace rises and the jump looks intentional. Hook: the first 1–3 s — 2–4 jumps of 6–10 frames each.
  Music: a series of jumps on the beats in a verse or on the drop — a change of pose, look or place on every 1/4 (or 1/8 at the peak).
  "Time passes": waiting, boredom, work, night → morning, getting ready, a workout — 2–5 pieces of 0.85–1.75 s from a tripod.
  Progress: walking off into the distance, rearranging, "before/after" in one frame. No more than 2–3 series per 30 s of a music-driven video.
avoid: |
  The frame shifted by 10–30 % between pieces or the shot size changed by less than ×1.15 — it reads as a mistake, not a technique
  (match by the background or make an obvious punch-in). Too small a jump (almost the same pose) — looks like a dropped frame.
  A cut in the middle of a word or syllable, clicks without a crossfade. Hard jumps in a calm, luxury or mournful tone —
  only the soft variant. More than 6–8 punch-ins back and forth in a row (causes motion sickness). Different light and balance in adjacent pieces for
  no reason. Jumps where continuity of action matters to the viewer (a stunt, a goal, a product demo in action).
sfx: in speech — no separate sound, joins on word boundaries with a 10–20 ms crossfade; in music — cuts on the beats, on a look change a short "click" or an 80–150 ms whistle on the join; the soft variant with a flash — a light hit or a film "rustle"; "time passes" — a ticking clock, ambience or the scene sound fading out on each jump
genres: {ugc: signature, explainer: signature, viral: signature, fashion: signature, clips: signature, fanedit: allowed, phonk: allowed, teaser: allowed, drama: allowed, product: allowed, travel: allowed, sport: allowed, motivation: allowed, calm: allowed}
detect: |
  ed_motion often misses such a cut (same palette, hist < 0.5) — a custom check on frame pairs is needed: a jump in frame
  difference ≥ 3× the median of neighboring pairs (ignore held frames), while ORB+RANSAC alignment of the last frame of A and
  the first frame of B on the background holds (inlier ratio ≥ 0.4, scale 1.00 ± 0.03, shift ≤ 3 %; handheld — ≤ 8 %), and
  the residual after alignment is concentrated on the subject (5–70 % of the frame). The palette is usually the same (hist < 0.3), except for jumps
  with a change of light (up to 0.6–0.95). Punch variant: background scale at the join 1.14–1.3 centered on the face, alternating.
  Soft: 1–3 frames with a brightness jump of +40…+50 and doubling. Series: 2+ such joins with pieces of 5–44 frames.
  Unlike cut.match: there the place and background change, only the subject's shape or pose matches. Unlike cut.insert: an insert is
  the same moment, tighter (×1.3–15), time does not jump. Unlike zoom.punch: a punch-in within a continuous take, the pose does not jump.
  Unlike cut.stutter: a stutter repeats frames already shown (time goes back), a jump only goes forward. Unlike cut.quick: there different
  shots and angles. Unlike time.fast_motion: the motion is continuous, without breaks.
engine: |
  jump_cut(clip, remove=[[t0, t1], ...] | auto='silence'|'fillers'|'beats'|'action', min_keep=0.2, min_remove=0.15,
           align='bg', punch=[1.0, 1.2], punch_every=1|2, punch_center=track(face), soft=None|'flash'|'dissolve',
           soft_frames=2, snap='word'|'beat')
  — speech: speech_segments(clip, vad=True, fillers=True, pad=0.06) → keep the segments, cut out pauses > 0.25 s;
    transform(scale=1.2, center=track(face)) on every second piece.
  — a series of look or place changes: jump_series(clips_same_setup[], per='1/4'|'1/8', hold_last=1.5);
    find_same_setup(clips, tol_scale=0.03, tol_shift=0.03) looks for pieces with the same camera setup.
  — soft join: flash(color='white', dur=2/25, gain=+45) + transition('dissolve', dur=2/25).
  + sfx('click', at=cut, align='attack') only for a look change to music.
