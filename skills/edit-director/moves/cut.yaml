id: cut.insert
family: cut
group: editing
level: B
aliases: [cut-in, insert shot, insert, detail insert, close-up insert, detail, detail shot, axial cut, cut-out, reverse cut-in]
what: a cut from a wide or medium shot to a tighter shot of the same place and moment — a face, a hand, an object or a detail of the action; the action is not interrupted, and the viewer gets a "magnifying glass" on what matters
frames: |
  1. Main shot 0.45–2.3 s: the viewer sees where and who; the detail is in it, but small (anywhere in the frame).
  2. The cut — with no in-between frames (15 of 18 examples), less often a 2-frame dissolve, 1 frame of white flash
     or 8 frames of a "wipe" when a hand or a shoulder covers the lens.
  3. The insert: the same point of the scene, tighter. Axial — the same angle, ×1.3–3.6; on a person the window is centered
     horizontally (0.49–0.53) and shifted up toward the face (0.19–0.46), the face at 32–39 % of the height from the top;
     on an object — the window where it stands (a car — window center 0.43, 0.64).
     From a new position — ×2–4 on the subject or group. Detail — ×5–15: eyes, a trigger, a lighter flame, a wheel, a pilot's helmet.
  4. Time is continuous: the movement continues from the same phase (a gesture, a turn, a car passing, a burst of flame),
     with neither a jump forward nor a repeat at the seam.
  5. Insert length: a step in a series 6–7 frames @20 fps (0.3–0.35 s ≈ 8 frames @25 fps); a detail with a return — 21 frames @25 fps
     (0.84 s); inserts that end the excerpt — from 0.8 to 2.8 s. The return goes back to the same main shot
     with the same framing: in all three examples with a return, scale 1.000 and shift ≤ 0.04 % of the frame.
variants:
  - a step closer on the axis: wide → medium of the same subject ×1.3–2 (dance, gesture, performance), the same angle
  - ladder of axial inserts: wide → ×1.34–1.58 → ×2.6–2.7 → ×1.34–1.58 again → wide; the outer steps 0.3 s each, centered on the face; the tightest shot holds for 0.35–2.25 s; the steps are exact enlarged crops of the wide (residual after alignment 1–3 out of 255)
  - action detail: a hand with a lighter → the flame ×7, a hand with a weapon → the finger on the trigger ×12–15, a hand on an object → the object; the key thing happens on the detail (the flame flares up, the finger squeezes)
  - face detail: medium → eyes ×2.8 for 0.84 s (a blink, a glance) → back
  - insert from a new position: a wide through the foreground (flowers, a corridor, a crowd) → the subject or group ×2–4 from a different angle and with different light
  - insert on a moving object: a passing car ×3.6 — the object crosses the frame and leaves, an empty background remains
  - insert hidden in a "wipe": a hand, shoulder or body passes in front of the lens for 8 frames (brightness −40 %, saturation +30 %), and from behind it — a close-up of the face
  - reverse insert (cut-out, reveal): detail → wide shot ×1/4.7–1/20 — a butterfly in a hairdo → the whole figure (1 frame of white flash), feet → a square of hundreds of people, a swing of a club → a person on a car roof in the middle of an empty canal
status: footage
fallback: |
  No separate close-up — crop from the main shot: an axial insert up to ×1.5 from 1080p and up to ×2.7 from 4K
  (sharpening; at ×2+ on 1080p — upscale the fragment); center on the target, the face in the upper third of the crop.
  A ×5+ detail cannot be made by cropping — search the source footage for a take with the same thing in close-up (find_detail) or generate
  a close-up of the detail from a frame of the main shot (same light, color and action) with the user's consent.
params:
  scale: axial 1.3–3.6 (typically 2); from a new position 2–4; detail 5–15 (typically 7–10); reverse insert ×1/4–1/20
  target: track(face | hand | object:<name>); axial — window centered horizontally ±0.03, the face at 0.32–0.39 of the crop height
  main_before: 0.45–2.3 s (11–56 frames @25 fps) — the viewer must have time to read the place
  insert_len: a step in a series 0.3–0.35 s (7–9 frames @25 fps); detail 0.5–1.5 s (12–38 frames), typically 0.84 s (21 frames); final insert up to 2.8 s
  ladder: scales 1 → 1.35–1.6 → 2.6–2.7 → 1.35–1.6 → 1; steps of 1/8–1/4 beat each, the tightest holds for 1–4 beats
  continuity: cutting on action — the phase of movement at the seam matches (±1 frame), time is continuous
  transition: a 0-frame cut (main option) | 2-frame dissolve | 1 frame of white flash (+70 brightness, saturation −30) | foreground wipe of 8 frames
  return: back to the same main shot with the same framing — after 1 insert or after 2–3 details in a row
when: |
  Product and explainer: when an item or a step is mentioned — a detail in the hands, a button, a texture (0.5–1.5 s), then back
  to the speaker. Drama and teaser: the detail the scene hinges on (eyes, a hand on the trigger, a key, a flame) — on a pause
  or at the climax of the action. Music: a step closer on the axis on the downbeat, a ladder of inserts on 1/8 before the drop,
  the tightest step — on the drop. A reverse insert — to reveal the scale or an absurd location in the hook
  and at turning points. No more than 1 insert per 3–5 s of speech, a detail series — 2–3 details in a row, then back to the main shot.
avoid: |
  An insert unrelated to the meaning or the line — it distracts. A detail that was not visible or mentioned in the main
  shot — the viewer loses track of where it is. A shot-size jump below ×1.3 (looks like a framing mistake; that is already
  zoom.punch). A broken action phase at the seam (a repeated or skipped movement), different light and balance for no reason.
  A ×2+ crop from 1080p without upscaling — mush. Inserts more often than once every 2 s in speech genres — they chop up the narrative.
sfx: the main shot's sound runs continuously through the insert (it is the same moment); the detail can be emphasized with a close-up sound of the object — a click, a strike, fabric rustle, a button sound — on the insert frame; in a ladder — a short hit or bass on each step, on the return — no sound or an "exhale"
genres: {product: signature, drama: signature, explainer: signature, fashion: signature, teaser: signature, ugc: allowed, motivation: allowed, sport: allowed, travel: allowed, epic: allowed, viral: allowed, fanedit: allowed, clips: allowed, phonk: allowed, calm: allowed}
detect: |
  A cut (ed_motion cut or a frame-difference jump ≥ 3× the neighbors) after which frame B is an enlarged part of frame A:
  multi-scale template search (B scaled down by s inside A) gives a correlation peak ≥ 0.8 at s = 1.3–4 —
  an axial insert; a residual after alignment of 1–3 out of 255 — the insert was made by cropping. From a new position: the palette is close
  (hist 0.2–0.6), the same person or object (face, clothes, color) takes up 2–15 times more. The strongest cue —
  A → B → A: the main shot returns with the same framing (ORB alignment of the A frames before and after the insert: scale 1.00,
  shift ≤ 0.5 %, inlier ratio ≥ 0.8). Ladder: 2–4 cuts in a row with a scale of ×1.3–1.7 per step and a mirrored
  return. Unlike cut.jump: there the framing is the same (s ≈ 1) and time jumps. Unlike zoom.punch: a punch is a digital
  zoom-in ×1.1–1.35 within a shot as an accent on the beat, an insert is a new shot on the target at ×1.3+. Unlike zoom.crash: there
  the zoom movement is visible, with blur. Unlike cut.flash: a flash insert is shorter than 6 frames. Unlike cut.match: there the place changes.
engine: |
  cut_in(main, at, dur=0.84, target=track(face|hand|object:<name>), scale=2|'auto', source='crop'|'clip:<id>',
         match_action=True, transition='cut'|'dissolve:2f'|'flash:1f'|'fg_wipe:8f', return_to_main=True)
  — source='crop': transform(scale=S, center=target, t=[at, at+dur], ease='hold') + sharpen; S>1.5 on 1080p → upscale;
  — source='clip': find_detail(clips, of=target, min_scale=2) looks for a close-up of the same thing; align_action(main, insert,
    by='motion_phase') butts the movement phases together (±1 frame).
  Ladder: insert_ladder(scales=[1, 1.4, 2.65, 1.4, 1], per='1/8', hold_peak='1/2', center=track(face), face_at=0.35).
  Reverse insert: cut_out(detail, wide, at=beat) — first the detail, then the wide; + flash(color='white', dur=1/25).
  + sfx(kind by object: 'click'|'impact', at=at, align='attack') on a detail.
gen_hint: "extreme close-up insert of <detail: hands / object / eyes> from the same scene as <wide shot description>, same lighting, same color palette and same moment of action, shallow depth of field, the detail fills the frame"
commands: ["detail insert on the product when I name it", "on #3 cut in to a close-up of the hands with the lighter and go back to the wide", "a ladder of push-ins by cuts on the face before the drop", "start with the detail, then reveal the wide shot"]
related: [cut.jump, zoom.punch, zoom.crash, cut.flash, cut.match, shot.extreme_close_up, shot.close_up, trans.wipe, zoom.out]
evidence: {examples: 18, sources: "18 (one each from different works)", measured: "frame by frame with our own script: cuts by frame-difference jumps, scale and position of the insert — by multi-scale template search (reliable in 6: ×1.34, ×1.58, ×2.0, ×2.6–2.7, ×2.8, ×3.56, window center 0.43–0.53 horizontally) and by the size of the subject or object in the rest (≈×2–15, estimates); exact crops in two ladders (residual 1–3); return to the main shot with the same framing in 3 of 3 (scale 1.000); continuity of action at the seam — visually in 6 scenes with movement; lengths: steps 6–7 frames @20 fps, detail with a return 21 frames @25 fps, the other inserts are cut off by the end of the excerpt (≥0.7–2.8 s); transitions: 15 hard, 1 dissolve of 2 frames, 1 white frame +70 brightness, 1 wipe of 8 frames; 3 of 18 are reverse (detail → wide)", confidence: high}
