id: cut.vector_match
family: cut
group: editing
level: B
aliases: [match on action, motion match cut, motion vector match, continuous motion, continuous camera across cuts, movement match]
what: cutting on the motion vector — the end of shot A and the start of shot B move in the same direction (a pan, a tilt, a push-in or pull-out, a roll, the subject itself), so different places and times read as one continuous move; the speed at the seam is held, damped or accelerated
frames: |
  1. Shot A moves: a sideways drift, a tilt up or down, a push-in or pull-out, a roll — or the subject moves in the frame
     (a step, a jump, raising the arms). The cut comes mid-motion: on the last 2–3 frames of A the camera is still moving.
  2. Seam: the head of B moves in the same direction. In 33 of 61 measured seams the direction is preserved — the cosine
     of the shift vectors is 0.57–1.0 (median ≈0.95) or the zoom and roll have the same sign. Speed B/A: 0.65–1.5 —
     "continuation" (15 seams, median ×1.15, B slightly livelier), 0.1–0.7 — "braking" (8), 2–5 — "acceleration" (10).
  3. Typical speeds at the seam (@25 fps): drift 0.3 % of the frame per frame, tilt 1–3 %, fast tilt 5–8 %,
     whip 20–30 %; pull-out 2–5 % of scale per frame, a pull-out jolt 11–22 %; spiral push-in 4–12 % + roll 3–12°/frame;
     roll 1.5–5.5°/frame.
  4. Rhythm: pieces of 40–2500 ms, median 400 ms (10 frames @25 fps), half of them 170–540 ms; a quarter of the pieces are flashes
     of 1–4 frames inside fast passes. Often an even grid (all 9–10 frames each).
  5. Links at the seam: an anchor at the same point of the frame (offset ≤ 2 % of the frame), a near object or 3–5 black frames
     fly past the lens, 1–3 frames of blur at speeds above 5 %/frame. The series is closed by a "landing" — a shot
     that damps the motion within 1–8 frames and holds still.
variants:
  - continuation drift: two views of one place (day and night, empty and with the subject) alternate every 9–10 frames @25 fps, both drift sideways by 0.28–0.34 % of the frame per frame, the anchor stays at one point (offset < 2 %)
  - vertical pass: a tilt or crane up (down) at 1–3 %/frame through 3–4 different shots; in the fast variant 5–8 %/frame, speed ratio ×1.1–1.3
  - spiral push-in through circles: 4–5 shots in a row, each a push-in to the center at 4–12 %/frame with a roll of 3–12°/frame in the same direction; a round shape in the center (a pupil, a dome, a bowl, a face from above), center 0.47–0.57; the ending — a sharp pull-out
  - relaunch: every shot starts with the same jolt (a pull-out ×0.35–0.65 over 3–9 frames, peak 11–22 % of scale per frame, ease-out, center 0.5), then 0–5 frames of rest and a cut on the beat — the motion repeats rather than continues
  - braking and landing: a whip or a fast tilt at 20–30 %/frame hands over to a shot moving the same way at 7–10 %/frame (×0.3–0.5); or an acceleration in A (pull-out up to 15 %/frame) and 1–2 frames of remaining motion in B — then a stop
  - acceleration into a series: a slow pass (1–2 %/frame) turns into a fast pass in the same direction ×2–5, then a series of 1–4-frame flashes (book pages, textures) gradually dying down 10 → 2 %/frame
  - pendulum: all shots rotate (roll 1.5–5.5°/frame), but the roll direction changes at every cut; pieces of 400–550 ms — craft and texture montages
  - by the subject's movement: the camera differs, but the action continues the direction — a sandal step from above → the heroine stepping toward the camera, a jump down → a dive underwater, a hand flinging open a curtain in the direction of the pan; the camera often follows the action
  - wipe at the lens: a column, an arch, a bed headboard, a board or 3–5 black frames pass at the seam, and the motion comes out of the wipe (sometimes already in the other direction, if it is a "relaunch" after a fade to black)
status: code
fallback: |
  No pair of shots with the same motion — make up the difference in code: a digital shift, scale or roll of 5–10 % of the frame (≤5°)
  on the last 6–10 frames of A and the first 6–10 frames of B (crop ×1.1–1.2) until the vectors match; for a "relaunch"
  and a "landing" a transform on the head of B is enough (scale ×1.1–1.6 → 1.0 over 2–9 frames, outCubic). A static source
  with a strong mismatch — 2 frames of directional blur at the seam. A real pass is needed — search the source footage
  via ed_motion (type and direction of motion) or generate a shot with the specified motion with the user's consent.
params:
  direction_match: when building, the cosine of the shift vectors ≥ 0.75, when detecting ≥ 0.55 (0.57–1.0 in the examples, median ≈0.95); for zoom and roll — the same sign; compare the median of 2–3 frame pairs on each side
  min_speed: both sides ≥ 0.3 %/frame of shift, ≥ 1 %/frame of zoom or ≥ 1°/frame of roll — otherwise it is not the move but an ordinary cut
  speed_ratio: B/A 0.65–1.5 continuation (typically ×1.15), 0.1–0.7 braking (typically 0.3–0.6), 2–5 acceleration
  speeds: drift 0.3 %/frame; tilt 1–3, fast 5–8, whip 20–30 %/frame; pull-out 2–5 % of scale/frame, jolt 11–22; spiral push-in 4–12 % + 3–12°/frame; roll 1.5–5.5°/frame (all @25 fps)
  shot_length: 40–2500 ms, median 400 ms (10 frames @25 fps), working range 170–540 ms; flashes of 1–4 frames only inside a fast pass
  cut_point: the middle of A's motion, not the acceleration or the braking; on a beat (1/4 or 1/2 bar)
  anchor: an anchor (a shape, a vanishing point, the center of a circle) at the same point of the frame ±2–5 % — desirable
  relaunch_head: pull-out ×0.35–0.65 over 3–9 frames, peak 11–22 %/frame, ease-out, center [0.5, 0.5]; rest of 0–5 frames before the cut
  landing: the last shot damps the motion within 1–8 frames and holds still for ≥ 0.5 s
  seam_blur: 1–3 frames of directional or radial blur at speeds > 5 %/frame or > 4°/frame
  correction: a digital shift, scale or roll of up to 5–10 % of the frame (≤5°) over 6–10 frames at the seam, crop ×1.1–1.2
when: |
  Travel and "a day in 15 seconds", craft and process, music video, teaser, fashion — when many places and shots have to be carried
  in one gesture. An even beat grid (1/4–1/2 bar) on a verse or build; accelerating the series — into the drop, braking and
  landing — on the final shot or a downbeat; relaunch — on every beat of the chorus. A series of 3–6 seams, then
  a breather of ≥ 1 bar; a single seam works for a change of place without losing the pace.
avoid: opposite directions on adjacent seams without intent (it jerks; the exception is a deliberate roll "pendulum"); a cut on a still frame after motion; different types of motion (pan → push-in) without a link; a different horizon and roll in adjacent shots; pieces longer than 1.5 s — the continuity gets lost; more than 6–8 seams in a row without a landing — causes motion sickness; very dark or empty shots — the vector does not read
sfx: a shared continuous layer (music, wind, hum) with no dips at the seams; on fast seams (> 5 %/frame) — a soft whoosh on the cut; on acceleration — a riser over the whole series; a hit or bass — on the landing of the final shot; in a "relaunch" — a short pulse on every jolt, on the beat
genres: {travel: signature, clips: signature, fanedit: allowed, viral: allowed, epic: allowed, sport: allowed, fashion: allowed, product: allowed, teaser: allowed, motivation: allowed, ugc: allowed, drama: allowed, explainer: allowed, calm: allowed}
detect: |
  1. Cuts: hist > 0.35 and diff > 20 by the custom check; ed_motion reports extra cuts inside blurs (method fail/ecc,
     few points) — re-check them; skip duplicate frames (diff < 1.5) in clips at 30+ fps.
  2. For each cut — the median of 2–3 pairs before and after: tx, ty (% of the frame/frame @25 fps), zoom (%/frame), roll (°/frame);
     on dark and detail-poor frames — dense flow (DIS) with a similarity fit, on textured ones — LK from ed_motion.
  3. The move is present if the video has ≥ 2 such seams: the same type of motion, cos ≥ 0.55 or the same sign of zoom/roll, both sides
     faster than min_speed. Mode by B/A: 0.65–1.5 continuation, 0.1–0.7 braking, 2–5 acceleration. A head of B with a jolt of
     11–22 %/frame after ≥ 3 static frames of A, repeated at 2+ seams — relaunch; the roll sign alternates over 3+
     seams — pendulum; the camera differs but the subject's movement (flow within the person mask) keeps its direction — by the subject's movement.
  4. Visually: a montage of different places where "the camera never stops"; an anchor or a round shape at one point of the frame.
  Unlike cut.match: there the shape and position in the cut frame match (mask IoU ≥ 0.5) with any motion,
  even zero; here the motion vector decides, the shape can be anything. If both shape and motion match — put both
  tags (a rhyme in motion). Unlike trans.whip: there the seam is hidden in 1–3 frames of solid blur > 20 %/frame with no detail.
  Unlike zoom.infinite: there the seam is hidden by a dissolve or nesting, the push-in speed is strictly constant. Unlike trans.zoom:
  one cut at the peak of a push-in with blur. Unlike cut.quick: cutting without matching vectors (cos < 0.3, random signs).
engine: |
  motion_profile(clip, at='head'|'tail', frames=3) → {tx, ty, zoom, roll} via ed_motion (DIS flow on dark frames);
  match(on='motion', mode='continue'|'brake'|'accelerate'|'relaunch'|'pendulum'|'subject', min_cos=0.75,
        speed_ratio=[0.65, 1.5] | [0.3, 0.6] | [2, 5]) — picks "tail of A / head of B" pairs and the order of the shots;
  cut(at=middle of A's motion, snap='beat', grid='1/4'|'1/2');
  mismatch → transform(shift|scale|rotate up to 0.1 of the frame and 5°, t=[cut-0.3, cut+0.3], ease='linear') on both shots;
  relaunch → transform(scale=[1.6, 1.0], center=[0.5, 0.5], t=[cut, cut+0.3], ease='outCubic') on the head of each shot;
  landing → transform(scale=[1.08, 1.0], t=[cut, cut+0.08]) and a hold ≥ 0.5 s;
  speed > 5 %/frame or > 4°/frame → blur(kind='directional'|'zoom', amount∝speed, t=[cut-0.08, cut+0.08]);
  series: vector_match_chain(clips, mode, order='by_speed'|'alternate_sign', per_link='1/2 bar', anchor=track(object))
  + sfx('whoosh', at=cut) on fast seams, sfx('impact', at=landing).
