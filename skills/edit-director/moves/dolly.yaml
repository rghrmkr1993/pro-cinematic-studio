id: dolly.infinite
family: dolly
group: camera
level: C
aliases: [endless corridor, endless dolly, loop dolly, looped tracking shot, infinite pull-out]
what: the camera travels forward (or backward) through a space that never ends — a corridor, an arcade, a row of trees or seats repeats, and the movement is looped or cut together so the seam isn't visible
frames: |
  1. A space with repetition: a long corridor, an enfilade of arches, a row of trees, a row of identical seats, nested openings;
     the vanishing point sits in the center (0.48–0.56 in x).
  2. Travel: an even movement without acceleration — the scale of the center grows linearly in log terms, ×1.15–2.6 per second
     (×1.006–1.04 per frame @25 fps); walls and objects at the edges drift away with parallax.
  3. Infinity is made in one of three ways:
     a) loop — after one repeat period (one arch, one tree, one span) the frame matches the first one: ×3–5 over 1.7–1.8 s,
        the video loops without a seam;
     b) hidden cuts on the vanishing point — every 2 frames (80 ms) a new similar corridor, aligned to the same
        perspective and slightly "deeper" than the previous one; it feels like the camera rushes through an endless building;
     c) nesting outward — a pull-out from a screen to a shop, from the shop to the street through a chain-link fence: ×110 over 4.35 s with
        a static center.
  4. Length 1.8–10.5 s; in the edit — for as long as the music holds it.
variants:
  - endless corridor (3D or real): an even travel ×1.15/s, an arcade with raking light, 10 s without a seam
  - recursive arches: an opening inside an opening, loop ×5 over 1.7 s — recursion in space
  - forest loop: a pass through a row of trees at sunset, ×3 over 1.7 s, the branch at the start and at the end of the loop matches
  - corridor montage: 40–50 different corridors of 2 frames each, all aligned on the vanishing point
  - mirrored row: identical people in an endless row of seats, travel ×8.6 over 4.35 s (×1.64/s)
  - infinite pull-out: screen → room → street, static center, ×110 outward
status: hybrid
fallback: |
  A loop from your own material: a travel along repeating architecture (a colonnade, a corridor, a row of trees), find two frames
  with a matching view one period apart and join them with a 4–8-frame dissolve. Corridor montage — in code from photos or
  videos of similar spaces aligned on the vanishing point. Nested pull-out — in code (screen or window track + composite).
  A pure endless space (a 3D corridor, recursive arches) — generation with the user's consent.
params:
  rate: ×1.15–2.6 per second (×1.006–1.04 per frame @25 fps), constant in log terms; typically ×1.6/s
  center: vanishing point 0.48–0.56 in x, 0.45–0.55 in y (for the forest — 0.86 in y, horizon at the bottom)
  loop_period: 1.7–1.8 s (43–45 frames @25 fps) per repeat; scale over a period ×3–5 = the ratio between neighboring repeats
  loop_seam: the last frame matches the first; for a manual loop — a 4–8-frame dissolve on matching views
  montage_hold: 2 frames @25 fps (80 ms) per corridor shot, sometimes 1; 40–50 link shots in 4 s
  alignment: the vanishing points of neighboring links match within 2–3 % of the frame, each link's scale 3–8 % larger than the previous one
  nested_out: ×2.5–3/s outward with a static center; nested frames — screen, shop window, window, chain-link fence
  parallax: nonrigid 0.15–0.25 for a real or 3D travel; 0.08–0.1 for digital nesting
  duration: 1.8–10.5 s (45–260 frames @25 fps)
when: |
  Intro and outro (a hypnotic loop under ambient or techno), an "endless maze" teaser, visualizing repetition,
  routine, being stuck; a background for titles or text; corridor montage — to a fast steady beat (a change every 1/8 or 1/16);
  nested pull-out — "it was all on a screen" at the end. 1 per video, hold until the next section of the music.
avoid: |
  Any jerk in speed or a turn at the seam — the infinity breaks. A space without an obvious repeat — the loop can't be built.
  Different light and color between montage links — it flickers. Too long a travel without an event in the viral format (max 3–4 s).
sfx: |
  A continuous hum, drone or wind for the whole movement with no accents (otherwise the seam is audible); in the corridor montage — a quiet tick or
  hi-hat on each change; on the nested pull-out — the sound gets muffled as the camera moves away.
genres: {teaser: signature, fanedit: allowed, calm: allowed, travel: allowed, epic: allowed, drama: allowed, fashion: allowed, viral: allowed}
detect: |
  ed_motion: a long near-linear ZOOM-IN (or ZOOM-OUT) centered at 0.5±0.06 with conf ok, nonrigid 0.08–0.25, no cuts;
  loop — accumulated scale ×3–5 per period and the last frame almost equal to the first (the difference at the seam is like between neighboring frames);
  corridor montage — a "cut" every 2 frames with an almost unchanged histogram and a fixed vanishing point (ed_motion catches
  only some of the cuts — compare neighboring frames at the edges: correlation 0.1–0.5 at a change versus 0.9+ within a link).
  Differs from zoom.infinite: there it is a zoom into a picture within a picture (scene changes), here it is movement through one repeating
  space with parallax. From dolly.in: a regular travel has a beginning and an end, and the speed changes.
  From time.hyperlapse: a hyperlapse has jumping light and small shifts, here the geometry is precise.
engine: |
  loop: loop_dolly(clip, period=find_period(similarity='frame0', min=1.0, max=3.0), seam='crossfade', seam_dur=0.24)
         + speed(curve=constant) — even out the speed before cutting the loop.
  corridor montage: vp_align(clips[], target='vanishing_point', scale_step=1.05) + cut(every=2fr)
                    + transform(scale=[1, 1.05], t=each_link, ease='linear') — a continuous "push" within each link.
  nested pull-out: chain_zoom(clips[], per_link=1.5, rate=-ln(3), seam='nest(quad=track(screen|window))', center=[0.5, 0.5]).
  sound: sfx('swell', at=t0, gain=-12dB) without hits; beat_sync(event='cut', grid='1/8') for the corridor montage.
gen_hint: seamless looping camera dolly forward through an endless <corridor of arches / row of trees / hallway>, constant speed, perfectly centered one-point perspective, the space repeats so the last frame matches the first, no cuts, soft directional light
commands: ["loop the corridor dolly so it looks endless", "intro: an endless pass through arches, 4 seconds", "cut the corridors from #2–#9 on the vanishing point, 2 frames per link", "an infinite pull-out at the end — it turns out it was all on a screen"]
related: [zoom.infinite, dolly.in, pass.through, trans.hidden_cut, time.hyperlapse, frame.central]
evidence: {examples: 6, sources: 6, measured: "travel ×1.15–2.6/s centered at 0.49–0.56, near-linear in all 5 continuous ones; loops — ×5 and ×3 over 1.71 s, the last frame almost equal to the first (difference 28.6 and 14.2 versus 29.8 and 11.6 between neighboring frames); corridor montage — a new link every 2 frames (80 ms), 47 links in 4.1 s, edge correlation 0.1–0.5 at a change and 0.86–0.99 within; nested pull-out ×0.009 (×110) over 4.35 s, nonrigid 0.08; mirrored row ×8.6 over 4.35 s", confidence: medium}
---
id: dolly.zoom
family: dolly
group: camera
level: B
aliases: [dolly zoom, contra-zoom, zoom with dolly, perspective stretch, trombone shot, zolly]
what: the subject keeps the same shot size while the space behind them stretches or compresses — the camera travels one way, the zoom works the other way; "the ground slips from under the feet", shock, realization, a shift of reality
frames: |
  1. Start: a medium shot or a close-up, the subject centered (center 0.45–0.55), a deep background behind —
     a street, buildings, a corridor, a horizon line; the camera stands on the axis.
  2. Move: the subject's size stays within ±3–10 %, the background changes scale:
     - the background "advances" (zoom in, camera back) — ×1.1–1.25 over 1–1.6 s for soft ones, ×2.85 over 4.8 s
       for a slow climactic one, up to ×3 over 0.6 s for a sharp one;
     - the background "recedes" (zoom out, camera forward) — ×0.92–0.96 over 1.9–3.1 s for barely noticeable ones,
       ×0.55–0.67 over 0.7–2.1 s for strong ones; the horizon and the walls spread apart, depth grows.
     The speed is even (near-linear), no jerk at the start.
  3. Landing: a stop at the extreme position and a hold — or an immediate reverse move of the same length
     (a "there and back" swing, 3 of 12 examples; one of them looped by reversing).
  Often coincides with the subject's frozen face, the sound stopping or a pause in a line.
variants:
  - background advances — zoom in + camera pull-back, the world "closes in" on the subject
  - background recedes — zoom out + camera push-in, the space stretches, the subject "falls away"
  - barely noticeable — the background changes by 4–8 % over 2–3 s, felt as unease without obvious movement
  - swing — there and back in 1.5–2 s, often in music videos on the beat, sometimes by reversing
  - sharp — a background change of ×2–3 over 0.4–0.6 s on a hit
status: footage
fallback: the real effect is shot in camera; in code — hybrid "2.5D" (subject mask, the background without the subject filled in, the background scales one way, the subject stays put; for a deep scene — scale by a depth map, in layers); without a suitable shot — generate a shot with a contra-zoom with the user's consent
params:
  subject_scale: hold 1.0 (tolerance ±3–10 %), the subject's center static
  bg_scale: advancing ×1.1–1.5 (up to ×3 when sharp), receding ×0.55–0.95; typically ×1.3 or ×0.75
  duration: 0.6–5 s (15–125 frames @25 fps), typically 1.5–2.5 s
  ease: linear or inOutSine — no jerk; for the sharp one — inOutCubic
  rate: soft 0.3–0.6 %/frame on the background, strong 1–2 %/frame, sharp 4–8 %/frame
  yoyo: optional reverse move of the same length, a pause of 0–4 frames at the end point
  depth: the background at least 3–5 times farther than the subject (street, corridor, horizon), otherwise the effect doesn't read
  framing: a close-up or medium shot centered, perspective lines converging on the head
when: a moment of shock, realization, fear, dizziness, "the world slips out from under the feet"; the climax of a scene or a story twist; teaser and drama — once per video; in music videos — swings on the downbeats; in UGC and memes — a comedic "dramatic pause"
avoid: a flat background close to the subject — the effect isn't visible; a shaky handheld camera; frequent use (more than 1–2 times) turns it into a meme; a calm or explainer video with no dramatic reason; when faking in code — hair and outline with a halo, a ragged fill behind the subject
sfx: a low rising rumble or a "stretching" sound (reverse cymbal, stretched riser), the ambient sound sinks into a filter; in comedy — a dramatic "dun-dun"; a hit at the end of the move
genres: {drama: signature, teaser: signature, epic: allowed, viral: allowed, fanedit: allowed, motivation: allowed, ugc: allowed, phonk: allowed, calm: forbidden, explainer: forbidden}
detect: |
  ed_motion often gets confused: either "no significant global motion" (the subject fills the center and doesn't change),
  or ZOOM-IN/OUT with nonrigid 0.19–0.47 (conf low) — the scale comes from the background. The decisive own check is as
  in dolly.in: subject scale (face box or LK points inside the mask) versus background scale (LK points outside the
  body or a background template at several scales): for a dolly zoom the subject is 0.9–1.1, the background ×1.1–3 or ×0.55–0.95,
  i.e. k = log(subject)/log(background) ≈ −0.3…0.3 (for a dolly push-in k 1.15–2.2, for a zoom ≈1).
  Visually: the perspective lines "breathe", the distance between the subject and the background seems to change.
  Differs from zoom.in/zoom.out: there the subject and the background grow equally. Differs from dolly.in: there the subject grows faster than the background.
engine: |
  footage: find_shot(k_face_bg in [-0.3, 0.3], bg_scale_change >= 1.1) → cut(at).
  Imitation: mask(method='mediapipe_person'|'hf_remove_background', feather=2) → subject;
  bg = inpaint(A without the subject) (or outpaint when bg_scale < 1, when the frame edge is needed);
  dolly_zoom_fake(subject, bg, bg_scale=[1, 1.4], subject_scale=[1, 1], center=track(face), t=[t0, t0+2], ease='linear',
                  depth=estimate_depth(A) | None) — new primitive: with depth — layer scale ∝ depth (farther layers scale more)
  Swing: the same primitive with bg_scale=[1, 1.4, 1] and ease=['inOutSine', 'inOutSine'].
  + sfx('riser', at=t0) + duck(music, under=riser) + sfx('impact', at=t0+2)
gen_hint: dolly zoom (contra-zoom) on <subject> standing in <deep location>, the subject stays the same size in the center while the background <stretches away | rushes toward the camera>, smooth, locked on the face, dramatic realization
commands: ["dolly zoom on the subject's face at the moment of shock", "contra-zoom on #4: the background closes in over 2 seconds", "dolly zoom swing on the drop", "make a fake dolly zoom from a static shot"]
related: [dolly.in, zoom.slow, zoom.crash, shot.realization, dolly.double]
evidence: {examples: 12, sources: 12, measured: "in 9 of 12 the subject holds the shot size (0.92–1.09) while the background changes: advances ×1.08–1.25 over 1–1.6 s, ×2.85 over 4.8 s, ≈×3 over 0.6 s; recedes ×0.92–0.96 over 1.9–3.1 s and ×0.55–0.67 over 0.7–2.1 s; 3 examples — a there-and-back swing (one by reversing); ed_motion: nonrigid 0.19–0.47 or \"no global motion\"; 3 examples are ambiguous (an even pull-out or the subject walking on their own)", confidence: medium}
