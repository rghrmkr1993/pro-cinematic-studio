id: dolly.float
family: dolly
group: camera
level: B
aliases: [gimbal, stabilizer, gimbal tracking shot, gimbal push, smooth walk-through, gimbal push-in, gimbal pull-out, hovering camera, floating camera]
what: the camera glides smoothly, without tracks, toward or away from the subject at walking speed — like a dolly, but it passes through doors, crowds, stairs and windows; a light "floating" feel and real parallax
frames: |
  1. Start: a wide or medium shot, the subject (or a group) centered horizontally (x 0.47–0.54), the head in the upper
     half of the frame (motion center y 0.26–0.44).
  2. Forward move: the camera moves toward the subject steadily — scale ×1.9–2.8 over 2–4 s (≈×1.014–1.05 per frame); half the distance at
     0.45–0.7 of the time — steady or with a smooth acceleration toward the end. Real parallax (nonrigid 0.17–0.29):
     the foreground drifts past, people and objects open up on the sides.
  3. Backward move (less often): a pull-out ×0.22–0.32 over 2.9–3.9 s, almost steady — the subject gets smaller, the surroundings are revealed
     (the stage, the crowd, the set).
  4. "Floating": almost no shake (0.06–0.3 % of the frame), but a soft drift in height and roll up to 2–4° — livelier than a dolly.
  5. End: stopping on a close-up of the face, the conversation continues on a "floating" close-up; or the camera passes
     through a window, a door, a crowd into the next space without a cut (×6 over 5 s in one move).
variants:
  - push-in through a crowd: from a wide shot of a dinner party, a dance floor or a bar straight to the face of one subject, ×2.8 over 3.2 s
  - closing-in push: slowly toward two people on steps or a bench, low camera, ×2 over 3.9 s
  - going inside: the camera follows people through a shop door or into a building entrance, ×1.9 with acceleration
  - through spaces: from the street through a balcony or a window into a room to the subject, ×6 over 5 s in one move, roll on the entry
  - reveal pull-out: back from the subject, revealing the stage, the crowd or the emptiness around, ×0.2–0.3 over 3–4 s
  - into the dark: in a dark room past furniture to a face that starts talking
status: footage
fallback: "code — a digital zoom-in on a 4K/wide shot (up to ×1.6–2, no parallax) + destabilize(profile='float', amp=0.15 %, roll=1°) for liveliness; pull-out — outpaint the edges; passing through spaces — only a cut between two moves on a dark object, or generation (with consent); search the source footage: long smooth shots with growing scale and nonrigid 0.15–0.3"
params:
  push: ×1.9–2.8 over 2–4 s (≈×1.014–1.05/frame @25 fps); passing through spaces — up to ×6 over 5 s
  pull: ×0.22–0.32 over 2.9–3.9 s
  ease: linear or inQuad (acceleration, half the distance at 0.6–0.7 of the time); at the end — a soft stop of 0.3–0.5 s
  float: drift 0.06–0.3 % of the frame, roll ±1–4°, no high-frequency shake
  height: chest level or lower (a low camera toward seated people), eye level on the close-up
  subject: centered across the width, head in the upper third; final shot size — face 30–50 % of frame height
  duration: 2–5 s of movement + hold; the whole shot is often 3–8 s
when: entering a scene and introducing the subject, "singling out" one person from a crowd, closing in before an important line, rising tension under the build, revealing the scale with a pull-out at the end; passing through spaces — intros and links between locations; 1–3 times per video
avoid: fast cutting (a shot shorter than 2 s — the move doesn't read); a shaky source passed off as a stabilizer shot; a digital imitation on 1080p with a zoom-in beyond ×1.5 (mushy image); an empty frame with no target for the movement; sharp jerks — that is already handheld
sfx: a quiet rising pad or room tone, the subject's voice getting louder as the camera approaches; when passing through a window — a change of acoustics (street → room)
genres: {drama: signature, epic: allowed, calm: allowed, teaser: allowed, travel: allowed, fashion: allowed, motivation: allowed, product: allowed, ugc: allowed, explainer: allowed, fanedit: allowed}
