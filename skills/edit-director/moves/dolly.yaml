id: dolly.in
family: dolly
group: camera
level: A
aliases: [dolly in, push in, dolly shot, camera push-in, dolly push-in, physical push-in, dolly out, pull back, camera pull-out]
what: the camera physically travels toward the subject (or away from them) steadily and slowly — the face grows faster than the background, the perspective changes; a push-in draws attention inward to the subject, a pull-out reveals where they are and who they are with
frames: |
  1. Start: a wide or medium shot, the subject centered (motion center x 0.45–0.53), the camera already moving or starting off without a jerk.
  2. Push-in: the scale grows steadily (almost linearly in 7 of 8) — slow at 0.35–0.85 % per frame @25 fps (×1.09–1.24 per second,
     adding up to ×1.26–1.5 over 1–4.5 s), energetic at 1.7–1.8 % per frame (×1.5–2.8 over 1–2.4 s, sometimes an S-curve).
     The face grows noticeably faster than the background: the log growth of the face is 1.17–2.1 times that of the background — a sign of perspective;
     nearby objects pass along the edges, the background "lags behind".
  3. Landing: medium → close-up (face from ≈15–20 % to 35–45 % of frame height), the motion center on the face in the upper third
     (y 0.17–0.33); the camera stops smoothly or the shot is cut while still moving.
  4. Pull-out — the same in reverse: ×0.7 over 4.8 s (−0.3 % per frame) or ×0.28 over 6 s (−0.8 %), the face shrinks
     faster than the background, neighbors, a car, a crowd enter the frame — revealing the context.
  5. With the subject approaching: the person walks toward the camera while it travels toward them — face ×8 over 1.5–3 s, background only ×1.2–2.4;
     ending on a close-up with a title or a flash (2 of 8).
variants:
  - slow push-in on a subject who is talking or smoking, 0.35–0.85 % per frame, 1–4.5 s (2 of 8)
  - energetic push-in on a group or a couple in a music video, 1.7–1.8 % per frame, 1–2.4 s (2 of 8)
  - reveal pull-out — from the face to the car and the street, from the podium to the whole row of people, 4.8–6 s (2 of 8)
  - converging push-in — the subject walks out of smoke or out of a crowd toward the camera, ending on a close-up and a flash or a title (2 of 8)
status: footage
fallback: 'on a flat background a push-in is indistinguishable from a zoom — zoom.slow or zoom.in from 4K by track(face); for perspective — hybrid "2.5D": subject mask (hf_remove_background), fill in the background behind it, the subject scales k≈1.3–1.6 times faster than the background in log terms; a reveal pull-out beyond ×1.5 — outpaint the edges or search for a wide shot of the same scene; no suitable shot — generation with consent'
params:
  rate_slow: 0.35–0.85 % of scale per frame @25 fps (×1.09–1.24 per second) — tension, monologue
  rate_fast: 1.7–2.5 % per frame (×1.5–2.8 over 1–2.4 s) — music video, energy
  pull_rate: −0.3…−0.85 % per frame (×0.7 over 4.8 s … ×0.28 over 6 s)
  duration: 1–6 s (25–150 frames @25 fps); a slow push-in — from 2 s, otherwise it doesn't read
  ease: linear in the middle (7 of 8), soft start and stop of 0.3–0.5 s each; S-curve for the energetic one
  perspective: k = log(face growth) / log(background growth) 1.15–2.2 (zoom ≈1.0; subject walking toward the camera — 2.4 and above)
  nonrigid: 0.17–0.39 by ed_motion (with a long focal length and a flat background it can be <0.1 — check k)
  center: on the face, y 0.17–0.33 for a single subject; 0.4–0.6 for a group or a couple
  landing: face 35–45 % of frame height (close-up) after the push-in; pull-out — until the context comes in
  jitter: ≤0.6 % (rails, slider, stabilizer); up to 0.85 % from a car
when: push-in — rising tension, realization, an important line, "looking inside" the subject, attention to a detail; slow under a long note or a pause, energetic — on entering the chorus or the drop; a product on a slider. Pull-out — revealing the circumstances, loneliness, consequences, the end of a video or a scene. No more than 2–3 slow push-ins in a row; alternate with ordinary static shots
avoid: hand shake where a smooth move is needed; a push-in on a flat background when depth is exactly what you need (reads as a zoom); a slow push-in shorter than 1.5 s in fast cutting; focus drifting off the face during the move; a ×2+ digital crop from 1080p instead of a real push-in
sfx: slow push-in — a drone or a riser building with the move, silence around the voice; energetic — a whoosh on the start and a hit on the landing on the beat; pull-out — the background opens up (louder ambience, reverb), a reverse swell over the last 0.5 s
