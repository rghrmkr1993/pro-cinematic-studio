  Flat scene or no shot: transform(scale=[1, S], center=track(face), t=[t0, t0+D], ease='linear'), S=1.1–1.5 over 2–4 s
  (≡ zoom.slow). Perspective push-in from a static shot: parallax_push(subject=mask('hf_remove_background'), bg=inpaint,
  s_subject=[1, S], s_bg=[1, S**(1/k)], k=1.4, t, ease='linear') — new primitive.
  Reveal pull-out: transform(scale=[S, 1]) from 4K, with S>1.5 — outpaint the edges; landing an energetic push-in on the beat:
  + sfx('whoosh', at=t0) + sfx('impact', at=t0+D).
