id: dolly.crash
family: dolly
group: camera
level: B
aliases: [sharp physical push-in, fast push-in, snap push-in, rush-in, camera lunge to the face, wide-angle lunge push-in]
what: the camera with a wide-angle lens physically lunges at the face in a fraction of a second — the face grows from a wide shot to an extreme close-up and is distorted by perspective, while the background barely grows; often it springs right back, like a hit on the rhythm
frames: |
  1. Start: a medium shot of the subject in the center (face ≈10–15 % of frame height), a wide lens, a deep background
     with recognizable objects (rows of cars, walls, windows).
  2. Lunge: within ≈6–10 frames @25 fps (0.25–0.4 s) the camera comes almost right up to the face — the face grows
     to 60–90 % of frame height (×4–7), the nose and eyes get bigger than the ears and chin (wide-angle barrel
     distortion), while the background behind the head grows only ×1.3–1.8 and shifts — clear parallax.
     Motion blur at the edges, the face in the center relatively sharp.
  3. Hold at the face 0.3–1 s: the subject talks, sings, pulls faces right into the lens.
  4. Snap back: an equally sharp pull-out back to the medium shot within 6–10 frames — or a cut on the extreme close-up.
     The "lunge — hold — snap back" cycle can repeat 2–4 times on the beats.
variants:
  - lunge and snap back: in and out on the rhythm of lines or beats, 2–4 cycles
  - single lunge landing on an extreme close-up: cut at the moment of maximum closeness
  - lunge-through: the camera shoots past the subject or into an object — a transition (see trans.hidden_cut)
status: footage
fallback: code imitation — zoom.crash (digital zoom-in) + wide-angle distortion building to the peak (lens_distort k1 0 → −0.15…−0.25 centered on the face), + parallax (the subject mask scales ×4–6, the background only ×1.3–1.6; this is hybrid, the head itself covers the holes behind the head); the honest option — find a shot in the source footage where the operator with a phone or a stabilizer sharply brings the camera up to the face; generation — with consent
params:
  scale_subject: face ×3–7 (from 10–15 % to 60–90 % of frame height)
  scale_background: ×1.2–1.8 — 2–4 times less than the face (a sign of physical movement)
  duration: lunge 6–10 frames @25 fps (0.25–0.4 s), snap back the same; hold 0.3–1 s
  ease: inOutCubic with a fast speed peak; landing without a slow tail
  lens: 14–24 mm equivalent; distortion at the peak k1 ≈ −0.15…−0.25 (barrel)
  motion_blur: at the frame edges, strength by speed; the center — the face — sharp
  cycles: 1–4 lunge-and-snap-back cycles, each on a beat or a line
  center: on the face (track(face)), deviation ≤ 10 % of the frame
when: a punchline, a shout, a hard-hitting line of the track or a line to camera; a comedic reaction; entering the drop; rhythmic lunges on the downbeats in a music video; no more than once every 8 bars (a series of cycles counts as once)
avoid: a long lens (no parallax or distortion — it is just a zoom); the face near the frame edge; a calm tone; several series in a row; an imitation on a shot where the background is flat and close (the parallax won't sell)
sfx: a whoosh on the lunge peaking at the moment of maximum closeness, an impact or a bass hit on the landing; snap back — reverse_whoosh; the voice on the extreme close-up — closer and louder (proximity)
genres: {viral: signature, fanedit: allowed, phonk: allowed, ugc: allowed, clips: allowed, teaser: allowed, sport: allowed, motivation: allowed, calm: forbidden}
detect: |
  ed_motion: ZOOM-IN ×2–4 over 0.25–0.4 s with high nonrigid (> 0.3 — the scale is uneven across the frame) and
  conf "low (local motion/parallax dominates)"; often immediately a mirrored ZOOM-OUT of the same length.
  Own check: the scale in the face area (face bbox track) grows 2–4 times more than the background scale at the edges;
  barrel distortion grows on the face (the center bulges more than the periphery).
  Differs from zoom.crash: with a zoom, face and background grow equally, nonrigid < 0.15, the perspective doesn't change.
  From dolly.in / a slow push-in: the speed peak is 10+ times higher, the lunge is shorter than 0.5 s.
engine: |
  footage: search by the detect signature.
  hybrid imitation: mask(method='mediapipe_person', feather=6) →
    transform(subject, scale=[1, 5], center=track(face), t=[t0, t0+0.32], ease='inOutCubic')
    + transform(background, scale=[1, 1.4], center=track(face), t=[t0, t0+0.32], ease='inOutCubic')
    + lens_distort(k1=[0, -0.2], center=track(face), t=[t0, t0+0.32])
    + blur(kind='zoom', amount∝speed, center=track(face))
  snap back — mirrored after 0.3–1 s; + sfx('whoosh', at=t0, align='attack') + sfx('impact', at=t0+0.32).
gen_hint: extremely fast physical push-in, the camera with a wide-angle lens rushes physically toward <subject>'s face in a split second, from a medium shot to an extreme close-up with strong wide-angle distortion, background shifts with parallax, then snaps back, music video energy
commands: ["crash dolly onto the face on the shout in #2", "camera lunge to the face and back on every beat of the chorus", "sharp physical push-in with distortion on the punchline"]
related: [zoom.crash, zoom.in_out, lens.fisheye, dolly.zoom, trans.hidden_cut]
evidence: {examples: 1, sources: 1, measured: "the only example in the section was viewed at 10 moments of the animation (scripted frame capture blocked by browser permissions): medium shot → extreme close-up of the face and back, repeated 2–3 times, the background grows noticeably less than the face; durations and scales are approximate (≈) estimates from frames and practice", confidence: low}
