detect: |
  ed_motion: a single ZOOM-IN (or OUT) of 1–6 s, near-linear (sometimes S), peak ≤×1.03/frame, jitter ≤0.6 %, nonrigid 0.17–0.39
  (in 7 of 8). The decisive own check is perspective: growth of the face box versus the background scale from LK points outside the body —
  k = log(face)/log(background) 1.15–2.2 for a dolly (1.17–2.12 in the examples), ≈1.0 for a zoom; k ≥2.4 — the subject is also walking toward the camera.
  With a long focal length and a flat background nonrigid can be <0.1 (0.088 in one example), but k is still >1.15 (1.55).
  Differences: zoom.in and zoom.slow — k≈1, nonrigid <0.15; dolly.crash — a ×2–4 lunge over 0.25–0.4 s with barrel distortion; dolly.zoom —
