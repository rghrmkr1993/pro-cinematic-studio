id: dolly.double
family: dolly
group: camera
level: B
aliases: [double dolly, gliding subject, subject on the dolly, floating subject, float shot, carried without walking, subject glide]
what: the subject stands or sits on the same dolly as the camera and "floats" through space without walking — their shot size and position in the frame don't change while the street, corridor or crowd is carried away behind; a feeling that the subject is carried by fate, a thought or the music
frames: |
  1. Frame: a medium shot or a close-up, the subject dead center (x ≈ 0.5), often looking straight into the camera or slightly
     past it; a wide-angle lens, a deep background — a street, a corridor with lamps, a park, a train car, a night road.
  2. Movement 2–6 s: the camera and the subject travel together — the subject fills the same 25–60 % of frame height, the head doesn't
     bob to the rhythm of steps, the shoulders are still; meanwhile the background flows: recedes (shrinks) or advances,
     streetlights, doors and passers-by go past along the frame edges with parallax.
  3. The subject can act meanwhile — talk, sing, turn the head, hold an object, sit at a table
     or on a chair — but the torso is "glued" to the frame. Sometimes the background is additionally stretched or
     compressed by a zoom (combined with a dolly zoom), sometimes smeared by speed.
  4. End — a cut, or the subject "steps off" the dolly (starts walking, the frame starts to sway).
variants:
  - classic walk-through: the subject looks into the camera, the street or corridor background drifts away behind, 3–6 s
  - seated: the subject sits at a table or on a chair while a park, a square or a room moves around them
  - couple or group: two or three people float side by side, looking the same way — a shared moment
  - high-speed: the background smeared into streaks, lights stretch (camera and subject on a car, scooter, motorcycle)
  - with background stretch: a simultaneous zoom in and out — the background "breathes", the subject keeps the same shot size
  - symmetrical corridor: ceiling lamps and doors pass evenly along the edges, the subject in the center
status: footage
fallback: a casual setup — a phone on a stabilizer or a selfie stick in front of the face, the subject rides a scooter, skateboard, bicycle, sits in a chair or on a dolly (look in the source footage for shots where the face is stable and the background flows); hybrid — a subject mask from a static shot over a moving plate (pass-through, drive plate) with perspective matching and moving light on the face; generation — with the user's consent
params:
  subject_size: 25–60 % of frame height (close-up to medium), change per frame ≤ ±5 %
  subject_pos: center x 0.45–0.55, eyes on the upper third; head jitter ≤ 0.5 % of frame height (no 1.5–2.2 Hz walking bob)
  bg_flow: background 0.3–2 % of frame width per frame @25 fps; background scale ×0.7–0.85 (receding) or ×1.2–1.6 (advancing) per shot
  duration: 2–6 s (50–150 frames @25 fps), typically 4 s
  lens: wide, 18–35 mm equivalent — stronger background parallax
  speed: walking pace 0.5–1.5 m/s for "floating"; high-speed variant 3–10 m/s with background motion blur
  zoom_combo: optional ×1.2–1.8 change of background scale by zoom while the subject's shot size stays constant
  light: the light travels with the subject (the face evenly lit), the background has passing light sources
when: a moment of decision or realization, "the subject is carried along" — toward fate, into battle, toward a loved one; a walk to the stage; a monologue or a verse addressed to the camera; a shift into another state (a dream, a trance, falling in love); on a long note, on the build before the drop; 1 per video, at most 2
avoid: visible walking bob (the effect is lost — it is just a regular walk); a flat or plain background (no sense of movement); fast cutting — it needs 2+ s; a mask imitation without matching light and perspective (the subject looks "pasted on"); a comedic context, unless a mock-solemn absurdity is intended
sfx: street ambience, stretched and muffled as if under water; a low drone or reverse swell for the whole pass; the subject's voice closer and drier than the background; on the way out — a hit or an abrupt return of the sound
genres: {drama: signature, epic: allowed, motivation: allowed, teaser: allowed, fanedit: allowed, fashion: allowed, viral: allowed, ugc: allowed, sport: allowed, clips: allowed}
detect: |
  ed_motion: a long ZOOM-OUT (background recedes) or ZOOM-IN (background advances) over 2–6 s with nonrigid > 0.3 — motion
  with parallax, while the frame center (the subject) is almost static: own check — the face track or the subject bbox changes
  size ≤ 5 % and position ≤ 2 % over the whole shot, vertical head oscillations without a 1.5–2.2 Hz peak.
  The flow around the subject is radial (diverging from or converging to the center), and inside the subject mask ≈0.
  Differs from track.lead (the camera leads a walking subject): there the walking bob of the head and shoulders and the changing leg pose are visible.
  From dolly zoom: there the background perspective changes at a constant shot size, but both the camera and the subject stand still — the background doesn't
  move away "with passers-by". From time.hyperlapse: no time acceleration. From a mask over a plate: the light on the face changes
  together with the background.
engine: |
  footage: search by the detect signature (stable face_track + radial background flow).
  hybrid: mask(method='mediapipe_person', feather=4) from a static shot of the subject → composite([bg=plate(drive|walk, dir='away'),
          subject], blend='normal') + transform(subject, scale=[1, 1], shift=micro_drift(0.002)) + light_wrap(0.3)
          + relight(subject, from=bg, strength=0.4);
  stabilize(lock=track(face), strength=1.0) on a "selfie stabilizer on a scooter" shot — removes the residual bob;
  optionally transform(bg, scale=[1, 1.4], ease='linear') to stretch the background;
  + sfx('swell', at=t0) + duck(ambience, lowpass=1200).
