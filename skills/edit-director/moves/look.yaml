id: look.photo_prints
family: look
group: aesthetics
level: B
aliases: [photo montage, photo slideshow, photo dump, photo prints, stack of photographs, photo stack, contact sheet, photos in video, still photo insert]
what: still photos are inserted into the video as physical prints — with a white border, a tilt and a shadow they drop into a stack, flash by as a slideshow at half a second each, lie as newspaper clippings; live video and photos alternate, giving a sense of memory, an archive or a photo shoot
frames: |
  1. Medium: the photo is shown as an object — a white border of 3–6 % of the side (an instant photo has a bottom border
     of ≈15–20 %), a tilt of ±2–10°, a soft shadow, sometimes a paper texture; the background — black, a table, a carpet or
     the continuing video. Less often the photo fills the whole frame, but with grain and a vignette.
  2. Presentation (pick one):
     - stack: prints fall one on top of another every 0.2–0.5 s, each with a new tilt, the stack grows;
     - slideshow: a series of poses from one photo shoot or street shots, 3–12 frames @25 fps (0.12–0.5 s) each,
       in the same spot in the frame — almost stop-motion animation;
     - diptych: two vertical photos side by side on black, the pair changes every 0.4–1 s;
     - hand in frame: prints are laid down, flipped through, held in front of the camera;
     - clippings: a newspaper page or a wall of frames, a slow zoom-in or slide ×1.05–1.15, a change
       every 1.5–3 s.
  3. Link with the video: the live shot is "photographed" — a white flash of 1–3 frames + a shutter click, the frame shrinks
     into a print (time.freeze) and drops onto the stack; or the next live scene grows out of a print.
  4. Color: two poles — a warm film color print with soft contrast and grain, or a harsh
     black-and-white street photo with deep black and a vignette; on night shots — a direct flash:
     an overexposed face, a hard shadow, a dark background.
variants:
  - a stack of prints on black or on a table, random tilts of ±10°
  - a fast photo slideshow of poses (a studio on a white background, street portraits) — a stop-motion effect
  - a diptych and triptych of vertical photos on black
  - print over live video: the photo sticks to the frame and slides away
  - newspaper clippings and a wall of frames with a slow zoom-in — documentary presentation
  - frame turns into a photo: a flash, the shutter, shrinking into a card with a white border
  - black-and-white street photos with a vignette, 0.5–1 s each, like a film contact print
  - head-on night flash: a party, a couple, a kitchen — overexposed faces, a black background
status: code
fallback: the photos come from the user's source material (photos, screenshots) or are cut out as freeze frames from their video at the peaks of action and emotion; newspaper clippings and old photos — only the user's own material or generation with consent (no third-party brands or real publications); code can only partially imitate a direct flash on existing night video (exposure boost in the center + a vignette)
params:
  border: 3–6 % of the photo's short side, an instant photo has a bottom border of 15–20 %; color 240–250 (warm white)
  rotation: ±2–10° at random, each next print gets the opposite sign
  shadow: offset 0.5–1.5 % of the frame, blur 1–2 %, opacity 0.4–0.6
  print_size: 35–70 % of the frame height; on a black background — centered
  hold: slideshow 3–12 frames @25 fps (0.12–0.5 s) per photo, typically 6 frames; stack — a new photo every 5–12 frames; clippings — 1.5–3 s
  drop: a print enters over 3–6 frames (scale 1.15→1, shift 5–15 % of the frame, ease outCubic) with a slight bounce
  flash: 1–3 frames of white before the "shot", curve outExpo
  ken_burns: ×1.05–1.15 over 2–3 s, linear, on documents and frames
  look_color: warm film (black lifted to 15–25, saturation −10–20 %, grain 0.03–0.06) or b/w (contrast +20–40 %, grain 0.05–0.1, vignette 0.3–0.5)
when: a memory and a flashback, "behind the scenes of a photo shoot", the summary of a trip or an event (a photo dump at the end), introducing the characters through photos, a documentary backstory (clippings), a fashion video intro; a fast slideshow — on a subdivided rhythm or hi-hats, a stack — on every beat; 1–2 blocks of 2–6 s per video
avoid: photos of different formats and colors without unified processing (looks like a random gallery); prints that are too small on a vertical screen; a long slideshow slower than 1 s per photo without movement (it sags); other people's newspapers, logos and recognizable publications; text on clippings that matters but the viewer will not have time to read
sfx: a shutter click and a film-advance sound on each photo; a paper slap when a print drops onto the stack; the rustle of cards being flipped through; on a flash — the "pssh" of the flash charging
genres: {fashion: signature, travel: signature, ugc: signature, fanedit: allowed, viral: allowed, drama: allowed, calm: allowed, teaser: allowed, clips: allowed, motivation: allowed, explainer: allowed, product: allowed}
detect: |
  ed_motion: holds of 3–12 frames in a row separated by cuts (slideshow) — many short segments without
  internal motion; for a stack — short ZOOM-OUTs/shifts of 3–6 frames at the entry of each print, then a hold;
  on clippings — a long slow ZOOM-IN ≤×1.15 with nonrigid ≈0 (a flat document).
  Visually: white borders and tilted rectangles with a shadow, paper edges, a black or table background; the same
  person repeated in different poses within a static frame; white flashes of 1–3 frames before a freeze frame.
  Own check: the share of frames where almost all pixels are unchanged (diff < 0.6) is > 60 % with frequent cuts;
  inside the frame — a quadrilateral with a bright (240+) border and a shadow.
  Unlike time.freeze: there it is a single stop of the live shot; here a series of photos as objects. Unlike step
  printing: there the motion goes in jerks within one shot, here — different photos. Unlike a collage: there the layers
  are cut out along the contour, while here they are rectangular prints.
