id: look.maximalism
family: look
group: aesthetics
level: B
aliases: [maximalism, more is more, overloaded frame, dense collage, bright design chaos]
what: a look of excess — the frame is densely packed with objects, patterns, layers and frames in a saturated multicolor palette; not a single empty spot, everything repeats and overlaps
frames: |
  1. Density: 1.5–3 times more edges and fine details than usual (edge-pixel share 0.10–0.23 at 256 px
     versus 0.02–0.08 in calm shots; "busy" 16×16 blocks — 42–79 % versus 12–22 %).
  2. Color: 4–6 hues, each covering >5 % of the frame (hue entropy up to 2.8 bits out of 3.6), saturated pixels 50–76 %;
     or one dense "everything red" palette with patterns and textures of a single color.
  3. Layers: a frame within a frame, photos with white borders and tape over the image, a grid of 4–6 panels of different sizes,
     a cut-out object multiplied ×5–15 over a collage of city photos, stickers and signs.
  4. Movement and rhythm: in a collage the layers change every 1–3 frames (100–300 ms), panels update out of sync;
     in the "set decoration" variant — a smooth camera through an overloaded space (lights, decorations, petals in the air).
  5. Texture: patterns and ornament in the background, an outlined "wobbly" drawing, oversaturated pop art with waves of color.
variants:
  - panel mosaic: 4–6 windows of different sizes, the content updates in turn
  - photo over photo: pictures in white frames with tape, tilted by ±5–10°, nested inside each other, cuts every 1–3 frames
  - multiplied product: a cut-out object ×5–15 over a dense collage of photos and signs
  - overloaded set: neon interiors, garlands, hundreds of lights, petals in the air, one dense palette
  - pop-art silhouette: a head silhouette filled with motley video against acid-colored waves
  - dense hand-drawn animation: bright fills, frames, stars, lettering, a wobbly outline @10 fps
status: hybrid
fallback: mosaic, frames, duplication, patterned backgrounds and color — in code; cut-out objects — a mask (remove_background); dense sets and hand-drawn animation — search in the source footage or generation with consent
params:
  density_target: edge-pixel share ≥0.10 (256 px), "busy" blocks ≥40 %
  palette: 4–6 hues with >5 % of the area each; saturation ×1.3–1.5, vibrance +0.3, contrast ×1.1–1.2
  mosaic: 4–6 panels, gap 0.5–1.5 % of the width, panels update with an offset of 0.1–0.3 s
  photo_frames: 2–4 nested pictures, white border 3–5 % of the side, rotation ±5–10°, shadow, strips of tape
  duplicates: 5–15 copies of the object, scale ×0.4–1.2, slight rotation ±15°
  layer_swap: a layer change every 1–3 frames (40–120 ms @25) on downbeats, in runs of 0.5–1.5 s
  background: a patterned tile or a collage of 10–30 cutouts, step 8–15 % of the width
  duration: an episode of 1.5–6 s; the whole video — only in fashion or a music video
when: fashion and product release drops, music videos, intros and "loud" parts, mood boards, showcasing a collection or a product range; the drop and the chorus — peak density; a pause between dense episodes is mandatory
avoid: explainer and calm videos; scenes that need one clear object or readable text; a brand's luxury minimalism; episodes longer than 6–8 s in a row (the viewer gets tired); small details in vertical format on a phone
sfx: rich layered sound — short percussive "clicks" on every layer change, rustling paper and tape for the frames, bright synths; at the peak — a dense stack of hits
genres: {fashion: signature, viral: allowed, fanedit: allowed, product: allowed, teaser: allowed, clips: allowed, calm: forbidden, explainer: forbidden}
detect: |
  Edge-pixel share (Canny at 256 px) ≥0.10 and "busy" 16×16 blocks (σ>25) ≥40 %; ≥4 hues with >5 % of the area each
  or hue entropy ≥1.8 bits; saturated pixels ≥50 %. Straight inner panel borders and nested rectangles
  with white borders; repeated copies of one object (template matching ≥5 matches).
  ed_motion: in collages — cuts every 1–3 frames; in sets — smooth movement without notable events.
  Unlike look.weirdcore: there it is low quality and creepy characters; here it is high quality and deliberately "rich".
  Unlike gfx.collage and layout.split_screen: those are layout techniques, here it is overall excess across the whole frame.
engine: |
  look(preset='maximalism', t=[t0, t1]) =
    color(params={sat: 1.4, vibrance: 0.3, contrast: 1.15})
    + split_screen(layout='mosaic', panels=5, gutter=0.01, stagger=0.2)
    | composite(layers=[pattern_bg(tile=icons|photos, step=0.1),
                        duplicates(target=mask('hf_remove_background'), n=8, scale=[0.4, 1.2], rotate=15),
                        photo_frame(border=0.04, rotate=[-8, 8], shadow=True, tape=True, nest=3)])
    + cut(every=2 frames, t=[tk, tk+1.0], on='beats')
