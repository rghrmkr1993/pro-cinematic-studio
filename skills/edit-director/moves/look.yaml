id: look.vfx_breakdown
family: look
group: aesthetics
level: B
aliases: [layer breakdown, VFX breakdown, breakdown, before and after, before after, how it was shot, making-of, backstage, behind the scenes, work-in-progress aesthetic]
what: the same shot is shown at different stages — the raw plate (a green or blue background, tracking markers, wires), a gray "clay" render, a wireframe, rough animation, the final — and the stages are switched with a wipe, a dissolve or a cut; the viewer sees how the shot was made
frames: |
  1. Base shot: the composition is the same in all layers — the camera is static (3 of 8 examples) or each layer
     repeats the same camera move (a push-in, a pan); only the "material" of the image changes.
  2. Order: from the final to the source — "reveal the trick" (4 of 8) or from raw to final — "assembly"
     (3 of 8); sometimes a compilation video of several shots.
  3. Layer change: a vertical boundary crosses the frame in 0.6–1.4 s (usually left to right, without a shadow
     or motion blur); a dissolve of 0.5–0.7 s; a straight cut on a frame; a gradual "assembly" — elements
     appear one after another, 10→90 % in ≈4.5 s; a "half and half" freeze frame (final on the left,
     source on the right) holds from 1.3 s.
  4. Each layer holds 0.6–3 s — enough to read the difference; the whole breakdown is 2–16 s.
  Recognizable layers: the chroma key covers 9–58 % of the frame (green) or ≈50 % (blue), the markers are small
  crosses of 1–2 % of the frame; a gray render with no color — 62–92 % of the frame neutral gray; a wireframe and bounding
  boxes over the gray; white dummies of rough animation; the final with color and light.
variants:
  - wipe through the layers — final → blue background with markers → gray geometry → animation dummies → final
  - dissolve into the on-set footage — the final flows into a shot with a rig, people and a green background
  - half and half — the wipe stops in the middle, the finished shot on the left, the source on the right
  - assembly — set pieces, the object, smoke, light and color are added one by one to a clean plate
  - straight cut — the same shot, straight to the chroma key
  - compilation — several shots, diagonal wipes between the stages, inserts of previz and raw footage
status: footage
fallback: two or more versions of the same shot are needed (source and result) — look for "before/after" pairs in the user's material (the original photo and the generated video, log footage and the color grade, a shot without and with the effect); if there is no pair — a code stylization (subject mask + green background and cross markers, b/w "clay", outline wireframe) only as making-of style decoration, without passing it off as the real process; otherwise — generation of "on-set footage" from the final shot with the user's consent
params:
  layers: 2–5 layers, typically 3 (source → intermediate → final)
  order: reveal (final → source) | build (source → final)
  switch: line wipe 0.6–1.4 s (15–35 frames @25 fps), linear, left to right | dissolve 0.5–0.7 s | cut | half and half with a hold of 1.3–3 s
  hold: 0.6–3 s per layer (15–75 frames), typically 1.5 s
  total: 2–16 s, a single breakdown — 4–8 s
  framing: layers match within ±1 % of the frame; with camera movement — the same trajectory in all layers
  chroma_look: green ≈#00b140 or blue ≈#1e2bd0, markers — crosses of 1–2 % of the frame in a 3×4 grid
  clay_look: saturation < 7 %, soft shadows, contrast −20 %
  wire_look: 1 px outlines over the gray layer
when: the ending of a video — "and here is how it was made"; a hook "look what this came from"; demonstrating an AI generation or an effect (original photo → result); tutorial and product videos about the process; a portfolio; one breakdown per video or the whole video in this format
avoid: the layers do not match in framing — the comparison falls apart; switching more often than once every 0.5 s — the difference cannot be read; more than 5 layers without rhythm; a narrative video where revealing the trick breaks the impression; an "on-set" stylization passed off as the real process
sfx: on every layer change — a short whoosh or click; on the gray and wireframe layers — quiet "technical" ticks or interface beeps; on the return to the final — a hit or the end of a riser; the music does not stop
genres: {explainer: signature, viral: allowed, product: allowed, ugc: allowed, teaser: allowed, epic: allowed, fanedit: allowed}
detect: |
  The same shot repeats with a different "material": large areas of saturated green
  (H 40–85, S>110 in OpenCV) or blue (H 110–135) on 9–58 % of the frame, neutral gray zones
  (S<18) whose share jumps from ~15 % to 60–92 %, cross markers, untextured dummies.
  Transitions — a vertical boundary that crosses the frame width in 0.6–1.4 s, or a dissolve
  of 0.5–0.7 s; ed_motion: "no significant global motion" or the same camera move repeats
  after each layer change; few cuts, the angle does not change.
  Unlike trans.wipe: there the wipe changes the scene, here — the stage of the same shot.
  Unlike mask.bg_replace: there the background changes for good as a technique, here the stages are shown.
engine: |
  breakdown_stack(layers=[final, raw, clay], order='reveal'|'build', switch='wipe_line'|'dissolve'|'cut'|'split_hold',
                  dur=0.8, hold=1.5, dir='lr')
  = sequence: hold(layer_i, 1.5) + transition(kind='wipe(line)', dur=0.8, params={angle: 90, dir: 'lr', edge: 'hard'})
  Half and half: split_screen(layout='vertical_50', left=final, right=raw, t=[t0, t0+2]).
  Layer stylization (if there are no real ones): stage_look(kind='chroma', color='#00b140', markers='cross 3x4')
  = mask(method='mediapipe_person') + composite(background = solid green + crosses);
  stage_look(kind='clay') = color(params={desaturate: 1, contrast: 0.8}) + smoothing;
  stage_look(kind='wire') = outlines (Canny) over clay.
  + sfx('whoosh', at=each change, align='attack')
gen_hint: behind-the-scenes view of the same shot as <final shot description>, identical framing, the actor performs on a green screen stage with tracking markers, rigging and crew visible, flat studio lighting
commands: ["at the end show how it was made: final → source with a wipe", "before/after: the original photo and the finished video half and half", "layer breakdown on #6 — source, gray, final", "make a making-of transition: from the finished shot into the green background"]
related: [trans.wipe, trans.dissolve, mask.bg_replace, layout.split_screen, look.news]
evidence: {examples: 8, sources: 8, measured: "layer change with a line wipe in 0.6–1.4 s (0.6, 0.6, 0.8, 1.05, 1.4 s), with a dissolve in 0.64 s, with a straight cut; element assembly 10→90 % in 4.5 s; half and half holds from 1.3 s; chroma key 9–58 % of the frame, blue background up to 52 %, gray render 62–92 % of the frame; breakdowns last 2.2–15.8 s; the camera is static in 3 of 8, in the rest the layers repeat one move", confidence: medium}
