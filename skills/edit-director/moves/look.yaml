id: look.dreamcore
family: look
group: aesthetics
level: C
aliases: [dreamcore, dream look, like in a dream, dreamlike, dream aesthetic, nostalgic dream]
what: a "waking dream" look — a faded, soft pastel image of empty familiar places with one impossible detail (sky behind a door, a pool inside a building, a portal), almost no movement
frames: |
  1. The frame is static or drifts slowly: drift ≤0.3 % of the frame per frame or a zoom-in of ×1.05–1.2 over 3–9 s; shots are long, from 2–3 s.
  2. A "faded" tone: the black point is lifted (p2 25–65 of 255 in 6 of 7 static examples), highlights are muted
     (p98 130–200), the whole p98−p2 range is compressed to 70–170 — no deep shadows, no bright highlights.
  3. Softness: detail like a cheap digital or film camera (high frequencies noticeably cut, edges
     blurred by ≈1–2 px at 1080p), sometimes a light glow in bright areas and darkened corners (corners ×0.3–0.75 in brightness in 6 of 13).
  4. Color: one common tint over everything — pink-magenta (a* of neutrals up to +16), teal (a* −13),
     vanilla (b* +9…+16) or blue-violet (b* −15); against it — clean "childlike" accents: sky blue, grass green.
  5. Content: an empty familiar place (a house on a hill, a room, a suburban street at sunset, a pool, a corridor) and one impossible
     detail; no people or one small figure. In the moving examples the dream "switches": a room dissolves into a misty field
     over 2–3 s around a still subject, the subject walks into a wardrobe and comes out in a stadium, a funnel tunnel leads into a white flash.
variants:
  - pastel suburb: houses, roads and cars under a pink or lilac sky, lifted shadows
  - sky inside: the doors and windows of an empty room open onto a blue sky with clouds
  - a lonely house on a green hill under an even blue sky, simplified "toy" geometry
  - water halls: tiled pools and flooded corridors, inflatable rings, warm lamps or a teal wash
  - space switch: the set around the subject dissolves into another place, entering a wardrobe or a door leads into another world
  - dream portal: a funnel of colored stripes with white light in the center, a figure walks inside
  - theatrical set: flat saturated colors, a figure frozen in a strange pose
status: code
fallback: the look (tone, softness, tint) — in code on any shot; motifs (sky in a doorway, water halls, a house on a hill, portals) — search for empty shots in the source footage or generation with consent; dissolving the set around the subject — hybrid (subject mask + background change)
params:
  black_lift: p2 25–65 of 255 (typ. 40) — black point lifted by 0.10–0.25
  highlight: p98 130–200 (typ. 180) — white point 0.55–0.8
  range: p98−p2 70–170 (typ. 120); contrast ×0.7–0.85
  softness: Gaussian 1–2 px @1080p or resample to 40–60 % and back; glow of bright areas radius 1–2 % of the width, threshold 0.75
  tint: pastel tint on neutrals 0.15–0.3 — pink (a* +10…+16), teal (a* −10…−13), vanilla (b* +9…+16), lilac (b* −15)
  saturation: base ×0.8–1.0; keep the sky and grass accents (HSV-S 140–150)
  vignette: 0.2–0.4 (corners ×0.45–0.75)
  grain: weak, noise ≤3 levels; optionally a color "bleed" of 0.5–1 % of the width at the frame edge
  motion: static or drift ≤0.3 %/frame; zoom-in ×1.05–1.2 over 3–9 s (75–225 frames), linear
  pacing: shots of 2–8 s, dissolve transitions of 0.5–1.5 s or through doors and openings
when: intros and outros, memories, dreams, "sad" and lo-fi edits, childhood nostalgia, mood boards; on the calm parts of the track and in pauses. Works as a through-look for an entire short video or as a separate 5–15 s episode
avoid: fast editing, sport, energetic drops (the look kills the energy); products where exact color matters; busy frames with a crowd — emptiness is needed; harsh digital artifacts and hard contrast (break the softness)
sfx: muffled music (low-pass filter, long reverb), detune and tape "wobble", a music box or a lullaby, the hum of an empty room, echo, water drops; the transition into another space — a soft swell
genres: {calm: allowed, fanedit: allowed, fashion: allowed, teaser: allowed, drama: allowed, viral: allowed, travel: allowed, sport: forbidden, phonk: forbidden, explainer: forbidden}
detect: |
  Tone: p2 ≥25 and p98 ≤200 (compressed range 70–170) at normal exposure; low noise (≤3 levels);
  neutrals tinted |a*| ≥9 or |b*| ≥9; softness — the high-frequency share at 256 px is lower than in the sharp shots of the same video.
  ed_motion: no events or a slow ZOOM ≤×1.2 over 3+ s; cuts are rare (shots ≥2 s).
  Content: empty interiors and exteriors, sky and clouds in unexpected places, pools, lonely houses, no people.
  Unlike scene.liminal: there it is realistic empty transitional spaces with neutral light and no impossible details.
  Unlike look.weirdcore: there it is disturbing graphics, text, eyes, a low-quality collage. Unlike look.vhs: no scan lines, tape noise or timecode.
engine: |
  look(preset='dreamcore', t=[t0, t1]) =
    color(params={black: 0.16, white: 0.75, contrast: 0.8, sat: 0.9, tint: {hue: 'pink'|'teal'|'vanilla'|'lilac', amount: 0.2}})
    + blur(kind='gaussian', amount=1.5)            # px @1080p; or resample(scale=0.5) down and back up
    + glow(threshold=0.75, radius=0.015)
    + vignette(amount=0.3) + grain(amount=0.02, size=1)
    + transform(scale=[1, 1.08], t=[t0, t1], ease='linear')
  Transitions: transition('dissolve', dur=1.0) or a match through a doorway; dissolving the background around the subject —
  mask('mediapipe_person') + composite(background A → background B, dissolve 2–3 s).
gen_hint: dreamlike nostalgic scene of an empty <place>, soft hazy low-contrast image with lifted blacks and a pastel <pink|teal> tint, one impossible detail such as <a doorway opening onto blue sky with clouds>, no people, still camera slowly drifting forward, early-2000s camera softness
commands: ["dreamcore look on the intro", "make it dreamlike: fade and soften #2–#4", "pastel pink dreamcore on the memories", "generate an empty room with sky behind the door for a transition"]
related: [scene.liminal, look.weirdcore, scene.magic_realism, look.vhs, look.psychedelic, light.halation, trans.portal]
