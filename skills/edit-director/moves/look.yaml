id: look.cheesy
family: look
group: aesthetics
level: B
aliases: [deliberately cheap look, cringe aesthetic, so bad it's good, cheap chroma key, trash style, low-budget aesthetic, cheesy]
what: a deliberately "cheap" look for irony — an obvious chroma key with a pasted-in background, stickers and stock inserts with no disguise, on-the-nose transitions and out-of-the-box effects, the subject in the center plays straight to camera
frames: |
  1. The subject stands in the center of a static frame and addresses the camera; the shot is flat, with no artistic lighting.
  2. The background is obviously fake (5 of 9): a sky with clouds, a "fairground ride", a tunnel of light streaks, nature — brighter and
     more saturated than the subject (HSV-S 130–190), sometimes the background itself rotates behind the still subject (38° in 1.7 s) or zooms in ×1.7 over 2 s.
     A fringe around the figure, different lighting on the subject and the background — deliberately not hidden.
  3. Stickers and inserts: a hat picture with a white rectangle around it, drawn emoji and hearts "float up" in a stream,
     a stock explosion over the whole frame, a stock clip with a watermark, a picture-in-picture shrinks and multiplies into a grid.
  4. On-the-nose editing: sharp zoom-ins ×1.5–2.6 over 0.4–0.8 s with a flash, cuts through a white frame, a pause on a "funny" face;
     the effects are not synced with the subject's movement.
  5. The quality is not hidden: sources of 350–800 px, softness, 10–20 fps in some of the examples, simple fonts and frames.
variants:
  - chroma-key sky: the subject against a blue sky, the background rotates or moves, butterflies or clouds fly on top
  - fake ride: a couple against a pasted-in amusement ride, handheld rocking, a deliberately lagging background
  - car-tuning tunnel: the subject at the wheel, high-speed light streaks behind
  - stickers on top: pictures and hats with a white background stuck onto heads, not cut out
  - stock insert: an explosion or an animal from stock, the watermark left in as a joke
  - social media effects: a stream of emoji reactions, the frame shrinks into a grid of "windows" on a black background
  - phone collage: old phones and screens at angles, crude animation
status: hybrid
fallback: chroma key — mask('mediapipe_person' | 'hf_remove_background') + a background from the library (sky, tunnel, ride) without feathering; stickers, emoji, flashes, zoom-ins — in code; stock explosions and animals — search your own library or generation with consent
params:
  keying: mask without feathering (feather 0–2 px), a fringe of 1–3 px is allowed; the background is 20–40 % more saturated than the subject in HSV-S
  background_motion: rotation of 15–40° over 1–2 s or a zoom-in of ×1.5–1.8 over 2 s, independent of the subject; or a 1–2 s loop
  stickers: 1–4 pictures per frame, not cut out (white rectangle), tracked to the face or head, scale 20–35 % of the width
  emoji_burst: 20–60 icons, rising for 1–2 s, size 2–5 % of the width
  stock_insert: 0.5–1.2 s of a full-screen insert (explosion, animal), a cut with no transition
  punch: zoom-in ×1.5–2.6 over 0.4–0.8 s (10–20 frames), ease outCubic; a 1-frame flash on the cut
  pip_grid: the frame shrinks to 30–40 % and multiplies 2–8 times on a black background over 0.5–1 s
  frame_rate: 10–20 fps (step_print hold 2) — optional
  quality: can be resampled to 360–480 px on the long side
when: humor, memes, brand self-irony, parodies of 2000s ads, UGC sketches, announcements with a wink, "and it is all true" endings; short 1–3 s blocks or the style of an entire joke video
avoid: serious, premium and emotional videos; when the viewer might mistake the "bad" for unprofessionalism — the irony must be clear (big gestures, absurd text); watermarks of other people's stock sites in a commercial video (use your own material); random "badness" without a system
sfx: on-the-nose stock sounds — a "whoosh", an explosion, a laugh track, a ba-dum-tss, an "aaah" choir, squeakers, system sounds; music — a cheap synthesizer, a corporate track, lounge
genres: {viral: signature, ugc: allowed, fanedit: allowed, clips: allowed, product: allowed, epic: forbidden, drama: forbidden, calm: forbidden, fashion: forbidden, teaser: forbidden, motivation: forbidden}
detect: |
  A figure in the center with a static camera while the background moves independently (ed_motion: ROTATE/ZOOM on the background with a still subject;
  the person mask does not follow the global motion); background/subject saturation difference >20 %; a hard mask edge.
  Overlaid rectangles with a white background (stickers), many small identical icons, full-screen stock inserts
  of 0.5–1.2 s, watermark-like semi-transparent text; flash/black frames on cuts; low resolution and 10–20 fps.
  Unlike look.weirdcore: there it is creepiness and anxiety, here — irony and comedy. Unlike look.maximalism: there it is high-quality excess,
  here — deliberately poor means. Unlike scene.magic_realism: there everything is shot carefully and seriously.
engine: |
  look(preset='cheesy', t=[t0, t1]) =
    mask('mediapipe_person', feather=1) → composite(layers=[bg_library('sky'|'tunnel'|'ride'), person], blend='normal')
    + transform(target='bg', rotate=[0, 30], scale=[1, 1.6], t=[t0, t0+2], ease='linear')
    + sticker(image, target=track(face), size=0.28, keep_bg=True)
    + particles(kind='emoji', count=40, rise=1.5)
    + transform(scale=[1, 2], t=[tk, tk+0.5], ease='outCubic') + flash(color='white', dur=0.04)
    + split_screen(layout='pip_grid', n=6, t=[tm, tm+0.8])
  Optional: resample(scale=0.5) + step_print(hold=2) for a "cheap" source.
gen_hint: intentionally cheesy low-budget video of <person> talking straight to camera in front of an obvious fake green-screen <blue sky with clouds | light-speed tunnel> background that spins behind them, clip-art stickers, flat even lighting, early-2000s TV commercial style
commands: ["make a cringe insert: chroma key with a sky and a spinning background", "stick a hat picture on the subject's head, no cutout", "a stream of emoji and a stock explosion on the punchline", "a video in the style of a cheap 2000s commercial"]
related: [look.weirdcore, look.maximalism, mask.bg_replace, zoom.punch, cut.flash, layout.split_screen, address.direct]
evidence: {examples: 9, sources: 9, measured: "fake background in 5 of 9 (background HSV-S 130–190); background rotation 38.6° in 1.7 s and a zoom-in ×1.74 in 2 s with a still subject; zoom-ins ×2.56 in 0.8 s with flashes; high-frequency share 0.07–0.25 in 8 of 9; 10 fps in 1 of 9; static camera in 3 of 9", confidence: medium}
