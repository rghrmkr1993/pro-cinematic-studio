id: look.retro_graphics
family: look
group: aesthetics
level: B
aliases: [retro graphics, 80s and 90s graphics, teleshopping, early 3D graphics, vector graphics on black, retro TV graphics, old CGI, TV ident]
what: on-screen graphics "straight from 80s–90s TV" — teleshopping plates with a price and a phone number, early 3D graphics with chrome and a checkered floor, glowing vector lines on black — over a 4:3 tape image
frames: |
  1. Medium: 4:3 (6 of 9 sources exactly 1.33:1), resolution 220–600 px, tape-like color softness — the sharpness of the color
     channels is 0.31–0.79 of the luma one (7 of 9), color drifts by up to 1.6 % of the width; 5.5–25 fps.
  2. Teleshopping plate: a bright blue background (b* −48, saturation 175) fills the whole frame or the lower third; the host's video —
     in a window ≈50 % of the width at the top left; on the right a price in huge yellow digits (15–20 % of the height) with a shadow; below it a phone number
     in bold white italics, small lines of terms, a red round badge; a diagonal ribbon in the corner; the block is static for the whole shot.
  3. Early 3D graphics: a metal can or a logo spins above a checkered floor in lilac light (b* −27),
     the texture "jumps" to a new one every 5–10 frames; extruded gold letters fly around a planet in a starry sky;
     a faceless mannequin looks at the sky, a flare flash for 1–2 frames.
  4. Vector graphics: thin glowing lines on black (88–96 % of the frame is dark), the glow raises brightness next to the line
     by 35–47 levels; blue, orange, white; step numbers, diagrams, a road to the horizon.
  5. Amateur video framed as a TV show: everyday mishaps on a 4:3 home camera, low resolution.
