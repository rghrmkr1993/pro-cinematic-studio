id: look.vhs
family: look
group: aesthetics
level: B
aliases: [vhs, tape, videotape, camcorder, home video, shot on tape, retro video, camcorder look, 4:3 retro]
what: the look of an old videotape and an amateur camcorder — a 4:3 frame, a soft image with smeared and shifted color, noise, interference bands and on-screen display text; a "found footage" feel
frames: |
  1. Format: 4:3 — black side bars of 11–12 % of the width each on a 16:9 frame (in 3 of 9), sometimes the image is shifted sideways.
  2. The image is soft, especially the color: color-channel sharpness 0.57–0.75 of the luma one (≥1.0 for film and digital),
     the color "slides" right by 0.3–0.4 % of the width; horizontal detail is lower than vertical.
  3. Color and tone: either oversaturated warm (HSV-S 117–174, a* +19…+23, b* +30…+37) or dim night footage;
     shadows crush (25–42 % of the frame in black in night recordings), auto-exposure "breathes" — brightness jumps of up to 12–20 levels per frame.
  4. Interference: rainbow horizontal bands for 2–5 frames, torn blocks and line shifts on cuts, the frame "breaks" into noise
     and comes out into the next shot; the bottom of the frame sometimes jitters in a band (the head-switching zone).
  5. Amateur shooting: a handheld camera (shake 0.6–4.5 % of the frame), a wide-angle "fisheye" adapter, the operator's face close up,
     night with the built-in light; on-screen display text or a date in a monospaced font at the bottom.
variants:
  - skate camcorder: fisheye, oversaturated warm color, rainbow interference bands, text at the bottom
  - night recording: a face in the light of the built-in lamp, everything around is black, noise and exposure pumping
  - party in 4:3: side bars, torn blocks on cuts, warm sodium light
  - CRT screen: the image inside a rounded, bulging TV screen, a wipe transition between "channels"
  - webcam and early phone: a dim image with coarse noise, a striped texture, a low frame rate
  - warm 90s music video: 4:3, strong saturation, a drop to black on a tape "dropout"
status: code
fallback: real tape sources are not needed — the look is built in code; the CRT screen needs a shot with a TV set (search) or generation; the "fisheye" — lens_distort in code
params:
  aspect: 4:3 inside 16:9 (12.5 % bars on each side) or a 4:3 crop for vertical
  resolution: resample to 320–480 lines (≈480×360) and back; horizontal blur σ 1.5–2.5 px @720
  chroma: color blur ×2–3 of the luma blur horizontally; color shift to the right of 0.3–0.5 % of the width (2–4 px @720)
  saturation: warm variant ×1.3–1.5 with boosted red; night ×0.6–0.8
  tone: black point 0–10 (at night — 25–40 % of the frame crushed), white point 230–245 with soft clipping
  noise: luma noise σ 3–6 levels, chroma noise σ 4–8; refreshed every frame
  scanlines: dark lines on every other line, depth 5–15 % (more visible on a CRT)
  tracking: a rainbow band of 5–15 % of the frame height, 2–5 frames, once every 3–8 s or on a cut
  head_switch: a jittering band of 2–4 % at the bottom of the frame, line shift 1–3 % of the width
  exposure_pumping: brightness fluctuations of ±5–8 % with a period of 0.5–2 s (night recordings)
  osd: date/time or info text, monospaced font, 4–6 % of the frame height, white with a shadow, bottom corner
  handheld: shake 0.6–4.5 % of the frame; optionally lens_distort k +0.2…+0.35
when: memories, "found footage", childhood and the 90s, behind the scenes and vlogs with retro irony, skate and street, music videos for lo-fi, hip-hop, synthwave; as a through-look or 2–6 s inserts; transitions between scenes through interference
avoid: product close-ups where detail and exact color matter; small text (it blurs); too frequent interference (every 1–2 s — irritating); combining with a perfectly stable cinema camera and camera cranes — looks fake
sfx: tape hiss, the hum and click of the tape mechanism on entry, a "wavy" sound (wow and flutter ±0.5–1 %), muffled high frequencies (cut above 8–10 kHz); on interference — crackle and a short sound dropout
genres: {fanedit: allowed, ugc: allowed, clips: allowed, teaser: allowed, viral: allowed, phonk: allowed, drama: allowed, sport: allowed, travel: allowed, product: forbidden}
detect: |
  Color-channel sharpness ≤0.75 of the luma one with moderate noise; color shift relative to luma of 0.3–0.5 % of the width along X;
  black side bars of 11–13 % (4:3); horizontal rainbow bands for 2–5 frames; brightness flicker p90 ≥12 levels
  with a static camera; monospaced text in the bottom corner.
  ed_motion: shake jitter 0.6–4.5 %, bars left/right ≈0.11–0.12, flash frames on interference cuts.
  Unlike look.film: film has sharp color grain (color sharpness ≥1.0 of the luma), sprocket holes, scratches and flashes
  at the end of the reel. Unlike fx.glitch: there the failure is an accent effect, here — a constant texture of the medium.
engine: |
  look(preset='vhs', t=[t0, t1]) =
    letterbox(ratio='4:3', t) | reframe(aspect='4:3', target=track(person))
    + resample(height=360, method='bilinear') + blur(kind='directional', amount=2, angle=0)
    + chroma_blur(x=3, y=1) + chroma_shift(px=0.004, axis='x')
    + color(params={sat: 1.35, red: +0.08, black: 4, white: 240, soft_clip: True})
    + grain(amount=0.04, size=1, chroma=0.05) + scanlines(depth=0.1, every=2)
    + head_switch(height=0.03, shift=0.02) + tracking_band(height=0.1, dur=0.12, every=[3, 8])
    + osd_text(content='date/time', font='mono', size=0.05, pos='bottom-left')
