id: look.film
family: look
group: aesthetics
level: B
aliases: [film, 8mm, 16mm, super 8, film look, film strip, old movies, film grain, film burn]
what: an old motion-picture film look — color grain, flicker and frame jitter, the edges of the film gate with sprocket holes, dust and scratches, flashes and burns at the start and end of the video
frames: |
  1. Film gate: a black border with rounded corners is visible at the edge, on the left — the bright window of a sprocket hole; the image
     area is offset (a black margin on the right of 6–7 % of the width in 3 of 9).
  2. The grain is colored and sharp: the sharpness of the color channels is 1.0–2.0 of the luma one (≤0.75 for tape); in black-and-white
     old movies the grain and scratches are strong (noise ≈10 levels).
  3. The frame "lives": brightness flickers by 0.6–3.8 levels from frame to frame (p90 4.7–10); the frame floats by 0.4–1.7 % (gate
     weave), more with handheld footage; sometimes the frame "slips" vertically and the frame line is visible.
  4. Color: warm amber (b* +6…+24) or cold teal (b* −14), lifted shadows (p2 20–40) or deep black;
     red halation around bright sources.
