id: look.video_game
family: look
group: aesthetics
level: C
aliases: [game aesthetic, gaming aesthetic, like in a game, gameplay look, third-person view, game HUD, game interface, NPC style]
what: the video looks like a game — a third-person camera behind the subject's back, a clean "rendered" image, interface icons in the corners, editing with "teleports" between locations
frames: |
  1. Third-person shot: the subject with their back to the camera, on the left third or in the center (center x ≈ 0.33–0.5), taking up
     ≈ 45–75 % of the frame height (waist-up or full-length), the horizon high (≈ 0.25–0.35 H); the camera smoothly keeps its distance,
     without handheld shake (jitter 0.1–0.7 %), when running — a wide angle with blurred colored frame edges.
  2. "Render": the image is clean and sharp, no grain, smooth sky gradients, saturated colors, a soft glow around
     light sources; wide shots — static "miniature" views from above at an angle with strong foreground blur, 2.8–4.4 s.
  3. Interface: icons in the corners — an emblem or a minimap at the bottom left (≈ 15 % of the width), small icons at the top right
     (≈ 3–5 % of the width), margin from the edge 2–4 %; sometimes a colored "thermal" palette over the whole frame as a vision mode.
  4. "Fast travel" editing: the same angle from behind, locations change with a cut every 0.8–1.65 s
     (20–41 frames @25) — salt flats, mountains, a market, a jungle.
  5. Cutscene: a spectacular particle explosion (shards, sparks) → 3–9 frames of black or a flash → a new scene;
     a character intro — the camera flies backward through foliage ×0.06 over 2.7 s (ease-out) and reveals the subject with a creature behind them.
variants:
  - third-person view: a follow behind the subject's back, the subject on a third of the frame
  - teleport montage: the same pose and angle, different locations every 0.8–1.65 s
  - miniature level: a static view from above at an angle onto a "toy" world with a blurred foreground
  - vision mode: a false-color palette (thermal camera or depth map) plus interface icons
  - cutscene with particles: shards and sparks, a drop to black, a new level
  - stylized character: a 3D character waves at the camera, the camera flies back and reveals the world
status: code
fallback: the look (sharpness, saturation, glow, miniature blur) and the interface — in code on any shot; the third-person shot has to be filmed (search the source footage for follows behind the subject's back — track.follow) or cropped from a wide shot from behind; 3D characters, worlds and cutscenes — generation with consent
params:
  framing: subject from behind, center x 0.33–0.5, figure height 45–75 % H, horizon 0.25–0.35 H; reframe on the person track
  camera: a smooth follow, stabilization down to jitter ≤ 0.5 %; the frame turns after the subject with a 3–6-frame delay
  render: sharpness +0.5–1 (unsharp 1 px), "cleanliness" — noise reduction/bilateral filter, saturation ×1.15–1.3, local contrast +15–25 %, glow threshold 0.8 radius 1.5 % H, grain 0
  miniature: for wide shots — blur at the top and bottom (tilt-shift) 2–4 % H, saturation ×1.3
  hud: an icon or a minimap at the bottom left 10–15 % W, small icons at the top right 3–5 % W, a health or quest bar at the top left; margin 2–4 %; white with a shadow or a thin outline
  teleport_montage: shots of 0.8–1.65 s, the same angle and pose, cut on a beat
  cutscene_gap: black for 3–9 frames (0.12–0.36 s) or a 1–2-frame flash between scenes
  false_color: a "thermal camera" palette over the whole frame or within the subject mask
when: gamer and fan edits, the viral "life as a game" format (everyday quests with an interface), a travel montage of "teleports" across locations, sports highlights with "stats", teasers; on the drop — switching "into the game"
avoid: interface over faces and important action; small icons that do not read on a phone (< 3 % of the width); copying the interface of a specific game and other people's logos; mixing the "rendered" look with grainy film in one scene
sfx: interface sounds (a menu click, a quest "ping", a pickup chime), chiptune or a synth arpeggio, a teleport sound on the cut, a "loading" sound on black
genres: {fanedit: signature, viral: allowed, teaser: allowed, phonk: allowed, clips: allowed, sport: allowed, travel: allowed, ugc: allowed, explainer: allowed, motivation: allowed}
detect: |
  Angle: a person with their back to the camera on a third or in the center, 45–75 % of the height, holding their place in the frame while the background moves
  (ed_motion: a zoom-in or a background shift with a still subject, nonrigid 0.2–0.5); static icons in the frame corners
  (overlay-mask: pixels that stay unchanged while the scene moves, in the corners); no grain and very smooth gradients;
  cuts every 0.8–1.65 s with the same subject position (teleport montage); a false-color palette.
  Differences: a regular follow from behind (track.follow) — a live image with grain and shake, no interface;
  3D animation (anim.cgi_3d) — a cartoon without a game camera; a miniature (scene.diorama) — no third-person subject.
engine: |
  look(preset='video_game') = color(sat=1.2, local_contrast=0.2) + denoise(strength=0.5) + sharpen(amount=0.7, radius=1)
    + glow(threshold=0.8, radius=0.015*H)
  reframe(aspect, target=track(person), anchor=[0.33, 0.62]) + stabilize(strength=0.8)
  hud_overlay(items=['minimap'|'emblem' @bottom_left size=0.12*W, 'icons' @top_right size=0.04*W, 'quest_text' @top_left],
              margin=0.03, style='white_shadow')
  teleport montage: cut(at=beats) in shots of 0.8–1.6 s + sfx('click'|'whoosh', at=cut)
  cutscene: fade(to='black', dur=0.2) + flash(dur=0.08)
gen_hint: third-person video game gameplay view, the character seen from behind on the left third of the frame walking through a vast open world, clean sharp game render, saturated colors, soft bloom, minimal HUD icons in the corners, smooth game camera following at a fixed distance
commands: ["make it like a game: view from behind and an interface", "teleport montage across locations on #3–#8 in rhythm", "add interface icons and a quest at the top left", "game render look on the travel cut"]
related: [track.follow, anim.cgi_3d, scene.diorama, fx.thermal, glitch.datamosh, layout.windowbox]
