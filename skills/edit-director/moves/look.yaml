id: look.weirdcore
family: look
group: aesthetics
level: C
aliases: [weirdcore, cursed images, creepy absurdity, uncanny collage, lo-fi surreal]
what: deliberately "amateur" creepy absurdity — faces and bodies cut out with hard edges on a pastel or acid-flashing background, early 3D graphics, googly eyes, low resolution and a choppy frame rate
frames: |
  1. A "bad" source: sources of 335–750 px, soft and over-compressed (high-frequency share 0.03–0.2 at 256 px in 12 of 14),
     choppy animation ≈7.5–14 fps (10 of 14), a static camera (9 of 14 — no global motion).
  2. Collage composition: figures, heads and eyes cut out without feathering are laid over a foreign background; copies are rotated
     by 90–180°, a face is transplanted onto an animal or an object, a head out of proportion to the body.
  3. Background: a pastel pink↔light-blue gradient, a "clip-art" landscape (a rainbow, hills, clouds) or a tile of identical icons;
     in animated ones — recolored every 90–280 ms (2–7 frames @25) cycling through 4–8 colors.
  4. Loud color: median chroma 19–48 in 9 of 14 (8–15 in regular video), 25–70 % of the area in saturated colors;
     a bright frame (mean brightness 130–230 in 8 of 14).
  5. "Wrong" characters: early 3D graphics with crude textures, clay, cartoon googly eyes on
     realistic faces, teardrop tears; a frozen emotion. Inserts: rainbow interference bands, a rainbow bar over the eyes,
     text with a rainbow shimmer across the letters.
  6. Sometimes the frame "corrupts" over 2–3 s: the color goes red, only outlines remain, vertical interference bands on top.
variants:
  - cutout collage: old black-and-white portraits, multiplied and flipped, rainbow interference bands
  - early 3D graphics: crude flowers and people with faces, a pink sky, noisy textures
  - face transplant: human eyes and mouth on an animal's muzzle, over a tile of icons, the background flashes
  - googly eyes: cartoon eyes over a face or an object (a mountain, a flower)
  - clay: grotesque faces, transformations (a person sprouts stems and turns into a flower)
  - corruption: a cute character degrades into red outline noise over 2–3 s
status: hybrid
fallback: degradation, flashing background, interference bands, rainbow text — in code; cutouts — a mask (mediapipe or remove_background); 3D and clay characters, googly eyes on faces — generation with consent; faces of real people — only with their consent
params:
  degrade: downscale to 240–480 px on the long side and back (bilinear), compression at quality 15–35; resulting high-frequency share 0.03–0.2
  frame_rate: 7.5–14 fps (step_print hold 2–3 @25) — ≈
  cutout: mask without feathering (feather 0–1 px), scale ×0.6–1.6 of natural size, rotations of 90/180°, 2–4 copies
  background: "gradient pink #f6d4f2 ↔ light blue #d8f1fb, clip art or a tile of icons (step 8–12 % of the width)"
  bg_flash: background color change every 2–7 frames (90–280 ms), a palette of 4–8 saturated colors
  saturation: chroma ×1.3–1.8, frame brightness 130–230 of 255
  glitch_bands: 2–5 horizontal rainbow bands 3–8 % of the frame high, flickering frame by frame
  googly_eyes: diameter 12–20 % of the face width, pupils pointing in different directions, attached to track(face)
  rainbow_text: hue shimmer across the letters, shift of 30–60° per frame; bold font with a white outline
  corruption: a 2–3 s ramp — saturation into red, outlines (edge), vertical noise bands
  shot_length: 1–5 s
when: memes and absurd humor, "cringe" inserts, ironic intros and endings, music videos for hyperpop and electronic music, "what did I just see" reactions; as short 1–3 s inserts or as the style of an entire short video
avoid: premium, luxury and serious videos; product shots that need a clean image; long episodes (irritating); transplanting real people's faces without consent; background flashing with a large brightness difference more often than 3 times per second (photosensitivity)
sfx: overloaded and "broken" sounds — pitch up and down, bitcrush, a looped 50–200 ms snippet, old system sounds, beeps, children's laughter with reverb; sudden silence at the moment of "corruption"
genres: {viral: allowed, fanedit: allowed, ugc: allowed, clips: allowed, teaser: allowed, calm: forbidden, explainer: forbidden, epic: forbidden, motivation: forbidden}
detect: |
  Low detail (high-frequency share ≤0.2 at 256 px) with high colorfulness (median chroma ≥19, saturated ≥25 %);
  hard cutout edges without feathering; a gradient or repeating-tile background; frame-by-frame background color changes
  (the hue of the frame border jumps >20° every 2–7 frames); 7–14 fps; ed_motion — no global motion or roll jerks of 2–10°.
  Visually: disproportionate or transplanted faces, googly eyes, early 3D graphics, rainbow text and bands.
  Unlike look.dreamcore: there it is empty, soft and calm, without characters. Unlike look.maximalism: there it is dense but
  high-quality, well-thought-out design. Unlike look.cheesy: there it is deliberately "cheap" footage for humor, not a creepy collage.
engine: |
  look(preset='weirdcore', t=[t0, t1]) =
    resample(scale=0.35, method='bilinear') + jpeg_artifacts(quality=25)
    + step_print(hold=2)
    + mask('hf_remove_background', feather=0) → composite(layers=[gradient(['#f6d4f2', '#d8f1fb']) | tile(icons, step=0.1), cutout×1–3 (rotate 0/90/180)])
    + bg_flash(colors=palette8, every=[2, 7])
    + sticker(kind='googly_eyes', target=track(face), size=0.16)
    + scanline_bands(colors='rainbow', count=3, height=0.05, flicker=True)
    + text(content, style='wordart_rainbow', anim='hue_cycle(45/fr)')
  Corruption ramp: color(sat→red, t=[tk, tk+2.5]) + edge(amount→1) + noise_bands(vertical).
