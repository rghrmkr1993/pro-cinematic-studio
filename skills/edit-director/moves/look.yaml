id: look.drunk
family: look
group: aesthetics
level: B
aliases: [drunk look, intoxication, drunk effect, drunk cam, seeing double, double vision, the spins, swaying]
what: an intoxication look — the frame sways and floats unevenly, the edges are blurred and darkened, the image doubles, sometimes "blinks" to black
frames: |
  1. Entry: a normal frame "drifts away" over 0.5–1 s — roll, edge defocus and doubling build up (or right from an editing cut).
  2. Sway: uneven roll swings of 3–12° every 0.3–0.9 s (8–22 frames) with changes of direction, peak speed
     1–3°/frame; at the same time the frame shifts by 5–15 % horizontally/vertically and slowly "breathes" in scale
     (zoom-in ×1.15–1.6 over 0.9–2.8 s and back). On top — fine hand shake of 1.5–3 % of the frame (up to 7–8 % at p90).
  3. Vision: the center stays readable, toward the edges — radial blur (edge sharpness ×0.05–0.35 of the center),
     a vignette (edges ×0.5–0.8 in brightness) with a cold violet or greenish tint (edge b* 7–15 lower than the center).
     Doubling: a semi-transparent copy of the frame shifted horizontally by 2–4 % of the width, opacity ≈0.3–0.5.
  4. Blackouts: 1–3 dark frames in a row (40–200 ms) — a "blink"/passing out, 1–2 times per 5 s, often on a shot change.
  5. Exit: a cut to a sharp sober shot or a fade to black.
variants:
  - video-game drunk screen: strong radial blur at the edges, a colored fringe (green/violet), doubling
  - camera on the subject's body: the face is almost still in the frame, the world around sways and rotates
  - POV with blackouts: a subjective camera stumbles along, shots break off with short fades to black
  - soft defocus: everything slightly blurred, light flares and colored glints along the edge, neon
  - night ride: long exposure, lights streak around a sharp subject
  - numbness: an almost static dark frame, a warm yellow-green palette, slow movements
status: code
fallback: the strongest variant — footage from a camera mounted on the subject (search the source footage for "face static, background moving"); otherwise in code — stabilization on the face (track(face)) + background sway; generation with consent
params:
  roll: ±3–12° per swing (typ. 6°), swing 0.3–0.9 s (8–22 frames), direction alternates, irregular
  sway_shift: 5–15 % of the frame per swing; scale ×1.15–1.6 over 0.9–2.8 s and back
  jitter: 1.5–3 % of the frame median, peaks up to 7–8 %
  edge_blur: radial, inner radius 0.45 (fraction of the half-diagonal), edges ×0.05–0.35 in sharpness
  vignette: edges ×0.5–0.8 in brightness; edge tint b* −7…−15 (violet) or a* −3…−7 (green)
  double_vision: shift of 2–4 % of the width along X (≈), opacity 0.3–0.5; the shift can "converge and diverge" with a period of 1–2 s
  blackout: 1–5 frames (40–200 ms) of black, 1–2 times per 5 s
  grade: warm amber/sepia or neon red-magenta; saturation HSV-S 130–190; contrast no higher than normal
  duration: an episode of 2–6 s (50–150 frames)
when: an after-party scene, "losing control", a comedic "had one too many" moment, the subject's subjective POV, a transition into a memory blackout; on slow or slowed-down music and after the drop. One episode per scene; better shorter than longer
avoid: long episodes (make the viewer motion-sick); product, explainer and calm videos; shots with text and small details; combined with psychedelic color (mixes the meanings); ads with restrictions on alcohol themes
sfx: music and sound are muffled (low-pass filter 800–1500 Hz), pitch 5–15 % lower, distant voices, a heartbeat, ringing in the ears; on blackouts — a short sound dropout
genres: {drama: allowed, ugc: allowed, viral: allowed, clips: allowed, teaser: allowed, fanedit: allowed, calm: forbidden, explainer: forbidden, product: forbidden, sport: forbidden}
detect: |
  ed_motion: alternating ROTATE events of 3–12° lasting 0.15–0.9 s without cuts, shake jitter ≥1.5 % and x_dir_flips ≥2,
  ZOOM events ×1.15–1.6 over 0.9–2.8 s; black frames inside a scene (1–3 frames).
  Own checks: edge sharpness (r>0.85) relative to the center (r<0.45) ≤0.35 with normal edge exposure;
  edges darker than the center ×0.5–0.8 and colder (b* −7…−15); a side peak in the autocorrelation of the high-pass frame at dx 2–4 %
  of the width, dy≈0, holding for many frames in a row — doubling.
  Unlike a handheld camera: handheld has no doubling, blurred edges or blackouts. Unlike look.psychedelic: no color "chemistry",
  deformations or color shimmer. Unlike a body-mounted camera (rig): there the footage is clean without blur or doubling, the swaying is a side effect.
engine: |
  look(preset='drunk', intensity=2, t=[t0, t1]) =
    sway(rot=6, shift=0.08, scale=0.03, period=0.6, irregular=True, seed)          # uneven sway, swing 0.3–0.9 s
    + shake(amp=0.015, freq=2.5, axes='xy')
    + double_vision(offset=0.03, opacity=0.4, axis='x', oscillate=1.5)
    + blur(kind='radial', amount=0.6, center=[0.5, 0.5], inner_radius=0.45)
    + vignette(amount=0.35) + color(params={edge_tint_b: -10, warmth: +0.15})
    + fade(to='black', t=[tk, tk+0.12]) ×1–2 per episode
  The "camera on the body" variant: transform(center=track(face)) stabilizes the face, then rotate the background ±10° with a period of 1–2 s.
  Optional: speed(rate=0.8) and echo(trails=2, decay=0.4) on movement.
gen_hint: drunk point-of-view shot, camera sways and tilts unsteadily, blurry vignetted edges, double vision with a faint horizontally offset ghost image, dim warm bar lights, occasional blink to black
commands: ["drunk look on #3, light", "add double vision and sway to the after-party scene", "the world floats around the subject for 3 seconds, then a blink to black", "drunk effect on the POV shots"]
related: [look.psychedelic, handheld.shaky, rig.body_mount, time.echo_trail, lens.vignette, pov.first_person]
evidence: {examples: 9, sources: 5, measured: "roll 3–12° per swing of 0.15–0.9 s, alternating in 6 of 9; shake 1.5–3.1 % (p90 up to 8.3 %) in 4 of 9; edges ×0.05–0.34 in sharpness in 3 of 9; edges darker ×0.5–0.8 and colder (b* −7…−15) in 5 of 9; doubling ≈3.4 % of the width in 1 of 9 (visible by eye); blackouts of 1–3 frames in 1 of 9; 3 of 9 examples are video-game graphics", confidence: medium}
