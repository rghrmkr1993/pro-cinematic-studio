id: look.dystopian
family: look
group: aesthetics
level: B
aliases: [dystopia, dystopian look, grim future, the system, gray concrete with a red accent]
what: a dystopian look — a cold, almost colorless concrete-gray image with a single warm accent (fire, signal smoke), identical figures and masks; static "watching" wide shots alternate with handheld chaos
frames: |
  1. Base: almost monochrome — median chroma 4.5–18 (4.5–12 in live-action footage), cold neutrals (a* −2…−9, b* −2…+2),
     an overcast sky with no sun; the frame is dark (mean brightness 48–67 of 255), in overcast shots the highlights are cut off (p98 73–96) — no bright highlights.
  2. Accent: a single warm red-orange source (hue 7–36°) — a hand flare, fire, a lamp — 3–6 % of the frame area,
     the only saturated spot; the smoke from it is lit in the same color.
  3. Motifs: rows of identically dressed people in a tunnel, masks and hoods, a lone figure or silhouettes against the sky,
     concrete walls, ruins, bonfires, a night square seen from above.
  4. The camera works in two modes. "Surveillance": a static wide shot from above or below, no movement, 4–7 s.
     "Chaos": handheld shake of 2.7–3.4 % of the frame, crash zoom-ins ×4.9–5.2 over 3–14 frames, roll jerks of 15–66° in 0.1–0.4 s.
  5. Chaos editing: cuts every 3–6 frames (0.12–0.24 s) with white flashes; in "surveillance" — long shots.
variants:
  - cold concrete: a gray-teal base, tunnels and underpasses, people in identical uniforms
  - riot: silhouettes on a wall or against an overcast sky, red flare smoke, fire in the foreground
  - wasteland: dark amber and sepia (neutral b* +8…+14), ruins, bonfires, devastation
  - surveillance: a night square from above, tiny figures, cold light and warm pools of streetlights
status: code
fallback: the grade and color isolation — in code on any shot; motifs (uniformed crowds, masks, fire, flares) — search in the source footage or generation with consent
params:
  saturation: base ×0.25–0.5 (median chroma 4.5–18); keep the accent hues 0–40° at ×1.1–1.3
  accent_area: 2–6 % of the frame, one cluster of warm color
  cast: cold — a* −2…−9, b* −2…+2 on neutrals; the "wasteland" variant — b* +8…+14
  exposure: mean brightness 45–65 of 255; white point 0.3–0.6 in overcast scenes; shadows not crushed (≤10 % of the frame in black)
  grain: noise 0.5–5 levels (typ. 1.5)
  vignette: 0.2–0.4 (corners ×0.45–0.75)
  observe_mode: static, shot of 4–7 s (100–175 frames), angle from above or below
  chaos_mode: shake 2.5–3.5 % of the frame, crash ×5 over 3–14 frames, roll up to 20° in 0.1–0.4 s, cuts every 3–6 frames + a 1-frame flash
when: protest and resistance, control and surveillance, "the system versus the individual", social and manifesto videos, sci-fi teasers, edits to a dark track; "surveillance" in the intro and build, "chaos" on the drop
avoid: light, cheerful, travel and product videos with brand colors; next to real tragedies and disasters — inappropriate; chaos longer than 4–6 s in a row is tiring
sfx: a low drone, sirens, a megaphone with echo, crowd murmur, metallic hits, crackling fire; in "surveillance" — silence and footsteps
genres: {epic: allowed, drama: allowed, teaser: allowed, motivation: allowed, fanedit: allowed, phonk: allowed, calm: forbidden, product: forbidden, travel: forbidden}
detect: |
  Median chroma ≤18 and cold neutrals (a* ≤ −2 or b* ≤ 0) at a mean brightness of 45–70; one warm cluster
  (hue 0–40°, chroma >35) covering 2–6 %; in overcast shots p98 ≤100.
  ed_motion: alternating shots without events (static 4+ s) and shots with shake jitter ≥2.5 %, ZOOM-IN ×4–5 in ≤0.6 s,
  ROTATE 15–66° in ≤0.4 s, frequent cuts and flash frames.
  Visually: many people in identical clothes, masks, concrete, fire, smoke.
  Unlike a black-and-white look: the accent and the cold tint are kept. Unlike the blockbuster "teal and orange": there both color ranges are saturated.
engine: |
  look(preset='dystopian', t=[t0, t1]) =
    color(params={sat: 0.35, temp: -0.15, contrast: 0.9, black: 0.04, white: 0.5,
                  selective: {keep_hue: [0, 40], sat: 1.2}})
    + grain(amount=0.03, size=1) + vignette(amount=0.3)
  The "chaos" mode on the drop: shake(amp=0.03, freq=6, t) + transform(scale=[1, 5], t=[tk, tk+0.2], ease='outExpo')
  + cut every 3–6 frames + flash(color='white', dur=0.04); the "surveillance" mode: static wide shots of 4–7 s each.
