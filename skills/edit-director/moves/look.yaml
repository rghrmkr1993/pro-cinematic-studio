id: look.psychedelic
family: look
group: aesthetics
level: C
aliases: [psychedelia, trip, trippy look, trippy, psychedelic look, hallucination, altered perception, hallucination fx]
what: an "altered perception" look over any shot — an oversaturated split tone, "breathing" and floating surfaces, sway, trails behind movement and color cycling; dosed in levels 1–3
frames: |
  1. Entry (0.1–1 s): a flare "rush" — frame brightness +50–90 % within 1–3 frames, held for 0.5–1 s,
     or deformation and color shift build up from zero over 0.5–1 s (12–25 frames). Most often the entry is on a cut.
  2. The base for the whole episode: saturation above normal (HSV-S median ≈124/255, upper quartile 164–218),
     a split tone — violet-blue shadows, amber highlights (b* in the highlights +35…+64), the black point "sinks"
     (up to 20–70 % of the frame in deep shadow in night scenes), 3–6 % clipping in the highlights is allowed.
  3. Modulations on top of the base, with a period of 1.5–4 s, combined according to the level:
     - "breathing"/melting surfaces: local deformation of 0.3–1.5 % of the width per frame (strong liquify —
       up to 3 % at p90), the background flows, the face stays readable;
     - sway: roll ±2–6° with a return over 1.6–4 s; in strong examples a roll of 12–36° in 0.4–2.7 s;
     - a slow "creeping" zoom-in on the face ×1.04–1.5 over 1–3 s (×1.002–1.016 per frame), the background darkens;
     - trails: 2–4 semi-transparent copies behind a moving object;
     - color cycling: a smooth hue shift or a change of the background palette every 4–12 frames (150–1000° accumulated per episode);
     - exposure flicker: 1.5–3.7 brightness levels per frame, rare jumps of up to 8–12 levels.
  4. Exit: a hard cut to a normal shot (the before/after contrast is the point) or the effects fading out over 0.5–1 s.
variants:
  - warm neon: amber + magenta/blue, high contrast, glowing clipped highlights, more often at night
  - sickly: a green-teal shift (a* −13…−18), saturation below normal, flicker and a ragged frame rate
  - liquid background: a sharp subject in the foreground, the background behind them melts and flows
  - trails and prism: doubling and echo copies behind movement, prismatic halos around light sources
  - palette cycling: the background changes color every few frames, the subject is static
  - rainbow fringe: chromatic aberration growing toward the frame edges (clean center)
  - false color: the frame is recolored by brightness or depth into a "black—violet—orange—yellow" palette
  - light tunnel: radial colored streaks flying out of the center (slit-scan)
  - op art: a concentric line screen of thin lines over a portrait (a still frame or a title card)
  - collage: a cut-out "floating" head above light streaks, small copies around it
  - isolation: a slow zoom-in on the face, the background goes black, the pupils darken
status: code
fallback: the base look and the modulations — in code on any shot; a cut-out head, protecting the face from deformation — hybrid (mask); a light tunnel, a shimmering "glass" wall, animated arcs around the subject — generation with consent or search in the source footage
params:
  intensity: "1 — grade + aberration + light breathing; 2 — + sway, trails, color cycling; 3 — + liquify, flicker, ragged frame rate (typically 2)"
  saturation: ×1.3–1.8 relative to the source (typ. ×1.5); the "sickly" variant — ×0.5–0.8 and a* −12…−18
  split_tone: shadows hue 250–290°, highlights 20–40°, strength 0.25–0.45; contrast ×1.1–1.25; black point 0–10, white 230–255
  breathe_warp: amplitude 0.3–1.5 % of the width (typ. 0.6 %), wave scale 10–30 % of the frame, period 1.5–3 s; liquify — 1–3 %
  sway: roll ±2–6° (typ. 3°), shift ±2.5 %, scale ±3 %, period 1.6–4 s (40–100 frames); strong — 12–36° in 0.4–2.7 s
  creep_push: ×1.04–1.5 over 1–3 s (25–75 frames), linear
  echo: 2–4 copies, decay ≈0.4–0.6, only on moving areas
  hue_cycle: 60–200°/s smoothly or a step every 4–12 frames
  exposure: flicker ±3–10 % brightness; a flash rush of +50–90 % within 1–3 frames; no more than 3 large flashes per second
  chroma_ab: 0.8–1.5 % of the width in the corners, 0 in the center (radial)
  lens_distort: barrel k ≈ +0.15…+0.3 (optional, for wide-angle close-ups)
  frame_rate: optionally 10–16.7 fps (step-print, hold 2) — ≈, in 4 of 25 examples
  duration: an episode of 2–8 s (50–200 frames); the whole video — only in a stylized music video
when: a scene where "it kicks in", a dream or a hallucination, the subject's subjective view; the bridge or the drop of a music video; entering a flashback or a fantasy; a party, a festival, a city at night. Build it up — level 1 on the build, 2–3 on the drop. No more than one episode per 30–60 s unless the look is set for the whole video
avoid: product and explainer videos, text and numbers in the frame (deformation makes them hard to read); calm genres; long episodes without variation (causes motion sickness); strong face deformation (looks frightening); flashes more often than 3 per second with a large brightness difference (photosensitivity); ads with a ban on substance themes
sfx: on the entry — a reverse swell or a "suck-in"; under the episode — a low-pass filter and a long reverb on the music, a floating pitch (vibrato, tape slowdown), a pulse/heartbeat; on a palette change or a flash — a shimmer, a soft whoosh
genres: {fanedit: allowed, phonk: allowed, viral: allowed, drama: allowed, teaser: allowed, fashion: allowed, clips: allowed, calm: forbidden, explainer: forbidden, product: forbidden}
detect: |
  Signs (≥2 needed): HSV-S saturation median ≥130 or colourfulness ≥55 with a strong split tone
  (b* in the highlights ≥+35 and cold shadows) or a green shift a* ≤ −12; local deformation after subtracting
  global motion ≥0.5 % of the width per frame with global motion <0.3 % (surfaces "breathe");
  accumulated hue cycling ≥150° in ≤5 s without cuts; roll ≥10° in ≤1.5 s without a cut; a brightness jump
  of +50 % in ≤2 frames; R/B offset in the corners ≥0.7 % of the width with zero in the center; echo copies behind movement.
  ed_motion: ROTATE events of 6–36°, slow ZOOM-INs ×1.04–1.5 over 1–3 s, conf low/nonrigid >0.35 on
  deformation, flicker (flash/black frames) inside a shot.
  Unlike look.drunk: there it is horizontal doubling, defocus and sway without the color "chemistry".
  Unlike fx.glitch: no block artifacts or horizontal tears. Unlike look.vhs: no scan lines or tape noise.
  Unlike fx.kaleidoscope: no mirror symmetry.
engine: |
  look(preset='psychedelic', intensity=2, t=[t0, t1]) =
    color(params={sat: 1.5, contrast: 1.15, black: 4, white: 250,
                  split_tone: {shadows_hue: 270, highlights_hue: 32, amount: 0.35}})
    + chroma_ab(amount=0.01, radial=True)
    + warp(kind='breathe', amp=0.006, scale=0.2, period=2.0, mask_protect=mask('face'))        # level 1+
    + sway(rot=3, shift=0.02, scale=0.03, period=3.0, seed)                                       # level 2+
    + echo(trails=3, decay=0.5, only_moving=True)                                                  # level 2+
    + hue_cycle(rate=90, mode='smooth'|'step', step_every=8)                                       # level 2+
    + warp(kind='liquify', amp=0.02, scale=0.1, period=1.5) + exposure_flicker(amp=0.08, max_flashes_per_s=3)
    + step_print(hold=2)                                                                            # level 3
  Entry: flash(color='white', dur=0.08) followed by holding +60 % brightness for 0.5 s, or a ramp of intensity 0→N over 0.5–1 s.
  Optional: lens_distort(k=0.2), creep_push = transform(scale=[1, 1.15], t=[t0, t0+2], ease='linear').
  Motifs: gradient_map(palette='inferno', source='luma'|'depth'); line_screen(kind='concentric', pitch=0.006);
  prism(copies=3, offset=0.03, opacity=0.4); a cut-out head — mask('face') + composite over blurred light streaks.
