id: pov.mirror
family: pov
group: angle
level: B
aliases: [mirror POV, the mirror's view, camera as mirror, from behind the mirror, behind-the-mirror camera, get ready with me shot]
what: "the viewer sits behind the glass: someone getting ready or rehearsing meets the lens eye to eye, though in their world it is their own reflection"
frames: |
  1. (opt.) Lead-in: 0.5–1.5 s from behind the character, the back of the head against the mirror, then a cut to the reverse angle "from the mirror".
  2. Frame: the camera at eye level, strictly frontal, the character in the center (x 0.45–0.55). The face is 20–25 % of the frame height (medium
     shot or medium close-up), eyes at 30–40 % of the height, with headroom above. At the bottom, a strip of sink, shelf or countertop
     (10–30 % of the height) with jars and brushes; at the sides, the edges of a cabinet (up to 20 % of the width) or a dark rounded
     frame; behind, the room: a door, a wall, a coat rack, a lamp overhead.
  3. Action: looking into the lens but "at oneself", the eyes roam over one's own face, the hands at the hair and mouth for most of the shot:
     fixing the hair, checking the teeth, trying out facial expressions, giving oneself a pep talk.
  4. The camera is static (jitter ≤0.25 %) or slowly pushes in ×2–2.6 over 5–7 s from a wide shot of the cabinet to the face.
  5. Shot length 2–8.7 s; the ending: the character turns away and leaves, or the reflection "separates", with a semi-transparent
     shifted double showing through.
variants:
  - morning routine: hair, teeth, makeup — static, medium shot, 4–9 s
  - talking to oneself: a pep talk or a threat to oneself, a slow push-in to a medium close-up over ≈6 s
  - try-on: handheld camera from below with a roll of ≈20–25°, push-in ×1.8 over 0.7 s, the outfit changes exactly every 3 frames (120 ms) while the camera move and the pose continue uninterrupted
  - double: after 1–1.5 s a semi-transparent shifted copy shows through over the face — a "split" personality
  - pair "from behind → from the mirror" via a cut
status: footage
fallback: |
  1) search the source footage: frontal shots looking into the lens with hands near the face (a selfie on the front camera,
     a phone propped against a mirror, which is essentially this move already);
  2) imitation in code: reframe a frontal shot to full face with headroom + a blurred countertop strip at the bottom
     (a generated plate with alpha) + a rounded vignette; build the try-on from takes of one movement;
  3) generation via gen_hint with the user's consent.
params:
  duration: 2–8.7 s (50–217 frames @25 fps), typically 4–7 s
  angle: eye level, frontal, level horizon; for a fashion try-on, from below with a 20–25° roll
  face: 20–25 % of the frame height (up to 45–50 % in a fashion close-up), center x 0.45–0.55, eyes at 0.30–0.40 of the height
  foreground: a sink/shelf strip at the bottom, 10–30 % of the height; cabinet edges at the sides up to 20 % of the width; or a dark rounded vignette
  camera: static (jitter ≤0.25 %/frame); slow push-in ×2–2.6 over 5–7 s (≈×1.014/frame, linear); the try-on is handheld, jitter ≈3.5 %
  gaze: into the lens but at oneself; hands at the face or hair in ≥50 % of frames
  outfit_swap: every 3 frames @25 fps (120 ms), 10–15 swaps in a row, the camera move and the pose are not interrupted
  double: the double shows through after 1–1.5 s, transparency ≈40–60 %, shift ≈5 % of the height (≈)
when: |
  UGC "get ready with me", beauty and fashion: getting ready to go out, a try-on, "before / after". A defining moment for the character:
  talking to oneself before a decisive step; place it before the drop or the climax. Fashion edit: a series of outfit changes on one
  movement to a fast beat (a change on every 1/8). 1–2 times per video, usually at the start (setup) or before a turning point.
avoid: |
  The character talks to the viewer without any actions "on themselves": that is direct address, not a mirror. The camera above or below the eyes for no reason,
  an asymmetric composition: a mirror centers. Longer than 8–9 s without action. Outfit changes on shaky takes where the pose
  does not match: instead of a "flash of looks" you get a mess.
sfx: |
  A quiet small room: a tap, ventilation, rustling clothes, a short bathroom reverb on the voice. A light switch click
  or a creaking cabinet door at the entry. Try-on: fabric rustle or a click on each change, strictly on the beat.
genres: {fashion: signature, ugc: signature, viral: allowed, product: allowed, drama: allowed, motivation: allowed, fanedit: allowed}
detect: |
  ed_motion: no events, jitter ≤0.25 % (4 of 6) or a slow ZOOM-IN of ≈×1.01/frame over 5–7 s; the try-on has handheld
  shake ≈3.5 %, ROTATE up to 26°, and ed_motion sees no cuts in it.
  Visually: frontal, the face centered (x 0.45–0.55), eyes at 0.30–0.40 of the height, eye-level angle; at the bottom a strip
  of sink or shelf with jars, a lamp overhead, a door or a wall behind; hands at the face and hair.
  Try-on: the color histogram of the clothes jumps with a period of exactly 3 frames during continuous motion, 12 changes in a row.
  Difference from pov.object: there the angle is from below with the blurred frame of an object, and the character looks at the object; here it is a level frontal view
  and a look at oneself. From address.direct: there it is talking to the viewer without everyday actions at the face. From reflect.mirror: there
  the mirror is visible in the frame as an object, with the reflection inside it.
engine: |
  footage: find_shot(gaze='lens', angle='eye_level', frontal=True, hands_near_face>=0.5) → cut(at).
  imitation: reframe(aspect, target=track(face), headroom=0.30) + fg_frame(shape='bottom_strip', coverage=0.15,
