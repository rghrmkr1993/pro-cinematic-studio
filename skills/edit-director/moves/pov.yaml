id: pov.dialogue
family: pov
group: angle
level: B
aliases: [POV dialogue, first-person conversation, speaker looks into the lens, subjective dialogue, POV reverse shot, POV — you're …]
what: the other person looks and speaks straight into the lens because the lens is another character's eyes; the viewer becomes the one being addressed and receives an order, a toast, a confession or a threat
frames: |
  1. (opt.) Entry: a cut from the character being addressed, or from a wide shot of the scene; from then on the camera takes their place.
  2. The speaker stands in the center (face center x 0.48–0.56), frontal, the nose exactly between the eyes (offset ≤0.07 of the interpupillary distance
     in 6 of 8), looking into the lens; framing from a waist-up medium shot to a close-up (face 24–64 % of the height, eyes at 0.22–0.47).
  3. The camera is static (5 of 8, jitter ≤0.22 %) or breathes slightly in the hands; the height of "our" character sets the camera height: looking up
     at someone above us, looking down if we are in the saddle.
  4. Signs of "us" in the frame: an animal's ears under the lens, a basketball hoop, a glass or a ball held right out to the camera,
     the edge of a table; people around react in the same direction.
  5. It lasts one line, 1.5–4.5 s (38–110 frames @25 fps); the reply of "our" character sounds off-screen or comes as a reverse cut.
variants:
  - the other person across a table — a business talk, a date, an interrogation (2 of 8)
  - a toast or a handover — glasses or a ball held out to the lens, a group of friends around (2 of 8)
  - an order or a threat — a large face, a hard stare, completely static; in horror, a flash of inserts with weapons (2 of 8)
  - looking up — the character is "above us", a crowd on the walls behind them (1 of 8)
  - looking down from the saddle — an animal's ears at the bottom, the other person frowns and turns away (1 of 8)
  - a host at the microphone speaks to "us" as the listener (1 of 8)
  - meme format "POV — you're my …": the creator talks to the camera, the caption assigns the viewer a role (a social media trend, not from the examples)
status: footage
fallback: 'any shot where a person speaks into the lens will do; context turns it into POV: a reverse cut to the listener, a "POV: …" caption or a foreground of "our" character (hands, an object at the edge of the frame, a hybrid composite); if the needed take does not exist, generation with consent'
params:
  face_x: 0.48–0.56 of the width (tolerance up to 0.59)
  frontal: nose offset from the midpoint between the eyes ≤0.12 of the interpupillary distance in ≥60 % of frames; looking into the lens
  face_h: 24–64 % of the frame height (waist shot … close-up), eyes at 0.22–0.47
  height_cue: (nose − eye line) / interpupillary distance ≈0.55–0.6 at eye level; ≤0.5 means the camera is below the face (we are shorter, sitting, lying down); ≥0.7 means above
  camera: static (jitter ≤0.2 %) or light handheld up to 0.8 %
  duration: 1.5–4.5 s (38–110 frames @25 fps) per line
  foreground: optionally 10–30 % of the frame at the bottom edge or at the sides — hands, an object, an animal's ears
  reverse: a reverse shot of "our" character or their hands, 0.8–2 s between lines, optional
when: 'the viewer is a participant in the scene: they are given an order, toasted, confessed to, threatened; the climax of a conflict "eye to eye"; ads where a salesperson or an expert speaks to "you"; UGC sketches "POV: you …", the main format of the genre; an introduction at the start of the video from the point of view of the character. Usually 1–3 lines in a row, then a reverse cut or a wide shot'
avoid: if a person addresses the viewer as a viewer (a narrator, the host of the video), that is address.direct, do not mix them up when tagging; a monologue longer than 6 s without POV cues reads as an interview; a gaze past the lens or a face in profile loses the contact; several people looking in different directions
sfx: the speaker's voice dry and close, an even room tone; "our" reply off-screen, quieter and closer, or a silent pause; on a toast, clinking glasses; in a threat, a low drone under the line
genres: {ugc: signature, viral: signature, drama: allowed, product: allowed, teaser: allowed, fanedit: allowed, explainer: allowed}
detect: |
  A face in the center (x 0.45–0.58), frontal (nose offset ≤0.12 of the interpupillary distance in ≥60 % of frames), pupils centered in the eyes, i.e. looking
  into the lens; ed_motion: "no significant global motion" or jitter ≤0.8 %. POV context (separates it from addressing the viewer):
  the scene has a reverse shot of the listening character or their hands, replies come from off-screen, the frame has a foreground of "our"
  character, or people around react to the camera. The height of "our" character comes from (nose − eyes)/interpupillary distance: ≤0.5 from below, ≥0.7 from above.
  Differences: address.direct is the same picture but addresses the viewer, with no reverse shots or replies; an interview has the gaze
  slightly past the lens, at the interviewer; pov.first_person has a moving camera with one's own hands at the bottom; pov.object has the blurred frame of an object.
engine: |
  footage: find_shot(gaze='lens', face_x=[0.45, 0.58], frontal=True, camera='static') → cut(at).
  Building the dialogue: cut(speaker into the lens) ↔ cut(reverse shot or the hands of "our" character) at the joins between lines; duck(music, under=voice).
  Meme: text('POV: …', style='caption', anim='pop', t=[0, 2.0], safe_zone='tiktok') over the first shot.
  Foreground (hybrid): composite(layers=[fg(hands|glass|object), plate], blend='normal') at the bottom edge, 10–30 % of the frame, out of focus.
gen_hint: point-of-view shot as seen by <listener>, <speaker> faces the camera dead center and talks directly into the lens as if to the listener, frontal, eye-level (or slightly low / high to match the listener), static camera, <foreground hint such as hands or a glass at the bottom edge>
