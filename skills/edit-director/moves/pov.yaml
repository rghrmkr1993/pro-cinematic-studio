id: pov.animal
family: pov
group: angle
level: B
aliases: [pet POV, dog POV, pet cam, pet's-eye view, through a dog's eyes, through a cat's eyes, animal POV]
what: a "pet's-eye" view — the camera at a height of 20–60 cm trots along, people are visible up to the waist or lean straight down to the lens; the world from below, from the animal's side
frames: |
  1. The camera is at the animal's height (≈20–60 cm): the floor, a path or grass fills the lower half of the frame, the horizon is level
     (median roll ≤3° in 6 of 7 examples); people nearby are visible only up to the waist, their legs walk ahead.
  2. Trotting motion: a fast vertical bob at 3–3.8 Hz (a human's is 1.5–2.4 Hz), jitter 0.2–3 % of the frame;
     in a chase or an attack, lunges, jerks, rotation of up to ±36° and jitter of up to 10 %.
  3. People address the "pet": they lean down and look from above straight into the lens, reach out their hands; faces take 26–32 % of the frame height,
     shot from below, with the ceiling and lamps behind their heads. In the foreground there is often a barrier: the mesh of an enclosure, the door of a carrier.
  4. Shot 1.7–5 s (42–125 frames @25 fps); around it, cuts to the pet itself, so it is clear whose eyes these are.
variants:
  - following the owner's legs along a path or down a corridor right at floor level (2 of 7)
  - people bend down to the lens and talk to it — looking up from below, roll up to 10–20° (2 of 7)
  - through a barrier — fence mesh with a sideways glide, a carrier door that hands reach toward (2 of 7)
  - attack or chase — a lunge at a person, a fall, chaotic turns (1 of 7)
  - a look into the distance across a lawn — a figure walks away, grass in the lower third (1 of 7)
status: footage
fallback: the camera cannot be "lowered" in code, so take low shots from the source footage (camera at floor level, on the pet's harness, on a stick near the ground) and add the trot in code — a 3–3.5 Hz bob, a light barrel, breathing sounds; if there are no low shots, generation with consent
params:
  camera_height: 0.2–0.6 m; the floor or ground fills 40–60 % of the frame from the bottom, strong perspective near the lens
  horizon: level, roll ≤4°; when looking up at people, up to 10–20°
  bob: vertical 3–3.8 Hz (trot), amplitude 1–3 % of the frame height; at a walk, 2–2.5 Hz
  people: legs and waist at full size, heads beyond the top edge; when they lean in, the face is 25–35 % of the height, looking down into the lens
  foreground: optionally mesh or a carrier door over 20–40 % of the frame, out of focus
  duration: 1.7–5 s (42–125 frames @25 fps)
  colour: natural in the examples; a "dog vision" stylization (blue-yellow, no red) is optional, not from the examples
when: pet videos ("a day through the dog's eyes", greeting the owner at the door), comedy with people baby-talking straight into the camera, ads for pet products, family and children's stories; thriller, "someone is watching from below" before the reveal; a chase with a dog. 1–2 shots in a row, then a cut to the pet itself
avoid: a camera height above 0.8 m reads as a human; long chaotic shake; without a shot of the animal itself nearby it is unclear whose view this is; human hands at the bottom of the frame make it a human's view
sfx: fast panting, sniffing, claws clicking on the floor, the collar tag jingling in time with the trot, people's voices from above slightly muffled and "baby-talking"; on a lunge, a bark or a growl
genres: {ugc: signature, viral: allowed, product: allowed, teaser: allowed, drama: allowed, calm: allowed}
detect: |
  Low position: the floor or ground in the bottom 40–60 % of the frame with strong perspective near the lens, people visible by their legs and waist,
  heads beyond the top edge; faces appear only when a person leans down (face in the upper half, looking down
  into the lens, chin and nostrils visible). ed_motion + the spectrum of vertical displacement: a peak at 3–3.8 Hz (trot) with a share of ≥0.25,
  jitter 0.2–3 %, the horizon almost level. Differences: pov.first_person is at eye height, bobs at 1.5–2.4 Hz, with one's own hands at the bottom;
  a low ground-level angle (angle.ground) has the camera static or moving smoothly without a trot; a low tracking shot following legs is smooth, without
  bobbing and without looks into the lens.
engine: |
  footage: find_shot(height='ground', bob_hz=[2.8, 4.0], faces_from_above=True) → cut(at); next to it, a shot of the pet itself.
  Imitation from a low shot: transform(scale=[1.08, 1.08]) + destabilize(profile='trot', bob_hz=3.3, amp=0.015, roll=2)
  + lens_distort(k=-0.1) + sfx('panting') with paw clicks in time with bob_hz.
  Optional "dog vision": color(params={red→yellow/brown, sat=0.6}).
gen_hint: point of view of a small dog at ground level, camera about 30 cm above the floor trotting forward with a bouncy motion, only the legs of people visible, the owner leans down and talks straight into the lens, wide lens, natural colours
