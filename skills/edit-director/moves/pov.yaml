  talking to oneself: transform(scale=[1, 2.5], center=track(face), t=[t0, t0+6], ease='linear').
  try-on: jump_cut(takes[], every=3fr, align=track(person)) — takes of one movement in different outfits,
            aligned by the figure; beat_sync(event='swap', grid='1/8') + sfx('click', at=each change, gain=-12dB).
  double: composite([clip, clip.shift(dy=-0.05).delay(0.2)], blend='screen', opacity=0.5, t=[t0+1.2, end]).
