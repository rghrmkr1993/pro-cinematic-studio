id: pov.screen
family: pov
group: angle
level: B
aliases: [phone POV, camera inside the phone, view from the screen, the phone's view, livestream frame]
what: the camera stands in place of a screen (a phone, a monitor, a scoreboard) — the person looks into the lens while a mirrored semi-transparent interface glows over their face, as if we were looking from inside the glass
frames: |
  1. (opt.) Lead-in: a side shot of the character with the device, then a cut "into the screen".
  2. Frame: a phone in hand gives a low angle (camera below the chin, tilted up ≈15–30°), the face is 25–50 % of the height
     in the upper half of the frame, eyes at 0.25–0.45 of the height, the top of the head is often cut off; a screen on a table or a wall gives
     eye level or slightly below. The camera is static (jitter ≤0.25 %) or "breathes" slightly with the hand.
  3. Interface layer: everything on the screen is drawn mirrored (text and icons reversed), semi-transparent
     (≈40–70 %) and glowing: a status bar in the top 3–5 %, an icon or button at bottom center (≈15 % of the frame),
     message bubbles and photo previews at the edges, large counter digits up to 40 % of the height in the lower half.
     The face is lit by the screen.
  4. Action: the eyes read just below the lens; a finger reaches toward the lens, a tap, and the interface responds within 1–3
     frames (an icon pulses, a window opens, a counter counts up); a reaction on the face.
  5. Ending: a cut to the reaction, or the phone goes into a pocket: the frame tumbles for ≈0.5 s (12 frames) with motion blur and roll,
     then the darkness of the fabric (brightness ×0.3).
  Shot length 1.2–4.5 s.
variants:
  - phone in hand: from below, a mirrored status bar, icons and chat; the ending goes into the pocket
  - scoreboard or machine: large mirrored counter digits in the lower half, the character waits for the result
  - text on the screen: mirrored lines over the face (the face shows through); sometimes a diptych, with the same face beside it without text
  - livestream: the frame is the device's camera feed, the interface reads normally — a live badge at top left, a timer at bottom left, a chat column on the left, pop-up reactions on the right; the characters address the "viewers"; sometimes a window frame with a thin border over a darkened background
status: footage
fallback: |
  1) search the source footage: front-camera phone footage where the person looks at the screen is exactly the right
     angle; search by the detect cues;
  2) imitation in code on such a shot: a mirrored semi-transparent interface (neutral, no real logos),
     a cool cast on the face, a flash on the tap; for a livestream, a readable live-broadcast interface;
  3) generation of the base shot via gen_hint (add the interface in code, generators draw mirrored text poorly).
params:
  duration: 1.2–4.5 s (30–113 frames @25 fps), typically 1.5–3 s
  angle: phone, from below ≈15–30°; a screen on a table or a wall, eye level
  face: 25–50 % of the frame height, eyes at 0.25–0.45 of the height, center x 0.45–0.55
  camera: static (jitter ≤0.25 %/frame) or a slight "breathing" of the hand
  ui_mirror: the interface is flipped horizontally for the view "from the screen"; not flipped in livestream mode
  ui_opacity: ≈40–70 %, a soft glow of ≈4–8 px
  ui_layout: status bar in the top 3–5 %; icon or button at bottom center, ≈15 % of the frame; bubbles in the bottom quarter; counter digits up to 40 % of the height at the bottom
  tap: the interface responds within 1–3 frames, an icon pulse of ×1.1–1.3 or a 2-frame flash
  counter: digits count up over 0.15–0.3 s (4–8 frames), then stop on the final value
  pocket_out: tumble 0.4–0.5 s (10–12 frames), motion blur and roll, brightness ×0.3, the darkness of the fabric
  live_ui: live badge ≈10×5 % of the frame at top left, timer at bottom left, chat in the left ≈20 % of the width, reactions in the right 10–20 %, floating up from the bottom
when: |
  Scenes with a phone: a message arrives, the result of a bet or an order, likes, "saw the news"; the screen's view shows at once
  both what the character sees (the mirrored interface) and their face. UGC and app walkthroughs: a button press → the result.
  A music video or teaser in a streaming aesthetic: a live badge, chat and reactions on the verse. End of a scene: the phone goes into the pocket, a tumble
  into darkness as a transition. 1–3 times per video, keep it short (1.5–3 s).
avoid: |
  An interface that is not mirrored in the view "from the screen" breaks the logic (mirror everything except livestream mode). Too
  dense an interface covers the face; the eyes and mouth must stay visible. Real logos and app names: only
  a neutral made-up interface. Text that matters to the viewer cannot be read mirrored, so duplicate it with a caption
  or a cutaway to the screen itself.
sfx: |
  Interface sounds: a tap, vibration, a notification chime when a bubble appears, counter clicks and an accent on the final figure;
  for a livestream, a hum of voices and short reaction "blips". The tumble into the pocket: fabric rustle and a dull thud in the darkness.
genres: {ugc: signature, viral: allowed, explainer: allowed, product: allowed, drama: allowed, teaser: allowed, fanedit: allowed}
detect: |
  ed_motion: no events, jitter ≤0.25 % (5 of 6) or slight handheld shake; when going into the pocket, a cascade of "cuts",
  ROTATE and ZOOM of 2 frames each and a brightness drop to ≈35.
  Visually: a face from below, large in the upper half, looking into the lens or just below it; on top, a glowing
  semi-transparent layer with reversed text and digits, a status bar at the top with a mirrored icon order; screen
  light on the face. Mirroring check: run text recognition on the frame and on its mirror image; if the mirrored version
  reads better → the interface is shown from inside.
  Livestream: readable elements in fixed positions (live badge, timer) give a static overlay-mask of 0.1–0.4 in
  ed_motion; chat and reaction columns moving upward.
  Difference from pov.object: there is no interface there, the frame is the object itself. From layout.screen_in_screen and gfx.floating_ui: there
  the screen is an object in the frame or graphics over a normal shot, here the camera itself is the screen. From pov.first_person with a phone:
  there we look at the screen through the character's eyes, here we look at the character from the screen.
engine: |
  footage: find_shot(gaze='lens', angle='low', face_top_half=True) — a phone's front camera almost always gives this angle.
  interface: ui_overlay(layout='phone_status|chat_bubbles|app_icon|text', mirror=True, opacity=0.55, glow=6px, t)
             + color(cast='cool', amount=0.2) on the face + flash(color='white', dur=2fr, amount=0.3) on the tap.
  counter: counter(from, to, dur=0.25, mirror=True, size=0.4H, anchor='bottom').
  livestream: ui_overlay(layout='live', mirror=False, badge=True, timer=True, chat='left', reactions='right', rate=2–4/s).
  ending: transform(rotate=[0, 40], shift=[[0, 0], [0.3, 0.4]], t=[t1, t1+0.45], ease='inCubic', motion_blur=0.5)
         + fade(to='black', dur=0.2) + sfx('whoosh', at=t1).
