id: pov.object
family: pov
group: angle
level: C
aliases: [inside POV, camera as an object]
what: "the lens stands in for an everyday thing (say, a fridge or a bag), so whoever is busy with it ends up meeting the viewer eye to eye"
frames: |
  1. (opt.) Lead-in: 0.5–1 s of an outside shot of the object itself (a phone on a table, a round door), then a cut
     to its "view", the classic pair "shot → reverse angle".
  2. Setup: the camera is static (jitter ≤0.15 % of the frame) where the object lies or stands, usually below the character's
     eyes, looking up or straight from shelf level. The frame edges are covered by the blurred "frame" of the object itself:
     shelves and groceries, lips and teeth, the edges of a bag, the rim of a porthole, the bottom of a glass, the sides of neighboring products.
     This frame takes up 30–60 % of the area, sharpness around the perimeter is 3–50 times lower than in the center; in the center, a lit opening.
  3. Action: within the first 0.5–1 s the character enters the opening or leans toward it. The face is 20–40 % of the frame height,
     centered horizontally, eyes at 40–50 % of the height. Looking into the lens (±10 % of the frame), but motivated
     by the object: examining food, a screen, the contents, working with a tool, reaching a hand toward the lens to take it.
  4. Ending: the character leaves the opening, or the opening closes: a door, a lid or a palm covers the lens over
     9–15 frames (0.35–0.6 s), brightness drops 3–7 times, then from 0.4 s of black on, a ready cut point.
  Shot length 1.1–6.7 s, typically 2–3 s.
variants:
  - from storage: a fridge, a cupboard, a car trunk, a store shelf — a rectangular opening, items and groceries in the foreground
  - from packaging or a bag: a soft ragged opening, a hand reaches inside and covers the lens
  - from the mouth: an oval frame of lips and teeth, a tool is brought up to the lens
  - from an object in the hands: a glass, a prosthesis, a toy — the camera moves with the object, a round or strip-shaped frame, handheld shake up to 1 %
  - from a tabletop: the camera in place of a ball, a phone, a plate — a low angle, a hand reaches to take it
  - group over an object: several faces bend over a phone or a find, all looking down into the lens
status: footage
fallback: |
  1) search the source footage for the cues from detect (looking into the lens + blurred edges + a static camera);
  2) imitation (hybrid): a shot where a person looks into the lens from below (a selfie, a phone on a table or at chest height), plus on top
     a blurred frame (a drawn mask of the opening or a generated plate with alpha: shelves, bag edges), a cast of light
     "from inside" and muffled sound; without the frame the imitation reads as direct address to the viewer;
  3) generation via gen_hint with the user's consent.
params:
  duration: 1.1–6.7 s (28–168 frames @25 fps), typically 2–3 s (50–75 frames)
  camera: static (jitter ≤0.15 %/frame); handheld up to 1 % only if the object is being carried or held
  height: the object's level, below the eyes with an upward tilt of ≈10–30°, or straight from a shelf
  frame_coverage: the frame covers 30–60 % of the area around the perimeter, edge sharpness ≤0.3× the center (typically 0.1–0.2)
  frame_luma: a dark frame has an edge 1.5–3 times darker than the center; a light one (fridge, packaging) has an edge 10–20 % brighter
  aperture: rectangle (door, shelf) | oval (mouth) | circle (glass, porthole) | ragged diamond (bag) | two side wings (products)
  face: 20–40 % of the frame height (typically 25–35 %), center x 0.45–0.55, eyes at 0.40–0.50 of the height; small (5–10 %) when the lit opening is the main thing
  gaze: into the lens ±10 % of the frame, motivated by an action with the object
  entry: the character enters or leans in within the first 0.5–1 s (12–25 frames)
  block_out: the lens is covered over 9–15 frames (0.35–0.6 s), brightness ×0.15–0.3, then ≥0.4 s of black
  intro_insert: (opt.) 0.5–1 s of an outside shot of the object before the cut to its view
when: |
  Hook and setup: "what the fridge / bag / phone sees" is funny and clear without words. Product video: a hand
  takes the product off a shelf or out of a bag, the product's view of the buyer. A group's reaction to a screen or a find.
  End of a scene: the door closes into black, a cut to the next part on a downbeat or a pause in the music.
  1–2 times per video; best in a quiet part of the track or in the bridge, where the "inside" sound can be heard.
avoid: |
  The character does not look into the lens, or looks into it for no reason, which reads as direct address to the viewer. No frame of the object: the move
  does not read. The camera where the object could not be. Longer than 4–5 s without action. Two in a row: the technique becomes
  a gimmick. Dense rhythmic cutting with no pause: the move needs a 2–3 s "breath".
sfx: |
  Sound "from inside": a muffled room (high cut at ≈1–1.5 kHz), the hum of a fridge, rustling packaging. A click or a creak
  of opening as the character enters; a dull thud of the door or the rustle of a palm exactly on the frame the lens is covered, then 0.3–0.5 s of silence.
genres: {product: signature, ugc: signature, viral: allowed, teaser: allowed, drama: allowed, fanedit: allowed, explainer: allowed}
detect: |
  ed_motion: no events, jitter ≤0.15 % (8 of 10) or slight handheld shake up to 0.6 %; when the opening closes, black
  frames at the end and a 3–7× drop in brightness over 0.35–0.6 s; sometimes a cut at the start (an outside shot of the object).
  Custom checks: sharpness of the edge band (18 % of width/height) ≤0.3× the central zone, i.e. a blurred foreground around the
  perimeter (9 of 10); a face in the sharp central zone, frontal, pupils centered in the eyes, i.e. looking into the lens;
  an angle from below or from shelf level; a dark frame (the edge 1.5–3 times darker than the center) or shelves and packaging.
  Difference from address.direct: there is no frame of an object there, the camera is at eye level, the person talks to the viewer; here it is
  an action with an object (looks inside, reaches, takes, closes). From pov.dialogue: there the lens is the eyes of the other person, who is being spoken to. From pov.first_person: there the camera is the character's eyes,
  their hands are visible at the bottom, the frame moves with the steps. From frame.voyeur: the person being watched does not look into the lens.
  From pov.screen and pov.mirror: there the object is a screen (cold flickering light on the face) or a mirror (the person fixes their appearance).
engine: |
  footage: find_shot(gaze='lens', border_sharp_max=0.3, camera='static', angle='low|level') → cut(at) into the move's slot.
  imitation: fg_frame(shape='shelves'|'oval'|'ring'|'tear'|'side_wings', coverage=0.4, blur=15px, luma=0.4,
            source='draw'|'generate') + color(cast='cool'|'warm' — light from inside the object) + vignette(0.3)
            + muffle(cutoff_hz=1200, t=the whole shot).
  ending: transition(kind='wipe(shape=door|hand)', dur=0.4, to='black') + sfx('impact', at=the moment the lens is covered, gain=-6dB),
         cut after 0.4 s of black on a downbeat.
  "outside → inside" pair: cut(at) from a 0.5–1 s shot of the object straight to its view.
