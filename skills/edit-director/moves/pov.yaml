id: pov.first_person
family: pov
group: angle
level: B
aliases: [first-person POV, POV, point of view shot, first-person view, through the character's eyes, subjective camera]
what: the camera becomes the character's eyes — their hands enter the frame from below, the frame sways in time with the steps and turns like a head; the viewer "lives through" the action themselves
frames: |
  1. (opt.) Entry: the eyes open, 2–3 frames of black, then a murky picture with darkened edges for 0.3–0.7 s,
     then focus; or a cut from the character who is looking to what they see.
  2. The frame is at eye height (standing ≈1.5–1.7 m, sitting ≈1.1–1.3 m), a wide lens, looking slightly down, so one's own hands,
     forearms, handlebars, food or a tool enter from below or from the lower corners (7 of 8 examples).
  3. Head-like motion: a walking bob of 1.5–2.4 Hz, jitter 0.4–9 % of the frame, bursts of roll of 2–36°, sharp
     turns shifting 50–150 % of the frame over 1–2 s (peaks 5–18 %/frame) with motion blur; walking forward gives a push-in with parallax.
  4. Other people react to "us": they look into the lens, reach out a hand, hug, hand over an object (2 of 8).
  5. The shot is continuous, 1.3–5 s (33–125 frames @25 fps); the exit is a cut to the character seen from outside or a blink into black.
variants:
  - first-person walk or run — stairs, a door, a corridor, a stadium; strong shake and turns (4 of 8)
  - at a table — hands with food at the bottom, the person opposite looks into the lens (1 of 8)
  - vehicle — hands on bicycle handlebars, smooth forward motion, fine vibration at 3–3.5 Hz (1 of 8)
  - an object in the hands leads the frame — tongs with food, a tool; the camera moves with it (1 of 8)
  - eyes opening — from black through a blurred spot with a vignette to a sharp frame, the hands rise in a gesture (1 of 8)
  - meme format "POV — you're …": the caption assigns the viewer a role, and the shot may be an address into the lens — see pov.dialogue (not from the examples, a social media trend)
status: footage
fallback: search the source footage using detect (an action camera on the head or chest, handheld shooting at eye level); imitation in code from a handheld shot — walking bob, roll, vignette, a light barrel, blinking and breathing, but without one's own hands in the frame it reads weakly; a shot with hands via generation with consent
params:
  camera_height: eye level, with the horizon at 0.40–0.55 of the frame height; when sitting, 0.3–0.5 m lower
  pitch: down 10–30° so the hands get into the frame
  hands: hands and forearms from the lower corners, 10–35 % of the area, wrists at the bottom edge
  lens: wide, ≈14–24 mm equivalent (field of view 85–110°), barrel distortion acceptable
  bob: vertical bob at 1.5–2.4 Hz (step rate), amplitude 1–4 % of the frame height; running, up to 6–8 %
  roll: bursts of ±2–10° per step, up to 30°+ on a sharp turn
  turns: head turn of 50–150 % of the frame over 1–2 s, peak 5–18 %/frame with motion blur
  duration: 1.3–5 s (33–125 frames @25 fps), no cuts inside
  blink: eyelids closing from top and bottom over 3–4 frames, black for 2–6 frames, opening over 4–8 frames with blur
when: a "you are the hero" hook (a jump, a ride, walking out on stage); product demos and hands-on tutorials, what to do and how it looks from the user's side; a travel walk along a street or a trail; sport and extreme action from an action camera; horror and thriller, what is around the corner; drunkenness, dizziness, waking up; a dialogue where the other person speaks directly to "us". 1–2 such shots per video or a short series on the drop
avoid: longer than 5–6 s with strong shake causes motion sickness; mixing with objective shots without a clear entry leaves the viewer unsure whose eyes these are; POV without hands and reactions reads as an ordinary handheld camera; a low frame rate plus shake looks jerky; explainer videos, where a stable picture matters
sfx: breathing and footsteps in time with the bob (1.5–2.4 Hz), a heartbeat in tense moments, close hand foley (grabbing, clicking, rustling), the surroundings slightly muffled; the character's own voice dry and close, as if from inside the head; on a blink, a short muffled "inhale"
genres: {ugc: signature, travel: signature, sport: signature, viral: allowed, product: allowed, explainer: allowed, drama: allowed, teaser: allowed, fanedit: allowed, motivation: allowed, epic: allowed, calm: allowed}
detect: |
  Hands: a hand detector (mediapipe hands) finds a wrist in the bottom 15 % of the frame or in the lower corners, fingers pointing
  away from the viewer, in ≥20 % of frames; the hands hold handlebars, food, a tool. ed_motion: jitter 0.4–9 %, frequent ROTATE 2–36°,
  long SHIFT of 50–150 % of the frame over 1–2 s (head turns), ZOOM-IN with nonrigid >0.15 (walking forward, parallax);
  the spectrum of vertical displacement peaks at 1.5–2.4 Hz (steps). People in the frame look into the lens and act toward "us".
  Wide angle: strong barrel distortion, field of view ≥85°. Differences: handheld.shaky shows the character from outside, with no own hands;
  drone.fpv is a smooth fast flight above human height; pov.object is a static camera with the blurred frame of an object;
  address.direct is a static shot with a person talking to the viewer; pov.dialogue is the other person talking to the character-camera.
engine: |
  footage: find_shot(hands_from_below=True, motion='handheld', fov='wide', gaze='lens'|any) → cut(at).
  Imitation from a handheld shot: transform(scale=[1.12, 1.12]) (margin for the sway) + destabilize(profile='walk', bob_hz=1.9,
  amp=0.02, roll=3) + lens_distort(k=-0.12) + vignette(0.25) + sfx('breath') and footsteps in time with bob_hz.
  "Eyes opening" entry: blink(t=0, mode='open', dur=0.5) + blur(kind='gaussian', amount=8→0, t=[0, 0.6]).
  Exit: blink(t=end-0.2, mode='close', dur=0.16) → cut to an outside shot of the character.
gen_hint: first-person POV shot through the eyes of <character>, own hands and forearms visible at the bottom of the frame <doing the action>, eye-level wide-angle lens, natural head bob while walking, people around look directly into the lens, immersive handheld feel
