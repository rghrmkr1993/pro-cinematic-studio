id: shot.extreme_close_up
family: shot
group: angle
level: A
aliases: [extreme close-up, ECU, XCU, detail, detail shot, macro insert]
what: extreme close-up — only part of the face (eyes, lips) or a detail of an object is in frame; it pins the eye to a single feature and makes for short rhythmic inserts
frames: |
  1. Frame: one detail fills the frame — lips with the chin, the nose with the lips, the eyes with the bridge of the nose, a patch of skin
     with a design, a line of text on paper, a mechanism, a piece of jewelry. The whole face doesn't fit: the eyes or the mouth are past the edge,
     the face detector loses it or places points outside the frame.
  2. Within the shot: static or a very slow push-in ×1.04–1.12 over 0.5–0.8 s; any shake is noticeable at this shot size,
     so jitter is usually ≤1 % of the frame. Movement comes from a micro-action: lips saying a word or singing,
     a finger sliding over skin, a typebar striking paper, a hand touching jewelry.
  3. Length: in a series of details — 0.55–1.1 s per insert (14–27 frames @25 fps), 3–4 inserts in a row cut together;
     a single detail under a voice or an action — 0.8–4.7 s.
  4. The light is often low-key: a dark background, light that models the texture (3 of 8 — mean brightness 22–43 of 255); 2 of 8 — b/w.
variants:
  - part of the face: lips on a line or vocals, eyes, nose with lips; a series of details of different people cut together at 0.9–1.1 s each (4 of 8)
  - body texture: skin, a design on the skin, fingers — dark background, slow push-in (1 of 8)
  - object detail: lines on paper, a mechanism, jewelry — a series of inserts of 0.55–0.6 s each or a continuous action (3 of 8)
  - detail "pulse": a fast push-in ×1.5 over 0.2 s and a pull-out ×0.65 over 0.3 s reveal and hide the detail (1 of 8)
status: footage
fallback: a ×1.6–2.5 crop from a close-up toward an anchor (eyes, mouth, object) by track(face) or track(object) — lossless only from 4K, from 1080p — upscale the fragment; object details — search the source footage for macro shots, otherwise generation with consent
params:
  scale: the detail fills 50–100 % of the frame; the face, if measured whole, exceeds 125 % of frame height (interpupillary over 45 % of the height, or the eyes and mouth don't fit together)
  duration: in a series 0.55–1.1 s (14–27 frames @25 fps) per insert, 3–4 inserts; a single shot 1–3 s (25–75 frames)
  camera: static or a slow push-in ×1.04–1.12 over 0.5–0.8 s; jitter ≤1 % of the frame
  pulse: optional push-in ×1.3–1.5 over 0.2 s (5 frames) and return over 0.3 s (8 frames)
  focus: focus on the detail, the background (if visible) blurred; sharp zone 15–85 % of the area depending on the plane of the detail
  crop_from_cu: S = 1.6–2.5 toward the anchor; without upscaling only from 4K
  light: low key, side light raking the texture; b/w as a stylistic option
when: tension before a twist (eyes, fingers, a mechanism); a series of 3–4 inserts on the beats before the drop or under a drum fill; the texture of a product and material; lips on a key word or in the vocals; teaser — show a part without showing the whole; a "breath" transition between scenes. No more than one series of details per 15–20 s of video
avoid: a detail without context — the viewer doesn't understand whose it is, so a close-up or wide shot is needed nearby; a ×2+ crop from 1080p; shaky handheld footage without stabilization; missed focus; a series of details longer than 4–5 inserts — tiring and loses the rhythm
sfx: foley of the detail, close and loud — a click, a rustle of fabric, a typebar strike, a breath, a drop; lips — the voice dry and close; in a rhythmic series — a tick or click on each cut; for tension — a low drone
genres: {product: signature, fashion: signature, teaser: signature, drama: allowed, fanedit: allowed, phonk: allowed, viral: allowed, epic: allowed, motivation: allowed, sport: allowed, explainer: allowed, ugc: allowed}
detect: |
  The face detector (threshold 0.7) on a frame with a person loses the face or places the eyes/mouth beyond the frame edge; if it does find one —
  box >125 % of the height, interpupillary >45 %. Without people — a VLM check of the frame "only a detail is visible, larger
  than a palm" + signs: coarse texture (skin pores, paper fibers, letters 10–25 % of the frame high), one object
  or one plane, few contours. ed_motion: static or a slow ZOOM-IN ×1.04–1.12 over 0.5–0.8 s;
  in series — cuts every 14–27 frames @25 fps.
  Differs from shot.close_up: in a close-up both the eyes and the mouth are in frame (all 5 face points inside).
  Trap: false "faces" on letters and patterns (box 10–30 %) — filter them out with a 0.7+ threshold and stability across frames.
engine: |
  classify_shot(clip, by='face'|'vlm') → size='ECU': face points outside the frame, face_h > 1.25·H, or the face lost
  while a person is present in neighboring shots; for objects — by='vlm'.
  Synthesis: shot_crop(size='ECU', target=track(face, anchor='eyes'|'mouth') | track(object:<name>), scale=1.6–2.5 from CU,
  upscale='auto'). Series of details: cut(at=beats[i]) × 3–4, insert 0.5–1 s (1–2 beats at 120 BPM)
  + sfx('click', at=each_cut, gain=-10 dB). Optionally transform(scale=[1, 1.08], t=whole_shot, ease='linear').
