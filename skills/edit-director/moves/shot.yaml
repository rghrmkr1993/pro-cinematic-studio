id: shot.video_portrait
family: shot
group: angle
level: B
aliases: [video portrait, living portrait, moving portrait, portrait shot, posing for the camera, people-of-place series]
what: a person (or a group) poses for the camera as if for a photo but is filmed on video — almost motionless, looking into the lens or past it, while the wind, breathing and the background stay alive; a series of such portraits tells about a place and its people
frames: |
  1. Pose: the subject stands or sits upright, arms crossed, on the hips or down; looking into the lens (4 of 6) or past it
     (2 of 6), with no lines — the face "holds" the pause.
  2. Shot size: from a medium shot (face 12–20 % of the height, figure waist-up) to a waist shot or full body in a characteristic
     environment; the face in the central band (x 0.40–0.60), eyes at 0.25–0.40 of the height.
  3. Almost no movement inside: 2–12 % of the pixels change per frame. What lives is the wind in the hair, blinking, breathing and
     especially the background: traffic passes, people walk, a kitchen is at work.
  4. Camera: a tripod (jitter ≤0.11 %) — or a slow push-in ×1.2–1.45 over 0.6–0.9 s (almost linear); sometimes
     a there-and-back "breathing" ×1.18 and ×0.85 of 0.9 s each; occasionally a handheld tilt of 15 % over 0.7 s.
  5. In the edit — as a series: portraits of 0.5–3 s each, cuts on the beat (≈12 frames per portrait in a fast series), different people
     in the same pose and shot size.
variants:
  - single, into the lens: a medium shot, the subject looks into the camera, their city or their work behind them
  - people-of-place series: 3–6 portraits in a row of ≈0.5 s each, different people, the same pose, and a push-in on the last one
  - group: a crew by a car or in a workshop poses as if for a photo, a light push-in and pull-out
  - in the wind: a close-up from below, hair and fabric flying, a camera tilt follows the face
  - past the camera: looking to the side, the face in profile or three-quarters, the background blurred
status: footage
fallback: |
  1) search the source footage: shots where a person stands almost motionless, facing the camera, without speech (detect);
  2) in code from any such shot: stabilization, a slow push-in ×1.2–1.4, slow-down ×0.5–0.8 (flow), centered
     framing, color matched to the series; series — the same shot size and centering for all;
  3) generation from gen_hint with the user's consent (with real people — only their approved footage).
params:
  duration: single 1.5–3 s (38–75 frames @25 fps); in a series 0.5–1 s (12–25 frames) per portrait
  framing: medium or waist shot — face 12–20 % of the height; close-up in the wind — up to 30–35 %; group — full-body figures 40–60 %
  position: face x 0.40–0.60, eyes at 0.25–0.40 of the height; angle — chest level or slightly below
  gaze: into the lens (typical) or past it to the side
  inner_motion: 2–12 % of the pixels change per frame — the pose holds, the background and the wind move
  camera: tripod (jitter ≤0.11 %) | push-in ×1.2–1.45 over 0.6–0.9 s linear | "breathing" ×1.18 there and back, 0.9 s each
