id: shot.realization
family: shot
group: angle
level: C
aliases: [epiphany moment, moment of realization, it dawns on them, realization shot, aha moment, reaction push-in]
what: a close-up of the face at the moment it "dawns" on the subject — the eyes widen, the gaze drifts up or into the distance, while the camera slowly pushes in and the light on the face increases
frames: |
  1. Start: a medium close-up or a close-up, the face 25–45 % of frame height (up to 60–70 % for macro), the subject is busy with their own thing — talking,
     smiling, looking down. The camera is already moving or static.
  2. Slow push-in: the face grows ×1.1–1.5 over 0.8–2.5 s almost linearly (by face points), centered on the eyes;
     a variant — an arc or a "swirl" around the face (roll up to 30–40°, shift up to 45 % of the frame over ≈2 s).
  3. The turn at 35–80 % of the shot length: the smile fades, the eyes widen, the mouth opens slightly, the gaze goes up, to
     the side or straight into the lens; sometimes a revealing gesture — lowering glasses, taking off a hood, raising the head.
  4. Light: it increases on the face toward the end — face brightness ×1.1–2.4 (a cheek lights up, a backlight comes on, lights
     switch on in the background); the background darker and softer than the face.
  5. End: a hold on the face with the new expression for 0.5–1 s — or a cut right at the peak to what the subject has understood.
  Shot 1.3–6.4 s, typically 2–3 s.
