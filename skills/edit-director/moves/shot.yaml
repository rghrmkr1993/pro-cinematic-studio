id: shot.close_up
family: shot
group: angle
level: A
aliases: [close-up, CU, tight shot, face close-up, choker, tight close-up]
what: close-up — the face from forehead to chin (or an object, hands) fills almost the whole frame; emotion and reaction become the main event
frames: |
  1. Entry: usually a cut from a wider shot of the same subject or scene — the face height changes 2–5 times
     at the cut (in one example 5 s of close-up → a cut to a wide shot, where the faces are 3–5 times smaller).
  2. Frame: the face (forehead–chin, detector box) takes up 75–120 % of frame height; both eyes and the mouth are in frame,
     the top of the head touches the top edge or is cut off, at the bottom the chin and the edge of the shoulders or collar.
     The eye line at 0.32–0.35 of the height from the top; a frontal face stands in the center (x 0.44–0.54).
  3. Within the shot the camera is static or barely "breathes" (jitter ≤0.5 % of the frame); movement comes from facial expressions, hands
     near the face, water, makeup. A variant with camera movement — a slow pull-out ×0.7–0.76 over 1.1–1.45 s with an 8–16° roll.
  4. Holds 1.5–5 s (38–125 frames @25 fps) — until the end of the reaction; exit with a cut to the object of the gaze or a wide shot.
  Object close-up: a hand or an object fills 30–70 % of the frame, the background blurred (sharp zone 30–45 % of the area).
variants:
  - frontal and centered, looking into the lens or just past it — maximum contact (2 of 8)
  - tight (choker): forehead or chin cut off, face 105–125 % of frame height (2 of 8)
  - face in action — hands, water, makeup; the camera pulls out or tilts to follow the head (2 of 8)
  - object: a hand or hands at work in close-up on a blurred background, sometimes handheld (2 of 8)
  - wide 2.4:1 format — the face takes about a third of the width, the surroundings read on the sides (1 of 8)
status: code
fallback: a real close-up from the source footage is always better; in code — a crop of a wider shot by track(face) (lossless up to ×1.3 from 1080p and ×2 from 4K); beyond that — upscale the fragment; if there is no close-up of the subject and the crop can't handle it — generate a close-up with consent
params:
  face_h: face (forehead–chin by the detector) 60–125 % of frame height, typically 80–90 %
  iod: interpupillary distance 22–46 % of frame height
  eye_line: 0.30–0.36 from the top (typically 0.33); with a hand or an object above the head — up to 0.5–0.65
  face_x: 0.45–0.55 for a frontal face; when looking sideways 0.35 / 0.65 with lead room in the direction of the gaze
  headroom: 0 — the top of the head at the edge or cut off
  duration: 1.5–5 s (38–125 frames @25 fps); an accent close-up in a montage 0.6–1.2 s (15–30 frames)
  camera: static or jitter ≤0.5 % of the frame; optionally a slow push-in ×1.05–1.15 over the shot
  size_jump: from the neighboring shot of the same subject ×2–5 in face height, no less than ×1.5
  crop: S = 0.85·H / face_h_px, centered on the face, eyes at 0.33; limit without upscaling ×1.3 (1080→1080), ×2 (4K→1080)
when: an emotional peak, a reaction to an event, a punchline, a moment of decision; the hook in the first 0.5–1 s (a big face stops the scroll); going "inside" the subject after a wide shot; quiet parts of the track and long notes; in fast genres — a short close-up on a downbeat. No more than 2–3 close-ups in a row without a wider shot if the geography matters to the viewer
avoid: a ×2+ crop from 1080p (mushy); the face smeared by motion or blinking in the middle of the shot; a wide-angle lens right up to the face (distorts proportions); a fight or sport in motion without a wide shot — the space gets lost; two close-ups of the same subject in a row with a size difference under ×1.5 — reads as a jump cut
sfx: the shot itself doesn't need a sound — bring the music down, voice and breathing close and dry; when entering with a cut on the beat — a soft impact or a low hit; on an object close-up — foley of the action (rustle, drops, click)
genres: {drama: signature, ugc: signature, fanedit: signature, viral: allowed, motivation: allowed, sport: allowed, fashion: allowed, teaser: allowed, epic: allowed, calm: allowed, explainer: allowed, product: allowed, clips: allowed}
detect: |
  Face detector (YuNet or mediapipe, threshold 0.7) on frames every 0.5 s: face box 60–125 % of frame height,
  all 5 points (eyes, nose, mouth corners) inside the frame, eye line 0.30–0.36 (up to 0.65 with a low composition),
  usually one face. Without a face: one object or hands at 30–70 % of the frame, the background blurred — sharp zone ≤45 % of the area
  with a sharpness contrast (p95/p20 of blocks) of ×8 or more.
  ed_motion: most often "no significant global motion" or jitter ≤0.5 %; if there is movement — slow (≤×1.03/frame).
  Differences: shot.extreme_close_up — only part of the face is in frame (eyes or mouth past the edge), the detector loses the face,
  box >125 %; shot.medium_close_up — box 28–60 %, the shoulders fully and the upper chest in frame, eyes at 0.33–0.45.
engine: |
  classify_shot(clip, by='face') → size='CU' with a median face_h of 0.60–1.25·H and all 5 points in frame (frames every 0.5 s);
  without a face — by='subject' (share of the sharp zone + a VLM check "object in close-up").
  Synthesis from a wider shot: shot_crop(size='CU', target=track(face), face_h=0.85, eye_line=0.33, lead_room=0.1,
  max_scale=2.0, upscale='auto') ≡ transform(scale=[S, S], center=track(face), t=whole_shot), S = 0.85·H / face_h_px.
  With S > max_scale — look for a close-up in the source footage, otherwise generation. Entry on the beat: cut(at=beat) + sfx('impact', at=beat).
gen_hint: close-up of <subject>'s face filling the frame from forehead to chin, eyes on the upper third, shallow depth of field with a soft dark background, static camera, subtle natural expression, cinematic soft light
commands: ["close-up for the reaction in #4", "make #2 a close-up on the face", "insert a close-up of the hands before the drop", "find all close-ups of the subject in the source footage"]
related: [shot.extreme_close_up, shot.medium_close_up, zoom.slow, zoom.punch, cut.insert, frame.central]
evidence: {examples: 8, sources: 8, measured: "face 75–119 % of frame height (medians of 6 clips with a face), per frame 67–124 %; interpupillary 23–46 % of the height; eye line 0.32–0.35 in static frontal shots, 0.47–0.66 with a low composition; all 5 face points in frame in 5 of 6; 4 of 8 — static or jitter ≤0.5 %, 2 — a slow pull-out ×0.7–0.76 over 1.1–1.45 s; 2 object shots: sharp zone 30–67 % of the area; a close-up → wide cut changes the face ×3–5", confidence: high}
