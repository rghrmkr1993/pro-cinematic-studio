id: shot.medium_close_up
family: shot
group: angle
level: A
aliases: [medium close-up, MCU, chest-up portrait, head and shoulders, talking head]
what: medium close-up — head and shoulders down to mid-chest; the face reads, but gestures, clothing and a bit of the environment are visible — the workhorse shot for speech, dialogue and a reaction with a gesture
frames: |
  1. Frame: the face (forehead–chin, detector box) takes up 30–55 % of frame height; the bottom edge cuts across the chest
     or the armpits, the shoulders fully in frame, 0–10 % headroom above the head. The eye line at 0.33–0.45 of the height from the top.
  2. A frontal subject stands in the center (x 0.48–0.50); one turned to 3/4 or looking sideways — on a third
     (x 0.32–0.44) with lead room in the direction of the gaze.
  3. Within the shot the camera is static or barely breathes (jitter 0.1–0.6 % of the frame); hands, food, jewelry enter the frame
     from below. A variant — a slow push-in ×1.4 over 1.25 s (face 28 → 37 % of the height) or the camera moving down the body.
  4. Holds 2–4.5 s (50–110 frames @25 fps) — a whole phrase or reaction; exit with a cut to the other speaker
     or to a close-up of the same subject (the face 1.6–2.5 times larger).
variants:
  - frontal and centered — a monologue, an address, a character's entrance (2 of 8)
  - 3/4 or profile on a third, looking off-screen — a reaction in a dialogue (3 of 8)
  - with action near the face — food, hands on the neck, someone else's hand touching the face and chest (3 of 8)
  - no eyes: the frame from the lips to the chest, the emphasis on the body, the outfit and touch; the camera slides down by 55 % of the frame over 1.5 s (1 of 8)
  - unusual orientation — an upside-down face shot from above a lying subject (1 of 8)
  - borderline with the waist shot: with the face at 20–25 % of the height the frame already reads as a medium shot (1 of 8)
status: code
fallback: a real medium close-up from the source footage is better; in code — a ×1.5–2 crop of a waist or medium shot by track(face) (lossless from 4K, from 1080p no more than ×1.3); if the subject exists only in wide shots — another take from the source footage or generation with consent
params:
  face_h: 28–60 % of frame height, typically 40–50 %
  iod: interpupillary 10–22 % of frame height
  eye_line: 0.33–0.45 from the top (typically 0.36)
  frame_bottom: mid-chest to the armpits; don't cut at the neck, elbows or waist
  face_x: 0.48–0.52 frontal; 0.32–0.44 or mirrored 0.56–0.68 when looking sideways
  duration: 2–4.5 s (50–110 frames @25 fps); in dynamic cutting 1–1.5 s (25–38 frames)
  camera: static, jitter ≤0.6 % of the frame; optionally a slow push-in ×1.1–1.4 over 1–2 s
  pair: a close-up of the same subject — face 1.6–2.5 times larger; a waist shot — 1.5–2 times smaller
  crop: S = 0.45·H / face_h_px, eyes at 0.36; limit without upscaling ×1.3 (1080→1080), ×2 (4K→1080)
when: speech to camera, an interview, a shot/reverse-shot dialogue, a reaction with a gesture; the base shot for a talking head — the meaning rests on it, while the close-up comes as an accent; alternating medium close-up ↔ close-up every 1–2 phrases holds attention; calm verses and instrumental breaks in music videos; introducing the subject after a wide shot
avoid: two medium close-ups of the same subject in a row without a change of shot size or angle (jump cut); cutting at the joints — neck, elbows, waist; headroom over 15 % of the height; long medium close-ups in fast cutting for phonk or sport — they slow the rhythm; the subject at the very edge of the frame with no lead room for the gaze
sfx: the voice is the main layer, the music under it ducked by −8…−12 dB; on cuts between the medium close-up and the close-up — no hits, at most a light tick on the beat
genres: {explainer: signature, ugc: signature, drama: allowed, motivation: allowed, fashion: allowed, sport: allowed, travel: allowed, product: allowed, viral: allowed, teaser: allowed, calm: allowed, clips: allowed}
