id: shot.extreme_wide
family: shot
group: angle
level: A
aliases: [extreme wide shot, EWS, extreme long shot, ELS, very long shot, panoramic shot, landscape with a tiny figure]
what: extreme wide shot — a landscape or a huge interior where a person or a car is a small dot, or absent altogether; scale, emptiness and place say more than the subject; the shot opens up the world, separates chapters and shows loneliness
frames: |
  1. Scale: a person 3–12 % of frame height (a splash in a lake ≈3 %, a running silhouette ≈5 %, figures by a pool
     10–12 %), a car 4–11 % (6.7 and 10.8 % measured). In 2 of 8 there are no people — an empty road at dusk,
     a giant object above a mountain. A borderline case — a figure ≈24 % of the height but only ≈2 % of the area: everything
     else is the dark volume of a huge hall with a beam of light.
  2. The environment — 85–100 % of the area: forest and water, a field in fog, hills and a road, the sky. The horizon is placed boldly:
     high (0.08 — a field up to the fog), around a third (0.35 — a ridge), low (0.78 — sky over three quarters).
  3. The event is a dot: a splash, a car driving away down a road, a runner on a ridge, a figure in a beam. Often night or
     dusk, the light paints the frame (4 of 8): streetlights, a beam, a sunset, lights.
  4. The camera is static in 7 of 8 (jitter ≤0.09 %); in one — a follow move after a car with 0.69 % jitter and
     a final 4 % reframe over 0.4 s.
  5. Length 1.7–4.7 s, typically 3 s.
variants:
  - a dot-event in nature — a splash in a lake, a runner on a ridge at night (2 of 8)
  - a car in a landscape — driving away down a winding road or standing in a field shot obliquely from above (2 of 8)
  - an empty landscape — a road to the horizon at dusk, sky over three quarters, no people (1 of 8)
  - people in the environment — two figures by a pool in backlit sun with flares (1 of 8)
  - the scale of architecture and wonder — a figure in a beam in a huge hall; an object the size of a mountain (2 of 8)
status: footage
fallback: an extreme wide shot can't be made in code from a tighter one; from a 4K extreme wide shot you can cut two shots — the extreme wide itself and a wide shot; a simple background (sky, field, water) can be extended 1.5–2 times via outpaint, turning a wide shot into an extreme wide; if the location isn't in the source footage — generate a landscape with a small figure with the user's consent (cheaper and more honest than replacing the subject)
params:
  subject_h: a person 3–12 % of frame height, a car 4–11 %; or no subject; the figure ≤2 % of the frame area
  environment: 85–100 % of the frame area
  horizon: 0.08–0.35 (the ground dominates) or 0.65–0.80 (the sky dominates); not at 0.5
  duration: 2.5–5 s (63–125 frames @25 fps), typically 3 s; in fast cutting no shorter than 1.5 s
  camera: static (jitter ≤0.1 %); a slow follow move after a car or a drift ≤0.5 % of the frame per frame is acceptable
  light: dusk, night, backlit sun — a frequent choice (4 of 8)
  vertical: 9×16 from 16×9 loses the landscape — a window on the dot-event with the horizon on a third, or generate a vertical extreme wide shot
when: opening a video or a chapter — "the world" in 3 s, before the wide shot; a transition between locations and times of day; loneliness, smallness, waiting, the end of the road — a small subject in a huge world; the scale of an event — a splash-dot, lights, an object the size of a mountain; the ending — the subject walks away or remains a dot; a breather after a dense scene; in travel and epic videos — the backbone; 1–3 times per video
avoid: moments where the face and a line matter; low resolution — the dot-event gets lost in the pixels, especially in vertical; fast cutting over an extreme wide shot — the landscape doesn't have time to read; several extreme wide shots in a row without a change of scale; a shaky or tilted horizon for no reason
sfx: wide ambience — wind, a distant rumble, silence with a single event sound (a splash, an engine, distant footsteps); a musical pad or a long note; at a chapter opening — a low hit or a swell on the cut
genres: {epic: signature, travel: signature, calm: signature, drama: allowed, motivation: allowed, teaser: allowed, sport: allowed, fashion: allowed, product: allowed, fanedit: allowed, clips: allowed, viral: allowed, explainer: allowed, phonk: allowed}
detect: |
  Person detector or pose (mediapipe) on frames every 0.5 s: a person ≤0.15 of frame height or no people;
  YuNet finds no faces even on a frame upscaled ×4 (7 of 8; in the eighth — a single false detection of 2 % on lights). There is a horizon or an environment boundary (field, water,
  ridge, tree line) offset from the middle of the frame (0.08–0.35 or 0.65–0.80).
  ed_motion: "no significant global motion" in 7 of 8, jitter ≤0.1 %; brightness is often low (night, dusk).
  Differences: shot.wide — a person 18–50 % of the height, the face 2–8 %; angle.birds_eye — a view straight down with no horizon;
  drone.aerial — the camera flies, the horizon and the high angle are tilted, the movement is visible in ed_motion.
engine: |
  classify_shot(clip, by='person') → size='EWS' with person_h ≤0.15·H, or with no people and a horizon in frame.
  Placement: chapter opening — EWS (3 s) → shot.wide → tighter (scene_funnel(order=['EWS', 'WS', 'MS', 'CU'])).
  Synthesis: outpaint(scale=1.5–2) of a wide shot with a simple background; from a 4K extreme wide — two shots: the full frame and
  shot_crop(size='WS', target=track(person)).
  Vertical: reframe('9:16', target=track(person)|object:<dot_event>, keep_horizon='thirds').
