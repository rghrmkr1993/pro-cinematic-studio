when: |
  A portrait of a place and its people: travel, a city, working professions, "meet the team" in a product video, a casting
  of characters in fashion and music videos, the end of a documentary block. A series to a steady beat — on a verse or a bridge; a single one — at the start
  or the end of a chapter. No more than one series per 20–30 s.
avoid: |
  The person talks or acts actively — then it is an interview or a reportage. Different shot sizes and centering in a series —
  the rhythm breaks. Longer than 3–4 s on one portrait without camera movement. An awkward, "uncomposed" pose — a portrait rests
  on the subject's confidence.
