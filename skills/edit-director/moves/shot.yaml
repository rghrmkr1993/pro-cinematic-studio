id: shot.wide
family: shot
group: angle
level: A
aliases: [wide shot, WS, long shot, LS, wide, full-body subject in the environment]
what: wide shot — the whole subject with the location around them; the shot answers the questions "where", "who stands where" and "how the subject relates to the space", so it opens scenes and gives the viewer back the geography
frames: |
  1. The whole figure: a standing subject 20–45 % of frame height (42–45 % closer, 20–29 % deeper), a seated or
     crouching one 15–55 %; head and feet in frame. The face is small — 2–8 % of frame height (the detector finds it
     only on an upscaled frame).
  2. The environment takes up more than half the frame: a hall, a street, a field, a beach, a forest. The subject can also be an object — a car
     at night at 8 % of frame height ≈.
  3. Composition: the subject on a third (x 0.30–0.40 or 0.60–0.72) in 6 of 9, centered in 3 (a symmetrical hall,
     a passage, an arch). On location the horizon is offset from the middle: low (0.62–0.70 from the top, the sky dominates) or
     high (≈0.25, the ground and the road dominate).
  4. The camera is static in all 9 examples (jitter ≤0.32 % of the frame); movement comes from the subject — walking, sitting down,
     appearing in a lit doorway; sometimes a light in the frame switches on or off.
  5. Length 1.9–6 s, typically 3–3.5 s — longer than close-ups: the viewer needs time to read the space.
variants:
  - a figure in a landscape — a silhouette at sunset, by a road, in a field; horizon low or high (3 of 9)
  - figures in architecture — a hall, a gym, a city street; deep perspective, symmetry, two people far apart (3 of 9)
  - emptiness around — a seated subject among empty rows of seats; a long static shot (1 of 9)
  - a couple in the environment — two people sitting on a beach, mountains on the horizon (1 of 9)
  - an object instead of a subject — a car in an empty lot at night under a streetlight (1 of 9)
status: footage
fallback: a wide shot can't be made in code from a close-up; if there is a tighter shot (full body or medium) with a simple background (sky, wall, field) — extend it 1.5–2 times via outpaint; from a 4K extreme wide shot a wide shot is cut out with a ×1.5–2 crop; if the location isn't in the source footage — generate a wide shot of the location with the user's consent
params:
  subject_h: standing 20–45 % of frame height (typically 30–40 %), seated 15–55 %; head and feet in frame
  face_h: 2–8 % of frame height
  environment: the environment takes more than half of the frame area
  placement: the subject on a third (x 0.30–0.40 or 0.60–0.72); center — with a symmetrical hall, arch, corridor
  horizon: on location 0.62–0.70 (sky) or 0.25–0.35 (ground), not at 0.5
  duration: 2.5–5 s (63–125 frames @25 fps), typically 3.5 s; in fast cutting 1–1.5 s (25–38 frames)
  camera: static (jitter ≤0.35 %); a slow push-in or pull-out ≤×1.1 over the shot is acceptable
  crop: from a 4K extreme wide — a ×1.5–2 window on the subject; in 9×16 — a window on the subject with ≥30 % of environment above the head
when: opening a scene or a change of location — "where are we" in 2–4 s, before medium shots and close-ups (the funnel wide → medium → close-up); returning to a wide shot after 3–5 close-ups to restore the geography and give a pause; loneliness, emptiness, scale — a small subject in a big space; the end of a scene — the subject walks off into the depth or stays alone; in music videos — the intro, the bridge, long notes; in travel and calm videos — the main material
avoid: emotional peaks and lines where the eyes are needed; a wide shot cropped to 9×16 so that the environment is gone and the subject is still small; several wide shots in a row without a change of scale or angle; the horizon exactly in the middle and the subject exactly in the center without symmetrical architecture — static and empty; a shaky handheld wide shot for no reason
sfx: the ambience of the place — wind, city, hall echo, surf, distant footsteps; the music opens up wider; on a cut from a close-up to a wide shot in fast cutting — a soft whoosh or an airy sweep
