id: crane.pedestal
family: crane
group: camera
level: A
aliases: [pedestal, vertical camera move, camera rise, camera descent, pedestal up, pedestal down, vertical tracking shot, elevator shot]
what: the camera travels strictly up or down without tilting — it rises from behind the foreground, descends to the characters or moves from floor to floor
frames: |
  1. Start: the frame is often covered by the foreground (the back of a sofa, the edge of a table — up to 100 % of the frame dark) or sits on
     one "floor" of the scene.
  2. Move: a vertical shift of 20–140 % of the frame height over 1.5–4.8 s; the horizon and verticals do not tilt, the scale
     does not change. Peak 3–4.7 % of the height per frame (≈50–80 %/s), then a long landing: the speed drops 10–40 times
     over the last 1–2 s (ease-out), or an even S-curve.
  3. Parallax: the near plane moves 3–10 times faster than the far one (the back of the sofa drops away in 0.5 s, the room
     almost stands still); on a flat facade the shift is the same over the whole frame height.
  4. Landing: the frame settles on the characters or on a new "floor" and holds for 0.5–2 s.
variants:
  - rise from behind the foreground: the camera rises above the back or the edge — the scene opens up (from black into the shot)
  - descent behind the foreground: an object "grows" from below and covers the scene (a wipe)
  - floors and windows: a move along a facade, a train car or a cutaway house from one window to another, without parallax
  - through a surface: descending underwater or out from under a table, then a cut
  - to eye level: from a high wide vantage point down to a couple in the foreground
status: footage
fallback: |
  code: a vertical crop move over a tall or 4K frame — looks honest on flat scenes (a facade, a cutaway, a wall of windows);
  for a scene with a foreground — 2.5D: the foreground mask moves 3–5 times faster than the background; otherwise search the source footage
  or generate from the gen_hint
params:
  amplitude: 20–140 % of the frame height per move
  duration: 1.5–4.8 s (38–120 frames @25 fps)
  speed: peak 3–4.7 % of the height per frame (≈50–80 %/s), calm 0.5–1.5 %/frame
  ease: outCubic (fast start, long landing) — reveal rise; inOutCubic — floors
  parallax: near / far = 3–10× with a foreground; 1× on a flat facade
  start_cover: up to 100 % of the frame covered by the foreground at the start of a reveal rise (0.3–0.6 s)
  hold_after: 0.5–2 s
  fake_parallax: foreground mask × speed 3–5, background × 1, no rotation
when: revealing a scene or a hero at the start of an episode and in the intro; a rise from behind an object on a downbeat; a transition between "floors" and rooms within one scene (dollhouse); descending to a couple to lead into a dialogue; product — a rise from behind the edge of a table to the product
avoid: mixing with a tilt (the verticals start to converge — reads as a sloppy tilt); a rise after which there is nothing to show; a crop imitation on a scene with a close foreground and no parallax (looks like the picture sliding); too fast a move without motion blur
sfx: usually no effects; on a reveal — a build or a soft swell toward the landing; when passing through water — a gulp and muffled sound
genres: {product: allowed, travel: allowed, drama: allowed, calm: allowed, explainer: allowed, teaser: allowed, fashion: allowed, epic: allowed, viral: allowed, clips: allowed}
detect: |
  ed_motion: a vertical SHIFT (content moves UP/DOWN) of 20–140 % over 1.5–5 s, horizontal < 5 %, ZOOM ±5 %, ROTATE < 3°;
  black or dark frames at the start when rising from behind the foreground. Own check over three bands of the frame:
  in a pedestal the near plane moves 3–10 times faster than the far one; on a flat facade the bands move equally.
  Difference from tilt: in a tilt the camera rotates — all depths shift equally, but the verticals and horizontals
  bend and converge (the perspective changes); in a pedestal the lines stay parallel.
  Difference from a crane: a crane rises above human height and usually with an arc or a turn.
engine: |
  Real shot: cut(at) — the start of the move, the end 0.5–2 s after the landing.
  Code (flat scene): transform(shift=[[0, y0], [0, y1]], t=[t0, t0+D], ease='outCubic') over a tall crop, |y1−y0| ≤ headroom.
  2.5D: mask(method='hf_remove_background'|'mediapipe_person') for the foreground → transform(shift=[[0,0],[0, 3–5·dy]]) on the mask
  + transform(shift=[[0,0],[0,dy]]) on the background + composite; at a speed above 4 %/frame — blur(kind='directional', angle=90).
gen_hint: camera on a pedestal rises vertically from behind <foreground object> to reveal <scene>, no tilt, perfectly level, strong parallax between foreground and background, slow ease-out landing
commands: ["raise the camera from behind the sofa on the first beat", "a vertical move along the building's windows from floor to floor", "lower the camera to the couple in #2", "do a reveal rise from behind the table edge to the product"]
related: [tilt.basic, crane.telescopic, dolly.in, pan.basic, scene.diorama]
evidence: {examples: 5, sources: 5, measured: "shift 20–139 % of the height over 1.5–4.8 s; peak 3.9–4.7 %/frame (≈60–80 %/s); ease-out landing — the speed drops from 4.7 to 0.1 %/frame over 2 s; near/far parallax 3–10× in 3 of 5, a flat facade (1×) in 1; in 1 of 5 the start is from complete darkness behind the foreground; horizontal shift < 5 %, no tilt", confidence: high}
