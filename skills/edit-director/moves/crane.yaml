id: crane.telescopic
family: crane
group: camera
level: B
aliases: [telescopic crane shot, crane shot, crane move, telescopic crane, jib arm, boom move, swoop shot, crane down onto the hero]
what: a long smooth camera move on a telescoping arm — over tables, a sofa, a crowd, through a window or a door; in a single move the camera changes both height and distance, leading from a wide view right to the hero or revealing the space on a pull-out
frames: |
  1. Start: a wide view of the location — often from above or from behind an obstacle (outside a window, a door, behind the back of a sofa).
  2. The move as a single continuous take of 1.5–5.5 s, the speed almost constant (6 of 8 — an even curve, 2 — accelerating toward the end):
     push-in ×1.4–3.8 over 2.5–4 s (≈×1.004–1.02 per frame @25 fps); through openings — up to ×19 over 3 s (≈×1.04 per frame);
     pull-out ×0.33–0.46 over 1–1.5 s (≈×0.955–0.98 per frame).
  3. The height changes along the way (3 of 8): the camera descends from under the ceiling to a face or rises on a pull-out —
     the picture slides by 24–38 % of the frame while the arm compensates the tilt. Sometimes a slight roll of ±5–10°.
  4. Real parallax: near objects (tables, chair backs, window frames, dancers) float past faster than the background —
     nonrigid 0.10–0.43 (median ≈0.27), whereas for a digital zoom it is below 0.15.
  5. Landing: a medium or medium close-up shot of the hero or an object; on a pull-out — a wide shot of the room or the crowd.
variants:
  - descent to the hero — from under the ceiling over the chaos of a room, down and forward to the face (1 of 8)
  - push-in through space — along a long corridor, through a glass door across the whole room to the hero (2 of 8)
  - pass-through — from outside a car, through the cabin and a pickup window into a kitchen up to a large object, ×19 over 3 s (1 of 8)
  - glide over a table — slowly along a serving counter or a table with dishes and hands (1 of 8)
  - rise-and-push toward a window — up the facade and closer to the people behind the glass (1 of 8)
  - reveal pull-out — back and up over a sofa or among dancers, revealing the room and the crowd (2 of 8)
status: footage
fallback: a real crane move is searched for in the source footage (long smooth push-ins and pull-outs with parallax, an indoor drone, a stabilizer on a pole); in code — a digital push-in over a 4K frame gives only ×1.3–2 and no parallax (nonrigid <0.15 gives away the fake); a layered imitation is better — cut the foreground out with a mask or by depth and move it faster than the background (parallax ×1.4–2); a pass-through via openings and a descent from a height — only generation with the user's consent
params:
  scale: push-in ×1.4–4 (typically ×2.5–3.8); pass-through up to ×20; pull-out ×0.33–0.5
  duration: 1.5–5.5 s (38–138 frames @25 fps), typically 3 s
  rate: push-in ×1.004–1.02 per frame @25 fps (pass-through up to ×1.04), pull-out ×0.955–0.98 per frame
  ease: linear (constant speed) or inQuad toward the end; no hard landing — the move is cut off by a cut or settles softly over 0.3–0.5 s
  vertical: with a height change the picture shifts by 24–38 % of the frame per move (descent — the picture moves up, rise — down)
  roll: optionally ±5–10° during the move
  parallax: nonrigid 0.1–0.45; in an imitation — the foreground 1.4–2 times faster than the background
  landing: a medium or medium close-up shot of the hero or an object (push-in); a wide shot (pull-out)
when: opening a scene with one "place → hero" move instead of a wide-medium-close-up cut sequence; a transition from outside to inside (through a window, a door, a shop window); revealing scale on a pull-out — the ending, a chorus, a crowd's entrance; a product video — gliding over a table or a counter to the product; music videos — a move through the choreography; no more than 1–2 such moves per video, the start of the move on a downbeat, the landing on the next phrase
avoid: short pieces under 1.5 s — the move does not read and looks like a jerk; tight shots without a near plane — no parallax, the move is indistinguishable from a zoom; back to back with other big camera moves; speed breaks and shake on the landing; deliberately "everyday" videos — an expensive smooth crane breaks the shot-on-a-phone feel
sfx: an even airy swell or a riser over the whole move, an accent or a hit on the landing; on a pass through a window — a short whoosh at the moment of the opening; in a product video — foley of the object on the landing (a hiss, a click, a clink)
genres: {product: signature, epic: allowed, fashion: allowed, teaser: allowed, drama: allowed, travel: allowed, calm: allowed, motivation: allowed, sport: allowed, fanedit: allowed, viral: allowed, ugc: forbidden}
detect: |
  ed_motion: one long ZOOM-IN ×1.4–20 or ZOOM-OUT ×0.33–0.5 over 1.5–5.5 s without cuts, the curve almost straight
  (or accelerating), nonrigid 0.10–0.45 (parallax), often together with a SHIFT of 20–40 % "[during zoom]" — a height change,
  sometimes ROTATE ±5–10°. Visually: foreground objects (tables, chair backs, window frames, people) float under or across the frame.
  Differences: zoom.in and zoom.slow — nonrigid <0.15, objects do not newly overlap one another; dolly.in — the camera
  at one height, usually ×1.1–2, no flying over obstacles; dolly.float — eye height, a walking sway;
  crane.pedestal — a purely vertical move, scale ±5 %; drone.fpv — rolls of 20–45°, high speed, outdoor locations;
  pass.through — at the moment of passing 3–8 dark or blurred frames hide a cut.
engine: |
  Imitation on 4K: transform(scale=[1, S], center=track(target), shift=[[0, 0], [0, dy]], t=[t0, t0+D], ease='linear'),
  S ≤ 2, dy = 0.1–0.2 of the frame for a "descent".
  Layered imitation: layered_push(fg=mask(method='hf_remove_background'|'depth'), bg_scale=[1, S], fg_scale=[1, S·k],
  k=1.4–2, t=[t0, t0+D], ease='linear') — a new primitive: the foreground grows faster than the background, holes in the background are filled by outpaint.
  Placement: the start of the move — beat_sync('downbeat'), the landing — on the next phrase; sfx('riser', at=t0, align='attack') +
  sfx('impact', at=t0+D) or a soft swell.
gen_hint: smooth telescopic crane shot that starts high above <location> and glides down and forward over <tables/furniture/crowd> through <window/doorway> to land in a medium shot of <subject>, constant speed, real parallax, no shake, cinematic lighting
commands: ["open the scene with a crane descent to the hero", "at the end, a crane pull-out up and back", "find long smooth camera moves in the source footage", "fake a layered crane push-in on #4"]
related: [crane.pedestal, dolly.float, pass.through, dolly.in, drone.fpv, zoom.slow]
evidence: {examples: 8, sources: 8, measured: "push-ins ×1.43, ×1.62, ×2.58, ×3.71, ×3.79 over 2.5–4 s and ×19.4 over 3 s (pass-through); pull-outs ×0.33 over 0.96 s and ×0.46 over 1.52 s; even curve in 6 of 8, acceleration in 2; nonrigid 0.10–0.43; height shift 24–38 % in 3 of 8; roll ±5–10° in 2 of 8; clips 1.56–5.46 s", confidence: high}
