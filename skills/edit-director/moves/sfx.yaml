id: sfx.impact
family: sfx
group: sound
level: A
aliases: [impact, hit, boom, cinematic hit, bass hit, thud, punch hit, trailer hit]
what: "impact — a short low hit on a cut, a punch-in or the landing of a move: a click, a body falling in pitch and a tail; from a dry punch to a cinematic boom"
frames: |
  Timing is counted from the hit frame: a cut, the landing of a jerk, a contact in frame, a white flash, the first frame
  of a punch-in, a text "slam".
  1. Attack 0–5 ms: a click transient (2 ms of noise above 2 kHz) and the body hit; the sound starts on the first frame
     of the event (+0…+10 ms) and never earlier than −1 frame (−40 ms @25 fps, −33 ms @30 fps).
  2. Body 40–150 ms: a "kick" with pitch falling 120–160 → 40–55 Hz and noise crackle up to 2.5–3 kHz; the body dies
     away in 0.1–0.4 s.
  3. Tail: dry — 0.3–0.6 s; cinematic — a 40 Hz sub tail for another 1–1.5 s and a hall reverb of 2–3 s at −10 dB.
  An on-beat hit lands on the track's kick within ≤10 ms — otherwise a double attack is audible.
variants:
  - "dry punch: 0.4–0.6 s, click + body + short crackle — punch-in zoom, on-beat cut, text \"slam\", contact in frame"
  - "cinematic boom: 2–3 s, sub tail and hall — drop, title drop, crash zoom landing, final packshot"
  - "soft knock: 0.5–0.7 s, dark, no click, with a 250–600 Hz \"knock\" — product close-ups, calm cuts, silence in a teaser"
  - "metallic (trailer): boom + inharmonic ring and a long hall — teaser cards, intertitles, a hit on every fly-in"
  - "hit-stop: a punch or boom followed at once by 0.3–1 s of music silence — \"chaos → silence\", freeze frame, comedic stop"
  - "stretched: a boom with pitch ×0.7, decays ×2 and a 4 s hall — the moment of contact in super slow motion, a heavy landing"
  - "chord hit: boom + a short saw-wave chord in the track's key — a retro-style title, an \"orchestral\" accent on a cut"
status: code
fallback: |
  Code synthesis is always available. If the track already has a powerful hit on this beat (kick with a cymbal, low_flux
  in the top 2 % for the track) — don't double the body: only the click and crackle through a 150 Hz HPF at −10 LU, or
  nothing. A remake on the reference's audio — the hits are already baked in. The user's own sounds — with the same
  rules for attack, loudness and limits.
params:
  render: "48 kHz, float32; body and sub — mono in the center (everything below 150 Hz is mono), width only on the crackle and the reverb"
  punch: "body: a sine with falling pitch f(t) = 50 + 110·exp(−t/25 ms) Hz, amplitude exp(−t/120 ms), attack 1 ms; crackle: pink noise, LPF 3 kHz, exp(−t/30 ms), −6 dB; click: 2 ms of white noise in a cosine window, HPF 2 kHz, 0 dB; tanh saturation, drive 2; reverb 0.35 s, −18 dB; D 0.6 s with a 60 ms fade"
  boom: "body f(t) = 40 + 80·exp(−t/60 ms) Hz, amplitude exp(−t/350 ms); sub tail — a 40 Hz sine, 30 ms fade-in, exp(−t/0.6 s), −6 dB; crackle — pink noise, LPF 2.5–3 kHz, exp(−t/120 ms), −4 dB; click −3 dB; drive 2.5; hall RT60 2.5 s, wet −10 dB, reverb input through a 200 Hz HPF (a tail without mud); D 3 s, fade 0.2 s"
  soft: "body f(t) = 55 + 35·exp(−t/30 ms) Hz, exp(−t/150 ms), no click; \"knock\" — band-pass noise 250–600 Hz, exp(−t/40 ms), −6 dB (without it nothing is audible on a phone); drive 1.2; LPF 1.2 kHz; reverb 0.4 s, −20 dB; D 0.7 s"
  metal: "boom + ring: 6 sines f0 = 180–400 Hz × 1, 1.47, 2.09, 2.56, 3.14, 3.87, decay 1.2 → 0.4 s (the upper ones shorter), random phases, −8 dB; or FM: carrier f0, modulator ×1.41, index 8 → 0 along exp(−t/0.3 s), amplitude exp(−t/0.9 s); band 300 Hz–5 kHz; hall 3 s"
  stop: "any variant + muting the music from the attack for 0.3–1 s (until the next downbeat), the music returns on a beat with no fade"
  stretched: "a boom with all frequencies ×0.7 (body 28 + 56·exp(−t/0.12 s) Hz), all decays ×2, hall RT60 4 s, wet −8 dB; crackle and click −6 dB"
  chord_hit: "boom + a saw-wave chord (root, fifth and octave of the track's key; 2 voices each at ±10 cents), attack 5 ms, decay exp(−t/0.4 s), LPF 4 kHz, −6 dB relative to the body; key from the ed_audio chroma, without it — boom only"
  phone_check: "loudness of the first 400 ms after a 4th-order 180 Hz HPF — no lower than the full-band loudness −12 LU (soft −15 LU); otherwise raise the crackle or the knock by 2–3 dB"
  placement: "align='attack' (attack = the first sample above −20 dB from the peak): event frame +0…+10 ms; an event within ±1 frame of a beat — attack on the beat, sample-accurate (≤10 ms from the track's kick), the cut on the nearest frame; crash zoom — the last frame of the jerk; punch-in — the first frame of the scale-up; text — the frame where the scale settles at 1.0; flash — the first white frame"
  level: "rel_lu — K-weighted loudness of the hit and the music in the same window from the attack (100 ms for punch and soft, 400 ms for boom and metallic): punch −6 LU (−9…−4), boom on the drop −2 (−4…0), metallic −4 (−6…−2), soft −10 (−14…−8) and only where the music is sparse (M_music < I_music − 4); the reference is never below I_music − 12 LU"
  ducking: "music in the 30–150 Hz band under the hit −3…−6 dB: attack 2 ms, hold 60 ms, release 200 ms (boom — 400 ms); on the main hit another −1…−2 dB broadband; on a beat with a strong track kick — the hit's body through a 60–80 Hz HPF or −3 dB"
  stack: "impact + sub drop on one attack — both −3 dB, remove the boom's sub tail; whoosh + impact — the whoosh peak and the hit attack on the same frame; riser + impact — the end of the riser on the attack"
  variation: "for each placement — a new seed, pitch ±1 semitone, decay ±15 %, level ±1.5 dB — no \"machine-gun\" effect; a series in the drop — each next one 1–2 dB quieter"
  headroom: "master limiter on the hit — gain reduction ≤3 dB (main) and ≤1.5 dB (others), otherwise lower the hit by the difference; SFX bus true peak ≤ −3 dBTP before summing with the music"
  limits: "main (boom) — 1 per drop or section, no more than 1 per 15 s; regular ones — ≤3 per 10 s; a phonk or sport drop — up to 1 per beat for no longer than 2 bars, then ≤1 per bar"
when: |
  Downbeat and drop — the main hit on the best frame; title drop and the final card; the landing of a crash zoom, a
  whip transition, a camera throw; a punch-in zoom on the accent of a line (clips, motivation); a freeze frame with text
  (sport); "silence → hit" in dramatic edits — after 0.3–1 s of silence; on-beat cuts at the start of phrases (secondary
  hits — on 2 and 4).
  hook — 1 hit on the first hook frame or title; build — sparse, on downbeats; drop — the main one on the first beat and
  up to 1 per beat for 1–2 bars in energetic genres; outro — a final hit on the packshot or logo, or a hit-stop.
  Limit: main 1 per 15 s, regular ≤3 per 10 s.
avoid: |
  A hit on every cut — it loses its value; the calm genre; a hit between beats with no visible contact; over a powerful
  hit in the track itself (mud and limiter pumping) — only a light click there; under spoken words — only in pauses
  ≥150 ms; impact + sub drop + riser at full volume at once (the limiter squashes more than 3 dB); the same buffer
  twice in a row; a long hall tail in fast cutting — the tails pile up into a rumble.
sfx: |
  It is itself the sonic full stop. Pairs: before it sfx.whoosh (peak on the cut frame) or sfx.riser (ending on the
  attack); under it sfx.sub_drop on the drop (both −3 dB); after a hit-stop — silence until the next beat.
genres: {epic: signature, drama: signature, sport: signature, teaser: signature, phonk: allowed, viral: allowed, motivation: allowed, product: allowed, travel: allowed, fashion: allowed, fanedit: allowed, clips: allowed, explainer: allowed, ugc: allowed, calm: forbidden}
detect: |
  With a clean track (remake): the difference of log spectra after ed_audio.align and band equalization (6 dB threshold,
  max filter on the track ±2 frames) — a section with an attack ≤1 analysis frame (11.6 ms; 4–6 ms for synthesis),
  ≥80 % of the difference energy below 200 Hz, the centroid after the attack falls 5–40 times within 50 ms (click
  4–7 kHz → body 60–170 Hz); the 30–150 Hz band decays by −20 dB in 0.25–0.4 s for a punch, 1–2 s for a boom; hall tail
  in 0.2–2 kHz 0.5–3 s.
  Without a clean track: a single peak of ed_audio onset and low_flux in the same frame; compare with the same position
  in the bar in 4 neighboring bars of the section — a 30–150 Hz peak higher by ≥3 dB or a −20 dB decay longer by ≥×2
  (boom ≈1.3 s versus 0.3–0.5 s for a kick) — a candidate. A hit that coincides with a kick of the same loudness and has
  no tail barely separates (+2 dB) — confirm with the picture.
  Picture (ed_motion): a cut within ±1 frame, flash/white frames, ZOOM-IN over 1–3 frames (punch-in), the start of shake
  (jitter), hold (freeze frame) from this frame.
  Distinctions: sub drop — pitch falls ≥1 octave over 0.5–3 s, no click; track kick — on the grid in every bar and
  without a tail; crash cymbal — energy above 4 kHz and a long decay; whoosh — a smooth rise of ≥60 ms to the peak.
engine: |
  sfx('impact', at=t_hit, align='attack', variant='punch'|'boom'|'soft'|'metal'|'stretched'|'chord', rel_lu=-6, stop=0|0.3–1.0, seed=k)
    punch = chirp(f=50 + 110·exp(−t/0.025), wave='sine') × env(a=1 ms, decay=0.12) + noise('pink') → lp(3000) × env(decay=0.03) @ −6 dB
            + click(dur_ms=2, hp=2000) → drive(2.0) → verb(0.35, -18, hp_hz=200) → fade(out_ms=60)
    boom  = chirp(40 + 80·exp(−t/0.06)) × env(decay=0.35) + sine(40) × env(a=30 ms, decay=0.6) @ −6 dB
            + noise('pink') → lp(2800) × env(decay=0.12) @ −4 dB + click @ −3 dB → drive(2.5) → verb(2.5, -10, hp_hz=200) → fade(out_ms=200)
    soft  = chirp(55 + 35·exp(−t/0.03)) × env(decay=0.15) + noise('white') → bp(250, 600) × env(decay=0.04) @ −6 dB → drive(1.2) → lp(1200) → verb(0.4, -20)
    metal = boom + partials(f0, ratios=[1, 1.47, 2.09, 2.56, 3.14, 3.87], decay=[1.2 … 0.4]) @ −8 dB | fm(f0, ratio=1.41, index=8→0, tau=0.3) → verb(3.0, -10)
    stretched = boom with pitch(×0.7) and decay(×2) → verb(4.0, -8); chord = boom + chord(key_root, [1, 1.5, 2], wave='saw', detune_c=10) × env(a=5 ms, decay=0.4) → lp(4000) @ −6 dB
  New blocks: click(dur_ms, hp), partials(f0, ratios, decay), fm(carrier, ratio, index, tau), mono_below(150).
  duck(music, under='sfx:impact', band=[30, 150], depth_db=4, attack_ms=2, hold_ms=60, release_ms=200);
  stop>0 → mute(music, t=[t_hit, next_downbeat]).
  beat_sync(event='impact', grid='1/4') — attack on the beat, sample-accurate; mixing via sfx_bus(hpf_hz=30, tp_ceiling_dbtp=-3);
  qa_sfx(max_gr_db=3, per_10s=3, phone_delta_db=-12) — master-limiter gain reduction and the phone check.
gen_hint: "not generated — synthesized in code. For generated shots with native audio ask for no music and no sound effects. Reference description: a deep cinematic hit — a tight click on top of a low thump that falls in pitch, a short crackle and a long dark hall tail, mono low end"
commands: ["a hit on the drop on #7", "a boom when the title appears", "soft knocks on the packshot cuts", "a hit and silence on the freeze frame at 0:12", "keep the hit only on the drop", "hits on every beat for two bars in the drop"]
related: [zoom.crash, zoom.punch, shake.beat, trans.flash, cut.crash, time.freeze, type.title_card, light.flash, cut.match, sfx.sub_drop, sfx.whoosh, sfx.riser]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
