id: sfx.glitch
family: sfx
group: sound
level: B
aliases: [glitch sound, glitch, digital glitch, digital crackle, stutter, beat repeat, track stutter, bitcrush, tape stop, record scratch, scratch, click, tick, static, interference]
what: "glitch sound — digital clicks, crackle and track stutters to go with glitch effects; this also covers a single click-tick, tape stop and record scratch"
frames: |
  The sound runs frame for frame with the glitching picture.
  1. Start: on the first frame of the glitch — a hard entry with no fade (0.2 ms), full volume at once.
  2. Burst 40–400 ms (1–10 frames @25 fps, 1–12 @30 fps): a chain of 8–40 ms slices — bitcrushed noise, square-wave
     beeps at 300–3000 Hz, a repeated snippet of the track, holes of silence; the slice changes with the state of the
     picture (every 1–3 frames); the pan jumps from slice to slice within ±0.7.
  3. End: a cut-off on the last frame of the glitch (≤10 ms); the music comes back with no fade, ideally on a beat.
  Track stutter: a 1/16-note piece (125 ms at 120 BPM) repeats 4–16 times, speeding up to 1/32 and 1/64, and releases
  the track exactly on a downbeat. Tape stop: the track speed goes 1 → 0 over 0.3–1 s, the pitch drops with it, then
  silence. Click — 1–5 ms, a single point on the cut frame.
variants:
  - "digital burst: 40–400 ms of slices under fx.glitch, RGB shift, line shift, pixel sort"
  - "track stutter (stutter, beat repeat): a 1/16 repeat accelerating into the drop; under cut.stutter and beat repeat"
  - "track bitcrush: for the duration of a datamosh or pixel effect the track drops to 6–10 bits and 8–22 kHz"
  - "static and signal loss: hissing crackle of 80–300 ms and holes in the music of 30–120 ms — TV interference, VHS dropout, \"no signal\""
  - "click-tick: a single 1–5 ms click on a cut or on an element appearing; shutter — two clicks 40 ms apart"
  - "tape stop and scratch: the track slows to zero or \"scratches\" back and forth — freeze frame, comedic stop"
  - "8-bit blips: a square wave with a stepped 60–200 ms arpeggio — pixel art, game aesthetics; this also covers the 1 kHz censor bleep"
  - "glitch transition: a 0.3–0.4 s swish through a 6-bit bitcrush with 2–3 holes — for a glitch transition between scenes"
  - "glitch trill: an even texture of 12–24 clicks per second with bitcrush grain over a whole series of flashes or a 0.5–2 s strobe cut"
status: code
fallback: |
  Code synthesis is always available: noise, square waves and pieces of the track itself. If the picture has no
  glitch — don't add a glitch sound (a click on a cut is fine). Stutter and tape stop need an even beat grid: with
  steady=false in ed_audio take the piece length from the nearest real beats, not from the BPM. A remake on the
  reference's audio — everything is already baked in.
params:
  render: "48 kHz, stereo; slice edges without smoothing (0.2 ms) — the clicks at the joins are wanted; HPF 200 Hz on everything except the track stutter"
  burst: "length = length of the visual glitch; slices of 8, 12, 16, 24, 32 or 40 ms at random; slice type: bitcrushed noise 30 % (white noise, 4–6 bits, sample-rate reduction by 4–12 times — down to 4–12 kHz), beep 25 % (square wave 300–3000 Hz or FM: modulator ×2.7, index 2–6), a repeated snippet of the track from the attack point 25 %, silence 20 %; slice level −6…0 dB, pan ±0.7 at random"
  stutter: "a piece of the track from a beat, 1/16 note long (125 ms at 120 BPM), 4–16 repeats; acceleration into the drop — 2×1/16 → 4×1/32 → 8×1/64 (≈31 ms) over the last beat; joins — 2 ms crossfade (0 ms — deliberately dirty); +1 semitone per repeat — optional; the original track is replaced for this time, not mixed"
  crush: "the track for the duration of the effect: 6–10 bits, sample-rate reduction by sample-and-hold without an anti-aliasing filter down to 8–22 kHz (pixel art — 8 bits and 11–22 kHz; datamosh — harsher, 6 bits and 8 kHz), mix 50–100 %; in and out on a beat"
  static: "white noise, HPF 1 kHz, an envelope in 5–20 ms steps + crackle — sparse impulses at 100–300 per second; 80–300 ms; in the music 1–3 cutouts of 30–120 ms down to −40 dB; a tape-hiss bed for the whole episode — pink noise, HPF 2 kHz, steady, −24…−30 LU"
  transition: "a swish (as in sfx.whoosh: white noise, band-pass 1.5 → 6.5 → 4 kHz, Q 3.5) of 0.3–0.4 s → 6-bit bitcrush at 8 kHz → 2–3 holes of 15–30 ms; peak on the cut"
  trill: "clicks (as in click) at 12–24 per second, each with a random center of 2–6 kHz and level ±3 dB, with 6-bit bitcrush grain at −12 dB on top; length = length of the flash series (0.5–2 s); this is a single texture at −12 LU, not clicks on cuts"
  click: "1.5 ms of white noise in a cosine window → band-pass 2–5 kHz, Q 1.2 (random center within this range); shutter — a 3 kHz click + a second one at 1.5 kHz 40 ms later at −4 dB + a dull 180 Hz sine of 15 ms at −10 dB"
  tape_stop: "track playback rate r(u) = (1 − u)^1.5 over 0.3–1 s (the pitch drops with it), LPF 18 kHz·r, then silence until the next downbeat or event; the reverse, a tape start — r from 0 to 1 over 0.2–0.4 s"
  scratch: "a 150–250 ms piece of the track at the event point, playback rate 2.5·sin(2π·4.5 Hz·t) — back and forth, band 200 Hz–4 kHz, 1–2 cycles (0.2–0.45 s), the music under it switched off"
  blips: "square wave (duty cycle 50 % or 12.5 %), 3–4 steps of 30–60 ms (up — \"bonus\", down — \"error\"), 60–200 ms, dry; censor bleep — a 1 kHz sine for the length of the word, 5 ms fades, −6 LU, the word under it is muted"
  placement: "align='attack' on the first frame of the visual glitch (+0 ms); slice boundaries — on the picture's state changes (every 1–3 frames: 40–120 ms @25 fps, 33–100 ms @30 fps); end — on the last frame of the glitch; stutter — start on a beat or half-beat, end exactly on the next downbeat; click — on the cut frame, no more than 8 per second (otherwise they merge into noise); tape stop — start on a beat, freeze frame of the picture from the same frame"
  level: "rel_lu — K-weighted loudness in a 100 ms window from the attack: burst −6 LU (−9…−4), static −10 (−14…−8), click −14 (−18…−10), blips −10; stutter, bitcrush, tape stop and scratch — the track itself at 0 dB: they replace the music rather than add to it; the reference is never below I_music − 12 LU"
  ducking: "a glitch reads through holes, not loudness: in the \"silence\" slices the music is gated down to −30…−40 dB (attack 1 ms, release 5 ms), in the other slices −3…−6 dB"
  variation: "a seed per burst; one set of slice types per video (a palette), different sequences"
  limits: "bursts — ≤2 per 10 s outside glitch series; a series ≤1 s (a trill under a stream of flashes — up to 2 s) and no more often than 1 per 4 bars; stutter — 1–2 per 30 s; tape stop — 1 per video; clicks — only in series that are visible in the picture, ≤8 per second; faster than that is already a trill"
when: |
  In sync with the glitching picture (fx.glitch, datamosh, RGB shift, VHS dropout, TV interference, pixel sort) — a
  burst for every visual burst; track stutter — the last beat or half-bar before the drop and under cut.stutter;
  bitcrush — for the duration of a datamosh or pixel effect; tape stop — a freeze frame, a comedic "stop", the end of
  the video; clicks — photo series, quick inserts, banners and interface elements appearing; themes of digital, games,
  hacking, memory glitches.
  hook — a short glitch on the first glitch frame; build — stutters and bursts on the snare (2 and 4); drop — not on
  the first beat (the glitch comes before the drop, the drop itself is clean); outro — a tape stop or a glitch cut-off
  into the ending.
  Limit: ≤2 bursts per 10 s outside series.
avoid: |
  An audio glitch without a glitching picture — the viewer will think the player broke; over key words of speech and
  vocals; epic and calm genres; a glitch longer than 1 s at a stretch (except a trill under a stream of flashes, up to
  2 s); a glitch on the downbeat of the drop — it eats the payoff; clicks faster than 8 per second;
  the same burst on every join; bitcrush over the whole video; tape stop more than once per video; stutter with an
  unsteady tempo without fitting it to the real beats.
sfx: |
  It is itself the audio glitch. Pairs: after a stutter — sfx.impact or sfx.sub_drop as the track returns on the
  downbeat; clicks — with sfx.whoosh in transition series (a click on the cut, a whoosh on the jerk); after a tape
  stop — silence and a hit on the return.
genres: {phonk: allowed, fanedit: allowed, viral: allowed, teaser: allowed, sport: allowed, clips: allowed, motivation: allowed, fashion: allowed, product: allowed, explainer: allowed, ugc: allowed, epic: forbidden, calm: forbidden, drama: forbidden, travel: forbidden}
detect: |
  With a clean track (remake): the difference of log spectra after ed_audio.align and band equalization (6 dB threshold)
  plus the reverse difference — the mix is quieter than the track by ≥10 dB (holes and replacements). Analysis at a 5 ms
  hop (window 512, hop 256 at 48 kHz): ed_audio frames of 11.6 ms are too coarse for 8–40 ms slices.
  Burst: a 40–400 ms section with ≥3 changes per 100 ms inside, spectral flux with frequent peaks, flatness ≥0.45, the
  centroid jumping between slices by ≥×1.5, holes of 8–60 ms with a dip of ≥20 dB; bitcrush — mirrored spectral images
  above half the reduced sample rate and a raised noise floor.
  Stutter: the mix is self-similar at a lag of a 1/16 or 1/32 note (log-mel frame correlation ≥0.9) for at least 4
  repeats, while the track at that point is not; it ends on a downbeat.
  Tape stop: the whole spectrum slides down — the cross-correlation peak of adjacent log-frequency frames shifts by
  −0.5…−3 semitones per frame, accelerating, the onset fades, the level falls −30 dB over 0.3–1 s, then silence while
  the track keeps playing.
  Scratch: the centroid oscillates at 4–6 Hz with a swing of ≥1 octave. Click: ≤15 ms, 2–8 kHz, flatness ≥0.6, on cuts.
  Picture (ed_motion): flash/black frames, strobe flips, "cuts" on adjacent frames inside a shot, jitter; the sound and
  the visual glitch coincide within ±1 frame.
  Distinctions: impact — energy below 200 Hz and a tail; whoosh — a smooth envelope; the track's hats and rolls follow
  the grid and repeat in neighboring bars.
engine: |
  sfx('glitch', t=[t0, t1], align='attack', slices_ms=[8, 40], mix={crush: 0.3, bleep: 0.25, retrig: 0.25, gap: 0.2}, sync=visual_states, rel_lu=-6, seed=k)
    = concat(slice(kind) by picture states) → pan_jump(0.7) → hp(200);
      slice: crush(bits=4–6, sr_hz=4000–12000) | square(300–3000) | fm(ratio=2.7, index=2–6) | retrig(track) | gap
    + music_gate(t=[t0, t1], holes=<gap slices>, depth_db=-40, attack_ms=1, release_ms=5) — new
  sfx('click', at=t_cut, align='attack', fc=2000–5000, rel_lu=-14) | sfx('click', variant='shutter') | sfx('glitch', variant='static', dur=0.2)
  sfx('glitch', variant='transition', at=t_seam, align='peak', dur=0.36) — for transition(kind='glitch');
  sfx('glitch', variant='trill', t=[t0, t1], rate_hz=12–24, rel_lu=-12) — for a stream of cut.flash flashes
  audio_stutter(track, at=t_beat, slice='1/16', repeats=8, accel=['1/16', '1/32', '1/64'], xfade_ms=2, pitch_step_st=0) — extends the cut.stutter primitive
  music_crush(t=[t0, t1], bits=8, sr_hz=11025, mix=0.8) — new
  tape_stop(music, at=t_beat, dur=0.6, curve=1.5, resume_at=next_downbeat) — new
  sfx('scratch', at=t, dur=0.35, rate_hz=4.5, amp=2.5) — a piece of the track; the music under it mute(music, t=[t, t+0.35])
  New blocks: crush, square, pan_jump, retrig, concat. Sync: states from glitch(...) (hold 1–3 frames) → slice
  boundaries; beat_sync(event='stutter', grid='1/16'); mixing via sfx_bus; qa_sfx(per_10s=2).
gen_hint: "not generated — synthesized in code from noise, square waves and slices of the track itself. For generated shots with native audio ask for no music and no sound effects. Reference description: a short digital glitch burst — bit-crushed static, tiny square-wave beeps and stuttering repeats of the music, hard cuts between fragments, synced to visual corruption"
commands: ["a glitch sound on every visual glitch", "track stutter before the drop", "tape stop on the freeze frame at 0:21", "a click on every cut in the photo series", "bitcrush the track during the datamosh", "remove the glitch sounds from the drop"]
related: [fx.glitch, glitch.datamosh, glitch.vhs, glitch.tv_noise, glitch.pixel_sort, fx.rgb_split, cut.stutter, cut.flash, time.freeze, fx.mosaic, fx.pixel_art, sfx.impact]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
