id: light.halation
family: light
group: optics
level: B
aliases: [halation, film halo, red halo, film glow, highlight glow, bloom]
what: a film-like glow around bright points and edges — a narrow white glow and a wider red-orange halo; makes a digital picture look "filmic" and warm
frames: |
  This is not an event but a property of every frame (a look), sometimes with a dynamic burst.
  1. Source: the core of the light is clipped (channel ≥ 235/255) — a street lamp, a headlight, a window, the sun, backlight on hair.
  2. Around the core — a glow that is white or the color of the source: the excess brightness falls off to 10 % within 1–2 % of the frame height (H).
  3. On top — a wider red-orange halo: for point lights the redness peaks at 2 % H, with a tail up to 4–5 % H
     (the halo is about twice as wide as the white glow); for the sun and large windows a red disc holds up to 10–15 % H.
  4. On sharp light/shadow boundaries (a backlit shoulder, a window frame) — a thin orange-red line of 0.3–1 % H.
  5. Dynamic burst: headlights or a spotlight turn into the lens — the mean frame brightness rises ×3–4
     over 0.4–1.2 s (10–30 frames), the halo swells to 15–35 % H and floods the frame, then subsides, or there is a cut at the peak.
variants:
  - classic red halation: a thin orange-red halo around lights on a night street or at dusk
  - large source halo: the sun or a window in the frame inside a red disc up to 15 % H, often together with "ghost" flares
  - warm backlight: hair and the edges of the figure glow warm, the frame brightness "breathes" ±20 % over 1 s
  - neutral glow in b/w: the same pattern without a color shift (the halo is gray)
  - bloom burst: the source shines into the camera, the glow floods the frame (headlights, a spotlight) — a borderline case with a light flash
status: code
fallback: if there are no clipped highlights in the frame, the effect is almost invisible — a dynamic burst needs a shot with a light source in the frame (search for bright spots in the source footage) or generation of a night scene with practical lights
params:
  threshold: 0.80–0.92 in luminance (typically 0.85), soft knee 0.08–0.12
  glow_radius: white glow 0.5–2 % H (typically 1 %)
  halo_radius: red halo 2–5 % H for point lights (typically 3 %), 8–15 % H for the sun and windows
  tint: "halo R/G/B ≈ 1 / 0.25–0.45 / 0–0.15 (typically [1.0, 0.35, 0.1]); in b/w — neutral"
  amount: 0.2–0.6 with screen blending (typically 0.35); a subtle "expensive" version 0.15–0.25
  edge_line: 0.3–1 % H, only on high-contrast edges
  dynamic_bloom: brightness ×3–4 and radius up to 15–35 % H over 0.4–1.2 s (10–30 frames), decay 0.3–0.8 s
  scope: the same across a whole episode or the whole video; do not switch it on and off between neighboring shots of one scene
  pairing: film grain, slightly lifted shadows, a warm balance
when: night streets, neon, headlights, candles and lamps in the frame, a sunset, backlight on hair; when a "filmic", nostalgic or dreamy tone is needed; music videos and fashion; the dynamic burst — on the entry into the chorus or the drop, on the hero emerging from the light
avoid: flat daytime shots without highlights (the effect does not read, white objects just turn pink); white text, UI and a product on a white background (pink edges look like a defect — apply before the titles); accurate color reproduction of a product; a blown-out sky (a red fringe along the whole horizon); different effect strength in neighboring shots of one scene
sfx: a static look needs no sound; the dynamic burst — a soft swell or a riser on the build-up, the peak coincides with a downbeat
genres: {fashion: signature, teaser: allowed, drama: allowed, calm: allowed, travel: allowed, fanedit: allowed, phonk: allowed, epic: allowed, motivation: allowed, viral: allowed, product: allowed}
detect: |
  Visually: around lights, windows, the sun and backlit edges — a soft halo shifted toward red/orange
  relative to the color of the source itself; on light/shadow boundaries — a thin orange line.
  Measurement: a mask of the cores (channel ≥ 225–235), rings by distance from the core; in the 1–5 % H rings the excess of
  R−(G+B)/2 over the background is +30…+100, the brightness excess fades already by 1–2 % H, while the redness holds up to 4–5 % H.
  ed_motion: no motion features; on a burst — luma rising ×3–4 over 0.4–1.2 s without a cut, sometimes flash frames.
  Differences: a regular glow (bloom) — a halo of the same color as the source; a lens flare (flare) — ghosts,
  rings and rays on a line through the center of the frame, shifting against the movement of the source; chromatic aberration —
  colored fringes of 1–3 px on opposite sides of an object, stronger toward the frame edges; haze — an overall veil and a drop in contrast everywhere.
engine: |
  halation(threshold=0.85, knee=0.1, glow_radius=0.01*H, halo_radius=0.03*H, tint=[1.0, 0.35, 0.1],
           amount=0.35, blend='screen', linear_light=True)
  implementation: highlights = smoothstep(thr−knee, thr, luma)·frame → Gaussian on R with sigma=halo_radius, G — ×0.5, B — ×0.25
  (red spreads the widest) + a neutral copy with sigma=glow_radius → screen over the frame.
  Burst: the same parameters keyframed amount=[0.35, 1.0, 0.35], halo_radius=[0.03, 0.25, 0.03]·H, t=[t0, t0+0.6, t0+1.2], ease='inOutQuad'
  + grain(amount=0.04–0.08) for a film look. Without the primitive — glow(threshold=0.85, radius=0.03*H) + color(tint red over the glow mask).
gen_hint: shot on 35mm film, strong red-orange halation around every light source, glowing street lamps and car lights with soft red halos, warm backlit hair edges, fine film grain, night city, cinematic
commands: ["add film halation to all the night shots", "a soft red halo around the lights in #3–#7", "on the drop, let the headlights bloom out", "a subtle highlight glow, without pink edges on the text"]
related: [light.flash, light.haze, light.spotlight, light.hard]
evidence: {examples: 7, sources: 7, measured: "red halo around point lights: R−(G+B)/2 peak +54…+69 at 1–2 % H, falling off by 4–5 % H, the white glow fades by 1–2 % H; for the sun the redness +70…+100 holds up to 15 % H; halo color R/G/B ≈ 1/0.23–0.48/0–0.17; bloom bursts — luma 47→175 and 28→110 over 0.4–1.2 s; 1 b/w example with a neutral glow", confidence: medium}
