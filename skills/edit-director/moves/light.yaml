id: light.silhouette
family: light
group: optics
level: A
aliases: [silhouette, backlit silhouette, sunset silhouette, black silhouette, shadow figure]
what: backlight turns the hero into a black outline — against a bright opening (a window, a door, a sunset, a white wall) only the shape reads; mystery, anonymity, the plasticity of movement
frames: |
  1. Background: a bright window, an opening, a sunset sky, a white wall or fog — median 100–230 of 255 (often a warm sunset or white).
  2. Figure: median brightness 4–21, no detail inside; a 2.3–5.5 stop gap to the background
     (in fog — gray silhouettes in layers, 1.4–1.9 stops).
  3. A crisp outline: a transition of 1–4 % of the frame height (H); a profile or outstretched arms read best.
  4. The bright zone is 10–75 % of the frame; in a "frame within a frame" the opening takes 10–45 %, darkness around it.
  5. The shot holds for 2–4 s, the camera is static or moves slowly; the figure passes across the bright window, the movement reads through the shape.
variants:
  - window or opening: a dark interior, a bright opening, a figure in it (frame within a frame)
  - sunset or sky: a full-length figure against a bright sky, a warm background
  - foggy silhouettes: gray layers of figures or buildings in a bright haze
  - profile on fabric or a wall: a head in profile passes across a backlit curtain
  - graphic silhouette: the figure filled with black over a colored or white background (mask)
status: hybrid
fallback: the best option is filmed backlit shots (search by the brightness scale, see detect); if the backlit figure still has detail — a grade "pushes" it into a silhouette; if there is no backlight — a person mask, a near-black fill and a bright background (a sunset gradient, white, a poster color); generation for landscape silhouettes
params:
  subject_luma: "≤ 20/255 (fill #050505–#151515)"
  background_luma: 100–235; gap to the figure ≥ 2.5 stops (foggy variant 1.4–2)
  bright_area: 10–75 % of the frame; frame within a frame — opening 10–45 %
  edge: 1–4 % H, for a mask — feather 1–2 px, no bright halo
  grade_push: exposure −1…−1.5 stops, black point +20…+30 (crush the figure), keep the highlights, sky saturation +10 %
  pose: a profile, outstretched arms, a step — shapes that read without a face
  shot_length: 2–4 s; in rhythmic cutting no shorter than 1 s
when: an intro and revealing the hero before showing the face, anonymity, a sunset and travel, dance (the plasticity reads through the shape), emotion without a face, the final shot; a silhouette → face transition on the drop
avoid: moments that need emotions, lip sync and dialogue; product details; a series of many silhouettes in a row; a mask with a ragged or bright edge; light-colored clothes on the hero in backlight (the silhouette "breaks")
sfx: no special sound; wind, ambience; when the figure passes close to the camera — a soft whoosh
genres: {motivation: signature, teaser: signature, epic: allowed, drama: allowed, travel: allowed, fashion: allowed, fanedit: allowed, sport: allowed, calm: allowed, phonk: allowed, product: allowed}
detect: |
  Otsu threshold on brightness: dark class median ≤ 20 (fog ≤ 60), bright class ≥ 90, gap ≥ 2.3 stops;
  the person mask (mediapipe) almost entirely in the dark class, no texture inside the mask (Laplacian variance ≈ 0),
  and the ring around the mask is 4+ times brighter. ed_motion: the camera is mostly static or moves slowly, luma_med 25–65.
  Differences: a spotlight — the opposite, the hero is bright on dark; shadow play — a dark shape lies on a surface
  (a wall, a floor), distorted and often visible next to the hero; low key — the face is partly lit.
engine: |
  search: lighting_profile(shot).backlit and subject_luma ≤ 20 → silhouette candidates
  push: color(exposure=-1.2, blacks=+25, highlights=0, saturation=1.1)
  mask: mask('mediapipe_person', feather=1) → composite(layers=[fill('#0a0a0a', mask), background],
        background=keep | gradient(['#ffb070', '#ff5a3c'], angle=90) | solid('#efefef') | posterize(3))
gen_hint: silhouette of a person standing in a large bright window at sunset, the figure completely black with no detail, warm glowing sky behind, crisp outline, dark interior around the window, static camera, cinematic
commands: ["make the hero a silhouette against the sunset on #2", "a black silhouette on a white background in the intro", "pick backlit shots for the start of the music video", "a silhouette on a red background on the drop"]
related: [light.shadow_play, light.spotlight, light.hard, light.haze]
evidence: {examples: 6, sources: 6, measured: "figure median 4–21, background 100–232, gap 2.3–5.5 stops (foggy example 1.4–1.9); bright zone 11–77 %, frame-within-a-frame opening 11–43 %; outline 1.2–4.5 % H on image tiles; 5 filmed backlit and 1 graphic (a fill over a mask)", confidence: high}
