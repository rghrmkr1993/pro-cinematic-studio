id: light.haze
family: light
group: optics
level: B
aliases: [haze, fog, smoke, atmosphere, veil, diffusion, soft filter, dreamy glow, volumetric light, god rays, rays through smoke]
what: the air in the frame becomes visible — a bright veil lifts the blacks, dampens saturation and contrast, light spreads and draws rays; a dreamy, nostalgic or mystical tone
frames: |
  A property of the frame (a look) or a slow event.
  1. Veil: the darkest 1 % of pixels are not 0–10 but 35–150 of 255; the "dark channel" (the RGB minimum in a 5 % H window)
     rises from 0–20 in a clean picture to 30–170; saturation drops 2–5 times, local contrast 3–10 times.
  2. The color of the veil is the color of the light: in daytime a pale gray-blue (≈ [180–215, 180–220, 185–225]), on a stage — the color of the fixtures.
  3. Depth: the distance and the top of the frame are "whiter" than the foreground — the dark channel at the top is 25–35 % higher than at the bottom;
     in a night scene the veil exists only where the light passes.
  4. Light flows: sources behind the haze turn into rays and cones, bright windows and lamps spread into a soft
     blob over 10–40 % of the frame; the edges of figures in front of the light blur, silhouettes turn gray.
  5. Dynamics: a backlight switches on — the haze "lights up": dark channel 0 → 90, saturation 252 → 57 over ≈ 2 s (50 frames);
     or a short flare of light in the haze covers half the frame for 0.1–0.3 s.
variants:
  - dust or fog in daytime: the whole frame pale, almost no black, colors faded
  - stage smoke with a backlight: figures first as silhouettes, then the light ignites the smoke as a glowing layer behind them
  - a beam in the haze: a visible beam or cone of light in the darkness, the veil only in the lit zone
  - diffusion filter: shadows stay deep but highlights spread, edges soft, tones pastel or warm
  - light flood: a bright window or a fixture briefly floods half the frame with milky light
status: code
fallback: real smoke with rays is best filmed — look in the source footage for shots with backlight, dust, fog, steam; code gives a veil, diffusion and rays from a known source, but not volumetric shadows; otherwise generation
params:
  veil_amount: 0.15–0.65 (a mix with the air color); dreamy 0.15–0.3, dust and fog 0.45–0.65
  airlight: auto — the color of the brightest areas of the dark channel, or set it (day [0.72, 0.75, 0.8])
  depth_gradient: veil at the top/in the distance ×1.3–1.4 relative to the bottom of the frame
  black_lift: p1 up to 35–100 of 255 (dreamy 20–40)
  saturation: ×0.4–0.8
  diffusion: glow from a threshold of 0.7, radius 2–5 % H, strength 0.2–0.4, no color shift; overall softness 0.1–0.3 % H
  rays: length 0.3–0.6 of the frame from the source, decay 0.94–0.97 per step, strength 0.3–0.6
  ramp: veil build-up 1.5–2.5 s (40–60 frames), ease inOutQuad
  scope: one strength for the whole scene; changes only together with a light event
when: intro and outro, a flashback, a dream, a memory, a slow verse; the hero emerging from smoke or light; a stage, a dance, a road, a desert, a forest at dawn; haze with rays — on the intro before the first hit of the track
avoid: fast cutting and the hits of the drop (the veil eats the punch); shots where details of a face or a product matter; source footage that is already flat and washed out (the result is mud); text over the veil without a backing plate; alternating clean and hazy shots within one scene for no reason
sfx: an ambient pad, wind, a low drone; light switching on in the smoke — a swell and a soft hit when the layer lights up
genres: {calm: signature, drama: allowed, travel: allowed, fashion: allowed, teaser: allowed, epic: allowed, motivation: allowed, fanedit: allowed, phonk: allowed, product: allowed}
detect: |
  Per-frame measurement: dark channel median ≥ 30 (clean picture 0–20), brightness p1 ≥ 35, median saturation ≤ 60,
  low local contrast; the color of the "foggiest" pixels is the air color; the veil is stronger in the upper or distant part.
  Rays: elongated bright gradients from a source in a dark frame. Diffusion: highlights spread without a color change,
  shadows can stay deep. ed_motion: for daytime dust luma_med 160–170 with sat 15–20; for haze that lights up
  luma and the dark channel rise together with a static camera.
  Differences: halation — only a red fringe around highlights, no veil; defocus — all details soft, blacks not lifted;
  a dissolve to white — uniform across the whole frame and ends in white; a faded vintage look — lifted blacks without a depth gradient and rays.
engine: |
  haze(amount=0.3, airlight='auto', depth='gradient_y', top_boost=1.35, black_lift=0.12, saturation=0.7)
  + glow(threshold=0.7, radius=0.03*H, amount=0.3)                       # diffusion
  + god_rays(source=track(light)|[x, y], length=0.4, decay=0.95, amount=0.4)  # if there is a source in the frame
  dynamics: haze(amount=[0, 0.45], t=[t0, t0+2.0], ease='inOutQuad') in sync with the light switching on
gen_hint: thick atmospheric haze filling the space, volumetric light beams from behind the subject, milky low contrast, lifted blacks, muted pastel colors, soft diffusion glow around highlights, dreamy cinematic mood
commands: ["add haze and a soft glow to the intro", "make the flashback in #4–#6 hazy and dreamy", "let the light behind the hero cut through the smoke in rays", "take the edge off: a soft filter over the whole verse"]
related: [light.halation, light.silhouette, light.spotlight, light.flash, focus.shallow]
evidence: {examples: 6, sources: 6, measured: "daytime dust — p1 97–154, dark channel 153–170, sat 8–18, the top 25–35 % brighter than the bottom; stage — dark channel 0→90 and sat 252→57 over ≈ 2 s when the backlight switches on; a beam in fog — the veil only in the lit zone (dark channel 60 versus 5); diffusion — a window bloom over ≈ 40 % of the frame with deep shadows p1 3–7; one example of a soft warm filter without a veil", confidence: medium}
