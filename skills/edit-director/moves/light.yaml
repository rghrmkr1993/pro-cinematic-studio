id: light.hard
family: light
group: optics
level: A
aliases: [hard light, high-contrast light, hard shadows, light and shadow, chiaroscuro, key light]
what: light from a small bright source — sharp shadow edges, deep shadows and clipped highlights; gives the frame tension, a graphic quality and an "expensive" fashion look
frames: |
  A property of the frame, not an event; can be static or moving.
  1. Source: the sun, a bare bulb, a spotlight, a flash, a narrow slit — the shadow of the nose and cheekbones with a crisp edge.
  2. The light/shadow transition on faces and objects is 1–2 % of the frame height (H) or narrower; with soft light — 4–8 % H.
  3. Contrast: brightness spread p2→p98 ≥ 190 of 255; in low key 35–70 % of the frame is darker than 20/255,
     in high key (white background) up to 70–80 % of the frame in a clip is > 235, while clothes and hair are almost black.
  4. Moving variant — a band of light: a hard bright band of 10 % H (or 15–17 % of the frame width on a diagonal)
     passes over the figure; a fast pass — the whole frame in 0.36–0.5 s (≈ 10 % H per frame @25 fps), a slow one — 1.3 % of the width
     per frame, 2–2.5 s per pass; after the pass the lighting setup may change (frontal → from below).
  5. Colored hard key: the light on the face changes color red → amber → green over 0.8 s (20 frames), the background does not change.
variants:
  - low key (chiaroscuro): half of the face in deep shadow, the background almost black, median brightness 6–30
  - high key: hard frontal or under-lighting on a white background, a graphic b/w portrait
  - band of light: a narrow beam or slit slides over the body or the face with a still camera
  - colored key change: hard colored light on the face changes hue, the background is neutral
  - colored backlight: a sharp colored rim along the edge of the face in a dark room
status: footage
fallback: imitation in code — a contrasty S-curve, "crushed" shadows and clipped highlights across the whole frame; the band of light and the colored key change are done in code over a person mask (hybrid); code does not create real hard shadows — look in the source footage for shots with the sun, a lamp or a flash, otherwise generation
params:
  edge_width: shadow edge ≤ 1–2 % H (soft light — 4–8 % H)
  contrast: p2→p98 ≥ 190; shadows < 20/255 — 12–40 % of the frame, in low key up to 70 %
  grade_imitation: contrast ×1.3–1.6, black point +15–25, saturation ×0.85–1.0, vignette 0.2–0.3 for low key
  sweep_width: 8–12 % H (a horizontal band) or 15–17 % of the width (a slanted beam)
  sweep_feather: 0.3–1 % H — a hard edge
  sweep_speed: a fast pass 0.35–0.5 s across the whole frame (9–12 frames @25 fps), a slow one 2–2.5 s (≈ 1.3 % of the width per frame)
  sweep_gain: +2…+3 stops inside the band, almost clipping
  key_color_shift: hue shift 0° → 35° → 140° over 0.8 s, only over the person mask
  shot_length: a static hard-light portrait 2–4 s; with a band — the length of the pass plus a 0.3–0.7 s hold
when: introducing the hero, a tense monologue, a fashion close-up, a product with crisp shadows; the moving band — on a downbeat or the entry into a verse; the colored key change — on a change of mood or a turn in the track; keep one type of light within a scene
avoid: mixing hard-lit and soft-lit shots within one scene (the light "jumps"); shots with blown-out skin without detail; calm cozy and family videos; faces with shadows from a cap visor or hair over the eyes when the emotion matters; a code imitation on a flat overcast shot — the result is a dirty, over-processed picture
sfx: the static variant has no special sound; the band of light — a short swell or a "whoosh" on the pass, a hit at the moment the band covers the face; the color change — a low drone or a pad
genres: {drama: signature, fashion: signature, phonk: allowed, motivation: allowed, sport: allowed, teaser: allowed, product: allowed, epic: allowed, viral: allowed, fanedit: allowed}
detect: |
  Classifying the user's shots: the 10–90 % transition width on strong brightness edges ≤ 1–2 % H,
  p98 − p2 ≥ 190, a bimodal histogram (a lot < 20 and/or > 235), a sharp cast shadow of the nose and chin.
  ed_motion: the camera is mostly static (no events); in low key luma 25–35, in high key 190–200 with sat ≈ 0.
  Band of light: with a static camera a near-clipping band (≥ 245) 10–17 % wide shifts monotonically
  frame by frame, edges 1–2 px; colored change: the hue of the face mask shifts by 100°+ in ≤ 1 s with an unchanged background.
  Differences: a pool of light (spotlight) — a round pool with a soft falloff and darkness around it; a silhouette — the object itself is black
  against something bright; shadow patterns — a projected pattern (blinds, a grille); a flash — a brightness jump of the whole frame for 1–3 frames.
engine: |
  search: lighting_profile(shot) → {hardness=edge_width_pct, contrast=p98−p2, low_key=dark_frac, key_side}
  imitation: color(contrast=1.4, blacks=+20, highlights_clip=0.97, saturation=0.9) + vignette(0.25)
  band: light_sweep(angle=0|65, width=0.10, feather=0.005, gain=2.5, path=[0, 1], t=[t0, t0+0.4], ease='linear',
        mask=mask('mediapipe_person', feather=2) | None)
  key color: light_tint(mask=mask('mediapipe_person'), colors=['#e0504f', '#9a6a40', '#2fc070'], t=[t0, t0+0.8], ease='inOutQuad')
gen_hint: portrait lit by a single hard light source, crisp shadow edges on the face, deep black shadows, high contrast chiaroscuro, specular highlights, dark background, cinematic still camera; optional - a narrow slit of hard white light slowly slides across the subject
commands: ["pick hard-light shots for the intro", "sweep a band of light across the face on #6", "make #3 more contrasty, as if under hard light", "change the light on the face from red to green on the transition into the chorus"]
related: [light.spotlight, light.silhouette, light.shadow_play, light.flash, light.halation]
evidence: {examples: 6, sources: 6, measured: "shadow transition 1.0–2.4 % H on image tiles (a soft example on an LED wall — 3.5–7.5 % H); p2→p98 190–255 in 5 of 6; share < 20 — 12–70 %; a 10 % H band travels 7→93 % H in 0.36 s, the return pass after 0.7 s; a beam 15–17 % of the width, 81→10 % of the width over 2.1 s; key color 0°→35°→140° over 0.8 s with a constant background", confidence: medium}
