id: light.flash
family: light
group: optics
level: B
aliases: [flashing lights, light flash, blinking light, flicker, strobe, emergency lights, camera flash, lightning]
what: the light inside the frame flashes, blinks or strobes — the scene is seen in bursts, without a cut; gives alarm, club energy or a "flash" on a hit
frames: |
  No cut: the shot continues, only the lighting changes, the frame's structure stays visible even in the flash.
  1. Single flash (a camera flash, lightning, a gunshot): attack 1 frame, peak 1 frame, decay 1–3 frames — 2–4 frames @25 fps in total
     (80–160 ms); mean brightness ×2.5–4 (32 → 138 of 255).
  2. Flicker (a faulty lamp): on for 60–240 ms, off for 60–240 ms, a ragged rhythm; difference ×1.7–2.
  3. Beacon or emergency lights: beacon — 350 ms of light / 350 ms of darkness (≈ 1.4 Hz), pure red; emergency lights — 50–150 ms each,
     period 150–250 ms, blue and red alternate in bursts with pauses of 0.3–0.5 s.
  4. Strobe in the dark: the scene is visible for 240–400 ms, then ≈ 1–1.5 s of almost complete darkness (brightness ≤ 15); difference up to ×7.
  5. Passing light: every ≈ 2 s a wave of 250–350 ms — attack 2 frames, decay 4–5 frames, ×3, blue → red within the wave.
  6. Single-frame inversion: in a backlit silhouette every 6 frames (0.3 s) one frame with a frontal flash on a black background.
variants:
  - a single flash on a hit — a camera flash, lightning, a gunshot
  - a flickering lamp — a nervous ragged rhythm in a dark room
  - a colored beacon and emergency lights — alarm, night, a chase
  - a party strobe — the scene is snatched from the darkness in pieces
  - passing light — a periodic colored wave over the walls and the figure
  - single-frame inversion — a frontal flash instead of the silhouette on a beat, in the rhythm of the track
status: code
fallback: in code — exposure pulses and colored light with a gradient from the source side, the "off" state 1–2 stops darker; real shadows from the source and the single-frame inversion require filmed material (look for shots with emergency lights, a strobe, flashes, a thunderstorm) or generation
params:
  single: 2–4 frames @25 fps (0.08–0.16 s), attack 1 frame, decay 1–3 frames, brightness ×2.5–4
  flicker: on 0.06–0.24 s, off 0.06–0.24 s, spread ±50 %, ×1.5–2
  beacon: "period 0.7 s, duty cycle 50 %, color #ff1a1a, ×2"
  emergency: flashes 0.05–0.15 s, period 0.15–0.25 s, blue/red bursts, pauses 0.3–0.5 s
  strobe_reveal: light 0.24–0.4 s, darkness 1–1.5 s, brightness in the darkness ≤ 15/255
  passing: every 1.5–2.5 s, duration 0.25–0.35 s, attack 2 frames, decay 4–5 frames
  inversion: 1 frame out of 6–8 @25 fps, on the beats of the track
  source: a light gradient from the source side (falloff toward the opposite edge 40–70 %), not a uniform fill
  safety: no more than 3 flashes per second with a brightness change above 10 % over a large area; red flashes — even more cautiously
when: alarm, a chase, a night street, a party and a club, a thriller; flashes on the snare or the kick in a verse of a phonk track or a music video; a single flash — an accent on a punchline or a change of topic; flicker — nervous anticipation before the drop
avoid: photosensitive viewers — frequent full-frame flashes (> 3 Hz) are dangerous; calm and explainer videos; daytime scenes where a "flash" reads as an exposure error; filling the whole frame with one color without a gradient (looks like a color grade, not like light); flashes off the rhythm of the track
sfx: single — a shutter click, a flash pop or a thunderclap on the attack; flicker — electrical crackle; emergency lights — a siren; strobe — in sync with the kick
genres: {teaser: signature, fashion: signature, phonk: allowed, viral: allowed, fanedit: allowed, sport: allowed, motivation: allowed, epic: allowed, clips: allowed, calm: forbidden, explainer: forbidden, drama: forbidden}
detect: |
  Per-frame brightness is two-level (bimodal) with no cuts; ed_motion: cuts none, flash frames or strobe flips,
  no global motion or it is smooth. hi/lo ratio ×1.5–7; "on" length 50–400 ms; the period is regular
  (beacon, emergency lights, beat) or ragged (flicker). Flash color = RGB delta "on" − "off"
  (blue/red — emergency lights). Brightness rises unevenly: stronger on the source side, shadows move.
  Differences: a flash on a cut (trans.flash) — a white or solid frame at the join, the frame's structure disappears;
  dynamic bloom (light.halation) — the source slowly turns into the lens over 0.4–1.2 s;
  step printing — duplicated frames, not a change of light.
engine: |
  light_flash(at=beat, attack=0.04, hold=0.04, decay=0.08, gain=3.0, color='#ffffff', source='left'|[x, y], falloff=0.6)
  light_flicker(pattern='irregular', on=[0.06, 0.24], off=[0.06, 0.24], gain=1.8, off_gain=0.6, t=[t0, t1], seed=7)
  light_strobe(period=0.7, duty=0.5, colors=['#ff1a1a'], gain=2.0) | emergency: light_strobe(period=0.2, duty=0.4,
               colors=['#2040ff', '#ff2030'], burst=4, pause=0.4)
  + beat_sync(event='light_flash', grid='1/4') + sfx('click'|'impact', at=attack, align='attack'); limit 3 flashes/s
gen_hint: dark location lit only by bursts of light, strobe flashes reveal the scene for a split second then darkness, red and blue emergency lights pulsing across faces and walls, flickering broken lamp, high contrast night cinematic, static camera
commands: ["light flashes on every snare in the verse", "flicker like a broken lamp on #5", "red and blue emergency lights on the night scene #8–#9", "one camera flash at 0:12"]
related: [trans.flash, cut.flash, light.halation, light.hard, light.silhouette, cut.quick]
evidence: {examples: 7, sources: 7, measured: "per-frame brightness at full frame rate in all 7: single flash 3 frames @25 fps (32→138, attack 1 frame); flicker 60–240 ms, ×1.7; beacon 350/350 ms, pure red; emergency lights 50–150 ms with a period of 150–250 ms, blue/red; strobe 240–400 ms of light separated by 1–1.5 s of darkness (9→65); passing light every 2.05–2.1 s for 250–350 ms (31→91), blue→red; inversion 1 frame every 300 ms", confidence: high}
