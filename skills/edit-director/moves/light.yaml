id: light.spotlight
family: light
group: optics
level: B
aliases: [spotlight, pool of light, light spot, spotlight beam, theatrical lighting, top light]
what: a pool or a cone of light picks out the hero, everything around falls into darkness — isolation, "on stage", emerging from the dark
frames: |
  1. Pool: a compact zone of 4–18 % of the frame area (typically 8–10 %) around the hero is lit, center x 0.44–0.62,
     y 0.4–0.67 (a pool on the floor — y 0.8–0.9).
  2. Contrast: the median brightness inside is 4–15 times higher than outside; outside 0–45 of 255.
  3. Pool edge: a hard fixture — a 90→10 % falloff over 4–6 % of the frame height (H); a soft one or a cone in smoke — 15–25 % H.
  4. Cone: in haze a beam is visible from the top edge, widening toward the hero to ≈ 30–40 % of the frame width; the figure under it is often a silhouette.
  5. Switch-on: out of darkness (brightness ≤ 7) the light rises over 0.6–2.4 s (15–60 frames @25 fps) along an S-curve, the lit zone
     grows from 4 % to 75 % of the frame; switch-off — 1–3 s; a change of fixture or color — a jump within 1 frame (brightness ×2).
  6. Handheld flashlight: a pool of 4–11 % of the frame wanders over faces, contrast ×10–15, almost black around it.
variants:
  - stage spot: a motionless hero in a circle of light on black
  - cone from above in smoke: a visible beam, the hero as a silhouette or in top light
  - fade-up and fade-out: the light smoothly opens the scene and then extinguishes it
  - lighting cue change: the color or the fixture changes in a jump (warm → cold)
  - circles on the floor: several pools on a runway floor, the hero walks through them
  - flashlight in hand: a pool darts across faces in the dark
status: hybrid
fallback: imitation over a mask — darken everything outside an ellipse around track(person|face) by 2–4 stops with a soft edge, the pool follows the hero; add the cone as a gradient from the top edge (better on shots with haze); real shadows from the fixture and a beam in smoke — only in filmed material or generation
params:
  pool_area: 4–18 % of the frame (typically 8–10 %); ellipse radius 0.25–0.45 H around the target
  inside_outside: ×4–15 (outside −2…−4 stops), outside ≤ 45/255
  feather: hard 4–6 % H, soft 15–25 % H
  position: centered on the target; for a full-length figure the center of the pool at chest level, in the lower half of the frame — a circle on the floor
  fade_in: 0.6–2.4 s (15–60 frames), inOutCubic; fade_out 1–3 s
  cue_switch: 1 frame, on a downbeat
  cone: apex at the top edge, width at the target 0.3–0.4 W, needs haze of 0.2–0.4
  tint: neutral or cool white; warm amber; colored — for a stage and a music video
  tracking: the pool lags behind the target by ≤ 2 frames, otherwise the spotlight's "searching" is visible
when: introducing the hero or a product, a solo and a monologue, a confession, "alone on stage"; intro — the light comes up, outro — it goes out instead of a fade to black; singling out one person in a group; a lighting cue change — on the drop or a turn in the track
avoid: daytime and outdoor wide shots (a fake pool looks absurd); several fast-moving people — the track breaks; the pool lags or cuts across the face; using it too often — the "stage" feel is lost
sfx: switch-on — a dull relay click or the thunk of a big spotlight, a lamp hum; a smooth fade-up — a soft swell; a lighting cue change — a low hit on the beat
genres: {drama: signature, teaser: allowed, epic: allowed, motivation: allowed, fashion: allowed, product: allowed, phonk: allowed, explainer: allowed, fanedit: allowed, viral: allowed}
detect: |
  Brightness map (blurred by 3 % H): one compact bright zone of 4–18 % of the area, inside/outside contrast ≥ ×4,
  the edge a smooth falloff (an ellipse, a circle, a cone from the top edge), the hero inside; the pool is static or follows the hero.
  ed_motion: the camera is mostly static, luma_med 10–45, many black frames on a fade-up; mean brightness rising from ≤ 7
  over 0.6–2.4 s without a cut = a fade-up. Differences: hard light — draws shadows, but the surroundings are lit;
  a silhouette — the hero is dark on bright; a vignette — darkening from the center of the frame, does not follow the hero and falls off
  over 50–100 % of the frame; a flash — a short pulse, not a constant pool.
engine: |
  spotlight(target=track(person), shape='ellipse', radius=0.32*H, feather=0.06*H, outside=-3.0, tint='#fff4e6',
            follow_lag=1, t=[t0, t1])
  fade-up: spotlight(level=[0, 1], t=[t0, t0+1.2], ease='inOutCubic'); fade-out — mirrored over 1.5 s
  cone: light_cone(apex=[x_target, 0], width=0.35*W, haze=0.3, amount=0.5)
  lighting cue change: color(tint, at=beat) as a jump within 1 frame + sfx('impact', at=beat)
gen_hint: a lone figure in a pool of hard white spotlight in a pitch-black space, light cone visible through light haze from directly above, everything outside the circle falls into darkness, theatrical stage lighting, static camera, slow light fade-up
commands: ["pick out the hero with a pool of light, everything else into darkness", "in the intro the light slowly comes up over the hero", "a spotlight from above in smoke on #2", "on the last phrase, kill everything except the pool on the face"]
related: [light.hard, light.silhouette, light.haze, light.flash, lens.vignette]
evidence: {examples: 7, sources: 7, measured: "lit zone 4–18 % of the frame, inside/outside contrast ×4–15 (144/21, 95/25, 208/46, 66–92/6); edge falloff 4–6 % H for a hard pool and 15–25 % H for a cone and a soft one; fade-up 5→66 over 2.4 s with the zone growing 4→77 % and a fade-out over 3 s; a fixture switching on over 0.6–1.3 s; a fixture color change as a jump 23→47 within 1 frame", confidence: high}
