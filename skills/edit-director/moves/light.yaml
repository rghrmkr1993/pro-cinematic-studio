id: light.shadow_play
family: light
group: optics
level: B
aliases: [shadow play, shadow as the hero, cast shadow, shadow on the wall, long shadows, shadows]
what: the cast shadow becomes the main thing in the frame — on the ground or a wall it replaces the hero, doubles them or draws a pattern; mystery, graphics, the plasticity of movement
frames: |
  1. Conditions: a hard source (a low sun, a lamp) and an even surface — asphalt, sand, a floor, a wall, a lawn.
  2. The camera looks at the surface: from above or at 45–90° to the ground (5 of 7) or straight at a wall (2 of 7);
     the hero is out of frame or seen at the edge (feet at the top edge, entering the frame at the end).
  3. The shadow is 1–4.3 stops darker than the lit surface (a light wall — 4, asphalt — 3, blue night lighting — 1.3),
     the surface texture stays visible through the shadow.
  4. Edge: from the sun or a fixture — 1.2–2 % of the frame height (H); the shadow of a distant tree — soft, 6–7 % H.
  5. The shadow occupies 15–60 % of the frame; with a low sun it is 1.5–3 times longer than the hero and stretched along a diagonal.
  6. The shadow repeats the movement (a dance, a trick, a step), often with a reveal at the end: in 1–2 s the camera moves from the shadow to the person,
     or the person leaves the frame while the shadow stays.
variants:
  - shadow instead of the hero: only the shadow on the ground or a wall is in the frame
  - double: the hero and their enlarged shadow on the wall beside them, the shadow repeats the movement
  - reveal: from the shadow to the person or the other way round, with a pan or a tilt of the camera
  - passers-by shadows: a high angle in harsh sun, the long shadows of a crowd set the rhythm
  - shadow of the surroundings: a tree crown or a building covers a small hero with a pattern (top view)
status: footage
fallback: hybrid imitation on a static shot with an even floor or wall — person mask → fill → shear-skew onto the plane (angle 25–45°, length ×1.5–2.5) → blur 0.5 % H → multiply at 0.5–0.75 opacity; the direction must match the real light in the frame; otherwise search the source footage (sunny shots from above, backlit walls) or generation
params:
  shadow_depth: 1–4 stops darker than the surface (typically 2.5–3), in daylight with a slight shift toward blue
  edge: 1–2 % H from the sun or a fixture, 5–7 % H from distant objects
  area: 15–60 % of the frame
  length: ×1.5–3 of the hero's height with a low sun
  camera: from above at 70–90° or at 45–60° to the ground; for a wall — frontal
  fake_shadow: "skew 25–45°, stretch ×1.5–2.5, opacity 0.5–0.75, blur 0.5 % H, tone #1c2a40 (multiply)"
  reveal: transition from the shadow to the hero 1–2 s, inOutCubic
  shot_length: 2–4 s
when: introducing the hero (first the shadow, then the face), mystery or threat (a shadow on a wall), dance and tricks (the shape of the movement), summer and travel in harsh sun, inserts in a music video; a shadow crossing the frame — as a soft transition
avoid: overcast shots (there is no shadow); moments that need the face; a fake shadow on an uneven surface or with a moving camera; a shadow falling in a different direction than the real light; long series of nothing but shadows
sfx: footsteps, wind, ambience; threat — a low drone; revealing the hero — a soft whoosh
genres: {teaser: signature, drama: allowed, fashion: allowed, sport: allowed, travel: allowed, fanedit: allowed, motivation: allowed, calm: allowed, phonk: allowed}
detect: |
  A dark area on a surface shaped like a figure (often stretched); the texture inside is preserved — the median
  |Laplacian| in the shadow is 0.2–2 of the lit part, and normalized by brightness ×1–4 (a silhouette has ≈ no texture inside);
  a 1–4 stop gap to the light, edge 1–2 % H;
  shooting features: an angle from above or at a wall; motion estimate (ed_motion) — still, or the shadow tracked at 1–3 % of the frame per frame; the figure partly out of frame.
  Differences: a silhouette — a separate move (light.silhouette); shadow patterns from blinds and grilles —
  repeating stripes, not a figure; low key — the whole frame is dark.
engine: |
  search: shadow_region(shot) → dark areas with preserved texture and the shape of a figure; camera angle ≥ 45° to the ground
  imitation: mask('mediapipe_person') → shadow_cast(angle=35, length=2.0, opacity=0.65, blur=0.005*H, tint='#1c2a40',
             ground='feet_line', light_dir=auto)
  reveal: transform(shift=[[0, 0], [0, -0.6]], t=[t0, t0+1.5], ease='inOutCubic') — needs a tall frame or 4K
gen_hint: top-down shot of the long hard shadow of a dancer on sunlit asphalt, only the shadow is in frame, the person's feet barely visible at the top edge, low golden sun, crisp shadow edges, the shadow mirrors the movement, minimal graphic composition
commands: ["start with the hero's shadow on the wall, then show the hero", "give the hero a long shadow on the asphalt on #3", "pick shots with long shadows from above", "a shadow crosses the frame — make a transition out of it"]
related: [light.silhouette, light.hard, light.spotlight, angle.overhead]
evidence: {examples: 7, sources: 7, measured: "shadow darker than the surface by 0.8–4.3 stops (Otsu pixels: light wall 194 versus 9–11, asphalt 149–179 versus 19–23, lawn 77 versus 43); edge 1.2–2 % H for sun shadows, 6–7 % H for a tree-crown shadow; shadow 15–60 % of the frame; 5 of 7 — a view of the ground from above or at an angle, 2 — a shadow on a wall", confidence: medium}
