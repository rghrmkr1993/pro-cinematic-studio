id: glitch.vhs
family: glitch
group: effect
level: B
aliases: [vhs, videotape, tape recording, camcorder, camcorder look, home video, tape look, tracking error, head switching noise, noise band]
what: a picture "from a tape and a consumer camcorder" — a soft image with bleeding color, a skewed balance, a noise band at the edge of the frame and tracking glitches, a 4:3 frame, abrupt handheld zooms
frames: |
  Base (for the whole episode):
  1. Softness: an effective width of 300–360 pixels — luma edges are blurred over 0.35–0.45 % of the frame width,
     color bleeds more than luma (chroma edges 1.5 times wider, chroma detail 2–4 times poorer).
  2. Color: a warm cast (R/B 1.4–1.6) or a green one, blown-out sky and windows, lifted shadows, red "bleeds".
  3. Frame: often 4:3 inside a wide frame — black side bars of 9–12 % of the width on the left and right.
  4. Shooting: handheld, shake of 1–7 % of the frame, an abrupt zoom-button zoom ×1.5–2.3 over 0.25–1 s, whip pans, flares.
  Events:
  5. Noise band: at the top or bottom edge a band of colored vertical streaks 3–12 % of the height, growing in over 0.25 s
     and jittering horizontally.
  6. Tracking glitch: for 0.3–0.6 s the lines slide sideways in waves, the image tears into bands, 1–2-frame white flashes,
     false colors, then the picture straightens out.
variants:
  - clean camcorder: softness, color cast, shake and abrupt zoom — no interference
  - black-and-white night recording: monochrome, heavy noise, blown-out spots of light
  - re-filmed from a screen: vertical colored stripes and screen moiré over the frame
  - tracking glitch on a transition: 0.3–0.6 s of waves and flashes between scenes
  - noise band at the edge: grows and jitters for 0.25–1 s
  - on-screen markers: date, time or a play icon in a monospaced font in the corner of the frame
status: code
params:
  softness: downscale to 320–360 pixels across and back up (effectively 240–330 lines); at 1080p — a horizontal blur of 5–8 px
  chroma: blur the color horizontally 2–4 times more than the luma; shift the color to the right by 0–1 % of the width
  color: R/B 1.4–1.6 (warm) or G +10–15 % (green); red saturation +15–25 %; clip the highlights, lift the shadows by 5–10 %
  noise: luma noise 2–4 %, chroma noise 3–6 %, new every frame
  pillarbox: 4:3 inside 16:9 — side bars of 12.5 % of the width each (9–12 % in the examples)
  band: 3–12 % of the height at the bottom (classic) or top edge, horizontal jitter ±1–3 % of the width, growing in over 0.25 s
  tracking: 0.3–0.6 s (8–15 frames @25 fps) — a wave shift of lines by ±5–20 % of the width, 1–2 white frames, false color
  handheld: shake of 1–3 % of the frame; zoom-button zoom ×1.5–2.3 over 0.25–1 s, with no smoothing at the start
  osd: date and time in the bottom corner, a monospaced font, 4–5 % of the frame height, white with a shadow
when: a memory, childhood, "home video", behind the scenes, found footage, skateboarding and street culture, a retro 90s music video; a tracking glitch — as a transition or a hit on a fill in the track; the base — on the whole episode, not on a single shot
avoid: an expensive product and accurate color; small text and interfaces (they blur); mixing with film dust and light leaks in one shot without intent; tracking glitches more often than once every 4–8 bars; overly clean stabilized footage — the filter looks like a sticker
sfx: tape hiss and hum under the whole episode, the click of a record or play button at the start, "chewed-tape" sound and crackle on a tracking glitch, mono and a high-frequency roll-off on the music
