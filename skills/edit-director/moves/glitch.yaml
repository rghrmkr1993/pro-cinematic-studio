detect: |
  ed_motion: with the base only — no events, cuts at none, rgb_med with blue noticeably higher than red; with events — "cuts" on adjacent
  frames, ECC and fail, jitter up to 4 %, strobe flips.
  With custom code: a peak in the spectrum of the vertical brightness profile with a period of 0.6–1.4 % of the height (peak 13–25 times above the median) — scanlines;
  the share of high-frequency mono noise — snow; a vertical shift of the frame relative to its neighbors by 40–50 % with a dark band inside — roll.
  Unlike fx.glitch: there rectangular blocks and evenly shifted bands, without sinusoidal ripple, snow or scan lines.
  Unlike glitch.vhs: tape has a tracking noise band at the bottom edge, line jitter and smeared color, not snow over the whole frame.
