id: glitch.tv_noise
family: glitch
group: effect
level: B
aliases: [tv noise, tv static, analog noise, TV interference, television interference, snow, static, bad signal, analog interference, signal loss, vertical roll, crt, CRT screen, scanlines]
what: a picture like on an old CRT television with a weak signal — scanlines and a cold screen as the base, and on top — snow, line ripple, vertical roll, loss of sync and "channel switching"
frames: |
  Base (for the whole shot): visible scan lines — 70–170 lines per frame height (period 0.6–1.4 % of the height),
  a cold balance (the blue channel 1.3–1.9 times higher than red), high saturation, sometimes a subpixel grid
  and the rounded corners of a picture tube.
  Events on top of the base:
  1. Snow: grainy mono noise over 30–100 % of the frame, with the image showing through it; 0.5–1 s.
  2. Line ripple: the lines bend in a sine wave (a "herringbone"), amplitude 1–3 % of the width; as the signal breaks down the ripple grows
     for 1–3 s until the image turns into colored bands.
  3. Vertical roll: the frame slides vertically — for 0.2 s a split at 45–50 % of the height with a black blanking bar holds,
     then the picture "locks" within 0.5 s with a slight overshoot of about 3 % of the height.
  4. Loss of sync: bands of the frame tear sideways, the image bends in a wave, colored fringes spread.
  5. Channel switch: 3 frames (0.12 s) — an outline negative, a horizontal smear, the color bars of a test
     pattern — and back to the scene.
  6. Dropouts: white horizontal streaks 2–20 % of the width long, changing every frame.
variants:
  - CRT screen without glitches: only scanlines, glow, a cold shift and rounding — "a picture on a TV"
  - re-filmed screen: moiré and a subpixel grid over a face, as if the camera were looking at a TV
  - weak signal: snow and line dropouts, the image now emerges, now sinks into the noise
  - signal breakdown: line ripple builds over 1–3 s until the picture completely falls apart
  - roll with frame lock: a split in the middle of the frame, then the picture settles into place within 0.5 s
  - channel switch: 2–4 frames of a test pattern, noise or an unrelated picture between two shots
  - scan-line graphics: a face or figure drawn with offset scan lines, in flashes of 2–3 frames among clean ones
status: code
params:
  scanlines: 70–170 lines per frame height (at 1080p — a period of 6–15 px), dark share of a line 30–50 %; typically 120
  tint: blue ×1.3–1.9 relative to red, saturation +10–30 %
  snow: 30–100 % of the area, bright mono noise, new every frame; 0.5–1 s (12–25 frames @25 fps)
  line_wobble: a sine across lines, amplitude 1–3 % of the width, period 4–10 lines, the phase runs downward
  roll: hold a split at 45–50 % of the height for 0.2 s (5 frames), settle within 0.5 s (12–14 frames) with a ±3 % overshoot
  tear: 3–8 bands shifted by ±5–20 % of the width for 1–4 frames
  channel_switch: 2–4 frames (0.08–0.16 s) of insert — a color-bar test pattern, a negative, a smear
  dropouts: 5–20 white streaks per frame, 2–20 % of the width long
  chroma_bleed: colored fringes to the right by 0.5–1.5 % of the width
when: a "screen within a screen", memories and archive, the TV era, a "channel switch" transition, horror and tense moments (snow, roll), the intro and outro of a music video; the base — over the whole episode, events — no more than one per 4–8 bars
avoid: small product details and text (scanlines and snow eat them up); snow without an image for longer than 1 s; harsh snow in calm and children's videos; mixing with digital glitch for no reason — the eras clash
sfx: static noise under the snow; mains hum and the thin whine of the horizontal scan under the CRT base; a click on the channel switch; a "wavering" sound tone during the roll
