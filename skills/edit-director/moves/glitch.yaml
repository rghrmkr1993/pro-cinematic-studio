id: glitch.film_damage
family: glitch
group: effect
level: B
aliases: [film damage, damaged film, film burn, light leak, film flare, dust and scratches, gate weave, frame jitter, frame slip, slipped frame, film flicker, film tail, run-out]
what: imitation of damaged motion-picture film — light leaks and burns, flicker, dust and scratches, a slipped frame with the frame line and sprocket holes; works as the texture of an episode and as a transition
frames: |
  Base (for the whole episode): a frame gate with rounded corners and a black border of 3.5–4 % at the edges, a warm shift
  (R/B 1.5–2), brightness flicker of 2–8 units from frame to frame, dust — dark specks and hairs over 0.1–2 % of the area,
  new every frame, gate weave of 0.2–0.6 %.
  Events:
  1. Light leak: an orange-red patch drifts in from the edge over 0.1–0.2 s, floods 50–100 % of the frame (R/B 3–6), holds
     for 0.2–0.5 s and goes away; often two waves per second, with a cut after the second.
  2. Burn at the start: 1 frame of dark blue, 2–3 frames of almost white (brightness 85 %+), then the image develops
     out of shadow over ≈0.5 s, with sprocket holes and a ginger glow still visible along the edge.
  3. Slipped frame: the picture is shifted vertically by a third of the height — the frame line and parts of two adjacent
     frames are visible; it holds for 1.5–2.5 s, snaps back into place for 0.5–0.75 s and slips again; along the left edge a bright
     strip of sprocket holes 4–28 % of the frame wide flares up.
  4. Doubling: for ≈0.5 s the same frame, larger (≈×1.5), shows through over the frame, like a print-through of an adjacent frame.
  5. Film tail: black frames with dust, a single pink flash, then darkness.
variants:
  - light-leak transition: an orange burst of 0.3–0.5 s hides the cut
  - burn at the start: blue → white → developing image; the start of the video or a scene
  - slipped frame: the frame line and sprocket holes, 1.5–3 s
  - old title card: flicker, dust, a light-leak halo on the letters, and doubling
  - tinted newsreel: the tint wanders between turquoise and brown every 0.3–0.6 s, 10–16 frames per second
  - film tail: black frames with dust and a flash at the end
status: code
fallback: a procedural texture works for dust, flicker, weave and slipping; realistic light leaks and burns are better taken from the user's overlay library (blend mode "screen") or generated as a separate clip on a black background (with consent)
params:
  gate: a black border of 3–4 % at the edges, corner rounding of 3–6 % of the height
  weave: jitter of 0.2–0.6 % of the frame, a new offset every frame
  flicker: brightness ±3–8 % from frame to frame
  dust: 0.1–2 % of the area — 1–4 px specks and hairs, new every frame; a scratch — a vertical 1–2 px line for 4–20 frames
  leak: orange or red (R/B 3–6), fade-in 0.1–0.2 s (3–5 frames @25 fps), hold 0.2–0.5 s (5–12 frames), fade-out 0.1–0.2 s; 1–2 waves
  burn: 1 frame of blue + 2–3 frames of white, developing over 0.5 s (12 frames @25 fps)
  slip: a shift of 30–35 % of the height with a frame line of 1–2 % of the height; hold for 1.5–2.5 s; sprocket holes along the edge 4–28 % of the width
  ghost: a copy of the frame ×1.4–1.6 at 30–50 % opacity for 0.5 s
  tint_drift: a change of tint every 0.3–0.6 s (b* 4–14)
  fps: optionally 10–20 frames per second (step_print hold=2)
when: intro and outro (burn, film tail), a transition between scenes or episodes (light leak), a memory, archive, "found footage", a retro music video; place the light leak on a downbeat or in a pause of the track; the base — over the whole episode, no more than one event per 4–8 bars
avoid: mixing with digital artifacts without intent (the eras clash); a burn over a face during a line; light leaks on every cut; screens and interfaces in the frame; a product where accurate color matters
sfx: projector crackle and whir, clicks and the rustle of dust; on a light leak — a soft whistle or an inhale; on a burn — a mechanical click; on the film tail — the flap of the end of the reel
genres: {travel: signature, fashion: allowed, teaser: allowed, drama: allowed, fanedit: allowed, calm: allowed, ugc: allowed, motivation: allowed, clips: allowed, viral: allowed, epic: allowed}
detect: |
  ed_motion: warm rgb_med (R higher than B by 1.5–2×), flash frames on light leaks, bars ≈0.035–0.042 on all sides (rounded border),
  "cuts" inside a light leak; jitter of 0.2–0.6 % with a static camera — weave; on a slip — jitter 8 %+ and fail.
  With custom code: R/B 3–6 with brightness rising by 20–50 units — a light leak; a share of small dark specks of 0.1–2 % (7×7 median filter, threshold 40)
  that changes every frame — dust; a strong horizontal edge across the full width at 30–35 % of the height holding for seconds — a slipped
  frame; a bright strip along the left edge 4–28 % of the width — sprocket holes; brightness jumping by 2–8 units frame to frame — flicker.
  Unlike glitch.vhs: tape has horizontal noise bands, line jitter and smeared color; film has specks, hairs, light leaks and sprocket holes.
  Unlike cut.flash: a flash is a flat white or colored frame; a light leak is a gradient patch that drifts in from the edge.
engine: |
  film_damage(t=[t0, t1], gate=True, weave=0.004, flicker=0.05, dust=0.01, scratches=1, tint=[1.12, 1.0, 0.82], fps=None)
  light_leak(at=t, dur=0.5, color='orange', side='right', peak=0.9, waves=2, blend='screen') — a gradient patch, fade-in inQuad, fade-out outQuad
  film_burn(at=t, frames=[('blue', 1), ('white', 3)], reveal=0.5) — a burn transition at the start of a shot
  gate_slip(at=t, dur=2.0, offset=0.33, frameline=0.015, perfs='left')
  ghost(at=t, dur=0.5, scale=1.5, alpha=0.4)
  + sfx('projector', t=[t0, t1], gain=-18) + sfx('click', at=t) on the burn and the slip
gen_hint: old 16mm film footage of <subject>, orange light leaks and film burn flaring from the edge, dust and hair, scratches, flicker, rounded gate corners, the frame slips to show the frame line and sprocket holes
commands: ["light-leak transition between #3 and #4", "make the flashback look like old film with dust and flicker", "a film burn at the start of the video", "the frame slips at 0:30 for two seconds"]
related: [glitch.tv_noise, glitch.vhs, fx.glitch, look.film, scene.archival, cut.flash, time.step_print]
evidence: {examples: 5, sources: 5, measured: "light leak: R/B 3.1–6.2, fade-in 0.1–0.2 s, 2 waves within 1 s (0.4 s and 0.2 s), then a cut; burn: 1 frame of blue, 2 frames of white (brightness 217), developing over 0.5 s (34 → 168); slip: the frame line at 33–35 % of the height holds for 1.5–2.5 s, the normal frame 0.75 s; sprocket holes 4–28 % of the width; dust up to 2 % of the area; weave 0.2–0.6 %; tint b* 4–14 changing every 0.3 s; border 3.5–4 %; 2 examples from the section + 3 film examples from a neighboring section", confidence: medium}
