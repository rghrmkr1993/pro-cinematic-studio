id: glitch.pixel_sort
family: glitch
group: effect
level: B
aliases: [pixel sort, pixel sorting, pixelsort, brightness sort, luma sort, hue sort, glitch art, dripping pixels, sort streaks]
what: pixel sort — inside the bright (or dark) areas of the frame the pixels of each column or row are re-sorted by brightness, and the picture "drips" in straight gradient streaks; a glitch-art accent on a hit or the texture of an episode
frames: |
  1. A clean shot of 0.3–2 s — or a hit on the beat straight away.
  2. Entry (1–3 frames): the mask threshold drops, and streaks sprout from the bright areas (sky, lights, highlights, skin, white
     clothes); the sorted area goes 0 → 20–60 % of the frame.
  3. Life: each streak is a continuous segment of a column 5–35 % of the height long (up to 60 %), within it brightness
     rises monotonically from dark to light in one direction, the ends are cut sharply at the mask boundary; all streaks
     are strictly parallel to one axis; the colors come from the same column (it is a permutation, no new colors). When recomputed
     every frame the streaks "boil" along with the video, when updated every other frame they jerk in steps.
  4. Exit: the threshold returns over 6–12 frames, or the effect breaks off into a clean frame on the next beat.
variants:
  - "bright drips: areas brighter than 0.55–0.75 are sorted — the light \"melts\" and drips down"
  - "dark drips: areas darker than 0.2–0.35 — the shadows and the silhouette flow, the light stays"
  - "midtones: a 0.2–0.8 band — the most readable variant, highlights and deep shadows stay intact"
  - "along edges: segments between object edges — short streaks inside a shape, the face and figure stay recognizable"
  - "random segments: lengths of 2–25 % of the line, 30–60 % of the segments are sorted — a coarse \"noisy\" texture"
  - "full sort: the whole column — abstract gradients, the frame does not read; only 1–3 frames as the peak of a transition"
  - "horizontal or at a 30–60° angle — \"wind\", speed; vertical upward — \"burning\""
  - "by hue or saturation — rainbow streaks, an acid aesthetic"
  - "with a mask: only the background is sorted (the subject stays clean) or only the subject — it \"melts\""
  - "wave: the sort zone rolls across the frame from top to bottom over 0.5–1 s"
  - "transition: A crumbles into streaks up to a full sort at the seam, B reassembles"
  - "on a pixel-art grid: sorting on a 160–320 px canvas and upscaling without smoothing — streaks one art-pixel wide, a gradient in palette steps (this is how the streaks appear in pixel-art videos, see fx.pixel_art)"
status: code
fallback: it needs a frame with texture in the sorted area — lights, foliage against the sky, highlights, fabric, water; on a smooth sky or a flat wall the sort is barely visible — switch to the edge mask, to a full sort for 1–3 frames, or take a shot with lights and highlights from the source footage
params:
  axis: "y down (default — it \"drips\") | y up | x left or right | an angle of 30–60° (rotate the canvas with a ×1.42 margin, sort the columns, rotate back)"
  key: "luminance Y (BT.709) by default | hue | saturation | channel R, G or B"
  mask: "bright — lo 0.55–0.75 (140–190 out of 255), hi 1.0 | dark — lo 0.03 (leave pure black and the letterbox bars alone), hi 0.2–0.35 | band — 0.2–0.3 … 0.7–0.8 | edges — segments between edges (1.5 px blur, edge-detector thresholds 50 and 150 at the working resolution) | random — lengths of 2–25 % of the line, 30–60 % of the segments are sorted | full"
  band_len: "minimum 1 % of the line (do not sort shorter ones — you get crumbs), maximum 60 % (cut longer ones); typical streaks are 5–35 % of the height — 100–670 px at 1920"
  order: "asc — dark → light along the axis direction (default) | desc"
  coverage: "accent 15–40 % of the frame area, episode texture 20–60 %, transition peak 70–100 % for 1–3 frames"
  pulse: "on the beat, threshold lo 0.95 → 0.6 over 2 frames (outExpo) and back to 0.95 over 8–12 frames @25 fps / 10–15 @30 fps (inQuad); the whole pulse 10–14 frames @25 fps / 12–17 @30 fps (0.4–0.56 s)"
  sweep: "wave — the edge of the sort zone travels from the top to the bottom of the frame over 12–25 frames @25 fps / 15–30 @30 fps (inOutQuad)"
  update: "live — recompute every frame | hold2 — every other frame (12.5 / 15 updates per second, stepped) | freeze — one sorted frame holds for 3–6 frames (a sticking effect)"
  jitter: "per-column threshold ±0.03–0.05 (a new seed per frame), so that the edge of the zone is not a straight line"
  resolution: "preview — a working 540 px on the short side (≈ 0.08 s per frame on one core), final render — full resolution (≈ 0.4 s per frame @1080×1920); upscaling bicubic (soft streaks) or nearest (on the grid)"
  protect: "exclude the face with a mask in speech and portrait shots; exclude the letterbox bars and burned-in titles from the mask"
  duration: "accent 4–14 frames @25 fps / 5–17 @30 fps (0.16–0.56 s); texture 1–4 s; transition 8–12 frames @25 fps / 10–15 @30 fps with a peak of 1–3 frames"
when: |
  A hit on the snare or bass in the drop (a 0.4–0.56 s pulse); breakdown and bridge — a 1–4 s texture on a sustained synth or
  vocal; intro and title — the name "melts" (sorting only within the text mask); a transition between parts of the track; themes of "malfunction",
  "memory decay", the digital world. By part: hook — one pulse on the first downbeat or a "melting" title; build —
  not needed (or a wave under the riser that ends on the drop); drop — pulses on the snare once every 1–2 bars in stretches
  of up to 4 bars; outro — the last shot disintegrating over 1–2 s. In motivation — only in a pause between phrases on a hit, not
  on the face. Limits: no more than 1 pulse per bar and 4 bars in a row, texture no longer than 4 s and no more than 2 times per
  30 s; within one video — one direction and one mask.
avoid: a face during a line and the subject's recognizability (except for a deliberate "disintegration"); text, prices, subtitles under the sort (draw text separately on top of the effect); a product where shape and label matter; smooth flat frames without texture — the effect is not visible; the whole video — it turns into a filter; a pulse on every beat for longer than 2 bars; together with datamosh and glitch bursts within the same second — a mess; calm, explainer, product and UGC videos
sfx: a digital "crunch" or click (sfx.glitch) on the attack of the pulse; during the pulse — a bitcrush of the music (8 bit, 11–16 kHz); the "dripping" — a downward pitch sweep of −12 semitones over 150–300 ms (like a tape stop) on the entry of the texture; a transition — a short noise sweep on the seam
genres: {fanedit: allowed, phonk: allowed, viral: allowed, fashion: allowed, teaser: allowed, drama: allowed, sport: allowed, motivation: allowed, epic: forbidden, calm: forbidden, product: forbidden, travel: forbidden, clips: forbidden, explainer: forbidden, ugc: forbidden}
detect: |
  ed_motion: it has no signature of its own — no global motion, no flash or black frames; with coverage above 50 %
  of the frame — 1–2 false "cuts" at the entry and exit of a pulse, ECC fallbacks and nonrigid above normal; with updates
  every other frame every second pair of frames shows almost no difference (diff < 0.6), but holds are not flagged (that needs 3+ identical
  frames) — only a freeze sticking for 3–6 frames produces them.
  Custom check (verified on synthetic renders): a permutation test against the nearest clean frame k−1 after
  alignment by global motion (the same similarity transform that ed_motion computes). A vertical sort permutes
  pixels only within columns, so the value-sorted columns of frames k and k−1 almost coincide, while the
  rows do not: E_rows / E_cols ≥ 2 (1–15 on synthetic renders, median ≈ 3.7), for an ordinary frame change, a zoom and a blur
  0.6–1.2; without alignment a camera tilt also gives 1.9–2.8. A horizontal sort — the inverse ratio ≤ 0.5 (a pan looks
  the same — SHIFT events = 0 are required). Auxiliary: the share of "streaky" 32×32 tiles (|d/dx| / |d/dy| ≥ 3
  among textured ones) for a midtone sort is 20–34 % vs 0–14 % for clean frames of the same video; with low
  coverage the cue is weak. Visually: the streaks are strictly parallel, each one a smooth dark → light gradient with
  sharp ends at the mask boundary, the colors taken from the same column.
  Unlike fx.glitch (line smear): there one pixel is repeated to the edge — a streak of a single color, only
  horizontal, together with band shifts and RGB splitting in a burst of 1–8 frames. Unlike glitch.datamosh: there blocks of
  8–16 px are dragged along the motion vectors of the new shot, a moving shot is required. Unlike fx.slit_scan: the rows have different
  times, shapes bend smoothly, the texture inside stays intact. Unlike blur (time.motion_blur): averaging compresses contrast and
  changes the set of column values (ratio ≈ 1), whereas a sort keeps the minimum and maximum. Unlike fx.pixel_art: there
  a square grid and a reduced palette, the "drips" are blocks falling on the grid as a logo assembles; gradient streaks
  one art-pixel wide in a pixel-art video are this move on a canvas. Unlike fx.refraction (ribbed
  glass): periodic bands 2–2.5 % of the width with pieces of the picture, no gradient. Unlike glitch.vhs and glitch.tv_noise:
  there noisy lines, ripple and snow, not gradients.
engine: |
  pixel_sort(t=[t0, t1], axis='y', dir='down'|'up'|'left'|'right', angle=None|35, key='luma'|'hue'|'sat'|'r'|'g'|'b',
             mask='bright'|'dark'|'band'|'edges'|'random'|'full', lo=0.62, hi=1.0, min_len=0.01, max_len=0.6,
             random_len=[0.02, 0.25], edges={blur:1.5, lo:50, hi:150}, order='asc', jitter=0.04, update='live'|'hold2'|'freeze',
             work_res=540, upscale='bicubic'|'nearest', protect=mask('face')|None, region=None|mask('mediapipe_person', invert=True),
             exclude_bars=True, keys={lo: [[0, 0.95], [0.08, 0.6], [0.48, 0.95]]}, ease=['outExpo', 'inQuad'], seed)
    — new primitive: Y per BT.709 → segment mask → segment id = cumsum(boundaries) along the axis → one np.lexsort((key, id))
    per frame → RGB pixels are permuted within the segments, untouched outside the mask (the set of column values is preserved).
  transition(kind='pixel_sort', dur=0.44, params={out:4, peak:2, in:5, mask:'band', axis:'y'}) — a new transition kind:
    on A threshold lo 0.95 → 0 (full sort), the cut at the peak, on B lo 0 → 0.95.
  Pixel art: pixelate(size=0.008*H) → pixel_sort(work_res=canvas, upscale='nearest') → palette_quantize(colors=12).
  bitcrush(music, t=[t0, t0 + 0.4], bits=8, sr=11025, mix=0.6) — new: a bitcrush of the track during the pulse.
  + sfx('glitch', at=t0, align='attack') + beat_sync(event='pixel_sort', grid='1 bar').
gen_hint: "pixel sorting glitch art on <subject>: the bright areas melt into long straight vertical streaks of sorted pixels flowing downward, smooth dark-to-light gradients with hard ends, the rest of the image intact, high contrast night lights"
commands: ["pixel sort on the drop for half a second", "let the sky drip down with a pixel sort for the whole bridge", "sort only the background, keep the subject clean", "a pixel-sort transition between #6 and #7", "a horizontal sort on the shadows every second bar", "the title in the intro melts with a pixel sort"]
related: [fx.glitch, glitch.datamosh, glitch.vhs, glitch.tv_noise, glitch.film_damage, fx.pixel_art, fx.slit_scan, fx.mosaic, time.motion_blur, fx.refraction, fx.rgb_split, sfx.glitch]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
