id: glitch.datamosh
family: glitch
group: effect
level: C
aliases: [datamosh, datamoshing, mosh, data moshing, i-frame removal, p-frame bloom, compression melt, pixel melt]
what: a codec melt — the picture does not refresh at the cut or loops one motion, and the pixels of the old frame flow in 8–16 px blocks along the motion of the new one; scenes bleed into each other without a clean join
frames: |
  Melt transition (the main variant):
  1. Setup: a clean shot A; the incoming shot B has noticeable motion (a dance, a step, a drive-by or a camera turn).
  2. The cut is invisible: in place of B the frame of A holds, but its pixels already move with B's motion — B's silhouettes
     emerge "made" of A's texture and color; the static areas of B still show A.
  3. Only some of the blocks refresh each frame: B's color sprouts in patches, saturation rises by 10–20 %.
     The middle of the transition (50 % by histogram) — after 0.3–0.6 s (8–15 frames @25 fps), an almost clean B — after 1.1–1.5 s.
  4. Tail: remnants of A (a face, clothes) hang on as a "ghost" for another 0.5–1 s and smear until B's motion drags them away.
  Bloom (repeating one motion frame): the same vector is applied 10–30 frames in a row — the texture flows
  in streaks in the direction of motion; on a push-in the streaks spread as rays from the center, on a camera tilt they stretch into vertical
  "icicles". The frame structure becomes streaky: coherence rises from 0.1–0.2 to 0.35–0.8 over 0.5–1.5 s.
  Grid: rectangular 16×16 and 8×8 px blocks of the source (≈2–3.5 % of the width at 400–640 px), staircasing along the edges
  of moving objects, isolated black or gray squares in place of lost blocks.
variants:
  - melt transition: a cut without a keyframe, B grows through A over 1–1.5 s
  - bloom: repeating one motion frame — pixels flow in a streak for 0.4–1.5 s; on a zoom — radial rays, on a tilt — vertical drips
  - continuous mosh: the whole 2–7 s segment without refresh — the background is frozen from the previous scene, a new object moves across it (game, concert, dance footage)
  - light mosh within a shot: individual background blocks stick, hands and clothes leave blocky trails, the scene still reads
  - scene cascade: an intro montage where 5–8 scenes in a row flow into each other without a single clean cut
  - stuck block: a gray or black 16–32 px rectangle sits on a face or object for 1–2 s while the rest drifts
  - with posterization or duotone: the mosh over a hard color scheme, the blocks become flat patches
status: code
fallback: if the incoming shot has little motion — add a digital zoom-in or pan to it (transform) so the vectors have something to drag; if there is no suitable pair — find a shot with strong continuous motion in the source footage or generate one (with consent)
params:
  mode: transition (keyframe dropped at the cut) | bloom (repeating a motion frame) | continuous (the whole segment without refresh)
  melt: 1–1.5 s (25–38 frames @25 fps); 50 % after 0.3–0.6 s
  bloom_repeats: 10–30 repeats (0.4–1.2 s), typically 15
  continuous: 2–4 s in a regular video, up to 7 s in an experimental one
  block: 16 px at a working resolution of 480–720 px (≈2–3.5 % of the width); at 1080p — a 32 px block or processing at ×0.5 with an upscale
  refresh: 1–5 % of blocks per frame get a new picture, by the end of the transition the share rises to 100 %
  holes: 0–2 % of blocks black or gray for 0.3–1 s (optional)
  motion_in: in the incoming shot a shift of at least 1–2 % of the frame per frame, otherwise the melt stands still
  saturation: +10–20 % during the melt (happens by itself, no need to boost it)
  codec: mpeg4 without B-frames, a huge GOP, scene detection off; a keyframe only at the cut point
when: a transition on the drop or on a change of section in the track; a "trip", disorientation, a breakdown; linking two dance or sport moves; a music video intro and title sequence; no more than one mosh per 8 bars, continuous mosh — up to 2–4 s in a row
avoid: a static incoming shot (the picture just freezes and looks like a corrupted file); a talking head and an important line; faces that must be recognizable; a product, a logo, text; a calm and trusting tone; several moshes in a row — the effect turns into a defect
sfx: a digital crackle or a "data crunch" at the start of the melt; during the melt — a bitcrush or a filter on the music; put the cut on a downbeat and let the melt run on to the next one
genres: {fanedit: signature, phonk: allowed, viral: allowed, teaser: allowed, fashion: allowed, sport: allowed, drama: allowed, calm: forbidden, explainer: forbidden, product: forbidden, travel: forbidden, clips: forbidden}
detect: |
  ed_motion: a scene change without a cut (cuts at none in 12 of 13 clips), while the histogram distance to the first shot
  grows smoothly over 0.5–2 s; many events with conf low and nonrigid > 0.4, ECC fallbacks, false rotations of 5–25° and shifts.
  Visually and with custom code: rectangular 8–16 px blocks with sharp edges and staircasing along edges; a moving silhouette filled
  with the texture and color of the previous frame; static areas "stuck"; smeared streaks along the motion (structure coherence
  0.35–0.8 vs the usual 0.1–0.3); isolated black squares.
  Unlike fx.glitch: a glitch is a burst of 1–6 frames with line shifts and RGB splitting, then a clean picture; a mosh lasts
  0.5 s or longer and follows the motion. Unlike a dissolve and echo: there it is a semi-transparent blend, here each block is opaque —
  either old or new. Unlike fx.slit_scan: there time is offset by coordinate in an even band, not in blocks along the motion.
engine: |
  datamosh(mode='transition', at=t_cut, dur=1.2, block=16, refresh=[0.02, 1.0], ease='inQuad', method='codec')
    codec: A+B → mpeg4 (-bf 0, -g 9999, scene detection off, -force_key_frames t_cut) → drop the keyframes
    after the first one (-bsf:v noise=drop='key*gt(n,0)') → decode and convert back to h264
  datamosh(mode='bloom', at=t, repeats=15, block=16) — repeating the packet of one P-frame (PyAV) or one flow field
  method='flow' (no codec): a block-wise 16 px optical flow of B carries the previous output frame; the share of refreshed
    blocks grows along inQuad from 0.02 to 1 over dur; holes — random blocks set to black
  + transform(scale=[1, 1.08]) on B if it has little motion; + sfx('glitch', at=t_cut, align='attack')
gen_hint: datamosh transition, pixels of the previous shot smear and melt along the movement of <subject> in the next shot, blocky 16px compression artifacts, colors bleeding between scenes, streaks flowing in the direction of motion, no clean cut
commands: ["datamosh transition between #3 and #4 on the drop", "melt the dance into the next scene with a mosh", "bloom mosh at 0:12 for half a second", "a light datamosh over the whole second verse"]
related: [fx.glitch, time.echo_trail, fx.slit_scan, glitch.vhs, trans.dissolve]
evidence: {examples: 14, sources: 13, measured: "source blocks of 8–16 px (black squares of 13–17 and 7–8 px at 480 px); 2 transitions: 50 % by histogram after 0.3–0.55 s, an almost clean new shot after 1.1–1.5 s, saturation +18 %; bloom: streak coherence rises from 0.10 to 0.40 over 1.1 s; the cut detector stays silent in 12 of 13 clips; the whole clip of 1.3–7.4 s is under the mosh in 8 of 13; one example is a duplicate of another", confidence: high}
