id: angle.birds_eye
family: angle
group: angle
level: A
aliases: [bird's-eye view, bird's-eye shot, high overhead, drone overhead, drone top-down, rooftop view]
what: a view straight down from a great height — people and cars turn into dots with shadows, the ground into a map or a pattern; the hero dissolves in the scale, the viewer watches with detachment
frames: |
  1. Height: from a rooftop (≈15–20 m) up to hundreds of meters; the camera points straight or almost straight down (−70…−90°),
     no horizon and no sky.
  2. Scale: a person together with their shadow is 5–22 % of the frame height, without the shadow ≈3–11 %; cars 2–8 %. The frame rests on
     a pattern — parking rows, road interchanges, the paving of a square, a field; with a low sun the shadows are longer than the figures and
     become the pattern themselves.
  3. Camera: static in 4 of 8 (jitter ≤0.03 %). In 3 of 8 it rises steadily: ×0.64 over 3.84 s, ×0.85 over 1.7 s,
     ×0.90 over 0.96 s — ≈×0.89–0.91 of scale per second, the curve is a straight line. From such a height a rise has almost no
     parallax (nonrigid 0.08–0.3) and looks like a smooth zoom-out.
  4. Length 2.6–5.2 s — longer than the neighboring shots: the viewer needs time to read the map.
  5. Transition variant: the camera is above the clouds, a cloud floods the frame with white for 0.7–1 s, and out of the white comes the scene on the ground.
variants:
  - pattern without a hero — a parking lot, interchanges, a glowing city; the camera is static or rises (3 of 8)
  - figures on a huge surface — one to three people or a stream of pedestrians on a square, a field, a crosswalk; long shadows (3 of 8)
  - an event below — a car, a flash, a crash in a night city as a glowing dot; the camera slowly rises (1 of 8)
  - descent through the clouds — above the clouds → white fill → ground: a transition between scales (1 of 8)
status: footage
fallback: look in the source footage for drone shots with the gimbal at ≤ −70° and an altitude from 20 m (SRT/XMP telemetry), and for footage shot from rooftops and bridges; a rise or a descent on such a shot is imitated in code almost losslessly (there is no parallax) — a digital zoom with crop headroom; no such shot — generate a high-altitude view with the user's consent
params:
  pitch: −70…−90°, altitude from 15–20 m; lower and closer — angle.overhead
  subject: a person ≤11 % of the frame height (with shadow ≤22 %); cars 2–8 %; the hero no larger than 1/10 of the frame
  duration: 2.5–5 s (63–125 frames @25 fps), typically 3.5 s; in fast cutting no shorter than 1.5 s
  camera: static or a steady rise ×0.88–0.92 per second (≈−0.4 % of scale per frame), a descent — mirrored
  rise_imitation: transform scale 1.25 → 1.0 over 2–4 s, linear in the logarithm of the scale, center — the main figure or the center of the pattern
  cloud_transition: white fill 0.7–1 s (18–25 frames), entry keyed to the brightness of the cloud, exit — a cut or a dissolve out of white
  vertical: 9:16 from 16:9 — a window around the main figure, the figure on a third; a pure pattern is cropped at the center
when: opening a video or an episode — "where are we" in 3–4 s; a transition between locations and scales (through the clouds, a rise → cut to the ground); the hero's loneliness and lostness — a small figure on a huge square; the ending — the camera rises and leaves the hero behind; a breathing pause between dense scenes; in travel — roads, beaches, fields as graphics. 1–2 times per video, a third time is already a cliché
avoid: moments that need the hero's emotion or line; a source without resolution headroom — people turn into pixels, especially in 9:16; a shaky or tilted drone shot without stabilization; fast cutting over a long high-altitude view — the map has no time to be read; a series of similar drone shots in a row
sfx: air, wind, a distant city hum; on the rise — a long swell or pad; the transition through the clouds — a whoosh with white noise that cuts off on the exit into the scene; on the downbeat of the scale change — a low hit
genres: {travel: signature, epic: signature, calm: allowed, motivation: allowed, sport: allowed, drama: allowed, teaser: allowed, fanedit: allowed, product: allowed, explainer: allowed, phonk: allowed, viral: allowed}
detect: |
  Features on frames every 0.5 s (3 of 5 needed; drone telemetry — altitude >20 m and gimbal ≤ −70° — decides at once):
  1) no sky and no horizon;
  2) the face detector finds nothing, people and cars are small blobs ≤11 % of the frame height (without shadow);
  3) the frame is filled with a repeating pattern (road markings, rows, paving, a field, treetops); if the pattern has straight lines
     (share of segments at one vanishing point ≥0.6), they are parallel — the vanishing point is farther than 10 frame heights (26–59 in the examples);
  4) long shadows of figures on the same plane;
  5) ed_motion: static, or a steady ZOOM-OUT ×0.85–0.92 per second with nonrigid ≤0.3 (a rise), or a slow SHIFT
     ≤2 % of the frame per frame.
  Differences: angle.overhead — closer, the hero 25–90 % of the frame, interiors, faces are readable; oblique aerial footage
  (drone.aerial) — the horizon is visible, the camera flies forward; shot.extreme_wide — the figure is just as small, but the camera is at
  ground level or at an angle, the horizon and the sky are in the frame.
engine: |
  classify_shot(clip, by='angle') → angle='birds_eye' (detect features, 3 of 5).
  Rise from a static shot: transform(scale=[1.25, 1.0], center=[0.5, 0.5]|track(person), t=[t0, t0+3], ease='linear');
  descent — scale=[1.0, 1.25]. Transition through the clouds: transition('dip', dur=0.8, params={color: 'white'}) with an overlaid
  cloud shot (if there is one) + sfx('whoosh', at=t0, align='peak').
  Vertical: reframe('9:16', target=track(person)) — the figure on a third; if resolution is lost, do not crop but take another shot.
gen_hint: extreme high bird's-eye view from a drone hundreds of meters above <location>, camera pointing straight down, tiny figures casting long shadows, map-like geometric pattern of <roads/parking rows/fields>, slow steady vertical ascent, no horizon
commands: ["open the video with a bird's-eye view", "find top-down drone shots in the source footage", "do a slow rise on #2", "through-the-clouds transition between #4 and #5"]
related: [angle.overhead, angle.overhead_tracking, shot.extreme_wide, drone.aerial, drone.fpv, zoom.out]
evidence: {examples: 8, sources: 8, measured: "4 of 8 — static (jitter ≤0.03 %); 3 — a steady rise ×0.64/3.84 s, ×0.85/1.7 s, ×0.90/0.96 s (≈×0.89–0.91 per second), nonrigid 0.08–0.3; 1 — a transition through a white fill by a cloud; figures 9–11 % of the frame height without shadow, 5–22 % with shadow; no faces in any of them; straight lines on the ground are parallel (vanishing point 26–59 frame heights); shots 2.6–5.2 s", confidence: high}
