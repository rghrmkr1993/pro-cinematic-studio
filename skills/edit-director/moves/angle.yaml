id: angle.worms_eye
family: angle
group: angle
level: A
aliases: [view from below, from under the feet, worm's-eye view, worm's-eye angle, camera on the ground looking up, ground-up shot, circle of heads over the camera]
what: the camera lies on the ground or the floor and looks almost straight up — people loom over the lens against the sky or a ceiling, heads in a circle or upside down; the "you are lying down and above you…" angle
frames: |
  1. The camera axis is tipped up by 60–90°: no horizon, the background is a plain sky, a ceiling or a vault (a flat bright background
     fills 25–55 % of the frame, indoors — lamps and beams).
  2. Figures grow from the edges toward the center: legs and bodies go into the corners, heads converge in the middle; with a vertical axis people
     stand in a circle like "rays", faces upside down or turned sideways; verticals (walls, columns) converge to the center.
  3. People look down — straight into the lens: they bend over, point a finger, reach out a hand, pour something from above; or
     walk over the camera (legs step over it, soles in the frame).
  4. The camera is static (jitter 0.07–0.28 %) — 5 of 6; sometimes a slow push-in ×1.6 over 2.2 s toward a looming face or a handheld
     "rocking" following the hero bending over (jitter up to 5.8 %, push-in/pull-out ×1.4/×0.6 over ≈1 s).
  5. Shot length 1–4 s (a static circle of heads can hold for up to 15 s as a background for lines).
variants:
  - circle of heads: 3–8 people bent over the camera in a circle, faces toward the center — "you come to, and everyone is above you"
  - one looming: face and shoulders from above against the sky, looking into the lens, a hand reaching down
  - walking over the camera: people step over the lens, soles and legs against a ceiling or the sky
  - corridor upward: the camera on the floor, a ceiling with lamps and walls converge, the hero shouts from above
  - through a frame: walls of a well, an opening or a box at the edges, faces peer inside from above (adjacent to angle.trunk)
status: footage
