id: angle.high
family: angle
group: angle
level: A
aliases: [high angle, high-angle shot, downward shot, view from above, looking down on the hero]
what: the camera is above the hero's eyes and looks down at 15–75° — the hero is smaller and "below" the viewer, with the floor or the ground behind instead of the horizon; an angle of vulnerability, submission or overview
frames: |
  1. The camera is 0.5–3 m above the hero's eyes (a stepladder, a balcony, stairs, a crane), the axis tilted down ≈15–75°;
     there is no horizon and no sky in any of the 8 examples — the background behind the hero is floor, ground, asphalt, a table or the crowd itself.
  2. The hero often looks up straight into the lens (4 of 8): the face frontal, head and shoulders larger, the body narrowing toward the bottom;
     in medium and wide shots the eye line drops to 0.5–0.65 of the frame height (at eye level usually 0.3–0.45).
  3. The camera is still (7 of 8, jitter 0.05–0.21 %); within the shot only the hero's action changes. 1.2–4 s (30–100 frames @25 fps).
  4. Any scale — from a close-up of a face from above (the face 83 % of the height) to a crowd as a texture (faces ≈5 % of the height):
     the higher the viewpoint, the smaller the people and the more of the surface around them is visible.
variants:
  - looking up into the lens — the hero in a crowd, by a car or over a table raises the eyes to the camera (4 of 8)
  - from behind and above — the top of the head and shoulders, a passage or a door ahead (1 of 8)
  - steeply down (≈60–75°) — two people on a bench, a lying person; the border with the overhead view (2 of 8)
  - an overview of a mass — a crowd or an army as a texture right up to the top edge of the frame (1 of 8)
status: footage
fallback: the angle cannot be changed in code — the pose, the background and the perspective give away the camera position; a weak imitation of "slightly from above" for flat scenes — keystone distortion up to 5–8 % with a crop; otherwise search for high-angle shots in the source footage by detect, or generation with consent
params:
  pitch: −15…−75° (typically −25…−50°); steeper than −75° — angle.overhead, from a height of tens of meters — angle.birds_eye
  camera_height: 0.5–3 m above the hero's eyes
  horizon: not in the frame; if visible — at the very top edge (above 0.1 of the height)
  sky_top: share of sky or of a bright smooth ceiling in the top 35 % of the frame ≈0
  gaze: optionally up into the lens; eyes at 0.5–0.65 of the height in medium and wide shots
  camera: static, jitter ≤0.25 %
  duration: 1.2–4 s (30–100 frames @25 fps)
  scale: the face from ≈5 % (a crowd) to 80+ % (a close-up from above)
when: vulnerability, defeat, loneliness, submission — "looked down on"; a hero who is addressed from above; an overview of a place or a crowd before going down to the hero (establishing) and a "fly-away" at the end; a power struggle — film the strong one from below, the weak one from above, and alternate on the lines; comedic "smallness"; a layout on a table or a board at an angle. 1–2 times per scene
avoid: the hero's triumph and moments of strength — the angle diminishes; a product that should look powerful (angle.low is better); a wide-angle lens right up to the face from above — a "light-bulb" head and short legs, comical; a high angle in every shot — the point of the contrast is lost
sfx: no SFX; quieter and more distant — the general ambience, room echo, voices from below; when the camera rises — wind or air
genres: {drama: signature, epic: allowed, travel: allowed, sport: allowed, teaser: allowed, ugc: allowed, explainer: allowed, product: allowed, calm: allowed, fanedit: allowed, motivation: allowed, viral: allowed}
detect: |
  Frames every 0.5 s: (1) no sky and no horizon — the share of "sky" (smooth blue or bright neutral pixels) in the top
  35 % ≈0 and no long horizontal in the top 0.9 of the frame; (2) the surface the hero stands on is visible behind the hero — floor, ground,
  a table (VLM question "is the camera looking down at the person?"); (3) frontal faces with an upward gaze, eye line at 0.5–0.65 in medium
  and wide shots, the body foreshortened; (4) with straight walls the verticals converge below the frame (57–72 % of intersections in the examples with
  architecture; on crowds and faces the feature is unstable). ed_motion: static. Differences: angle.overhead — straight down, no walls,
  no floor perspective, the frame reads like a diagram; angle.low — sky or ceiling at the top, verticals converge upward; eye level —
  horizon at 0.3–0.6 of the height, verticals parallel; drone.aerial — a height of tens of meters, usually with a horizon.
engine: |
  classify_angle(clip) → 'high' — new analysis: sky_top < 0.02 and no horizon + (VLM "camera above") + (opt.) the vanishing
  point of the verticals below the frame; confidence is higher if in the neighboring shot the same hero is filmed at eye level.
  Weak imitation: keystone(amount=0.06, axis='y', narrow='bottom') + transform(scale=[1.08, 1.08]) — a new keystone primitive.
  Power scene: cut alternation angle.low (the strong one) ↔ angle.high (the weak one) on every line.
