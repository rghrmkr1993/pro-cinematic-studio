id: angle.overhead_close
family: angle
group: angle
level: A
aliases: [flat lay, tabletop shot, map view of the table]
what: "a close-up framed like a map of the work surface, lens pointing straight down from arm's length: everything lies flat and reads as a diagram; the standard insert for step-by-step, hands-on content"
frames: |
  1. The camera is straight above the surface at ≈0.3–1 m (30–100 cm of a table, a board, fabric, a box in the frame). There is no horizon
     and no depth; the surface is parallel to the sensor and therefore sharp almost entirely — the sharp zone is 0.46–0.66
     of the frame area in 6 of 7 (lower only on a smooth plain background).
  2. Subject: an object, food or hands fill ≈40–100 % of the frame. The composition is symmetry (two pairs of hands converge
     to the center) or a 30–45° diagonal; straight edges of objects are parallel to the frame edges.
  3. Action: hands enter from the edge of the frame (in 4 of 6 clips with hands — from the bottom or the side, in 2 — from the top) and perform
     one simple action — put down, pick up, open, rearrange, add. A face from above occurs only with a
     lying hero: filling the frame (≈70 % of the height), looking into the lens (1 of 7).
  4. The camera is static (5 of 7, jitter ≤0.07 % of the frame); sometimes at the start a short tilt toward the object — a shift of 19 %
     of the frame over 0.45 s — or a light "breathing" ×0.89 → ×1.13 over 1.2 s.
  5. Length: a single insert 1.2–3 s; a series of overhead inserts — 0.5–0.56 s each (every 7–8 frames at 14 fps),
