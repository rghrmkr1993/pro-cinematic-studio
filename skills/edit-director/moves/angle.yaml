id: angle.overhead
family: angle
group: angle
level: A
aliases: [overhead shot, top-down shot, top shot, overhead view, shot from above, looking straight down, straight-down angle, 90° down]
what: a view from directly above — the camera above the hero or the scene looks straight down; there is no horizon, the floor or the ground lies in the plane of the frame, and the scene reads as a diagram, a pattern or a map
frames: |
  1. Angle: the camera axis points straight down (−75…−90°). No sky, no horizon, no back wall; a single plane
     (floor, ground, bed, table, crowd) fills the whole frame. The lines on it do not converge — markings, tiles,
     the edges of a bed stay parallel (vanishing point farther than 15 frame heights). If the walls of a well
     or a room are visible from above, their edges converge toward the center of the frame.
  2. Hero: lying — whole, the body ≈25–90 % of the long side of the frame; standing — the top of the head and shoulders, the body
     foreshortened, no legs visible. The face is visible only if the hero lies on their back or looks up into the lens
     (then the face is 23–27 % of the frame height, centered). Faces often "lie": in 6 of 9 clips with faces the face roll
     is greater than 45° (on the side ±90°, upside down 180°).
  3. Composition: center or a strong 30–60° diagonal; a bed, a sink, a table, tiles are aligned with the frame edges;
     hard low light gives long shadows — the only hint of the objects' height.
  4. Camera: static in 15 of 20 (jitter ≤0.15 % of the frame), shot 1.5–3.5 s. Moves: rotation around the lens
     axis at 22°/s (50° over 2.24 s, almost even); a rise ×0.71 over 2.5 s (even, ≈×0.87/s); a descent ×1.33
     over 2.4 s with acceleration; a slow drift of 5–6 % of the frame/s; a handheld camera over a crowd with turns and cuts.
variants:
  - a body on a surface — lying on a bed, a floor, the ground; a fall backward onto a bed landing in the center (5 of 20)
  - a crowd or choreography as a pattern — heads, lying bodies, dancers fill the frame; the camera is static, rises or descends (4 of 20)
  - a table from above — hands at work, a layout of objects, food on a tray; objects aligned with the frame edges (4 of 20; very close — angle.overhead_close)
  - looking up into the lens — the hero below looks into the camera through a ring, a net or a stairwell; the body foreshortened (2 of 20)
  - a well — the walls of a room or a shaft converge to the center, a small hero at the bottom (2 of 20)
  - a scale model from a height — vehicles, people, a crosswalk with markings; long shadows (2 of 20; higher — angle.birds_eye)
  - flight — the hero between the camera and the distant ground, a sense of height (1 of 20)
  - spin — a constant rotation of 15–25°/s around the center (1 of 20, 1 more — a chaotic handheld over a crowd)
status: footage
fallback: look in the source footage — a drone with the gimbal at −90° (gimbal pitch ≤ −80° in the SRT/XMP telemetry), handheld or tripod footage over a table, a bed, a floor; a real overhead view cannot be made in code, but a static overhead shot can be brought to life in code (a spin, a slow "descent"); if there is no such shot — generate an overhead view with the user's consent
params:
  pitch: −75…−90° (straight down); at −30…−75° it is already a high angle (angle.high)
  duration: 1.5–3.5 s (38–88 frames @25 fps), typically 2.5 s; as an accent in fast cutting from 0.8 s (20 frames)
  camera: static (15 of 20) | spin 15–25°/s, linear | rise ≈×0.87/s or descent ≈×1.1–1.25/s, 1.5–2.5 s
  subject: a lying hero ≈25–90 % of the long side of the frame; a face looking up 23–27 % of the height; heads in a crowd 8–19 % of the height
  composition: center (x, y 0.45–0.55) or a 30–60° diagonal; straight edges of objects parallel to the frame edges ±3°
  rotation_freedom: an overhead shot can be rotated by 90/180° or mirrored — there is no horizon (not allowed if there is text in the frame)
  spin_crop: rotation by θ without exposed corners — S = cosθ + (W/H)·sinθ (for 16×9 10° → ×1.29, 20° → ×1.55); a full turn 16×9 → 16×9 — ×2.04; 16×9 → 9×16 — a window with a height ≤0.87 of the source height
  vertical: 9:16 from 16:9 is cropped without losing meaning, centered on the hero
when: the scene's "rock bottom" — the hero lies after a fall, a fight, exhaustion, alone or drained (a transition to reflection); opening an episode or entering a verse — a pattern of a crowd, a dance, a street for 1–2 s; a process from above — hands, a table, cooking, assembly as a series of shots of the same length (1–2 bars); the ending — the camera rises and leaves the hero below; a chapter divider and a shape-match transition between two overhead shots. 1–3 times per minute; a series of 3–5 overhead shots — as a separate block
avoid: lines and emotions that need the eyes (faces do not read from above, except when looking into the lens); scenes where height matters — the overhead view flattens it; a cluttered floor (from above all of it is visible and reads as noise); a spin longer than 3–4 s or faster than 45°/s — causes motion sickness; rotating or mirroring a shot with text and logos; "almost overhead" with an edge of the horizon in a corner — looks like a mistake — either strictly overhead or a clear high angle
sfx: the angle itself needs no sound; a fall onto a bed or a floor — a dull thud on contact; a spin — a low drone or a long sweep over the whole rotation; a camera rise — air or a swell; a table from above — close-up foley of the action
