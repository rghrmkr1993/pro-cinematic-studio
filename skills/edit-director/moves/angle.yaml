  camera on the ground, "the phone was put down and everyone leaned over", footage shot lying down. Weak imitation: a shot from below (angle.low) +
  a rotation by 90–180° + barrel distortion and darkened edges — reads as "lying on my back". Generation — from the
  gen_hint with the user's consent.
