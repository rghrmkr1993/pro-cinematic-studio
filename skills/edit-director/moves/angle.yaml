id: angle.dutch
family: angle
group: angle
level: A
aliases: [dutch angle, dutch tilt, canted angle, oblique angle, tilted horizon]
what: a shot filmed with the camera rolled 10–35° — the horizon and verticals are visibly tilted; the world is "off-kilter", the viewer feels anxiety, madness or pressure
frames: |
  1. The frame is tilted from the very start: all verticals (doors, poles, shop windows) and the horizon are rotated
     to one side by 10–35°, more often 15–30°; any direction — clockwise or counterclockwise.
  2. The roll holds for the whole shot (in 5 of 8 examples within ±3–4°); meanwhile the camera can pan,
     slowly push in ×1.1–1.5 over 1–2 s or shake handheld — the roll stays.
  3. Often combined with a wide lens right up to the face and a low camera position — the distortion strengthens the effect.
  4. A shot lasts 1–4.5 s (25–110 frames @25 fps); in a dialogue each line is 2.7–3.6 s, and the characters are tilted to
     opposite sides (+29…36° and −33…36°); within a shot the roll sometimes slowly turns further by 7–28° over 2–3.5 s.
variants:
  - static tilt for the whole shot — a lone hero or an interior, 17–21°, the camera is static (2 of 8)
  - tilt in motion — a pan across a crowd, a push-in down a street, a handheld camera; a roll of 10–33° holds (4 of 8)
  - dialogue "with opposite rolls": the speakers are tilted to opposite sides, cuts every 2.7–3.6 s (1 of 8)
  - rolling tilt: the tilt passes through a level horizon to the other side, −25° → +26° over 2.4 s (1 of 8) — bordering on a camera rotation
status: code
fallback: a camera roll around the optical axis is a pure image rotation, so code reproduces it exactly; the price is a crop S = cos θ + (W/H)·sin θ (16:9 at 10° ×1.29, 15° ×1.43, 20° ×1.55, 30° ×1.76); if the resolution is not enough — paint in the corners with outpaint instead of cropping, or take a smaller angle
params:
  angle: 10–35°, typically 15–25°; below 8° it reads as a camera operator's mistake
  direction: clockwise or counterclockwise; in a series and in a dialogue — alternate the sides or increase the angle along with the tension
  hold: constant roll for the whole shot (drift ≤±4°); a change of more than 15° within a shot is already a camera rotation
  center: rotate around the hero's face (track(face)) so that it stays in place
  crop: S = cos θ + (W/H)·sin θ for W ≥ H (for 9:16 — (H/W)·sin θ + cos θ); from 4K lossless up to ~30°
  duration: 1–4.5 s (25–110 frames @25 fps); as an accent in fast cutting 0.5–1 s
  entry: a cut from a level shot; optionally a "turn-in" 0 → θ over 0.3 s (8 frames, outCubic) on a beat
when: anxiety, madness, intoxication, a villain, a conflict in a dialogue, chaos and a fight, disorientation after a shock; in music videos — boldness and drive (a night street, neon); in comedy — an "off-kilter" moment; one or two tilted shots on the drop as an accent. A series of tilted shots — with alternating sides or a growing angle
avoid: calm, luxury and explainer videos; a tilt of 2–7° — looks like a horizon tilted by mistake; every shot in a row at the same angle to the same side — the effect wears off; a crop of ×1.5+ from 1080p without outpaint — mush; shots where the verticals already converge from shooting from below — the result is a mess
sfx: a dissonant stinger, a low drone, a detuned pad; on the "turn-in" — a short whoosh; in comedy — a slide whistle or a "boing"
genres: {phonk: signature, drama: allowed, fanedit: allowed, viral: allowed, teaser: allowed, sport: allowed, fashion: allowed, epic: allowed, clips: allowed, calm: forbidden, explainer: forbidden, travel: forbidden}
detect: |
  Roll on frames every 0.25–0.5 s: the dominant gradient orientation modulo 90° (weighted mean of
  exp(4iφ), confidence ≥0.15) — |θ| ≥ 8°, stable within ±4° for at least 1 s. Line check (Hough): all long
  verticals in the frame lean to one side by ≈θ. On faces the eye line usually leans the same way (the head can
  add ±10°). ed_motion: no ROTATE events, or they are under 15° per shot (static roll).
  Differences: shooting from below or above — the verticals converge (on the left and on the right they lean in opposite directions), mean roll ≈0;
  camera rotation (roll) — ROTATE ≥15° within the shot; hand shake — |θ| < 5° and it changes from frame to frame;
  in nature without straight lines the estimate is unreliable (confidence < 0.15) — check by the horizon line or with a VLM.
engine: |
  horizon_tilt(clip) → θ, conf — new analysis (4φ orientation + Hough verticals), label 'dutch' when |θ| ≥ 8°.
  Synthesis: transform(rotate=[θ, θ], scale=[S, S], center=track(face)|[0.5, 0.5], t=whole shot), S = cos θ + (W/H)·sin θ;
  without a crop — outpaint the corners before rotating. Dialogue: θ = +20° for one character, −20° for the other.
  Accent on a beat: transform(rotate=[0, θ], t=[beat, beat+0.3], ease='outCubic') + sfx('whoosh', at=beat).
gen_hint: dutch angle shot, camera rolled about 20 degrees to one side, tilted horizon and slanted verticals, <subject> in <setting>, wide lens close to the subject, tense uneasy atmosphere, steady camera
commands: ["dutch angle on #5", "tilt the shot 20° on the drop", "in the dialogue, tilt the characters to opposite sides", "make the madness scene with a tilted horizon"]
related: [roll.camera, frame.central, angle.low, handheld.shaky, trans.spin]
evidence: {examples: 8, sources: 8, measured: "roll 10.5–33° (shot medians 10.5, 13, 17.5, 18, 21, 28, 33°), in 5 of 8 it holds within ±3–4° for the whole shot; 3 counterclockwise, 4 clockwise; dialogue — characters +29…36° and −33…36°, turn within a shot 7–28° over 1.8–3.6 s; 1 rolling tilt −25° → +26° over 2.4 s (up to 2.8°/frame); shot length 0.9–4.7 s; the roll estimator is accurate to ±0.5° on synthetic data", confidence: high}
