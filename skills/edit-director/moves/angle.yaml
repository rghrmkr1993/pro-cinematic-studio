id: angle.overhead_tracking
family: angle
group: angle
level: B
aliases: [top-down tracking, top-down follow, overhead tracking shot, overhead pass, overhead follow, tracking over the tables]
what: the camera, pointing straight down, travels with the hero, a car or along a row of objects — the floor or the ground flows under the frame, the subject stays in the center; movement across a "map" that instantly shows the layout of the space
frames: |
  1. The angle as in angle.overhead: straight down, no horizon; the subject is seen from above — the top of the head and shoulders, the roof
     of a car, a stretcher, train cars.
  2. Movement parallel to the ground: the subject stays in the central third of the frame, the background moves toward it.
     Background speed: a pedestrian — 15–25 % of the frame width per second (0.6–1 % per frame @25 fps); a pass along a row
     of tables or a work line — 24–32 %/s, the steadiest (speed spread 0.13–0.15), with acceleration over the first
     second (9 → 30 %/s); a car or a train — 100–145 %/s.
  3. Follow turn: when the subject turns, the camera turns with it — its heading in the frame
     stays constant while the world rotates: 19–40°/s, up to 40–125° per shot (3 of 9).
  4. Parallax: over a flat floor or ground almost none (nonrigid 0.03–0.06); over furniture, people,
     structures — 0.17–0.30. Gimbal or hand jitter 0.3–1.6 % of the frame.
  5. Length: 2.4–11.3 s — these are single-take passes; in fast cutting 1–2 s are taken from them.
variants:
  - following a pedestrian — over roofless rooms, a corridor, a hall; the hero walks through the space (3 of 9)
  - transport from above — a train in a canyon, a car, a stretcher; on turns the camera rotates to follow (3 of 9)
  - a pass along a row — over a workbench, a line, gaming tables; the background flows at a constant speed (2 of 9)
  - hovering over a flow — the camera is almost still (6.9 %/s), a crowd or a structure flows beneath it (1 of 9)
status: footage
fallback: imitation in code — (a) a pass — a constant crop shift across a large overhead frame (4K, a panorama, stitched drone frames) — over a flat surface there is no parallax, the fake is invisible; (b) following — a crop that tracks the hero across a static overhead wide shot with ×1.5–2 headroom; (c) follow turn — the crop window rotates along the subject's heading; a pass over furniture and people looks flat in code — look for a real tracking shot in the source footage or generate with consent
params:
  speed: pedestrian 15–25 % of the frame width/s (0.6–1 %/frame @25 fps); row 24–32 %/s; transport 100–150 %/s
  ease: acceleration 0.5–1 s (12–25 frames), then a constant speed (spread ≤0.2 for passes)
  subject: in the central third of the frame, deviation ≤10 % of the frame per shot (≈)
  rotation: 19–40°/s when the subject turns; the subject's heading in the frame is constant
  duration: 2.5–11 s (63–275 frames @25 fps), typically 4 s; a piece in fast cutting 1–2 s
  parallax: flat surface — nonrigid ≤0.06 (a code fake is invisible); furniture and people — 0.17–0.30
  crop_follow: crop headroom ×1.5–2 over a static overhead frame (lossless from 4K to 1080)
when: showing a space through the hero's movement — an apartment, a corridor, a maze (the overhead view gives the layout); a chase, a road, a train — transport from above with a follow turn; production, a kitchen, a table — "the process as a flow"; opening titles over a pass; a long walk-through shot in a music video where the hero walks through the rooms of a set. As a long shot — once per video; in dynamic cutting — a 1–2 s piece on a downbeat
