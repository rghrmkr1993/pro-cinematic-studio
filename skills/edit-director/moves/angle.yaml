id: angle.low
family: angle
group: angle
level: A
aliases: [low angle, low-angle shot, upward shot, looking up at the hero, hero shot, power shot]
what: the camera is below the hero's eyes and looks up at 10–45° — the hero towers over the viewer against the sky, a ceiling or stage lights; an angle of power, threat, triumph and monumentality
frames: |
  1. The camera at waist or knee height or near the floor (≈0.2–1.2 m), the axis tipped up ≈10–45°; the top third of the frame is sky,
     a ceiling with lamps, stage lights or treetops (8 of 8 visually), the horizon low or out of frame.
  2. The hero's head at the top edge: eye line at 0.13–0.33 of the height (median 0.28; in a high angle 0.5–0.64),
     chin, neck and nostrils visible; the body widens toward the bottom, legs and hands near the lens are larger than the head.
  3. Verticals — walls, doors, tree trunks, skyscrapers — converge upward (66–76 % of intersections above the frame in 5 of 8);
     often a roll of 17–34° is added to the angle (4 of 8), with a wide-angle lens — barrel distortion, the body stretched.
  4. The camera is static (5 of 8, jitter ≤0.12 %) or breathes handheld (0.3–0.7 %); the hero may lean toward the camera and straighten up,
     looming. 1.2–5 s (30–125 frames @25 fps).
variants:
  - the hero against the sky — standing or sitting, looking into the distance or up, the sky fills almost the whole top half, static (2 of 8)
  - from below with a 17–34° roll — a figure at the edge of a skyscraper roof, getting out of a car under pine trees, a musician under stage lights (3 of 8)
  - wide angle from the floor — a person looms over the camera and straightens up, a dance over the lens, the body stretched (2 of 8)
  - a face from below in close-up — chin and nostrils, light above the head, smoke (1 of 8)
status: footage
fallback: a real low angle cannot be made in code — the pose, the background and the perspective give away the camera position; a weak imitation of "slightly from below" — a keystone narrowing the top by up to 5–8 % plus a crop, stronger — a roll as in angle.dutch; otherwise search for low-angle shots in the source footage by detect, or generation with consent
params:
  pitch: +10…+45° up (typically +15…+35°); steeper than +60° with the camera at the ground — angle.worms_eye
  camera_height: 0.2–1.2 m — below the hero's waist or chest
  eye_line: 0.13–0.33 of the frame height (typically 0.25–0.3) in medium and wide shots
  top_band: sky, ceiling, stage lights or treetops in the top 35 % of the frame; "sky" share 0.15–0.9 outdoors
  verticals: converge upward — the vanishing point above the frame
  roll: optionally 15–35° (a low dutch angle)
  lens: wide ≈14–24 mm equivalent for exaggeration; normal — for "clean" power without distortion
