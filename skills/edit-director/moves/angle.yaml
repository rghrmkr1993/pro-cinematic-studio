     below it — ripples and glints that move 1.3–3.4 times more than everything above the line (in 6 of 8; up to ×16 in a static shot on calm water).
  2. On the waterline — whatever comes out of it: a swimmer's head, a hand or a foot touching the surface, the silhouette of a boat,
     a person waist-deep in the sea; in the distance above the water — a shore, a city or fog.
  3. The camera is static (4 of 8, jitter ≤0.2 %) or rocks on the waves with the water (jitter 0.7–4.2 %);
     roll usually ≤2°, on a wave — spikes up to 10–20°.
  4. A wave washes over the lens: for 0.3–0.7 s the picture blurs (sharpness below 0.35 of normal), then the water runs off,
     drops remain on the glass; in the same way the camera dives and resurfaces — a cut or a pass through the surface.
  5. Over-under (half the frame underwater): the waterline at 0.3–0.5 of the height, above — the scene in the air, below — the body underwater,
     distorted by refraction, with a different color cast; 0.5–8 s, more often 2.3–4 s (58–100 frames @25 fps).
