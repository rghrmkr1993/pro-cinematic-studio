id: angle.ground
family: angle
group: angle
level: A
aliases: [ground level shot, ground shot, low ground angle, camera on the ground, floor-level shot, feet shot, ground-level view]
what: the camera right at the ground (10–60 cm) looks almost horizontally — the floor or the ground at the bottom of the frame, shoes, feet, a ball, wheels in focus; the world from floor level
frames: |
  1. The camera is 10–60 cm above the floor, the axis almost horizontal (not tipped up): the horizon is level (roll ≤2° in 5 of 8),
     the bottom 20–45 % of the frame is floor, grass, asphalt or steps in strong perspective.
  2. Focus is on the line of contact with the ground (a band at 40–85 % of the frame height); the floor nearest the lens is soft —
     the sharpness of the bottom tenth of the frame is 0.25–0.55 of the peak in 7 of 8.
  3. The main thing is what is at the ground: shoes, legs up to the knees or the waist, a ball, a lying person, wheels; people further away are seen
     small and full-length, faces are almost never in the frame.
  4. The camera is static (4 of 8, jitter ≤0.22 %) or follows handheld near the ground (jitter 2–5.6 %); 1–5.3 s (25–133 frames @25 fps).
variants:
  - shoes and feet in close-up — standing, shifting from foot to foot, walking on a carpet or steps (3 of 8)
  - footwork near the camera — dance, ball tricks, a walk along the top of a bar counter (3 of 8)
  - a lying hero — the face on the grass level with the lens, the feet of a crowd in the distance (1 of 8)
  - a road at the level of the road surface — the markings converge to a point, cars rush past the lens (1 of 8)
status: footage
fallback: the camera cannot be lowered in code — cropping the feet out of a regular shot gives a view from above, not from the ground; look for low shots in the source footage by detect, otherwise generation with consent
params:
  height: 0.1–0.6 m above the ground
  pitch: 0 ± 10° — almost horizontal; steeper upward is already a shot "from under the feet"
  ground_area: the bottom 20–45 % of the frame
  focus: sharp at the point of contact (a band at 0.4–0.85 of the height), the near edge of the floor soft (≤0.55 of peak sharpness)
  subject: shoes 10–40 % of the frame height (≈), legs up to the knees or the waist; faces — only of people lying down
  camera: static or a low tracking move following the feet; jitter up to 0.25 % (tripod) or 2–6 % (handheld)
  duration: 1–5 s (25–125 frames @25 fps)
  horizon: level, roll ≤2–3°
when: introducing the hero "feet first" before cutting to the face; arrivals and departures (steps toward a goal), dance and footwork, ball sports, shoe and clothing ads; a child's or an "animal" perspective; a defeated hero on the ground; road and speed — a car rushes over the lens; a transition — a foot steps on the lens or blocks the frame
avoid: when faces and emotions matter; more than 2–3 such shots in a row — the viewer loses the scene; a dirty floor and litter by the lens; strong wide-angle barrel distortion at the feet — looks comical (unless intended)
sfx: footsteps loud and close (foley), squeaking soles, ball hits, crunching gravel or grass; as a car passes — a low rumble and a whoosh; on a jump or a stomp — an impact at the moment of ground contact
genres: {product: signature, fashion: allowed, sport: allowed, travel: allowed, ugc: allowed, viral: allowed, drama: allowed, teaser: allowed, phonk: allowed}
detect: |
  No faces (or one lying face near the bottom third); pose (mediapipe): ankles and knees in the band 0.4–0.95 of the height,
  hips at the top edge or out of frame; the bottom 20–45 % is a uniform floor surface with texture that goes soft at the edge
  (sharpness of the bottom band ≤0.55 of the peak), sharpness peak in the band 0.4–0.85; roll ≤3°. ed_motion: static
  (jitter ≤0.25 %) or a handheld tracking move 2–6 %. Differences: a shot "from under the feet" (worm's eye) — the axis tipped up ≥45°,
  sky or ceiling fills the frame, verticals converge upward; low angle (angle.low) — the camera is below the eyes but above
  the ground, faces are seen from below; feet filmed from above — the tops of the shoes are visible with the floor behind them; pov.animal — the same height,
  but with a 3–3.8 Hz trotting bounce and people talking into the lens.
engine: |
  footage: find_shot(height='ground', pitch='level', subject='feet'|'ball'|'vehicle'|'lying_person') → cut(at).
  "Feet to face": cut(ground 1–2 s) → cut(shot.medium_close_up of the same hero) on a downbeat.
  Transition: a step blocks the lens → transition(kind='wipe(shape=foot)', dur=0.12) or match(on='motion') with the next shot.
  sfx('impact', at=ground contact, gain=-8 dB) on jumps and stomps.
gen_hint: ground-level shot, camera resting about 20 cm above the <floor / street / grass> and pointing almost straight ahead, <sneakers / feet / a ball> in sharp focus at the point where they touch the ground, blurry ground in the immediate foreground, level horizon, shallow depth of field
commands: ["show the hero from the feet, then the face", "floor-level shot of the footsteps before the drop", "find low shots of shoes for the ad", "a car rushes over the camera at ground level"]
related: [angle.low, angle.worms_eye, angle.water_level, pov.animal, track.follow, shot.extreme_close_up]
evidence: {examples: 8, sources: 8, measured: "feet, shoes or a ball are the main subject in 6 of 8, a lying person in 1, a road in 1; sharpness peak in the band 0.4–0.8 of the height in 6 of 8 (in one more 0.8–0.9), the bottom band 0.25–0.55 of the peak in 7 of 8 (0.98 on steps); roll ≤2° in 5 of 8 (3.7–10.7° in the rest); static in 4 of 8 (jitter 0.06–0.22 %), handheld 2.1–5.6 %; shots 1–5.3 s; camera height — a visual estimate ≈0.1–0.6 m", confidence: high}
