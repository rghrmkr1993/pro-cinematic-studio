detect: |
  Features on frames every 0.5 s (3 of 5 needed; drone telemetry with the gimbal at ≤ −80° decides at once):
  1) no sky and no horizon in any frame of the shot;
  2) a single plane over ≥70 % of the frame; long segments on it are parallel — the RANSAC vanishing point is farther than 10 frame
     heights (15–200 in the examples), and the edges of walls, if visible, converge toward the center of the frame (±0.1 of the height);
  3) faces (YuNet at rotations 0/90/180/270°, threshold 0.75): roll |roll| > 45° in a noticeable share of detections
     (55 % in the examples, 7 % for eye-level shots), or a single frontal face in the center with a foreshortened body; for standing people only
     the tops of heads and shoulders are visible;
  4) long shadows lie on the same plane next to the objects, like silhouettes;
  5) ed_motion: static; or ROTATE around the center without a horizon at 15–25°/s with nonrigid < 0.15; or ZOOM ×1.1–1.4
     over 1.5–2.5 s with nonrigid 0.2–0.35 (rise/descent); a shift over a flat floor — nonrigid < 0.1.
  Differences: angle.high — a wall, the horizon or a floor receding toward the top of the frame with converging lines is visible, faces upright;
  angle.birds_eye — a height of tens of meters, people smaller than 5 % of the frame height, a map of the terrain;
  angle.overhead_close — distance up to 1 m, an object or hands over 30–100 % of the frame; angle.worms_eye — the camera from below,
  sky and verticals converging upward.
engine: |
  classify_shot(clip, by='angle') → angle='overhead' by the detect features (3 of 5).
  Orientation: transform(rotate=[90k, 90k]) or mirror(axis='x') — align the hero's axis or the direction of movement
  with the neighboring shot (there is no horizon, the rotation goes unnoticed; do not apply with text in the frame).
  Bring a static overhead shot to life: transform(rotate=[0, 40], scale=[S, S], center=[0.5, 0.5], t=[t0, t0+2], ease='linear'),
  S = cosθmax + (W/H)·sinθmax; or transform(scale=[1, 1.15], t=whole shot, ease='inQuad') — a "descent".
  Vertical: reframe('9:16', target=track(person)). Cut: cut on a downbeat; in a series of overhead shots —
  the same length (1–2 bars) and match(on='shape') between neighbors.
