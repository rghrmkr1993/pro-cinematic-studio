id: arc.horizontal
family: arc
group: camera
level: B
aliases: [horizontal arc, arc around the subject, half orbit, circular tracking shot, arc shot, 180-degree arc]
what: "a sideways arc around the subject at a fixed radius: the background sweeps past while the subject holds the middle of the frame — anything from a slow, tender half-circle to a fast arc in an action beat"
frames: |
  1. The subject (or a couple, an object) is centered across the frame width (x 0.45–0.55), the camera at the same height or lower.
  2. The camera travels sideways along a 45–180° arc (≈, most often 60–120°), always looking at the subject: the background
     slides the opposite way by 40–140 % of the frame width over the shot (≈1.5–2.5 % of the width per frame @25 fps), the
     foreground rushes past even faster — strong parallax; the perspective turns give a visible roll of 10–50° with a low camera.
  3. Speed: a slow arc ≈20–40°/s, 2–4 s — reveals the subject and the space; a fast "whip" arc of 90°+ in
     0.5–1 s with motion blur — a hit, a turn, a burst.
  4. Often combined with a push-in (×1.1–1.5) or an occlusion: a column, people or a dark foreground "wipe" the frame
     for 1–3 frames — a cut is hidden under it.
  5. End: the subject now faces the camera with the other side, a new background behind; hold 0.5–1 s or cut on the motion.
variants:
  - slow orbit around the subject: a person standing under an archway, by a window, in a field — a ≈90° arc in 2.3 s, the background slides by 140 % of the width
  - table orbit: the camera circles people seated at a table, people in the foreground cover the frame and give hidden cuts
  - whip arc: 60–90° in 0.5–1 s with motion blur around a face or a punch; often a black-and-white music-video style
  - low sports arc: the camera at turf level circles players in motion, roll up to 60° on the turn
  - aerial arc: a drone circles a moving subject (a surfer, a car) while pushing in and descending, a 120° turn in 3 s
  - cut arc: 20–25 different subjects (motorcycles, people) for 3–4 frames each, the angle moves from cut to cut front → profile → back → front, a full circle in 3–4 s
  - from behind to the face: starts on the back of the head or the back, a ≈150–180° arc in 1.8–3 s (≈60–90°/s) comes round to a frontal view and slows down, often with a ×1.2 push-in (slow version — 5–6 s with a ×1.8 zoom); the reverse move — from the face to the back in ≈2.7 s, the subject "walks off" into the world
status: footage
fallback: "code: a fake arc up to 10–15° — subject mask + background shifted one way and the subject slightly the other way (2.5D) + 2–4° roll; cut arc — pick shots of different subjects from the source footage with the angle advancing step by step and cut 3–4 frames per beat; a full orbit — generation with consent (image-to-video \"camera orbits around\") or a search of the source footage for shots where the background flows sideways while the subject stays centered"
params:
  angle: 45–180° (≈), typically 60–120°
  speed: slow 20–40°/s (2–4 s); fast 90°+ in 0.5–1 s with motion blur
  bg_shift: background 40–140 % of the width per shot, ≈1.5–2.5 % of the width per frame @25 fps
  subject: x 0.45–0.55, size constant or growing (push-in ×1.1–1.5)
  height: at the subject's level or lower (a low arc strengthens the roll and the scale)
  occlusion: optional — the foreground covers the frame for 1–3 frames, cut on the occlusion
  ease: inOutQuad for slow; outCubic for whip
  cut_arc: cut version — 3–4 frames per angle, 20–25 angles per circle, switch on 1/8 or 1/16
when: revealing the subject and the place (intro, first appearance), a romantic or emotional peak, "going around" a dinner table or a group of friends, a turn in action and sports, a product orbit; cut arc — dynamic cutting on the beat; 1–2 orbits per video
avoid: shaky source; an arc whose center drifts off the subject (the axis is lost); an orbit against a featureless background — the motion doesn't read; a 2.5D fake beyond 15° (the mask edges tear); whip arcs back to back — causes motion sickness
sfx: slow — a rising pad or swell; whip — a whoosh with Doppler at peak speed; orbit in a noisy location — pan the sound to follow the movement
genres: {epic: signature, fashion: signature, sport: allowed, drama: allowed, travel: allowed, product: allowed, teaser: allowed, motivation: allowed, fanedit: allowed, phonk: allowed, viral: allowed, clips: allowed, calm: allowed}
detect: |
  ed_motion: a long SHIFT of 40–140 % of the frame in one direction over 1–4 s while the subject stays centered (local
  subject motion against the global one), nonrigid 0.3–0.8 (strong parallax); often ROTATE 10–60° from the perspective
  and ZOOM-IN ×1.1–1.5 at the same time. Whip arc — the same in 0.5–1 s with motion blur (min sharpness ×0.1–0.5).
  Cut arc — cuts every 3–4 frames, each with a new subject at the same size and position in the frame,
  the angle changes monotonically.
  Differs from truck.lateral: there the camera moves in a straight line and the subject leaves the center. From pan.basic: there is no parallax,
  background and subject shift together. From orbit.turntable: there the object rotates and the background stands still. From arc.vertical: the camera goes
  over the top or underneath, not sideways.
engine: |
  Real orbit — pick by detect; speeding up a whip arc — speed(curve=[[0, 1], [0.5, 2.5], [1, 1]], interp='flow')
  + blur(kind='directional', amount∝speed).
  Fake: mask('mediapipe_person') → parallax_orbit(angle=12, push=1.15, layers=2, t=[t0, t0+2.5], ease='inOutQuad');
  cut arc: cut_arc(clips=[...], per_clip=0.14, order='by_yaw', subject_lock=track(object)) — new primitive:
  sorts shots of different subjects by camera angle (by pose/orientation) and cuts on the beat.
gen_hint: smooth arc shot, the camera orbits <subject> horizontally around 90 degrees at constant distance, subject stays centered while the background slides behind with strong parallax, <slow and cinematic | fast whip arc with motion blur>
commands: ["90° orbit around the subject in #3", "whip arc around the face on the hit", "cut arc from all the motorcycles, 3 frames per beat", "circle the dinner table with the camera, with occlusions"]
related: [arc.orbit, arc.vertical, orbit.turntable, truck.lateral, drone.fpv, time.bullet_time, dolly.float]
evidence: {examples: 8, sources: 8, measured: "slow arc: background 139 % of the width in 2.34 s (≈2.5 %/frame) with the subject centered, visible roll 47°; table orbit 13 s with foreground occlusions (dark frames every ≈0.4 s); whip arcs — image rotation 64–84° in 0.9–1.4 s; aerial arc — 124° turn in 3.2 s with a push-in; cut arc — 25 subjects at 140 ms each (≈3.5 frames @25 fps), a circle in ≈3.5 s; arc angle — visual estimate", confidence: medium}
