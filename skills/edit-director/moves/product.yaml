engine: |
  product_sequence(subject=track(object:shoe), shots=['ground_walk', 'step_cut', 'in_hand', 'sticker_spin', 'packshot'], cut='beats')
  — ground_walk: reframe(aspect, target=track(object:shoe)) + transform(scale=[1, 1.3], t=whole shot, ease='linear');
  — step_cut: cut(at=floor contact) with beat_sync(event='step', grid='1/4');
