level: B
aliases: [car commercial, car ad, car product shot, car reveal, studio car shoot, motion-control orbit]
what: a studio "portrait" of a car — a dark hall with a huge softbox above the car, a camera on a robotic arm glides in an arc from a headlight, a door handle or a running light to the whole car; signature lighting, body lines, details
frames: |
  1. Dark studio: walls and floor almost black (30–70 % of pixels darker than 30 of 255), above the car a large glowing
     panel whose reflection lays a white line along the roof and the sides; a muted palette (saturation 21–38).
  2. Detail: a headlight, light-bar taillights, a flush door handle, a mirror, the steering wheel and the screen — glowing running lights as the main accent.
  3. Orbit reveal: in one continuous move the camera pulls back and circles in an arc — scale ×0.06–0.36 over 2.2–3.3 s,
     roll and rotation 12–46°, an almost even speed (half the path at 0.4–0.6 of the time); at the end the whole car,
     in three-quarter view or head-on in the center.
  4. Reverse move: a push-in ×1.5 with a 22° arc from the wide view to the grille or the lights.
  5. Feature: the handle extends and lights up, a hand pulls it; interior — a move along the dashboard to the steering wheel (≈90 % of the frame width over 3 s),
     blue ambient lighting in the dark.
  6. Packshot: the car in three-quarter view from above or from the front, static for 1–2 s, the lights on.
variants:
  - reveal from the headlight: a pull-out ×0.3 with a 46° arc from the headlight to a head-on view
  - reveal from the side: from the handle or a body line to the mirror and the whole side, ×0.06 over 3.3 s
  - push-in to the lights: from three-quarter view to the grille and the light bar, ×1.5 over 1.4 s
  - light signature: glowing taillights and running lights in close-up, then a cut to a wide shot
  - door feature: an extending illuminated handle, a hand enters after ≈0.6 s
  - interior: a move along the dashboard to the steering wheel in blue darkness
status: footage
fallback: "from photos of the car — generation of short orbits (image-to-video: \"a camera on a robotic arm slowly circles the car in a dark studio\") with consent; in code — a digital pull-out with rotation over a 4K frame (up to ×0.5 and 10°), a \"running highlight\" — a bright gradient band over the body mask, a dark vignette and a muted palette"
