id: product.shoes
family: product
group: aesthetics
level: B
aliases: [sneaker commercial, footwear ad, sneakers in frame, close-up footsteps, ground-level camera, feet shot, hero sneaker, sneaker spin]
what: footwear as the hero — a camera right at the ground follows walking feet, a sneaker in hand in close-up, a cut-out pair spins in jerks on a colored background; the rhythm of the steps and the sole are the main accent
frames: |
  1. Steps at the ground: the camera at a height of 5–20 cm, the feet walk toward the camera or along it, in frame from the ankle down,
     the sole and the side in close-up; the background — a night city with bokeh, a corridor with symmetrical lights or a running track.
     A slow push-in ×1.04–1.7 over 1.2–1.3 s or a side tracking move (a shift of ≈35 % of the width over 1.35 s) with a roll of up to 18°.
  2. A step as a cut: as the foot lands — a change of pair or location, the leg movement continues in the next shot.
  3. In hand: the sneaker held out to the camera in profile, sharp, the owner's face behind in soft focus; static 1–1.5 s.
  4. Into the depth: a push-in into the opening of the sneaker through darkness (×1.7 over 1.2 s) — the exit into the next scene through a similar round shape.
  5. Graphic showcase: a cut-out sneaker with a thick outline spins in jerks (hand-drawn animation on twos,
     ≈12 distinct phases per second), the background flickers between 2 colors every 2–4 frames, around it — a ring of kinetic typography.
variants:
  - steps toward the camera at the ground: a night city or a symmetrical corridor, the feet of several people, push-in ×1.7
  - side tracking: the camera moves next to the foot, a slight roll of 7–18°, the track's lane lines as dynamics
  - pair change on a step: every step — a new model or location, a cut on floor contact
  - sneaker in hand: the profile in close-up, the owner behind out of focus
  - sticker spin: a cut-out pair on an alternating colored background, jerky rotation, a ring of words
  - retro ad: illuminated shoe elements in the dark with star-shaped glint rays and a caption on top
status: footage
fallback: "steps at the ground — find any walking shot in the source footage and crop the bottom of the frame from 4K (reframe on the feet), add a slow push-in; the sticker spin is made in code from 6–12 photos of the pair or from a turnaround video: hf_remove_background + outline + alternating background + step_print(hold=2); missing shots with feet — generation with consent"
params:
  camera_height: 5–20 cm above the floor, the horizon in the top third, the footwear in the bottom half
  push: ×1.04–1.7 over 1.2–1.3 s on steps; tracking ≈25–35 % of the width per second; roll up to 18°
  shot: 1.2–2 s for steps, 1–1.5 s in hand, 1.5–4 s for the sticker spin
  cut_on_step: a cut on floor contact — on a beat of the track
  sticker: outline 2–4 % of the width, background alternates every 2–4 frames, rotation on twos (≈12 phases/s), 20–30° per phase
  look: night with bokeh or a clean "technical" corridor; saturated color accents on the sole
when: footwear ads and launches, a lookbook, unboxings and try-on videos (as cutaways), sports and street edits; steps — on the rhythm (every step = a beat), the sticker spin — on the drop and as a social media showcase, in hand — on a line about the product
avoid: footwear out of focus or cut off in the middle; dirt if the product is new; feet not landing on the rhythm of the track; a sticker spin without a clean mask (the background edges show); changing pairs too often (<0.5 s — the model does not read)
sfx: footsteps and sole squeaks close up, in sync with the contact; a click or a "pop" on every phase of the sticker spin; a bass hit on a pair change
genres: {product: signature, fashion: signature, sport: allowed, ugc: allowed, viral: allowed, fanedit: allowed, teaser: allowed, clips: allowed, phonk: allowed, motivation: allowed}
detect: |
  Bottom part of the frame: feet and soles in close-up, the camera at the floor (horizon and background in the top third, fine floor detail),
  rhythmic leg movement with a step period of 0.4–0.6 s.
  ed_motion: a slow ZOOM-IN ×1.04–1.7 over 1.2–1.3 s without shake (jitter ≤0.4 %) or a SHIFT of ≈35 % with ROTATE 7–18°.
  Sticker spin: a cut-out object with an outline on a plain background, holds of 2 frames (≈12 phases/s), the background changes color in a jump,
