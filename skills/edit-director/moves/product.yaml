id: product.bottle_hero
family: product
group: aesthetics
level: B
aliases: [bottle hero shot, beverage hero shot, bottle in its flavor world, flacon on ingredients, ingredient bed, flavor world, drink packshot, bottle ad shot]
what: a bottle or a flacon stands strictly in the center, label to the camera, and the whole background is its flavor or ingredient (apples, peaches, honeycomb, leaves) in one color; flavors change via falling or sliding ingredients, the ending is a lineup of flavors in stripes
frames: |
  1. Frame: the camera is frontal, at label height, static or with a barely noticeable push-in. The bottle is centered
     (x ≈ 0.5) and takes ≈70–90 % of the frame height in a horizontal format (≈12–15 % of the width), the label
     reads in full. The background is filled edge to edge with one ingredient: a scatter of green apples, peaches, honeycomb,
     branches with leaves; the background color matches the color of the flavor's label — the frame is almost monochrome and very
     saturated, the light is soft studio light, with a highlight on the glass.
  2. Flavor change: ingredients of the new flavor fly or roll across the frame in front of the lens with motion blur
     (≈0.2–0.4 s), or the ingredient bed slides sideways and reveals a plain background — and the bottle is already
     on the new background. The bottle stays in place during the change.
  3. Live variant: a hand brings the bottle into a "natural" scene (apple-tree branches in front of a green background),
     leaves it hanging among the leaves and withdraws; the leaves sway.
  4. Ending: a lineup frame — 2–4 horizontal stripes of equal height, each with the texture of its flavor
     (peaches / apples / honeycomb), or a row of bottles; holds for 1–2 s under a logo or a slogan.
variants:
  - ingredient bed: the bottle lies or stands in a scatter of fruit, shot from above or frontally
  - ingredient wipe: fruit falls or rolls in front of the lens with motion blur and changes the flavor
  - bed slide: the background texture slides away sideways or upward, revealing a plain background or the next flavor beneath
  - hand in frame: the bottle is brought in and left among branches, flowers, honeycomb
  - from above in a graphic frame: the bottle on a round tray in the center, around it a rope net, rings, a pattern; a light sway or rotation of the frame
  - flavor lineup: horizontal texture stripes one above another or a row of bottles at the end
status: footage
fallback: if the user only has a photo or a video of the product — cut out the bottle (remove_background) and place it on generated ingredient plates with the user's consent (a scatter of fruit from above, honeycomb, branches on a green background), adding a shadow and a highlight; the ingredient wipe — generate a short shot of "fruit falling in front of the camera" or use sprites with motion blur done in code; code assembles the stripe lineup from the plates by itself
params:
  product_size: 70–90 % of the height of a 16:9 frame (≈12–15 % of the width), center x 0.48–0.52; for 9:16 — 45–60 % of the height
  framing: frontal, the camera at label height; from above — the product in the center of a circle or a frame ≈50 % of the width in diameter
  background: one ingredient across the whole frame; high saturation, 70–90 % of the area one hue matching the label
  camera: static or a slow push-in ×1.03–1.1 over the shot; rotation of the frame from above ≤5°/s
  shot: 1–2.5 s per flavor (25–60 frames @25 fps); lineup — 1–2 s
  swap: ingredient wipe 5–10 frames (0.2–0.4 s) with motion blur; bed slide 8–12 frames, ease inOutCubic
  lineup: 2–4 stripes of equal height (25–50 % each), a straight seam, no feather
  light: a soft key from above and the side, a backlit highlight along the edge of the glass, a light shadow under the product
when: product ads and posts — presenting a lineup of flavors or variants, a cover hook in the first 1–2 s, a packshot at the end under a slogan or a logo; a flavor change — on every beat or bar; ideally 3–5 flavors in 6–12 s
avoid: a bottle off center or a turned label — the shot stops being a "hero"; a background of a different color than the label; a busy background of mixed ingredients; the bottle moving when the background changes (the anchor is lost); a cutout without a shadow and a highlight — it looks pasted on; for alcohol — platform and age restrictions, no drinking scenes
sfx: on the ingredient wipe — the rustle and thud of falling fruit, a whoosh; on a flavor change — a click or a hit on the beat; on the final lineup — a glass clink, the sound of a bottle opening or of pouring
genres: {product: signature, teaser: allowed, viral: allowed, fashion: allowed, ugc: allowed, clips: allowed, calm: allowed, explainer: allowed}
detect: |
  Visually: one product strictly in the center, the label frontal, the background a uniform repeating texture
  (identical fruit, honeycomb, leaves) of one color family across the whole frame; the background changes while the product
  stays still; a final frame made of horizontal texture stripes.
  Own check: the central vertical band of 10–15 % of the width is stable between background changes (high
  correlation), while the surroundings change hue in a jump; high background saturation, the dominant hue covers
  70 %+ of the area; a lineup frame has 2–4 horizontal zones with different mean hues and sharp boundaries.
  ed_motion: almost no global events (static or a slow ZOOM-IN ≤×1.1), on the wipes — short spikes
  in frame diff and a drop in sharpness for 5–10 frames without a global shift.
  Difference from product.* "on a turntable": here the product does not rotate. From mask.bg_replace: the background is not a location
  but a one-color world of the ingredient.
engine: |
  footage: find a shot of the product centered on a uniform background in the source footage (detect) and cut it by flavor.
  hybrid/generation: mask(method='hf_remove_background', target='bottle') → composite([plate_i, product, shadow(offset=[0,0.01], blur=0.02), glint(edge='right')])
  + transform(scale=[1, 1.05], ease='linear') on each shot;
  change: object_rain(sprites=ingredient_i+1, dir='down'|'ltr', count=12–20, dur=0.3, motion_blur=0.6) over a cut at its midpoint,
  or transition(kind='wipe(linear)', dur=0.4, params={dir:'up'}) for a bed slide;
  ending: split_screen(layout='rows3', plates=[p1, p2, p3]) + text(slogan) for 1.5 s.
gen_hint: product hero shot of a <bottle> standing perfectly centered with its label facing the camera, the whole background filled edge to edge with <green apples | ripe peaches | honeycomb>, matching the label color, soft studio light, glossy highlights on the glass, frontal locked-off camera, high saturation commercial look
commands: ["make a flavor ad: the bottle in apples, then in peaches, then in honeycomb", "put the product in the center on an ingredient background", "change the flavor with falling fruit on every beat", "ending — a flavor lineup in stripes and a slogan"]
related: [mask.bg_replace, orbit.turntable, frame.central, trans.wipe, layout.split_screen]
evidence: {examples: 5, sources: 2, measured: "only a visual review of all 5 examples of the section at 14 moments of the animation (scripted frame capture was blocked by browser permissions); product size and change durations are \"≈\" estimates from the frames", confidence: medium}
