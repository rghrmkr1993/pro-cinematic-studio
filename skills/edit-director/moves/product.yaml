id: product.hero
family: product
group: aesthetics
level: C
aliases: [product hero shot, hero product, product shoot, product shot, packshot, product reveal, product beauty shot]
what: shots where the product is the hero — a macro detail, a full reveal, a feature in action, the product in hand or in its own "world", a final packshot; a clean background, a slow camera, light tracing the contour
frames: |
  A typical layout of a product video — 6–12 shots of 0.8–3 s each:
  1. Teaser detail: a macro of the texture or a recognizable part (a headlight, stitching, a cap, a handle) — the product fills 60–100 % of the frame,
     often a dark background and a single light line along the edge.
  2. Reveal: a slow pull-out or an arc from the detail to the whole — scale ×0.3–0.7 over 1.3–2.7 s, rotation up to 45°,
     at the end the product in the center.
  3. Feature: a mechanism works in the frame (a handle extends and lights up, a cap comes off, a sole bends);
     a hand enters 0.3–0.7 s after the start of the shot.
  4. In hand or in use: the product held out to the camera (it is sharp, the person behind is soft) or in use (shoes walking,
     the camera at the ground).
  5. In its own world: the product among what it is made of or what it relates to (a bottle among apples, an object through
     a sports net) — a saturated palette, the product 10–15 % of the width but strictly in the center.
  6. Packshot: centered, static or a slow push-in ×1.05–1.1, 2–3 s, room for a logo and a call to action; sometimes a graphic
     showcase — a cut-out product on black with kinetic text around it.
variants:
  - reveal from a detail: a dark studio, a light strip above, a pull-out with an arc from a headlight or the logo to the whole object
  - feature close-up: a mechanism in action + a hand, a neutral gray or dark background, a click sound
  - product in hand: held out to the camera, low key, the face out of focus
  - product in its world: surroundings of ingredients or the context of use, a bright saturated background
  - in use: shoes walking toward the camera at the ground, clothes in motion, a drink being poured
  - graphic showcase: a cut-out product spins on black inside a ring or a cloud of typography
  - frame within a frame: the product in the center through a framing object (a net, an opening, glass), from above
status: footage
fallback: "from a single product photo: cut out the background (hf_remove_background) and build a showcase in code — a colored or dark background, rotation, push-in, text; the reveal — a digital pull-out over a 4K packshot; the surroundings of the \"world\" and the feature in action — generation from the product photo with consent (Higgsfield product presets)"
params:
  shots: 6–12 shots per 15–30 s; each 0.8–3 s, packshot 2–3 s
  product_share: macro 60–100 % of the frame; packshot 30–60 % of the height, center ±5 %; "world" 10–15 % of the width, but in the center
  camera: static or slow — push-in ×1.05–1.1 per shot, reveal ×0.3–0.7 over 1.3–2.7 s, arc up to 45°, inOutCubic; jitter <0.3 % of the frame
  background: dark seamless (brightness 30–75 of 255), neutral gray or white (saturation ≈0), or a saturated "world"
  light: backlight and key light along the contour, highlights on gloss; no blown-out areas on the logo
  hands: enter 0.3–0.7 s after the start of the shot, leave before the cut
  cut_points: shot changes on the beat; the reveal ends on a downbeat; the packshot — on the last hit of the track
when: product ads and launches, product overviews and unboxings (as cutaways), a product card for a marketplace, a product teaser; the detail — on the build, the reveal — on the drop, the packshot with the logo — at the end; the feature — when you need to explain what the product is for
avoid: a busy background and stray objects; the product off center in the packshot; a shaky handheld camera in the premium segment; cuts shorter than 0.5 s on the packshot — viewers have no time to read the product; dust, fingerprints, a cropped logo; a color grade that changes the real color of the product
sfx: a soft whoosh on the reveal; textured clicks and rustles on the feature (a cap, a handle, a lace) in close-up; a bass hit or a "chime" on the packshot; in macro — quiet ASMR foley
genres: {product: signature, teaser: allowed, ugc: allowed, fashion: allowed, explainer: allowed, viral: allowed, epic: allowed, calm: allowed, sport: allowed, phonk: allowed}
detect: |
  One sharp, well-lit object in the center of the frame (±5 %), the background plain or blurred (little texture away
  from the object); background saturation ≈0 (gray) or background brightness 30–75 (a dark studio), less often a saturated "world".
  ed_motion: static or slow even moves — ZOOM-OUT ×0.3–0.7 over 1.3–2.7 s with ROTATE up to 45° (a reveal),
  push-ins ×1.05–1.1, nonrigid 0.3–0.4 (a real camera around the object), jitter ≤0.3 %.
  Signs: macro with a shallow depth of field, a hand enters the frame toward the object, a logo and text toward the end.
  Difference from orbit.turntable: that is a single device — rotation on a platform; here it is the whole grammar of product shots.
  From a UGC review: there a handheld camera, an apartment background, the product off center.
engine: |
  product_sequence(subject=track(object:<product>), shots=['detail', 'reveal', 'function', 'in_hand', 'world', 'packshot'],
                   per_shot=[0.8, 3], cut='beats')
  — reveal: transform(scale=[2.5, 1], center=track(object), rotate=[-10, 0], t=[0, 2], ease='inOutCubic') over a 4K packshot;
  — packshot: transform(scale=[1, 1.08], t=whole shot, ease='linear') + text(logo/CTA, safe_zone='tiktok');
  — showcase: mask(method='hf_remove_background') + composite(background: solid|gradient) + transform(rotate) + kinetic_text;
  — "world" and feature without source footage — generation from the product photo (product presets), with consent.
gen_hint: premium product commercial shot of <product>, centered on a seamless <dark / neutral grey> background, soft rim light tracing its contours, slow camera pull-back from a macro detail to the full product, shallow depth of field, clean reflections, no clutter
