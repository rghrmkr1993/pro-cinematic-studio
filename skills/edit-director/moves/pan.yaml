id: pan.basic
family: pan
group: camera
level: A
aliases: [pan, horizontal pan, panning, camera rotation, follow pan, reveal pan]
what: the camera stays in place and rotates horizontally — it follows a moving subject, shifts the view from one character to another, or reveals the space
frames: |
  1. Start: a static frame of 0.3–1 s (or already in motion if we are following a subject).
  2. Acceleration 0.2–0.5 s → the move → deceleration 0.4–1 s. The vertical barely changes (< 10 % of the frame), the horizon is level,
     the scale is constant (±5 %), there is almost no parallax — only the viewing direction changes.
  3. Speed: a survey pan at a steady 30–45 % of the frame width per second; a follow pan at 50–70 %/s, the subject stays in the 0.35–0.65 zone
     of the frame (the pan can speed up after it from 15 to 120 %/s); a transfer or a reveal — an S-curve peaking in the middle at up to 100–210 %/s
     with a soft landing.
  4. Landing: a hold of 0.5–1 s on the new subject; amplitude per move 70–155 % of the frame width, duration 1.5–4 s.
variants:
  - follow: tracks a walking, driving or falling character at a steady speed
  - transfer: from one character to another or to a reaction, without a cut
  - reveal: from a detail or a character to the overall view, the location, an unexpected object
  - with a foreground: the subject rushes past, the pan continues, and a pole or a tree enters the frame — a natural wipe
  - survey: slowly across a landscape or a row of people
status: footage
fallback: |
  code: a crop pan across a wide frame — from 4K to 1080 you can travel up to 100 % of the output frame width, from horizontal 16:9
  to vertical 9:16 — up to 215 %; across a panoramic photo or a 360 frame — without limits. Beyond that — search for a real
  pan in the source footage (detect) or generation via gen_hint with the user's consent.
params:
  speed: survey 30–45 %/s; follow 50–70 %/s (after the subject 15–120 %/s); transfer and reveal peak 100–210 %/s
  amplitude: 70–155 % of the frame width per move (≈40–90° with a normal lens)
  duration: 1.5–4 s (38–100 frames @25 fps)
  ease: survey and follow — linear with short acceleration and deceleration; transfer and reveal — inOutCubic or outCubic with a long landing
  hold: before the move 0.3–1 s, after it — from 0.5–1 s
  subject_zone: when following, the subject at 0.35–0.65 of the frame width, more room ahead in the direction of movement
  judder: without motion blur no faster than ≈4 % of the frame per frame @25 fps (≈100 %/s); faster — directional blur, or the pan turns into a jerk
when: |
  travel and intros — revealing the place; sport and action — following the subject; dialogue and reaction without a cut — a transfer
  from character to character; before the drop — a reveal under the rise, landing on the downbeat. Neighboring pans in the edit —
  in the same direction or with a meaningful change of direction.
avoid: a fast pass over a small detail without motion blur (the image stutters); a pan that arrives nowhere (landing on emptiness); mixing a pan with a zoom and a tilt for no purpose; opposite directions in neighboring shots for no reason; a crop pan on 1080p with less than 20 % margin
sfx: usually no effects; on a fast reveal — a soft whoosh at the peak; when following — the sound of the subject itself (a pass-by, footsteps); the landing can get a musical accent
genres: {travel: signature, calm: allowed, epic: allowed, drama: allowed, sport: allowed, product: allowed, explainer: allowed, teaser: allowed, clips: allowed, fashion: allowed, ugc: allowed, motivation: allowed, viral: allowed}
detect: |
  ed_motion: horizontal SHIFT of 50–160 % of the frame over 1–4 s in one direction; vertical shift < 10 %; ZOOM within ±5 %;
  ROTATE < 2°; nonrigid < 0.2 (rotation in place); low jitter. Speed profile: an S-curve (transfer, reveal) or a plateau
  (follow). On fast sections with a step of 3–4 frames ed_motion reports false cuts — check with a step of 1.
  Difference from trucking (sideways tracking): there is parallax — the near moves faster than the far, nonrigid > 0.3.
  Difference from a whip pan: shorter than 0.5 s, peak above 15–20 % of the frame per frame, the whole frame is blurred.
  Difference from pan.round_table: the camera is in the center of a circle of people, faces of the same shot size replace one another.
engine: |
  Real shot: cut(at) at the start of the acceleration and after the landing (hold ≥ 0.5 s); speed(rate=1.2–2) for a dragging survey pan.
  Code: transform(shift=[[x0, 0], [x1, 0]], t=[t0, t0+D], ease='inOutCubic'|'linear') over a crop of a wide frame,
  |x1 − x0| ≤ the available margin; + blur(kind='directional', amount∝speed) at speeds above 4 % of the frame per frame.
  Follow in vertical format: reframe(aspect='9:16', target=track(person)) with 0.3–0.5 s smoothing.
gen_hint: smooth horizontal camera pan from <subject A> to <subject B>, tripod-mounted camera rotating in place, steady speed with a soft landing, no dolly movement, natural motion blur
commands: ["a smooth pan across the landscape at the start", "follow the car with a pan in #4", "a pan from the subject to the friend's reaction instead of a cut", "make a left-to-right pan over 3 seconds from wide #2"]
related: [pan.round_trip, pan.whip, pan.round_table, tilt.basic, truck.lateral, drone.aerial]
evidence: {examples: 6, sources: 6, measured: "amplitude 75–155 % of the frame width over 1.5–2.8 s; survey pans at a steady 30–46 %/s; follow 50–66 %/s (accelerating from 14 to 120 %/s after a passing car); reveal — peak 6.9–15 %/frame at 14 fps (≈100–210 %/s), ease-out landing 1–1.5 s; vertical < 6 %, zoom ±4 %, nonrigid 0.01–0.02; 2 of 6 are round trips, counted in pan.round_trip", confidence: high}
---
id: pan.round_table
family: pan
group: camera
level: C
aliases: [circular pan from the center, camera at the center of the table, pan around the circle, round table pan, inside-out 360, center spin, 360 pan]
what: the camera stands in the center of a circle of people (a table, a car interior, a room) and rotates in place, showing each person in turn — smoothly around the circle or in snaps from face to face
frames: |
  The camera is at table or seated eye level, often right on the tabletop; people sit in a circle at the same distance,
  so each one appears in the frame at the same shot size (close-up to medium) and looks toward the center, that is, into the camera.
  Two modes:
  1. Continuous: even rotation without stops — 18–25 % of the frame width per second in a cramped car interior
     (≈20°/s, a full circle in 10–15 s) or 75–135 %/s in a crowd and at a party (≈50–90°/s).
  2. Stop-and-snap: a hold on a person for 0.6–6 s (usually 1–2 s) → a 0.3–0.8 s snap with motion blur (peak 15–21 % of the frame
     per frame) → the next person; for two people sitting opposite each other — a 180° turn in ≈0.6–0.8 s.
  Objects on the circle itself (plates, glasses, cutlery) stay still in the frame while the whole world behind them drifts —
  a sign that the camera is riding on a rotating stand. Coverage — from 180° to a full circle and more.
variants:
  - dialogue across a table: two people opposite each other, a 180° snap between lines
  - circle of friends: a hold on each person with a line to camera, snaps in one direction
  - car interior: slow rotation past the driver and passengers, night lights in the windows
  - party or dance floor: fast continuous rotation from low down, people pass right up close
  - view from below: the camera on the floor looks up, rotating around a circle of standing models — the image also rotates by 40–90°
  - camera and objects on the same circle: the table turns between cuts, the same dishes in front of every guest
status: footage
fallback: |
  1) 360 camera: a virtual pan over an equirectangular frame (reframe360) — gives both the continuous and the stop-and-snap variant;
  2) faking from separate close-ups of each person: a chain of whip transitions strictly in one direction, one person per beat;
  3) generation with the user's consent via gen_hint
params:
  continuous_speed: 18–25 %/s (≈15–25°/s) calm; 75–135 %/s (≈50–90°/s) energetic
  hold: 0.6–6 s per person, typically 1–2 s (25–50 frames @25 fps) or 1–2 bars
  whip: 0.3–0.8 s (8–20 frames @25 fps), peak 15–21 % of the frame per frame, directional blur
  coverage: 180° (two people opposite each other) — 360°+ (the whole circle); the direction of rotation does not change
  framing: each person in the center of the frame, close-up or medium shot, the same camera height
  tilt_up_roll: with the camera looking up, the image rotates by 40–90° per revolution
when: |
  introducing the participants (a podcast with guests, a team, a family dinner, friends in a car); a "circle of reactions" to
  news — everyone reacts in turn; tension at a negotiating table; party energy. In an edit to music —
  the snap on the downbeat, a hold of 1–2 bars. Once per video, it is a noticeable stylistic move.
avoid: people not in a circle or at different distances (the shot size jumps); a long line from one person (the camera moves away); a continuous circle longer than 4 s with no face in the frame; faking with snaps in different directions (breaks the feeling of a single rotation); too long a lens — the snaps cause motion sickness
sfx: a whoosh on each snap, on the beat; in the continuous variant — no effect or a barely audible pass-by; a light click or hit when the camera stops on a face
genres: {viral: allowed, ugc: allowed, drama: allowed, product: allowed, fashion: allowed, travel: allowed, explainer: allowed, clips: allowed, fanedit: allowed, teaser: allowed, calm: allowed}
detect: |
  ed_motion: a long one-directional horizontal SHIFT totaling 150–700 % of the frame, nonrigid < 0.2 (pure rotation in place);
  in stop-and-snap — static sections (no events for 0.6–6 s) alternate with short SHIFTs of 15–21 %/frame, where ed_motion often
  reports false "cuts"; with the camera tilted up, a ROTATE of 40–90° comes alongside.
  Visually: faces in the center of the frame in turn at the same shot size, everyone looks toward the center; objects on the table are still in the frame.
  Difference from pan.basic: an ordinary pan follows a moving subject or a landscape; here the people sit and the camera spins among them.
  Difference from an orbit (arc): an orbit has one subject in the center and background parallax; here the camera stays in place and people replace one another.
  Difference from cuts with whip transitions: in the real move the continuous background between people is visible in the blur.
engine: |
  Real shot: cut(at) at the boundaries of the holds; speed(rate=1.5–3) on a long continuous revolution; snaps — beat_sync(event='whip_mid', grid='1/2').
  360 source: reframe360(yaw=[0, 72, 144, 216, 288, 360], pitch=0..+15, fov=75, t=holds+snaps, ease='inOutCubic')
    — for the continuous variant ease='linear', 20–90°/s.
  Faking: a sequence of close-ups + transition(kind='whip', dur=0.35, params={direction:'left', blur:'directional'})
    between each, one direction for the whole chain; hold of 1–2 bars; sfx('whoosh', at=middle of the snap).
gen_hint: camera placed at the center of a round table, rotating in place and panning from face to face of <N people> sitting around it, each person looks into the lens as the camera passes, eye level, objects on the table stay fixed in the foreground
commands: ["circular pan across the guests at the table", "make a circle of reactions from #3–#7 with snaps in one direction", "from the 360 video — a slow revolution around the car interior", "one person per beat, a snap between them"]
related: [pan.basic, pan.whip, orbit.turntable, rig.spin_lock, arc.orbit]
evidence: {examples: 7, sources: 7, measured: "continuous rotation 25 %/s in a car interior and 74–134 %/s in a crowd and from below; stop-and-snap: holds 0.6–6 s, snaps 0.3–0.8 s peaking at up to 21 %/frame; a 180° turn in 0.77 s; when looking up, the image rotates by 60–86° over 1.7–1.9 s; nonrigid 0.01–0.15; 3 more examples of the same type were found in the neighboring subsection", confidence: high}
