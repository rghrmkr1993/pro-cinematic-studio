id: pan.whip_back
family: pan
group: camera
level: B
aliases: [whip back, whip and return, there-and-back whip pan, double whip pan, snap and return, ping-pong pan, double take pan]
what: a pair or a series of whip pans in opposite directions — the camera snaps to B, holds briefly and returns to A with the same whip, or darts between faces
frames: |
  1. Hold on A: 0.3–0.6 s in a fast series, 1–2 s before a single pair.
  2. Whip there: 0.25–0.5 s (6–12 frames @25 fps), a core of 2–4 frames of solid horizontal motion blur (sharpness
     ×0.05–0.3); at the edges of the whip the speed is 10–23 % of the frame width per frame.
  3. Hold on B: 0.3–0.5 s — a comedic pause ("there's nothing there", a reaction), up to 1–2 s in a regular delivery.
  4. Whip back: mirrors the first in duration (±2 frames) and has the same blur, landing on A; variations — on A
     at a different shot size or on a new subject C on the other side.
  Cycle A → B → A — 1.2–2 s. Scanning: 4–5 whips in 3 s alternating sides, pauses of 6–15 frames.
variants:
  - double take: A points to the side → whip there → empty or absurd → whip back to A (comedy)
  - swap: while the camera "looked away", something changed with A — the look, the person, an object
  - closer return: the whip back lands on the same character in a close-up (the cut is hidden in the blur)
  - crowd scan: short whips across the faces of a choir or an audience in different directions every 0.5–0.7 s
  - alternating scenes: each whip changes the scene, the direction is opposite each time — a rhythmic cut-up montage
status: code
fallback: |
  Code: two digital whips in opposite directions within one wide or 4K shot (crop ×1.6–2.5 on A and B)
  or a pair of trans.whip transitions between clips with alternating direction. Real whips from the source footage are better —
  search by the detect signature. Generation — with the user's consent.
params:
  whip: 0.25–0.5 s per whip (6–12 frames @25 fps), blur core 2–4 frames
  edge_speed: 10–23 % of the frame width per frame on acceleration and landing
  hold_b: 0.3–0.5 s (comedy), 1–2 s (regular delivery)
  whip_back: mirrors the first, duration ±2 frames, the same blur
  cycle: A → B → A over 1.2–2 s
  scan: 4–5 whips in 3 s, pauses of 6–15 frames, sides alternate
  ease: inExpo → outExpo on each whip
  sync: whip there — on a beat, the return — on the next beat or an off-beat
when: |
  A comedic "double take" and swap, a call-and-response between two characters or instruments, scanning faces in a crowd,
  a fast rhythmic edit of several scenes. Hook and drop — one cycle on downbeats; a series — no more than 3 cycles
  in a row, beyond that it causes motion sickness.
avoid: different speeds and lengths for the whips there and back — the rhythm breaks; more than 3 cycles in a row; a calm tone; a completely meaningless B when it isn't meant as a joke; different exposure on A and B with no darkened zone between them
sfx: a paired swish-swish (the return whip — the same whoosh or its reverse); on an empty B — a comedic "bonk" or silence; landings on the beat
genres: {viral: allowed, ugc: allowed, fanedit: allowed, phonk: allowed, travel: allowed, clips: allowed, teaser: allowed, calm: forbidden}
detect: |
  ed_motion: two SHIFT events along X of opposite sign, 0.3–2 s apart, each with 1–3 pairs of
  "cuts" in the core; the first and last stable frames are similar (back to A) or the palette is the same.
