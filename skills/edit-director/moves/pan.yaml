id: pan.round_trip
family: pan
group: camera
level: B
aliases: [there-and-back pan, return pan, pan swing, glance away and back, double take pan, round-trip pan, yo-yo]
what: "a glance away and back: after a short look at something beside the subject, the camera settles on its exact first framing again"
frames: |
  1. Starting frame: the subject, 0.2–1 s.
  2. Move away: a turn of 25–75 % of the frame width over 0.44–2 s along an S-curve (acceleration, peak, deceleration).
  3. Pause at the far end: 0.24–1.3 s (up to 5 s in the slow version) — there is a second character, a detail, the "backstage" of the set
     or the same subject in another place (the double trick).
  4. Return: the same amplitude in the opposite direction and the same curve; the final frame matches the starting one to within
     0–3 % of the width (sometimes perfectly — the return is made by reversing the move away).
  Fast version: peak ≈12 % of the frame per frame (≈300 %/s) with strong motion blur, the whole cycle 1.1–1.3 s. Slow: 30–80 %/s, cycle 4–6 s;
  sometimes a triple move center → left → right → center.
variants:
  - fast "double take": move away and return of 0.44 s each, a 6-frame pause, motion blur during the move
  - slow theatrical: the camera moves off to the edge of the set, sees the backstage, returns to the subject
  - double trick: the same subject again at the far end
  - there-and-back transfer: from the subject to the other person with a long pause and back with a snap
  - subject-led: the subject turns around and the pan follows them back (the return is inexact)
status: footage
fallback: |
  code: on a wide or 4K frame — a crop pan there and back (up to 100 % of the output frame width from 4K, up to 215 % from 16:9 to 9:16);
  the return can be built by reversing the move away; faking in the edit — shot A → whip transition → shot B (pause) → reverse whip → continuation of A;
  otherwise generation via gen_hint
params:
  amplitude: 25–75 % of the frame width (with whip moves up to 100–150 %); move away = return to within ±3 %
  stroke: fast 0.4–0.5 s (10–12 frames @25 fps) with a peak of 10–12 %/frame; slow 0.8–2 s (20–50 frames) with a peak of 3–6 %/frame
  hold_far: 0.24–1.3 s (6–32 frames), for transfers up to 5 s
  hold_start_end: 0.2–1 s
  ease: inOutCubic on each move, mirrored
  blur: directional blur at speeds above 4 % of the frame per frame
  beat: move away on a beat, return on the next beat or a bar later
when: a comedic "double take" and reaction; showing a detail and returning to the subject; a device of the "deliberately staged" frame with symmetry and a theatrical set; the double trick in a music video; no more than 1–2 times per video
avoid: different amplitudes for the move away and the return (looks like a camera operator's mistake); a pause longer than 2 s in the fast version (the return reads as a new pan); a fast move without motion blur at 25 fps; on top of handheld shake
sfx: in the fast version — a short whoosh on each move, in comedy — a sound accent on the pause; in the slow one — no effects, under the music
genres: {viral: allowed, ugc: allowed, fanedit: allowed, clips: allowed, fashion: allowed, teaser: allowed, explainer: allowed, drama: allowed, calm: allowed}
detect: |
  ed_motion: two horizontal SHIFTs of opposite sign and similar magnitude (absolute value of the sum < 5 % of the frame), with a pause
  of 0.2–5 s without events between them; the first and last frames almost match (phase correlation shift < 3 %); on fast moves
  with a step of 3–4 frames — false cuts and a sharpness drop to ×0.25–0.35.
  Difference from a there-and-back whip pan: there each move takes 0.1–0.3 s, the frame is fully blurred, often with a cut at the far end.
  Difference from zoom.in_out: there the scale changes, not the viewing direction.
engine: |
  Code: transform(shift=[[0,0],[A,0],[A,0],[0,0]], t=[t0, t0+D, t0+D+H, t0+2D+H], ease=['inOutCubic','hold','inOutCubic'])
  over a crop of a wide frame; A=0.25–0.75 of the width, D=0.44 s (fast) or 1–2 s (slow), H=0.24–1.3 s;
  + blur(kind='directional') on moves faster than 4 %/frame; the return may be done as reverse() of the first half.
  Edit-based faking: cut → transition(kind='whip', dur=0.2) → shot B (H) → transition(kind='whip', dur=0.2, params={direction:'reverse'}) → shot A.
  + sfx('whoosh', at=middle of each move)
gen_hint: camera pans from <subject> to <second subject or detail> beside them, pauses for a beat, then pans back to exactly the original framing, symmetrical deliberate movement, locked-off tripod
commands: ["round-trip pan to the reaction in #3", "do a double take: pan to the dog and come back to the subject", "a round-trip pan over two beats", "slowly show the edge of the set and come back to the host"]
related: [pan.basic, pan.whip, zoom.in_out, time.boomerang]
evidence: {examples: 5, sources: 5, measured: "3 examples from its own subsection + 2 from the main one: fast — move away of 71 % over 0.44 s (peak 11.8 %/frame), pause 0.24 s, identical return (shift 0 %, the frames match); slow — 27–73 % over 0.84–2.1 s, pauses 0.8–5 s, return accurate to 1.3–2.9 %; triple move +27/−58/+27 %; in 1 example the subject-led return is inexact (35 %)", confidence: medium}
