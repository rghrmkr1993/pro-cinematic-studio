id: pan.whip
family: pan
group: camera
level: B
aliases: [whip pan, swish pan, flash pan, snap pan, sideways camera snap]
what: a lightning-fast sideways turn of the camera within one scene — the frame breaks into horizontal motion blur and half a second later settles on another subject in the same space
frames: |
  1. Hold on subject A 0.4–2 s; sometimes the camera already starts drifting in the direction of the whip (3–7 % of the frame width per frame).
  2. Acceleration over 2–4 frames: 6 → 16 → 24 % of the frame width per frame (@20 fps), sharpness drops to ×0.3.
  3. Core of 3–7 frames (0.15–0.5 s): solid horizontal motion blur, sharpness ×0.02–0.3 of the static frame, the gradient
     ratio Gy/Gx grows 1.5–3 times. In 4 of 7 examples a dark or plain zone passes through the core — a wall,
     darkness, the floor.
  4. Landing over 3–6 frames: the speed drops 22 → 15 → 5 → 1 %/frame, subject B slides in from the opposite side
     and settles in the center ±0.15; no bounce, sometimes a slight creep into place.
  The whole whip takes 0.4–0.84 s (10–21 frames @25 fps). The light and the space stay the same — it is one take: the whip connects two
  points of the scene in real time.
variants:
  - ping-pong: whips back and forth between two people (a dialogue, a duet, a conductor and a musician) every 1.4–2.5 s — details in pan.whip_back
  - to the observer: from the action on stage to the person watching from a doorway or the audience
  - into depth: from a nearby group to a distant figure at the end of the hall — the whip also changes the shot size to a wide shot
  - behind the scenes: from the speakers to the prompter, a monitor or the film crew — breaks the illusion, a comedic move
  - after something fast: a pan following cars or a player at up to 18 %/frame, moderate motion blur (sharpness ×0.77), 1.1 s
  - through darkness: the core passes over black, a different person on the way out — a borderline case with a hidden cut
status: code
fallback: |
  Code: a digital whip within one wide or 4K shot that contains both A and B — crop ×1.6–2.5 on A, a fast move of the
  crop to B with directional blur. A real whip in the source footage looks better — search by the detect signature.
  A and B in different places — that is already trans.whip. Generation — with the user's consent.
params:
  duration: 0.4–0.84 s in total (10–21 frames @25 fps); blur core 0.15–0.5 s (4–12 frames @25 fps)
  peak_speed: on acceleration and landing 16–24 % of the frame width per frame @20 fps; in the core ≈25–50 % (from the blur length)
  travel: ≈1–3 frame widths
  ease: inExpo 2–4 frames → outExpo 3–6 frames, no bounce
  blur: directional horizontal, sharpness ×0.02–0.3; blur length ≈20–50 % of the frame width
  hold_a: 0.4–2 s
  hold_b: from 1 s; in a ping-pong the next whip comes after 1.4–2.5 s
  landing: subject B in the center ±0.15
  digital_scale: crop ×1.6–2.5 for a digital whip (needs resolution headroom)
when: |
  Connect two people, or an action and a reaction, in one space without a cut: a dialogue, a musical call-and-response,
  a strike — the team's reaction, "who sees this". Put the whip on a drum fill or the snare; a ping-pong — on a
  rhythmic passage. Outside a series — no more often than once every 10–15 s.
avoid: calm genres; landing off the subject; whips in different directions in a row with no spatial logic; large text in the frame (the blur reads as a defect); A and B from different places — then it is trans.whip; more than 6–8 whips in a row — causes motion sickness
sfx: a whoosh or swish over the whole whip, peaking in the middle of the core; on the landing — a hit or a fill that coincides with the drums
genres: {fanedit: allowed, viral: allowed, ugc: allowed, travel: allowed, sport: allowed, phonk: allowed, clips: allowed, teaser: allowed, drama: allowed, explainer: allowed, calm: forbidden}
detect: |
  ed_motion: SHIFT along X accelerating to 16–24 %/frame, then 2–7 pairs are marked as "cuts" (tracking loses points
  in the blur), after that a SHIFT in the same direction decaying 22 → 1 %/frame; the light and palette before and after the blur are the same.
  Own measurement: 3–7 consecutive frames with sharpness ×0.02–0.3; Gy/Gx grows 1.5–3 times relative to the static part of the same
  shot (horizontal blur; in tilt.whip it falls).
  Difference from trans.whip: there the histogram and the location change across the blur. From an ordinary pan: all frames are readable,
  ≤ 8 %/frame. From truck.lateral: near and far move at different speeds, the blur does not cover the whole frame.
  From zoom.crash: the blur is radial, there is a ZOOM.
engine: |
  code: whip_reframe(a=track(person_A), b=track(person_B), dur=0.45, scale=1.6–2.5, ease='inOutExpo',
  blur='directional') = transform(scale=[S, S], center=[A, B], t=[t0, t0+0.45], ease='inOutExpo')
  + blur(kind='directional', angle=0, amount∝speed) + sfx('whoosh', at=t0+0.22, align='peak'); land on the beat.
  footage: find a whip via detect and do not cut inside it; ping-pong — a chain of whip_reframe(A→B→A…) every ½–1 bar.
gen_hint: fast whip pan inside one room from <subject A> to <subject B>, the camera snaps sideways with heavy horizontal motion blur for a few frames, then stops sharply on <subject B>, one continuous take
commands: ["whip pan from the speaker to the listener at 0:12", "whip the camera from the drummer to the conductor and back in the chorus", "whip pan inside wide shot #3 from the left character to the right one", "snap pan to the reaction on the drop"]
related: [trans.whip, pan.whip_back, tilt.whip, truck.lateral, zoom.crash]
evidence: {examples: 7, sources: 7, measured: "the whole whip 0.4–0.84 s, core 3–7 frames (0.15–0.5 s); acceleration and landing 16–24 %/frame @20 fps; sharpness in the core ×0.02–0.3, Gy/Gx grows ×1.5–3; all 7 are horizontal; a dark or plain zone in the core in 4 of 7; 1 example — a ping-pong of 5–6 whips in 10 s; 1 — a fast pan following cars without full motion blur", confidence: high}
