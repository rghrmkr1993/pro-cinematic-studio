id: time.boomerang
family: time
group: time
level: B
aliases: [boomerang, ping-pong loop, ping-pong, back-and-forth, forward-reverse loop, reverse loop]
what: a 0.25–1 s stretch of motion plays forward, then mirrored back to the starting pose, 1–4 times — the gesture "bounces" back and forth like a rubber band
frames: |
  1. Take one complete motion of 0.25–1 s (typically 0.4–0.5 s = 10–12 frames @25 fps): a swish of fabric,
     a head turn, a lean, a laugh, a gesture, a throw.
  2. The segment plays forward to the peak (the point of maximum swing) and with no pause plays backward to the starting pose —
     the frames are mirrored: frame p−k matches p+k.
  3. At the turning point the motion slows down (the difference between neighboring frames drops 2–4 times), so the joint doesn't jerk;
     the peak frame is not duplicated.
  4. 1–4 cycles (a full cycle 0.7–1.9 s); with several reversals they fall into a rhythm of ≈ every 0.5 s.
  5. Exit — a cut or the shot continuing forward with a new action.
variants:
  - single: forward and back once, cycle 0.7–1.9 s
  - rhythmic ping-pong: 3–4 reversals in a row of ≈0.5 s each, reversals on the beats
  - throw-and-return: an object or fabric flies off and comes back into the hands, 7–9 frames each way
  - asymmetric: slowly forward (1–1.5 s), then a fast rewind ×4–5 to the start in 0.25–0.3 s and straight into a new action
  - with a handheld camera: the reverse pass also repeats the camera movement — the roll rocks one way, then the other
status: code
params:
  segment: 6–24 frames @25 fps (0.25–1 s) one way, typically 10–12 (0.4–0.5 s)
  cycles: 1–4, typically 2
  pivot: the frame of maximum swing; the reversal on a downbeat
  pivot_ease: if the motion is fast at the peak — 2–3 frames of ×0.5 slowdown before and after the reversal (mirrored)
  rewind_rate: 1 (symmetric) or 3–5 (fast rewind)
  total: 0.7–2.5 s for the whole move
  beat: cycle = 1 beat (≈0.5 s at 120 BPM) or half a bar
when: dance, a gesture, a hair or fabric flip, a jump, a throw, splashes, a funny reaction; repeating a phrase or a beat in the chorus; a hook and an addictive loop for social media; no more than 1–2 times per minute of video
avoid: shots where the reverse pass gives itself away — smoke, water, fire, passers-by in the background walking backwards; on-camera speech (mouth in reverse); a segment longer than 1 s one way — the springiness is lost; more than 4 cycles in a row; serious and dramatic scenes — the move reads as a joke
sfx: on the reverse pass — a reverse whoosh or a "tape rewind"; in comedy the segment's audio can be reversed too; in music-driven editing the music runs steadily, the reversal — on a beat
genres: {viral: signature, ugc: signature, fanedit: allowed, phonk: allowed, fashion: allowed, sport: allowed, travel: allowed, product: allowed, clips: allowed, drama: forbidden, epic: forbidden, teaser: forbidden, motivation: forbidden}
detect: |
  Mirroring: frame p−k ≈ frame p+k for k = 1…K (K ≥ 5), difference ≤ 0.3–0.5 of the difference between neighboring frames;
  the difference profile is symmetric around p with a dip at the turning point. Several reversals — dips every ≈10 frames.
  ed_motion: mirrored pairs of events — clockwise/counterclockwise ROTATE of similar magnitude, SHIFT there and back,
  ZOOM-IN and ZOOM-OUT whose factors multiply to ≈1 with no cut between them; a fast rewind — a short event of 3–6 frames.
  Difference from zoom.in_out: there only the framing rocks, while the action in the frame moves forward.
  From a seamless loop (repeat from the start): there the first frame comes right after the end, no reversal.
  From cut.stutter: there chunks repeat forward. From reverse playback: there is no forward pass.
engine: |
  loop(mode='pingpong', seg=[t0, t0+0.45], cycles=2, pivot_ease=0.1, rewind_rate=1)
  — ffmpeg: trim the segment → split → reverse the second copy, without its first frame → concat; repeat cycles times.
  Asymmetric: speed(rate=4) on the reversed copy. Put the reversal on a beat: beat_sync(event='pivot', grid='1/4').
  + sfx('reverse_whoosh', at=pivot, align='attack') optionally.
gen_hint: <subject> performs one short expressive motion (<hair flip / throws a silk scarf / jumps / laughs and leans back>), static camera, clean background, the motion has a clear start, peak and end, no other moving objects in the frame
commands: ["boomerang on the fabric swish in #3", "loop the jump back and forth 3 times on the chorus", "ping-pong on the laugh in #6, reversal on the beat", "slow push-in and a fast rewind back in #2"]
related: [zoom.in_out, cut.stutter, loop.end, time.freeze, time.speed_ramp]
evidence: {examples: 6, sources: 2, measured: "one-way segment 5–19 frames (0.25–0.95 s), typically 9–11; mirrored pairs with a difference of 0.1–0.4 of the neighboring one; 1–4 reversals, in ping-pong ≈every 10.5 frames (0.52 s); a 2–4 times dip in difference at the turning point; 1 asymmetric example — a ×5 rewind over 6 frames; with a handheld camera — roll alternating ±2.5–5.7°", confidence: medium}
