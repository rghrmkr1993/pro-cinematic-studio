id: time.freeze
family: time
group: time
level: B
aliases: [freeze frame, frame freeze, freeze, stop moment, freeze-frame intro, character intro on a freeze frame]
what: the action suddenly stops on a single frame and holds for 0.5–3 s — captures the peak of an emotion or action, introduces a character, puts a full stop on a scene or the ending
frames: |
  1. The action runs at normal speed (or in slow motion) and approaches the peak: a scream, a jump, a gunshot, a punch,
     a hug, a head turn toward the camera, a pose with a hand gesture.
  2. Stop: a single frame freezes instantly, with no deceleration (deceleration is time.speed_ramp into a stop). Often
     at the moment of the stop — a white flash of 1–3 frames and a shutter sound (the frame as a taken photo); sometimes
     a viewfinder frame with focus marks on top.
  3. Hold 0.5–3 s. On the frozen image: a name or title (cut-out sticker letters, a large
     font), a switch to black-and-white or faded color, a slight slow zoom-in ×1.05–1.2 or a sharp
     punch-in, sometimes the frame shrinks into a photo card with a white border and a tilt.
  4. Exit: a cut to the next scene, the action resuming from the same frame, or the ending — the freeze holds
     until the fade to black or the end titles.
variants:
  - stop at the peak of action: a jump, a punch, a gunshot, the frame of a fall — 0.5–1.5 s, often with a punch-in
  - character intro: a stop on the face or pose + name and role in a large or cut-out font, 1.5–3 s
  - snapshot: a white flash + shutter, the frame becomes a photo (B&W, border, tilt) — "moments" compilations
  - final stop: the last frame of the scene or video freezes, with a title or a fade to black on top, 2–5 s
  - stop rhythm: several short stops of 0.2–0.5 s on the beats — in music videos and dance
  - color change: in the stop the color goes to B&W, sepia or a faded tone — a "memory"
status: code
fallback: a freeze frame can be made on any video; if the peak frame is blurred — take a neighboring sharp frame (by max sharpness in a ±3 frame window) or sharpen it; if you need a freeze with a cut-out character over a live background — hybrid (mask(person) on a single frame over the continuing video)
params:
  hold: 0.5–3 s (12–75 frames @25 fps); action peak — 0.5–1.2 s, character intro — 1.5–3 s, ending — 2–5 s
  freeze_at: the peak frame (max pose, contact, emotional peak) with maximum sharpness in a ±2–3 frame window
  entry: instant, on 1 frame; optionally flash(color='white', dur=1–3 frames, curve=outExpo)
  push: on the freeze transform(scale=[1, 1.05–1.2], ease='linear') or a punch-in ×1.1–1.3 over 2–3 frames
  color: optionally B&W or sepia in the freeze, transition over 0–6 frames
  text: appears 3–8 frames after the freeze; hold ≥1 s; inside the safe zone
  grain: live grain 0.02–0.05 during the freeze — so the frame doesn't look like a frozen player
  exit: a cut (default) or resuming from the same frame; final freeze — a 0.5–1 s fade to black
when: introducing a character or participant (intro, start of a chapter), the action peak before the drop or on a hit, a comic pause — a reaction or a "here I am", the final shot of the video or scene, a compilation of "moments" with a photo flash; at the start of an explainer — a freeze + a "that's me" caption; no more than 1 per 15–20 s (except the stop rhythm)
avoid: a freeze on a blurred frame; a freeze with no purpose and no caption in a fast video — looks like a playback hang; sync speech cut off mid-word (unless a comic effect is intended); more than two different freezes with text in a row — it turns into a slideshow
sfx: a camera shutter, a click or a vinyl scratch and the music cutting off at the moment of the freeze; a whoosh under the text appearing; an impact on the downbeat; for the ending — a ring, a drone or silence
genres: {fanedit: signature, viral: signature, ugc: signature, sport: signature, drama: allowed, teaser: allowed, clips: allowed, fashion: allowed, explainer: allowed, motivation: allowed, phonk: allowed, product: allowed, epic: allowed, travel: allowed, calm: allowed}
detect: |
  ed_motion: holds — a run of 12+ frames (≥0.5 s) with frame diff < 0.6 right after frames with noticeable
  motion; if there is a zoom-in over the freeze — ZOOM-IN with nonrigid ≈ 0 and zero residual after compensation
  (a rigid picture, no local motion). Before the freeze there is often a flash frame (a white flash of 1–3 frames).
  Visually: everything in the frame, including smoke, hair, water and grain, freezes instantly; often text appears
  or the color changes. Difference from a static shot: a static shot has noise, breathing, small movements.
  From time.super_slow_motion: there the motion isn't zero. From time.speed_ramp into a stop: there the stop is preceded by
  3–8 frames of deceleration.
engine: |
  freeze(at=t_peak, dur=1.2)
  + flash(color='white', t=t_peak, dur=0.08, curve='outExpo') + sfx('click'|'scratch', at=t_peak)
  + transform(scale=[1, 1.1], t=[t_peak, t_peak+1.2], ease='linear')
  + color(params={saturation: 0}) on the freeze segment (opt.) + grain(amount=0.03)
  + text(content=<name/caption>, style='bold'|'cutout', anim='pop', t=[t_peak+0.2, t_peak+1.2])
  t_peak = the peak frame with maximum sharpness in a ±3 frame window; put the freeze on a downbeat.
  Photo variant: photo_card(border=0.04, rotate=-4..4°, shrink=0.85, t=t_peak).
gen_hint: freeze frame of <subject> at the peak of <action> in mid-air, sudden still frame with a bold name title, cinematic, white camera flash, black-and-white photo look
