id: time.step_print
family: time
group: time
level: B
aliases: [step printing, step print, low frame rate, choppy, choppy frame rate, laggy frame, animating on twos]
what: the motion "breaks up" into 5–12 images per second — each phase freezes for 2–6 frames and is usually blurred, as with a long exposure; chaos, adrenaline, disorientation
frames: |
  1. Source — a shot with strong motion: a handheld camera, running, a crowd, a drive-by, the lights of a night city.
  2. Each phase of motion freezes for 2–6 frames @25 fps (80–250 ms; more often 3–4 frames = 120–160 ms),
     then the picture jumps to the next phase: 5–12 unique images per second on screen
     (median ≈8). On fast pans the jump is 2–6 % of the frame width, on camera jerks up to 20–30 %.
  3. In the classic form each frozen phase is blurred, as if exposed for the whole interval: lights stretch
     into streaks, hands and faces are smeared along the motion, the static background stays readable.
  4. The rhythm of holds is uneven: 2 and 3, or 3, 4 and 5 frames mixed — time feels "alive" and ragged.
  5. The move holds for the whole shot (1.5–5 s) or the whole scene; it is often interrupted by cuts of 1–3 frames and flashes.
variants:
  - smeared (classic): a hold of 3–6 frames + full blur over the interval — a chase, a crowd, a crush, night
  - clean choppy: a hold of 2–3 frames without blur, the frames sharp — a walk, a dance, a street, a rhythmic beat
  - with dissolves: neighboring phases flow into each other (mix 1/3 → 1/2 → 2/3), semi-transparent doubles are visible — a memory, a dream, intoxication
  - stepped slow-mo: the same on top of a ×0.33–0.5 slowdown — viscous, stretched time (≈, judging by 1–2 examples)
  - in a montage jumble: choppy shots mixed with flashes and cuts of 1–2 frames (3 of 14 examples)
status: code
fallback: on a static shot the effect doesn't read — first add motion (destabilize, jerks via crop) or take a shot from the source footage with a handheld camera and motion in the frame; it is worth generating ordinary motion and adding the choppiness in code
params:
  hold: 2–6 frames @25 fps (80–240 ms), typically 3 (120 ms) → 8.3 unique frames/s
  unique_fps: 4–12, typically 6–9
  shutter: 0–1 — the fraction of the hold interval averaged into one frame (blur); classic 0.8–1, clean variant 0
  blend: none | cross — a crossfade between neighboring phases (mix steps 1/3, 1/2, 2/3)
  hold_jitter: ±1 frame on 20–30 % of holds
  speed: 1.0 (main); 0.33–0.5 for stepped slow-mo
  duration: 1.5–5 s per shot; a whole scene — up to 15–20 s if interrupted by normal shots
  beat_lock: phase change on 1/16 or 1/8 of a bar (at 120 BPM 1/16 = 125 ms ≈ 3 frames)
when: chaos, a chase, a fight, panic, a crush, a party, a night city, backstage and a runway show; adrenaline, intoxication, loss of control; a verse or the build before the drop when nervous energy is needed without speeding up the cutting; the dissolve variant — memory and dream. No more than 1–2 scenes per minute of video
avoid: sync speech (lips break up); text, UI and product that need to be read; static shots — no visible effect; a source that already has dropped frames or a low frame rate; smooth slow motion and the choppy move in one shot without intent; stretches longer than 6 s in a row; dark noisy shots with full blur turn to mush
sfx: a dedicated sound is not required; put the phase changes on the hi-hat or 1/16; on camera jerks — a short whoosh; for disorientation — muffle the music with a low-pass filter for the duration of the move
genres: {fashion: signature, drama: allowed, epic: allowed, sport: allowed, travel: allowed, fanedit: allowed, phonk: allowed, teaser: allowed, clips: allowed, ugc: allowed, viral: allowed, motivation: allowed, calm: forbidden, explainer: forbidden, product: forbidden}
detect: |
  The difference between neighboring frames alternates near-zeros (≤5–10 % of a typical jump) in runs of 1–5 with sharp jumps:
  5–12 unique frames per second in a 20–30 fps container, holds of 80–250 ms, an uneven rhythm.
  ed_motion: many short holds of 2–6 frames and/or "cuts" every 2–6 frames within one scene (the palette
  doesn't change) — these are phase jumps, not cuts; ZOOM/SHIFT/ROTATE events 1 frame long with a large factor.
  Blur: directional blur on everything that moves (gradient anisotropy 0.18–0.4 versus 0.6–0.9 for sharp frames).
  Dissolve variant: a frame is a linear mix of its neighbors (mix ≈1/3, 1/2, 2/3), no exact repeats.
  Difference from time.freeze: there it is a single hold of 0.5 s or more. From cut.stutter: there a chunk repeats with a jump back.
  From slow motion: there every frame is unique. From time.echo_trail: there copies are overlaid within one frame and there are no holds.
  From a corrupted file: there dropped frames are rare and random.
engine: |
  step_print(hold=3, shutter=1.0, blend='none', jitter=0.2, t=[t0, t1])
  — average hold neighboring frames weighted by shutter (blur), take every hold-th one, duplicate up to 25 fps
  (ffmpeg: tmix=frames=3,fps=25/3,fps=25); clean variant — without tmix; blend='cross' — framerate/minterpolate
  with mi_mode=blend instead of duplicates. Stepped slow-mo: speed(rate=0.5, interp='drop') before step_print.
  Align the phase changes to the track: beat_sync(event='phase', grid='1/16').
