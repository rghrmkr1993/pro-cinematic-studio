id: time.speed_ramp
family: time
group: time
level: B
aliases: [speed ramp, speed ramping, ramp, speed change, time remapping, time remap, speed-up and slow-down]
what: "fast–slow–fast inside one uncut shot: the footage rushes in, brakes hard into slow motion at the peak of the action, then rushes out again, so the motion itself keeps time with the music"
frames: |
  1. Speed-up: 0.3–1 s of action at ×2–5 — the motion is blurred, dancers and cars have semi-transparent trails
     (frame blending), the camera rushes by with blur.
  2. Braking: within 3–8 frames (0.12–0.3 s) the speed drops to 0.2–0.4 — exactly at the peak: the highest
     point of a jump, a car flipping, a ball contact, a ball or a fist right at the lens, a throw of popcorn,
     flowers or money, a swish of fabric, an exhale of smoke, a head turn toward the camera.
  3. Slow motion: 0.5–1.5 s of screen time — the peak can be examined, the frames are sharp.
  4. Exit: a reverse speed-up to ×1–4 over 3–6 frames — the action plays out quickly; often a cut right away.
     Speed switches sit on downbeats: the braking — on the hit, the speed-up — on the next beat.
variants:
  - fast → slow: a speed-up and braking at the peak (a jump, a skateboard trick, a punch, a throw) — the most common
  - slow → fast: a slow-motion entry and a sharp speed-up on the drop or an exit from the frame
  - sawtooth: several fast–slow cycles on the beats within one shot — a dance, a fight, group choreography (a continuous beat pulse of speed through the whole video is a separate move, time.velocity)
  - with trails: fast chunks with semi-transparent "ghosts" (blending of 3–8 frames) — a dance, wrestling, a car
  - camera jerk: a fast camera move or turn with blur → abrupt slow motion on a face or the character
  - ramp to a stop: braking to 0 and a freeze frame (transition into time.freeze)
status: code
fallback: deep slow motion in a ramp (0.25 and slower) — needs a 50+ fps source; at 25–30 fps braking no lower than 0.4–0.5 via optical flow, and deeper — search the source footage for an HFR version of the shot, or replace the slow-motion part with time.freeze with a zoom-in
params:
  fast: ×1.5–5 (typically ×2.5–3); trails — blending of 3–8 neighboring frames or blur(kind='directional')
  slow: 0.15–0.5 (typically 0.25–0.35); deeper than 0.4 — only from 50+ fps
  ramp_down: 3–8 frames (0.12–0.32 s), ease inOutCubic; fully instant — 1–2 frames (a jolt)
  ramp_up: 3–6 frames (0.12–0.24 s), ease inCubic
  slow_hold: 0.4–1.5 s of screen time (10–38 frames @25 fps), typically 0.7 s
  cycle: sawtooth — 1 cycle per 1–2 beats (at 120 BPM 0.5–1 s); 2–4 cycles in a row
  anchor: start of slow motion = action peak = downbeat (align the ramp so that the peak lands on the beat)
  shot_length: the whole shot 1.5–4 s on screen
  interp: flow (optical flow) for the slow-motion part, blend for the fast part; drop — if the source is HFR
  audio: mute the source audio or stretch it along the curve; on the braking — a "sucking in" of the sound (pitch down + low-pass)
when: the peak of a motion in a dance, sport, a stunt, a fight, a thrown object, the character's walk; on the drop (braking = hit), on a change of track section; sawtooth — on fast beats in fan edits and music videos; 1 ramp per 4–8 bars in fast genres, in epic and sport — on every key action
avoid: a shot without a clear peak (the ramp brakes on "nothing"); sync speech; a ramp at 25 fps deeper than 0.4 — mush; a ramp on every shot in a row — the rhythm is lost; calm and explainer videos; braking out of sync with the beat — looks like a mistake
sfx: on the speed-up — a whoosh or a riser, on the braking — an impact, sub_drop or reverse_whoosh peaking at the moment of slowdown; in slow motion — muffle the music with a 1–2 kHz low-pass; on the exit — a short whoosh
genres: {fanedit: signature, sport: signature, phonk: signature, viral: signature, drama: signature, epic: allowed, motivation: allowed, fashion: allowed, teaser: allowed, clips: allowed, travel: allowed, product: allowed, ugc: allowed, calm: forbidden, explainer: forbidden}
detect: |
  Within a shot without a cut the speed of visible motion changes 4–15 times: in ed_motion the same
  SHIFT/ZOOM event has a peak %/frame at the start 4+ times higher than in the middle (or is split into fast and slow
  parts), frame diff drops in a step over 3–8 frames, sharpness (sharp) rises at the moment of braking —
