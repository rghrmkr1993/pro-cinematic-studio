id: time.bullet_time
family: time
group: time
level: C
aliases: [bullet time, frozen moment, time stop, orbit around a frozen frame, mannequin challenge]
what: time stops at the peak of the action — the subject and everything flying around it hang in the air, while the camera keeps moving around it or through the scene
frames: |
  1. Entry (0.2–1 s): the action at normal speed or a sharp slowdown to the peak — a punch, a gunshot, a jump,
     a throw, an explosion. Often the entry is a cut straight into the already frozen frame.
  2. Freeze: the character's pose doesn't change; shards, knives, birds, flames and smoke hang in the air (10–60 objects).
     An "almost freeze" of ≈×0.01–0.05 is acceptable: flames and smoke flow slowly, bullets crawl with a spiral trail.
  3. The camera stays alive: an arc around the subject of ≈15–180° (more often 45–90° over 2–4 s, ≈15–45°/s), usually with a push-in ×1.2–1.7,
     less often with a pull-out ×0.45–0.85; the background travels 20–130 % of the frame width, the subject stays near the center (0.4–0.6).
     Strong parallax: the foreground, the subject and the background shift at different speeds.
  4. The frozen segment — 1.3–7 s (typically 2.5–4 s); long orbits are broken up by cuts into 2–3 points.
  5. Exit: a cut to normal speed or a 0.3–0.6 s speed-up, a hit in sound and motion.
variants:
  - orbit around frozen action (the classic): a 45–180° arc around the character mid-jump, mid-punch, mid-gunshot
  - move through a frozen scene: the camera travels forward or sideways past frozen people, an explosion, birds (up to 7 s in one shot)
  - stopped world: the character moves while the street and the people around are frozen (often seen through the character's eyes)
  - super slow projectiles: bullets or objects fly slowly with ring-shaped trails, the camera almost still or pushing in slightly
  - living tableau: people simply hold a pose, the camera slowly circles (a cheap version without a camera array)
status: generation
fallback: "hybrid simulation: a freeze frame at the peak + a mask of the character + a filled-in background + layers shifted in different directions (a fake arc of up to 10–15°) + zoom-in ×1.1–1.3; footage: search the source footage for shots where people hold a pose while the camera moves, or orbits around a static subject; generation — from the peak frame with the user's consent"
params:
  freeze_rate: 0 (full freeze) or ≈0.01–0.05 (flames, smoke, projectiles keep flowing)
  arc: 15–180°, typically 45–90°; speed ≈15–45°/s; a fake 2.5D arc — no more than 10–15°
  push: push-in ×1.2–1.7 (up to ×2.9) simultaneously with the arc; pull-out ×0.45–0.85 — less often
  duration: 1.3–7 s of frozen segment, typically 2.5–4 s (≈62–100 frames @25 fps)
  ramp_in: a cut into the freeze or a slowdown over 0.2–0.5 s before the peak
  ramp_out: a cut or a 0.3–0.6 s speed-up
  center: track(subject), the subject at 0.4–0.6 of the width; the background shifts by 20–130 % of the width
  ease: inOutQuad on the arc and the push-in; no jerks
  debris: 10–60 suspended objects strengthen the effect; without them — noticeable background parallax is needed
when: the climax of action (a punch, a gunshot, a jump, an explosion), a "moment of truth", a display of power or control, the entry into the drop, a hook in the first 2 s of a teaser; product variant — a frozen splash around the product; no more than 1 per video (2 in a long clip)
avoid: no shot with a frozen moment and generation not agreed to; a 2.5D simulation on hair, smoke and fine details without a good mask — seams show; calm and explainer videos; a freeze longer than 5 s without camera movement or new details; several freezes in a row — the impact is lost
sfx: on the entry — a reverse whoosh or a sub drop and a sharp muffling of the world (low-pass, ringing or silence); during — a drone, breathing, a heartbeat, a stretched reverberated hit sound; on the exit — an impact and the return of full sound
genres: {epic: signature, fanedit: signature, teaser: signature, sport: allowed, motivation: allowed, phonk: allowed, viral: allowed, product: allowed, fashion: allowed, drama: allowed, ugc: allowed, calm: forbidden, explainer: forbidden}
detect: |
  ed_motion: a long camera move of 1.3–7 s — ZOOM-IN ×1.2–2.9 and/or SHIFT of 20–130 % of the width with nonrigid 0.15–0.35
  (real parallax), while the subject's pose and the positions of flying objects relative to it don't change:
  after camera compensation the local difference on the subject is ≈0. Flying objects motionless in the air are the main sign.
  Before and after — normal speed or a cut; often a speed ramp nearby.
  Difference from time.freeze: there the camera is still too (holds in ed_motion, frame difference ≈0, no parallax).
  From slow motion: there the subject visibly moves every frame. From a regular orbit (arc.orbit): there the subject is alive.
  From time.super_slow_motion: there everything still visibly moves and the camera usually stays still.
engine: |
  Generation (main path): gen_insert(from=frame(t_hit), prompt=gen_hint, dur=3–4 s) → cut at t_hit, exit — a cut
  into a live shot; before the insert speed(curve=[[t_hit-0.4, 1], [t_hit, 0.1]], interp='flow').
  Code simulation: freeze(at=t_hit, dur=2.5) + mask(method='hf_remove_background') → subject/background layers (background — outpaint)
  + parallax_orbit(angle=12, push=1.25, layers=2–3, t=[t_hit, t_hit+2.5], ease='inOutQuad')
  + sfx('reverse_whoosh', at=t_hit-0.3, align='peak') + duck(music, under=hum) + sfx('impact', at=t_hit+2.5).
gen_hint: bullet time shot, time frozen at the peak of <action>, <subject> suspended mid-motion with <debris> hanging motionless in the air, camera smoothly orbits 90 degrees around the subject with a slight push-in, strong parallax, nothing in the scene moves except the camera
commands: ["bullet time on the punch in #4", "freeze the jump in #2 and orbit the camera around the character", "stop time on the drop — everything freezes, the camera moves past", "frozen splash around the product with an orbit"]
related: [time.freeze, time.speed_ramp, time.super_slow_motion, orbit.turntable, arc.orbit, time.cinemagraph]
evidence: {examples: 12, sources: "≈10", measured: "frozen segment 1.3–7 s (typically 2.5–4); push-in ×1.19–2.88 over 1.6–2.9 s in 6 of 12, pull-out ×0.44–0.86 in 3; the background travels 20–126 % of the width; nonrigid 0.08–0.33; objects suspended in the air in 5 of 12; super slow projectiles — 2, stopped world with a live character — 1, a move along a frozen scene of 6.9 s — 1; arc angle — a visual estimate", confidence: medium}
