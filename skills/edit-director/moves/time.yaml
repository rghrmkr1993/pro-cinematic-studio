     takes about a second; a racket slowly deforms a ball; shards, sparks, splashes fly apart barely perceptibly;
     flames flow like liquid; hair in a jump sways as if underwater.
  3. Ending: a cut before the event is over — or a speed-up to normal speed (time.speed_ramp).
