id: time.hyperlapse
family: time
group: time
level: B
aliases: [hyperlapse, moving timelapse, walklapse, drivelapse, vortex hyperlapse]
what: a camera journey over a long distance, sped up 10–60 times — toward a landmark, around it or along a street; the anchor object holds at one point of the frame while the city, people and clouds rush past
frames: |
  1. Start: a wide shot of a street, square or embankment; the anchor — a tower, a cathedral, a bridge, a statue, an entrance — in the center
     or on a third of the frame.
  2. Travel: 2–4 s on screen (50–100 frames @25 fps) hold 20–200 m of path. The anchor stays in place
     and smoothly grows (×1.3–3 per link) or turns sideways to the camera, the foreground and facades
     rush past with parallax, people and cars flicker jerkily, clouds flow. Slight "jitter" and brightness flicker
     from frame to frame — traces of shooting in photo series.
  3. Common enhancements: during the move the camera tilts over and rotates by 45–180° (a "vortex"), especially
     at a low angle among high-rises and under arches; a wide-angle or fisheye shot.
  4. Seam: at the end of a link a sharp zoom-in with radial blur, a turn or passing behind a pillar — and the next
     link in a different location; the video — a series of 4–12 links of 1.5–4 s each in rhythm with the music.
variants:
  - on foot to the target: a walk across a square or along an embankment to a cathedral, bridge, tower — the anchor grows in the center
  - orbit: the camera circles a monument, tower, streetlamp in an arc, the anchor in the center, the background rotates around it
  - vortex: a low angle, the camera rotates by 90–180° over 2–3 s, high-rises "twist"
  - drivelapse: from the hood or the cabin, a night city and highway — lights stretched into streaks (long exposure)
  - from the water: a boat or ferry heads toward a city panorama, the propeller wake at the bottom of the frame
  - card on white: the frame is shrunk and rotated on a white field, turns and grows to full screen — a stylized entry into a link
  - zoom jump: a zoom with radial blur onto a facade detail, a statue, a fresco — a bridge between links
status: footage
fallback: from an ordinary walking or driving video of ≥20 s (search the source footage for the cue "camera moves steadily forward") code does stabilization locked to the anchor, a ×10–30 speed-up and deflickering; from a photo series of one point — alignment to the anchor and assembly at one frame per photo; no material — generation of a link with the user's consent
params:
  rate: ×10–60 of real time when shooting video (typically ×15–20); with photos — 1 shot per 0.3–1 m of path, 1 shot = 1 frame
  link: 1.5–4 s per link (38–100 frames @25 fps), typically 2.5 s; 4–12 links in a row
  anchor: the anchor at one point of the frame ±5–10 % over the whole link; growth ×1.3–3 per link when moving toward the target
  rotation: vortex — 90–180° over 2–3 s (30–90°/s), ease inOutQuad; without a vortex — a level horizon
  stabilize: maximum, locked to the anchor (lock=track(object)); crop 10–20 %
  interp: drop for daytime; blend (shutter 1.0) for night — lights into lines
  deflicker: window of 7–15 frames — mandatory for photo series and exposure changes
  seam: zoom_blur 6–10 frames (0.25–0.4 s) or spin 8–12 frames; seam on a downbeat
when: intros and establishing shots of a location, a change of city or day in a travel video, an "all in one day" edit, the entry into the main part of the track; a series of links on the build and the drop; in non-travel genres — 1–2 links as a transition between locations
avoid: a link longer than 5 s; a jerky source without stabilization (causes motion sickness); an anchor wandering around the frame; a vortex more often than once every 15–20 s; mixing day and night links without color preparation
sfx: a whoosh on every seam and every turn of the vortex; a riser under a series of links; sped-up city noise or silence under the music; a hit on a change of location
genres: {travel: signature, epic: allowed, motivation: allowed, teaser: allowed, product: allowed, explainer: allowed, viral: allowed, clips: allowed, fanedit: allowed, phonk: allowed, ugc: allowed, calm: allowed}
detect: |
  ed_motion: a long steady ZOOM-IN ×1.3–3 over 2–4 s with a peak ≤×1.05/frame and nonrigid >0.3 (real
  forward motion with parallax), the zoom center stable on the anchor; for an orbit — SHIFT of 2–6 % per frame with
  a stationary anchor; for a vortex — ROTATE 90–180° over 1.5–3 s. Luma flicker ±1–4 from frame to frame without cuts,
  a small residual jitter of 0.2–0.6 %. Cuts every 1.5–4 s, at the seams sharpness drops to ×0.2–0.5
  (zoom blur).
  Visually: people, cars and clouds move jerkily and too fast while the camera is smooth.
  Difference from time.timelapse: there the camera stands still or moves 1–2 m on a slider, the main thing is the change of light.
  From time.fast_motion: there the distance is short, no anchor. From a regular drive-through: the camera's speed
  is higher than any real walking speed.
engine: |
  stabilize(strength=1.0, lock=track(object:<anchor>), crop=0.15)
  → speed(rate=15, interp='drop'|'blend', shutter=1.0 for night) → deflicker(window=11)
  → optionally transform(rotate=[0, 180], center=anchor, ease='inOutQuad') for a vortex
  Series: chain(links[], per_link=2.5, seam=transition('zoom', dur=0.3) + blur(kind='zoom')), seams on the beats.
  From photos: align_stills(photos[], anchor=track(object), fps=25) → deflicker(window=11).
