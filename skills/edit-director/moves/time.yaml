id: time.echo_trail
family: time
group: time
level: B
aliases: [echo, echo trail, trails, trail, ghost trail, frame echo, onion skin, glowing motion trail]
what: a moving subject drags a trail of copies of its past positions (0.3–2 s) — the copies hang in the frame and catch up with it when it stops; dance, a strike, a walk, a trance
frames: |
  1. Source: clear motion of the subject against a calm background — a dance, hand strikes, a swish of fabric, a walk; the camera is still
     or smoothly follows the subject. Best of all — a light subject on a dark background.
  2. Past frames are mixed into every frame: the copies lie along the trajectory behind the direction of motion,
     the freshest copy is the sharpest. Static parts of the frame stay sharp.
  3. Two kinds of trail: (a) a dense fan — a copy from every frame, 8–16 of them in a 0.3–0.65 s window, blended by lighten
     (maximum) — the subject turns into a fan or a sculpture; (b) separate copies — 3–5 of them 3–8 frames apart
     (0.12–0.32 s) for gestures and up to 10–19 frames (0.4–0.75 s) for a walk, a "procession" of doubles.
  4. The trail often switches on mid-shot: within 0.5–0.7 s it grows from 0 to 3–5 copies and holds; when the subject
     freezes, the copies converge into it over the window time (0.3–1 s) — the frame is clean again.
  5. With a moving camera the copies stay in the "world": the background is sharp, the doubles stand where the subject was
     (when the character advances on the camera — behind it and smaller).
variants:
  - dense fan: light fabric or a body on a black background, maximum over 8–16 frames, equal weights — a dense fan
  - procession of doubles: 2–4 opaque copies spaced 0.4–0.75 s apart, the camera follows the character, the background sharp
  - limb fan: arms and hands leave 3–6 fading ghosts spaced ≈0.24 s apart (weight ≈×0.75 per copy)
  - strike trail: a long smeared tail on a sharp lunge or turn, decay ≈0.9–0.96 per frame
  - ghostly crowd: people dancing indoors, a soft trail of 5–10 frames, the camera still
  - many-armed silhouette: copies of the arms a few frames apart add up to a figure with a dozen arms
status: code
fallback: with a busy background or a shaky camera — hybrid (a mask of the character via mediapipe or hf_remove_background, the trail only on the character over the current frame); a suitable shot — search the source footage for shots with fast motion against a plain or dark background
params:
  trails: 3–16 copies; dense fan 8–12, separate copies 3–5
  lag: 1 frame (dense fan) or 3–8 frames @25 fps (0.12–0.32 s) between copies; for a walk up to 10–19 frames (0.4–0.75 s)
  window: 0.3–2 s, typically 0.5–0.65 s
  decay: per copy 0.5–0.8 (gestures), 1.0 with maximum (dense fan, procession), ≈0.9–0.96 per frame (strike trail)
  blend: max (light on dark) | min (dark on light) | mean (everything else)
  align: screen (camera still) | camera (compensate for camera motion, background sharp)
  mask: none | subject (hybrid — the trail only on the character)
  ramp_in: 0.3–0.7 s of build-up; exit — the motion stopping or a 0.3–0.5 s fade-out
  duration: 1–4 s, rarely the whole shot up to 6 s
when: dance and choreography, martial arts, a model's walk, a swish of fabric and hair, the character's "super speed", trance, intoxication, split personality, a memory; a drop or a sustained note; 1–2 times per video, hold for 1–4 s
avoid: a busy background with a still camera — everything that moves doubles; a shaky camera without compensation — mush across the whole frame; a talking face in close-up; text and UI; a window longer than 1.5–2 s — a mess; a subject walking straight at the camera with a screen-space trail — the copies merge into a blob
sfx: echo or delay on the music with the same spacing (1/8 or 1/16 of a beat); on sharp movements — a whoosh; when the trail switches on — a reverse swell
genres: {fanedit: signature, fashion: signature, phonk: allowed, epic: allowed, sport: allowed, viral: allowed, teaser: allowed, motivation: allowed, drama: allowed, travel: allowed, clips: allowed, ugc: allowed, product: allowed, explainer: forbidden}
detect: |
  In one frame — several copies of the moving subject along its trajectory, the last one the sharpest; static parts are sharp.
  Per pixel: after the subject passes, brightness doesn't fall back to the background but stays at 0.4–1.0 of the peak for 3–16 frames
  (a flat shelf for a dense fan; humps every 3–8 frames for separate copies). Every frame is unique — no holds.
  ed_motion: usually no global events, or a smooth camera move; the frame difference is small for the visible motion.
  When the subject stops, the copies merge with it within 0.3–1 s.
  Difference from time.motion_blur: there the smear is within a single frame, with no separate copies and no tail after stopping.
  From fx.duplicate: the clones live on their own and don't converge into the character. From time.step_print: there frames are held.
  From double exposure: there two different shots are mixed, not past frames of the same one.
engine: |
  echo(trails=N, decay=d, lag=L, blend='max'|'min'|'mean', align='screen'|'camera', mask=None|'mediapipe_person',
       t=[t0, t1], ramp_in=0.5)
  — dense fan on a dark background: ffmpeg lagfun=decay=0.93 (maximum with decay) or tmix=frames=10;
  separate copies: out = blend(f[t], d·f[t−L], d²·f[t−2L], …), L=4–6 frames, N=4;
  align='camera': align past frames with the current one by global motion (estimated as in ed_motion) before blending;
  mask='subject': the trail from the character mask over the current frame. Switching the trail on — on a beat: beat_sync(event='echo_on', grid='1/4').
gen_hint: <subject> performs <a fast expressive dance / martial arts strikes / a fabric twirl> against a plain dark background, static camera, hard rim light, high contrast, each movement leaves a fan of fading ghost copies of the limbs, long-exposure echo trails
commands: ["echo trail on the dance in #3", "echo on the strikes in #5, 4 copies with decay", "a trail of doubles behind the character on the walk in #2, background sharp", "a dense fan of white fabric on the drop"]
related: [time.motion_blur, time.step_print, fx.duplicate, trans.double_exposure, time.speed_ramp]
evidence: {examples: 8, sources: 8, measured: "dense fan: a flat maximum shelf of 8 frames (≈0.64 s), then a drop to 0.24; arm fan: copies every 3 frames (0.24 s) with weights 0.55 → 0.42; procession: 2–4 opaque copies spaced ≈0.45–0.75 s apart with the camera at 1.2–1.6 %/frame, background sharp (2 of 8 with camera compensation); the trail grows to 3–5 copies within 0.5–0.7 s; in 3 of 8 — light on a dark background; strike trail decay ≈0.9–0.96 per frame (≈, the camera moves slightly)", confidence: medium}
