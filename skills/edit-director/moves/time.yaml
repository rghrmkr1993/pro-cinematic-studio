id: time.time_slice
family: time
group: time
level: C
aliases: [time slice, time slices, time stripes, day-to-night slices, time stack, time gradient, time rings]
what: one static frame is cut into stripes, rays, rings or nested frames, and each slice shows its own time from a timelapse; the sky in a single frame smoothly passes from day to night, and in animation the slices flow like a wave of time
frames: |
  1. Base: a tripod timelapse of one spot over 1–3 hours — a city, a tower, an embankment, a street, a sunset over water,
     a flower by a window; the light changes from day through sunset to night.
  2. The frame is divided into 10–40 slices with hard boundaries in one of these shapes: vertical or horizontal
     stripes; fans of rays from a point (the top of a tower, the sun, a flower); concentric rings around the sun
     or a dome; nested rectangles toward the vanishing point of a street; a grid of squares. Neighboring slices are neighboring
     moments, so a smooth gradient runs across the frame: light blue → pink → orange → dark blue,
     the city lights switch on from slice to slice. The sun or moon in the stripes lines up as a "staircase" —
     a diagonal chain of positions.
  3. Often only the sky is sliced: buildings, water and the foreground stay in one time (usually night with lights).
  4. Animation: each slice plays the timelapse with a phase offset — rings spread out from the center, rays
     rotate, stripes crawl; a cycle of 2–6 s, often looped.
variants:
  - stripes: vertical (time from left to right) or horizontal; the sun or moon runs in a diagonal staircase
  - fan of rays: wedge slices from the top of a tower, a spire, a flower — the sky as an unfolded fan of hues
  - rings: concentric circles around the sun over water or around a dome, spreading out or converging
  - tunnel of frames: nested rectangles in the gap of a street toward the vanishing point — time recedes into the depth of the frame
  - mosaic: a grid of squares of different times across the sky over a harbor or a square
  - freeze frame: a static "photo" composition, no animation, 2–4 s on screen
status: footage
fallback: needs a static timelapse with a change of light (search the source footage for long tripod shots of a sunset, a city, a window); if there is only one static frame — a code simulation where each slice gets its own color grade along the scale day → golden hour → blue hour → night, and the window lights get a glow via a mask of bright points; night and day frames of the same spot — two shots and blending by slices are enough; timelapse generation with consent
params:
  slices: 10–40, typically 16–24
  shape: stripes_v / stripes_h / wedges (a fan from a point) / rings (from a point) / rects (nested toward the vanishing point) / grid
  slice_size: stripes 3–8 % of the frame width; wedges 3–10°; rings — a step of 3–6 % of the diagonal, can narrow toward the center
  center: the sun, the top of a tower, a flower or the vanishing point [x, y]; for stripes — the gradient direction (angle)
  span: the whole timelapse from day to night (usually 60–180 min of real time) distributed across the slices; order — from the center outward or from left to right
  mask: sky only (sky segmentation or a brightness-and-color mask) or the whole frame
  edge: hard boundary, feather 0–2 px; no softening, otherwise the step between slices doesn't read
  flow: animation — a phase shift of 1 slice per 2–6 frames; a cycle of 2–6 s (50–150 frames @25 fps), can be looped
  duration: 2–5 s on screen; static version 2–3 s
when: the intro or ending of a travel video or a video about a city, "a whole day in a second", a day → night transition, a title card under the location name, a pause on a long note; 1 per video, 2 at most
avoid: the camera moved (the slices won't line up, breaks in facades are visible); no change of light in the timelapse — the slices look the same; people and cars in the foreground without a mask (ragged pieces of bodies); fast cutting — the shot needs 2+ s for the eye to read the gradient
sfx: a soft swell or a pad over the whole shot; on the ring animation — quiet ticks or a "shimmer" on each new slice; no hits
genres: {travel: signature, calm: allowed, epic: allowed, teaser: allowed, viral: allowed, motivation: allowed, explainer: allowed, clips: allowed, fanedit: allowed, product: allowed}
detect: |
  ed_motion: no global motion, shake ≈0; holds or very slow changes.
  Own check: the brightness and hue profile along a row, along the radius from a point or along the angle around it —
  a staircase with an even step (10–40 steps), a monotonic trend of luma or hue across the steps; the contours
  of buildings and the horizon pass continuously through the boundaries (one scene, different times). The sun or the
  moon repeats several times along a diagonal. In animation the boundary stays put while the content of the steps shifts
  in phase (or the boundaries spread out as rings).
  Difference from split screen: the slices show one and the same scene. From slit-scan: in slit-scan the time shift is smooth
  across every row and moving objects are stretched; here — discrete slices and a static scene.
  From bullet time: there a frozen moment is orbited by the camera, here the camera stands still (the term "time-slice"
  sometimes means a camera array for a frozen moment — that is time.bullet_time, not this card).
