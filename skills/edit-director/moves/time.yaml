id: time.motion_blur
family: time
group: time
level: B
aliases: [motion blur, motion smear, long exposure, shutter drag, dragged shutter, slow shutter]
what: deliberate heavy motion blur, as with a long exposure — everything that moves (or the whole frame on a camera jerk) stretches into streaks of 3–25 % of the frame; speed, chaos, dream, detachment
frames: |
  1. A source with motion: a fast subject crossing the frame, a handheld camera in a crowd, a whirl of people around a motionless
     character, sharp head turns. More often night or darkness with point light sources.
  2. Each frame is "exposed" for the whole interval or longer: whatever moves stretches into streaks along the motion,
     3–25 % of the frame width (typically 8–15 %), lights draw lines.
  3. Two sources of blur: (a) camera movement — the whole frame smears in one direction, the direction changes with every
     jerk (anisotropy 0.05–0.4); (b) movement of objects with a still camera — the background and everything static are sharp,
     people and hands dissolve; a motionless character is 3–11 times sharper than the crowd around them.
  4. The blur pulses: peaks on jerks (up to 16–22 % of the width), on a "landing", a hit or a flash the frame becomes
     sharp within 0.2–0.5 s.
  5. Often combined with a flash (a sharp core + a tail), a ragged frame rate and a dark vignette.
variants:
  - panning with a fast subject: a car or a runner — horizontal streaks 14–22 % of the width, then a sharp shot on the landing
  - handheld chaos: a party, a crowd, a fight — blur of 3–16 % in a constantly changing direction, flashes of light
  - still in the flow: the camera stands or slowly rotates, a blurred crowd swirls around, the character sharp
  - head smear: fast turns of the face produce a horizontal trail of 9–24 % of the width — anxiety, horror, a split self
  - flash with a slow shutter: a sharp figure with a glowing tail, night, an erratic camera
  - dreamy: a soft blur of a portrait or a swimmer, doubled contours — a dream, a memory
status: code
fallback: the best result — a source with a long exposure or 50–60 fps (frame averaging); at 25 fps with fast motion, averaging produces separate copies instead of streaks — then blur by optical flow or a directional blur along the camera vector; no motion in the frame — destabilize or generation
params:
  shutter: equivalent of 360–1440° (1/25–1/6 s); synthesis — the average of 4–8 frames at 50–60 fps or 8–16 intermediate frames via optical flow
  blur_len: 3–25 % of the frame width, typically 8–15 %; at jerk peaks 16–22 %
  direction: along the global motion (camera) or along the local flow (objects)
  adaptive: blur length ∝ speed; on a stop — sharp within 0.2–0.5 s
  flash_core: 0 or 0.3–0.6 — mix a sharp frame over the blur (flash effect), 1–2 frames of white flash
  duration: from a 0.3 s accent on a jerk to a whole 3–6 s scene
when: speed (cars, sport, running), clubs and parties, panic, a fight, a chase, intoxication, anxiety and horror (head smear), loneliness in a crowd (still in the flow), dreams and memories; night scenes and the build before the drop; an accent on every camera jerk
avoid: a face that needs to be recognized, and lip sync; text, UI, product details; tutorial videos; frame averaging at 25 fps with fast motion — you get doubles instead of blur; whole-frame blur for longer than 6 s in a row — causes motion sickness; a flat daytime shot — the blur looks like a defect or a missed focus
sfx: a whoosh on every jerk; a drive-by — a hum with Doppler; in the dreamy variant — music under a low-pass; on a flash — a shutter click
genres: {fashion: signature, sport: allowed, epic: allowed, drama: allowed, fanedit: allowed, teaser: allowed, travel: allowed, motivation: allowed, clips: allowed, ugc: allowed, phonk: allowed, viral: allowed, product: allowed, explainer: forbidden}
detect: |
  Frame: strong directional blur — gradient anisotropy ≤0.4 (≤0.1 at peaks); for the derivative along the blur,
  autocorrelation gives a negative peak at the blur length L = 3–25 % of the width (the sign of a "box" exposure trail).
  Camera blur: ed_motion — large SHIFT/ROTATE of 5–60 %/frame, min sharpness ×0.06–0.5 on jerks.
  Object blur: no global events, but on the sharpness map static things are 3–11 times sharper than moving ones.
  Frames are unique (no holds), unless the move is combined with time.step_print.
  Difference from time.echo_trail: there separate copies persist for several frames after stopping; blur is present only during motion.
  From shallow depth of field: there the blur is round (anisotropy 0.8–1) and doesn't depend on motion.
  From pan.whip: there it is a short 2–6 frame jerk used as a transition; here blur is a stable texture of the scene.
engine: |
  motion_blur(mode='camera'|'frames'|'flow', shutter=720, samples=8, adaptive=True, flash_core=0, t=[t0, t1])
  — camera: along the global motion vectors (as in ed_motion) blur(kind='directional', amount=|v|·shutter/360, angle=dir(v));
  — frames: ffmpeg tmix=frames=N (N = shutter/360 · fps_src/25), better on a 50–60 fps source;
  — flow: minterpolate=fps=200:mi_mode=mci → tmix=frames=8 → fps=25 (real blur at 25 fps);
  flash_core: composite(sharp frame, opacity=0.4, blend='screen') + flash(dur=1 frame).
  Put the pulsing on jerks and beats: beat_sync(event='blur_peak', grid='1/4').
gen_hint: night scene, <subject> <dancing in a crowded club / sprinting / spinning around>, slow shutter speed long exposure look, heavy motion blur streaks and light trails, erratic handheld camera, occasional on-camera flash freezing a sharp silhouette inside the blur
