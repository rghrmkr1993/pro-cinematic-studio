id: time.timelapse
family: time
group: time
level: B
aliases: [timelapse, time-lapse, interval shooting, day-to-night, blooming timelapse]
what: a static or barely moving shot in which minutes, hours or days pass in 2–6 seconds — clouds race, the sun sets, the city lights up, a flower opens, people appear and disappear
frames: |
  1. The shot is on a tripod (less often a slow slider move or pan of 0.5–2 % of the frame per second): a landscape,
     a sky with tree silhouettes, a city panorama, a room, a flower on a black background.
  2. 2–6 s on screen (50–150 frames @25 fps) hold from 10 minutes to several days: clouds boil and
     race, shadows crawl across the wall and floor, the sun or moon crosses the frame, lights come on in windows and
     streets, a bud opens, a sprout pushes out of the soil, a crane finishes a floor; people in a room
     or at a party flicker, swap places and vanish as semi-transparent ghosts.
  3. Static things (buildings, furniture, rocks) are absolutely sharp and stable: the contrast "the world stands still, time runs".
     The brightness and color of the frame change smoothly: day → sunset → night, or the other way round.
  4. Exit by a cut at the moment of an event (the lights came on, the flower opened) or by a dissolve.
variants:
  - sky and clouds: clouds race over silhouettes of trees, mountains, roofs; ×100–300
  - sun and moon: a sunset or sunrise over the sea, the moon rising over a city panorama; ×300–1000
  - day → night: a city, roofs, windows — daylight fades, lights come on; ×500–2000
  - blooming and growth: a flower opens on a black or green background, a sprout in a pot; ×1000–30000
  - construction and change: a building grows, a room changes its furniture, a riverbed dries up and fills again
  - people over time: a room, a sofa, a party over hours — people appear, disappear, change poses; ×300–3000
status: footage
fallback: from any long static video of the user's (tripod, webcam, stream, a workspace recording, a view from a window — from 5 minutes) in code — a speed-up to the needed screen length + stabilization + deflickering; a day-to-night change can't be made in code without source footage — only search or generation with consent (clouds, sunsets, blooming generate well)
params:
  rate: ×60–30000 of real time; typically ×150–600 for sky and people, ×500–2000 for a sunset and a change of day, ×1000+ for plants and construction
  interval: for a photo series 1–5 s between shots for clouds and people, 5–15 s for a sunset, 1–15 min for plants and construction (1 shot = 1 frame)
  duration: 2–6 s on screen (50–150 frames @25 fps), typically 3–4 s
  source_needed: screen length × rate (4 s × 300 = 20 min of source)
  interp: blend (shutter 0.5–1.0) — smooth clouds and ghosts of people; drop — staccato, sharp jerks
  camera: tripod; slider or pan movement ≤2 % of the frame per second, ease inOutQuad
  deflicker: window of 15–25 frames — mandatory
  light_change: Δluma 30–100 over the shot during a change of day and night
when: intros and establishing shots of a location, a change of day or time of day, "hours/days have passed", a process (cooking, assembly, work, construction, growth), a breather between scenes; on a long note, an intro, a verse → chorus transition; 1–3 shots per video, in travel and calm — a series of 3–5
avoid: a shaky source (every micro-shift turns into shake); flicker without deflicker; shots where nothing can change (no sky, light, people); too short a fragment — under 2 s doesn't read; sync speech
sfx: ambience, wind, a distant city hum; clock ticking or sped-up noise for a room; on the change of day — a soft swell; no hits
genres: {travel: signature, calm: signature, epic: allowed, explainer: allowed, motivation: allowed, drama: allowed, product: allowed, teaser: allowed, clips: allowed, viral: allowed, ugc: allowed, fanedit: allowed}
detect: |
  ed_motion: no global events (or one slow SHIFT ≤0.3 %/frame — a slider), shake jitter ≈0;
  yet frame diff is noticeable: clouds, people, shadows — local motion on a static background.
  Brightness: a monotonic luma trend of 20–100 units over 2–6 s (sunset, dawn, lights switching on) and slight
  flicker of ±1–3 from frame to frame; shadows and highlights creep across surfaces.
  Visually: clouds and shadows move at a visible speed, people and cars appear and disappear without traveling
  the path — no steps are visible. A flower or a sprout changes shape smoothly.
  Difference from time.fast_motion: there ×2–10 and the gait itself is visible; here light and shadows, ×60+.
  From time.hyperlapse: the camera doesn't travel. From a cinemagraph: the whole frame changes, not one looping zone.
engine: |
  stabilize(0.6) → speed(rate=len(src)/screen_dur, interp='blend', shutter=0.75) → deflicker(window=21)
  + optionally transform(shift=[[0,0],[0.03,0]], ease='inOutQuad') — a slider simulation on 4K;
  for a photo series: image_sequence(photos[], fps=25) → deflicker(window=21).
  A change of day and night by joining two timelapses: transition('dissolve', dur=1.0) on a matching angle.
gen_hint: time-lapse of <scene, e.g. clouds rolling over a mountain ridge, a city skyline from sunset to night with lights turning on, a flower blooming on a black background>, locked-off tripod camera, smooth motion-blurred clouds, light changing over hours
commands: ["sky timelapse in the intro", "speed up the sunset in #3 to 4 seconds", "day → night between #2 and #3", "make a timelapse from the hour-long workspace recording"]
related: [time.hyperlapse, time.fast_motion, time.time_slice, time.slow_motion]
evidence: {examples: 21, sources: "≈12", measured: "visual review only: 3–4 animation moments per example (scripted frame capture blocked by browser permissions); factors and intervals — ≈ estimates from the speed of clouds, sun and blooming, not measured", confidence: medium}
---
id: time.velocity
family: time
group: time
level: C
aliases: [velocity, velocity edit, velocity ramp, remap to the beat, speed sawtooth, beat-synced speed ramp, time remap on beat, fast-slow on the beat]
what: the clip's speed pulses on the beats of the track — on each beat the action peak almost freezes and is sharp, between beats the shot rushes by at ×4–8 with motion blur; a remap of a whole section to the beat, not a single ramp
frames: |
  1. Beat (frame k0): the frame shows the action peak of the source — a hit, a pose, a touch, the apex of a turn, a landing; speed 0.25–0.45,
     the frame is sharp.
  2. Speed-up: within half a beat (5–6 frames @25 at 125 BPM, 7 @30 at 120 BPM) the speed rises along an S-curve to ×4–8 by the middle
     of the beat; frames are blurred along the motion (shutter 180–360°), contours stretch into streaks of 2–5 % of the frame.
  3. Braking: mirrored toward the next beat — the next action peak lands on it, sharp again.
  4. The cycle repeats on every beat (or every 2 beats) for 2–8 bars; the average speed is ×2–3 — the source runs
     faster than real time. Cuts between clips — only on beats, in the slowest and sharpest frames.
     Often on the same beats — zoom.punch and shake.beat, on the downbeat — a flash.
variants:
  - "classic — a 1-beat cycle at 90–140 BPM, slow on the beat, speed peak in the middle"
  - "half-bar — a 2-beat cycle at 140+ BPM or for 'heavy' footage (cars, sport, walk-bys)"
  - "choppy — a 1/8 cycle, only in the last bar before the drop or under a drum roll"
  - "with a hang (hang) — the slow zone is shifted 1–3 frames after the beat: the hit is shown and 'hangs' a little"
  - "reverse — slow between beats and a ×4–6 jolt on the beat itself; under a snare roll or rustling hats"
  - "multi-clip — each clip of the section lives 1–4 beats with its own action peaks, cuts on the beats"
  - "hard — quint curve, influence 0.9: 0.25 on the beat, up to ×8 in the middle, blur 270–360°"
status: code
fallback: |
  Needs a source with motion: a static shot or a talking head won't "ride" — take shots with high motion_energy
  (ed_analyze source), add digital motion (a transform move across a crop or a zoom-in with the same speed curve) or
  generate an action shot with the user's consent. A slow part below 0.5 from 25–30 fps — only via optical flow
  (on fast motion, "jelly" artifacts); a 50–60 fps source is better, where 0.4–0.5 is almost frame for frame. No clear action
  peaks — uniform anchors (anchors='uniform'), but then influence ≤ 0.7, otherwise the speed pulses "into the void".
params:
  grid: "cycle = 1 beat at 90–140 BPM (N = 60·fps/BPM frames: 125 BPM → 12 @25, 120 BPM → 15 @30); 2 beats at 140+ BPM or if action peaks are sparser; 1/8 — only 1 bar before the drop"
  anchors: "a_i — the source moment shown on beat b_i: an action peak (a stop after a jerk, a contact, an apex, a pose) — the minimum of the median optical flow right after its maximum, or the maximum of acceleration, ±1 source frame; step a(i+1) − a(i) = r̄·(b(i+1) − b(i))"
  rate_mean: "r̄ = 1.5–4 per cycle, typically 2–3: below 1.5 the pulsing doesn't read, above 4 — mush; if the next action peak is farther than 4 beats of travel — switch the clip"
  curve: "s(t) = a_i + r̄·T·[(1 − m)·u + m·E(u)], u = (t − b_i)/T, T — cycle length; E = inOutCubic (default) or inOutQuint (harder); m = 0.8–0.9 ('influence'); speed on the beat r̄·(1 − m), in the middle r̄·(1 + 2m) for cubic and r̄·(1 + 4m) for quint"
  rate_25: "125 BPM @25 (N 12), r̄ 2.5, m 0.85, cubic — speed between frames k → k+1 from the beat: 0.43 0.79 1.50 2.56 3.98 5.75 | 5.75 3.98 2.56 1.50 0.79 0.43 (the source advances 30 frames per beat)"
  rate_30: "120 BPM @30 (N 15), same r̄ and m: 0.41 0.64 1.09 1.77 2.68 3.81 5.17 6.33 5.17 3.81 2.68 1.77 1.09 0.64 0.41 (37.5 source frames per beat)"
  rate_hard: "hard @25 (N 12): quint, m 0.9 → 0.25 0.30 0.62 1.61 3.90 8.32 | 8.32 3.90 1.61 0.62 0.30 0.25"
  other_tempo: "with a non-integer N the curve is computed continuously in frame time; beats — from ed_audio, anchors and cuts — on frames k0 = floor(t_beat·fps + 0.4)"
  peak_frame: "the anchor (action peak) — exactly on the beat frame k0, tolerance ±1 frame; the slowest transitions — k0−1 → k0 → k0+1; with a hang (bias 0.15–0.3, u → u^(1+bias)) the slow zone shifts 1–3 frames after the beat"
  motion_blur: "only on frames with speed r ≥ 1.2: the average of n = clamp(⌈2·r·shutter·fps_src/fps_out⌉, 2, 12) subframes over a span of r·shutter source frames around s(k) (flow if there aren't enough real frames); shutter 0.5 (180°) by default, 0.75–1.0 — heavy blur; trail length = in-frame speed × r × shutter — a pan of 0.8 % of the frame per source frame at r 5.75 and 180° gives ≈ 2.3 % of the width; no blur on the beats"
  interp: "r < 1 from 25–30 fps — flow (DIS or minterpolate); r ≥ 1 — subframes with blur; a 50–60 fps source — real frames down to r ≈ 0.5 (nearest)"
  cuts: "a cut between clips — only on a beat (minimum speed, the sharpest frame); a new clip starts from its own anchor; a clip in velocity lives 1–4 beats"
  section: "a velocity section of 2–8 bars; around it — normal speed or slow motion, for contrast"
  audio: "source audio off; music continuous"
when: |
  Music (phonk, fan edit, sport, motivation, travel, fashion):
  hook — 1 bar of velocity on a vivid action, to show the energy right away;
  build — normal speed or slow motion; in the last bar — choppy velocity at 1/8;
  drop — the main place: classic on every beat for 2–8 bars, on downbeats — zoom.punch and shake.beat on the same frame k0;
  outro — no velocity, or braking into time.freeze on the last beat.
  Shots: dance with clear poses, martial arts, sport (a hit, a throw, a landing), stunts, drifting and drive-bys of cars, a model's
  walk, fast camera moves — anything where action peaks in the source happen more often than once every 1–2 s.
  Limits: velocity — no more than 40–50 % of the video length and no more than 2–3 sections per 30 s; no more than 2 clips in a row with the same
  action; in motivation — only on cutaways under the voiceover, without sync sound.
avoid: |
  Speech and sync sound (lips, voice), a product and details that need to be examined (the blur eats them), talking heads and static
  shots, shots without clear action peaks — the speed pulses "into the void". An action peak that misses the beat — the error
  is visible immediately. A slow part below 0.5 from 25–30 fps without flow — duplicate frames and judder. A face in close-up in the fast part —
  the blur disfigures it. Blur on the beat frames — the "stop-hit" is lost. The whole video in velocity — causes motion sickness and loses contrast.
  Calm, explainer, luxury and dramatic videos.
sfx: |
  The music carries the hit by itself — don't put separate sounds on every beat. On entering the section — sfx.riser on the bar before it and
  sfx.impact or sfx.sub_drop on the first beat (align='attack', 0 ms to k0); sfx.whoosh — only on the longest speed-up
  (no more than once per bar, peaking in the middle of the speed-up, −12…−15 dB relative to the music, panned in the direction of motion). Source audio
  is off.
genres: {phonk: signature, fanedit: signature, viral: allowed, sport: allowed, travel: allowed, fashion: allowed, teaser: allowed, motivation: allowed, drama: forbidden, calm: forbidden, product: forbidden, clips: forbidden, explainer: forbidden, ugc: forbidden, epic: forbidden}
detect: |
  ed_motion: global motion in one direction (SHIFT, ZOOM or ROTATE) is cut into a series of events — one per beat
  (or per 2 beats): each spanning 0.65–0.9 of the period (10 of 12 frames @25 at 125 BPM, 13 of 15 @30 at 120 BPM, 8 of 12 for the hard
  curve) with a gap of 2–4 frames on the beats, with equal sums and a peak %/frame in the middle; at constant speed — one
  long event. Frame difference (diff): mean in the middle of the beat / mean within ±1 frame of the beat = 4–8 (constant speed
  ≈ 1); diff autocorrelation at a lag of one beat ≥ 0.5 (0.82–0.84 on a pan, 0.54 on a zoom-in; constant speed — 0.21).
  Sharpness: with blur, frames at the beats are 1.6–3 times sharper than in the middle of the beat; without blur ≈ 1, but with blend interpolation
  contours double in the slow part. Speed on the beat below 0.2 without flow — holds of 2–3 frames exactly on the beats.
  shake.jitter_pct ≤ 0.4 — no oscillation, the source only moves forward. The numbers — a synthetic render of these curves on a
  pan and a zoom-in (ed_motion at 320 px, 25 and 30 fps). With a character in the frame: action peaks (stops, contacts) sit on
  the beats ±1 frame in ≥ 70 % of cycles.
  Difference from time.speed_ramp: there 1–2 transitions per shot and a slow part of 0.4–1.5 s around a single peak; here ≥ 3 cycles
  in a row with a beat period and slow zones of 2–6 frames each. From time.fast_motion: the speed is constant (even diff). From
  time.step_print: frozen phases of 2–6 frames and jumps, without a smooth speed-up. From cut.stutter: frames repeat, time
  jumps back. From zoom.in_out on the beats: there the scale returns each time (product ≈ 1), here the source
  only moves forward.
engine: |
  velocity_pattern(clips|clip, beats, grid='1/4'|'1/2'|'1/8', anchors='action_peaks'|'uniform'|[a…], rate_mean=2.5,
                   influence=0.85, ease='inOutCubic'|'inOutQuint', bias=0, rate_min=0.2, rate_max=8, shutter=0.5)
    — extends velocity_pattern from time.speed_ramp: anchors on action peaks, the curve s(t) from params, per-frame source times.
  action_peaks(clip, flow='DIS', min_gap=0.25) — a new primitive: source moments where the median flow drops after a
    maximum (a stop, a contact) or the acceleration is at its maximum; anchors are chosen by dynamic programming — as close as possible
    to the peaks with each cycle's r̄ in [1.5, 4].
  → speed(curve=[[t, rate], …], interp='flow' for r < 1 | 'blend' for r ≥ 1)
  → motion_blur(mode='flow'|'frames', shutter=0.5, adaptive='rate') from time.motion_blur — only on frames with r ≥ 1.2.
  Render: ed_edl already accepts segment.times — the source time for each frame (+ interp='flow'); the blur needs a new fx
  shutter(n, span) — the average of n subframes; ed_render only supports a constant clip speed — speed_curve is needed.
  Sound: mute the source. + beat_punch and beat_shake on the same k0 (opt.) + sfx('riser', at=section start − 1 bar)
  + sfx('impact', at=first beat of the section, align='attack').
gen_hint: "<subject> performing <fast continuous action with clear hits: dance with sharp poses / boxing combination / skateboard trick / car drift>, shot at 60 fps with fast shutter, crisp frames, dynamic camera following the action, distinct accents and brief stops at each hit"
commands: ["velocity over the whole drop", "do velocity on the beats in #3–#6, motion peaks on the hits", "hard velocity with blur on the chorus", "choppy 1/8 velocity in the last bar before the drop", "half-bar velocity — the track is too fast", "remove the velocity, back to normal speed"]
related: [time.speed_ramp, time.motion_blur, time.echo_trail, time.slow_motion, time.fast_motion, time.step_print, time.freeze, cut.stutter, zoom.punch, shake.beat, trans.flash, fx.rgb_split, cut.quick]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
