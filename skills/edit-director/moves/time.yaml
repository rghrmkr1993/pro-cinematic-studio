id: time.slow_motion
family: time
group: time
level: B
aliases: [slow motion, slow-mo, slowdown, high-speed footage, high-speed filming, overcranking, high frame rate, HFR]
what: playback at 1/2–1/5 of real speed to stretch a peak of motion, a walk or an emotional beat, while the music keeps its normal tempo
frames: |
  1. Entry: usually by a cut from a normal-speed shot (if the speed changes within the shot, that is time.speed_ramp).
  2. Action: 2–5 s on screen (50–125 frames @25 fps) containing 0.5–2 s of real time. Hair, fabric,
     liquid, smoke, debris and confetti "float", falling objects hang, a running stride lasts ≈0.6–1.2 s
     instead of 0.3 s. The frames are crisp: blur on fast objects is less than you'd expect (short exposure when shooting
     at 50–120 fps). The camera often moves itself (tracking alongside a runner, a slow push-in, an orbit) — also smoothly,
     without small shakes: handheld footage in slow motion "glides".
  3. Peak: the jump, punch, throw, swing or glance falls in the middle or the second third of the shot.
  4. Exit: a cut to normal speed, more often on a downbeat; less often — a dissolve into the next slow-motion shot.
variants:
  - hero walk: one person or a group walks toward the camera, ×2–2.5, shot 3–5 s, often night or backlight
  - body in motion: running, jumping, dancing, pole acrobatics — hair and clothes flow, ×2–4
  - chaos and destruction: debris after an explosion, a crash, a car flipping over, objects in the air — ×3–8
  - objects in close-up: falling fruit and bags, a water splash, a burner flaring up, a spinning part, confetti on the floor — ×4–10
  - reaction and comedy: an awkward jump, thrown popcorn, a facial reaction — the slowdown makes the moment solemnly funny
  - music or sports detail: a cymbal hit, a ball kick, a player's feet in close-up
status: code
fallback: in code reliably up to ×2–2.5 (optical flow); ×3 and stronger — only from a 75+ fps source (search the frame-rate metadata of the user's source footage) or generation of an HFR shot with consent; don't slow down shots with complex occlusion (a crowd, a fence, hair on a busy background) by interpolation — take another shot, time.freeze or normal speed
params:
  rate: 0.25–0.6 of real speed (slowdown ×1.7–4), typically 0.4–0.5
  source_fps: 50/60 fps → rate 0.5/0.42 without frame synthesis; 100/120 fps → 0.25/0.21; 25/30 fps → interpolation only, not below 0.4
  interp: drop (every source frame without synthesis) if src_fps ≥ 25/rate; otherwise flow (minterpolate mci + aobmc + bidir); blend — only at rate ≥ 0.7, otherwise ghosting
  duration: 1.5–5 s on screen (38–125 frames @25 fps), typically 2.5–3 s (60–75 frames)
  peak_position: 40–70 % of the shot length
  camera: any camera movement of its own is fine; ×2 slow motion halves the frequency of handheld shake
  audio: either mute the source audio or slow it down as an effect (pitch down 5–12 semitones + low-pass 1–2 kHz); music — at normal tempo
  deflicker: with artificial light in a 100+ fps shot — remove the brightness pulsing (window of 5–9 frames)
when: the peak of an action (a jump, a punch, a throw, a splash), the character's walk, a glance or a smile at an emotional point, a product with particles or liquid; on a breakdown, half-time, a long note or a vocal pause; the classic — slow motion on the build and normal speed on the drop, in epic genres — slow motion on the drop itself; in fast genres ≤25 % of the running time and no more than 2 slow-motion shots in a row, in epic and sport — up to 50 %
avoid: sync speech and singing in the shot (lips "drift"); shots shorter than 1.5 s on screen (the slowdown doesn't read); interpolating 25 fps beyond ×2.5 — rubbery edges and mush; noisy night shots through flow; identical slow-motion shots in a row without a change of shot size; a comic pause when the joke's timing relies on speed
sfx: on entry reverse_whoosh or sub_drop; inside — a muffled, pitched-down ambience or silence, music through a 0.8–2 kHz low-pass for an "underwater" sound; at the peak — an impact or a swell; exit to normal speed — a hit on the downbeat
genres: {epic: signature, sport: signature, motivation: signature, fanedit: signature, fashion: signature, drama: allowed, product: allowed, travel: allowed, viral: allowed, phonk: allowed, teaser: allowed, clips: allowed, ugc: allowed, calm: allowed, explainer: allowed}
detect: |
  Visually: motion slower than physics — a thrown or falling object hangs longer than 0.5 s, running — fewer than 2 steps
  per second, hair, fabric, liquid flow as if underwater, yet the frames are sharp.
  ed_motion: the camera floats — SHIFT/ZOOM events lasting ≥1 s with a peak ≤1 %/frame and shake jitter_pct ≲0.2
  even with handheld shooting; frame diff low relative to the visible action; no cuts within the shot.
  Signs of fakery: optical flow — the background dragging along the contours of arms and legs; blending — semi-transparent double
  contours; duplication — holds of 1–2 frames at a regular step (jerky). Real HFR under artificial
  light — brightness pulsing with a period of 2–10 frames.
  Difference from time.speed_ramp: the speed is constant for the whole shot. From time.super_slow_motion: there the motion almost
  stands still (×8+), a punch lasts seconds. From time.freeze: the motion doesn't stop. From step printing: no jerks.
engine: |
  speed(rate=0.4, interp='flow') on the source segment [a, b] — by default;
  if source_fps(clip) ≥ 25/rate — speed(rate=25/source_fps, interp='drop') (conform without synthesis);
  + deflicker(window=7), if the shot is HFR under artificial light
  + audio_speed(rate, pitch='mute'|'follow', semitones=-7, lowpass_hz=1500)
  + sfx('reverse_whoosh', at=t_in, align='peak') + sfx('impact', at=t_out) — exit on a downbeat.
  Screen length = (b−a)/rate; put the action peak on a beat of the track.
