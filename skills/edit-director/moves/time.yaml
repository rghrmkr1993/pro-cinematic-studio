id: time.cinemagraph
family: time
group: time
level: B
aliases: [cinemagraph, living photo, animated photo, loop photo, partial freeze]
what: the frame is frozen like a photograph, and only one zone — water, hair, steam, leaves — moves endlessly in an invisible 0.6–4 s loop; a pause, atmosphere, a stopped moment
frames: |
  1. Source — a tripod shot (shift between frames ≈0 px) with local repeating motion: water ripples,
     hair in the wind, steam, liquid in a glass, leaves, fabric, blinking.
  2. One reference frame is frozen entirely, except for a mask over 3–20 % of the area (up to 80 % if water takes up
     almost the whole frame): outside the mask the temporal brightness spread is ≈0 (no grain, no breathing), in the zone — 5–13 levels.
  3. The motion in the zone is looped: ripples 0.6–1.5 s, hair ≈1.5 s, slow natural motions 3.7–3.9 s.
     The seam is invisible: the jump from the last frame to the first is no more than 1.1–1.4 of a normal step (a chosen repeating
     segment, a 0.3–0.5 s dissolve of the tail into the start, or ping-pong).
  4. The mask edge is soft and hidden along natural contours: the waterline, the edge of hair, the wall of a glass.
  5. In the edit it holds 2–6 s (2–5 loop repeats); the camera doesn't move.
variants:
  - water: ripples and reflections in a lake, a pool, a flooded hall — loop 0.6–1.5 s, zone 17–80 %
  - wind: the person is frozen, only hair, leaves or fabric move — loop 1.5–4 s, zone 3–12 %
  - liquid and steam: particles and bubbles in a glass or cup, product shots — zone ≈20 %, loop ≈4 s
  - micro-loop: a tiny gesture or detail of 4 frames (0.16 s), an almost imperceptible twitch
status: hybrid
fallback: no tripod shot — stabilize(strength=1) on the static part, and if residual shift is >0.3 px, don't do the move; no motion at all — image-to-video generation from a photo ("only the water/steam/hair moves") and freezing the rest with a mask
params:
  loop: 0.6–4 s; water 0.6–1.5 s, hair and leaves 1.5–4 s
  seam: dissolve of 8–12 frames @25 fps (0.3–0.5 s) or ping-pong; jump at the seam ≤1.4 of a normal step
  zone: 3–20 % of the frame (up to 80 % for water scenes)
  mask: by the segment's temporal spread (threshold ≈2.5 levels on 8×8 blocks, close the holes) or semantic (hair, water, sky)
  feather: 1–3 % of the frame width
  still_frame: the most expressive sharp frame of the same segment
  hold: 2–6 s on screen (2–5 repeats)
when: intros and title-card backgrounds, a breather between fast blocks, the final shot, food and drink product shots (steam, bubbles, pouring), travel (water, flags, clouds), fashion (hair and fabric in the wind); a background for text; 1–2 times per video
avoid: a handheld camera without stabilization — the frozen part "swims"; motion crossing the mask edge (a hand passing through the frozen area) — ragged edges; light changes in the zone (clouds, flashes) — flicker at the seam; a short shot with no repeating motion — the jump is visible; fast editing where a shot stays on screen less than 1.5 s; sync speech and dialogue
sfx: a quiet looped ambience of whatever moves (splashing, wind, hissing steam, crackling fire), no hits; music — a sustained note or a pad; the sound must loop as seamlessly as the picture
genres: {calm: signature, product: signature, travel: allowed, fashion: allowed, teaser: allowed, drama: allowed, motivation: allowed, explainer: allowed, ugc: allowed, viral: allowed, epic: allowed}
detect: |
  Map of temporal brightness spread: a compact zone of 3–20 % (in water scenes up to 80 %) with a spread of 5–13 levels,
  the rest ≈0 — a dead freeze, without grain or micro-movements; global shift ≈0 px.
  The video is a short loop of 0.16–4 s: the frame at the seam is almost equal to the first one (jump ≤1.1–1.4 of a normal step).
  ed_motion: no events, a large overlay-mask (the static part), no holds (the zone changes every frame).
  Difference from time.freeze: there everything is still. From an ordinary static shot: there the still parts have noise, people breathe
  and blink (spread 1–3). From time.bullet_time: there the camera moves around the frozen scene, here the camera stays still.
engine: |
  cinemagraph(seg=[t0, t0+L], still=frame(t_ref), mask='motion'|'mediapipe_hair'|'water'|'manual', feather=0.02,
              loop='crossfade'|'pingpong', seam=0.4, repeat=3, invert=False)
  — stabilize(strength=1) → mask: temporal spread of the segment > 2.5 on 8×8 blocks, morphological closing, feathering;
  out = still·(1−mask) + loop(segment)·mask; seam — xfade of the tail into the start 0.4 s or loop(mode='pingpong').
  invert=True — the reverse variant: a frozen character (mask='mediapipe_person') on a living background.
  Generation: image-to-video from a frame with motion only in the needed zone, then the same mask-based freeze.
gen_hint: cinemagraph-style shot, locked-off tripod camera, a completely still scene of <subject/scene>, only <the water ripples / the hair moves in the wind / steam rises from the cup> in a gentle seamless loop, everything else frozen like a photograph
commands: ["cinemagraph from #3 — let only the water move", "bring the photo to life: steam from the cup, freeze the rest", "a 4-second cinemagraph title card on the model's hair", "reverse cinemagraph: the character is frozen, the crowd around them moves"]
related: [time.freeze, time.boomerang, time.bullet_time, loop.end, rig.locked_on]
evidence: {examples: 8, sources: 8, measured: "moving zone 3.5–19 % of the frame (one water scene — 79 %); outside the zone temporal spread 0–0.5 versus 4.6–12.9 in the zone; loop 0.16–3.9 s (water 0.6–1.5 s); jump at the seam 0.9–2.1 of a normal step (6 of 8 ≤1.4); global shift ≤0.5 px; what moves: water — 3, hair and wind — 2, liquid — 1, leaves — 1, micro-gesture — 1", confidence: high}
