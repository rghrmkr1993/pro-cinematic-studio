id: time.fast_motion
family: time
group: time
level: B
aliases: [fast motion, fast forward, undercranking, sped-up footage, speed up]
what: the action plays 2–10 times faster than real time — compresses routine and time, gives a comic jerkiness or the feeling that the world is rushing past a frozen character
frames: |
  1. Entry is usually by a cut; the shot is already sped up (a speed-up within the shot is time.speed_ramp).
  2. Action: 1.5–4 s on screen (38–100 frames @25 fps) hold 5–40 s of real time. People walk
     jerkily at 3–6 steps per second, hands on a keyboard, a knife or boxes flicker, cars and crowds
     turn into a stream. In night and moving shots — semi-transparent trails behind people, and lights
     stretched into lines; in static daytime shots — sharp, "jerky" movements without motion blur.
  3. A common construction: the character stands or sits almost motionless and sharp, while around them a crowd, security guards,
     shoppers, cars rush past as blurred ghosts; or a blurred skateboarder flies past the lying
     character.
  4. Exit by a cut to normal speed or an abrupt stop (time.freeze) on a beat.
variants:
  - the world rushes, the character is frozen: camera on a tripod, the character motionless, everything around ×4–10 with trails
  - comic jerk: an everyday action (typing, cutting, eating, dancing, posing) ×2–4, jerky movements, no motion blur
  - drive: camera on the hood or in the cabin, the city at night, ×4–12, lights stretch into streaks, radial blur at the edges
  - a sped-up handheld or fisheye walk-through along a street, a bridge, an interior ×3–6 (close to time.hyperlapse)
  - archival jerk: black-and-white or faded street newsreel, passers-by scurry jerkily (the effect of an old hand-cranked camera)
  - a carousel, a crowd in a hall, product handling from above — repetitive motion turns into a pattern
status: code
fallback: the frozen-character variant — hybrid (mask(person) from a single frame of the character over the sped-up background, the camera must be still — otherwise stabilize or search the source footage for a static shot); radial trails for a drive — blur(kind='zoom') over the speed-up, if the source was shot with a short exposure
params:
  rate: ×2–10, typically ×3–4 for people's actions, ×6–8 for crowds and traffic; ×10+ is already time.timelapse
  interp: drop — a jerky comic or archival look; blend — trails and flow (average 50–100 % of the source frames that fall on each output frame)
  shutter: fraction of averaged frames 0.5–1.0 with blend (1.0 = continuous trail, 0.5 = short tail)
  duration: 1–4 s on screen (25–100 frames @25 fps), typically 2 s; longer than 5 s gets tiring
  stabilize: mandatory before speeding up a handheld camera ×4+ (the shake speeds up along with the action)
  audio: either mute the source audio, or speed it up with rising pitch (comedy), or replace it with a rewind sound; music at normal tempo
  hero_still: the character — 1 frame or speed(1.0) via a mask, the background ×4–10 blend
