id: anim.claymation
family: anim
group: graphics
level: B
aliases: [claymation, plasticine animation, plasticine, clay animation, plasticine cartoon, clay painting]
what: characters and a world made of plasticine, animated frame by frame — soft rounded shapes, fingerprints, a "breathing" surface and jerky motion on twos; warm handmade naivety or absurdity
frames: |
  1. Material: matte rounded shapes with fingerprints and seams, bead eyes, replacement mouths; the world is a miniature
     set (a bench, a tree, a room) or a flat plasticine "canvas" sculpted on a board.
  2. Timing: a phase holds for 2 frames (80 ms @25 fps, ≈12.5 phases/s) — the main rhythm; pauses and stop poses — 4–5 frames (≈200 ms);
     fast actions on ones. Slow transformations — 3–6 frames per phase (≈4–8 phases/s).
  3. Material "breathing": between phases the surface changes slightly even at rest (0.6–1 brightness levels in still areas),
     frame brightness flickers by 0.6–1.2 %, the camera is locked dead still (jitter ≤0.6 % of the frame).
  4. Speech via replacement mouths: the mouth shape changes every phase, the face is almost still, brows and eyes "act" separately.
  5. Transformations without cuts: a figure grows vines and becomes a flower, a face melts into a symbol, fish into waves,
     a stream into a new face (6–18 s in one shot).
variants:
  - close-up dialogue: a face on twos with replacement mouths, blinks lasting 4–5 frames
  - miniature set: a figurine in a built world, props appear and disappear from phase to phase
  - plasticine canvas: flat relief on a board, scenes flow into one another (≈10 phases/s)
  - metamorphosis: a character turns into a plant, an object or an element in 6–8 s
  - animator's hands in frame: real hands sculpt and reposition the figurine right in the scene — comic and "honest"
status: generation
fallback: "code gives only the timing and texture — step_print(hold=2) + 0.3 % frame jitter + ±1 % brightness flicker + soft posterization; the plasticine look itself is generation (image/video-to-video from a 'plasticine claymation' style frame) with consent; footage: find frame-by-frame sculpting or toys shot in the source footage"
params:
  timing: on twos (2 frames @25 fps = 80 ms, ≈12.5 phases/s); pauses 4–5 frames; transformations 3–6 frames per phase
  boil: change in still areas between phases 0.5–1 brightness levels; exposure flicker 0.6–1.2 %
  camera: static (jitter ≤0.6 %), occasional push-ins also on twos
  palette: saturated "plasticine" colors (saturation 95–170), soft directional light, shallow depth of field on close-ups
  shot: 1.5–4 s per line or action; metamorphosis 6–18 s
  lip_sync: mouth change on every phase by phoneme, 4–6 mouth shapes
when: kids' and family videos, absurd humor and memes, a music video or fan edit with a handmade aesthetic, explaining through an object that "comes to life", intros and bumpers, a brand with a warm craft tone; metamorphosis as a transition between topics
avoid: serious news and strict product specs; long close-up dialogues without good mouth sync; generation without locking the character — faces and colors "drift" from shot to shot; smooth motion on ones — the handmade feel disappears
