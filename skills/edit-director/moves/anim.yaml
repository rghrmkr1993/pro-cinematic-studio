id: anim.cgi_3d
family: anim
group: graphics
level: B
aliases: [3D animation, CGI, CG animation, 3D graphics, 3D loop, motion design 3D, render]
what: an insert of 3D computer animation — an object or character with soft volumetric light, smooth materials and true perspective; a motion-design loop, a simulation or "impossible physics"
frames: |
  1. Scene: an object in the center on a single-color studio cyclorama (background 30–60 % of the frame, 1–2 colors, soft vignette shadow)
     with a contact shadow under the object — or a fully built environment (a city from above, a club, a landscape).
  2. Surfaces: smooth light gradients instead of flat fills (smooth gradient — 0.15–0.5 of the area vs < 0.1 for flat
     drawing), soft shadows and shading in crevices; specular highlights — up to 11 % of pixels on chrome; no sensor noise
     (or an even overlaid grain on stylized ones).
  3. Motion: motion design, simulations (cloth, soft bodies, liquid) and the camera — on every frame, no holds;
     stylized "toy" characters — on twos (a pose holds 60–120 ms, ≈12 poses/s).
  4. Camera: static while the object rotates (turntable), or a slow orbit/push-in ×1.04–1.3 over 0.5–2 s,
     close to linear; the perspective is real — moves have nonrigid 0.25–1.2 (parallax within the object).
  5. Structure: a seamless loop of 1–4 s (the last frame passes into the first like an ordinary step); or an event
     "rest → hit/fall → material reaction → settling" in 2–4 s.
  In the edit: enter with a cut on the beat, insert 2–4 s; a loop can stretch up to 8 s under text or voice.
variants:
  - abstract loop — repeating shapes, extrusion, morphing, static camera
  - simulation — cloth settling onto an invisible shape, a soft body, liquid relief with a ball
  - product — gloss and glass, a macro move with shallow depth of field
  - chrome — mirror surface, bright highlights, reflections of the surroundings
  - stylized characters — vinyl or plasticine, shallow DoF, neon backlight, on twos
  - grainy — soft pastel volumes with a noise texture and a dark vignette
  - low-poly / top-down view — simple shapes, even light, an endlessly repeating grid
  - 2.5D card — live video on a plane that flips in space (90° snaps in 1–3 frames)
status: generation
fallback: |
  footage — find 3D renders in the source footage (the tells are in detect);
  code — 2.5D: video or a frame on a plane with a perspective rotation and a shadow; simple 3D text;
  Blender via the Higgsfield bridge (bl_*), if connected: turntable, primitives, cloth simulation from a template;
  generate_3d — a model from an image → turntable render.
params:
  frame_rate: on ones (25 fps, every frame new) — baseline; stylized characters — on twos (12.5 poses/s)
  loop: 1–4 s, seamless; repeat with loop(mode='cycle') up to 8 s
  camera: static + object rotation 45–90°/s; or orbit/push-in ×1.04–1.3 over 0.5–2 s, linear or inOutCubic
  background: single-color cyclorama (30–60 % of the frame) + contact shadow; or a full environment
  palette: two complementary colors with saturation 140–210 (pink/mint, yellow/purple, magenta/violet); or "white clay" monochrome (saturation < 10)
  materials: clay and matte plastic, chrome, glass, fabric, fur; matte reads as "soft", gloss as "premium"
  dof: shallow DoF (background bokeh) for characters and objects; deep for abstractions
  duration: insert 2–4 s (50–100 frames @25 fps); loop under text — up to 8 s
when: a product "wow" shot and an object out of nothing; an intro and a loop under a logo or headline; visualizing an abstract idea in an explainer; a transitional showpiece between parts; on the drop — an impact or a simulation; in a live-action video — 1–3 inserts per minute
avoid: stylized 3D next to live video without shared light and color; a render without a contact shadow — the object "floats"; an uneventful loop longer than 8 s; realistic human faces in 3D (uncanny valley); third-party brands and logos on objects
sfx: soft "plastic" clicks and pops on contacts; a swell or whoosh on an orbit; a simulation hit — impact or sub_drop; for loops — an even ambient bed
genres: {product: signature, teaser: allowed, explainer: allowed, viral: allowed, epic: allowed, fashion: allowed, motivation: allowed, calm: allowed, fanedit: allowed, clips: allowed}
detect: |
  ed_motion: when the camera or object moves — zoom/rotate events with nonrigid 0.25–1.2 (real perspective) and no
  shake (jitter ≤ 0.2 %, a live camera usually has more); with a static camera — no events, but the object rotates;
  no holds (on ones) or regular pairs of identical frames for stylized characters.
  frame: smooth gradient over 0.15–0.5 of the area, flat pixels almost only on the cyclorama background, perfect edges, highlights,
  soft contact shadows; no sensor noise.
  differences: live video — sensor noise, organic fine texture, micro-shake; 2D drawing — flat fills
  with outlines and rigid layer shifts (nonrigid ≤ 0.06); stop motion — uneven holds, light flicker, finger
  marks on the material; 2.5D card — live video inside the plane with perspective distortion.
engine: |
  generation: generate_image(prompt=gen_hint) → generate_video(image, motion='slow orbit'|'turntable', dur=3–5)
    or generate_3d(image) → bl_import_model + bl_render(camera='turntable', deg=360, dur=4–6) when Blender is connected
  code (2.5D): plane3d(clip, rotate=[0, 180], axis='y', persp=0.6, t=[t0, t0+0.5], ease='inOutCubic', shadow=True, bg='black')
  editing: cut on the beat → insert 2–4 s → loop(mode='cycle') for a loop; sfx('click', at=contact), sfx('impact', at=hit)
gen_hint: stylized 3D animation of <object or character> on a seamless pastel <colour> studio backdrop, soft global illumination, gentle contact shadow, smooth clay or glossy plastic materials, slow orbiting camera, seamless 4-second loop
commands: ["insert a 3D product loop before the final shot", "flip shot #2 like a card in 3D", "a 3D object on a solid background under the headline", "cloth simulation on the drop"]
related: [anim.cel, anim.live_mix, anim.stop_motion, anim.claymation, orbit.turntable, product.hero, look.video_game]
evidence: {examples: 16, sources: 16, measured: "on ones in 3 of 3 clips with previews ≥ 25 fps (not a single hold); stylized character — alternating holds of 60/120 ms at a 16.7 fps preview (≈12 poses/s); nonrigid 0.25–1.2 for camera and object moves; smooth gradient over 0.15–0.49 of the area; cyclorama background 30–60 %; highlights up to 11 % on chrome; loop seams in 2 of 2 checked equal an ordinary frame step", confidence: medium}
