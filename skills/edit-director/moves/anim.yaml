id: anim.zoetrope
family: anim
group: graphics
level: C
aliases: [zoetrope, slotted drum, 3D zoetrope, figurine carousel, chronophotography, motion phases, living carousel, film strip loop]
what: bringing a sequence of phases to life — figurines on a spinning drum or carousel, frames seen through slits, or copies of the subject in successive poses add up to a short motion loop; a retro "pre-cinema" motif and a transition into that loop
frames: |
  The device as a motif (4 of 7 examples):
  1. A slotted drum or a multi-tier carousel of figurines, lit from inside, in a dark room; the object in the center
     of the frame, ≈ 25–60 % of the width. Rotation is synced to the frame rate — the figurines inside aren't blurred but "walk" in place.
  2. The camera slowly pushes in: ×1.1 over 0.8 s (observation), ×1.7 over 2.3 s toward a single panel while drifting sideways by 59 % of the frame
     (a soft landing), or continuously ×19 over 10 s into the carousel — the figurines become live people on approach,
     and the frame turns into a full scene without a cut.
  3. Reverse move: a pull-out ×0.45 over 3.5 s from a rotating stage on which the subject walks in place past sculptures.
  Phases in one frame (2 of 7): the subject repeated 4–8 times in successive poses along a path; or a strip of
  6–8 panels of 12–17 % of the width each with dark perforations at the top and bottom, each holding the next phase; the color drifts as a gradient.
  "Live zoetrope" (1 of 7): a fast pan along a row of nearly identical figures, a repeat step of ≈24 % of frame width,
  a shift of 3–13 % per frame — the row flickers like an animation.
variants:
  - drum in frame: a real or built zoetrope spins, the camera slowly pushes in toward the slits
  - portal: a push-in into the carousel or into a single panel of the drum, on approach the figurines come alive and become a scene
  - 3D carousel: tiers of figurines or props on a rotating table, the subject walks in place against the rotation
  - motion phases: 4–8 copies of the subject in successive poses (surfing, a jump, a run) along a path
  - film strip: a row of perforated panels, each with the next phase, the strip creeps sideways
  - live zoetrope: a row of identical people, a pan turns it into a flickering loop
status: generation
fallback: |
  code: a film strip from the user's clip (panels with phases offset by 2–4 frames); motion phases in one frame —
  a subject mask + opaque copies from past frames (like the procession of doubles in time.echo_trail, only without fading);
  3D: a loop of 8–16 cut-out phases of the subject on the inner wall of a drum (Blender or 3D generation) rotating in time with the frames;
  generation (with consent) — drum, carousel and portal per gen_hint; footage — find the motif in the source footage (detect)
params:
  phases: 8–16 phases per loop (≈); 4–8 copies of the subject in one frame
  loop: 0.5–2 s per full phase cycle (≈); one cycle = a beat or a bar
  strobe_sync: drum revolution = phases / fps (12 phases at 24 fps → 0.5 s per revolution); otherwise the figurines drift
  strip: 6–8 panels of 12–17 % of the width each, perforations at top and bottom 6–10 % of the height, the strip advances 1 panel per 2–4 frames
  copy_spacing: copies 3–8 frames apart in time (0.12–0.32 s) and 10–18 % of the width apart in the frame
  push_in: observation ×1.1 over 0.8–1 s; toward a panel ×1.5–2 over 2–2.5 s, ease-out; portal ×10–20 over 6–10 s, near-linear
  look: a dark room, warm light from inside (sepia), a soft vignette; copies — with a color gradient
  duration: 2–10 s (50–250 frames @25 fps)
when: intros and outros in a retro aesthetic, the theme of film history or "how it all began"; a portal transition from the loop into a live scene; a product or the subject as figurines on a carousel; breaking motion down into phases in sport (a jump, a wave, a strike) and in an explainer; music video and fashion — an art cutaway; 1 per video
avoid: a strobe at 8–15 Hz for longer than 2–3 s (a risk for photosensitive viewers, tiring); phases with uneven time steps (the loop stumbles); more than 8 copies in frame (mush); a fast strip advance not synced with the phases; unsynchronized drum rotation (the figurines drift)
sfx: chatter and clicks of a mechanism or projector, the plucked notes of a music box, a rising hum of rotation; on the portal — a swell and a whoosh on entering the scene
