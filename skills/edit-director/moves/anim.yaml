id: anim.live_mix
family: anim
group: graphics
level: C
aliases: [2D over footage, cartoon + real life, mixed media, hybrid animation, drawn characters in the real world]
what: "mixed media: hand-made characters and lines join the real scene and react to the person in it"
frames: |
  1. Live layer: ordinary footage on ones — a handheld or tracking camera (jitter 0.07–1.1 %, fly-throughs up to 2.3 %
     of the frame per frame), real light and noise.
  2. Drawn layer: flat fills in 2–3 tones, a thin outline or none, saturated colors
     (average frame saturation 80–160); 1–2 key colors repeat the colors of the live scene (yellow clothing — a yellow
     character, blue light — a blue brushstroke).
  3. The layers have different timing: the live video changes every frame, the drawing holds a pose for 2–3 frames (80–120 ms) —
     these "two tempos" in one frame are the signature of the device. If the camera moves, the drawing still shifts
     with it every frame (tracked), while the pose holds.
  4. Depth: a drawn element passes now behind the actor, now in front (a brushstroke wraps around the head, a ribbon goes behind a leg),
     characters have a contact shadow or touch the ground; the foreground of the live shot occludes the drawing.
  5. Interaction is the key moment: the actor and the drawn character look at each other, touch, dance
     in sync; a live person turning into a drawn one is a cut on a matching silhouette (same pose and position
     in frame), after which the drawn double moves on twos or threes.
  In the edit: a single-shot episode of 1.5–5 s; the entry is often via a transformation on a downbeat; drawn "accents"
  (lightning bolts, exclamations, bubbles) pop in within 1–2 frames on events.
variants:
  - brushstroke around a person — a drawn ribbon or brushstroke wraps around the actor, passing now in front, now behind
  - transformation — on a cut, a live person becomes a drawn double in the same pose
  - dance with characters — drawn figures dance together with live people on the street, the camera follows
  - drawn details on a person — a costume, a hairdo, emotion icons over the live subject, tracked
  - world as a set — a live actor in drawn or painted scenery (the reverse variant)
  - drawn creatures in a real place — characters "live" in the location and react to people
  - graphic bubbles and icons — message bubbles and exclamations pop up around the subject
status: hybrid
fallback: |
  generation (with consent) — a drawn character with action: generate_video from a key frame of the live scene
  with a description of the interaction, then composite via a mask; without generation — simple drawn elements in code
  (a ribbon stroke along a spline, bubbles, icons, lightning bolts) with tracking and masks; if the source footage has no shot
  for the transformation — a cut on a matching silhouette between two different shots and stylization of the second (anim.cel).
params:
  layer_timing: live — on ones; drawing — on twos or threes (2–3 frames @25 fps), the shift with the camera — every frame
  palette: drawing — 3–8 flat colors, 1–2 of them taken from the live scene (median color of clothing or background); drawing saturation 140–220
  line: no outline or 0.3–0.6 % of height, a dark shade of the fill color
  track: camera — homography or background points every frame; anchor character — track(person|face)
  depth: a person mask (mediapipe_person) splits the drawing into "behind" and "in front"; contact shadow at 20–35 % opacity
  transform_cut: transformation — a cut within 1 frame when the silhouettes overlap ≥ 70 % (mask IoU), no transition
  accents: icons 4–10 % of frame height, appear within 1–2 frames (pop), hold 0.3–0.8 s
  duration: episode 1.5–5 s; no more than 2–3 episodes per 60 s video
when: hook and teaser — "real world + cartoon" holds attention; a product video — a mascot character next to the product or the subject; music video and fan edit — dancing with characters; explanation — drawn arrows, icons, the subject's thoughts; a transformation on the drop
avoid: an untracked drawing on a moving camera — it "floats" and gives away the fake; a drawing always on top of the person — no depth; drawing colors not taken from the scene's palette; a flat-filled drawing on ones with the same step as the live video — looks like a sticker; long episodes without interaction
sfx: on appearance — a pop or a soft whoosh; on a touch and a transformation — an impact or a bright swell; icons — click; dance episodes — exactly on the track's beat
genres: {fanedit: signature, product: signature, viral: allowed, teaser: allowed, ugc: allowed, explainer: allowed, motivation: allowed, fashion: allowed, clips: allowed, calm: allowed}
detect: |
  frame: within one frame, textured areas of live footage (texture 1–2, noise) and areas of flat saturated fills
  (5–40 % of the area) with clean edges.
  time: flat areas change every 2–3 frames (≈ 0 in between), live areas every frame; when the camera moves
  the flat areas move with the background (the same shift per ed_motion), but their shape changes in steps.
  ed_motion: live-camera events (jitter 0.07–1.1 %, SHIFT up to 2.3 %/frame, nonrigid 0.15–0.5); a transformation is
  a cut after which the share of flat pixels jumps sharply.
  differences: doodle overlay — simple faces and lines, no bodies or actions; cel — the background is drawn too; 3D insert —
  volumetric light and gradients on objects; rotoscope — the whole frame is redrawn over live video.
engine: |
  hybrid: track(camera='homography', every=1) + mask('mediapipe_person', feather=2)
    → layer(drawn, timing=step_print(hold=2), anchor=track, depth=['behind_person' | 'front'], shadow=0.25)
    → composite(layers=[live, drawn_behind, person_matte, drawn_front], blend='normal')
  ribbon stroke: ribbon_stroke(path=spline(points=track(person, joints)), width=0.04*H, texture='brush', color=palette_pick(scene, 1),
    reveal=[t0, t0+0.6], wrap='around_head', depth_switch=track(face))
  transformation: match(on='shape', iou>=0.7) → cut(at=t_beat) → stylize_gen(clip_after, style='flat 2D', keep_pose=True) + step_print(hold=2)
  generation: generate_video(image=keyframe(live), prompt=gen_hint, dur=3–5) → mask + composite
  icons: callout(kind='spark'|'exclaim'|'bubble', size=0.07*H, anim='pop', dur=0.5) on events
gen_hint: live-action footage of <person> in <location> interacting with flat 2D hand-drawn cartoon characters, cartoon elements composited into the real scene with matching colour palette, characters animated on twos, real camera movement, cartoon passes behind and in front of the person
