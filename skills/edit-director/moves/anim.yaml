id: anim.comic
family: anim
group: graphics
level: B
aliases: [comic book animation, manga-style animation, comic-style animation, manga style, graphic novel, manga look, motion comic]
what: animation in the language of comics and manga — stark black-and-white drawing with screentone shading, speed lines, a strobing background and panel inserts; turns the action into a drawn scene from a comic
frames: |
  1. Tone: B&W with no color — three levels (black 44–74 % of the area, one grey tone, white 6–22 %) plus a grainy
     stippled halftone screen in the midtones; or a color version — flat saturated fills (saturation 90–125)
     and a thick black outline.
  2. Timing: the character drawing holds for 2–3 frames (80–120 ms), but the grain screen is regenerated every frame
     (3–9 % of pixels change) — a still drawing "hisses". A 16-frame cycle (0.64 s) repeats for breathing
     or rain; camera moves and speed lines — on ones.
  3. Speed lines: a radial burst of white strokes around an empty center (the center is a face or a weapon), or
     horizontal streaks behind the character; the strokes are redrawn every 1–2 frames.
  4. Background strobe: the background alternates black ↔ white every 2 frames (80 ms) for 0.5–1 s, the figure
     stays grey and unchanged — tension before a hit.
  5. Panel insert in live video: 1–2 frames of a colored flash → a drawn panel with the character,
     an onomatopoeia and diagonal streaks (≈ 0.9 s, drawing on twos) → a sharp return to the live shot
     with motion blur.
  In the edit: episodes of 1–3 s, cuts on the beat, 1–2 black or white frames between panels.
variants:
  - B&W manga action — screentone, speed lines, background strobe, close-ups of eyes and hands
  - quiet manga — rain or breathing in a 0.64 s cycle, the drawing is still, only the screen hisses
  - color insert in live video — the subject "turns" into a drawing for ≈ 1 s with onomatopoeic on-screen text
  - color action — thick outline, two-tone shadows, lightning effects, dynamic camera
  - pop close-up — an eye or lips, flat background, thick brushstroke lashes, small sparkles
status: hybrid
fallback: generation (with consent) — for complex drawn poses and action scenes; code + mask cover the "manga" and "pop comic" filters, speed lines, strobe, on-screen text
