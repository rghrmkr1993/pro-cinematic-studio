id: anim.watercolor
family: anim
group: graphics
level: B
aliases: [watercolor animation, watercolor, ink and wash, ink wash, sumi-e, watercolor look, painted wash]
what: animation in transparent washes of watercolor or ink on white paper — soft patches, bleeds, lots of air; a light, dreamy, poetic mood
frames: |
  1. Paper: white or light, with lots of empty space — 55–87 % of the frame is clean paper in silhouette and graphic examples,
     4–19 % in saturated "full" pictures.
  2. Washes: transparent layers of paint, paper grain visible, patch edges ragged and "running"; the tone inside a patch is uneven,
     with bleeds; details are indicated by a few patches, there is no outline as such, or it is thin and hand-drawn.
  3. Palette: either monochrome (ink: saturation ≈ 0, 9–10 tones), or a single paint (ultramarine, red),
     or pastel multicolor (powdery pinks, lilacs, mints, saturation 2–60); a bright 190–230 fill —
     only in "club" scenes.
  4. Timing: every frame is a new drawing, 10–15 drawings/s (2–3 frames @25 fps); in a still pose
     7–31 % of pixels change — the patches "breathe", the edges creep; some works are on twos (every second frame is a repeat).
  5. Motion: dance, flight, running in silhouette; a drawn camera — a smooth push-in "through" a pattern (feathers → figure → face)
     over 2–3 s; patches metamorphosing into a new scene; sometimes the color "drains away" and the frame goes to white paper.
variants:
  - ink silhouette — a black or grey figure on white, tone only, no color
  - monochrome blue — the whole scene in one paint, the paper shows through
  - pastel story — delicate pink-lilac washes, a thin outline, push-ins through the drawing
  - watercolor over video — a live shot "flooded" with transparent paint, only parts of the scene move
  - print portrait — a dense square of paint with a ragged edge on white, a portrait inside, the frame trembles
  - saturated gestural — bright juicy strokes, a concert or a dance, on twos
status: code
fallback: a watercolor filter over video (color simplification, bleeds at the edges, paper grain, white background via a mask) — in code; ink silhouette — hybrid (person mask); real hand-drawn animation with metamorphoses — generation with consent
params:
  paper: white or warm 245–255, grain 5–10 %; empty paper 50–85 % of the frame for silhouette scenes
  wash: color simplification (mean-shift or k-means with 6–12 colors), layer opacity 0.6–0.85, multiply blending
  edge_darkening: optional ≈ 0.5–1 % H — a dark rim along the edge of a patch in pastel and color watercolor; with ink the edge is lighter instead (a diluted rim)
  bleed: bleeds of 1–3 % H, ragged edge with noise
  palette: ink (S ≈ 0) | one paint | pastel (S 20–60) | saturated (S 190–230)
  holds: 2–3 frames @25 fps per drawing (10–15/s) or twos
