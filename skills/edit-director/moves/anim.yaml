     hatching at 30–60° and cross-hatching; construction lines are visible in the drawing. Lines cover 4–15 % of the area
     (dense illustration — up to 23 %); tone is either almost absent (5–8 % midtones) or graphite smudging covers up to 47 %
     of the area.
  3. Timing: every drawing is new — 6–25 drawings per second (on ones, twos, fours); 10–22 % of pixels change
     between drawings. A still illustration "breathes" on twos: the composition matches by 97 %, the strokes are redrawn.
  4. Motion: rotoscoped live action (juggling, blinking, a head turn), a flipbook of different faces at 1–2 frames per
     face, a "living" illustration with a standing composition; the camera is only a drawn one.
