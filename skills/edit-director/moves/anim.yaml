id: anim.vector
family: anim
group: graphics
level: B
aliases: [vector animation, flat animation, flat design, flat-style motion graphics, shape animation, shape morphing, flat 2D]
what: flat vector animation — clean geometric shapes filled with 2–5 colors, hard edges, smooth tweens and shapes flowing into one another; an illustration insert, an explanation or a product stylization
frames: |
  1. Background — a solid fill of one color (purple, mustard yellow, light grey, coral,
     dark lilac, white, black) or a soft gradient; no texture, or a light grain or halftone on top.
  2. Shapes — flat fill without gradients, perfectly clean edges; the shadow is a flat patch of a second tone
     with an offset; no outline, or a thick black one (≈1–2 % of frame height). The palette repeats throughout the whole
     piece: a common scheme is coral + cream + black, or two contrasting colors on a dark background.
  3. Motion — tweened, every frame new: a shape smoothly flows into another (blob → hand → bird,
     circle → face), objects travel in a straight line with acceleration and deceleration, "pop out" with an overshoot ×1.05–1.15
     and settle back; a kaleidoscope rotation of identical elements; a spiral tunnel toward the camera.
  4. Camera — a 2D push-in or a slide across the plane, sometimes "2.5D": a road in perspective, a car driving toward the camera.
  5. Combining with live video: vector elements (a sticker outline around a real object, a white flourish
     line, flat patches) over the filmed shot.
variants:
  - limited palette: 3 colors (coral, cream, black), large shapes, hard flat shadows
  - silhouette morphing: black blobs on a grey or white background flow into a hand, birds, a fish
  - icon character: a simple figure or object (a car, a bicycle, a sushi roll, a fish) on a solid background
  - fashion illustration: a black line on white, one color accent (red lips), faces in close-up
  - gradient vector: shapes with smooth gradients and grain or halftone, juicy color transitions
  - sticker outline: a real product cut out, with a thick black outline and a colored backing plate around it
  - over video: vector flourishes, patches, smoke lines, flashes on a real shot
  - kaleidoscope and tunnel: repeating elements rotate around a circle, a spiral pulls into the center
status: generation
fallback: in code — motion graphics from primitives (circles, plates, lines, blobs) with tweens and overshoot over video; a "vector filter" on a live shot (smoothing + 3–6 color palette + simplified contours) is honest only on simple silhouettes and large shapes, no longer than 2–3 s; a sticker outline around an object — hybrid (remove_background mask + outline + plate); complex character vector animation — generation with the user's consent
params:
  palette: 2–5 colors per frame (typically 3), high saturation; repeat the palette across the whole piece
  fill: flat fill over 70–95 % of the area, no noise; gradient variant — 2-color gradients + grain 0.02–0.05
  outline: none or a thick black one at 1–2 % of frame height; for fashion illustration — a 0.3–0.6 % line + 1 color accent
  shadow: flat, offset 1–3 % of the frame, the background tone ×0.6–0.75 in brightness
  timing: on ones (every frame new) for tweens; shape morphing 0.3–1 s (8–25 frames @25 fps)
  ease: outBack with a 5–15 % overshoot for appearances; inOutCubic for movement; linear for kaleidoscope rotation
  camera: 2D push-in ×1.1–1.5 or a slide, no shake; 2.5D perspective — generated only
  sticker: outline 1.5–3 % of the short side, backing plate 4–8 % wider than the object
  duration: insert 1.5–5 s (38–125 frames @25 fps)
