  - face as a mask: close-up, grimaces and facial details change in jerks, the background behind the head is swapped
  - living things: objects, fabric, money, thread, trash move by themselves around a motionless subject or a hand
  - animator's hand: a hand in frame lays out material (thread, scraps) that "comes alive" between frames
  - background change behind the subject: the person stays in place while chalk drawings, wallpaper, places change behind them
