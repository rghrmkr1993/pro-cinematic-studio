id: anim.stop_motion
family: anim
group: graphics
level: C
aliases: [stop motion, frame-by-frame animation, object animation, puppet animation, frame-by-frame, things brought to life]
what: frame-by-frame shooting of real objects, puppets or people — everything is moved by hand between shots, and on playback things "move by themselves"; a handmade jerky rhythm on twos without motion blur
frames: |
  1. Camera: usually on a tripod — static (jitter 0.01–0.07 %); or a "frame-by-frame move" — the camera shifts
     in steps along with the objects. Background and light stay the same from frame to frame.
  2. Timing: snapshots on twos — each held for 2 frames (80–100 ms, 10–12.5 snapshots/s); in calm passages — on threes
     (120 ms); fast camera moves — on ones. Repeats within a hold are pixel-identical.
     A key pose holds fully for up to 1 s (24 identical frames).
  3. Object motion: jerky offsets of 1–5 % of the frame per snapshot, no motion blur (every snapshot is sharp), objects
     "breathe" slightly — the whole frame shifts 0.03–0.5 % of the width between snapshots; exposure wanders: in digital
     shooting 0.03–0.5 % of brightness (up to 1.2 %), with paper and film — up to 9 % from frame to frame.
  4. Honest materials: fabric, paper, plasticine, toys, food; small imperfections (fingerprints, specks of dust,
     uneven steps) are part of the aesthetic.
  5. The scene device: an object drives, crawls or assembles itself; clothing or props change on every snapshot while the person's
     pose stays still; the subject stands at one point in the frame while the world around changes every 0.1–0.35 s.
  In the edit: a 2–10 s clip; episodes start with a 0.5–1 s pose hold and end on a cut on the beat.
variants:
  - puppet scene — a puppet in a miniature set, camera on a tripod, on twos
  - object scene — a toy, food or things on a table move by themselves, phone camera at table level
  - still life — elements of the composition rotate, roll, appear one after another
  - frame-by-frame move — the camera steps along a surface, the props in frame change on every snapshot
  - clothing and prop change — a person in one pose, the clothing changes on every snapshot
  - location hopping — the subject or object at the same point in the frame (±5 % of the frame, size ±15 %), the background changes every 0.1–0.35 s, sometimes a letter of text is added each time
  - paper cutout — a photo or paper is taken apart piece by piece per snapshot, strong film-like brightness flashes
status: code
fallback: |
  footage — real stop motion (a photo series or frame-by-frame video) from the user's source footage;
  code — assembling a photo series at 8–12 snapshots/s aligned on the subject; a "stop-motion look" for live video via
  stepping on twos + jitter + flicker (works on a static camera and short shots, without sharp movements —
  motion blur gives the video away);
  generation (with consent) — puppet and object scenes "like stop motion".
params:
  frame_rate: on twos (12.5 snapshots/s @25 fps) — baseline; on threes (8.3/s) — a "handmade" unhurriedness; on ones — camera moves only
  pose_hold: a key pose held whole for 0.5–1 s
  jitter: whole-frame shift of 0.05–0.4 % of width per snapshot, random, non-accumulating; rotation ≤ 0.3°
  flicker: brightness ±0.2–1 % per snapshot (digital); ±3–9 % for old film and paper
  motion_blur: none — a short-exposure source or frames without blur; discard blurred frames
  step_size: object offset of 1–5 % of the frame per snapshot
  hop: location hopping — 2–4 frames @25 fps per location, the subject aligned by center/face (tolerance 5 % of the frame)
  duration: 2–10 s (50–250 frames @25 fps)
when: product videos (an object assembles, unboxes or drives "by itself"); recipes and food; DIY and crafts; intros and bumpers in a "handmade" style; music videos; UGC trends with outfit or location changes; explaining through objects on a table; at section changes — a short 1–2 s stop-motion cutaway
avoid: imitation on shots with heavy motion blur or a shaky camera — the stepping gives the video away; long uneventful episodes; uneven light between snapshots when assembling from photos (unless intended); an expensive glossy tone where smoothness is needed
sfx: on steps — small clicks, taps, rustles (foley by snapshot, not on every one but on the accented ones); outfit or location changes — a click or swoosh on every change; final pose — a pop or impact
genres: {product: signature, ugc: allowed, viral: allowed, fanedit: allowed, teaser: allowed, explainer: allowed, calm: allowed, fashion: allowed, travel: allowed, clips: allowed}
detect: |
  time: pairwise identical frames (< 0.4 % of pixels change) in runs of 2 (sometimes 3) at 24–25 fps; long
