id: anim.radial_loop
family: anim
group: graphics
level: B
aliases: [phenakistiscope, spinning disc animation, radial loop, spinning disc loop, circular animation, optical toy]
what: a short motion loop laid out around a disc — 10–16 phases of one pose cycle across the sectors; the disc turns by exactly one sector per frame and the figures "come alive" in place; a hypnotic retro loop
frames: |
  1. A disc in the center of the frame (center 0.5/0.5), taking up 80–100 % of the height; background black, grey or a solid color.
  2. Around the circle — N identical figures in successive phases of motion: 10–16 per ring (typically 12–14), often
     2–3 concentric rings with different loops (outer — large figures, inner — small ones), and in the center
     a spiral, a target or a black hole.
  3. Mechanics: per frame the disc turns by exactly 360/N (30° with 12 phases), so each figure in its own place
     changes pose — all N figures "walk", "wave", "dance" in sync, while the drawing itself barely rotates.
     A small offset from a whole sector (±0.5–1° per frame) — and the whole procession slowly moves around the circle.
  4. Loop: 10–16 frames (0.6–1.9 s at 6–20 frames/s), repeated 2–4 times without a seam.
  5. Presentation: a static disc; a pulsing disc — push-in ×1.2 and back every 4 frames in rhythm; a slow push-in
     to the center ×1.7 over 1.9 s; strobe — the disc is visible for 2 frames, then 2 frames of black (as if through slits).
variants:
  - graphic disc — drawn figures around a circle on black, a loop in place
  - photo collage on a real disc — cut-out photos on several rings, the disc slowly spins (≈ 1°/frame)
  - procession around the circle — the disc shifts slightly faster or slower than a sector, the figures walk around the circumference
  - abstract disc — dots and drops change size along a spiral, no figures
  - pulsing disc — push-ins and pull-backs ×1.2 to the rhythm of the track
  - strobe — the disc flashes through black frames, as if seen through slits
status: code
fallback: from any short movement of the subject (2–4 steps, a wave, a jump) in code — cut out the figure with a mask (hybrid), take 10–16 equal phases and lay them out around the circle; drawn and collage discs with fine graphics — generation of the disc's key frame with consent
params:
  phases: 10–16 per ring (typically 12); rings 1–3, inner ones at 0.5–0.7 of the outer one's scale
  radius: outer ring 0.35–0.45 H from the center; figure 12–20 % H, oriented along the radius "feet toward the center" or along the tangent
  rotation: 360/N per frame (12 phases — 30°/frame); a procession drift of ±0.5–1° per frame on top
  loop: N frames, 0.6–1.9 s (at 25 frames/s hold each phase for 1–2 frames, i.e. 12–25 phases/s)
  repeats: 2–4 loop repeats
  pulse: push-in ×1.15–1.25 and back over 4 frames, outCubic, on beats
  strobe: 2 frames disc / 2 frames black (≈ 80–100 ms) — optional
  background: '#000000 or a solid color, the disc lighter than the background or with a thin shadow'
