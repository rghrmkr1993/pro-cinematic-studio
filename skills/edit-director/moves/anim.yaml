id: anim.doodle_overlay
family: anim
group: graphics
level: B
aliases: [doodle animation, doodle overlay, doodle over video, bringing objects to life, eyes on objects, googly eyes, drawn faces, object personification]
what: simple drawn faces, eyes, eyebrows and little arms tracked onto an object in live video — the thing "comes alive" and reacts; a comedy device for short videos
frames: |
  1. Source: an ordinary everyday phone video — a plate, a rug, food, a vehicle, a bird; handheld camera
     (shake 0.06–3.5 %), the object takes up 30–80 % of the frame.
  2. Drawing: a thin black line of 0.4–0.9 % of frame height; eyes — white ovals with a black outline and a dot pupil,
     each 5–12 % of frame height; stroke eyebrows, a bracket mouth, thin little arms with hands; sometimes one flat
     color fill (beard, muscles, bangs) — 1–2 colors, no shadows.
  3. Tracking: the drawing is "stuck" to the surface — it follows the object's shift, scale and rotation on every frame
     (an object moving away shrinks the eyes ×0.57 over 2.7 s along with itself); the foreground (a foot, a fork, chopsticks)
     occludes the drawing — a matte is needed.
  4. Acting: starting pose — a calm face for 0.5–1 s; on an event (stepped on, poked, dropped) — an instant change of
     expression ("> <" eyes, round eyes, open mouth) and waving arms, drawing on twos or threes;
     blinks of 2–3 frames; sometimes a small text remark or a large pixel font.
  5. Climax — a reaction that coincides with the action in frame; ending — the face returns to rest or
     "falls asleep".
  In the edit: a 1.5–7 s clip in one shot, no cuts; a series of such clips becomes a recurring segment format.
variants:
  - face on a flat surface — a plate, a rug, a screen: planar track, the drawing in the surface's perspective
  - face on a 3D object — food, vegetables, vehicles: point track + scale, the drawing faces front
  - added body — little arms, muscles, a hairdo over a live animal or person
  - ensemble — 4–6 "characters" in frame at once, exchanging glances with each other
  - speech line — a short sound label in a pixel font is added to the face
status: hybrid
fallback: if the object spins fast or leaves the frame — manual keyframe tracking (every 3–5 frames) with interpolation; if the track breaks — punch in with a crop; no generation needed, the drawing is assembled from vector parts
params:
  line: black, 0.4–0.9 % of frame height, even, round ends
  eyes: white ovals 5–12 % of frame height, spacing 0.6–1.2 eye widths; pupil 20–30 % of the eye
  colors: white + black + 0–2 flat accents (yellow, pink, lilac)
  track: every frame; planar (homography) for flat surfaces, point + scale + rotation for 3D objects
  occlusion: foreground over the drawing (matte of a hand, foot, fork), 1–2 px feather
  expression_holds: an expression holds 0.3–1.5 s; the change is a jump in 1 frame; blinks 2–3 frames (80–120 ms)
  limbs: arms on twos or threes (2–3 frames @25 fps), 3–6 poses per gesture
  clip: 1.5–7 s (37–175 frames @25 fps), one shot
when: humor, UGC and viral short videos; bringing a product or food "to life" in explainer and product content; a reaction to an event in frame (stepped on, bitten, poked); a hook in the first 1–2 s — the face is already visible; a recurring segment made of a series of such clips
avoid: a serious, dramatic or luxury tone; objects without a clear surface (smoke, water with glints) — the track drifts; fast shake without stabilization — the drawing "comes unstuck"; thick colored outlines and shadows — they break the doodle's simplicity; more than 6 characters in frame
sfx: short cartoon sounds on expression changes — pop, boing, squeak; on a blink — click; when the object gets hit — impact and a comic yelp; a light ukulele bed
