id: anim.living_architecture
family: anim
group: aesthetics
level: C
aliases: [living architecture, living facade, animated building, breathing building, building animation, facade animation, animated architecture, architectural animation]
what: a still building, facade or street object starts moving like an animation — window modules travel in a loop, floors sway, a column shuffles its segments, a kiosk bends like rubber, a house grows and folds back; meanwhile the camera and sky stay still
frames: |
  1. The base is a still shot or a photo: the camera is static in 12 of 13 examples (jitter 0.00–0.04 % of the frame), the sky, street
     and background don't change; only the structure moves — 1–50 % of the frame area (median ≈14 %).
  2. The motion is "animated", at a reduced frame rate: median 14 fps (10–17 fps in 7 of 13, i.e. each image holds
     for 2–3 frames @25 fps); slow transformations — 2 fps (each image holds 0.5 s), every step is seen separately.
  3. The cycle is seamless: 1.2–4 s for fast devices, 10–12 s for slow ones; the first and last frames match
     (discrepancy 0.1–0.4 of the maximum deviation within the cycle).
  4. The character of the motion follows the building's structure: repeating modules (windows, arches, floors, segments) shift,
     swap places, grow or rotate; rigid objects bend like rubber.
variants:
  - module conveyor: a facade of identical windows or tower sections moves as an endless conveyor — ≈40 % of the frame per second, a full period in 12 frames; or facade strips move in different directions at 6–8 % per second
  - segment shuffle: a column or pillar is cut into horizontal rings that shift, swap places and return, 1.4 s
  - rubber bend: a street kiosk or vending machine bends and squashes, 1.9 s, 10 fps
  - floor sway: building blocks shift relative to each other as if dancing, 1.9 s
  - grow and fold: cantilevered floors are added one at a time, 2 → 8 floors and back, 2 fps, 10.5 s
  - faceted facade: the triangular facets of an angular building change shape and height, 2 fps, 12 s
  - ornament mechanism: the rings of a round stained-glass window rotate in different directions, colored bands appear, 3.4 s
  - texture growth: bark, moss or foliage spreads over a pillar and recedes, 1.3 s; a small local variant — the stones of an arch crawl along the curve
  - drawn line over a building: a colored stroke wriggles across the facade, handheld shot (borders on graphics)
status: hybrid
fallback: |
  requires a still shot of the building (or a frame stabilized to ≤0.1 %) and a mask of the structure against the sky;
  fast devices (conveyor, shuffle, sway, bend, ring rotation) are done in code via the mask; floor growth and
  texture growth require painting in the background and texture — generation (image-to-video from a frame) with the user's consent.
params:
  source: a static shot or photo, jitter ≤0.05 % of the frame; the building large, 30–90 % of the frame
  mask: building against the sky (sky segmentation or hf_remove_background), 1–2 px feather; background and sky stay still
  anim_fps: 12.5 (hold each image for 2 frames @25 fps) or 8.3 (hold 3); slow transformations — 2 fps (hold 12)
  loop: 1.2–4 s (30–100 frames) for fast devices, 8–12 s for slow ones; first frame = last frame
  scroll: period = module step by autocorrelation (window, floor, section); speed 6–40 % of the frame per second; exactly N periods per cycle
  shuffle: 4–8 horizontal rings; each shifts by up to ±1 ring height, neighbors lag by 2–3 frames
  sway: floor offset in x ±1–3 % of width, a wave from bottom to top, period 1–2 s
  bend: 5–15° bend around the base or vertical squash ×0.85–1.1, ease inOutSine
  rings: adjacent rings rotate in opposite directions, 30–90 °/s
  stack: +1 floor module per step at 2 fps, growing to ×3–4 the height and back
when: intros and establishing shots of a city ("the city is alive"), transitions between locations, travel and architecture videos, music videos — place the steps of slow transformations on beats (2 fps = a step on every beat at 120 BPM), background loops under text; 1–3 shots per video
avoid: a shot with camera movement without tracking; people and cars crossing the mask; the building small in frame; smooth 25 fps — the "animated" feel is lost; a loop with a jump at the seam; several different devices in one shot
sfx: stone grinding, mechanism clicks, a creak on the bend; for the conveyor — an even mechanical hum; floor-growth steps — dull thuds on the beat
genres: {travel: allowed, fanedit: allowed, teaser: allowed, viral: allowed, fashion: allowed, calm: allowed, explainer: allowed, product: allowed}
detect: |
  ed_motion: no global events, jitter ≤0.05 %, overlay-mask 0.45–0.53 (half the frame is still); animation frame
  rate 2–17 fps with a 25 fps source (identical durs of 60–500 ms); a noticeable frame difference only inside
  the building's outline; first and last frames nearly equal (loop). Module conveyor — phase correlation over the facade strips gives
  a constant shift while the sky gives zero; different strips have different or opposite shifts.
  Differences: time.cinemagraph — a natural element moves (water, hair) while the building stays still; datamosh/glitch — breaking up
  the frame with no geometric logic; dolly/zoom — the whole frame moves, sky included; scene.diorama — a scale model, not a real
  building.
engine: |
  mask(method='hf_remove_background', feather=1) on the building; new primitive
  facade_animate(mode='scroll'|'shuffle'|'sway'|'bend'|'rings'|'stack', mask, axis='x'|'y', period=auto,
  speed=0.4, bands=6, amp=0.02, pivot='base', loop=2.4) — cuts the mask into modules or strips and moves them by the mode's
  law, wrapping around by the period; then step_print(hold=2) and loop(mode='cycle').
  'stack' and texture growth — Higgsfield image-to-video from a frame with a prompt from gen_hint (with consent).
  Slow transformations: step_print(hold=12), steps on beats — beat_sync(event='step', grid='1/4').
gen_hint: locked-off static shot of a modern apartment building whose facade comes alive like an animation, rows of identical windows slide sideways as an endless conveyor and the floors sway in a gentle wave, sky and street stay perfectly still, seamless loop, choppy 12 fps stop-motion feel
