  mask(method='hf_remove_background' or a manual quad) on the mural; new primitives:
  plane_track(region=quad) → a homography for every frame (ORB/KLT on the wall);
  palette_cycle(colors=kmeans(mural, k=5), step=1, fps=10, loop=0.5) — cyclic color substitution along the stripes;
