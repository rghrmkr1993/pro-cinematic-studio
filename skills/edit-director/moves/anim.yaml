level: B
aliases: [scribbles, scribble, drawn lines over video, hand-drawn, scribble animation, scribble overlay, draw-on, scrawls]
what: quick hand-drawn lines, loops, strokes and text over live video or a photo — every frame is redrawn from scratch, so the drawing "boils" and trembles; energy, chaos, a handmade punk delivery
frames: |
  1. Base: an ordinary shot — usually static (6 of 7 examples have no camera movement), the subject centered;
     sometimes a B&W photo, a duotone or a dark scene so the lines read.
  2. Drawing: white or neon (green, turquoise) lines 1.5–2.5 % of frame height thick
     (neon with halation — up to 5 %); they cover 2–5 % of the frame (text — up to 18–29 %). What gets drawn:
     loops and "comets" around heads (≈10 strokes 12–19 % of height long), a trace of the subject's outline
     with offset repeats, hatching over the body, crosses and arrows, eyes and smiles over a face,
     a handwritten word or name (letter height 8–11 % of the frame, in the upper left third).
  3. Timing: the drawing is redrawn every frame ("on ones") — line overlap between adjacent frames is
     only 0.12–0.25 — or holds for 2–3 frames; in the neon variant the lines manage to shift by half
     within 0.1 s. The text alternates styles: a typeset font holds for 0.15–0.3 s, a handwritten version
     flashes for 2–4 frames.
  4. Appearance and exit: the lines get "drawn on" over 0.2–0.5 s from a lift in the music or from the first word and
     disappear on a cut; the whole device lasts 0.6–4 s.
