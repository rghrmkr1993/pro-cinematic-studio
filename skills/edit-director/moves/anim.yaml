id: anim.living_mural
family: anim
group: aesthetics
level: C
aliases: [living mural, animated mural, animated graffiti, street art animation, living wall painting]
what: a mural or graffiti painted on a wall comes alive in its own painted style — colors run along stripes, a character moves, a portrait changes faces, the painted world interacts with the real one; the wall, building and street stay real
frames: |
  1. The shot is static in 6 of 8 examples (jitter 0.00–0.02 % of the frame); the animation lives only inside the mural's outline —
     0–14 % of the frame for characters, ≈32 % for a color cycle; the wall texture (brick, joints, plaster) shows through the paint.
  2. Color cycle: the mural's 3–6 colors shift along the stripes — ≈60–68 % of the painted pixels change hue per frame
     (median shift 34–50°), 10 fps, a loop of 4–8 frames (0.4–0.8 s).
  3. Character: a ball head opens into three parts and closes, an upside-down figure slides along the facade — 25–33 fps,
     loops of 1.5–5 s, the first and last frames almost match (0.05–0.3 of the range).
  4. In 2 of 8 the camera moves: a fly-in to the mural (push-in ×7 over 1.74 s, ease-out), then the portrait on the facade changes faces
     every ≈0.1 s; or a pan following a ball — a painted footballer kicks, and the ball flies into a real goal.
variants:
  - color cycle of stripes and patterns: 3D letters or a background of skulls, colors run around in a cycle, a short loop of 0.4–0.8 s
  - soft shimmer: gradient waves on the corner of a building slowly ripple
  - character comes alive: opens, turns, slides along the wall, keeping its hatching and palette
  - face swap: a portrait mural quickly changes expressions and features, like flipping pages
  - graphic invasion: an interface window pops up on a brick wall, bends and gets sucked into a hole
  - mural and reality: the painted action is continued by a real object (a ball, water, light)
status: hybrid
fallback: |
  color cycle, shimmer and compositing onto the wall — in code (needs a mural mask and planar tracking if the camera moves);
  movement of the painted character — generation: image-to-video from a crop of the mural with the user's consent, then
  back onto the wall via tracking; if there is no mural in the source footage — generation of the whole shot.
params:
  region: the mural's quadrilateral (4 corners) + a mask of the painted areas; when the camera moves — a homography on the wall every frame
  palette_cycle: k-means of 3–6 mural colors; shift by one stripe per frame; 8–12 fps; loop = number of colors × step (0.4–0.8 s)
  flow: smooth shimmer — gradient phase shift of 0.2–0.5 period per second, 25 fps
  character: 12–25 fps (hold 1–2 frames @25 fps), loop 1.5–5 s, first frame = last frame
  face_swap: face change every 2–4 frames (≈0.1 s)
  texture_keep: wall texture over the animation — multiply or overlay by wall brightness, 30–60 %
  style_lock: animation palette = mural palette (posterize to k colors), outlines of the same thickness
  camera_move: fly-in ×3–7 over 1.5–2 s with ease-out, then a hold on the mural
when: travel and city videos, stories about street art, music videos, intros and background loops under text, event recaps and ads on murals; color cycle — on the kick or every beat; 1–2 shots per video
avoid: people and cars covering the mural; a small mural in frame; camera movement without texture to track; animation that breaks the painted style (a smooth 3D look); a bright color cycle faster than 3 flashes per second with strong brightness swings — a risk for photosensitive viewers
sfx: a spray-can hiss on appearance; clicks or claps on every color-cycle step, on the beat; for a character — cartoon foley; the ball kick and the net — real sounds
genres: {travel: allowed, fanedit: allowed, viral: allowed, teaser: allowed, product: allowed, fashion: allowed}
detect: |
  ed_motion: static (jitter ≤0.02 %), overlay-mask 0.4–0.53; frame difference only inside a flat quadrilateral on the
  wall; with a color cycle 60–68 % of the painted pixels change hue by 34–50° per frame while the brightness of the
  brick and joints stays the same; durs of 100 ms and a loop of 4–8 frames; for a character — line motion without blur and with the same hatching.
  Differences: projection mapping — a glowing projection on a building, light spill and halation, usually at night; anim.living_architecture —
