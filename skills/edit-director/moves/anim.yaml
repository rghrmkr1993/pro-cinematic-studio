id: anim.charcoal
family: anim
group: graphics
level: B
aliases: [charcoal animation, charcoal drawing, chalk animation, charcoal-drawn look, charcoal sketch]
what: monochrome charcoal or chalk animation — every frame is redrawn, the strokes "boil", tone is smudged, traces of erased phases stay visible; a heavy, intimate, anxious mood
frames: |
  1. Material: charcoal on light paper (dark smudged patches, white eraser highlights, paper grain) or
     white chalk/pastel on black or a dark board. Saturation ≈ 0; sometimes a paper or board tint
     (olive, warm: R ≈ G > B).
  2. Stroke: broad ragged strokes and hatching of 0.5–2 % of frame height, uneven edges; form is built from tonal patches
     and strokes, with no outline as such; a dark background is often packed with diagonal hatching at 30–60°.
  3. Timing: every frame is a new drawing, no repeats; 4–12.5 drawings/s (80–240 ms per drawing, 2–6 frames
     @25 fps). Even in a still pose each change alters 56–78 % of the drawn pixels, contours match
     by 71–87 %, the whole drawing "drifts" by 0.15–1.5 % of the width — this is the "boil".
  4. Motion: metamorphosis instead of a cut (branch → person → back, face → ball) in 1.5–4 s; drawn
     push-ins and turns in jerks ×1.05–2.5; half-erased traces of previous phases remain; adjacent drawings
     are sometimes overlaid as a double exposure.
  In the edit: a metamorphosis shot of 2–8 s; entry and exit — a 0.4–1 s dissolve or an "erase" into the paper.
variants:
  - charcoal on paper — smudged tone + eraser highlights, close-up portrait, facial expressions
  - chalk on black — ragged white gestural strokes on black or a dark board
  - hatched background — a dark rectangle of diagonal hatching with a light figure inside; the background boils
  - metamorphosis cycle — shape → figure → back, ping-pong 3–4 s
  - drawn fly-through — push-in and rotation across the drawing in jerks, polarity switches white ↔ black
status: code
fallback: generation (with consent) — when real hand drawing with metamorphoses and drawn camera moves is needed; code convincingly handles portraits and simple figures, less so complex scenes with fine details
params:
  polarity: dark on light (paper brightness 180–240) | light on dark (background 0–50, stroke 200–245)
  palette: saturation 0–10; optional paper tint — R ≈ G, B lower by 8–12 %
  stroke: 0.5–2 % of height (typically 1 %), ragged edge, direction follows the image gradient
  smudge: tone smudging with a radius of 1–3 % of height
  holds: on threes (3 frames @25 fps = 120 ms, ≈8 drawings/s) — baseline; 2 frames for facial expressions; 5–6 frames for a "diary-like" slowness
  boil: each new drawing has a new stroke texture; whole-drawing shift 0.2–1 % of width; contours match by 70–90 %
  palimpsest: trace of the previous drawing at 10–25 % opacity, fades over 2–4 drawings
  grain: paper grain 6–10 %, occasional vertical scan scratches
  duration: 2–8 s (50–200 frames @25 fps)
when: memory, dream, anxiety, a confession under voice-over, loss, the subject's "inner world"; the intro of a dramatic or documentary video; a live shot passing into a drawing on a change of topic; a music video for slow or ambient music; one insert per video or a whole episode
avoid: cheerful, product and sports videos — charcoal drags the mood down; cuts on every beat (a stroke can't be read faster than 0.5 s); complex wide shots without a mask — a mush of strokes; boiling on ones — flickers and tires the eye; random color accents
sfx: rustle of charcoal or chalk on paper on drawing changes (scratch, quiet), rustle of a sheet; ambient or drone; swell or reverse_whoosh on transitions; no hard hits
genres: {drama: signature, teaser: allowed, calm: allowed, fanedit: allowed, motivation: allowed, epic: allowed, fashion: allowed}
detect: |
  frame: saturation < 10 or an even paper tint; a two-humped histogram (paper + stroke); high fine texture,
  grain; few flat pixels within the drawing itself.
  time: every frame is unique even at rest — a change alters 16–72 % of pixels; in a still pose contours match
  at 0.7–0.9 while 56–78 % of the drawn pixels change; previews 4–12.5 drawings/s.
  ed_motion: noisy zoom/rotate events with nonrigid 0.6–1.4 and conf low, jitter 0.8–2.4 % without real
  camera motion; no holds.
  differences: pencil sketch — thin lines, almost no tonal patches; scribbles — colored chaotic loops;
  a charcoal filter on live video — photographic perspective and smooth motion on ones, no boil.
engine: |
  code: color(saturation=0) → sketch(kind='charcoal', polarity='dark_on_light'|'light_on_dark', stroke=0.01*H, smudge=0.02*H,
       hatch_angle=45, paper='rough') + step_print(hold=3) + line_boil(amp_px=0.005*W, every=3, reseed_texture=True)
       + palimpsest(opacity=0.2, decay=3) + grain(amount=0.08)
  hybrid: mask('mediapipe_person', feather=4) → replace the background with paper or a field of hatching, draw only the figure
  generation: stylize_gen(clip, style_ref=generate_image(<key frame>, prompt=gen_hint), strength=0.7) + step_print(hold=3)
  entry/exit: transition('dissolve', dur=0.6); sfx('scratch', gain=-12 dB) on drawing changes
gen_hint: hand-drawn charcoal animation of <subject>, smudged black charcoal on rough off-white paper, eraser highlights, faint traces of erased previous frames, boiling strokes, animated on threes, monochrome
commands: ["make the memory in #4 charcoal", "turn the ending into a chalk drawing on black", "charcoal metamorphosis of the face into a ball at 0:12", "shots 2–3 as a charcoal sketch on threes"]
related: [anim.pencil_sketch, anim.scribble, anim.line_art, anim.cel, time.step_print]
