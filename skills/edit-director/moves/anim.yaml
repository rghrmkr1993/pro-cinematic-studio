id: anim.rotoscope
family: anim
group: graphics
level: B
aliases: [rotoscope, rotoscoping, tracing over live video, live video to cartoon, painted footage, toon tracing]
what: live footage redrawn frame by frame — people move and act for real but look like a drawing (flat tones with outlines or thick paint); facial expressions and body movement are real, the texture is drawn
frames: |
  1. The base is ordinary narrative footage: close-ups and medium shots, natural facial expressions, a real camera (pan, push-in).
  2. Two main drawing styles:
     a) flat — the figure is filled with 2–4 tones per color (base + shadow + highlight), a thin dark outline (3–7 % of pixels are lines),
        30–55 % of pixels are flat; background — a painted backdrop, a gradient sky or the live footage simply left as is;
     b) painterly — the whole frame is repainted in oil or gouache strokes, 1100–1950 shades (on a 5-bit scale),
        flat pixels 3–4 %, a dark soft outline, faces keep a portrait likeness.
  3. Timing: painterly and full flat — every frame new (on ones, motion as smooth as in the footage);
     economical flat — a drawing holds for 4 frames (≈5 drawings/s), with a stop pose of ≈0.6 s before an action.
  4. Live effects are often layered over the drawing: particles, highlights, glow, smoke — they change every frame and aren't traced.
  5. The "neon" variant: only a glowing outline of the figure remains, over a flowing psychedelic background.
variants:
  - flat tone on a painted background: a figure in 2–4 tones with an outline, background — a drawn gradient or landscape
  - flat figure in a live world: only the subject is traced, the background and effects (particles, highlights) are footage
  - economical: drawings on fours, long stop poses, minimal motion — night, a quiet scene
  - painterly: the whole frame is oil painting over the footage, strokes "boil" frame to frame, close-up portraits
  - neon outline: only a glowing line of the figure on an animated background
status: hybrid
fallback: "code: flat variant — subject segmentation (mediapipe or hf_remove_background), smoothing and posterization into 3–4 tones per segment + XDoG outline; painterly — a brushstroke filter (kuwahara / oil) + edge darkening; full frame-by-frame redrawing that preserves likeness — video-to-video generation from a style frame, with consent"
params:
  style: flat (2–4 tones per color, outline) | painterly (strokes, no flat areas) | neon_line (outline only, with glow)
  flat_share: 0.3–0.55 flat pixels for flat, 0.03–0.2 for painterly
  line: 3–7 % of frame pixels are lines; thickness 0.3–0.6 % of height; color — a dark shade of the fill or black
  timing: on ones (painting, smooth action) or on fours (economical, ≈5 drawings/s)
  boil: painterly — strokes change every frame, without silhouette jitter
  keep_live: keep the background and effects (particles, highlights, smoke) live — via a mask
  duration: insert 2–6 s or a whole scene; transition from live video — a 0.3–0.5 s dissolve or a cut on the beat
when: an escape "into a memory or dream", a change of reality within the video, a music video and fan edit, stylizing an interview or a confession, anonymizing faces while keeping the emotions, historical and fairy-tale scenes (painterly), night-time quiet (economical flat); a musical accent — the entry into a verse or bridge
avoid: small fast movements with economical timing — it stutters; crowds and small faces — posterization "eats" the features; a filter without a mask on noisy night footage — a mush of blotches; flickering tones (segmentation changes frame to frame) — temporal palette stabilization is needed; a product or text that must be readable
sfx: a dedicated sound isn't required; on entering the drawn world — a swell or a reverse flash; keep the scene's live sound — the contrast with the drawing strengthens the effect
genres: {fanedit: signature, drama: allowed, teaser: allowed, fashion: allowed, motivation: allowed, calm: allowed, viral: allowed, clips: allowed, explainer: allowed, ugc: allowed}
detect: |
  Body movement and facial expressions are those of a live actor (real proportions, natural camera movement), but the image is drawn:
  either flat areas of 30–55 % with a dark outline on 3–7 % of pixels, or a thick brushstroke texture without grain or motion blur.
  Time: painting — every frame is unique, the texture "boils"; economical flat — holds of 4 frames.
  Live elements on top (particles, highlights) change every frame more than the drawing (difference 20 vs 36 at the center of the figure).
  ed_motion: events as in ordinary footage (pans, push-ins), no holds or holds of 4 frames.
  Difference from anim.cel: there, invented characters with cartoon motion and timing on twos or threes.
  From anim.line_art: there, only a line without fills. From painterly oil animation made from scratch: there is no trace of live footage there.
engine: |
  rotoscope(style='flat'|'painterly'|'neon_line', subject_mask='mediapipe_person'|'hf_remove_background'|None,
            tones=3, line='xdog', line_px=0.004*H, hold=1|4, keep_live_bg=True, palette_lock=True, t=[t0, t1])
  — flat: bilateral → mean-shift segments → k-means 3 tones per segment → XDoG outline; palette_lock — palette fixed for the whole shot;
  — painterly: kuwahara(radius=0.01W) + brush_texture + edge_darken; video-to-video generation from a style frame for likeness;
  — neon_line: XDoG on the subject mask → glow(threshold=0.5, radius=0.01W) over a different background;
