id: anim.ai_video
family: anim
group: graphics
level: C
aliases: [AI video, neural network video, AI-generated footage, neural morph, AI morph, generative insert, text-to-video, image-to-video]
what: an insert made entirely by a video generator — an impossible scene, a painterly style or a continuous flow of shapes with no cuts (a figure becomes a beast, a cave drawing becomes a fresco); the main tell is a world that "swims"
frames: |
  1. A shot of 1.5–8 s (38–200 frames @25 fps) without a single cut, even when the content changes completely over that time.
  2. The camera is synthetically smooth: an even push-in ×1.7–1.9 over 1.3–1.6 s, a slow sideways drift of 30 % of the frame over 3.4 s,
     a pull-out ×0.6 over 4.5 s — the curves are almost linear, jitter ≤0.6 % in 6 of 8 (a live handheld camera has more, and unevenly).
  3. Morphing: a shape changes its "identity" right in the frame — a human figure folds into a hulking predator in 1–1.5 s,
     then into a skull and skeleton; drawings on a cave wall become a carved relief in ≈2.5 s, and ≈2.5 s later a painted
     bas-relief of another era; buildings rebuild themselves while a beam of light sweeps across them.
  4. "Boiling" texture: fine details are redrawn every frame — fine-detail correlation between adjacent frames after
     camera alignment is 0.04–0.47 in 5 of 8 (live footage 0.66–0.97), non-rigid deformation covers 51–93 % of the frame.
  5. End of a link — the new form gets 0.5–1 s to "settle", followed by a cut or the next morph.
variants:
  - creature metamorphosis — a figure continuously rebuilds itself into another body, B&W or painterly, static camera (2 of 8)
  - morph through styles and eras — an image on a wall changes technique and period, the camera slowly pulls out (1 of 8)
  - impossible action scene — bursts of colored smoke, toy cars, objects appearing out of nowhere (1 of 8)
  - abstract macro flow — petals and a bubble flow and spin, push-in ×1.9 with a 33° rotation over 1.6 s (1 of 8)
  - cinematic fly-through — a realistic desert or a city at night, steady camera drift, no morphs (2 of 8)
  - near-static portrait — the face holds while the texture of the skin and background barely perceptibly "shimmers" (1 of 8)
status: generation
fallback: 'image-to-video from the user''s own frames (bring a photo or a freeze frame to life for 3–5 s) — with consent; a chain of morphs between the user''s key frames by generating the first and last frame of each link; without generation, code gives only a weak imitation — an optical morph between two frames (trans.morph) plus texture "boil" via noise displacement'
params:
  clip: 1.5–8 s per generated shot, usable trim 2–5 s (50–125 frames @25 fps); artifacts accumulate toward the end — take the first 3–5 s
  camera: one even move per link — push-in ×1.3–2 over 1.5–3 s, drift ≤1.2 % of the frame per frame, or pull-out ×0.6–0.8 over 3–5 s, linear; jitter ≤0.6 %
  morph_rate: one shape change per 1–2.5 s, 0.5–1 s for the new form to "settle"; 2–4 stages per shot
  boil: fine-detail correlation between adjacent frames 0.04–0.5 (live footage ≥0.65), deformation over 50–90 % of the frame
  resolution: often lower than the final render — upscale ×2 and add 2–4 % grain to cut it with live shots
  grade: match color and grain to the adjacent live shots; keep the style (painterly, B&W, neon) consistent across the whole series
  disclosure: an "AI-generated" label per the platform's rules
when: dream, memory, imagination, hallucination; "evolution" and history told through morphing eras; an impossible hook in the first 1–2 s (a surreal image stops the scroll); transitions between topics as a chain of morphs on downbeats; music-video visuals for electronic music; a product in an impossible world; explainers — visualizing abstractions that can't be filmed; B-roll when there is no shot (labeled)
avoid: documentary, news and travel contexts where generated material is passed off as real; faces of real people without their consent; close-up hands, text and logos in frame (artifacts); a single generated shot longer than 5–6 s; mixing with live shots without matching color, grain and sharpness; a style that changes from shot to shot without intent
sfx: synthetic pads and granular "shimmering" textures under the boiling texture, a riser on every morph with a whoosh at the peak of the shape change; place morph stages on bars (1 stage = 1–2 bars)
genres: {teaser: signature, fanedit: allowed, viral: allowed, epic: allowed, fashion: allowed, product: allowed, motivation: allowed, explainer: allowed, drama: allowed, calm: allowed}
detect: |
  ed_motion: no cuts, even though the shot's content is completely different by the end (histogram and shapes drift away smoothly); the camera is
  one even, almost linear move (near-linear zoom or drift), jitter ≤0.6 %. Custom "boil" check: align adjacent
  frames with a global similarity transform, compare fine-detail maps (LoG) — correlation ≤0.5 and residual deformation
  (Farneback >0.3 % of width) over ≥50 % of the frame is a strong hint (5 of 8; live footage 0.66–0.97 and 1–52 %). But a realistic
  generated fly-through or a near-static portrait looks like live footage by the numbers (0.68–0.93) — a VLM is needed: fingers
  merging, "mush" instead of text, objects changing shape, physics without a cause, overly smooth painterly light,
  a generator badge in the corner; provenance metadata (C2PA), if present.
  Differences: trans.morph — a morph between two separate images at a cut; trans.metamorphosis — a staged
  transformation of the subject while the background stays still; anim.cgi_3d — stable textures and true perspective; anim.rotoscope — drawn
  lines over live motion with held frames.
engine: |
  generate_shot(prompt, ref_image=None, duration=4, camera='push_in'|'drift'|'orbit'|'static', style) — new primitive
  (a video generator call, only with the user's consent) → upscale(×2) → color(match=adjacent shot) + grain(amount=0.03).
  Morph chain: morph_chain(keyframes=[img1, img2, img3], per_link=2.5, camera='slow_pull') — links generated from frame
  to frame, joins on downbeats + sfx('riser') per link and sfx('whoosh', at=shape-change peak).
  Weak code imitation: transition(kind='morph', dur=1.0) between two frames + boil(amount=2px, scale=12px, t) — new
  primitive: noise displacement of pixels, refreshed every 1–2 frames.
gen_hint: surreal AI-generated sequence, <subject> continuously morphing into <next form> and then into <final form> without any cuts, fluid shape-shifting, painterly cinematic lighting, slow steady camera push-in, dreamlike atmosphere, consistent style throughout
commands: ["generate a dream insert between #3 and #4", "morph through eras on the intro: cave drawings → relief → fresco", "bring this photo to life for 4 seconds", "find the generated shots in the video"]
related: [trans.morph, trans.metamorphosis, anim.cgi_3d, anim.rotoscope, look.dreamcore, look.psychedelic, zoom.infinite]
evidence: {examples: 8, sources: 8, measured: "no cuts in any of the 8, with the content changing completely in 4; camera — even push-in ×1.67–1.93 over 1.3–1.6 s, drift of 33 % of the frame over 3.4 s, pull-out ×0.6 over 4.5 s, jitter ≤0.6 % in 6 of 8; fine-detail correlation between adjacent frames 0.04–0.47 in 5 of 8 vs 0.66–0.97 in three live control clips, deformation 51–93 % of the frame vs 1–52 %; shape change in ≈1–2.5 s; shots 1.5–8 s", confidence: medium}
