id: anim.oil_paint
family: anim
group: graphics
level: B
aliases: [oil-painted animation, paint-on-glass, oil paint animation, living painting, painting come to life, painterly animation, oil-paint look, living canvas]
what: every frame is made of oil-paint brushstrokes — a living painting where the brush texture "boils" from frame to frame, or a filter turns video into a moving canvas; sensual, warm, arthouse
frames: |
  1. Material: thick brushstrokes of 2–5 % of frame height (H) with a visible brush direction, paint relief and highlights (impasto),
     colors mixed right in the stroke; background — dark (a portrait on black), a light canvas or a solid green of grass.
  2. Frame-by-frame painting: every frame is a new painting, no repeats; 10–14 paintings/s (70–100 ms, 2–3 frames @25 fps);
     even in a calm pose 27–49 % of pixels change per frame — strokes, hair and background are constantly "repainted".
  3. Motion: smooth live movement (a person turns their head, a bird flaps its wings, children roll on the grass)
     rendered in strokes; shapes deform, hands and faces sometimes turn into several smeared copies.
  4. Filter over video: live video looks painted in oil, the image is stable — only 3–4 % of pixels change
     between frames, a new "painting" on every second frame (≈ 10/s), finer strokes (0.5–1 % H).
  5. "Overpainting": the canvas is repainted before your eyes — new figures appear over old ones, layers of paint
     cover 15–48 % of the area per frame.
variants:
  - oil portrait on black — close-up, warm skin, bright strokes of hair, strong "boil"
  - impasto on a light canvas — nearly monochrome (saturation ≈ 10), a black bird or figure, paint relief
  - gestural scene — fast broad strokes, bodies moving across grass, every frame new at 30+ fps
  - abstract color swirl — motley thick strokes assemble into a shape and pulse
  - painterly filter over video — a stable painting on twos, fine strokes, the actors' real movement
  - repainted picture — a digital painting changes its subject in layers painted on top
status: code
fallback: a painterly filter over video (Kuwahara or an oil-paint filter + canvas texture + stepping on twos) — in code on any shot; real frame-by-frame painting with metamorphoses and impasto — generation with consent (stylizing key frames and transferring the style across the video)
params:
  brush: 2–5 % H for "painting" (typically 3 %), 0.5–1 % H for the video filter; stroke direction follows the gradient
  impasto: relief 0.3–0.6 (normal map from stroke brightness) and paint highlights
  palette: saturated (HSV-S 120–220) or muted monochrome (S ≈ 10–60); dark or light canvas
  holds: 2–3 frames @25 fps per painting (10–14/s); filter — twos (every 2nd frame new)
  boil: frame-by-frame texture change — reseeding the strokes changes 27–49 % of pixels per frame (painting) or 3–5 % (filter)
  smear: 2–3 copies of fast-moving parts at 0.3–0.6 opacity
  canvas: canvas texture 4–8 %, vignette 0–0.2
  duration: 2–8 s per shot (50–200 frames @25 fps); entry — a 0.5–1 s dissolve from a live shot
when: portrait and emotion, memory, a love story, an art music video and a fashion teaser, a "painting come to life" on the intro or outro; a live shot turning into a painting on a change of topic; one episode or insert, not the whole video in a row
avoid: fast cuts on every beat (a stroke can't be read faster than 0.5–1 s); fine details and text in frame (a mush of strokes); a product whose exact color and shape matter; boil on every frame for longer than 8–10 s — it tires the eye
sfx: brush rustle on canvas, soft ambient, strings or piano; on the "overpainting" — a swell
genres: {fashion: allowed, drama: allowed, calm: allowed, teaser: allowed, fanedit: allowed, motivation: allowed, epic: allowed, sport: forbidden, explainer: forbidden}
detect: |
  Frame: large directional strokes (structure tensor coherence 0.4–0.9), color mixing within a stroke,
