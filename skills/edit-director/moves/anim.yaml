id: anim.line_art
family: anim
group: graphics
level: B
aliases: [line art animation, line animation, outline animation, line graphics, one-line drawing, outline only]
what: animation in a single line without fills — a one-color outline on a solid background; from minimalist loops and portraits to line-drawn panoramas; a clean graphic "pen drawing"
frames: |
  1. Palette: a solid background (black, white or one saturated color), a line of one color (white, black or
     the brand color), no fills or 1–2 accents (red lips, black hair); line saturation 0–110.
  2. Line: constant thickness of 0.7–1.5 % of frame height (thickness variation along a stroke 16–35 %), round ends;
     lines cover 2–22 % of the area.
  3. Timing — three modes:
     a) vector — every frame is unique, shape morphing on ones, lines don't jitter;
     b) hand-drawn — a pose holds for 2–3 frames (60–90 ms), still parts stay pixel-identical;
     c) "boiling" — every drawing is redrawn by hand, ≈ 70 % of line pixels change, the outline drifts by ≈ 1 %
        of the width, 8–10 drawings/s.
  4. Camera: a long sideways pan across a line illustration (0.7–1.2 % of the frame per frame, no shake, on ones),
     an S-curve push-in ×1.8 over 1.3 s; the object often stays in the center while the background moves.
  5. Scene changes without a cut: one line flows into another figure, breaks up into drops and dots,
     "floods" the frame with white or is erased down to a couple of details (only the eyes remain).
  In the edit: a 1–4 s shot or a whole episode; a 1 s loop (12 drawings) on bumpers.
variants:
  - light line on black — portraits, face metamorphosis, the face is "erased" down to the eyes
  - brand color on white — a line panorama of a city or a route, an object moves in place, the background scrolls
  - line on a colored background — a minimalist loop of 12 drawings, motion reduced to 3–4 lines
  - boiling handwritten line — a thick uneven white outline redrawn every frame
  - line + accents — black hair and red lips, the rest is outline; the face grows, then breaks up into drops
  - outline filter over live video — lines follow the details of the footage, the angle and camera are live
status: code
fallback: generation (with consent) — for drawn characters, metamorphoses and line panoramas made to a brief; with code — an outline filter over footage, a line bumper from vector paths, erasing details via a face mask
params:
  palette: "background #000/#fff or one saturated color; a single line color (white, black or brand); accents ≤ 2"
  line: 0.7–1.5 % of height (typically 0.8 %), constant thickness, round ends
  coverage: lines cover 2–22 % of the area; cut detail down to 5–10 % for minimalism
  timing: vector — on ones; hand-drawn — on twos (2 frames @25 fps); boiling — 8–10 drawings/s with redrawing
