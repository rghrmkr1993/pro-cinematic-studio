id: anim.cel
family: anim
group: graphics
level: C
aliases: [cel animation, 2D animation, hand-drawn animation, traditional animation, cartoon style, classic 2D animation, cartoon look]
what: a stretch of the video in the manner of a hand-drawn cartoon — flat characters with clean outlines over a painted background, drawings change on twos or threes; an insert, a stylization or a meaningful "escape into a cartoon"
frames: |
  1. Layers. The background is painterly and static: gouache or watercolor brushstrokes, 30–300 colors, visible texture
     (flat pixels 0.1–0.3). Characters and objects are flat fills of "base + one shadow tone", no gradients,
     7–40 colors per frame, flat pixels 0.55–0.72.
  2. Outline. A clean thin line of 0.3–0.7 % of frame height (3–7 px at 1080p). Either near-black (brightness 10–30)
     or "colored" — the same hue as the fill, 2–3 times darker (brightness 60–130). There is also a style without outlines:
     silhouettes and patches of color.
  3. Timing. With a static camera a drawing holds for 2–3 frames (80–120 ms @25 fps, ≈11 drawings/s); frames within
     a hold are pixel-identical (< 0.4 % of pixels change). Before motion starts — a static hold of
     4+ frames (≈0.2 s). The camera (slide, push-in, tilt), smoke, light and digital effects change every frame.
  4. Camera. A slide or push-in across the flat drawing is rigid, with no parallax within a layer; or a multiplane
     move: the foreground (poles, a window frame) moves faster than the background.
  5. Scene changes often happen without a cut: metamorphosis — a figure flows into a spiral, particles or another shape in 1–2 s;
     a variant — the figure changes color on every drawing.
  In the edit: enter with a cut on the beat or a 0.3–0.5 s dissolve from a live shot; insert 1.5–6 s; exit with a cut
  or a reverse metamorphosis.
variants:
  - classic — painted background + a character with a colored outline and two-tone shading
  - graphic — 3–6 saturated flat colors, black outline, texture of dots and strokes, no shadows
  - painterly scene — the frame is almost static, clouds, water and light move (≈5 % of pixels per frame)
  - metamorphosis — a shape flows into a spiral or breaks up into particles, palette of 2–3 colors
  - ornamental cycle — one short cycle multiplied around a circle or across a grid, overall rotation
  - digital 2D — thin line, soft blush, glow and colored edges, on ones
  - monochrome with an accent — B&W drawing, only the lights or a single detail in color
status: generation
fallback: |
  footage — find animated fragments in the user's source footage (the tells are in detect);
  code — a "cartoon filter": smoothing + 8–12 color palette + outline + stepping on twos; honestly label it as a filter,
  keep it no longer than 3–4 s in a row;
  hybrid — the masked character gets a flat fill and an outline, the background is frozen into a single "drawing" and goes through
  a painterly filter — splitting into layers makes the imitation noticeably closer to real hand-drawn animation.
params:
  holds: on twos — baseline (2 frames @25 fps = 80 ms, 12.5 drawings/s); on threes (3 frames, 120 ms) — economical style; on ones — camera, fast actions, effects
  line: "0.3–0.7 % of frame height (typically 0.4 % ≈ 4 px at 1080p), constant thickness; color #141414 or the fill hue ×0.35–0.5 in brightness"
  fill: base + 1 shadow (shadow 25–40 % cooler and darker), no gradients or noise; 7–40 colors per frame (90 % of the area)
  background: static painted plate, 30–300 colors, soft brush texture; moves only as a whole layer
  palette: graphic style — saturation 150–190 of 255; painterly — 55–85; monochrome — < 15 with 1–2 color accents
  camera: slide/push-in across the layer on ones, linear or inOutCubic, no shake; 2–3 parallax planes
  static_hold: 4–8 frames of hold before a move or after a key pose
  duration: insert 1.5–6 s (37–150 frames @25 fps); code imitation — up to 3–4 s in a row
  temporal_stability: palette fixed for the whole shot; smooth the outline with a 3-frame median, otherwise it flickers
when: a meaningful escape into "another world" — memory, fantasy, dream, parody; intro or outro bumper; a change of worlds on the drop; a schematic character in an explanation; animated inserts in fan edits; if the style isn't the main one — 1–2 inserts per 30–60 s video
avoid: mixing a code filter and real hand-drawn animation in one scene; the filter on close-up faces (blotches on the skin, ragged outline); scenes with fine texture — foliage, crowds, water — the filter turns them into mush; stepping on twos with a fast camera — it stutters; a noisy source without denoising — the outline flickers every frame
sfx: entering the cartoon section — a short swell or reverse_whoosh; on key poses — a light click or a soft impact; metamorphosis — a swell over its full length; painterly scene — ambient with no hits
genres: {fanedit: signature, viral: allowed, teaser: allowed, explainer: allowed, calm: allowed, phonk: allowed, ugc: allowed, motivation: allowed, drama: allowed, clips: allowed, product: allowed}
detect: |
  frame: flat pixels (local std dev < 3) ≥ 0.5 on character frames (live video is usually < 0.2); 90 % of the area
  is covered by ≤ 40 colors (4-bit bins); a thin clean outline (black-hat > 40 covers 1–10 % of the area).
  time: at 24–25 fps, identical frame pairs (< 0.4 % of pixels change) come in runs of 2–3 frames; ed_motion
  flags holds only from 3 frames in a row, catch twos with a pairwise test. Previews below 20 fps
  don't show the holds.
  camera: ed_motion events with nonrigid ≤ 0.06 on a slide or push-in (flat drawing, measured 0.008–0.05) or
  stepped layer parallax (nonrigid 0.3–0.45 without perspective distortion).
  differences: 3D animation — every frame is unique, soft gradients, specular highlights and motion blur; rotoscope — realistic motion
  and perspective under the tracing; a cartoon filter on live video — the outline flickers every frame, no holds, noise and skin
  gradients remain in the fills.
engine: |
  generation (main path): style_ref = generate_image(<key frame>, prompt=gen_hint)
    → stylize_gen(clip, style_ref, strength=0.6–0.8, keep_motion=True) → step_print(hold=2)
  code: cartoonize(smooth='bilateral', passes=2, palette=8–12 (fixed per shot), edge_px=0.004*H, edge_color='darker_fill',
    shadow_tones=1, edge_temporal=3) + step_print(hold=2)
  hybrid: mask('mediapipe_person', feather=2) → character: cartoonize(...); background: freeze_plate(at=t0) + painterly(kind='gouache', radius=6)
  editing: transition('dissolve', dur=0.4) or cut on the beat; sfx('swell', at=t0)
gen_hint: hand-drawn 2D cel animation of <subject and action>, clean uniform ink outlines, flat colour fills with a single shadow tone, painted gouache background, animated on twos, static camera with a slow pan across the painted background
commands: ["make #3 look like a hand-drawn cartoon", "insert a cartoon cutaway on the drop", "turn the intro into flat 2D animation on twos", "metamorphosis of the subject into a spiral before the scene change"]
related: [anim.line_art, anim.comic, anim.cgi_3d, anim.live_mix, anim.rotoscope, anim.rubber_hose, trans.metamorphosis, time.step_print]
evidence: {examples: 21, sources: 20, measured: "drawing holds 60–120 ms (2–3 frames @24 fps) in a clean example with a static camera at a 33 fps preview; camera, smoke and effects change every frame in 4 of 4 clips with previews ≥ 25 fps; line 0.3–0.7 % of height; flat pixels 0.55–0.72 on character frames vs 0.1–0.3 on painterly ones; 7–40 colors vs 30–300; nonrigid of camera moves across the drawing 0.008–0.05; previews 6–50 fps, holds are readable only at ≥ 25 fps", confidence: medium}
