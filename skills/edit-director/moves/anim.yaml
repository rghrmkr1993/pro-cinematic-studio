  motion: objects move in jerks without blur (sharpness doesn't drop during motion); the background is still (jitter ≤ 0.07 %);
  overall frame shift between snapshots 0.03–0.5 %.
  light: exposure wanders between snapshots (0.03–1 %, up to 9 % for paper and film).
  differences: drawn animation — flat fills and outlines; 3D render — smooth materials, smooth motion on ones,
  motion blur; pixilation — real people move; timelapse — light and crowds change, not an object's pose.
