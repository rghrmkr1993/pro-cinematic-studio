avoid: energetic drops and fast cutting; dark night scenes (watercolor relies on light paper); small text and important product details; sharp digital edges on top (they break the transparency)
sfx: paper rustle, a drop of water, a brush clinking in a glass, soft piano or guitar, ambient; on the dissolve — a quiet swell
