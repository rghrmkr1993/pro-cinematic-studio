avoid: long stretches (longer than 4–6 s gets tiring); a figure with complex non-periodic motion (the loop "breaks"); fine details indistinguishable on a phone (figure < 10 % H); an inexact rotation match — the disc starts to "drift" chaotically
sfx: projector clatter or a disc ratchet in time with the frames, a music box, vintage noise; on the pulse — a kick
