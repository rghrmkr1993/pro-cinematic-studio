id: anim.color_pencil
family: anim
group: graphics
level: B
aliases: [colored pencil animation, crayon animation, wax crayons, marker drawing, child's drawing, sketchbook]
what: animation in colored pencil, wax crayon or marker — strokes and paper grain are visible, outlines "boil", drawings change on twos or threes; warm, handmade, "straight from a sketchbook"
frames: |
  1. Base: white or cream paper (background brightness 220–252, saturation < 30), white specks of grain show through
     the fills — the crayon doesn't clog the paper (up to 20 % light pixels inside colored areas).
  2. Stroke: visible hatching following the form or at 30–60°, a colored outline of 0.5–0.7 % of frame height, darker
     than the fill of the same hue; textured pixels 0.4–0.7 of the area; uneven color with gaps.
  3. Timing: a new drawing every 80–100 ms (on twos or threes @25 fps, 10–12.5 drawings/s); at a 20 fps
     preview — pairs of identical frames of 100 ms each. A still picture never stands still: it is redrawn
     2–3 times in a cycle ("boil"): ≈ 42 % of the strokes change, the paper stays still (< 0.3 %), contours
     match by 76–93 %, the drawing shifts ≤ 0.13 % of the width.
  4. Color as an event: the fill changes hue on every drawing while the outline stays the same (warm ↔ cool),
     or the whole palette "cycles" around; the line stays.
  5. The scene builds up "before your eyes": strokes get drawn in, a figure emerges from scribbles and goes back into them.
  In the edit: shot 1.5–5 s; entry — a reveal by strokes or a cut on the beat; exit — a dissolve into the paper.
variants:
  - wax crayon "child's drawing" — rough hatching, bright primary colors, boil cycling through 3 drawings
  - colored pencil + watercolor fill — thin graphite line, the fill color changes every drawing
  - marker doodle collage — a new composition of small characters every 100 ms, 3–4 colors
  - limited palette — 3–4 flat colors (red, yellow, blue + white), blue line, a "printed" style
  - psychedelic color cycling — outline drawing, the palette and background change every frame
  - animated illustration — a detailed drawing stays still, one small figure moves, 3–5 drawings/s
status: code
fallback: generation (with consent) — when drawn characters with action and metamorphoses are needed; code does a good "pencil/crayon" filter on simple shots, boil and color cycling
params:
  paper: white or cream (RGB ≈ 255/251/232), grain 6–10 %, no vignette
  line: colored outline 0.5–0.7 % of height, the fill hue ×0.5–0.6 in brightness, uneven edge
  fill: hatching at 30–60° or following the form, coverage 60–85 % (paper shows through the crayon), 5–12 colors
  holds: on twos or threes (2–3 frames @25 fps, 80–120 ms); animated illustration — 5–8 frames
  boil: a cycle of 2–3 redraws, stroke offset 1–2 px at 1080p, contours match by 75–90 %
  color_cycle: fill hue change every 1–2 drawings (optional)
  build_up: drawing-in over 0.5–1.5 s on entering the shot
  duration: 1.5–5 s (37–125 frames @25 fps)
when: childhood, memories, dreams, family; a "personal diary" and a travel sketchbook; intros, section bumpers and outros; a background under a headline (the boil brings a static frame to life); music and lyric videos; a kids' or DIY product; 1–3 inserts or a full stylization of a short video
avoid: a premium or formal tone; editing shorter than 0.3 s per shot — the stroke has no time to read; boil under small text — it trembles and gets in the way of reading; the filter on complex wide shots (crowds, foliage) — mush; mixing with smooth 3D graphics in the same frame
sfx: rustle of pencil or crayon during drawing-in (quiet, scratch), a marker click on appearance; light clicks on drawing changes during pauses; ambient, ukulele, a glockenspiel bed
