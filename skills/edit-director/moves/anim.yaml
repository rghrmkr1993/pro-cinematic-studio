  levels: 3 brightness levels (0 / 90–110 / 255) + a stochastic halftone screen in the midtones, refreshed every frame
  line: XDoG outline 0.4–0.8 % of height, black; 0.8–1.2 % in the color version
  color_mode: B&W (saturation 0) | pop — 4–8 flat colors with saturation 90–125
  holds: character on twos or threes (80–120 ms), screen and speed lines — every frame
