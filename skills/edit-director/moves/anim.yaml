id: anim.pixilation
family: anim
group: graphics
level: C
aliases: [pixilation, frame-by-frame shooting of people, live-action stop motion, people as puppets, human puppet, stop motion with people, gliding without steps]
what: real people shot frame by frame like stop-motion puppets — the body jumps from pose to pose, the subject glides down the street without taking steps, things around crawl and fly on their own, the face changes grimaces in jerks
frames: |
  1. The shoot is a series of photos: the camera is fixed (often straight overhead or head-on, sometimes fisheye), the person
     changes pose or moves a step between frames. On screen — 8–12 different images per second
     (each held for 2–3 frames @25 fps), jerky motion, no motion blur on the subject.
  2. Signs of the "impossible": a person glides across the floor or street while standing, without moving their feet; someone lying on a bed
     rolls through dozens of poses, the blanket creeps over by itself, clothes "breathe" and lie down alongside as an empty suit;
     banknotes, papers, a scarf, a thread, plastic scraps crawl by themselves and arrange into pictures; the bedsheet changes color.
  3. Background and light "breathe" slightly between frames: brightness jumps by 2–6 %, shadows jump — these are separate photos.
     Passers-by around the subject are often smeared into streaks or appear and disappear (a long exposure for each frame),
     while the subject stays sharp.
  4. Face close-up: the head stays in place while the expression, makeup, hairstyle or the background behind the head (sky, marbled
     paper, chalk on a board, fruit arranged into a face) change every 2–3 frames.
  5. Episode length 2–10 s; a whole video can be made in this technique.
variants:
