id: scene.diorama
family: scene
group: aesthetics
level: B
aliases: [diorama, scale model, model shot, miniature model, dollhouse, toy world, miniature set]
what: a real scale model — a model of a building, a cutaway dollhouse, toy soldiers, toy cars, a figurine in a music box — filmed either as the real world or openly as a model; gives a fairy-tale feel, a "handmade" quality and ironic distance
frames: |
  1. The camera moves slowly and evenly, as on motion control: a push-in ×1.33 over 2.5 s, a pull-out ×0.79 over 2.3 s or ×0.30
     over 5.6 s, a downward tilt of ≈2.5 % of the frame per frame for 6 s; the curves are almost linear, no shake (≤0.2 %).
     The other shots are static (4 of 8). Shot length 2.4–9.4 s — the viewer is given time to examine the details.
  2. The details are sharp; in macro shots of toys the background is heavily blurred, in "architectural" models everything is sharp.
  3. Effects in scale: small explosions and fire, LED flashers (dark frames every 4 — strobing),
     smoke; the figures are motionless, turned by a mechanism or animated frame by frame.
  4. Reveal: a long pull-out shows the cutaway of a dollhouse with its floors and rooms; or a cut "real mansion
     from above → its model from the same angle" (≈1 s of reality → ≈2 s of the model → reality again); or the shell of a model
     airplane dissolves, revealing the inside.
variants:
  - toy war: toy soldiers with weapons among small explosions, a slow pull-out with parallax
  - toy car as a real one: macro right at the "road", night, red and blue flashers
  - model landscape: a building on a cliff, a pastel pink-lilac palette, a static wide shot
  - cutaway dollhouse: a pull-out ×0.3 over 5.6 s reveals a multi-story cross-section
  - a cut reality ↔ model with the same angle and framing
  - music box and display case: a rotating figurine in an open box, a slow push-in
  - puppet film set: a pan down from the night sky onto a stage with puppets
  - model cutaway: the shell melts away, showing the internal structure
status: footage
fallback: |
  no model in the source footage — generation of a model world with the user's consent; imitation in code from ordinary footage
  shot from above — via focus.tilt_shift (blur bands, saturation, speed-up); a cut reality ↔ model is possible
  only if both shots exist with the same angle.
params:
  camera_motion: slow and linear — ≈×1.005–1.012 scale or 0.5–2.5 % of the frame per frame @25 fps; shake ≤0.2 % of the frame
  shot_length: 2.5–9.5 s (60–240 frames); shorter than 2 s and the model doesn't have time to register
  dof: toys in macro — background blurred; architectural models — everything sharp
  palette: toy-like saturation (median 135–159 of 255) or pastel with a pink-lilac shift (R>B>G)
  reveal_pullback: ×0.3–0.8 over 2.3–5.6 s, linear or inOutSine, centered on the middle of the model
  match_cut: the same angle, framing and center; reality ≈1 s → model ≈2 s → reality
  scale_fx: slow down fire, smoke and water in a model by ≈×2–4 (by the rule "slowdown ≈ square root of the scale", for 1/16 — ×4)
when: intro and outro in a "fairy tale" spirit, introducing a place (a model of a building or a city), an ironic transition reality → model ("everything is under control", "a toy world"), explainer videos (a cutaway, how something works), a product in miniature, nostalgic themes; 1–2 shots per video
avoid: fast and jerky camera movements — they give away the scale and break the "model" feel; seams and rough texture in a close-up if the model is passed off as reality; fire and water in a model at normal speed — they look small; fast cutting at 0.5 s per shot
sfx: a music box mechanism, clicks and ticking for an openly shown model; muted real ambience if the model is passed off as the world; for toy war — real explosions pitched down
genres: {calm: allowed, explainer: allowed, teaser: allowed, fanedit: allowed, product: allowed, travel: allowed, drama: allowed}
detect: |
  ed_motion: long (≥2 s) ZOOM-IN/OUT or SHIFT with an almost linear curve and a small step (≤×1.012 or ≤2.5 % per frame)
  with jitter ≤0.2 %; or static; cuts between shots with the same geometry but a different texture and color
  (reality ↔ model); toys with LEDs show regular black frames (strobe).
  Visually: surfaces that are too clean and simplified, a coarse "grain" of the materials, toy grass, frozen poses
  of the figures, tiny practical lights; shallow depth of field on "large" objects (cars, buildings).
  Differences: focus.tilt_shift — a real scene with blur bands, live cars and people sped up; scene.tiny_people —
  a live person in a world of objects; stop-motion animation — the figures move in jerks with holds of 2–3 frames.
engine: |
  From the source: keep the speed at 1.0; if the shot is static — transform(scale=[1, 1.12], t=[0, 3], ease='linear').
  Reveal pull-out from 4K: transform(scale=[2.5, 1], center=[0.5, 0.55], t=[0, 5], ease='inOutSine').
  Cut reality ↔ model: match(on='shape') — cut(real, 1.0 s) → cut(model, 2.0 s) → cut(real).
  Effects in the model: speed(rate=0.3, interp='flow') on fire, smoke and water.
  Without a model: the focus.tilt_shift recipe + color(params={saturation: +35 %}) + speed(rate=2).
gen_hint: handcrafted miniature diorama of <a seaside town>, tiny detailed model buildings and figurines, pastel colors, soft studio light, slow smooth motion-control camera push-in, shallow depth of field, cinematic model photography
commands: ["cut: the real house from above → its model from the same angle", "a slow pull-out that reveals it is all a dollhouse", "an intro in the style of a toy diorama", "generate a model of our office for the start of the video"]
related: [focus.tilt_shift, scene.tiny_people, scene.forced_perspective, cut.match, anim.stop_motion, time.slow_motion]
evidence: {examples: 8, sources: 8, measured: "camera movement: push-in ×1.33 over 2.5 s, pull-outs ×0.79 over 2.3 s and ×0.30 over 5.6 s, tilt of 228 % of the frame over 6.3 s (peak 2.5 %/frame); static in 4 of 8 (jitter 0.01–0.06 %); reality↔model cut 0.96 s / 2.04 s; shots 2.4–9.4 s; saturation of the toy shots 135–159; flasher strobe — a dark frame every 4; the slowdown rule for fire is common practice, not a measurement", confidence: medium}
