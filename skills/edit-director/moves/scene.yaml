id: scene.levitation
family: scene
group: aesthetics
level: B
aliases: [levitation, hovering, hanging in mid-air, hover, weightlessness, zero gravity, floating, floating person]
what: a person or an object hangs or slowly drifts in the air without visible support — feet a few centimeters above the floor, a body above a bed or a crowd, an object under a streetlight; magic, a dream, superpowers, weightlessness
frames: |
  1. The support is removed from the frame: a gap under the feet or body of 2–15 % of the frame height in a close-up, or a figure high in the sky
     above a crowd (≈5–8 % of the frame height); the camera is static (jitter 0.02–0.2 % in 8 of 16) or drifts slowly.
  2. The hovering is "alive": a soft vertical bob of 1–2 % of the frame height with a period of ≈2 s (0.45–0.55 Hz), no jerks;
     in weightlessness — a slow rotation of the whole body at ≈20 °/s (127° over 6 s).
  3. Ascent and descent are always smooth: a figure descends over a crowd with deceleration (≈28 % of the frame/s at the start, ≈7 %/s near the ground,
     ease-out), an ascent above the audience in slow motion with slight motion blur on the limbs.
  4. Signs of "floating": hair, fabric and arms hang freely or stretch upward; people below look up; under the figure
     there is emptiness or a soft shadow. Shot 1–6 s.
variants:
  - hovering above a surface: shoes a couple of centimeters above the stage, a body above a bed, a flying carpet against clouds
  - floating object: a thing hangs in the air under a streetlight, swaying slightly, with smoke around it
  - figure in the sky above a crowd: a tiny person high in the sky, the crowd looks up, then a cut to a view from above
  - slow descent or ascent: figures descend to the ground with deceleration; a person rises above a hall in slow motion
  - weightlessness: a body tumbles in a black void or in space, ≈20 °/s
  - flipped frame: a person filmed lying down or hanging, the frame rotated — hair and fabric "flow" upward, the background is treetops
  - flying vehicle: a car hangs and moves off over hills
  - only the head floats: the body is invisible, the head hangs by a wall
status: hybrid
fallback: |
  in code: (a) cut out the person or object with a mask + a clean plate from the same shot → raise the layer by 3–15 % of the frame,
  bobbing and a soft shadow; (b) a jump with a hang — slow motion at the top point; (c) rotating the frame by 180° for footage shot
  lying down or upside down; search the source footage — jumps, swings, trampolines, footage of someone lying on the grass shot from above; generation — via
  gen_hint with the user's consent.
params:
  lift: raise the layer by 3–15 % of the frame height (close-up) or a figure of 5–10 % of the frame high in the sky; gaining height over 0.8–1.5 s, ease inOutSine
  hover: vertical sine of 1–2 % of the frame, 0.4–0.6 Hz, plus a tilt of ±1–2° phase-shifted by a quarter period
  spin: weightlessness — rotation 10–25 °/s without stops; drift 1–3 % of the frame/s
  descent: descent with deceleration 25–30 % of the frame/s → 5–8 %/s, ease outCubic, 2–2.5 s
  jump_hang: a jump — slow motion 0.1–0.2× at the top point for 0.6–1.2 s, in and out over 0.25–0.35 s (speed ramp)
  shadow: an elliptical shadow under the object 0.8–1.2 times the width of the support, blur and transparency grow with height (opacity 0.5 → 0.15)
  clean_plate: a median background from frames without the person, or outpaint; mask feathered by 2–4 px
  flip: 180° rotation for footage shot from above lying down or upside down
  shot_length: 1–6 s (25–150 frames); a static camera or a very slow push-in ≤×1.1
when: a magical or "dreamy" moment, the climax of the chorus and the drop (rising on the build-up, hovering on the downbeat), the cover and the key shot of a music video, fashion videos and teasers, "weightlessness" in epic and motivational videos; 1–2 times per video
avoid: the support, a cable or the edge of a mat is visible; sharp jerks and shake — they break the weightlessness; the light and the shadow under the object don't match; clothes and hair behave as on the ground during a long "flight"; fast cutting — the floating should last ≥1 s
sfx: a low ambient pad or a quiet choir on the rise, a reverse cymbal or a swell on the takeoff, silence and air during the hover, a soft hit on landing
genres: {fashion: signature, epic: allowed, drama: allowed, teaser: allowed, fanedit: allowed, motivation: allowed, viral: allowed, calm: allowed, product: allowed}
detect: |
  ed_motion: a static camera or a slow tilt; the object shows a slow vertical movement of 1–2 % of the frame with a period of
  ≈2 s or a smooth descent with ease-out and no signs of falling (no downward acceleration); in weightlessness — ROTATE ≈20 °/s without
  stops; often overlay-mask 0.3–0.5 (a large still part of the frame).
  Visually: a gap between the body and the support, freely hanging hair and clothes, people looking up, a soft or
  absent shadow under the object.
  Differences: scene.falling — downward acceleration, wind in the clothes; scene.flying — fast directed movement;
  time.freeze — the whole frame freezes, not just the object.
engine: |
  Layer: mask(method='hf_remove_background', feather=3) + clean_plate (median of frames or outpaint) →
  new primitive hover(layer, lift=0.06, rise=1.0, amp=0.015, freq=0.5, tilt=1.5, shadow=contact_shadow(fade=True))
  — raises the layer over rise seconds and bobs it around the new height.
  Jump: speed(curve=[[apex-0.3, 1], [apex, 0.15], [apex+0.9, 0.15], [apex+1.2, 1]], interp='flow').
  Flipped: transform(rotate=[180, 180]) for the whole clip. Weightlessness: transform(layer, rotate=[0, 120], t=[0, 6]).
  sfx('swell', at=rise_start) + sfx('impact', at=landing, gain=-6).
