id: scene.tiny_people
family: scene
group: aesthetics
level: C
aliases: [tiny people, miniaturized person, tiny human, thumb-sized person, shrunk person, mini copy, tiny world]
what: a finger-sized person lives in the ordinary world — dances on a carpet, stands on fingertips, dangles as a keychain, climbs over a laptop, drags a giant bag; everyday objects turn into a landscape
frames: |
  1. The camera is at the tiny subject's eye level — a few centimeters above the surface: the texture underfoot (carpet pile,
     tiles, the skin of a palm, crumbs) is huge and sharp, the background in macro blur — background sharpness ≈0.2–0.33 of the
     foreground (measured on two shots with a dancer).
  2. The subject takes up 8–40 % of the frame height; next to them is an ordinary object — a palm, a laptop, a bag, feet in shoes, a podium —
     against which a scale of ≈1:10–1:20 reads (the subject is 8–20 cm). The camera is static in 7 of 14 examples.
  3. The action is ordinary for a person — dancing, climbing, performing, bathing — the mismatch of scale creates humor
     or poetry. Shot 1.5–5 s.
  4. Scale reveal: a cut from a "normal-looking" shot (a person in front of an audience) to a wide shot where they stand on a podium
     the size of a palm (shots 3.2 / 4.4 / 3.6 s); or a pull-out ×0.1–0.3 over 1.5–2 s from a giant object to the tiny
     person beneath it, sometimes through 2–3 white frames.
  5. The moment of shrinking (variant): a beam and a glow, a push-in ×2.6 over 0.4 s with radial blur, the subject "collapses".
variants:
  - macro dance: a tiny dancer on a carpet among a huge book and discarded clothes, the camera right at the floor
  - on the palm: a figure on the fingertips of a huge hand, a black-and-white image, a dark background
  - everyday life as landscape: a tiny person climbs down the edge of a laptop, bathes in milk in the hollow of a cookie, dangles as a keychain in front of two people
  - fashion and product: a tiny model walks between huge feet in shoes, carries a giant bag over her head; people examine a bottle the size of a bus in the mountains
  - mini copies: two people and their half-size copies dance side by side on a plain background
  - figurine person: a jointed "toy" body hanging on wires in colored light — borders on fx.bobblehead
  - shrinking event: a beam, an electric glow, a push-in with motion blur — the entry into the "tiny world"
status: hybrid
fallback: |
  look for the background plate in the source footage (macro or close-up shots of a table, a palm, a keyboard, a carpet, filmed from a low point);
  cut out the subject with a mask and scale it down; if there is no suitable shot or complex interaction with an object is needed — generation from
  a photo of the subject with the user's consent.
params:
  subject_height: 8–40 % of the frame height; scale relative to reality ×0.05–0.12 (the subject 8–20 cm); mini copies ×0.5
  camera: at the subject's eye level, ≈2–10 cm above the surface; static or a slow pull-out
  dof: the far plane blurred — sharpness ≈0.2–0.35 of the foreground (measured), on the "revealing" wide shot everything is sharp
  contact: a soft shadow under the feet with opacity 0.4–0.6, a reflection on gloss; the subject must not "hover" above the surface
  reveal_cut: a "tiny world" shot of 3–4 s → a wide shot of 3–4 s (75–100 frames each)
  reveal_pullback: ×0.1–0.3 over 1.5–2 s (measured ×0.27 over 2 s and ×0.094 over 1.56 s), ease-out, optionally 2–3 white frames in the middle
  shrink_event: the subject's scale 1→0.1 over 0.4–0.8 s (10–20 frames), a glow and radial blur, a flash at the end
  light: the direction of light on the subject as on the plate; warm light strengthens the "doll-like" feel
when: a surprise intro and a reveal on the drop, cute and funny moments, a giant product with tiny people, fashion videos, explainer videos ("let's look inside"); 1–3 shots per video
avoid: a sharp background with the camera at the surface — the scale doesn't read; shooting from above at an adult's eye height — the subject looks like a sticker; shadows and light don't match; the subject not in contact with the surface; long static shots without action
sfx: thin "clicking" footsteps and ringing touches; on shrinking — an electric hum and a whoosh with a falling pitch; on the reveal — a swell and a short "plink"
genres: {product: signature, fashion: allowed, viral: allowed, fanedit: allowed, explainer: allowed, teaser: allowed, ugc: allowed, calm: allowed}
detect: |
  ed_motion: a static camera (jitter ≤0.08 % in 7 of 14) or a long ZOOM-OUT ×0.1–0.3 over 1.5–2 s with ease-out
  (the reveal), sometimes white frames in the middle; the shrinking event — ZOOM-IN ×2+ over ≤0.5 s with sharpness dropping to ×0.1 and
  cuts.
  Visually: a human figure 8–40 % of the frame height stands ON an everyday object or next to an object bigger than itself (a palm,
  a laptop, a bag, shoes); the surface texture is magnified; the background in macro blur; the camera right at the surface.
  Differences: scene.forced_perspective — the "small" person is simply far away, focus across the whole depth, there is a contact gag;
  scene.diorama — the whole world is a model, the figures are toys; focus.tilt_shift — an ordinary scene looks like a model because of the bands
  of blur at the top and bottom; fx.bobblehead — only the body is shrunk.
engine: |
  scale_composite(subject=mask('hf_remove_background'), plate=macro shot, scale=0.08, anchor=surface point,
  shadow=contact_shadow(opacity=0.5, blur=6), color_match=True) + a new primitive depth_blur(focus=subject, amount=0.03)
  — blurs the plate by a depth map if it was shot sharp.
  Reveal: transform(scale=[1, 0.25], center=subject, t=[t0, t0+1.8], ease='outCubic') over a composite assembled at
  high resolution; or cut(close-up "tiny world") → cut(wide).
  Shrinking: transform(layer=person, scale=[1, 0.1], center=track(feet), t=[t, t+0.6], ease='inCubic') over a clean
  background (outpaint) + glow(threshold=0.7, radius=25) + blur(kind='zoom') + flash(dur=0.08) + sfx('reverse_whoosh').
