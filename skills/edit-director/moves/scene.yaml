id: scene.falling
family: scene
group: aesthetics
level: B
aliases: [falling, free fall, falling camera, falling through, fall into darkness, tumble in the void]
what: a fall of a person, an object or the camera itself — accelerating downward, with wind in the hair, a tumble in the void or a plunge into darkness; loss of control, a dream, a climax and the "drop"
frames: |
  1. The camera falls: a top-down shot of a city at night pushes in ×7.7 over 4.9 s, a camera above a person on the ground — ×3.4 over
     3.25 s; an accelerating curve — half of the distance is covered in the last 6–15 % of the time (as in free fall),
     the center is fixed; the ending — an impact and 2–4 black frames. The "down from the light" variant: a bright spot overhead
     shrinks ×0.08 over 1.6 s with the same acceleration and fades out to black.
  2. Falling together with the subject: the camera looks up into the face of the falling person, the background flies back in radial streaks
     (≈9 % of the frame/s along each axis), hair up, the frame sways in roll by ±17–22° and shakes ≈1.3 %; or the subject
     is "pinned" to the center of the frame with arms spread while the background creeps upward at ≈1 % of the frame/s.
  3. Tumble in the void: the body rotates at ≈97 °/s (255° over 2.6 s) on black, drifting slowly.
  4. Falling into darkness: the subject sinks toward the bottom of the frame, the light recedes upward, the frame darkens to black over ≈2 s.
  5. Comedic jump: a jump off a cliff, the camera follows down (a tilt of ≈80 % of the frame over 1.2 s) and lands the subject
     in an unexpected place — a cut or a landing exactly on the hit.
  6. Falling objects in slow motion: bags and fruit float down against a wall at a constant speed of ≈6–7 % of the frame/s.
variants:
  - camera falls: a vertical dive toward a city or the ground with acceleration, ending in black
  - falling with the subject: the face in close-up, radial background streaks, hair up, roll and shake
  - tumble in a weightless void: rotation ≈100 °/s on black
  - plunge into darkness: the subject goes down, the light goes up, a fade to black
  - sinking: a view from below toward a bright surface, a hand reaches for the light, the light shrinks and goes out
  - a comedic jump with an unexpected landing
  - falling objects in slow motion against a wall or the sky
  - dream fall: a shot of a lying person rotated by 90°, the person seems to hang or fall
  - a top view of people lying down — the end of the fall, a static wide shot
status: hybrid
fallback: |
  in code: a camera dive — an accelerating digital zoom-in on a top-down view (drone, rooftop, 4K) with increasing radial blur
  and a black cut on the impact; sinking — an accelerating zoom-out from a bright spot with a fade to black; rotating the frame by
  90–180°; slow motion for falling objects (flow interpolation). Falling with the subject — the subject cut out with a mask over
  a moving background plate (sky, city, texture) with directional blur; if there are no suitable shots — generation via gen_hint
  with the user's consent.
params:
  camera_drop: scale ×3–8 over 2.5–5 s, ease inCubic–inExpo (50 % of the distance in the last 10–20 % of the time), center fixed
  drop_blur: the radial blur grows with speed, maximum in the last 0.3 s
  impact: 2–4 black frames (0.08–0.16 s) or a white flash of 1–2 frames + a hit
  sink: zoom-out ×0.1–0.3 over 1.5–2 s, ease-in, brightness down to zero over the last 0.5 s
  with_subject: background 5–40 % of the frame/s upward or radially, directional blur 8–20 px @1080p, roll ±5–20° with a period of 1–2 s, shake 1–2 %
  tumble: rotation 60–120 °/s without stops, drift 1–3 % of the frame/s
  objects_slowmo: speed 0.2–0.4× (flow), a constant falling speed of 5–10 % of the frame/s
  real_fall: without slow motion a fall from 2 m lasts ≈0.64 s (16 frames) — for "realism" do not stretch it by more than ×1.5
  rotate_frame: 90° or 180° for the "dream" variant
  shot_length: 1.5–5 s; a dive — up to the impact on a downbeat
when: the track's drop (the fall right on the riser's falloff, the impact — on a downbeat), the climax and loss of control in drama, dreams and anxiety, a transition between scenes through the black frame of the impact, a comedic landing in UGC and viral videos, slow motion of a falling product in product videos; 1–2 falls per video
avoid: a fall without acceleration (looks like an elevator); an endless fall longer than 5 s with nothing happening; a sharp impact without sound; real danger and injuries on screen without an artistic context; calm videos — the tone is anxious
sfx: rising wind or a riser over the whole fall, whistling air, then a dull thud and silence; for sinking — an underwater rumble and bubbles; in comedy — a descending whistle and a splash or a "boom"
genres: {drama: allowed, epic: allowed, teaser: allowed, fanedit: allowed, motivation: allowed, viral: allowed, ugc: allowed, sport: allowed, travel: allowed, product: allowed}
detect: |
  ed_motion: ZOOM-IN ×3–8 (or ZOOM-OUT ×0.1–0.3) with an ease-in curve (50 % of the distance after 0.8 of the time), the center stable,
  black frames at the end — a camera fall; ROTATE 60–120 °/s without stops — a tumble; luma drops to zero as the subject
  sinks — a plunge into darkness; for objects in slow motion — a constant downward speed of 5–10 % of the frame/s.
  Visually: hair and fabric stretch upward, arms spread, the background smeared in streaks upward or radially, the gaze up
  at the receding light; a top-down view from a height.
  Differences: scene.levitation — no acceleration, swaying in place; scene.flying — the movement is controlled, sideways or
  upward, wind head-on; zoom.crash — a snap in ≤0.7 s without acceleration all the way to the end and without a black impact.
engine: |
  Dive: transform(scale=[1, 6], center=[0.5, 0.5], t=[t0, t0+3.5], ease='inCubic')
  + blur(kind='zoom', amount∝speed, t=[t0+2.8, t0+3.5]) + fade(to='black', t=t0+3.5, dur=0.12)
  + sfx('riser', at=t0, align='peak') + sfx('impact', at=t0+3.5); the impact — on a downbeat.
  Sinking: transform(scale=[1, 0.15], ease='inCubic', t=[t0, t0+1.6]) + fade(to='black', t=t0+1.1, dur=0.5).
  With the subject: mask('hf_remove_background') → composite over a background plate with a new primitive
  plate_scroll(direction='up'|'radial', speed=0.2, blur=12) + transform(rotate=[-12, 12], t, ease='inOutSine')
  + shake(amp=0.012, freq=6). Tumble: transform(layer, rotate=[0, 260], t=[t0, t0+2.6], ease='linear').
  Objects: speed(rate=0.3, interp='flow').
gen_hint: a young woman free-falling through the sky toward the camera, the camera falls with her facing her face, hair whipping upward, arms spread, clouds and city streaking past with radial motion blur, slight camera roll, cinematic, intense
commands: ["camera dive onto the city into the drop, impact to black at 0:30", "make a fall into darkness at the end", "objects slowly falling in slow motion against a wall", "a tumble in the void on #6"]
related: [scene.levitation, scene.flying, zoom.crash, time.slow_motion, time.speed_ramp, cut.flash, drone.fpv]
evidence: {examples: 12, sources: 12, measured: "camera dive ×7.7 over 4.9 s and ×3.4 over 3.25 s, ease-in curves (50 % at 0.85 and 0.94 of the time), black at the end; sinking ×0.078 over 1.6 s ease-in → black; tumble 255° over 2.64 s; radial background ≈9 %/s along the axes, roll 17–22°, shake 1.3 %; tilt following the jumper 80 % of the frame over 1.2 s; falling fruit 6.4–7 % of the frame/s, constant; the real duration of a fall from 2 m is a calculation", confidence: medium}
