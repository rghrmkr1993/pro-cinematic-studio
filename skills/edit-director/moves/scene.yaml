id: scene.void
family: scene
group: aesthetics
level: B
aliases: [void, infinite background, cyclorama, seamless backdrop, black void, white void, white cyc]
what: a subject or an object in an infinite empty space — an even black or white background without walls, horizon or details; all attention is on the figure, a sense of isolation, a dream or being "outside of time"
frames: |
  1. The background takes up 70–99 % of the frame and is perfectly even: a dark void — brightness 0–10 of 255, a light one — 185–228;
     local variation ≤1 level (no texture, no noise), no visible floor-to-wall seam or horizon.
  2. The figure is small and central (2–25 % of the area: loneliness, scale) or a large portrait at the edge of the frame.
  3. Light: in a dark void — a pool of light from above or from the side, only the subject and the circle of floor beneath them are lit
     (the bottom of the frame brighter than the top: 17–43 versus 5–7), often a cool tint (b* −2…−8) or a blue spotlight;
     in a light one — soft shadowless light, neutral white (a*, b* ≈0), a faint shadow at the feet.
  4. The camera is static (5 of 16) or moves slowly: a push-in ×1.04–1.5 over 1–2 s, a smooth roll or an orbit of 11–23° over 2 s;
     in a black void the camera can "fall" through space toward the subject.
  5. Editing: long shots of 2–12 s; the void often alternates with ordinary shots as the subject's "inner world".
variants:
  - black void with a pool of light: a figure in a spotlight beam, the floor glows around the feet
  - low-key portrait: face and hands picked out by light, everything else in absolute black
  - object in the darkness: a building at night or an object, the surroundings "eaten" by darkness
  - space: a figure or an object floats in black with stars
  - white cyclorama: a dancer or a model at full height in the center, a soft shadow at the feet
  - white haze: endless rows of identical figures dissolve in a light fog
  - white minimalism: a figure and its upside-down reflection on white, tiny in the center
status: hybrid
fallback: best of all — a shot on a black or white background from the source footage (search via detect); otherwise a mask of the subject (mediapipe or remove_background) and filling the background in code with an artificial pool of light or a shadow; complex motifs (rows of figures in fog, space) — generation with consent
params:
  background: dark — 0–10 of 255 (typ. 6), light — 200–228 (typ. 215); even, no noise (σ ≤1)
  bg_share: 70–99 % of the frame (typ. 88 %)
  subject_size: 2–25 % of the area (loneliness, scale) or a close-up of 60–85 %
  light_pool: dark — an ellipse of light under the subject with a radius of 0.3–0.5 of the width, soft edge 0.1–0.2, floor brightness 20–45
  contact_shadow: light — a shadow at the feet with opacity 0.2–0.35, blur 2–4 % of the height
  tint: dark — cool b* −2…−8 or a colored spotlight; light — neutral (a*, b* ≈0) or slightly warm
  camera: static or a slow push-in ×1.04–1.5 over 1–2 s (25–50 frames), ease inOutQuad; an orbit of up to 25° over 2 s
  edge_mask: mask feather 1–3 px, no halo; hair — a mask with refinement
  shot_length: 2–12 s
when: intros and pauses before the drop, an "inner monologue", fashion and product shots (nothing distracts), the subject's statement, dramatic portraits, a scene of loneliness; on quiet parts of the track and on accents right after a sudden silence. Works well as a contrast to busy scenes
avoid: long series in the void without a change of shot size (nothing for the viewer to hold on to); a dirty mask and a halo around the hair (the void emphasizes it); noise and banding on a black background (steps after compression — add light grain over the whole frame); visible studio walls and seams
sfx: silence or a steady hum, a long reverb on the voice and footsteps (a sense of a huge space), a single hit or note when the subject appears; on a light void — airy ambient
genres: {fashion: signature, product: signature, drama: allowed, calm: allowed, teaser: allowed, motivation: allowed, epic: allowed, sport: allowed, phonk: allowed, explainer: allowed, viral: allowed, fanedit: allowed}
detect: |
  The median of the pixels along the frame edge ≤10 or ≥185; background share (|Y − background| < 22) ≥0.7; local background variation σ ≤1 (for starry
  space — noise of dots on black); a figure of 2–25 % of the area near the center; no horizontal horizon or floor line.
  Dark: the bottom brighter than the top (a pool of light). ed_motion: static or a slow ZOOM-IN ×1.04–1.5; background tracking is impossible
  (method fail/ecc on a uniform background) — a sign of a void.
  Difference from scene.liminal: there are walls, perspective and space there. From light.silhouette: there the background is light and the figure
  is dark without details. From ordinary studio footage: visible walls, a seam, background texture.
engine: |
  dark:  mask('mediapipe_person' | 'hf_remove_background', feather=2)
         → composite(layers=[solid('#050608'), light_pool(center=[0.5, 0.85], radius=0.4, softness=0.15, luma=35), subject])
         + color(params={black: 0, temp: -0.05}) + grain(amount=0.01) + transform(scale=[1, 1.08], t=[t0, t0+2], ease='inOutQuad')
  light: mask(...) → composite(layers=[solid('#dcdcdc'), contact_shadow(target=subject, opacity=0.3, blur=0.03), subject])
         + color(params={white: 0.86, sat: 0.95})
  If the source is already in a void — only color(black=0 | white=0.86) to even out the background and grain(0.01) against banding.
