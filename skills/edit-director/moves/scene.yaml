id: scene.flying
family: scene
group: aesthetics
level: B
aliases: [flight, flying person, superhero flight, takeoff, wind in the face, flight shot, flight chase cam, flying object]
what: a person, a vehicle or an object flies through the air under control — takes off, speeds over the ground, soars in the wind toward the clouds; freedom, superpowers, a dream, humor
frames: |
  1. A close "flight in the wind": face and shoulders against the sky, hair and clothes whipping sideways, the subject is almost still,
     the clouds behind creep barely noticeably (≈0.3–0.4 % of the frame/s) — the sense of speed comes only from the wind and the clothes; 2–2.5 s.
  2. Takeoff seen from above: the camera above the subject looks down, the ground drops away — the background plate shrinks ×0.39 over 3 s almost linearly,
     the houses blur, clouds appear; the subject stays the same size in the frame.
  3. Lift-off and departure: a series of huge jumps and somersaults in a field, then the figure shrinks from ≈40 % to ≈5 % of the frame height
     over ≈4 s and leaves into the sky; the camera sometimes follows, sometimes stays on the ground.
  4. Chase camera: behind and slightly above a flyer with wings, approaching a building ×1.7 over 1.9 s almost
     linearly; or an object flies into the camera (×2 over 1.1 s, ease-out) and gets caught at the end.
  5. Dash and impact: the subject bolts off horizontally, rushes through a forest with motion blur and crashes into a wall in a cloud
     of dust — a cut on the impact, a push-in ×1.7 over 1 s with ease-out afterwards.
  6. Composite against the sky: a flying car with a person hanging out of the door against the clouds; a night jump under a helicopter's
     searchlight beam with flashes on the cuts.
variants:
  - a close-up in the wind against the sky (a fan + the sky), minimal background movement
  - takeoff seen from above: the ground drops away and blurs
  - lift-off in a field: jumps, somersaults and the figure leaving into the sky
  - chase from behind: the camera flies after the subject or the object
  - a horizontal dash ending in an impact against a wall with dust
  - a flying vehicle or object against the sky
  - comic imitation: people flapping their arms like wings on an embankment
  - graphic flight: jet boots, a starry sky, riding a drawn comet over a planet
  - an animated character takes a run-up and takes off over a forest and clouds
status: hybrid
fallback: |
  in code: the subject cut out with a mask over a moving background plate (sky, clouds, aerial footage from the source footage) with bobbing and
  roll; takeoff from above — an accelerating zoom-out of the view of the ground; leaving into the sky — shrinking the subject's layer with ease-in; a dash —
  a layer shift with motion blur and a cut on the impact. Wind in the hair can't be done in code: look for footage with wind in the source footage
  or generate via gen_hint with the user's consent.
params:
  sky_plate: clouds or aerial footage, drift 0.3–5 % of the frame/s (close-up) or 10–40 % of the frame/s (fast flight), direction opposite to the flight
  hover_bob: vertical 1–2 % of the frame, 0.4–0.6 Hz; roll ±3–8° with a period of 2–3 s; shake 0.3–1 % for "turbulence"
  ascent_topdown: background plate ×1 → ×0.35–0.5 over 2.5–3.5 s, linear or inQuad, increasing blur 0 → 6 px @1080p
  takeoff: subject layer ×1 → ×0.1 over 1.5–4 s, ease-in, trajectory up and to the side; at lift-off — dust and a short shake
  chase: push-in ×1.5–2 over 1–2 s almost linearly, the camera behind and above by 10–20 % of the frame
  dash: layer shift of 60–100 % of the frame width over 0.3–0.6 s, directional blur 20–40 px, a cut or a flash on the impact, then a shake of 3–5 % over 0.3 s
  object_to_camera: object scale ×1 → ×2–2.5 over 0.8–1.2 s, ease-out, roll 10–20°
  shot_length: 1.5–5 s; leaving into the sky — up to 4 s
when: intro and climax, a "takeoff" on the rise and the drop, dreams and freedom in motivation, superhero moments in fan edits and sport, travel with aerial footage, humor (imitating flight, an object flying into the camera); 1–2 flights per video
avoid: a still background with no wind in the clothes — the subject looks pasted in; light on the subject and on the sky coming from different sides; hard mask edges against the sky; cutting the flight too fast — no sense of space; a flight with no goal and no event longer than 5 s
sfx: a rush of wind (rising on takeoff), a whoosh on a fly-by past the camera, a low hum at altitude, an impact and falling debris on landing; in a graphic flight — a synth swoosh and sparkles
genres: {epic: allowed, motivation: allowed, fanedit: allowed, teaser: allowed, fashion: allowed, travel: allowed, sport: allowed, viral: allowed, ugc: allowed}
detect: |
  ed_motion: a close-up against the sky — no global events, overlay-mask ≈0.3, movement only in the hair and clothes;
  takeoff from above — a long ZOOM-OUT ×0.35–0.5 almost linearly with the subject still; a chase — ZOOM-IN ×1.5–2 over 1–2 s;
  a dash — a short ZOOM-OUT with ease-in, a cut, then a ZOOM-IN with ease-out (the impact); leaving into the sky — the figure shrinks.
  Visually: a person without support in the sky, hair and fabric fluttering sideways or backward, the horizon or the ground far below,
  an "arms forward" pose or arms spread; an object flies straight into the lens.
  Differences: scene.levitation — hanging in place; scene.falling — downward acceleration and loss of control;
  drone.fpv — only the camera flies, there is no subject in the frame.
engine: |
  Close-up in the wind: mask('hf_remove_background', feather=3) → composite over the sky + plate_scroll(direction='left',
  speed=0.02) + hover(layer, amp=0.012, freq=0.5, tilt=4) + sfx('whoosh', gain=-12) backed by wind.
  Takeoff from above: transform(plate, scale=[1, 0.4], t=[t0, t0+3], ease='inQuad') + blur(kind='gaussian', amount=[0, 6]).
  Leaving into the sky: transform(layer, scale=[1, 0.1], shift=[[0, 0], [0.15, -0.35]], t=[t0, t0+2.5], ease='inCubic').
  Dash: transform(layer, shift=[[0, 0], [0.9, 0]], t=[t0, t0+0.4], ease='inQuad', motion_blur=0.6) + cut(t0+0.4)
  + shake(amp=0.04, freq=12, t=[t0+0.4, t0+0.7], decay=0.8) + sfx('impact').
gen_hint: superhero-style flight, a woman in a pink jacket and sunglasses flies through a bright blue sky with white clouds, close-up from the side, her hair and clothes blown back by strong wind, subtle bobbing, clouds drift past slowly, cinematic, sunny
