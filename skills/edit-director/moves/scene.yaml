id: scene.liminal
family: scene
group: aesthetics
level: C
aliases: [liminal space, empty corridor, empty rooms, tiled pool, familiar yet eerie place]
what: a shot of an empty transitional space — a corridor, a staircase, a pool, an enfilade of arches or columns — in a single color, with the vanishing point in the center and an even, slow tracking move; familiar and unsettling at the same time
frames: |
  1. Empty: no people (8 of 9 examples) or one small figure; no small objects and no "traces of life".
  2. Composition: central perspective, the vanishing point near the center (X 0.49–0.62, Y 0.26–0.54), the left and right halves
     almost mirror each other (mirror correlation 0.77–0.99 in 5 of 9); repeating elements — lamps, arches, columns, tiles — recede into infinity.
  3. The light is even and shadowless: ceiling light panels or a single warm beam; the shadows don't crush (p2 14–147,
     median ≈60 of 255), no clipping.
  4. Single-color palette: one tone fills the whole frame (tone concentration 0.99–1.0 in 8 of 9) — most often yellow-beige
     (b* of the neutrals +17…+29), less often turquoise tiles, blue-violet fog, white, red-orange.
  5. Movement: static (4 of 9) or an even forward tracking move without acceleration or turns (5 of 9; ×1.6–4 over 1.1 s in
     computer-generated loops, the end matches the start); the camera at eye level. The shot is held for 3–8 s.
variants:
  - yellow office rooms: wall-to-wall carpet, wallpaper, light panels, a tracking move between columns
  - tiled pools and corridors, partly flooded with water, sun glints
  - an endless staircase, an enfilade of arches, rows of columns with a narrow beam of light
  - an empty hall in fog with a lone person at a table
  - dark infinity: glowing columns in black water, a "moon" sphere
status: footage
fallback: search the source footage for empty shots using the features from detect; in code — a "single tone + lifted shadows" grade and an even digital zoom-in ×1.1–1.3 over 4–6 s on a wide 4K shot of an empty room; generation with consent (gen_hint), a seamless loop
params:
  emptiness: 0 people (or one figure ≤5 % of the frame area)
  composition: vanishing point in the center ±0.1; mirror symmetry ≥0.7; camera at eye level
  palette: one dominant tone (concentration ≥0.95); yellow-beige — CIELAB hue 60–80°, b* +17…+29, a* +7…+10; otherwise turquoise, white, lilac
  tone: p2 40–100 (typ. 60), p98 180–245, no crushed shadows or clipping; noise ≤3 levels
  motion: static or a tracking move at a constant speed of ×1.003–1.01 per frame @25 fps (×1.1–1.3 over 4–6 s), ease linear, no roll
  shot_length: 3–8 s (75–200 frames); a series of 2–4 empty spaces in a row
when: intro and outro, an atmospheric pause between scenes, a "suspension" before a plot twist, horror and mystery teasers, ambient and lo-fi, edits about dreams, loneliness and nostalgia; on the quiet parts of the track
avoid: energetic parts and drops; shots with people, litter, signs; a jerky handheld camera and fast cuts — they destroy the sense of infinity; holding one space for longer than 8–10 s without changes
sfx: the hum of lamps (a low tone at 50–100 Hz), the steady room tone of an empty space, echoing footsteps, water drops, muffled music with a long reverb; silence as a device
