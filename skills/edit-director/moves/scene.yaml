id: scene.forced_perspective
family: scene
group: aesthetics
level: C
aliases: [forced perspective, scale illusion, perspective trick, holding it in the palm, optical size illusion]
what: an optical trick on a static camera — a near and a far object are aligned at one point of the frame, and the brain reads them as the same scale; a person "picks up" a car with two fingers, "steps" on a street, drops a potato that lands as a boulder
frames: |
  1. Setup: the camera is static (jitter 0.02–0.12 % of the frame in measurements), wide angle, focus across the whole depth —
     the near object 0.3–2 m from the lens and the far one tens of meters away are equally sharp.
  2. The illusion, 0.8–2 s (20–50 frames): the "contact" point matches on screen — fingers on the roof of a car, a person on top
     of a monument, a palm at the edge of rocks. The ground between the planes is hidden by the angle: shooting from above, from ground level, from behind an edge.
     Apparent magnification of the near object ≈×3–100 (a hand = a car, a potato = a house).
  3. Action, 0.5–2 s: the near one "picks up", pushes, steps, drops, pours; the far one responds in sync (the car
     drives off, the rocks fall like dominoes). The giant's "landing" is often reinforced by a frame shake of ≈5 % for 2–8 frames.
  4. Reveal (in 3 of 7 tricks), 1.5–3 s: the near one walks off into depth or "jumps down" toward the camera — the sizes even out
     right in the frame without any zoom; this is the punchline. The whole move 1.8–5.6 s.
variants:
  - touching or holding: a hand at the lens takes a distant object — a car below seen from a balcony, a person, a building; often handheld
  - stepping on: a foot or shoe enters right at the lens and covers the distant scene within 2–4 frames; product variant — close-ups of the shoes follow
  - dropping into the world: a small object falls next to the lens and lands as a boulder on the road; the elliptical shadow and dust are drawn in, the clip is looped back and forth
  - reveal through depth: the "small" person turns out to be far away, the "giant on the monument" jumps down toward the camera and walks off toward the monument at normal height
  - swap through a cut: a cup in the hand → the same one, huge, on the ground; a toy car → a real one, the cut hidden in a pan following the car (81 % of the frame over 0.96 s)
status: footage
fallback: |
  hybrid — cut out a person or an object (mask hf_remove_background) and insert it into another shot at a scale of ×0.05–0.25
  ("tiny") or ×3–10 ("giant") anchored on the contact line, with a contact shadow and color matching; search the source footage for
  static shots where a hand or a foot at the lens lines up with a distant object; generation — via gen_hint with consent.
params:
  camera: strictly static (jitter ≤0.15 % of the frame); camera movement gives the trick away through parallax; handheld — only if the contact holds
  lens: wide angle (≈16–28 mm equiv., a phone works), stopped-down aperture — sharp from 0.3 m to infinity
  distances: near 0.3–2 m, far 10–300 m (≈)
  contact_tolerance: the contact point matches to within ≈1–2 % of the frame; the joint is hidden behind the edge of an object, the horizon or a railing
  light: light and shadows on both planes fall the same way; the color and contrast of the near plane do not differ from the far one
  hold_illusion: 0.8–2 s (20–50 frames) of static illusion before the action
  action: 0.5–2 s (12–50 frames)
  reveal: 1.5–3 s; cut no later than 0.5 s after the sizes become equal
  impact_shake: on the giant's "landing" ≈4–6 % of the frame, 0.15–0.5 s, decaying
  loop: optionally back and forth (normal + reverse) for short social videos
  composite_fallback: scale ×0.05–0.25 / ×3–10; anchor — feet or palm on the contact line; shadow — a blurred ellipse 1.2–1.5 times the width of the support, opacity 0.35–0.5 (≈)
when: the hook in the first 1–3 s (the illusion stops the scroll); the reveal — on the drop or a downbeat; travel at landmarks; a product "the size of a house"; humor and UGC; no more than 1–2 tricks per video — repetition kills the surprise
avoid: a drifting camera, a moving stabilizer, a zoom during the trick; shallow depth of field (a blurred far plane gives away the distance); shadows in different directions; an illusion longer than 3 s without action; the contact is not visible or is blocked — the trick doesn't read; a serious and calm tone
sfx: on the "contact" — a pop, a click or a cartoon "bloop"; on the giant's "landing" — a heavy hit with sub-bass under the shake; on the reveal — a whoosh or a scratch
genres: {viral: signature, ugc: signature, travel: signature, product: allowed, fanedit: allowed, teaser: allowed, explainer: allowed, clips: allowed, motivation: allowed, drama: forbidden}
detect: |
  ed_motion: no global ZOOM/SHIFT events or jitter ≤0.15 % of the frame (static), while there is a large local difference
  between frames in one zone; a near object flying in at the lens covers ≥50 % of the area within 2–4 frames (a false
  cut is possible, nonrigid >1); the object's size changes ×2–5 over 1–3 s with no ZOOM — the object moved into depth (the reveal).
  Visually: two objects of the same class (people, cars) with an on-screen height ratio ≥3 and in "contact"; both sharp; the near one
  cropped by the frame edge; the ground line between them hidden by the angle.
  Differences: scene.giant and scene.tiny_people — the scale holds as a rule of the world (composite, CG), no "contact" gag;
  focus.tilt_shift — the whole shot looks like a model because of the blur bands; dolly zoom — the background changes, not the object.
engine: |
  From the source: cut(at=start of the illusion) — hold ≥0.8 s before the action; sfx('click', at=contact);
  shake(amp=0.05, freq=12, t=[land, land+0.3], decay=0.8) + sfx('impact', at=land) on the "landing";
  cut(at=reveal_end+0.3); for social videos loop(mode='pingpong').
  Without a source — a new primitive scale_composite(subject=mask('hf_remove_background'), plate, scale=0.12|5,
  anchor='feet'|'hand'|[x,y], shadow=contact_shadow(width=1.3, blur=12, opacity=0.4), color_match=True, t)
  + transform(shift) for "steps" across the shot. Swap through a cut: transform(shift, motion_blur=0.5) as a pan following the
  object + cut in the middle of the blur (match(on='shape')).
