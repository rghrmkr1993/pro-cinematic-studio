id: scene.giant
family: scene
group: aesthetics
level: C
aliases: [giant, colossus, kaiju shot, giant over the city, titan, scale reveal]
what: a person, an animal or an object the size of a mountain towers over the ordinary world — waist-deep behind hills, in the clouds or in haze, with tiny people and cars at its feet; the shot sells scale, dread or epic grandeur
frames: |
  1. The shot is wide and static (in 6 of 8 jitter 0.01–0.11 % of the frame), the camera low or high up; the horizon in the lower
     third, tiny scale references at the giant's base — people, cars, trees (≈1–5 % of the frame height).
  2. The giant's visible part takes up ≈35–70 % of the frame height, and below the waist or knees it is hidden by terrain, clouds or
     fog (in 6 of 8 examples). A distant giant sinks into atmospheric haze: its dark areas are lifted toward the sky tone
     (the silhouette at ≈0.7 of the sky brightness versus an almost black foreground).
  3. The movement is slow and weighty: a turn of the head, a gesture, a slow rise from behind the horizon or from behind the frame edge;
     a cloud drifts in front of it as a natural wipe. The shot is held for 2–5.4 s.
  4. Reveal (variant): first a detail — a paw like a tree trunk next to a person, ≈1.6 s — then a cut to the wide shot,
     where it is clear the creature is the size of a house.
variants:
  - silhouette in fog: a waist-up figure behind hills in dawn haze, almost motionless, low saturation (median 50)
  - waist-deep in clouds over mountains or a planet: the clouds drift in front of the giant and serve as wipe transitions; animation or 3D
  - giant animal next to a person: a detail with a child by its paw → a wide shot with a house
  - giant head: a huge profile at the front edge of the frame and a tiny crowd on a beach; or a head rises from behind the edge next to a small person
  - low-budget: a real animal "looms" over a model hill with relief letters, the camera low by the model
  - giant among dunes: a huge figure behind the sand dunes, tiny people and cars at its feet, clear air, a warm palette
status: hybrid
fallback: |
  the giant is assembled from two shots: a wide static background plate (from the source footage or stock) + a person against a
  plain background, cut out with a mask and enlarged; if there is no suitable plate or interaction with clouds is needed —
  generation with the user's consent; if a giant object is needed — a cut-out product instead of a person.
params:
  plate: a wide shot without camera movement, the horizon at 25–40 % from the bottom of the frame, small scale references present
  giant_height: visible part 35–70 % of the frame height, the full figure by calculation ×0.8–1.5 of the frame (cut off by the horizon or the edge)
  occlusion: the bottom of the figure behind terrain, clouds or fog; the giant is drawn only over the sky and the far plane
  haze: mix the sky color into the giant by 30–60 %, lift the shadows, contrast ≈30 % relative to the sky (measured silhouette 109 versus sky 153), blur 0.5–1 px
  references: people and cars at the base ≈1–5 % of the frame height
  motion: slow — the giant's speed ×0.5–0.8 (≈), short movements; the camera static or a very slow tilt (≈6 % of the frame over 0.5 s)
  shot_length: 2–5.4 s (50–135 frames); reveal — a detail ≈1.5 s (≈40 frames), then the wide shot from 2 s
  step_shake: on the giant's steps ≈1–3 % of the frame, 4–6 Hz, decaying over 0.3–0.5 s
  light: the light on the giant from the same side as on the plate; no shadow on the terrain is needed if the bottom is hidden
when: intro and outro, the climax, a "big idea" and a metaphor for anxiety or loneliness, epic music videos, teasers; a giant product over a city in advertising; 1–2 times per video, hold for at least 2 s
avoid: fast cutting — the scale doesn't have time to register; a giant without haze and with hard edges in the far plane (looks like a sticker); light and shadows in different directions; no scale references — the figure reads as an ordinary person up close; a giant standing with its feet on the ground without a shadow or contact
sfx: a low rumble or drone over the whole shot; sub-bass and a dull thud with an echo on steps and touches; wind; on the reveal — a rising riser and a heavy hit
genres: {epic: signature, teaser: signature, drama: allowed, fanedit: allowed, motivation: allowed, viral: allowed, fashion: allowed, product: allowed, explainer: allowed}
detect: |
  ed_motion: a static camera (no events, jitter ≤0.11 %) or a slow tilt; holds with an almost motionless
  giant; in the variant with clouds — false cuts and white frames when a cloud covers the lens.
  Visually: a human or animal figure ≥35 % of the frame tall, its bottom cut off by the horizon, terrain or clouds;
  at its base, objects of the same class 10–50 times smaller; atmospheric haze on the figure (darks lifted toward the sky tone,
  saturation lower than in the foreground); a low angle or a view from above the clouds.
  Differences: scene.forced_perspective — the "giant" is actually close to the camera, sharp, without haze and in a contact gag;
  scene.tiny_people — a small subject in the ordinary world; fx.bobblehead — only the head is enlarged.
engine: |
  scale_composite(subject=mask('hf_remove_background'), plate, scale=height of 1.0 frame, anchor=[x, horizon_y+0.15],
  occlude=sky_mask(plate), haze={amount: 0.45, color: median(sky)}, blur=0.7, color_match=True, t=[t0, t0+4])
  + speed(rate=0.65, interp='blend') for the giant's layer
  + shake(amp=0.02, freq=5, t=[step, step+0.4], decay=0.7) + sfx('sub_drop', at=step) on each step
  Reveal: cut(detail, 1.5 s) → cut(wide, ≥2 s) + sfx('riser') before the cut and sfx('impact') on it.
  New primitives: sky_mask(plate) — a mask of the sky and the far plane; haze(amount, color) — atmospheric haze on a layer.
gen_hint: static wide shot from a low angle at dusk — tiny people and cars in the foreground, distant hills behind them, and above the hills, half hidden in haze, an enormous figure seen from the waist up that moves slowly and deliberately; soft light, overwhelming scale
