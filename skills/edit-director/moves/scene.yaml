id: scene.magic_realism
family: scene
group: aesthetics
level: C
aliases: [magic realism, everyday surrealism, miracle as the norm, the impossible in the ordinary, surreal everyday]
what: a shot where one impossible thing calmly exists in an ordinary, realistically filmed setting — clones, a living photograph, a mountain of bodies, a car on a lift in the desert — and people behave as if this were normal
frames: |
  1. The camera is static (7 of 10 — no global motion) or barely breathes; the shot is held for 1.2–4 s so the viewer has time to notice the oddity.
  2. The image is realistic: natural light, normal saturation (HSV-S 75–140 in 8 of 10), no grain, distortions or
     effects (local deformation ≤0.2 % of the width in 7 of 10); a soft tint in the neutrals (|a*|, |b*| ≤7 in 8 of 10),
     often blue hour or dusk with a lilac sky.
  3. There is a single impossible element and it takes up 10–50 % of the frame, lit and shaded like everything around it; the composition is often central.
  4. Only the "miracle" or a person next to it moves: only the image in a frame on the wall moves while the frame itself stays still; dogs' muzzles
     sprout from a person's profile; a crowd of identical people sways slightly.
  5. No reaction: the subject is calm, looks into the camera or is busy with their own thing; the sound is everyday.
variants:
  - creature in everyday life: a mermaid on an ordinary beach, a hybrid animal
  - clones: dozens of identical people in one frame, a dense crowd
  - living picture: a photo on a wall or in a frame moves, everything else is static
  - impossible physics: a tower of people, a car on a lift in the middle of a desert, an infinitely tall ladder tower
  - body transformation: animal muzzles sprout from a face, against a dark gradient background
  - quiet installation: a person in a suit stands in a bathtub, a person inside a transparent crystal under the stars
status: generation
fallback: clones — hybrid (a static camera, several takes with one person, mask('mediapipe_person') and layer assembly); a living photograph — track the quadrilateral of the frame and insert video into it, freeze the rest; inserting an object — remove_background + composite with a shadow matching the scene light; otherwise generation with consent or a search of the source footage
params:
  camera: static (shake ≤0.3 %) or a push-in ≤×1.1 over the shot; no roll
  shot_length: 1.2–4 s (30–100 frames), the miracle is visible from the first frame or appears within the first 0.5 s
  grade: natural — saturation ×0.9–1.1, neutrals' tint ≤7 units, no grain and no vignette stronger than 0.15
  anomaly: one element, 10–50 % of the area, light and shadows match the scene (shadow direction ±20°)
  clones: 8–60 copies, scale spread according to perspective, slight independent movements
  living_photo: movement only inside the frame (the rest is a freeze), loop 1–3 s
  reaction: neutral, no surprise
when: intro and the first 3 seconds (a hook without editing tricks), music videos, brand image and product videos ("the product stands where it can't stand"), a turn in the story, a final riddle shot; on a quiet part of the track or in a pause. 1–3 such shots per video
avoid: characters reacting to the miracle (the genre breaks into fantasy); visible compositing seams and wrong shadows; next to psychedelic and glitch looks; a long series in a row — the effect is lost
sfx: the everyday sound of the scene without "magical" effects; silence or a steady background; the music doesn't emphasize the strangeness
genres: {teaser: allowed, drama: allowed, product: allowed, fashion: allowed, viral: allowed, calm: allowed, fanedit: allowed}
detect: |
  ed_motion: no global events (static camera), holds or a mask of still pixels with movement in one area
  (living picture); a natural grade without effects (deformation ≤0.2 %, no grain or bands).
  Semantics (VLM check): "is there a physically impossible element in a realistic scene that people are indifferent to?";
  clones — ≥5 faces with almost identical embeddings.
  Difference from look.dreamcore: there it is a faded pastel look and emptiness; here a natural image and people.
  From look.weirdcore: there it is low quality and deliberate creepiness. From look.psychedelic: no distortions and no color "chemistry".
engine: |
  generate_video(prompt=gen_hint, camera='locked_off', dur=3) → clip           # main path, with consent
  hybrid recipes:
    clones: stabilize(1.0) + [mask('mediapipe_person') on each take] → composite(layers=passes, blend='normal')
    living picture: track_quad(target='frame') + composite(video→quad, perspective=True) + freeze(rest of the frame)
    insert: mask('hf_remove_background') → composite(scale, position, shadow='match_light')
  Editing: cut to a clean 1.2–4 s shot; no effect transitions; color(params={sat: 1.0}) — leave the grade alone.
gen_hint: realistic everyday scene, <ordinary location> in natural light, <one impossible element, e.g. a mermaid resting on beach rocks | dozens of identical men standing in a dark room | a car lifted on a scissor lift in an empty desert at dusk>, people calm and unbothered, locked-off camera, photorealistic, no visual effects
