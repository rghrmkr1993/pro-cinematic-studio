id: scene.underwater
family: scene
group: aesthetics
level: B
aliases: [underwater footage, underwater, underwater shot, diving in frame, plunge, splash-in, underwater light]
what: a shot underwater — a blue-turquoise or colored murky medium, weightless hair and fabric, bubbles, a glowing surface above, a floating camera; in the edit also a "dive" with the sound going muffled
frames: |
  1. (optional) Entry: a jump or fall above the water → impact with the surface → 1 dark frame (brightness drops by half) → underwater
     a cloud of bubbles, brightness ×1.5–2 relative to the above-water shot.
  2. Medium: the water tints everything — the blue channel is 2.8–6.7 times higher than red (turquoise or deep blue); in a staged setup
     — a monochrome gel wash (red: blue and green channels ≈0). The blacks are lifted, the contrast is soft, the sharpness
     low; when shooting upward, the rippling surface glows (the top of the frame brighter than the bottom by 50–120 levels).
  3. Inside: hair, fabric and arms float, people slowly sink or "fly"; bubbles rise, particles hang; rays and
     glints wander over the body.
  4. Camera: floats — drift and roll of 5–50° over 0.4–2 s, jitter 0.3–3.5 %; or almost still in front of a dancing figure.
     The subject's movement is often slowed down.
  5. Shot length 1.8–3.8 s; exit — surfacing toward the light, a fade to black or a cut to an above-water shot.
variants:
  - pool at night: a blue wash (B/R ≈4.6), a spotlight in the frame, a body enters the water in a cloud of bubbles, a slow push-in ×1.5 over 1.8 s
  - jump through the surface: an above-water shot of the jump → a dark frame → underwater bubbles and the bottom, roll up to 50°
  - churning water: daylight, a silvery surface above, white bubbles, a figure in a bright dress thrashing
  - studio wash: monochrome red, a figure floats toward the camera and sinks into darkness
  - underwater dance: a static camera, the figure lit by a cold backlight, turquoise (B/R ≈6.7), fabric and bubbles glow
status: footage
fallback: |
  1) search the source footage via detect (blue cast, bubbles, bright ripples above, a floating camera);
  2) imitation in code on an above-water shot (preferably slowed down, with flowing hair or fabric): a blue-turquoise
     grade with lifted blacks, caustics, a slow wave distortion, bubbles as particles, a floating drift, muffled sound;
  3) generation via gen_hint with the user's consent.
params:
  duration: 1.8–3.8 s (45–95 frames @25 fps)
  grade_blue: B/R 2.8–6.7, G/R 1.6–4.1 (turquoise — more G, depth — more B); blacks lifted to 16–41, whites 128–207
  grade_mono: (variant) a monochrome wash — one channel 80–100, the others ≈0, a dark background
  softness: Laplacian variance 2–20 times lower than in an above-water shot of the same scene (≈); a light haze
  surface_glow: when shooting upward, the top of the frame is brighter than the bottom by 50–120 brightness levels, the ripples move
  camera: drift and roll of 5–50° over 0.4–2 s, jitter 0.3–3.5 %; or static
  speed: slow motion ×0.4–0.7 for "weightlessness" (≈)
  entry: impact with the water → 1 dark frame (brightness ×0.5) → a cloud of bubbles for 6–10 frames, brightness ×1.5–2
  bubbles: rising at ≈10–30 % of the frame height per second, size 0.5–3 % of the width (≈)
when: |
  A "plunge" as a transition: on the drop, a cut into the water — the music goes muffled; when the chorus returns — surfacing and the sound opens up.
  A dream, suffocation, loss of control, catharsis — drama and music videos. Sport (swimming, diving), travel (snorkeling, a pool),
  fashion (floating fabric). Hold 2–4 s; 1–2 underwater episodes per video.
avoid: |
  Imitation on a sharp, contrasty shot without slowing it down — reads as a filter. Bubbles and caustics covering the face
  too densely. An underwater fragment longer than 5–6 s without an event. Sharp, snappy cutting inside an underwater episode —
  the medium demands smoothness.
sfx: |
  Music through a low-pass filter (cutoff 400–800 Hz) for the whole underwater fragment; gurgling and bubbles, a dull rumble, a
  heartbeat. Entry — a splash and a hit, then instant muffling; exit — an inhale and a sharp opening of the filter on a downbeat.
genres: {travel: signature, sport: allowed, fashion: allowed, drama: allowed, epic: allowed, calm: allowed, fanedit: allowed, motivation: allowed, viral: allowed}
detect: |
  ed_motion: rgb_med skewed toward blue (B/R ≥2.5) or a single-channel monochrome; luma_med 24–83; a floating camera —
  ROTATE and SHIFT with a high nonrigid (0.5–1.0, the water and bubbles move on their own), jitter 0.3–3.5 %; on entry — a black frame
  and a jump in brightness.
  Own checks: lifted blacks (2nd percentile 16–41) with compressed whites in clear water; low sharpness; the top of the frame
  brighter than the bottom with horizontal ripples; small bright round spots rising upward (bubbles); hair and fabric
  sway without wind.
  Difference from a night blue grade: there the edges are sharp, there are no bubbles or ripples. From light.haze: no blue cast and no bubbles. From angle.water_level: there the camera is at the waterline and the surface line splits the frame.
  From time.slow_motion: here slow motion is a consequence, and the defining sign is the medium.
engine: |
  footage: find_shot(color_bias='blue', bubbles=True, surface_glow=True) → cut(at).
  imitation: color(params={wb: 'teal', b_over_r: 3.5, lift: 30, gain: 0.7, sat: -10 %})
             + caustics(scale=0.12, speed=0.4, opacity=0.2) + wave_distort(amp=0.4 %, freq=0.5)
             + particles(kind='bubbles', rate=6/s, size=[0.5, 3] %W, rise=0.2 H/s) + blur(kind='gaussian', amount=1.2)
             + speed(rate=0.6, interp='flow') + destabilize(profile='float').
  entry: cut(at=water impact) + flash(color='black', dur=1fr) + sfx('impact', at=impact) + muffle(cutoff_hz=600, t=[impact, exit]).
  exit: transition(kind='luma', dur=0.3) to a bright above-water shot + removing the filter on a downbeat.
