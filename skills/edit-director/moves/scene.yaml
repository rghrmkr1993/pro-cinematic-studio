id: scene.archival
family: scene
group: aesthetics
level: B
aliases: [archive, historical footage, archival footage, found footage, old recordings, family archive, newsreel]
what: inserting real old material — newsreels, educational films, home movies and tapes, old photographs — as context, a memory or a rhythmic montage inside a modern video
frames: |
  1. Archive is recognized by the medium, not by an effect: black and white or sepia (saturation 0–73, sepia b* +19), the faded color
     of film (saturation 37) or tape softness with a color fringe; 4:3 format, softness, grain, flicker of 0.6–3 levels.
  2. A single insert: 1.2–5 s with the original sound or silence, with no grade adjustment — the contrast with the "fresh" footage is the whole point.
  3. Archival montage: cuts every 0.12–0.4 s (3–10 frames @25 fps), often to the beat; shots from different years and media mixed together.
  4. Photo series: old photographs one at a time in the center of a black frame (≈36 % of the width × 83 % of the height), changing every 0.16–0.48 s;
     the photos show margins, borders, cut edges, handwritten notes.
  5. Mosaic: 3 rows of 3–4 archival shots on black, the clips change out of sync every 0.12–0.36 s, with film light leaks and flashes on top.
variants:
  - educational or science film: a microscope, diagrams, faded blue-green color, a fade from black at the start
  - silent film: black and white or sepia, sped-up motion, scratches
  - home movie: a faded street seen from a car window, light leaks, smeared motion
  - 80s/90s tape: a sunset, running, a color fringe at the edge of the frame, a title card in a serif font
  - photo series: old portraits one at a time on a black background, to the rhythm
  - memory mosaic: a grid of archival clips with light leaks
status: footage
fallback: search the user's source footage (family films, tapes, photo scans) or the public domain, checking the rights; imitation — a fresh shot + look.film or look.vhs (in code); generation of "archival" shots only with consent and without passing them off as authentic documents
params:
  insert_length: single insert 1.2–5 s (30–125 frames); montage — 0.12–0.4 s per shot (3–10 frames @25 fps)
  photo_series: 0.16–0.48 s per photo, the photo 30–40 % of the width, centered on black, no animation or a slight zoom-in ×1.02–1.05
  mosaic: 3×3 or 3×4, black gaps of 1–3 %, the clips refresh out of sync every 3–9 frames
  aspect: native 4:3 (bars of 12.5 % on each side in 16:9) — do not stretch; vertical — crop to the center of interest
  grade: do not "modernize"; leveling the exposure is acceptable; sepia b* +15…+25 or black and white
  frame_rate: native 16–24 fps; silent film — played back at ×1.3–1.5
  audio: the archive's original sound, film crackle or silence; duck the music by 6–12 dB under archival speech
when: documentary and explainer videos (the context of an era), family and anniversary videos, nostalgic music videos, a "brand history" intro, social-cause videos; the montage — on the build to the drop, a single insert — in a pause or under the voiceover
avoid: material without rights (newsreels and stock footage with watermarks); archive footage of real tragedies used for effect; passing off generated shots as an authentic document; stretching 4:3 to 16:9; archival blocks that are too long and unconnected to the main story
sfx: projector whir, tape hiss, clicks; on a photo series — a shutter or slide projector click on each change; on a mosaic — a dense drum rhythm
genres: {explainer: allowed, drama: allowed, motivation: allowed, fanedit: allowed, teaser: allowed, calm: allowed, clips: allowed, viral: allowed}
detect: |
  Saturation ≤40 (black and white) or sepia b* +15…+25, or film flicker and grain (see look.film), or tape color
  softness (see look.vhs) — while the neighboring shots of the video are modern (sharp, 16:9, normal color): the medium
  changes at the cut. 4:3 bars (bars left/right ≈0.12), native frame rate 16–24 fps.
  ed_motion: montage — cuts every 3–10 frames; photo series — bars left/right ≈0.3 and content changes without movement.
  Difference from look.film and look.vhs: this is real old footage (the content and the medium of the era), not a filter on top of a new shot.
engine: |
  footage_search(kind='archival', tags=['bw','sepia','home_movie','tape','photo']) → clips
  + cut(at=beats) with a length of 0.12–0.4 s for the montage | cut for an insert of 1.2–5 s
  + letterbox(ratio='4:3') (native format) + speed(rate=1.4) for silent film
  photo series: photo_sequence(images, every=0.24, size=0.36, bg='black', sync='beats')
  mosaic: split_screen(layout='grid', rows=3, cols=3, gutter=0.02, stagger=0.2) + flash(color='amber', every=1.5)
  sound: sfx('projector', gain=-18) under the whole insert, duck(music, under=archive_voice)
gen_hint: authentic-looking archival footage of <scene> from the <1920s | 1970s | 1990s>, period clothing and objects, <black and white with film scratches | faded home-movie colour | VHS tape softness>, 4:3 frame, era-appropriate camera
commands: ["insert 3 seconds of archival newsreel before the drop", "a photo series of old photos, one per beat", "a mosaic of family films for the intro", "find old tape recordings in my source footage"]
related: [look.film, look.vhs, look.retro_graphics, layout.split_screen, cut.quick, time.speed_ramp]
evidence: {examples: 9, sources: 9, measured: "black and white (saturation 0–1) in 2, sepia (b* +19) in 1, faded color (37–73) in 2, tape in 2 of 9; montage — cuts every 0.2 s (5 frames @25 fps) and 0.12–0.36 s in the mosaic; photo series — a new photo every 0.16–0.48 s, photo ≈36 % of the width × 83 % of the height; flicker of 0.6–3 levels in the film ones", confidence: medium}
