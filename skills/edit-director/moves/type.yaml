id: type.vintage_title
family: type
group: graphics
level: B
aliases: [retro title, vintage title, old-film-style title, old movie title, period title, retro intro, 50s–70s titles]
what: a main title or a character introduction title in the manner of 1920s–1970s cinema — the typeface, color, size and delivery of its era over the picture, often with film grain and gate weave; instantly sets an old-movie feel and the genre
frames: |
  1. Static delivery: the title appears on a cut or with a fade-in over 0.5–0.65 s (12–16 frames @25) and holds for the whole shot,
     3.5–7 s; it leaves together with the shot via a 0.9 s dissolve (≈22 frames), less often on a cut.
  2. Large size: a title line is 18–22 % of the frame height, a 2-line block — 44–47 % of the height and 46–51 % of the width;
     a one-word poster title — one line 46 % of the height across the full width; introduction captions — 5–7 %.
  3. Placement: centered (two lines, center-aligned), the lower half of the frame (52–95 % of the height) with the lines slanting
     up to the right, or the lower left corner for "name / as the role" (two size steps, the second one 2–3 times
     larger).
  4. Color: saturated red or yellow with a black shadow or outline over a B&W or tinted frame;
     a soft cream-gold italic with a shadow over a sunny wide shot; a light gray serif inside
     an ornamental frame on black (silent film); thin turquoise small caps slowly crawling up
     (≈ 17 % of the height per second) over an aerial flyover.
  5. Film texture: grain, dust specks, gate weave (σ 0.14 % of the width and 0.32 % of the height, jolts up to 0.9 %),
     brightness flicker ≈ 1.2 %; colors slightly faded.
variants:
  - 50s genre film — a bold condensed slanted sans-serif, red or yellow, black shadow, two lines in the center or at the bottom
  - silent film — a light serif in an ornamental frame on black, a long hold of 5–10 s, a final end card
  - 70s TV style — a soft bold italic in cream gold, appearing with a 0.6 s fade-in, "name / as the role" captions
  - thin small caps — a small turquoise or white line crawls up over a landscape
  - poster fly-in — a huge bold grotesque flies into place from a larger size (×2) in 0.5 s, decelerating, the second line hits right after
  - graphic break-up — a giant full-frame word over a B&W portrait, then it is sliced into stripes that slide apart
  - secret dossier — typewritten red plates, the lines multiply and fill the screen
  - 50s–60s trailer — phrases in a bold condensed grotesque in caps with an exclamation mark fly in from a large scale in ≈0.4 s over a close-up or on black and hold for 1.5–1.9 s; at the end the title grows over the subject's face
status: code
fallback: a suitable period font from the engine's library (no third-party branded typefaces); if hand-drawn 50s lettering is needed — generate a title image with a transparent background
params:
  type_class: 50s — a bold condensed grotesque slanted 8–12°; silent — a decorative serif; 70s — a soft bold italic with rounded serifs; dossier — a typewriter monospace
  size: title 18–22 % of the height per line (up to 46 % for a single word); introduction — 5–7 %; the as-role line 2–3 times larger than the name
  position: center | lower half with slanted lines | lower left corner (margins 4–8 % of the frame)
  color: "red #e01b1b / yellow #ffd21a with a #000 shadow (offset 1–1.5 % of the height); cream gold #f0d9a0 with a soft shadow; light gray #c8c8c8 on black inside a frame"
  in: cut or fade-in 0.5–0.65 s (12–16 frames @25); fly-in ×2 → ×1 over 0.5 s outCubic
  hold: the whole shot, 3.5–7 s; silent card 5–10 s
  out: dissolve together with the shot 0.9 s (≈22 frames) or a cut
  crawl: slow rise ≈ 17 % of the height/s for thin small caps
  film_texture: grain 0.08–0.15; weave σ 0.15–0.3 % (jolt up to 0.9 %); flicker 1–1.5 %; dust specks 2–6 per frame
when: the intro and the video's main title, introducing characters as "name — as the role" at the start, parody and retro stylization, a teaser styled like an old movie trailer, a silent dialogue card between scenes in a comedy, a final end card; 1 main title + up to 3–5 introductions per video
avoid: mixing eras in one video (a silent-film frame + a 70s italic); animated modern entrances (letter by letter, glitch) in a retro font; small text over a busy background without a shadow; other people's logos and branded typefaces; holding a title for less than 2 s — unreadable
sfx: main title — an orchestral hit or a chord on the cut; silent card — projector crackle and piano; fly-in — whoosh + impact on landing; character introduction — a short jingle or a freeze-frame click
genres: {teaser: signature, fanedit: allowed, drama: allowed, epic: allowed, explainer: allowed, viral: allowed, fashion: allowed, calm: allowed, ugc: forbidden}
detect: |
  frame: large text of 18–22 % of the height per line (or 46 % per word), holding for the whole shot without letter animation;
  text color — pure saturated (red, yellow) with a black shadow, a cream italic or a light serif on black;
  high text-to-background contrast, edges softened by the film.
  time: appearance — a cut or a 0.5–0.65 s fade-in; exit — a ≈ 0.9 s dissolve together with the frame.
  texture: ed_motion on a static card — fine jitter (jitter 0.1–0.3 %), brightness flicker 1–1.5 %, grain.
  differences: modern kinetic text — animation by words and letters, rhythm to the beat; subtitles — lower third,
  4–6 % of the height, change with the lines; handwritten title — an uneven line and drawing live on screen.
engine: |
  text(content, style='retro_50s'|'silent_card'|'retro_70s_italic'|'dossier_mono', size=0.2*H, pos='center'|'lower_slant'|'lower_left',
       color='#e01b1b', shadow={'dx':0.01*H,'dy':0.01*H,'color':'#000'}, anim='cut'|'fade_in(0.6)'|'fly_in(scale=[2,1], dur=0.5, ease=outCubic)',
