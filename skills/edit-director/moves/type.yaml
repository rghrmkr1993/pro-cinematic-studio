id: type.hand_drawn
family: type
group: graphics
level: B
aliases: [handwritten text, handwriting, hand lettering, handwritten title, lettering, marker text, write-on, written live, boiling text, hand-drawn letters]
what: the text looks drawn by hand — marker, brush, pen, chalk, puffy outlined letters; a word writes itself on screen letter by letter or stroke by stroke, boils, flows into the next word or stands as a handwritten caption; a warm, personal, homemade delivery
frames: |
  1. Handwriting: an uneven baseline, identical letters drawn differently, an even marker stroke (≈1–3 % H), a brush stroke —
     with pressure and dry edges. Color — black on white or cream paper (background ≈ RGB 255/251/234, crumpled texture),
     one bright color over the footage (magenta ≈ 169/86/131, red ≈ 218/51/84, white) or multicolor (a top-to-bottom
     gradient, painterly strokes, olive gold ≈ 196/190/131 on cream).
  2. Size (by frame height H): one letter or word filling the screen — 43–84 % H; a title line — 15–19 % H; a quote caption —
     lines of ≈6 % H at a pitch of ≈10 % H, the block ≈⅔ of the width; small text along an arc — ≈3 % H; sweeping text over the footage —
     a block 83 % of the width × 51 % of the height.
  3. Entry — one of:
     - written letter by letter: 1 letter per frame @14–20 (14–20 letters/s) — a word on a board, an onomatopoeia; slowly ≈5 letters/s —
       a caption along an arc above an object;
     - letters grow one at a time with a bounce: 2–3 frames @5 per letter (0.4–0.6 s), the next one starts growing before the previous one
       has finished; a 4-letter word — in 2.4 s;
     - stop-motion: each new letter is a new photo of the note in a new place, ≈4 frames @14 (0.28 s) per letter;
     - drawing stroke by stroke: a symbol (a heart) is drawn in 9 frames @14 (0.63 s);
     - slam: the whole text appears within ≤ 2 frames @20 (≤ 0.1 s) and holds.
  4. Life: boiling — the letters are redrawn every frame @12.5–14 (mask overlap of adjacent frames 0.12–0.15) or
     only jitter (overlap ≈0.7, ink density flickers ±10 %); morph — a word flows into the next one every
     ≈0.46 s (holds 2–3 frames, 5–6 frames of transition @16.7), letters of the alphabet — 0.18 s each (2 clean frames + 1 in-between).
  5. Exit: a smear erase in 1 frame and the next word in another place on the board; flowing into the next word; text
     pinned to the sky moves up out of frame with a camera tilt; a cut.
variants:
  - written live — words on a board one letter per frame with erasing, a sticky note in stop-motion, a caption along an arc above a cloud, an onomatopoeia over a collage, a word of growing letters (5 of 17)
  - boiling handwritten title — 2–3 handwritten lines on paper or over drawn animation, redrawn every frame or jittering slightly (3 of 17)
  - handwritten morph — numbers written as words flow into one another, the alphabet in brush letter by letter, liquid letters swirl into a vortex and reassemble, puffy letters change style every 0.35–0.7 s (4 of 17)
  - static handwritten text — a quote in lines over the sky, title cards on solid colored backgrounds for 2.1–2.6 s each, sweeping text as a slam, a title in the sky that moves up out of frame with a camera tilt (4 of 17)
  - margin notes next to a speaker — a separate card, type.margin_notes (7 more examples from this section)
status: code
fallback: |
  In code — with handwritten OFL fonts (marker, brush, pen; for stroke-by-stroke writing — single-line fonts with a
  centerline) + procedural boiling and a reveal along the stroke path. Real paper, a board or a sticky note — footage: search
  the source footage for shots with notes and boards (OCR + handwriting class) or have the user shoot it; stop-motion from photos
  in different places — only from the source footage. Drawn letter animation (liquid shapes, style changes) — a generated insert
  with the user's consent; in code — simplified, via contour morphing.
params:
  type_class: marker or pen (even stroke 1–2 % H), brush (variable 2–4 % H, dry edge), chalk, puffy letters with an outline of 4–6 % of the letter height; one handwriting per series, 2–3 glyph alternates for repeated letters
  size: a word or letter filling the screen 43–84 % H; title 15–19 % H per line; caption 5–7 % H, line pitch ≈1.6 × line height; small text ≥ 3 % H (in 9:16 — ≥ 3.5 % H)
  color: "black #111 on paper #fffbea; one bright color — magenta #a95683, red #da3354, white, lemon; multicolor gradient light blue → pink → orange → yellow"
  background: paper (cream or crumpled white), a solid color, the sky or a calm shot; over busy footage — only large and with an outline
  write_on_letter: 1 letter per 1 frame @25 (fast) … 5 letters/s (slow, along an arc); stop-motion 0.28 s per letter
  write_on_stroke: a symbol in 0.5–0.7 s (12–17 frames @25) along the stroke path, ease linear
  grow_in: 0.4–0.6 s per letter from 20 to 100 % with a ×1.05 bounce, adjacent letters overlap ≈50 %
  slam: ≤ 2 frames for the whole text, hold ≥ 1.2 s
  boil: full — new noise every 1–2 frames, contour points displaced by 0.5–1.5 % of the letter height; light — 0.2–0.5 %, ink density ±10 %
  morph: a word every 0.45–0.5 s (hold 0.12–0.18 s, transition 0.3–0.36 s); a letter every 0.18 s
  erase: smear 1 frame, the next word — in another place on the surface
  safe_zone: 9:16 — top 12 %, bottom 20 %, right 12 % kept free; centered at x 0.5 or on the left with a margin ≥ 8 %
when: |
  Personal and warm: gratitude, a confession, a diary, "thank you", a note — written live on the hook or at the end;
  travel and vlogs — the name of a place or a day by hand in the intro; music videos and fan edits — a boiling handwritten title of the song or a name;
  explainer — words and diagrams on a board as the speech goes (a letter per frame, erasing between thoughts); UGC and humor — onomatopoeias
  and captions "over real life"; on the drop — sweeping text as a slam. Limit: 1–3 handwritten texts per video, one
  entry animation per series; morph and boiling — as short inserts of 1–4 s.
avoid: |
  Long handwritten paragraphs (unreadable); small handwriting in vertical below 3.5 % H; identical repeated letters —
  they give away an ordinary font; several handwritings in one video; boiling on long text for more than 4–5 s — tiring;
  writing slower than the speech; a busy background without a backing; an epic or premium tone — handwriting lowers the grandeur.
sfx: |
  A marker squeak or pen scratching over the whole writing (−18…−22 dB), a tap on every letter in fast writing; paper rustle
  on a note change; erasing — a short swoosh; slam — a hit or a clap; morph — a quiet sweep; boiling — silent
  or a light pencil rustle.
genres: {travel: signature, ugc: allowed, calm: allowed, viral: allowed, fanedit: allowed, explainer: allowed, product: allowed, fashion: allowed, teaser: allowed, drama: allowed, motivation: allowed, clips: allowed, epic: forbidden}
detect: |
  OCR finds text with an uneven baseline (spread ≥ 4–5 % of the letter height), different shapes of the same letter
  (correlation of identical glyphs < 0.8; ≈1.0 for a font) and an even marker stroke or a variable brush stroke.
  Over time: writing — the ink area grows in steps (1 letter per 1–5 frames), the right edge of the line moves;
  boiling — text-mask overlap of adjacent frames 0.1–0.7 with a static background (ed_motion: "no significant global
  motion", no holds); morph — no clean cuts, the mask changes continuously (overlap 0.1–0.5), every 0.18–0.5 s
  a new word or letter is readable; slam — text covering 10–20 % of the frame area appears within ≤ 2 frames.
  Differences: type.margin_notes — small notes as a list next to a speaker, with strikethroughs; anim.scribble — scribbles
  and lines, not words; type.kinetic — a typeset font with scale animation; type.diegetic — text on an object
  or a surface of the scene, obeying its light; type.title_card — an even font, holds without boiling.
engine: |
  text(content, style={class:'hand_marker'|'hand_brush'|'hand_pen'|'chalk'|'bubble', size:0.17*H, color:'#111',
