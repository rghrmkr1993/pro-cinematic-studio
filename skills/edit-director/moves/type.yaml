id: type.lower_third
family: type
group: graphics
level: A
aliases: [lower third, name plate, speaker caption, name title, name tag, name strap, caption plate, location caption, location tag]
what: a caption plate in the lower part of the frame — the speaker's name and role, a place or a topic — comes in half a second after their first shot, holds for 3–5 s and leaves neatly, without intruding on the interface zones or the subtitles
frames: |
  1. Trigger: the speaker's first appearance (a new voice per the speaker diarization + a face in frame), a new place or a new interview
     topic. The plate comes in 0.5–1.0 s after the start of their shot or at the first pause in speech — not on the first frame after the cut.
  2. Entry (classic, 13 frames @25 = 0.52 s / 16 @30): frames 0–3 — an accent bar 0.5 % W wide grows to the block's
     height (outCubic); frames 2–10 — the plate opens to the right from it, width 0 → 100 % (outExpo); frames 4–10 —
     the name slides out from under a mask by 2–3 % W and fades in; frames 7–13 — the role with the same motion (@30 all marks ×1.2:
     0–4, 2–12, 5–12, 8–16).
  3. Hold 3–5 s: no less than 2.5 s + 0.05 s for every character beyond 30. The block is anchored to the frame, not to the person, and stays
     still (a text drift of 0.5 % W over the whole hold is acceptable).
  4. Exit (8 frames @25 / 10 @30): reverse order — role, name, the plate collapses back to the bar (inCubic), the bar fades out;
     or an overall fade of 6 frames @25 / 7 @30. The exit ends no later than 0.5 s before the cut to another shot.
  5. Repeat: once per person in a video up to 60 s; in a long one — again if the person has not appeared for 60–90 s. One plate
     on screen; two people in frame — two plates, each on its own side, the second entering 6 frames @25 / 7 @30 later.
variants:
  - classic — a semi-transparent dark plate with an accent bar on the left, the name in bold and the role under it; opens out from the bar
  - minimal — no plate, white text with a soft shadow, an 8-frame fade-in with a 2 % W shift; documentary and premium tone
  - color block — a solid plate in the accent color with black text, the role as a separate pill below, offset by 1–2 % W; slides in from the edge over 8 frames; UGC and product
  - place and time — small letter-spaced caps reading "city · month year" with a pin icon, no plate; a statement phrase about a time skip at the start of a scene is type.intertitle
  - topic or segment — one topic line above the subtitles for the duration of the answer block ("about money", "mistake no. 1"); interviews and clips
  - author handle — @handle under the speaker in UGC and clips, without platform logos
  - next to the subject — in vertical the plate sits by the speaker's shoulder (face tracking with smoothing) if the bottom of the frame is taken by subtitles
status: code
fallback: |
  Names, roles and places come from the user (or from captions in the script); the engine does not invent them — without data it places a template
  with empty fields and asks. The moment of appearance — from speaker diarization (who is speaking, edit-voice) and the face detector;
  without diarization — the first appearance of a face in a shot longer than 2 s. A light, busy background — the plate is mandatory (or darken
  the bottom of the frame with a 0 → 40 % gradient).
params:
  type_class: "name — grotesque 700 (semibold or bold), sentence case or caps with tracking +3–6 %; role — the same grotesque 400–500, optionally small caps with tracking +8 %; minimal style — grotesque 600 or serif 500 for a documentary tone; Cyrillic glyphs required; font size = em size"
  size_16x9: "name — font size 4.0–5.0 % H (43–54 px @1920×1080), typically 4.5 %; role — 0.62–0.70 of the name's font size (≈ 2.5–3.5 % H, typically 3 %); plate — height 9–12 % H, width fitted to the text + padding, no wider than 45 % W"
  size_9x16: "name — font size 2.8–3.6 % H (54–69 px @1080×1920), typically 3.2 %; role — 1.9–2.4 % H (no smaller than 1.8 % H); block width ≤ 70 % W"
  text_limits: "16:9 — name ≤ 28 characters, role ≤ 36; 9:16 — name ≤ 20 characters, role ≤ 30; one line each; shorten a long role instead of wrapping it"
  position_16x9: "left-aligned; left edge x 0.06–0.10 W (margin ≥ 5 %); block bottom y 0.84–0.88 H; with subtitles — block bottom ≤ subtitle top − 2 % H (≈ 0.78 H); a second person on the right — mirrored, right edge ≤ 0.94 W"
  position_9x16: "left edge x 0.06–0.08, right edge ≤ 0.88 (the right 12 % are buttons); without subtitles — block at y 0.66–0.78 (bottom ≤ 0.80, the bottom 20 % is interface); with subtitles (0.62–0.78) — above them, y 0.48–0.60 if it does not touch the face, otherwise the top band y 0.13–0.24 (the top 12 % is interface)"
  color: "name #FFFFFF; role #C9CDD2 or white at 75 %; plate #000 at 60–70 % opacity (or solid #111); accent bar — a color from the video's palette or #FFC400, width 0.4–0.6 % W; on a light frame — plate #FFFFFF at 90 % and text #111; contrast ≥ 4.5:1"
  plate: "padding 0.6 × font size on the sides and 0.35 top and bottom; corner radius 0 (strict style) or 0.15–0.2 × font size (soft); leading 1.15–1.25"
  in: "classic 13 frames @25 / 16 @30 — bar frames 0–3 (outCubic), plate 2–10 (outExpo), name 4–10 (mask + 2–3 % W shift, outCubic), role 7–13; @30 — 0–4, 2–12, 5–12, 8–16; minimal — fade-in 8 frames @25 / 10 @30 + 2 % W shift (outCubic), role 3 / 4 frames later"
  hold: "3–5 s (75–125 frames @25 / 90–150 @30); rule ≥ 2.5 s + 0.05 s per character beyond 30"
  out: "8 frames @25 / 10 @30 in reverse order (inCubic) or fade 6 frames @25 / 7 @30; the exit ends ≥ 0.5 s before the cut"
  timing: "entry 0.5–1.0 s after the start of the speaker's shot or at the first pause in speech ≥ 0.2 s (from word-level timestamps); in a video with music — shift the entry to the nearest beat if it is within ±0.25 s"
  frequency: "1 time per person in a video up to 60 s; one plate on screen (two people in frame — 2, the second entering after 6 frames @25 / 7 @30)"
when: |
  Speech genres: the first appearance of an expert, a guest, an interviewee or the author (explainer, clips, UGC review,
  product with an expert, sport — a post-game interview); a place caption at the start of an episode (travel, documentary tone);
  the block topic in a long interview. Place it 0.5–1 s after the start of the shot, on a pause in speech; in a music video — on the beat.
  Hook (first 1–2 s) — usually no plate, it distracts from the hook; place it from 2–4 s on, once the viewer has stayed.
  Outro — do not introduce new plates (a name at the end is not remembered; the team at the end — type.credits). In music
  genres — only a minimal place or subject caption, in the build, not on the drop. Limit: 1 time per person, one plate
  on screen.
avoid: |
  The bottom 20 % and the right 12 % in 9:16 (the buttons and the platform caption will cover it); overlapping subtitles, the mouth and the chin;
  a plate that survives a cut to another shot (it jumps over the new frame); a long role in two lines; more than two
  typefaces and three sizes; a broadcast package with a ticker and bugs — that is look.news; entering on the first frame after a cut
  and leaving on the last one; invented names and job titles; platform and brand logos next to a handle; a plate on the drop and
  in fast cutting; phonk — a documentary caption breaks the aggressive music-video tone.
sfx: |
  Usually silent. In dynamic editing — a soft short sfx.whoosh (−20…−24 dB under the voice) on the plate opening,
  align='attack'; in a music video — entry on the beat, no separate sound needed.
genres: {explainer: signature, clips: signature, ugc: allowed, product: allowed, sport: allowed, motivation: allowed, drama: allowed, travel: allowed, viral: allowed, epic: allowed, calm: allowed, teaser: allowed, fashion: allowed, phonk: forbidden, fanedit: forbidden}
detect: |
  Text detector: a block of 1–2 lines left-aligned at a 5–10 % W margin (or right-aligned at 90–95 % W) in the lower band
  (16:9 — 0.72–0.90 H; 9:16 — 0.48–0.80 H or the top 0.13–0.24 H), the top line 1.4–1.6 times larger than the bottom one; often
  a solid semi-transparent rectangle under the text (brightness under the plate 30–60 % lower than the surroundings) and a narrow
  vertical accent-colored bar at the left edge. Over time: appears 0.5–2 s after a cut, the box width
  grows over 6–12 frames (opening) or the alpha over 6–10 frames, holds still for 2.5–6 s and leaves before the cut;
  repeats ≤ 1 time per person. ed_motion: over the hold overlay-mask 0.02–0.12 (static graphics on a
  moving shot), global motion — same as the shot's; the same shot is usually frame.interview or address.direct.
  Differences: type.subtitles — centered, changes with the lines every 1–3 s; type.intertitle — a phrase about time or place
  at the top or in the center, no plate, enters on a cut; look.news — a full-width band of 15–22 % H with a ticker
  and an on-air bug; type.credits — "role — name" lists at the end; gfx.callout — a line or an arrow to an object;
  type.margin_notes — handwritten typing next to the subject (including a name above the head); type.title_card — a large title
  in the center; type.vintage_title — a "name / as the role" introduction in a period typeface, 5–7 % H, no plate and no entry
  animation; frame.interview — the interview framing itself, the plate is only its dressing.
engine: |
  lower_third(name, role=None, kind='plate'|'minimal'|'block'|'location'|'topic'|'handle', side='left'|'right'|'auto',
              anchor='frame'|track(face, offset=[0.0, 0.18*H], smooth=0.2),
              style={class:'grotesk', weights:[700, 450], name_h:0.045*H (16:9) | 0.032*H (9:16), role_ratio:0.66,
                     color:'#FFFFFF', role_color:'#C9CDD2', plate:{color:'#000', alpha:0.65, pad:[0.6, 0.35], radius:0},
                     accent:{color:accent_from_clip(clip)|'#FFC400', w:0.005*W}},
              anim_in='bar_grow(fr=[0,3], outCubic)+plate_wipe(fr=[2,10], outExpo)+text_slide(name fr=[4,10], role fr=[7,13], dx=0.025*W, outCubic)',
              hold='auto', anim_out='reverse(8fr, inCubic)'|'fade(6fr)',
              t0=speaker_first_seen(person)+0.6 → snap_to_pause(0.3) → snap_to_beat(0.25),
              pos=auto_lower_band(aspect, subtitles=bbox, faces=track(face)), safe_zone='tiktok')
  — new primitive; animation frames are given @25 and for 30 fps are multiplied by 1.2 with rounding (13 → 16, 8 → 10, 3 → 4).
  speaker_first_seen(person) — new: the first appearance from speaker diarization (edit-voice) and the face detector.
  auto_lower_band(aspect, subtitles, faces) — new: picks the band in 9:16 (above the subtitles or the top one) without covering the face.
  + sfx('whoosh', at=t0, gain=-22dB, align='attack') optional.
  checks: qa_text_safe_zone(layout='tiktok'); qa_overlap(face|subtitles); qa_cut_crossing(layer, max=0) — new.
