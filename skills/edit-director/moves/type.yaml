id: type.beat_text
family: type
group: graphics
level: B
aliases: [beat text, beat-synced text, text to the beat, text on the beat, words on beats, word per beat, text hits, words on the kick, lyric hits, word on beat]
what: kinetic text to music — words and short lines land exactly on the track's beats, hit on downbeats and the kick and get denser toward the drop; timing comes from the beat grid, not the voice
frames: |
  1. Grid: the engine takes the beats, downbeats and kick hits from the track analysis and lays the words out into slots — a bar,
     ½ bar, a beat or a half-beat. At 120 BPM a beat = 0.5 s = 12.5 frames @25 / 15 @30, a bar = 2 s = 50 / 60 frames.
     Each word's entry frame = round(beat timestamp × fps) — from its own timestamp, with no accumulated error; entry on the beat
     frame or 1 frame earlier.
  2. Hit entry: the word appears whole, instantly at ×1.15–1.25, and settles to ×1.0 over 3–4 frames @25 (4–5 @30) (outExpo).
     On a downbeat it is a slam: ×1.4–1.6 → ×0.97 over 3 frames → ×1.0 over another 2 frames, sometimes with a white frame for 1–2 frames
     and a frame shake of 1–1.5 % H.
  3. Hold — until the next slot. A word that stays longer than one beat pulses on every kick: ×1.05–1.08 over
     1 frame and back over 4–6 frames @25 (5–7 @30, outQuad); the pulse strength follows the loudness of the hit.
  4. Assembly: words accumulate on beats 1-2-3-4 — as a line from left to right or as a stack from top to bottom; on the downbeat
     of the next bar everything is wiped in 1 frame, or the assembled phrase holds for one more bar and leaves on the one.
  5. Acceleration into the drop: in the last 2–4 bars of the build the grid gets denser, following the riser — bar → ½ bar → beat →
     half-beat (half-beat only up to 125 BPM, otherwise the acceleration ends on the beat); the last beat before the drop is empty
     (a frame without text, or black), on the drop's downbeat — one huge word as a slam, holding for 1–2 bars or until
     the first cut.
  6. Exit: a hard switch on the frame of the next slot (0 frames) — the default; at the end of a phrase — a burst to ×1.3 with opacity
     going out over 2 frames exactly on the downbeat.
variants:
  - word per beat — one word in the center, a hard switch on every beat, hit ×1.2 → ×1.0; the backbone of the hook and the build
  - line assembly — 2–4 words are added to a line beat by beat, on the one of the next bar the line is wiped
  - stack — 3–4 one-word lines grow from top to bottom (one line per beat), leading 0.95 × font size, reset on the one
  - pulse on a held word — one word holds for 1–2 bars and breathes on the kick ×1.05–1.08, changes color on the snare
  - outline ↔ fill — the same word switches from a solid fill to an outline every beat or half-beat; 1–2 bars before the drop
  - jumping positions — on every beat the word lands at a new spot out of 3–4 safe-zone anchors (top, center, bottom, left, right)
  - acceleration and slam — bar → ½ → beat → half-beat, an empty beat and a huge word on the drop's downbeat
  - word cards — cuts footage ↔ black card with a word on the beats (card 1 beat, footage 1–3 beats); phrase cards of 1.5–2 s each are type.intertitle instead
status: code
fallback: |
  Only text is needed — words from the user (a slogan, a list, a song line they sent) or 2–6 keywords
  from the script that the engine suggests; we do not put lyrics of other people's songs into the library and do not transcribe them. If the beats in the track
  are hard to read (rubato, ambient without drums) — a grid from strong onsets or from manual bar marking; no hits
  at all — do not use the move, take type.kinetic (to the voice) or type.title_card. Background — a dark calm shot or
  a 30–45 % darkening; no suitable shot — a black or colored card.
params:
  grid: "slot = bar | ½ bar (1/2) | beat (1/4) | half-beat (1/8); take the shortest unit whose slot ≥ 0.35 s: up to 85 BPM — half-beat, 86–170 BPM — beat, above 170 BPM — ½ bar; one step coarser in the verse and the intro"
  slot_frames: "120 BPM — half-beat 0.25 s = 6.25 frames @25 / 7.5 @30; beat 0.5 s = 12.5 / 15; ½ bar 1 s = 25 / 30; bar 2 s = 50 / 60; entry frame = round(t_beat × fps), error ≤ 0.5 frame (20 ms @25, 17 ms @30), no accumulation"
  lead: "−1 frame (−40 ms @25, −33 ms @30) — the word lands one frame before the hit; the slam on the drop — exactly on the downbeat frame"
  min_on: "a word of 1–5 letters ≥ 6 frames @25 (0.24 s) / 8 @30 (0.27 s), +0.04 s for every letter beyond 5 (10 letters ≥ 0.45 s); a word longer than its slot takes two slots in a row"
  rate: "on average ≤ 3 words/s, in any 2 s window ≤ 4 words/s; half-beat for no more than 2 bars in a row, only in the acceleration before the drop and only if the slot ≥ 0.24 s (up to 125 BPM); on a faster track the acceleration ends on the beat"
  type_class: "condensed extra-bold grotesque in caps, 800–900, tracking −1…−3 % — the base; wide black grotesque 900 — for words of ≤ 5 letters; display faces (blackletter, spiky, chrome) — only for the slam word on the drop; one typeface per series, Cyrillic glyphs required; font size = em size, cap height ≈ 0.7 × font size"
  size_16x9: "one word over footage — font size 18–30 % H (typically 22 % ≈ 240 px @1920×1080), on a card 28–40 % H; a line of 2–4 words 9–12 % H; stack 10–14 % H per line, leading 0.95–1.0 × font size; slam 40–60 % H, width ≤ 90 % W"
  size_9x16: "size by width — one word 60–80 % W (≈ 8–16 % H depending on word length, no more than 16 % H except the slam); slam up to 84 % W; a line of 2–3 words ≤ 76 % W; stack 7–10 % H per line; never smaller than 5 % H"
  position: "16:9 — x 0.5, line center 0.46–0.52 H, margins ≥ 5 %; 9:16 — center x 0.47, everything inside y 0.12–0.80 and x 0.06–0.88 (top 12 %, bottom 20 % and right 12 % are taken by the interface), jump anchors y 0.24 / 0.46 / 0.68; never over a face — use the face mask to move to a free anchor"
  color: "white #FFFFFF on dark; one accent — yellow #FFE600 (viral), red #FF1E3C (phonk, sport) or a color from the frame (fan edit, fashion); accent only the downbeat word or the key word, no more than 1 word per bar; slam — inversion for 1–2 frames (black text on a white field); outline — a stroke of 4–6 % of the font size with no fill; contrast to the background ≥ 4.5:1, otherwise a darkening"
  in: "hit ×1.15–1.25 → ×1.0 over 3–4 frames @25 / 4–5 @30 (outExpo) | slam ×1.4–1.6 → ×0.97 → ×1.0 over 3 + 2 frames @25 / 4 + 2 @30 | fall from above by 6–8 % H over 3 frames @25 / 4 @30 (outCubic) | cut"
  out: "cut on the frame of the next slot (default) | burst ×1.3 and opacity 1 → 0 over 2 frames @25 / 2–3 @30 on the downbeat"
  accents: "downbeat — slam or color inversion; snare (beats 2 and 4, onsets 1.5–8 kHz) — ×1.05 and a color change; kick (onsets 40–120 Hz) on a held word — pulse ×1.05–1.08 over 1 frame, return over 4–6 frames @25 / 5–7 @30 (outQuad), amplitude proportional to onset strength"
  drop: "the last beat before the drop without text (optionally a black frame); slam on the downbeat frame; white flash 1–2 frames; shake 1–1.5 % H decaying over 6 frames @25 / 7 @30; hold for 1–2 bars, then 2–4 bars without text"
  scrim: "a 30–45 % darkening under the text or a radial gradient 0 → 50 % toward the center, if the text-to-background contrast < 4.5:1"
  limits: "beat text ≤ 30 % of the runtime; slam ≤ 1 per drop and ≤ 2 per video; a new phrase only from a downbeat and from the start of a 4- or 8-bar phrase of the track; flashes ≤ 3 per second"
when: |
  Music genres. Hook (first 1–2 s): 2–4 words on the beats state the theme right away — word per beat over the first shot.
  Build: line assembly or a stack on the beats, together with the track's 4-bar phrases; the last 2–4 bars — acceleration following the
  riser (bar → ½ → beat → half-beat). Drop: an empty beat and a one-word slam on the downbeat, then 2–4 bars
  without text — the picture does the work. Outro: the last word on the final downbeat, holding for a bar (for the loop in viral).
  Verse — sparser (½ bar or a bar), chorus — on the beat. Explainer — only in a music intro without voice.
  Limits: ≤ 30 % of the runtime, slam ≤ 1 per drop, half-beat ≤ 2 bars in a row.
avoid: |
  Over speech or vocals the viewer must understand: two timing grids — voice and beat — compete (use type.kinetic
  or type.karaoke there); tracks without clear hits (ambient, rubato); words shorter than 6 frames @25 (8 @30), half-beat longer than
  2 bars or on a track faster than 125 BPM — unreadable, it flickers; a different animation and font for every word (except
  the slam); an entry off the beat by more than 1 frame; a word that starts before a downbeat and carries over it; a pulse on
  every bar in a row — causes motion sickness; text over a face without a darkening; a calm, meditative tone; flashes more often than
  3 per second (a risk for photosensitive viewers).
sfx: |
  The track itself leads the sound: the words land on its beats, a separate sound per word is not needed (at most a quiet tick
  at −20…−24 dB under the music in the line assembly). Slam on the drop — sfx.impact or sfx.sub_drop exactly on the downbeat
  (align='attack'); acceleration — sfx.riser over the last 2–4 bars of the build if the track has no riser of its own; phrase burst —
  a short sfx.whoosh that ends on the downbeat.
genres: {teaser: signature, fanedit: signature, viral: allowed, phonk: allowed, epic: allowed, drama: allowed, product: allowed, sport: allowed, travel: allowed, fashion: allowed, motivation: allowed, explainer: allowed, calm: forbidden, clips: forbidden, ugc: forbidden}
detect: |
  Text detector or per-frame OCR: the text box changes its content abruptly within 1 frame, the intervals between changes are multiples
  of the beat period (an interval histogram peaking at ½, 1, 2 and 4 beats; at 120 BPM — 0.25 / 0.5 / 1 / 2 s); ≥ 80 % of the changes
  fall within ±1 frame of the beats found in the audio (onset-based beat tracking), new phrases — on downbeats. After a change
  the box height goes ×1.15–1.6 → ×1.0 over 3–5 frames; on a held word the height oscillates by 4–8 % in time with the kick. Before the drop
  the change intervals halve every 1–2 bars, then an empty beat and a large box ≥ 35 % H (16:9) on the downbeat.
  ed_motion: on a text card — holds between changes with lengths that are multiples of the beat; on the slam — flash frames and a spike in shake
  jitter; for word cards — cuts on every beat and a low median card brightness (luma 10–40).
  Differences: type.kinetic — changes follow the syllables and words of speech (irregular intervals that match the voice onsets, not
  the beat grid); type.karaoke — the line holds, a highlight runs across the spoken words; type.subtitles — phrases of 1–6 s at the bottom;
  type.repeat — one word multiplied in a loop; type.title_card — one block holds ≥ 1 s; type.intertitle (trailer
  cards) — phrases of 2–4 words for 1.5–2 s; cut.flash — images change on the beats, not words.
engine: |
  kinetic_text(words=user_words|lyrics_user|slogan, sync='beats',
               slots=slot_plan(words, beats=beat_sync(event='word_in', grid='1/4'), min_slot=0.35, min_on='6fr@25|8fr@30',
                               schedule=[{part:'verse', unit:'1/2'}, {part:'build', unit:'1/4'}, {part:'pre_drop', unit:'1/8', max_bars:2}],
                               lead=-1fr, phrase_start='downbeat', max_rate=4),
               layout='single'|'line_build'|'stack_build'|'jump(anchors=[[0.47,0.24],[0.47,0.46],[0.47,0.68]])'|'cards',
               style={class:'grotesk_condensed_black', weight:900, caps:True, tracking:-0.02,
                      size:0.22*H (16:9) | fit_width(0.76, max=0.16*H) (9:16), color:'#FFFFFF', accent:accent_from_clip(clip)|'#FFE600'},
               anim_in='hit(scale=[1.2, 1.0], dur=4fr@25|5fr@30, ease=outExpo)', anim_out='cut',
               accents={downbeat:'slam(scale=[1.5, 0.97, 1.0], dur=[3fr, 2fr])'|'invert(2fr)',
                        snare:'bump(1.05)+color(accent)', kick:'pulse(amp=0.06, back=5fr, ease=outQuad, gain=onset_strength)'},
               scrim=0.35, safe_zone='tiktok')
  — new kinetic_text parameters: slots, accents; new primitive slot_plan(...) — quantizes the words to the grid, computes the entry
    frame from each beat's timestamp, merges slots for long words, enforces the words-per-second limit.
  drop: flash(color='black', t=drop-1beat, dur=1beat) optional
        + text(word, style='display', size=0.5*H | fit_width(0.84), anim='slam(scale=[1.6, 0.97, 1.0], dur=[3fr, 2fr])', t=[drop, drop+1bar])
        + flash(color='white', t=drop, dur=2fr) + shake(amp=0.012*H, freq=12, t=[drop, drop+0.25], decay='exp')
        + sfx('impact', at=drop, align='attack').
  outline ↔ fill: text_style_cycle(styles=['fill', 'outline(w=0.05)'], every='1/4'|'1/8', t=[drop-2bar, drop]) — new primitive.
  kick and snare for accents: onsets(track, band=[40, 120]) and onsets(track, band=[1500, 8000]) on beats 2 and 4 —
  new primitive onsets(track, band) on top of the track analysis (band-pass filter + envelope + peaks).
  checks: qa_beat_sync(text_events, beats, tol=1fr) — new; qa_text_safe_zone(layout='tiktok'); qa_flash_rate(max=3) — new.
gen_hint: dark moody background plate for bold beat-synced typography, slow-moving <subject or abstract texture> with a large calm negative space in the center, low contrast, deep shadows, static or slowly drifting camera, no text, no letters
commands: ["slogan words one per beat in the hook", "assemble the line beat by beat in the build and clear it on the one", "speed the text up into the drop and slam a huge word on the drop", "make the word pulse to the kick for two bars", "alternate outline and fill every other beat before the drop"]
related: [type.kinetic, type.karaoke, type.repeat, type.title_card, type.intertitle, cut.flash, cut.quick, shake.beat, trans.flash, zoom.in_out, sfx.impact, sfx.riser]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
