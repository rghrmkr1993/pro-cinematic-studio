id: type.diegetic
family: type
group: graphics
level: C
aliases: [diegetic text, in-world text, text in the scene, 3D tracked text, text on a wall, tracked text, material letters]
what: the text exists inside the world of the frame — printed on an object, written on a wall, emerging from the scene's material — and obeys the scene's perspective, light, motion and occlusions instead of hanging on the screen as a flat plate
frames: |
  1. Carrier: an object or a surface of the scene that the camera shows anyway — a ball, a sign, a screen, a wall, the floor,
     the sky; or an action of the subject from which the letters are born (a gum bubble, a splash, smoke). The carrier takes 5–30 %
     of the frame width and is within the focus zone.
  2. Text on an object: the text covers ≈70 % of the object's visible side (2 lines — a large handwritten one + a small
     line in another color), bends to its shape and moves with it: the object approaches from ≈7 to ≈28 %
     of the frame height in ≈1 s (21 frames @20), the text is readable for ≈2 s and turns out of view as the object rotates, over ≈1.2 s. The camera
     follows the object, not the text.
  3. Letters from a material: a bubble ≈27 % of the width grows on the subject's face for ≈0.6 s, pops in 2–3 frames @25
     (the splatter flies out to ≈70 % of the width), the splatter gathers into volumetric inflatable letters in ≈10 frames (0.4 s) —
     letter area 6.9 → 12.3 % of the frame; the final block is 2 lines of ≈17 % H each, 55 % of the width × 37 % H, center x≈0.48,
     between the camera and the subject; the letters are lit by the room's light (highlights from the ceiling lamps) and sway slightly.
  4. Text on a surface (edit practice): the word is stuck by tracking to a wall, the floor, the sky or a screen, compresses
     with the perspective, darkens and brightens together with the surface, people walk in front of it; it leaves with the shot.
  5. Hold — while the carrier is in frame (1.5–4 s); exit — by the object rotating or moving away, by a cut, by leaving the frame.
variants:
  - text on an object — a name or a word printed on a ball, a can, a T-shirt; the camera follows the object, the text bends to its shape and leaves with a turn
  - letters from a material — an action of the subject (a gum bubble, a splash, smoke) turns into volumetric letters made of the same material that stay hanging in the room
  - text on a surface — a place name on a facade, a word on the floor or in the sky, with tracking and perspective (edit practice)
  - "found text — a sign, a shop sign, a note or a screen in the source footage becomes a title: zoom-in, freeze frame, highlight (edit practice)"
status: hybrid
fallback: |
  Found text — footage: search the user's source footage with OCR (signs, screens, text on objects) and use it
  as a title. Text on a surface — plane tracking (homography) + a text layer with a blend mode driven by the surface's
  brightness; occlusion by the foreground — a mask (mediapipe or remove_background). Text on a moving object —
  object tracking and a wrap to its shape (sphere, cylinder); with complex rotation — generation. Letters from a material —
  video generation with the user's consent; without it — 2.5D letters with volume, a highlight and a shadow, attached to the floor by tracking.
params:
  carrier: an object 5–30 % of the frame width within the focus zone | a plane (wall, floor, sky, screen) ≥ 15 % of the frame without heavy occlusion
  text_coverage: on an object ≈70 % of the visible side; on a wall 30–70 % of the plane's width
  type_class: whatever is natural for the carrier — handwritten or printed on objects, bold grotesque or small caps on facades, inflatable rounded letters for material letters
  size: on an object — to fit the object (2–10 % H per line in frame); on a surface 8–25 % H; material block 2 × ≈17 % H, ≈55 % of the width
  tracking: homography on the plane, error ≤ 0.3 % of the frame per step (otherwise it drifts); on an object — shape tracking, rotating together with it
  look_match: light — multiply by the surface brightness (text contrast 0.6–0.9 of the flat version); sharpness — same as the carrier (the same depth-of-field blur); motion blur — from the track velocity; grain and noise — same as the frame
  occlusion: everything closer than the carrier (people, hands, branches) goes over the text via a mask
  material_in: pop 2–3 frames + assembly from the splatter ≈10 frames (0.4 s), sway ±2 % with a period of ≈1 s
  hold: while the carrier is in frame, 1.5–4 s; readability ≥ 1 s
when: |
  Intro and character introductions: a place name on a facade or in the sky (travel), the subject's name on a sign, a T-shirt or a ball
  (sport, fan edit), the product name on the product itself (product), the title of a music video made from an action of the subject (a bubble,
  smoke, paint) on the first hit. Dramatic — a note or a screen the subject is reading. When you want "a title without
  a title": the world itself shows the word. Limit: 1–2 times per video.
avoid: |
  Text that does not hold the perspective and light — it looks like a sticker; tracking jitter above 0.3–0.5 % of the frame; text
  sharper or brighter than the carrier; other people's logos, brands and real names on objects (only your own or neutral words);
  long phrases; small text in vertical (below 3.5 % H it is unreadable); a carrier moving faster than the text can
  be read (less than 1 s in frame).
sfx: |
  The sound of the action itself: the bubble's pop, a splash, the squeak of inflatable letters; for an object — its own sound (a ball hit,
  the whistle of flight); text on a wall — no separate sound, or a light accent when it appears in frame.
genres: {travel: signature, teaser: allowed, fanedit: allowed, product: allowed, fashion: allowed, viral: allowed, drama: allowed, sport: allowed, epic: allowed, explainer: allowed}
detect: |
  The text box (OCR) is not a screen-aligned rectangle but a quadrilateral following the surface's perspective or an arc following the shape
  of the object; its shift and scale match the motion of the nearby background or object (not the screen); the brightness and sharpness
  of the letters change together with the carrier; the foreground occludes the letters. ed_motion: no static graphics layer
  (low overlay-mask), the text moves with the global or local motion.
  Differences: type.title_card and type.kinetic — a screen layer, flat and evenly lit; type.behind_subject — a flat
  graphics layer between the background and the subject that does not obey the scene's light; gfx.floating_ui — flat interface bubbles;
  layout.screen_in_screen — a screen with video in the frame, not text.
engine: |
  found: ocr_find(clips, min_h=0.03*H, max_skew=30°) → title candidates (zoom transform to the box + freeze(at, 1.0) optional).
  surface:     tr = track(kind='planar', region=<quad of wall|floor|sky>, method='homography', max_err=0.003*W)
               text(content, style=<per carrier>, warp=homography(tr), blend='multiply'|'overlay', shade=surface_luma,
                    blur=match_sharpness(region), motion_blur=velocity(tr), grain=match) + composite(occluders=mask('mediapipe_person'|'hf_remove_background'))
  object: text_wrap(content, surface='sphere'|'cylinder', track=track(object:<object>), coverage=0.7, rotate_with=True) — new primitive.
  material: material_text(content, material='balloon'|'liquid'|'chrome', burst_from=track(object|face), pop=3fr, form=10fr, wobble={amp:0.02, period:1.0},
            light=estimate_light(clip), shadow=True, anchor=track(kind='planar', region=floor)) — 2.5D; or generation (gen_hint) with consent.
gen_hint: a person in a stylized room blows a big bubble of pink gum that pops and turns into large puffy 3D balloon letters spelling <word>, the letters hang in the air in front of them, lit by the room lights, static wide shot, cinematic
commands: ["the place name right on the building wall with tracking on #1", "the subject's name on a sign in the frame instead of a title", "gum letters fly out of the bubble on the first hit", "find shots with text in the source footage and use them as chapters"]
related: [type.title_card, type.behind_subject, type.kinetic, gfx.floating_ui, layout.screen_in_screen, pov.screen, product.hero, anim.live_mix, type.hand_drawn]
evidence: {examples: 2, sources: 2, measured: "text on an object: the ball with text grows from ≈7 to ≈28 % of the frame height over 21 frames @20 (≈1 s, from the object's color mask), text ≈70 % of the visible side in 2 lines, readable for ≈2 s, leaves by rotation in ≈1.2 s (coverage and exit — by eye, ≈); letters from a material: bubble ≈27 % of the width, pop in 2–3 frames @25, splatter up to ≈70 % of the width, letter assembly ≈10 frames (area 6.9 → 12.3 % of the frame), block x 0.20–0.75, y 0.30–0.67; text on a surface and found text — from edit practice, no examples in this section", confidence: low}
