  letter growth: write_on(mode='grow', per_letter=0.5, overlap=0.5, overshoot=1.05)
  boiling: boil(layer, amp=0.01*letter_h, every=1|2 fr, density_flicker=0.1, seed='per_frame') — new primitive
  morph: text_morph(words=[...], per=0.48, hold=0.15, font='single_stroke', interp='path') — new primitive
  erase: erase(kind='smear', dur=1fr) + the next word in another place; background: paper(texture='cream'|'crumpled')
  in the sky or on a wall: track(kind='planar', region=sky|wall) + text(..., warp=homography) — as in type.diegetic
  + sfx('scratch', at=t0, gain=-20dB) for the writing, sfx('click') per letter
