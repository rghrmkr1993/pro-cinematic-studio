id: type.kinetic
family: type
group: graphics
level: C
aliases: [kinetic typography, kinetic text, animated text, motion typography, one word at a time, voice-synced text, word-by-word text, lyric text, text in rhythm]
what: text becomes the main event of the frame — words and letters appear, jump, stretch, flip and replace each other in the rhythm of the voice or the music, 1–3 words per screen
frames: |
  1. Background: usually a solid color (black, dark, white, a saturated color) or a calm shot; the camera is static. Text — in the center
     (line center at 46–50 % H vertically, x = 0.5) or as a block in a corner with letters running off the frame edge.
  2. Word entry — on its syllable or beat, 0–2 frames before the sound: pop — scale ×0.9 → ×1.07 over 3 frames → ×1.0
     by the 6th–7th frame (outBack), with no stroke or shadow on the first frame, they grow in over 2–3 frames; letter cascade — one
     letter every 1–2 frames, each letter's baseline jumps by ±30 % of the line height and settles into place; decoder — random
     characters and white plates for 6–25 frames per line, then clean text; stretch — the word grows out of a horizontal
     line (height ×0.1 → ×1) or flips around the horizontal axis, with smear stripes.
  3. Hold: at speech pace 8–13 frames @25 per word (0.32–0.52 s, on average ≈10 frames = 0.4 s); a phrase
     builds up word by word ("word" → "word word" → the full phrase: 4 / 1 / 7 frames @32); in an ad list
     ≈12 frames @32 (0.37 s) per item; in a music assembly — one word per 3–3.5 s (assembly ≈3 s + hold 0.45 s);
     in a strobe — 1 frame @20 (50 ms) per state.
  4. Exit: in 2/3 of the examples — a hard switch to the next word (0 frames); otherwise the letters scatter and fall out
     over 3–5 frames, the letter spacing collapses or spreads over 8 frames @32 (0.25 s), a title leaves with a zoom
     through a letter over 4–5 frames @20 (0.2–0.25 s) straight into the next shot.
  5. Size (line height including ascenders and descenders, % H): one word per screen 31–47 % H (a long word — up to 90–96 % of the width,
     the same font size for all words in a series); slogan phrase 9–14 % H; small captions and lists 4–12 % H; full-frame
     strobe — a band of 29–36 % H jumping between the upper, middle and lower thirds, or letters 95–100 % H with cropped edges.
variants:
  - word by word with a pop — one bold rounded word ≈35 % H in the center, an extruded outline, changing every 8–13 frames @25 to speech or vocals
  - phrase word by word — a small bold grotesque 10–12 % H (lowercase), words are added to the line, each enters with a shift of 10–12 % of the width over 3 frames; a list of product features
  - letter cascade — letters fly in one at a time (12–25 letters/s, up to 60 in the fast version), each from its own height, then the tracking tightens; exit — the letters fall out downward and upward over 3–5 frames
  - decoder — a tall condensed grotesque in small caps 7–11 % H, the lines cycle through random characters under running white plates, one column per ≈1 s; light variant — three rows of black role — name lines on light gray, the words emerge from black plates, arrows and arcs get drawn next to them, assembly ≈1 s
  - display-font assembly — each word in its own typeface and color (serif, swash italic, blackletter, a ragged font) grows out of a stripe or flips 2–3 times over ≈3 s, holds 0.45 s and disappears in 1 frame
  - strobe — huge words in a fiery gradient with horizontal smear change every frame, intercut with close-ups of a face for 1–5 frames
  - flip between two words — a tall condensed grotesque 45 % H in the center on a colored background, the drum rotates for 0.5–0.7 s, the word holds 0.4–0.6 s, loop 2.7 s
  - "countdown — digits 3-2-1 made of horizontal stripes slanted ≈10°, each ≈0.35 s (≈9 frames @25), continuously shrinking: 96 → 47 % H, 45 → 35 %, 33 → 23 % (outExpo)"
  - lines into letters — colored route lines bend into the letters of a word in 0.75 s, the word holds 0.3 s and unravels back into lines
  - breathing weight — letters shift in a wave from ultra-bold to hairline and back (variable font), loop ≈4 s
  - breakthrough title — two lines of a harsh spiky font at ≈2 × 28 % H fly in as shards over 2–3 frames, hold 1.2 s, a zoom through a letter leads into the next shot
  - dripping logo — a wordmark emerges through dripping pixel stripes over ≈2.8 s, the background switches from white to dark midway through the assembly
  - weightless letters — the letters of a short phrase float and rotate individually (±30°, ±20 % scale) without forming a line
status: code
fallback: live textures (pixel drip, letters made of material, a volumetric drum) without 3D — a flat version in code (stripe shift, scaleY, sine remap) or a generated insert with an empty background; text over a face — move it to an empty part of the frame or onto a separate card
params:
  type_class: the base — bold grotesque (regular, rounded, tall condensed, wide oblique) ≈70 %; display faces (high-contrast serif, swash italic, blackletter, spiky hand-drawn) — for assemblies and titles; monospace or condensed small caps — for the decoder; no more than 1 typeface per series of words, except for the each-word-in-its-own-font technique
  size_16x9: one word 31–47 % H (typically 35 %); phrase 9–14 % H; captions 4–12 % H; strobe 29–36 % H as a band or 95–100 % H cropped
  size_9x16: compute the font size from the width — a word 70–86 % of the width (one word ≈10–14 % H, a two-line block 18–24 % H); captions ≥ 3.5 % H
  position: x = 0.5, line center 0.46–0.50 H; poster variant — top-left corner, running off the edge; in 9:16 keep within y 0.12–0.80 and x 0.06–0.88 (interface zones — top 12 %, bottom 20 %, right 12 %)
  color: white or one saturated color on dark (pinkish red, turquoise, yellow); dark on light for clean ads; a fiery gradient (orange → red → yellow) for the strobe; an extruded outline of 4–6 % of the font size for the pop
  frames_per_word: speech 8–13 frames @25 (0.32–0.52 s), ad list 0.35–0.45 s, music assembly 3–3.5 s per word, strobe 1–2 frames; reading minimum — 0.3 s per word
  in_pop: ×0.9 → ×1.07 over 3 frames → ×1.0 by frame 6–7 (0.24–0.28 s), outBack; stroke and shadow grow in over 2–3 frames
  in_cascade: 1–2 frames per letter (12–25 letters/s), baseline offset ±0.3 of a line, settling outCubic; tracking +20 % → 0 over 8 frames
  in_decode: 6–25 frames per line of random characters (changing every frame) + a white plate 30–100 % of the line length sliding off to the side
  in_stretch: scaleY 0.1 → 1 over 8–20 frames with horizontal smear stripes; flip around the X axis 2–3 times in 3 s
  in_shatter: shards → letters over 2–3 frames (0.1–0.15 s), motion blur
  out: cut (0 frames) | scatter 3–5 frames | tracking 8 frames | zoom_through 4–5 frames @20 into the next shot (scale ×1 → ×6, radial blur)
  strobe: a change every 1–2 frames, no longer than 1.5 s in a row, bright flashes ≤ 3 per second
  loop: for background loops — 1–4 s (flip 2.7 s, weight breathing ≈4 s)
when: |
  Speech genres (motivation, explainer, clips, UGC) — 1–3 key words of the phrase, large, timed by word timecodes
  from speech recognition; a hook in the first 1–2 s (a "question" in words across the whole screen). Music genres — a vocal line or
  the track's slogan on the drop (fan edit, phonk), a 3-2-1 countdown on the last beats before the drop (≈0.35 s per digit),
  a strobe of words for 0.5–1.5 s at the densest spot. Product — a list of benefits, 0.4 s each, between product
  shots. Limit: kinetic text no longer than 30–40 % of the runtime; one entry animation per series of words;
  strobe — no more than once per video.
avoid: |
  More than 3–4 words on screen — that is subtitles or a card already; a different animation for every word; text over a face or
  a moving subject without a backing; words shorter than 0.3 s outside a strobe (unreadable); a strobe longer than 1.5 s and brightness
  swings of more than 3 flashes per second (a risk for photosensitive viewers); small text below 3.5 % H in vertical;
  a word entry off its syllable by more than 2 frames (noticeable to the eye); other people's logos and branded typefaces;
  calm slow genres — there a pop or a strobe breaks the tone, only a soft fade-in.
sfx: |
  Pop — a short click or tap on every word entry (−14…−18 dB under the voice); cascade and decoder — a series
  of quiet clicks or blips, 1 per 2–3 letters; stretch and flip — a short whoosh; countdown — a tick or hit on every
  digit and a riser under the whole series, an impact on the drop; zoom through a letter — whoosh + impact on the first frame of the new shot;
  strobe — glitch crackle for the whole length.
genres: {motivation: signature, fanedit: signature, explainer: allowed, viral: allowed, clips: allowed, ugc: allowed, product: allowed, fashion: allowed, teaser: allowed, phonk: allowed, epic: allowed, sport: allowed, drama: allowed, travel: allowed}
detect: |
  Text boxes (text detector or OCR) change content every 8–13 frames @25 (word by word) or every
  1–2 frames (strobe); on a word change — a jump in frame difference with a static background (ed_motion: cuts on a solid
  background without camera movement); box width on the word's first frame ×0.88–0.93 of the final one, on frame 3–4 ×1.05–1.08 (pop);
  box height grows ×3–10 over 0.3–0.6 s at constant width (stretch); letter boxes appear one by one (cascade).
  No global camera motion (zoom/shift empty), there is 1 large box in the center, 30–47 % H.
  Differences: type.subtitles — 1–2 lines at the bottom (lower 15–25 % H), 4–6 % H, changing with the phrase once every 1–3 s, without scale
  animation; type.title_card — one block holds ≥ 1 s, enters with a fade-in; type.karaoke — the line holds, the highlight
  moves; type.beat_text — changes strictly on the beat grid; type.repeat — the same word is multiplied and moves
  in a loop; type.behind_subject — the letters are covered by the subject or go around their contour.
engine: |
  kinetic_text(words=asr_words|lyrics|beats, sync='words'|'beats', lead=-1fr,
               style={class:'grotesk_bold_rounded'|'grotesk_condensed'|'display_mix'|'mono_caps', size:0.35*H (16:9) | fit_width(0.8) (9:16),
                      color:'#ff1f4b', stroke:{w:0.05*size, color:'#000', grow:3fr}, pos:[0.5, 0.48]},
               anim_in='pop(scale=[0.9,1.07,1.0], dur=7fr, ease=outBack)' | 'cascade(per_letter=1.5fr, jitter_y=0.3)' | 'decode(frames=6–25, plate=True)'
                       | 'stretch(axis=y, from=0.1, dur=8–20fr, smear=True)' | 'flip_x(dur=0.6, hold=0.5)' | 'shatter_in(dur=3fr)',
               hold='until_next_word', min_hold=0.3,
               anim_out='cut' | 'scatter(dur=4fr)' | 'tracking(to=0, dur=8fr)' | 'zoom_through(scale=6, dur=5fr, blur=zoom)')
  strobe: kinetic_text(..., anim_in='strobe(per=1–2fr, bands=['top','mid','bottom'], full_bleed=0.97*H, smear=directional(0.03*W))',
         inserts=clip(face_cu, 1–5fr), max_flashes_per_s=3, t=[drop, drop+1.0]).
  countdown: countdown(digits=[3,2,1], per=0.35, style='speed_stripes', slant=10°, scale=[0.96*H→0.47*H, 0.45→0.35, 0.33→0.23], ease=outExpo) + sfx('click') per digit.
  variable font: text(..., font_axes={wght:[100, 900]}, wave(per_letter=2fr, period=4.0)).
  words — from speech recognition (edit-voice: word timecodes), for music — beat_sync(event='beat'|'onset', grid='1/2').
