id: type.repeat
family: type
group: graphics
level: B
aliases: [text repeat, echo text, text repeater, word stack, text pattern, typographic pattern, typographic loop, full-screen word]
what: one word or a short phrase multiplies — as an echo stack, in rows, as a full-frame grid, as rays, on the surface of a cylinder — and the whole construction lives as a 1–4 s loop; the text becomes a pattern and a graphic insert
frames: |
  1. Source — 1–3 words in one bold grotesque (tall condensed, wide oblique, letter-spaced small caps); white on
     black, dark on a gradient or light on a saturated color. At first there is one line in the center of the frame (10–60 % H).
  2. Multiplication over 0.15–0.9 s: echo stack — 5–6 copies downward at a pitch of 0.85 × the line height (≈8.6 % H), the copies at ≈60 %
     of the main line's brightness with a gradient inside, while the main line rises (center 49 → 38 % H) so that the stack
     stays centered; row — 1 → 3 → 5 copies horizontally; recursion — 1 line ≈59 % H → 3 lines of 27 % →
     8 lines of 10–16 % → 20–40 lines as a texture, a new step every 2–5 frames @16 (0.13–0.3 s); echo tunnel —
     concentric copies grow outward over ≈25 frames @33 (0.75 s), the front layer darkens and reads on top.
  3. Life of the loop: the stack holds ≈1.1 s and retracts in ≈0.8 s; wallpaper rows drift sideways at 4 % of the width/s,
     the letters boil vertically; a ribbon of rows jerks and brakes (10 → 3.5 → 1.3 % of the width per each 0.2 s);
     a cylinder surface tilted ≈20° rotates, the pattern repeats every ≈0.64 s; 3–6 ray copies spin around
     the center, fold like a fan and spread out again; a sine wave and a color wave run through 7 rows (4.7 % H, pitch 7.8 % H).
  4. The loop seam is invisible: the last frame matches the first; loop length 1.0 / 2.1 / 2.7 / 3.9 / ≈4 s.
variants:
  - echo stack — the line leaks downward in 5–6 stepped copies and retracts back; growth 0.9 s, hold 1.1 s, return 0.8 s
  - row → ribbon → wave — the word is copied into a row of 3–5, the rows line up into a 3D wave and twist into a ribbon
  - wallpaper — two words alternate in rows across the whole frame (pitch ≈10 % H), the rows slowly slide, the letters jitter vertically
  - recursion — the phrase splits into ever smaller lines until it becomes a gray texture, in ≈1.5–2 s
  - cylinder and wave — repeats of the phrase are wrapped around a rotating tilted cylinder or a curved ribbon, dark text on a gradient; a slow loop of 5–24 s
  - rays — 3–6 copies of a short word as rays around the center, rotating and folding like a fan, small utility captions in the corners
  - window rows — a 2-letter monoblock repeated in stripes, windows with photos and video in the gaps between the letters, the stripes slide sideways and brake, loop 3.9 s
  - echo tunnel — after being typed letter by letter, the phrase is extruded as concentric outline copies to the edges of the frame, gradient yellow → turquoise
  - a line of identical letters — a new letter assembles from geometric shapes (stripes, dots, a grid, an outline) in ≈1 s, the row shifts by one letter, loop 1.0 s
  - three copies with a stretch — the middle copy stretches vertically ×3.4 in ≈0.6 s, then the whole line bulges like a lens
status: code
fallback: 3D variants (cylinder, ribbon, tunnel) without a 3D engine — coordinate remapping by sine and circle (numpy) or a stack of scaled copies; window rows — the same pattern as a mask over the user's clips (text_matte); if a material-like letter texture is needed — generate a loop on a solid background
params:
  text: 1–3 words, up to 18 characters; one typeface; bold grotesque (tall condensed for rows and masks, wide for the stack and the tunnel)
  base_size: source line 10–60 % H (stack ≈10 %, window rows 15–20 %, recursion starts at ≈59 %)
  echo_stack: copies 5–6, pitch 0.85 of a line, copy opacity 0.6 + a vertical gradient 0.2 → 1 inside each copy; grow 0.9 s (22 frames @25) outCubic, hold 1.1 s, retract 0.8 s inCubic; the stack center is compensated upward by (copies·pitch)/2
  rows: row pitch 7.8–10 % H; drift 2–5 % of the width/s or a jerk with braking 50 → 6 % of the width/s over 0.6 s; adjacent rows offset by half a word
  recursive: divisor 2–3 per step, a step every 2–5 frames @16 (0.13–0.3 s), 4–6 steps until the texture
  cylinder: axis tilt 15–25°, 5–7 visible turns, pattern period 0.6–0.7 s (fast) or 5–24 s (slow); the far side 40–60 % darker
  radial: 3–6 copies, rotation ≈60–120°/s (≈), fan folding over 0.4–0.6 s
  tunnel: 12–20 outlines, growing outward over 0.75 s, color along a gradient from the center to the edge, the front layer — black or white
  wave: amplitude 0.3–0.6 of the line height, wavelength 4–8 letters, speed 1 period per 1–2 s
  loop: 1–4 s (typically 2–3 s), last frame = first
  safe_zone_9x16: the pattern may fill the whole frame, but the readable main line stays within y 0.12–0.80, x 0.06–0.88
when: |
  A graphic insert or background: an intro under the title, a bumper between blocks or chapters, 1–2 bars on the drop as
  a "graphic pause", a final loop with a slogan or a title (for the video replaying in a loop). Product — the slogan repeated
  behind the cut-out product or around it. Echo stack — on a hit (growth on a beat, retraction on the next downbeat).
  Window rows — a way to show many of the user's shots in 2–4 s. Limit: 1–2 times per video, 1–4 s each.
avoid: |
  Phrases longer than 2–3 words — unreadable in a pattern; thin serifs and hairlines in a fine grid — moiré and mush after
  video compression; a fine pattern in vertical (lines below 3.5 % H — only as texture, not as text); a pattern over a busy
  shot without darkening; at the same time as subtitles; a loop with a visible jump at the seam; several different repeats in one video.
sfx: |
  Under the whole loop — a steady hum or a synth drone; stack growth — a downward whoosh on the beat, retraction — a reverse whoosh;
  recursion — clicks on every division step, speeding up; tunnel — a 0.75 s riser and a hit when the frame fills;
  rays — short swishes on every turn.
genres: {fashion: signature, teaser: allowed, product: allowed, motivation: allowed, fanedit: allowed, phonk: allowed, viral: allowed, epic: allowed, sport: allowed, explainer: allowed}
detect: |
  OCR or a text detector finds the same line ≥ 3 times in the frame; image autocorrelation gives a strong peak
  at the line pitch (stack, rows, recursion) or by angle (rays); after 1–4 s the frame almost matches the first one (mean
  difference < 5 of 255) — a loop. ed_motion: for rows — steady horizontal SHIFT of 2–10 % of the width/s without zoom, for a cylinder —
  high nonrigid with no shift; for a stack — the text area grows ×3 over 0.9 s at constant width.
  Differences: type.kinetic — different words replace each other; type.title_card — one static block; type.behind_subject —
  the repeat follows the contour of the subject or an object and is covered by it; look.maximalism and gfx.collage — a pattern of objects and photos,
  not of words; fx.kaleidoscope — mirrored sectors of the frame itself.
engine: |
  text_repeater(text, font='grotesk_condensed_black'|'grotesk_extended_bold', size=0.10*H, color='#ffffff', bg='#000'|gradient,
                layout='echo_stack'|'rows'|'grid'|'recursive'|'cylinder'|'radial'|'tunnel'|'wave_ribbon',
                copies=6, pitch=0.85, opacity=0.6, inner_gradient=[0.2, 1.0],
                motion={grow:0.9, hold:1.1, retract:0.8} | {drift:-0.04*W/s} | {scroll:[0.5,0.06]*W/s, ease:'outExpo'}
                       | {rot_axis_tilt:20°, period:0.64} | {spin:90°/s, fan:0.5} | {wave:{amp:0.4, len:6, period:1.5}},
                loop=2.0, seamless=True, t=[t0, t0+loop*n])
  window rows: text_matte(text='AB', layout='rows', size=0.18*H, fill=clips[], scroll=[0.5,0.06]*W/s, loop=3.9) — the clips are visible inside the letter mask or in the gaps.
  recursion: text_repeater(layout='recursive', divisor=2, step=3fr@16, steps=5) + sfx('click') per step.
  on the drop: beat_sync(event='downbeat') to start the stack growth; the loop is a multiple of a bar (2 s at 120 BPM).
gen_hint: seamless looping kinetic typography, a single bold condensed word repeated in stacked rows that ripple like a slow wave, white letters on a black background, minimalist motion design, no logos
commands: ["an echo stack of the slogan on the drop", "the word multiplies across the whole screen and dissolves into texture between #3 and #4", "a cylinder of a repeating phrase behind the ending", "rows of two letters with my shots in the gaps at 0:10"]
related: [type.kinetic, type.title_card, type.behind_subject, mask.silhouette_window, look.maximalism, fx.kaleidoscope, zoom.infinite, time.echo_trail]
evidence: {examples: 12, sources: 5, measured: "echo stack: 6 copies at a pitch of 8.6 % H (0.85 of a 10.4 % H line), copies ≈60 % of the main line's brightness, growth 22 frames @24 (0.9 s), hold 26 frames (1.1 s), retraction 20 frames (0.8 s), main line center 49 → 38 % H; recursion 59 % H → 3 × 27 % → 8 × 10–16 % → 40+ lines, a step every 2–5 frames @16; window rows — shift 10 → 3.5 → 1.3 % of the width per each 0.2 s, loop 3.9 s; wallpaper — drift ≈4 % of the width/s (0.8 % per 0.21 s), row pitch ≈10 % H; cylinder — pattern period ≈0.64 s, slow wave ≈24 s @6 fps; 7 rows of 4.7 % H at a pitch of 7.8 % H, cycle ≈2.1 s; line of letters — cycle 1.0 s (25 frames); tunnel ≈25 frames @33; stretch ×3.4 over ≈20 frames @33; ray speed — by eye (≈)", confidence: medium}
---
id: type.subtitles
family: type
group: graphics
level: B
aliases: [subtitles, captions, burned-in subtitles, burned-in captions, open captions, speech captions, on-screen lyrics, lyric captions, subs]
what: a line of text conveys speech or vocals in sync with the sound — at the bottom center or as lyrics in the middle of the frame, with changing phrases; the subtitle style (font, color, outline, position, delivery) itself becomes part of the video's aesthetic
frames: |
  1. Position: classic — 1 line (less often 2–3) centered horizontally (center 0.46–0.52 of the width), baseline at 90–96 % H
     (median ≈ 93 %), 3–9 % H to the bottom edge. Lyrics — in the middle of the frame: baseline at 49–55 % H, often on vertical
     4:5 video. A game-style dialogue window — by the speaker's head, at 55–66 % H.
  2. Size (line height from ascender to descender): classic 2.1–6.2 % H, typically 3.5–5.5 % H (capitals 3.8–4 % H);
     line width 10–60 % of the frame, up to 89 % on a square (3 lines of ≈6 % H). Lyrics — small: 1.5–3.7 % H (x-height 1–1.9 % H).
  3. Entry and exit — a hard switch within 1 frame (in all measured cases the count of text pixels goes 0 → full within a frame); a phrase
     holds 1.3–5.5 s in dialogue, 0.36–1.7 s (median ≈ 0.7 s, 2–4 words) in lyrics, a single exclamation 0.8–1.9 s;
     the pause between phrases 0–1 s. Phrase changes follow the speech, not the cut: a caption can outlive a cut by
     5–7 frames; if a cut breaks a phrase — two halves with an ellipsis at the end and at the start.
  4. Special deliveries: typewriter — letters appear one at a time, 9–15 characters/s (≈1.7–2.8 frames @25 per character), pauses
     of 0.2–0.5 s between words, the line holds 1.7 s and then all words disappear except one key word (another ≥ 1.4 s);
     stretched scream — the word grows from the center while the sound is drawn out: +24 % of the frame width in 1.2 s (≈12 letters/s), new
     letters fade in over 2 frames.
variants:
  - classic dialogue — white or yellow bold grotesque (often italic) with a thin black outline or shadow, 1–2 lines at the bottom center, changing by phrase
  - elegant commercial — a thin geometric grotesque in cream without an outline, small (≈3–3.5 % H per line), at 87–91 % H, under a voice-over
  - lyrics mid-frame — a small pale-yellow serif without an outline, 2–4 words per phrase, 0.36–1.7 s each, over atmospheric city shots in 4:5
  - typewriter — a monospace typewriter serif, pale yellow, centered; typed letter by letter, survives cuts and split-screen panels; ending — one word remains
  - stretched scream — white capitals, letters are added symmetrically from the center while the sound lasts
  - off-screen line — a phrase in square brackets in bold italic with an outline (a voice from a speaker, a machine, the narrator)
  - single exclamation word — bold yellow capitals with an outline by the speaker's chin, leaves with the cut
  - dialogue window — a pixel font in a rectangular box with a border by the character's head, like in a game
  - place caption — a small white "city, country" line at the bottom center (≈2.6 % H) on the first shot of an episode
  - word collage — the words of a sung line appear one at a time (≈4 frames @20 per word) along the frame diagonal, each in its own display font and color, and stay until the end of the line
  - lyrics on black — words one at a time on a black field around a small window with the clip, color per performer, exit with a bend (kinetic variant — type.kinetic)
status: code
fallback: no speech text — speech recognition with word timecodes (edit-voice); translation — replace the subtitle layer; burned-in subtitles in someone else's video cannot be erased in code — cover them with a plate in your own style or get a version without text; lyrics need the song text from the user (do not transcribe other people's songs into the library)
params:
  type_class: grotesque ≈ 70 % (bold or bold italic for dialogue, thin geometric for ads); serif — for lyrics; monospace typewriter — for a documentary tone; pixel — for game stylization; no more than 1 typeface per video
  size_16x9: line height 3.5–5.5 % H (font size ≈ 4.5–6 % H, capitals ≈ 3–4 % H); lyrics 2.5–3.5 % H; up to 42 characters per line, up to 2 lines
  size_9x16: font size 3.5–4.5 % H (capitals ≈ 2.6–3.2 % H, 50–60 px at 1920), bold; up to 22–26 characters per line, up to 2 lines; lyrics — x-height no less than 1.8 % H
  position_16x9: x = 0.5; baseline 0.90–0.95 H (bottom margin ≥ 5 % H); lyrics and typewriter — line center 0.45–0.55 H
  position_9x16: the whole block within y 0.62–0.78 H (the bottom 20 % is platform interface), x 0.06–0.88; lyrics — 0.45–0.55 H; never cover the face (move up or down using the face mask)
  color: "white #ffffff or yellow #f0c828 with a black outline of 0.25–0.35 % H (or a 0.3 % H shadow, 60–80 %); cream #e3cba8 and pale yellow #e0d79c without an outline for quiet styles; contrast to the background ≥ 4.5:1, otherwise a #000 backing at 40–60 % transparency"
  in_out: cut within 1 frame (default); soft style — fade 2–3 frames
  timing_speech: a phrase from the start of the first word −1…−2 frames to the end of the last +6 frames; 0.8 ≤ duration ≤ 6 s; reading speed ≤ 15–17 characters/s; pause between phrases ≥ 2 frames or back to back
  chunking: dialogue — by phrases of up to 2 lines; social media and lyrics — 2–4 words, 0.35–1.7 s (typically 0.7 s); do not hold a caption across a cut for longer than 0.3 s, otherwise split the phrase and add an ellipsis
  typewriter: 9–15 characters/s, pauses between words 0.2–0.5 s, no cursor or a 2 Hz cursor; ending — keyword_isolate (the other words disappear within 1 frame)
  stretch: growth of 20–25 % of the width/s from the center (≈12 letters/s), each new letter fades in over 2 frames
when: |
  Speech genres — always (clips, explainer, UGC, interviews): videos are watched without sound, subtitles hold
  the viewer. Translating a finished edit — replacing the subtitle layer. Lyrics of 2–4 words — atmospheric edits to a song
  (calm, fan edit, dramatic): a vocal line over slow shots. Typewriter — an opening statement
  in a "documentary" tone (place, year, prologue), teaser and drama. Dialogue window — game-style and parody videos.
  One style per video; lyrics — only on vocal phrases, not on instrumental breaks.
avoid: |
  The bottom 20 % and the right 12 % of the frame in vertical (the interface covers them); text over the speaker's face and mouth;
  more than 2 lines and 42 characters per line (26 in vertical); a phrase shorter than 0.8 s outside lyrics; an offset from the word of more than
  2–3 frames; a thin small font without an outline on a busy or light background; animating every phrase (that is
  kinetic text already and hinders reading); a style change in the middle of the video; other people's song lyrics in the library; duplicating
  with subtitles text that is already in the frame.
sfx: |
  Subtitles need no sound — they follow the speech or vocals. Typewriter — a key click on every letter
  (−18…−22 dB under the voice) and a bell or a hit on the last letter; stretched scream — the sound itself; dialogue window —
  short beeps as the text appears.
genres: {clips: signature, explainer: signature, ugc: signature, motivation: allowed, viral: allowed, drama: allowed, fanedit: allowed, calm: allowed, travel: allowed, product: allowed, fashion: allowed, teaser: allowed, sport: allowed, epic: allowed}
detect: |
  Text detector (or OCR) in the band 0.85–0.97 H or 0.44–0.56 H: 1–3 lines, center |x − 0.5| ≤ 0.04, line height
  2–6 % H, position unchanged between changes; a content change — a jump within 1 frame without layer motion, the change rate
  matches the pauses in speech or vocals (by speech onsets ±3 frames). Color — white, yellow or cream; bold
  styles have a dark 1–2 px ring around the letters (the ring's brightness lower than the nearby background). Typewriter — the right edge
  of the line grows in steps of ≈ 1.5 % of the width per character, 9–15 characters/s. ed_motion: low overlay-mask (the text is small),
  global motion — same as the shot's; the caption survives cuts unchanged.
  Differences: type.kinetic — 1–3 large words (≥ 10 % H), animated entry, changes to the rhythm; type.karaoke — the line holds
  while a highlight runs across the words; type.title_card — one block ≥ 7 % H for 1–6 s with no link to speech; type.credits —
  lists of names and roles; gfx.floating_ui — interface bubbles by the subject.
engine: |
  subtitle(words=asr_words(lang)|lyrics_aligned, style={class:'grotesk_bold_italic'|'grotesk_light_geo'|'serif_book'|'mono_typewriter'|'pixel',
           size:0.05*H (16:9) | 0.04*H (9:16), color:'#ffffff'|'#f0c828'|'#e3cba8', stroke:{w:0.003*H, color:'#000'} | shadow:{d:0.003*H, a:0.7} | box:{a:0.5}},
           pos={x:0.5, baseline:0.93} (16:9) | {block:[0.62, 0.78]} (9:16) | {center_y:0.52} (lyrics),
           chunk={max_chars:42|26, max_lines:2, min_dur:0.8, max_dur:6.0, cps_max:17, words:[2,4] (lyrics), split_on_cut:0.3, ellipsis:True},
           lead=-2fr, tail=+6fr, anim_in='cut'|'fade(2fr)', avoid=track(face), safe_zone='tiktok', karaoke=False)
  typewriter: typewriter(text, cps=12, word_pause=0.3, cursor=False, then=keyword_isolate(word_index, hold=1.5)) + sfx('click', per_char=True, gain=-20dB).
  stretched scream: word_stretch(word, anchor='center', rate=0.22*W/s, fade_in=2fr, until=voice_offset).
  dialogue window: text(style='pixel', box={fill:'#5a6fb0', border:'#1c2140', pad:0.012*H}, anchor=track(person:head), offset=[0, -0.12*H]).
  translation: the same subtitle(...) with words=translate(asr_words, target) — the layer is replaced entirely.
  checks: qa_text_safe_zone(layout='tiktok'), qa_reading_speed(max_cps=17), qa_overlap(face).
