id: type.behind_subject
family: type
group: graphics
level: B
aliases: [text behind subject, text behind person, depth text, title behind the subject, text around the subject, contour text, words bursting from behind, text ring around a product]
what: on-screen text is built into the depth of the frame together with the subject — words stand behind them, burst out from behind their back, run as a line along their contour or circle an object as a ring; the subject overlaps the text and the frame looks like a cover
frames: |
  1. A separable subject is needed — a person or an object on a plain or dark background, centered (x 0.38–0.62), 20–60 %
     of the frame width; free space on both sides. The camera is static or almost static.
  2. The text layer goes between the background and the cut-out subject. Entry from behind the back: letters fly out of a point behind the head —
     a cloud of letters 16 % → 33 % → 58 % → 89 % of the frame wide over 4 frames @20 (0.2 s, outExpo, motion blur), with an overshoot and settling
     over another ≈6 frames (0.3 s); often with a puff of colored smoke behind the subject. Contour entry: a line writes itself along the silhouette
     at an offset of 2–5 % of the frame, from the middle outward, over 3–4 frames @33 (≈0.1 s). Wall entry: diagonal wipes
     over 4–5 frames @33 reveal a wall of large text behind the subject.
  3. Layout: word blocks in the empty space on the left and right (x 0.02–0.35 and 0.62–0.96, y 0.08–0.83), 2–3 lines of
     12–14 % H, sans-serif letters, each in its own color; from the 4th frame on there is not a single letter in the subject's band (40–60 % of the width) —
     the face is always clear. Ring: one word repeated in rays around the object, letters stretched along the radius, the ring covers
     40–45 % of the frame area and reaches the edges, its inner edge sits 3–5 % from the silhouette. Wall: rows of ≈13 % H around the perimeter,
     the lower part covered by the subject.
  4. Life: the mask is recomputed every frame; when the object turns, the ring rebuilds to the new silhouette
     (every 1–3 frames at 8 fps — it boils, like stop-motion); phrase change — the letters crumble into colored particles
     and reassemble into the new phrase over 5–7 frames @20 (0.25–0.35 s).
  5. Exit: a cut to a close-up of the subject (the text leaves with the shot) or the letters scatter outward over 3–4 frames.
variants:
  - burst from behind — colorful extruded letters with smoke fly out from behind the subject and settle into blocks on the sides; phrases change through a particle cloud
  - contour line — a small line (≈3 % H) runs around the silhouette of a car or a person, then a wall of large text opens behind the subject (≈13 % H, black and white on plates)
  - ring around an object — a word repeated in rays around a cut-out product on black, the ring rebuilds with every new angle of the product
  - giant word behind the head — one word across the full width, the head and shoulders cover the middle letters (the title version is in type.title_card)
status: hybrid
fallback: mask — mediapipe (person) or remove_background (object), feather the edges by 1–3 px; if the background is busy — darken or replace the background (mask.bg_replace) before the layout; if the subject is cut off by the frame edge or is small (less than 20 % of the width) — reframe or a separate shot; ring and contour under strong motion — on keyframes every 2–3 frames (stop-motion instead of mask jitter)
params:
  subject: x 0.38–0.62, 20–60 % of the frame width, plain or dark background, sharp edges; a mask for every frame
  layers: bottom to top — background, smoke or particles, text, the subject via the mask
  layout: sides (blocks on the left and right, 2–3 lines) | contour_path | ring | wall | giant_behind
  size: side blocks 12–14 % H per line; contour line ≈3 % H (≈); wall ≈13 % H; giant word 30–60 % H
  offset: 2–5 % of the frame from the silhouette (contour, inner edge of the ring); blocks — no closer than 3 % to the mask
  in_burst: from a point behind the head, cloud width 0.16 → 0.33 → 0.58 → 0.89 of the frame over 4 frames @20 (0.2 s) outExpo + settling 0.3 s; directional motion blur
  in_path: write-on along the contour from the middle to the edges over 3–4 frames @33 (0.1 s)
  in_wall: diagonal wipes, 4–5 frames @33
  swap: break-up into particles and assembly of the new phrase, 5–7 frames @20 (0.25–0.35 s)
  ring_update: the ring is rebuilt to the silhouette every 1–3 frames at 8 fps (≈0.12–0.36 s)
  color: letters in different saturated colors (blue, red, green, cream), extruded | white on black | black and white on plates
  safe_zone_9x16: side blocks do not fit in vertical — place them above and below the head (y 0.12–0.30 and 0.62–0.80), the subject in the center
when: |
  Hook and cover: the first frame of the video, introducing the subject or a product (a name, a slogan, a line of the track behind the performer
  on the drop). Fashion lookbook — the name of the look or of a placeholder brand behind the model. Product — a ring of a feature word around
  the cut-out product for 1–3 s. Sport — a placeholder surname or a number behind the athlete. Limit: 1–3 times per video, one
  layout per scene; entry on the downbeat.
avoid: |
  A busy background without darkening; hair, smoke and motion blur at the subject's edge without feathering — a visible halo; a fast camera
  (the mask lags by a frame — letters show through the subject); text over the face; the subject at the frame edge or smaller than 20 % of the width;
  a stop-motion ring in a smooth video (it breaks the rhythm); long phrases — more than 4–5 words on the sides are unreadable.
sfx: |
  Burst from behind — a whoosh from the center to the edges and a low hit on the landing, a hiss of smoke; particles — a twinkling shimmer;
  contour write-on — a short swish along the line; wall — a dull thud on the reveal; ring — dry clicks on every
  rebuild.
genres: {fashion: signature, viral: allowed, product: allowed, fanedit: allowed, motivation: allowed, sport: allowed, teaser: allowed, phonk: allowed, ugc: allowed}
detect: |
  Text boxes are clipped by the subject's silhouette: the edge of the letters matches the edge of the person or object mask (per-frame
  segmentation), there are no letters in the subject's band; the text does not cover the face. The line or ring runs parallel to the contour at an almost
  constant offset of 2–5 % of the frame. Entry: the text area grows ×6 from the subject's center within 0.2 s. ed_motion: static camera,
  on phrase changes — a short spike in frame difference without a cut.
  Differences: type.title_card — a title block, behind-the-subject is one of the title variants there; type.repeat — a repeated word with no
  link to the silhouette; type.diegetic — the text belongs to the world of the scene (lettering on an object, letters made of a material);
  mask.silhouette_window — another video inside the silhouette, not text around it.
engine: |
  m = mask(method='mediapipe_person'|'hf_remove_background', feather=2px, every_frame=True)
  composite(layers=[clip, smoke(color='#5a8a2a', t=[t0, t0+0.6])?, text_layer, clip × m])
  text_layer: layout='sides' → text(lines, style='chunky_multicolor', size=0.13*H, boxes=free_space(m, margin=0.03*W),
              anim_in='burst(from=track(face), widths=[0.16,0.33,0.58,0.89], dur=0.2, ease=outExpo, blur=directional)')
            | layout='contour_path' → text_on_path(text, path=contour(m, offset=0.03*W), size=0.03*H, reveal='center_out', dur=0.1)
            | layout='ring' → text_repeater(text, layout='radial_fill', inner=contour(m, offset=0.04*W), stretch='radial', update='per_pose', fps=8)
            | layout='wall' → text_repeater(text, layout='rows', size=0.13*H, colors=['#000','#fff']) + transition('wipe(diagonal)', dur=0.15)
  phrase change: particles_swap(text_a, text_b, dur=0.3, particles=2000, colors=from_letters)
  entry on the beat: beat_sync(event='downbeat'); sfx('whoosh', at=t0) + sfx('impact', at=t0+0.2)
gen_hint: <person or product> centered against a plain dark studio background, full figure, crisp clean silhouette edges, generous empty space on both sides and above, even soft light, static camera, no text
commands: ["text behind the subject on the hook", "words burst out from behind her on the drop", "a ring of the word around the product in #3", "a line along the car's contour, then a wall of text behind it"]
related: [type.title_card, type.kinetic, type.repeat, type.diegetic, mask.bg_replace, mask.silhouette_window, product.hero, scene.void]
evidence: {examples: 4, sources: 3, measured: "burst from behind: letter cloud 16 → 33 → 58 → 89 % of the width over 4 frames @20, settling ≈6 frames; from the 4th frame on 0 % letters in the 40–60 % width band; blocks x 2–35 % and 62–96 %, y 8–83 %, lines ≈12–14 % H; phrase change via particles 5–7 frames @20; contour line ≈3 % H, write-on over 3–4 frames @33; wall ≈13 % H, wipes 4–5 frames @33; ring — 40–45 % of the frame area, rebuilt every 1–3 frames at 8.3 fps (70–115 % pattern change on each rebuild)", confidence: medium}
