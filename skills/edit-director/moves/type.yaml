id: type.intertitle
family: type
group: graphics
level: A
aliases: [intertitle, insert title, title card between scenes, chapter card, three days later, time skip card, supertitle, time and place caption, text card, on-screen prologue]
what: a short authorial caption that states the time, place, chapter, a line of dialogue or a prologue — as a line over the first frame of a scene or as a separate text card between shots; it switches the viewer to a new stretch of the story
frames: |
  1. Function: a time skip ("three days later", "meanwhile"), a new place, a chapter number or name, a line of dialogue instead
     of sound, a prologue from the narrator. It goes on the first frame of a new scene or between two shots.
  2. Caption over a shot: one line of bold caps in a wide grotesque, 5.5–6.6 % of the height of a 2.39:1 frame (≈4–5 % H
     in 16:9), width 48–64 %, centered horizontally; vertically — above the characters' heads (13–22 % H) or exactly
     in the center (50 % H), right over the scene. Color golden yellow (≈#EEBB14) or orange, no shadow and no backing,
     on a dark background (median brightness 14–52). Chapter — two lines: a large one (≈12 % H in 16:9) and a small one under it (≈6 %),
     top center (7–35 % H).
  3. Caption timing: it comes in on the cut together with the first frame of the shot (or is already there), holds for 1.3–2.9 s (32–72 frames
     @25), disappears in 1 frame, and the shot goes on for another ≥1 s. With camera movement the caption hangs in the scene and travels
     with the background (a pan of 2–5 % of the frame per frame) — it leaves past the edge or, once the camera stops, settles at the top;
     the chapter's second line appears ≈0.5 s after the stop and holds for ≈6 s.
  4. A text card between shots (background — black, a solid color or a texture):
     dialogue line — one line in a monospace font ≈4 % H, cold light blue on black, on the left (x 0.15, y 0.34),
     typed out letter by letter in ≈0.85 s (≈65 % of the width per second) and stays;
     prologue — lines of bold caps 4.3–5.4 % H appear one at a time every 1.3–7.5 s (≈4 s on average, following the narrator's
     voice), some lines slide into place over ≈2.5 s; the block grows like a staircase (23–70 % H, pitch 1.3 lines),
     the card holds for up to 40 s;
     trailer — phrases of 2–4 words fly in from a large scale in ≈0.4 s over a close-up or on black
     and hold for 1.5–1.9 s, the card's second word comes 0.4–0.6 s after the first; in the title-card sample the cards
     alternated with shots every 2.1–2.4 s. A retro silent-film frame — see type.vintage_title.
variants:
  - time and place over a shot — a line of bold caps above the heads or in the center, 1.3–2.9 s, disappears in 1 frame
  - travels with the scene — the caption hangs in the shot's space and moves with the pan, leaves past the edge or settles at the top
  - chapter over a shot — a large line with a number or a name and a small subline, top center, ≈6 s
  - chapter card between shots — a chapter number or name, a phrase on a black or colored field
  - typed dialogue line — one line in a monospace font is typed out letter by letter on black, like a message
  - prologue — lines of the story appear one at a time under the voice-over and stack into a block on a textured card
  - trailer cards — phrases of 2–4 words fly in from scale and alternate with shots on the bar
  - comedic time skip — a card or caption stating with pointed precision how much time has passed, followed by a visibly changed scene
status: code
fallback: |
  In code on any shot. If the scene has no calm area for the caption — a card between shots (black, a color from the video's
  palette or a paper or wood texture). The travels-with-the-scene variant needs a shot with camera movement and background tracking;
  without it — a static caption.
params:
  placement: over the first frame of the scene | a separate card between shots
  type_class: bold wide grotesque in caps (captions, chapters, prologue); monospace (message-style dialogue line); on a card with a phrase longer than 3 words — serif or grotesque in lowercase
  size: caption 4–5 % H in 16:9 (5.5–6.6 % H in a 2.39:1 frame); chapter ≈12 % + 6 % H; dialogue line ≈4 % H; prologue lines 4.3–5.4 % H; trailer phrase 15–25 % H (≈); no wider than 80 % of the frame
  position: caption x = 0.5, y = 0.13–0.22 or 0.50; chapter — top center 0.07–0.35; dialogue line — left x 0.15, y 0.34; prologue — block 0.23–0.70; 9:16 — inside the safe zone (top 12 %, bottom 20 %)
  color: golden yellow ≈#EEBB14, orange or white; dialogue line — cold light blue ≈#5aa0c8 on black; no shadow on a dark background (median brightness ≤ 55); on a light one — a thin 1–2 % H shadow
  in: cut on the first frame of the shot | cut to a card | letter-by-letter typing ≈65 % of the width per second (dialogue line) | prologue lines one at a time following the voice | fly-in from scale ≈0.4 s (trailer)
  hold: caption 1.3–2.9 s (32–72 frames @25); chapter ≈6 s; trailer card 1.5–1.9 s; card with a phrase 2–5 s; no shorter than 0.3 s per word + 0.5 s
  out: disappears in 1 frame, the shot continues ≥1 s | leaves past the edge with the scene (anchor) | cut from the card to the shot
  frequency: one caption per scene; chapter cards — no more than 1 per 15–30 s (≈); trailer cards — every other shot
when: |
  The start of a new scene after a time skip or a change of place; dividing a long video into chapters and stages; a line or
  thought of the character without sound (dramatic — "text lines" in a pause in the music); a prologue under the narrator's voice at the start;
  teaser — phrase cards between shots on the bar, building toward the reveal; travel and vlogs — "day 3", the city and the time;
  comedy — an exact time skip before the "after".
avoid: |
  A caption on a busy background without contrast; holding it for less than 1.3 s; complex caption animation (jumps, springs, bouncing
  letters) — that is kinetic type already, here only a cut, letter-by-letter typing or a line sliding in; a card in the middle of a drop or
  fast cutting — it stops the rhythm; more than one caption per scene; a caption over the character's face for longer than 2 s;
  paragraphs of more than 12 words on one card (prologue — only line by line with the voice).
sfx: |
  Caption — silent or with a soft tick; typed dialogue line — quiet key clicks per character; chapter card —
  a pause or stop in the music for its duration, a hit on the return to the picture; prologue — the narrator's voice and a quiet music bed;
  comedic time skip — a short bass hit or a whistle on the appearance; trailer cards — hits
  on every fly-in and risers between them.
genres: {drama: signature, teaser: signature, epic: allowed, calm: allowed, travel: allowed, fanedit: allowed, viral: allowed, explainer: allowed, clips: allowed, ugc: allowed, product: allowed, motivation: allowed, sport: allowed, fashion: allowed}
detect: |
  Caption: one line of text 4–7 % H (text detector), centered horizontally, in the upper third or in the center,
  no backing, a single color (yellow, orange or white); appears on the first frame after a cut and disappears in
  1 frame after 1.3–2.9 s while the shot continues; during a pan its shift matches the background's shift.
  Card: frames with a median brightness < 20 (or solid, textured) with text, 1.5–5 s, between two different
  shots (ed_motion: black frames and cuts at the card's edges). Dialogue line: the right edge of the line grows at ≈65 % of the width/s
  and stops. Prologue: the number of lines grows in steps once every 1–8 s on a static card.
  Differences: the title (type.title_card) — at the start of the video, larger (9–90 % H) and with the name; subtitles — at the bottom of the frame,
  changing with the lines every 1–3 s; type.margin_notes — handwritten lines and captions next to the character, typed letter
  by letter as the speech goes, and corrections; type.kinetic — words animate one by one to the rhythm.
engine: |
  caption: text(content, style='caps_bold_wide', size=0.045*H, pos=[0.5, 0.17]|'center', color='#EEBB14',
               anim='cut', t=[shot_start, shot_start + 2.0]) — exit by cut (1 frame), the shot continues;
           with camera movement: anchor=track(kind='planar', region=<sky or background above the heads>), after the stop — pos=[0.5, 0.12].
  chapter: text([number, subtitle], size=[0.12*H, 0.06*H], pos=[0.5, 0.15]), second line after 0.5 s, hold 6 s.
  dialogue: shape(kind='rect', color='#000', full=True) + text(content, style='mono', size=0.04*H, pos=[0.15, 0.34], align='left',
           color='#5aa0c8', anim='typewriter', cps=22) + sfx('click', gain=-20dB) per character.
  prologue: text_lines(lines, style='caps_bold', size=0.05*H, bg='texture(wood|paper)', reveal='line', at=word_ts of the narrator,
          slide_in=2.5 s for individual lines) — new primitive for line-by-line reveal on the voice timestamps.
  card: shape(kind='rect', color='#000', full=True) + text(content, style='serif'|'grotesk', size=0.08*H, pos='center')
            between cut(a) and cut(b), dur 2–5 s; trailer: text(anim='slam_in(scale0=4, dur=0.4)') + beat_sync(cards, grid='1 bar').
  sound: duck(music, depth=-12dB, t=card) + sfx('impact', at=return to the picture).
gen_hint: establishing shot of <new location> at <time of day>, static or slowly panning camera, dark calm area above the characters' heads left free for an on-screen caption, no text
commands: ["caption 'three days later' at the top of the first frame of #6", "a chapter card on black between #3 and #4", "the character's line typed letter by letter on black before #5", "a prologue line by line under the voice-over at the start", "trailer phrase cards between shots in time with the beat"]
related: [type.title_card, type.vintage_title, type.margin_notes, type.subtitles, type.kinetic, type.diegetic, cut.jump, time.timelapse]
evidence: {examples: 7, sources: 5, measured: "intertitles section (3 examples, 1 source): line 5.5–6.6 % of the height of a 2.39:1 frame, width 48–64 %, vertical center at 13 %, 22 % or 50 %; color RGB ≈237–241/187–191/18–31 on a background with a median of 14–52; holds 40 frames @20 (2.0 s), ≥32 frames @25 and ≥57 frames @20; disappears in 1 frame or travels up with a pan of 2–2.5 % of the frame per frame. General typography section (4 examples): chapter 15.5 + 8.5 % H in a 2.39:1 frame, during a pan the caption's shift ≈ the background's shift (2.0–3.7 % over 8 frames), second line ≈0.5 s after the stop, holds ≈6 s; dialogue line 3.9 % H, x 0.15–0.69, typed over 14 frames of 60 ms (0.84 s), RGB ≈81/140/165 on black; prologue — lines of 4.3–5.4 % H appear at 1.3, 8.8, 10.1, 12.6, 17.6, 22.7 and 30.2 s, line pitch ≈6.5 % H; trailer — fly-in over 6 frames of 70 ms (0.42 s), cards 1.5–1.9 s. The other 7 examples of the intertitles section are handwritten captions and notes, moved to type.margin_notes", confidence: medium}
