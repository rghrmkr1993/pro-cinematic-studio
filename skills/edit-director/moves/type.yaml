id: type.title_card
family: type
group: graphics
level: B
aliases: [title card, main title, opening title, title drop, title sequence, on-screen title, title caption]
what: the main title — the name of the video, the song or the subject, large, for 1–6 s, over a calm opening shot or on a separate card (black, colored, textured); a cover that announces the start or puts a full stop at the end
frames: |
  1. Placement: after the first hook shot or a cold open (0.5–10 s from the start), entry on a downbeat or a hit;
     less often — a final card. The camera under the title is static or moves slowly (push-in ≤ ×1.3 over 3 s, pan ≤ 1 % of the frame per frame).
  2. Background: (a) an opening shot with a calm area — sky, horizon, water, a wall, a dark interior, a symmetrical subject;
     (b) a separate card — black (median brightness < 10), a solid color, paper or a grunge texture, a slowly breathing
     gradient. In 21 of 24 examples the block is centered horizontally (x = 0.50 ± 0.02).
  3. Composition (size — line height including ascenders and descenders, in % of the frame height H):
     classic block — title 9–20 % H across 37–66 % of the width, small lines of 1.3–2.8 % H above and below it (performer,
     "director"), block center at 39–51 % H; poster — title 29–37 % H across 68–89 % of the width plus a "billing block" of 2–4 lines
     of 0.7–1.7 % H at the bottom edge (82–95 % H); giant word — 36–91 % H across 70–97 % of the width; "frame" — two
     letter-spaced lines of 15–18 % H at the top (15–34 % H) and bottom (79–94 % H) edges, the object between them; lower block —
     7.7 % + 2.8 % H under the subject's face (59–78 % H); "sky" italic — 16–29 % H in the upper third (3–43 % H);
     "cover" — an image or a face in the center on black, the name and the title on the sides in one line by the margins (≈4–5 % H).
  4. Entry (fully visible in 10 of 24; in the rest the title is already there in the example's first frame): a cut;
     a fade-in of 0.4–0.75 s (10–19 frames) — linear or with a fast start; from defocus 1.4–1.6 s (blur ≈3 % H → 0,
     sharpness increasing toward the end); by color — dark red → red → ochre → white over 0.6–1.1 s, after which the picture emerges
     from black in ≈0.5 s; a reveal from the center to the edges in 0.6 s; a fly-in from a scale of ≈×6 to ×1 over 0.18–0.7 s
     (4–17 frames) with a ±5 % settle; word by word — the title's words pop in on cuts every 0.16–0.5 s and stay;
     a 12–15 Hz strobe for ≈0.5 s with the word flipped 180°, which turns upright after 0.2 s and glows steadily
     without flicker for another ≈0.4 s; an underline drawn on from left to right in 0.32 s (8 frames); final card — a glow around
     the letters builds over 0.15 s, then the background flashes from black to a saturated color in 0.2 s.
  5. Hold 1–6 s: classic — 3.5–4.5 s at full opacity; giant word ≈1 s; word by word —
     0.64 / 0.56 / 0.48 s (each next one 2 frames shorter); inserted cards 2.1–2.4 s; music video — title
     ≥1.25 s, pause 0.65 s, "director" block 1.4 s, both by cuts over one shot. The title is static, or it is
     set into the scene by tracking and travels with the background, or it pulses to the beat ×0.75–1.15 with a period of ≈0.36 s.
  6. Exit: a 0.9 s dissolve (≈22 frames) while the shot continues; disappearing in 1 frame while the shot goes on;
     a cut to the next card ("director" as a separate line of 5–6 % H) or a shot; graphic exit — the letters one by one
     turn into colored circles, the circles into full-height stripes (1 letter per 2 frames, ≈1 s), the stripes cover the frame
     and a cut follows; the letters shatter into shards in 0.1–0.2 s; zoom through the letters — the scale grows with acceleration (×1.2 in
     0.4 s, ×2 in 1.6 s, ×3 in 2.1 s), for another ≈0.7 s the letters cover the frame and fly past, revealing the shot (≈2.8 s).
variants:
  - classic — Roman capitals or a thin grotesque 9–12 % H, white, centered on the horizon or the sky, fade-in 0.5–0.75 s, dissolve 0.9 s
  - poster — a calligraphic italic or a high-contrast serif 29–37 % H with small lines above and below, a billing block at the bottom edge, like a film poster over the shot
  - giant word — a condensed extra-bold grotesque or a pixel font 36–91 % H fills the frame, holds 0.5–1.2 s, often on a hit
  - "behind the subject — a giant word stands between the background and the person: a raised hand, the head, the shoulders cover the letters (other forms of text in depth — type.behind_subject)"
  - in the scene — the title is tracked to the shot and travels with the background when the camera moves, as if hanging in the air (text on surfaces with perspective — type.diegetic)
  - cover — an image or a face in the center on black, the name and the title symmetrically on the sides, holds still
  - pop logo — a rounded bold font in an arc or slanted, with little stars and sticker badges around it; entry by a cut or a fly-in, pulse to the beat
  - frame layout — two wide letter-spaced lines at the top and bottom, the subject or a building between them
  - lower block — the title under the subject's face, a strictly symmetrical portrait; small details are alive (a counter digit flips, a line erases letter by letter)
  - interleaved cards — black cards with a lowercase condensed grotesque 38–50 % H alternate with shots, 2.1–2.4 s each
  - word by word — 2–3 full-frame words change over one shot on the beats, each next one shorter
  - strobe title — every 2–4 frames a new font, color and background (rays, concentric rings, neon, outline, glitch) with the same word
  - material — letters of liquid, chrome, ice assemble over 1.5–2 s during a slow camera pull-out (3D or generation)
  - handmade — the letters are printed, cut out or assembled and boil every frame; paper and objects in the composition (hand-drawn ones — type.hand_drawn)
  - graphic exit — the letters turn into dots and stripes in the gradient's colors, which open the next shot like a wipe
  - zoom through the letters — the title grows with acceleration and flies past the camera, revealing the shot
  - final slogan card — a phrase and a logo mark on black, the glow around the letters builds, the background flashes with color; a full stop at the end of the video
status: code
fallback: |
  Text, entry, exit and the background card — in code on any footage. Behind the subject — hybrid: a person mask
  (mediapipe or remove_background) over the title layer. In the scene — background tracking with optical flow. If there is no
  calm shot with a free area — a card on black or a gradient, or generate an opening wide shot
  with an empty sky or wall (with the user's consent). Material letters (liquid, chrome, ice) and handmade ones
  (paper, objects) — generation or 3D; without them — the same font with a texture and a soft highlight.
params:
  type_class: grotesque ≈45 % (condensed extra-bold, wide letter-spaced, geometric, rounded); serif ≈20 % (Roman capitals, high-contrast, bold with an outline); italic and calligraphy ≈15 %; display ≈12 % (pixel, blackletter, ornamental); hand-drawn ≈5 %; no more than 2 typefaces per block
  layout: center_block | poster | fill | frame_top_bottom | lower_block | sky_top | cover_triptych
  size_title: classic 9–20 % H (typically 10–12 %); poster 29–37 % H; giant 36–91 % H; frame layout 15–18 % H per line; lower block 7.7 % H
  size_secondary: 1.3–2.8 % H above and below the title; a separate director card 5–6 % H; billing block 0.7–1.7 % H per line
  width: title 37–89 % of the width; giant 70–97 %; letter spacing in the frame layout 30–60 % of the font size
  position: x = 0.5; block center 0.39–0.51 H; sky 0.15–0.43 H; lower block 0.59–0.78 H; margins ≥ 5 % at the edges
  vertical_9x16: the block inside the safe zone (top 12 %, bottom 20 %, right 12 %); compute the font size from the width — a line 70–86 % of the width; giant word — stacked, one word per line
  color: white or cream (8 of 24), red or crimson (4), orange (3), yellow (2), gradient (2), chrome (2), black on paper (1); contrast to the background ≥ 4.5:1; outline or shadow only in pop styles
  in: cut | fade 0.4–0.75 s (10–19 frames @25), linear or outQuad | blur_in 1.4–1.6 s, r 3 % H → 0 | color_reveal 0.6–1.1 s + background from black 0.5 s | reveal_center_out 0.6 s (15 frames) | slam_in ≈×6 → ×1 over 0.18–0.7 s (4–17 frames), outExpo, settle ±5 % over 0.15 s | words_build — a word every 0.16–0.5 s | glow_up 0.15 s + background from black to color in 0.2 s | strobe_in 12–15 Hz ≈0.5 s, flip 180° → 0° after 0.2 s, then steady | draw_on of the underline 0.32 s (8 frames)
  hold: 1–6 s; classic 3.5–4.5 s; giant 0.5–1.2 s; word by word 0.48–0.64 s per word; inserted cards 2.1–2.4 s; strobe — 80–160 ms per design
  out: dissolve 0.9 s (22 frames) | disappear in 1 frame | cut together with the shot | glyph_wipe ≈1 s (1 letter per 2 frames) | shatter 0.1–0.2 s | zoom_through ≈2.8 s (×1 → ×3 over 2.1 s with acceleration, then a 0.7 s fly-past)
  during_hold: static | background tracking (title shift = background shift within 0.6 % of the frame) | pulse to the beat ×0.75–1.15, period ≈0.36 s | slow drift ×0.87 over 0.6 s
  reading_time: no shorter than 0.3 s per word + 0.5 s (2 words ≥ 1.1 s), except the strobe and word by word
  aspect_note: sizes are in % of the frame height of the example itself (examples 1.33–2.39:1); for 16:9 multiply sizes from a 2.39:1 frame by 0.75, from 4:3 — by 1.33; in 9:16 compute by width
when: |
  Intro: right after the hook shot or a cold open, entry on the first downbeat or the hit of the drop ("title drop").
  Music video — title + performer + author for 3–6 s over the opening wide shot. Teaser — a final
  card with the title (and a date) on the last hit. Travel and calm — italic above the sky or water. Fashion — a poster
  with a high-contrast serif or a strobe title. Epic and fan edit — a giant word or word by word on the drop.
  Limit: one main title per video (plus a final card); strobe title — no longer than 1.5 s.
avoid: |
  A title over a busy or high-contrast background without a backing (contrast < 4.5:1); holding the title for less than 1 s;
  more than 2 typefaces and 3 sizes in a block; intruding on the interface zones in 9:16 (top 12 %, bottom 20 %, right 12 %);
  covering a face (except the intentional behind-the-subject version with a mask); fade-ins longer than 1 s in fast genres; a strobe
  with brightness swings of more than 3 flashes per second — a risk for photosensitive viewers; other people's logos and
  branded typefaces. In UGC ads a main title breaks the native feel — use a hook text in subtitle style there.
sfx: |
  Title drop — a dull hit (impact or sub_drop) exactly on the frame of appearance, preceded by a 1–2 s riser; classic
  fade-in — silence or a soft swell over the whole fade-in; fly-in — a short whoosh + impact on landing;
  strobe and flip — glitch clicks on every change; underline draw-on — a marker rustle; graphic exit —
  a series of short clicks per letter and a whoosh on the wipe.
genres: {teaser: signature, fashion: signature, epic: allowed, drama: allowed, calm: allowed, travel: allowed, fanedit: allowed, viral: allowed, product: allowed, phonk: allowed, sport: allowed, motivation: allowed, explainer: allowed, clips: allowed, ugc: forbidden}
detect: |
  Frame: a text block (EAST/DB text detector or OCR boxes) whose largest line is ≥ 7 % H, centered
  (|x − 0.5| ≤ 0.05), holding ≥ 1 s; appears in the first 10 s of the video or in the last 5 s. On a card — median
  brightness < 30 (or a solid background), the text takes 2–50 % of the area.
  ed_motion: the camera is static or moves slowly; overlay-mask 0.3–0.8 with a moving background; on cards — black frames
  and cuts on card changes; strobe title — cuts every 2–4 frames and flash frames.
  Time: the alpha of the text zone grows over 10–19 frames (fade-in) or jumps 0 → 1 (cut); the zone's sharpness grows
  (Laplacian variance ×30, maximum gradient ×4) over 1.4–1.6 s — from defocus; the zone's mean color shifts
  in hue — a color reveal.
  Variants: in the scene — the text zone's shift matches the background's shift within 0.6 % of the frame per step; behind the subject — the letters
  are covered by a person mask; giant — the text zone ≥ 20 % of the area.
  Differences: subtitles — the bottom 15–25 % H, 4–6 % H, changing with the lines every 1–3 s; kinetic text — words
  animate one by one to the rhythm of speech; intertitle — a card in the middle of the video with a phrase or a chapter; credits —
  lists of names in a small font size; retro title — a typeface and texture of old film; type.behind_subject — text around and behind
  the subject without the role of a main title; type.diegetic — text on an object or a surface with its perspective and light;
  type.repeat — one word multiplied into a pattern.
engine: |
  title_card(lines=[{role:'kicker'}, {role:'title'}, {role:'credit'}], layout='center_block'|'poster'|'fill'|'frame_top_bottom'|'lower_block'|'sky_top',
             type_class='serif_caps'|'didone'|'script'|'grotesk_condensed_black'|'grotesk_extended'|'pixel',
             size={title: 0.10*H, kicker: 0.022*H, credit: 0.022*H}, color='#f2ede4', bg='picture'|'#000'|'gradient_anim'|'texture(paper)',
             anim_in='fade(0.6, linear)', hold=4.0, anim_out='dissolve(0.9)', safe_zone='tiktok', t0=beat('downbeat'))
    = text(...) per line + shape(kind='underline'|'plate') as needed.
  entries: fade(0.4–0.75) | blur_in(dur=1.5, r0=0.03*H, ease='inCubic') | color_reveal(from='#6a090e', to='#f0e8e4', dur=0.8) + fade(bg, from='#000', dur=0.5)
         | reveal_center_out(dur=0.6) | slam_in(scale0=6, dur=0.18, ease='outExpo', settle=0.05) | strobe_in(hz=12, dur=0.35, flip=180) | draw_on(shape='underline', dur=0.32)
  hold: anchor=track(kind='planar', region=<title zone>) — in the scene; beat_pulse(scale=[0.9, 1.15], every='1/2') — pulse.
  behind the subject: composite(layers=[clip, text(...), clip × mask('mediapipe_person'|'hf_remove_background', feather=2px)]).
  exits: transition('dissolve', 0.9) on the layer | cut | glyph_wipe(order='ltr', per_letter=2fr, stages=['dot','bar','full']) + cut
          | transform(scale=[1, 12], center=[0.5, 0.5], t=[t1-2.8, t1], ease='inExpo') on the title layer — zoom through the letters.
  final card: glow(threshold=0.8, radius=0.02*H → 0.05*H, t=0.15) + color(bg '#000' → '#ff7d00', dur=0.2).
  strobe: title_strobe(text, per=[2, 4] frames, styles=8–12 classes, bg=['#000','rays','rings','neon','outline'], max_luma_flashes=3/s).
  interleaved cards: cut(clip) ↔ text(bg='#000', style='grotesk_condensed_lower', size=0.3*H), step 2.1–2.4 s (1 bar).
  sound: sfx('impact', at=t0) + sfx('riser', at=t0-1.5) for the title drop.
