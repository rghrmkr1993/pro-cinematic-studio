id: type.karaoke
family: type
group: graphics
level: B
aliases: [karaoke captions, karaoke subtitles, karaoke, word highlight captions, word highlighting, active word highlight, highlighted subtitles, running highlight, word-by-word captions, animated captions]
what: karaoke captions — a short line stays in place while the word being spoken is highlighted by color, a box, a bounce or a fill exactly as it is said; the eye follows the voice
frames: |
  1. Chunking: speech is split into pieces of 2–3 words in 9:16 and 3–6 words in 16:9 (≤ 2 lines); a boundary is a pause
     ≥ 0.25 s, a punctuation mark or the character limit. A chunk appears whole 2 frames before its first word (cut or a pop
     ×0.92 → ×1.0 over 3 frames @25 / 4 @30) and stays in one place while its words are spoken; a shot cut inside the chunk
     does not reset it.
  2. Highlight: on the frame where each word starts (1 frame early) the active word changes — color (white → yellow) within
     0–2 frames; or a box slides under it over 3 frames @25 (4 @30, outCubic); or the word bounces ×1.10–1.15
     over 3 frames and returns over 4 @25 (4 and 5 @30, outBack); in a song — color fills the word from left to right over exactly
     its duration.
  3. A word keeps the highlight until the next one starts; a short function word (< 3 frames) gets a minimum of 3 frames @25
     (4 @30) borrowed from its neighbor. Spoken words return to the base color (current mode) or stay colored
     (accumulate mode); words not yet spoken are at full brightness or semi-transparent at 40–50 % (ghost mode).
  4. Chunk change — in place: the new one cuts in at the same position. Pause before the next chunk ≤ 0.6 s — the old one holds
     (the last word keeps the highlight) until the new one appears, back to back, with no empty frame; pause > 0.6 s — the chunk goes out
     4–6 frames @25 (5–7 @30) after the end of the last word.
  5. The chunk's keyword (a number, an amount, a negation, the key word of the phrase) — in a second color or a box, and it stays
     colored until the end of the chunk; no more than one per chunk.
variants:
  - active word color — a white line, the word being spoken is yellow or green, spoken words return to white
  - running box — a rounded box in the accent color slides under the word being spoken over 3 frames, the text on it is black
  - bounce — the word being spoken is slightly larger, ×1.10–1.15, with a bounce; often combined with a color change
  - accumulate — spoken words stay colored, by the end of the chunk the whole line is colored
  - ghost — the whole chunk is visible at 40–50 %, words light up to full brightness as they are spoken; a soft mode for a calm or dramatic tone
  - song fill — color fills each word from left to right over its duration (classic karaoke), 1–2 lines, song lyrics from the user
  - keywords in two colors — numbers and key words in a second color (green — good, red — bad), the rest follows the base scheme
status: code
fallback: |
  Word-level timestamps are needed: speech recognition with word timecodes (edit-voice); for a song — lyrics from the user,
  aligned to the vocal word by word; we do not put other people's song lyrics into the library. If the timestamps are inaccurate (offset
  from the voice onsets > 2 frames for > 10 % of words) — ghost mode without hard switching, or regular subtitles
  (type.subtitles). Translation: a translation has no timestamps of its own — after dubbing, transcribe the dubbed track again;
  without dubbing, split the phrase in proportion to syllables or drop the highlight and use type.subtitles.
params:
  type_class: "grotesque 700–900 covering the caption language: rounded 800 — friendly UGC; condensed caps 800–900 — viral and motivation; neutral 700 in lowercase — explainer and clips; tabular figures for numbers; one typeface and one highlight style per video; font size = em size, cap height ≈ 0.7 × font size"
  case: "caps — viral and motivation (the line is 15–20 % wider, fewer words per chunk); sentence case — explainer, UGC, clips"
  size_9x16: "font size 4.2–5.5 % H (80–105 px @1080×1920), typically 4.6 % H; fast speech (> 4 words/s) — a chunk of 1–2 words up to 6.5 % H; line ≤ 76 % W (≈ 14 characters in caps in a wide grotesque, 18 in a condensed one, 20 in lowercase) — if it does not fit, first reduce the font size to 4.2 % H, then wrap; ≤ 2 lines, leading 1.05–1.15"
  size_16x9: "font size 5.5–7 % H (59–76 px @1920×1080), typically 6 % H; ≤ 32–36 characters per line, ≤ 2 lines; width ≤ 80 % W"
  position_9x16: "chunk center x 0.47, y 0.64–0.70 (typically 0.67, block within 0.58–0.78); talking head in close-up — under the chin, y 0.50–0.58; never cover the mouth and eyes (face mask → shift in steps of 2 % H); top 12 %, bottom 20 %, right 12 % — interface; one position for the whole video"
  position_16x9: "x 0.5; block center 0.84–0.88 H, baseline of the bottom line ≤ 0.92 H; margins ≥ 5 %"
  color: "base #FFFFFF; active word — yellow #FFE14A, green #45F06B or light blue #3FE0FF (one per video); box — accent color with #000 text (contrast ≥ 7:1) or purple #7A3CFF with white; ghost — words not yet spoken at 40–50 % opacity; keyword — a second color (green for good, red #FF4B4B for bad), ≤ 1 per chunk and ≤ 25 % of chunks"
  stroke: "a #000 stroke 8–12 % of the font size thick, or a shadow — offset down by 4 % of the font size, blur 8 %, opacity 70 %; the box mode has no stroke"
  box: "padding 0.28 × font size on the sides and 0.12 top and bottom, corner radius 0.22 × font size; slides to the next word over 3 frames @25 / 4 @30 (outCubic), resizing to the word's width; does not disappear between the words of a chunk"
  bounce: "×1.10–1.15 around the word's center, growth 3 frames @25 / 4 @30, return 4 frames @25 / 5 @30 (outBack); do not push the neighbors apart — keep a word-space reserve of +0.1 × font size"
  timing: "the chunk appears 2 frames before the first word (−80 ms @25, −67 ms @30); the highlight switches 1 frame before the word starts; minimum highlight 3 frames @25 / 4 @30 (time is borrowed from the neighbor, shift ≤ 2 frames); pause before the next chunk ≤ 0.6 s — back to back (the old one holds until the new one appears); > 0.6 s — a tail of +4–6 frames @25 / +5–7 @30 after the end of the last word, then empty"
  fill_song: "fill from left to right over the word's duration (linear) with a soft edge of 0.08 × font size; on drawn-out sung words — by syllables; 1–2 lines, line breaks follow the vocal phrases"
  chunking: "9:16 — 2–3 words (fast speech — 1–2), 16:9 — 3–6; boundary — a pause ≥ 0.25 s or a punctuation mark; chunk ≤ 2.5 s (9:16) / ≤ 4 s (16:9); line lengths within ±30 %; do not leave prepositions, conjunctions and particles (in, on, at, to, by, of, for, from, with, off, as, and, but, or, nor, so, yet, not, no) at the end of a line — a non-breaking space with the next word; do not split a number from its unit ('15 %', '3,000 USD')"
  reading: "≤ 20 characters/s per chunk (the highlight guides the eye, so slightly higher than regular subtitles); speech 2.5–4 words/s"
  sync_tol: "highlight start within ±1 frame of the word start for ≥ 95 % of words (checked against voice onsets); offset > 2 frames for > 10 % of words — re-alignment or ghost mode"
when: |
  Speech genres — the main caption style for short vertical videos: clips cut from a podcast or a stream, UGC ads,
  motivation over voice-over, an explainer with a talking head — the whole video, from the first word of the hook to the CTA.
  By part: hook (first 1–3 s) — larger (5–5.5 % H) and with a bounce; build (the "problem", explanation) — calmer, color
  only; drop (the "solution", demo, main argument) — keywords and numbers in a second color; outro (CTA) — the call-to-action
  word as the accent, a chunk of 1–2 words. Music videos with vocals — a fill along the song line in the chorus (fan edit;
  calm in ghost mode), 1–2 lines, only if the user sent the lyrics; no captions on instrumental breaks or on a drop without
  vocals. One highlight style and one accent color per video; keywords ≤ 1 per chunk and ≤ 25 % of chunks.
avoid: |
  A highlight that lags or leads the word by more than 2 frames — it looks broken; blinking (the chunk goes out and
  comes back on pauses ≤ 0.6 s); more than 2 lines and 3 words per chunk in vertical; three or more colors, different highlight
  styles in one video; bounce + color + box at once on every word; a jumping chunk position; text over the mouth
  and eyes; the bottom 20 % and right 12 % in 9:16; a music video without vocals and a cinematic tone (epic, fashion,
  phonk) — it looks like a podcast; a fake highlight on a translation without word-level timestamps — worse than none.
sfx: |
  No sound is needed — the captions follow the voice. Duck the music under the voice, duck(music, under=voice), by −12…−18 dB
  so the words stay intelligible; on the hook's keyword you can add a quiet pop or tick (−20…−24 dB), no more than 1 per 5 s.
genres: {clips: signature, ugc: signature, motivation: signature, explainer: allowed, viral: allowed, product: allowed, sport: allowed, travel: allowed, drama: allowed, fanedit: allowed, teaser: allowed, epic: forbidden, phonk: forbidden, fashion: forbidden, calm: forbidden}
detect: |
  Text detector in the caption band (9:16 — 0.45–0.80 H; 16:9 — 0.78–0.95 H): the chunk box stays in place (IoU of adjacent
  frames > 0.9) for 0.6–2.5 s, and inside it one word differs from the rest — by color (its own hue peak: yellow
  ≈50–60°, green ≈120–140°), by background (a solid rounded box behind the word) or by size (word box height
  ×1.08–1.15). The differing word steps from left to right every 0.15–0.6 s (typically 0.25–0.35 s with speech at 3–4 words/s),
  the steps coincide with word starts in the speech (voice onsets or VAD, ±2 frames); chunk change — a jump within 1 frame at a pause.
  ed_motion: over one chunk's span overlay-mask 0.02–0.08 (static text on a moving shot), global
  motion — same as the shot's; the caption survives cuts unchanged.
  Differences: type.subtitles — the phrase holds without per-word color changes; type.kinetic — 1–3 large words (≥ 10 % H) replace
  each other with scale animation, there is no line; type.beat_text — changes on the music's beat grid, not on speech;
  type.margin_notes — letter-by-letter typing next to the subject; gfx.callout — the label is attached to an object.
engine: |
  subtitle(words=asr_words(lang)|lyrics_aligned(user_text), karaoke=True,
           style={class:'grotesk_black'|'grotesk_rounded_bold'|'grotesk_condensed_caps', weight:800, caps:False|True,
                  size:0.046*H (9:16) | 0.06*H (16:9), color:'#FFFFFF',
                  stroke:{w:0.1*size, color:'#000'} | shadow:{dy:0.04*size, blur:0.08*size, a:0.7}},
           highlight={mode:'color'|'box'|'bounce'|'fill'|'ghost', progressive:False, active:'#FFE14A', upcoming_alpha:1.0|0.45,
                      box:{fill:'#FFE14A', text:'#000', pad:[0.28, 0.12], radius:0.22, slide:'3fr@25|4fr@30', ease:'outCubic'},
                      bounce:{scale:1.12, grow:3fr, back:4fr, ease:'outBack'},
                      keyword:{pick:'numbers|negation|llm', color:'#45F06B', max_per_chunk:1}},
           chunk={words:[2,3] (9:16) | [3,6] (16:9), max_width:0.76*W | 0.8*W, max_lines:2, break_on_pause:0.25,
                  max_dur:2.5|4.0, no_orphans='ru', keep_units:True, keep_across_cuts:True},
           lead=-2fr, switch_lead=-1fr, min_on='3fr@25|4fr@30', join_gap=0.6, tail='4–6fr@25|5–7fr@30',
           pos={x:0.47, center_y:0.67} (9:16) | {x:0.5, center_y:0.86} (16:9), avoid=track(face), safe_zone='tiktok')
  — new subtitle parameters: highlight, switch_lead, chunk.no_orphans, chunk.keep_units.
  song: karaoke_fill(word, t=[w0, w1], dir='ltr', ease='linear', soft=0.08) — new primitive; words — lyrics_aligned.
  sound: duck(music, under=voice) −15 dB.
  checks: qa_sync(highlights, voice_onsets, tol=1fr) — new; qa_text_safe_zone(layout='tiktok'); qa_reading_speed(max_cps=20);
            qa_overlap(face).
