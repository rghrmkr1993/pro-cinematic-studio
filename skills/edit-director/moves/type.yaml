id: type.credits
family: type
group: graphics
level: B
aliases: [credits, end credits, closing credits, opening credits, credit roll, rolling credits, scrolling credits, credits over picture, crew list, who shot it]
what: the list of the video's creators (role and name) at the start or at the end — as changing cards or as a column rolling up, on a black field or over the last calm shot; it closes the piece, credits the team and sets the signature style of the work
frames: |
  1. Placement: the end of the video (most often) — after the last action or over the last shot; less often the opening —
     over the first wide shot (top-down view, a road, an interior). The text appears by a cut within 1 frame over
     the running shot, after the subject has left the frame, or on a cut to a black field.
  2. The role — name pair is the basic unit. The role is 0.3–0.6 of the name's size: role 1–2 % H, name 2–5 % H
     (height of the letter line, H — frame height); one or two accents (the title, the director) 6–8.5 % H. Dense lists — 1–1.7 % H.
     Line pitch 1.3–1.6 × the line height, one or two empty lines between groups.
  3. Layout (one for the whole credits block):
     (a) centered stack — role above name, everything on the axis x = 0.5;
     (b) two columns — roles flush left, names flush right (margins 5–6 % from the edges), dots or dashes between them,
         or a shared central gutter: roles aligned right to the axis, names aligned left from it;
     (c) a grid of 2–3 columns in a small font size across the whole frame;
     (d) a solid justified paragraph 77 % of the frame wide: role in bold caps, followed by the names in regular weight;
     (e) a column at the frame edge (margin 4–6 %) next to an image — a behind-the-scenes photo, empty sky, a top-down view;
     (f) one line across the full width — name — role — name, large.
  4. Motion — one of two modes:
     cards — the block holds and changes by a cut (more often) or a 0.2–1.4 s dissolve; it holds from 0.8–1.2 s
     (1–3 names, a quick delivery in a music video) to 2.4–2.7 s (7–10 lines) and 5 s or more (a dense page);
     roll — the column crawls up at a constant speed of 8–28 % H per second (median ≈ 20 % H/s, variation within
     one video ±5 %), the background holds still or lives its own life.
  5. End: the last card or the last line leaves, and the background, a logo, a handwritten signature or a black
     field remains; a variant — two flash frames and a hard stop, like the end of a film reel.
variants:
  - "cards on black: a centered stack or two columns with dots, changing by a cut every 1–2.7 s"
  - "roll on black: a long two-column list (small role | large name) moves up at ≈20 % H/s"
  - "over the last shot: the subject has left, an empty background remains (a wall, sky, the sea), and cards appear on it or a column crawls over it"
  - "opening over the first shot: one large line or a 'starring' block with small roles — crawling up over a top-down view or a road"
  - "column next to an image: on the left, behind-the-scenes photos or frames from the video change inside a white border, on the right the list crawls"
  - "paragraph page: the whole team in one dense justified paragraph, bold roles in caps, holds for a long time and dissolves"
  - "text following the composition: the block is aligned to one edge, and its other edge follows the diagonal of a wall, the horizon line or the edge of an object"
