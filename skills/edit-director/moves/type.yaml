commands: ["kinetic text from the key words of the voice on the hook", "words one at a time in the center with a pop on #2–#4", "a strobe of huge words on the drop, half a second", "a 3-2-1 countdown before the drop", "a list of benefits in words between the product shots"]
related: [type.subtitles, type.title_card, type.repeat, type.behind_subject, type.beat_text, type.karaoke, type.credits, type.diegetic, cut.flash, trans.zoom, type.hand_drawn]
