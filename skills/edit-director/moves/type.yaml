id: type.margin_notes
family: type
group: graphics
level: B
aliases: [margin notes, handwritten annotations, narrator's notes, handwritten notes, on-screen notes, on-screen annotations, on-screen calculation, crossed-out price, character introduction caption]
what: the narrator's handwritten notes right in the frame — amounts, labels, a calculation with an arrow and a total are typed out letter by letter in time with the speech next to the subject, old values get crossed out and corrected; the viewer sees the scene's bookkeeping or who is who
frames: |
  1. Frame: the speaking subject in a medium shot is offset to one side (or centered); the notes take the empty side —
     x 0.55–0.91 with the subject on the left, 0.09–0.45 with the subject on the right — or sit by the shoulder (x 0.61–0.86, y 0.54–0.63) when
     the face is centered. The background is dark (median brightness ≈40), so the text has no backing and no shadow.
  2. Font — a handwritten marker style with an uneven line, lemon yellow (≈#DBDB40). A line is 5.6–9 % of the height of a 2.39:1 frame
     (≈4–7 % H in 16:9), left-aligned, line pitch 1.2–1.5 × the line height; the list grows from top to bottom (y 0.12 → 0.87).
  3. Typing: each line appears character by character from left to right — 10–26 characters per second (27–60 % of the frame width per second;
     digits faster, words slower), 0.4–0.5 s for a short line and up to 2.1 s for a long one; a new line — roughly
     every 0.7 s, exactly when the subject names a number or an item.
  4. Correction: the old value is struck through with a horizontal line in ≈0.3 s; ≈0.6 s later the new value is typed one line below,
     shifted right by ≈3 % of the width (≈0.5 s). Link: an arc-shaped arrow is drawn in ≈0.5 s
     from the line to the total.
  5. Punchline finale: a separate word with a question or exclamation mark, 2–3 times larger than the list lines, is typed in
     ≈0.27 s in another place — above the subject's gesture.
  6. The notes stay until the end of the scene and survive cuts: when cutting to the other person, the same list jumps
     to the free side of their frame.
variants:
  - calculation — a label, an amount, "plus", a rate, "equals", a total; the lines are typed as the conversation goes, an arrow leads to the total
  - correction — an amount is crossed out, the corrected one is typed under it with an offset; "before — after"
  - by the shoulder — one large line next to the speaker's face, then a correction
  - introduction caption — the subject's name is typed above their head in an upper corner of the frame (a line of 2.8–5.7 % H) and holds for the whole shot; in a collage treatment — cut-out letters ≈12 % H assemble two at a time, on twos, by the subject in the lower third
  - object caption — 2–3 lines of "what it is, where it's from, what it costs" next to the item or above it (top-down view), holding ≥5 s
  - punchline — one large word with a question mark over a gesture at the end of the list
status: code
fallback: |
  In code on any shot with an empty side of the frame; if there is no free space — crop with room to spare (reframe that
  shifts the subject toward the edge) or reduce the font size to 3.5 % H. Line timing — from the word-level timestamps of speech
  recognition (numbers and key words).
params:
  font: handwritten marker or pen (OFL), uneven line, one color
  color: lemon yellow ≈#DBDB40 (RGB 214–219 / 207–221 / 64–68); on a light background — the same color with a 1–2 % H shadow, or black
  line_h: 4–7 % H in 16:9 (5.6–9 % H in a 2.39:1 frame); introduction caption 2.8–5.7 % H; punchline ×2–3
  layout: left-aligned; line pitch 1.2–1.5 × line height; block 26–36 % of the width in the free half of the frame; margins ≥ 5 %
  side: the side opposite the face (x 0.55–0.91 or 0.09–0.45); by the shoulder — x 0.61–0.86, y 0.54–0.63; on a cut to the other person — mirrored
  type_on: 10–26 characters/s (names and labels ≈10–13, numbers ≈26); a short line 0.4–0.5 s (10–12 frames @25)
  line_rhythm: a new line ≈ every 0.7 s — on the number word in the speech (±2 frames)
  strike: a horizontal line through the middle of the text line, thickness ≈ 10 % of the line height, drawn in ≈0.3 s (8 frames)
  correct: ≈0.6 s after the strikethrough, one line below, shifted +3 % of the width, typed in ≈0.5 s
  arrow: an arc from the line to the total, drawn in ≈0.5 s (12 frames), same thickness as the letters
  punch: a word ×2–3, typed in ≈0.27 s (7 frames), above the gesture or in the lower third
  persist: until the end of the scene; across cuts — the same list, rearranged to the free side of the new shot
when: |
  Conversations about money, deadlines, quantities — the numbers appear as they are spoken; "before — after"
  in a product video and UGC (the old price crossed out, the new one under it); an explainer video — a calculation or a list
  of arguments next to the speaker; introducing characters with a caption above their heads; a caption for an object or a place.
  Usually one scene with a list for 3–8 s; the correction is the scene's climax, the punchline is its full stop.
avoid: |
  A busy or light background without contrast; more than 7–8 lines at once; typing faster than the speech (the viewer cannot keep up)
  or far behind it; notes over a face; different colors and fonts in one list; a serious tragic moment —
  the device is ironic; in 9:16 — a right-hand column under the interface buttons (the right 12 %).
sfx: |
  Quiet clicks or a marker rustle during typing (−20 dB under the speech); a sharp pen squeak on the strikethrough; on
  the punchline — a pause in the music or a short hit.
genres: {explainer: signature, ugc: allowed, product: allowed, clips: allowed, viral: allowed, sport: allowed, motivation: allowed, epic: forbidden, fanedit: forbidden}
detect: |
  ed_motion: static camera (jitter < 0.1 %), no events; overlay-mask 0. Own checks: small text 4–9 % H
  in one saturated color appears piece by piece — the right edge of the line grows in steps at 27–60 % of the width/s, new
  lines are added below every 0.5–1 s; a horizontal line appears over an existing line (strikethrough);
  the block sits on the side opposite the face (face detector) and survives a cut with a mirrored rearrangement.
  Differences: subtitles — bottom center of the frame, replaced entirely with each line of dialogue; kinetic text — large words
  one at a time, animated, and they leave; callout (gfx.callout) — a plate or an arrow attached to an object; intertitle —
  one line of time or place, disappears entirely after 1.3–2.9 s; type.hand_drawn — large handwritten text
  that is written stroke by stroke or boils, not a list of notes typed in a handwriting font.
engine: |
  new primitive margin_notes(items=[{op:'write', text, at=word_ts}, {op:'strike', i}, {op:'correct', i, text},
      {op:'arrow', from_i, to_i}, {op:'punch', text, anchor=track(person:hands)}], side='auto' (the free side per the
      face detector), font='handwriting_marker', color='#DBDB40', line_h=0.05*H, pitch=1.35, cps=18,
      strike_dur=0.3, correct_delay=0.6, correct_indent=0.03*W, arrow_dur=0.5, persist_across_cuts=True, mirror_on_cut=True)
    = text(anim='typewriter', cps) per line + shape(kind='strike'|'arrow', draw_on=dur).
  introduction caption: text(name, style='handwriting_marker', size=0.04*H, anchor=track(person:head), offset=[0, -0.12*H], anim='typewriter', cps=12).
  sync: subtitle-ASR provides word-level timestamps — write at the start of the number word; sfx('click', gain=-20dB) per character.
gen_hint: medium shot of a person talking to someone off-camera in a dim room, subject on the left third, large clean dark negative space on the right side of the frame, static camera, no text
commands: ["next to the subject, type out the amounts they name and the total with an arrow", "cross out the old price and type the new one under it at 0:12", "label the characters in handwriting above their heads in #2", "at the end of the list, a large word with a question mark above their hands"]
related: [type.intertitle, type.hand_drawn, type.kinetic, type.subtitles, gfx.callout, gfx.counter, gfx.floating_ui, type.title_card]
evidence: {examples: 8, sources: 2, measured: "color RGB 214–219/207–221/64–68 on a background with a median of ≈40; lines 5.6–9.1 % of the height of a 2.39:1 frame, pitch 9.8–12.6 % (1.2–1.5 lines); block x 0.55–0.91 or 0.09–0.45 depending on the subject's side, a single amount by the shoulder x 0.61–0.86 / y 0.54–0.63; typing 27–60 % of the width/s (11 digits in 14 frames @33 = 0.42 s; a long line in 2.1 s); a new line every ≈24 frames @33 (0.72 s); strikethrough in ≈11 frames @33 (0.33 s), correction 0.6 s later with a +3 % width shift over 16 frames (0.48 s); arrow ≈0.48 s; punchline ×2–3 in 9 frames @33 (0.27 s); the list moved to the free side after the cut to the other person (x 0.09–0.45 → 0.55–0.91); captions above the subject 2.8–5.7 % H and for objects 2–3 lines ≥5 s (7 examples from one source); from the general typography section — a name in cut-out letters ≈12 % H, letters added every other frame @25 (on twos), x 0.07–0.50, y 0.60–0.98", confidence: medium}
