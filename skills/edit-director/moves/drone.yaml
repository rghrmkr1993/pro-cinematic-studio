id: drone.fpv
family: drone
group: camera
level: B
aliases: [FPV, FPV drone, FPV fly-through, racing drone, drone fly-through, drone flight, first-person drone]
what: a rapid flight of a light drone right next to surfaces — banking into turns, diving along walls and flipping over, in a single 3–10 second take
frames: |
  1. Starts already at speed: the camera is 0.5–2 m from the ground, a wall or a roof, a wide lens with barrel
     distortion (curved horizon), nearby objects rush past the frame edges with motion blur — the edges are 1.5–4 times
     softer than the center.
  2. Turn: in a turn the frame rolls over (banking) by 15–50° in 0.5–1 s and comes back;
     in dynamic takes the roll is continuous, p90 speed 27–150°/s (1–6° per frame).
  3. Peak element (one per take): a dive down a facade turning into a straight top-down view, a climb up a wall
     revealing a panorama over the roof edge, an orbit around an object with a 120–180° flip in 1–2.5 s
     or a pass skimming past a car or a person. Frame shift at the peak 2–5 % per frame.
  4. Landing: speed drops, the horizon levels out in 0.5–1 s, the frame settles on the subject (a person
     at the end of an alley, an athlete in a square, a car in smoke) or opens up a wide shot. The whole take has no cuts.
variants:
  - low straight skim: 0.5–1 m above a field, road or alley, level horizon (roll < 10°), forward ×1.5–2 per second, the lower half of the frame is solid streaks of motion blur
  - chase: stays 1–3 m from a car, motorbike or runner, the roll swings ±35° following the subject's turns, at the end it breaks away into a wide shot
  - facade: approach to a building, roll and dive down the wall or a climb up the wall revealing the city, ending on a top-down view
  - acrobatic orbit: a banked turn around a landmark with a flip over the roof (up to 150° of roll), coming out on a frontal shot of the object
status: footage
fallback: |
  1) search the source footage: drone and action shots with the signature from detect;
  2) code imitation from a wide or 4K shot from a drone, a car or handheld on the move: constant push + rocking roll + fine
     vibration + radial blur + barrel distortion — convincing for 1.5–3 s, without real parallax;
  3) generation with the user's consent from gen_hint (4–5 s), the best option for dives and flips
params:
  shot_length: 2–6 s in the edit (source takes 2.9–9.5 s); typically 3–4 s = 75–100 frames @25 fps
  altitude: ≈0.5–2 m from the surface, passing ≈1 m from objects
  roll: banked turns ±15–50°, flip 120–180° in 1–2.5 s; roll rate 25–150°/s, on a straight < 10°/s
  forward_rate: ×1.5–2 of apparent scale per second along the heading (≈×1.02–1.03 per frame @25 fps)
  pan_tilt_rate: 2–5 % of the frame per frame in turns and dives
  lens: wide 120–150° ≈, barrel distortion visible on the horizon; edges 1.5–4 times softer than the center
  fake_fpv: push ×1.3–1.8 per take, linear; sinusoidal roll ±8–15° with a period of 1.5–2.5 s; vibration 0.2–0.4 % of the frame at 12–20 Hz; zoom_blur 0.3–0.5; barrel k ≈ −0.15…−0.2
  crop_margin: roll ±10° needs a crop margin of ×1.3, ±20° — ×1.55 (16:9 and 9:16); below 4K the roll imitation turns mushy
when: |
  hook and intro (the first 1–3 s — a dynamic "entry" into the location); a transition between locations via a dive
  or a flight through an opening; the build before the drop with acceleration, on the drop — a cut at the peak of the
  roll; revealing the subject at the end of the flight.
  No more than 2–3 FPV shots per 30 s; cut adjacent FPV shots by matching the direction of roll or movement.
avoid: a calm, luxury or conversational tone (a smooth drone shot is needed there); dialogue over it; several flips in a row and a take longer than 8 s with no event (causes motion sickness); text near the frame edges during a roll; a vertical 9:16 crop from 16:9 FPV — the barrel distortion breaks at the edges; imitation on 1080p with a roll beyond ±10°
sfx: continuous airflow or wind over the whole flight; a short whoosh on every close pass by an object; a riser before the panorama opens up; a hit or a bass accent on landing on the subject
genres: {travel: signature, sport: signature, epic: allowed, viral: allowed, product: allowed, phonk: allowed, teaser: allowed, clips: allowed, motivation: allowed, calm: forbidden}
detect: |
  ed_motion: a single take of 3+ s with no real cuts; ROTATE events of 20–150° peaking at 3–7°/frame; SHIFT 20–80 % of
  the frame in turns; alternating ZOOM-IN and ZOOM-OUT with nonrigid 0.25–0.8 (real parallax, not a zoom).
  Caution: at a step of 3–4 frames a fast roll produces false "cuts" — recheck with a step of 1.
  Skimming variant: few events, but a steady forward expansion and strong blur in the lower half of the frame.
  Visually: curved horizon, roll, nearby surfaces, a top-down view mid-take.
  Difference from drone.aerial: that one is slow (< 0.5 % of the frame per frame), high, with a level horizon (roll < 3°).
  Difference from handheld: a handheld camera has a vertical "walking" bob at 1.5–2.5 Hz at eye level, no banked turns.
  Difference from a car-mounted camera: the horizon is tied to the car, no free dives or flips.
engine: |
  Real shot: cut(at) on the event + optionally speed(curve=[[0,1],[0.5,1.4],[0.8,0.6],[1,1]], interp='blend');
  the join of two FPV shots — at the peak of the roll, match(on='motion').
  Imitation (fake_fpv) on a wide or 4K shot, D = 2–3 s:
    transform(scale=[1.35, 1.75], center=[0.5, 0.45], t=[0, D], ease='linear')
    + transform(rotate=[-12, 12], t=[0, D/2], ease='inOutCubic') + transform(rotate=[12, 0], t=[D/2, D], ease='inOutCubic')
    + shake(amp=0.3 % of the frame, freq=15, axes='xy') + shake(amp=0.4°, freq=8, axes='rot')
    + blur(kind='zoom', amount=0.4, center=[0.5, 0.45]) + lens_distort(k=-0.18, zoom_comp=True) + vignette(0.15)
  Generation: generate_video from gen_hint, 4–5 s, then treat it as a real shot.
gen_hint: FPV drone shot, fast first-person flight a meter above <terrain or street>, banking turns that tilt the horizon, dives down the facade of <building> into a top-down view, wide fisheye lens, motion blur on the edges, ends by revealing <subject>
commands: ["open the video with an FPV flight over the city", "make a fake FPV from drone shot #3 with roll on the turns", "an FPV pass down the alley on the build, cut on the drop matched by roll", "generate a 4-second FPV dive along the tower"]
related: [drone.aerial, time.speed_ramp, roll.whip, lens.fisheye, track.follow, pass.through]
evidence: {examples: 7, sources: 7, measured: "takes 2.9–9.5 s with no cuts (false ed_motion cuts at a step of 3–4 checked frame by frame); roll up to ±35–50° in chases and dives, a 146° flip in 2.4 s; p90 roll rate 27–148°/s in dynamic takes, 6–9°/s in skimming ones; shift p90 2–5 % of the frame per frame; forward expansion ×8.4 in 3.4 s in an alley; nonrigid 0.25–0.8; edges 1.5–4 times softer than the center; barrel distortion visible in 5 of 7", confidence: high}
