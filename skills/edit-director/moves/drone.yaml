id: drone.aerial
family: drone
group: camera
level: B
aliases: [aerial shot, drone shot, aerial footage, filming from the air, drone view, helicopter shot, flyover, terrain flyover, drone reveal, dronie, drone pull-back, establishing aerial]
what: filming from the air — a drone or helicopter flies smoothly high above a city, nature or a road — reveals the place, follows a car or a boat, flies away from the subject or dives toward them; the main establishing shot and a link between locations
frames: |
  1. Altitude and angle: the camera is tens to hundreds of meters above the ground (≈), looking down at ≈20–60° — the
     horizon in the top 5–40 % of the frame (≈2/3 of examples) — or steeper, down to straight down, with no horizon
     (≈1/3). No faces, people are dots up to 5 % of the frame height, a car is 10–30 % of the width; the frame is
     filled with large-scale environment — roofs, fields, roads, water, lights.
  2. Smooth movement, as on a gimbal: jitter ≤0.3 % of the frame (26 of 33). Flying forward — the picture grows evenly
     ×1.2–1.4 per second (≈×1.007–1.014 per frame @25 fps); pulling back — it shrinks ×0.6–0.9 per second; sideways or
     diagonal drift 3–27 % of the frame per second (0.1–1.1 % per frame); a slow turn — up to 5–6°/s. High shots have
     weak parallax (nonrigid 0.03–0.28), low flyovers over the ground and past objects — 0.3–0.65.
  3. One event inside the shot: the foreground moves away and the view opens up, the camera finds a car or a figure,
     rises from the object, dives toward a target. Curve: reveal and pull-back have a fast start and a long deceleration
     (half the distance in the first 20–30 % of the time), the descent accelerates, flyover and drift are even.
  4. Shot length 1.4–7 s, median ≈3 s (75 frames @25 fps); in a montage sequence — 0.2–0.6 s each.
  5. Light: night (lights, neon) in 10 of 33 and sunset or low sun in ≈6 more; in daytime — haze at the horizon.
variants:
  - forward flyover: over a lake, along a ridge, along a road through rocks, low over a plain — ×1.2–1.4/s for 2–6 s (fast — ×2.4/s), often tilting down at the end, where a tiny figure or car appears (4 of 33)
  - reveal from behind the foreground: tree crowns, a hanging scoreboard, an awning leave the frame in 0.6–1.5 s (×2.2 in 0.7 s or a shift of 28 % of the frame per second), then 2–3 s of slow hovering over the revealed view (3 of 33)
  - pull-back (dronie): the camera flies back and up away from a house, a cliff, a huge object or the subject — the object shrinks, new space slides in from below (a beach, the sea, a field); ×0.21–0.34 over 3.2–3.4 s, often under a title (4 of 33)
  - vehicle tracking: a car or boat from behind and above or at ≈45° — the object stays put in frame, the background flows ≈21 % of the frame per second; a "pulls ahead" variant — the car shrinks from ≈1/3 to ≈1/9 of the width in 4 s (3 of 33)
  - descent and dive to a target: from height down onto a car in a night crowd (×2.5 over 5.3 s, accelerating), spiraling down to a road (a 118° turn in 3.4 s) and on into a chase, whirling into a street canyon (−165° in 2.9 s, peak ≈90°/s); fast dives border on drone.fpv (3 of 33)
  - hover and drift: a night city, neon, an intersection from above — almost static (≤1 % of the frame per second) or a slow turn of 5.5°/s over 7 s; often a cut or a dissolve between two such views (6 of 33)
  - through the clouds: a climb from a top-down view into the clouds or a descent through a gap in the clouds — the white or misty fill hides a cut into another world (a scene above the clouds, a desert below the clouds) (3 of 33)
  - flying into a building: a flight toward the facade and a sharp push-in with motion blur into a window — a cut to the interior (2 of 33)
  - straight down from above: rising over a night block with a searchlight spot (×0.8 in 2 s) or a pass along a bridge at 22 % of the frame per second (2 of 33, see angle.birds_eye)
  - bird flight: the camera flies within a flock of birds or is mounted on a bird above a roof, roll up to 28° (2 of 33)
  - montage sequence: 14 different aerial views of one city in 4.9 s, 0.2–0.6 s each (1 of 33)
status: footage
fallback: |
  1) search the source footage by detect (drone telemetry in the metadata — altitude and gimbal tilt — settles it at once);
  2) code imitation of a high shot — honest, because parallax from above is weak (nonrigid ≤0.25): a 4K frame or a photo
     from a roof, a mountain or an airplane window → a slow push or drift over the still frame, pull-back — reverse scale;
     low flyover — 2–3 depth layers (parallax_layers), convincing up to ≈10 % foreground displacement; reveal — a dark
     foreground moves down out of frame;
  3) generation with the user's consent from gen_hint (4–5 s) — for the reveal, the pull-back from the subject and car tracking
params:
  altitude: ≈30–500 m; looking down 20–60° with the horizon in the top 5–40 % of the frame, or 60–90° with no horizon
  duration: 2–5 s in the edit (examples 1.4–7 s, median ≈3 s = 75 frames @25 fps); sequence — 0.2–0.6 s per shot (5–15 frames)
  forward: ×1.2–1.4 per second (≈×1.007–1.014 per frame @25 fps), fast flyover up to ×2.4/s; ease linear
  pull_back: ×0.6–0.9 per second, ×0.2–0.8 per shot; ease outCubic (half the distance in the first 20–30 % of the time) or linear
  descent: ×1.2–1.3 per second, accelerating (inCubic); spiral dive 35–57°/s, peak ≈90°/s
  drift: 3–27 % of the frame per second (0.1–1.1 %/frame @25 fps); hover ≤1 %/s; turn ≤6°/s
  reveal: the foreground leaves in 0.6–1.5 s (15–38 frames @25 fps), then 2–3 s of hovering over the view
  smooth: jitter ≤0.3 % of the frame, roll ≤±6° (except dives and bird flight)
  subject: people ≤5 % of the frame height; a car 10–30 % of the width; the tracked object stays put in frame ±10 %
  light: night, sunset, golden hour — preferred; in daytime — haze, the top third softer in contrast
  imitation: from 4K — push ×1.15–1.3 over 3–5 s, drift ≤0.3 %/frame; pull-back — scale 1.6 → 1.0 over 3 s; depth layers — foreground shift ≤10 % of the frame
  vertical: 9:16 — a window on the object (car, figure, tower), horizon on the upper third; don't crop a pure landscape, look for a vertical drone shot
when: |
  opening of a video or chapter — "where are we" in 3–4 s, before the wide and medium shots; reveal — the chorus entry
  or the drop, a teaser intro; a transition between cities and locations (two aerials in the same direction butted
  together or through a cloud); ending — a pull-back from the subject, up and back, under a title; road and chase —
  tracking a car from above; a night city from above — a breather and a backdrop for text; a montage sequence of aerial
  views — the hook of a travel video. No more than 2–3 aerials per minute, no more than two in a row, with a
  ground-level shot between them.
avoid: |
  moments where a line of dialogue and facial emotion matter; three aerials in a row with no "ground" (the subject and
  scale get lost); fast cutting over a slow flyover — under 1.5 s the view doesn't read (except a deliberate sequence);
  a shaky drone and a tilted horizon for no reason; speed-up above ×3 — cars and people give it away; reverse on shots
  with walking people, cars, water; a vertical crop of a wide landscape; adjacent aerials with different haze and color
  temperature without matching; imitating a low flyover by shifting a flat picture (without depth layers the fake shows)
sfx: |
  wind and airflow over the whole shot, a distant hum of the city or nature; reveal — a riser into the moment the view
  opens and a hit or a bass beat on it; pull-back at the end — a long swell fading out; dive and spiral — a rising
  whistle, a whoosh and a hit on reaching the target; through the clouds — white noise with wind, breaking off at the
  cut; helicopter rotor noise — only as a device (surveillance, searchlight)
genres: {travel: signature, epic: signature, calm: signature, motivation: allowed, teaser: allowed, sport: allowed, product: allowed, drama: allowed, explainer: allowed, fashion: allowed, viral: allowed, clips: allowed, fanedit: allowed, phonk: allowed}
detect: |
  Cues on frames every 0.5 s (3 of 5 needed; drone telemetry — altitude > 20 m — settles it at once):
  1) no faces, people ≤5 % of the frame height, cars ≤30 % of the width; 2) horizon in the top 5–40 % of the frame or none;
  3) the frame is filled with large-scale environment — roofs, fields, roads, water, city lights; 4) ed_motion: smooth
  movement with no shake — jitter ≤0.3 % and one of: ZOOM-IN ×1.2–1.4/s (flyover), ZOOM-OUT ×0.6–0.9/s (pull-back),
  SHIFT 3–27 %/s (drift, tracking), ROTATE ≤6°/s (turn) or "no significant global motion" (hover); nonrigid ≤0.28 for
  high shots, 0.3–0.65 for low ones; 5) night or sunset — in about half the cases.
  Variants by curve: reveal — in the first 0.6–1.5 s a sharp growth or shift with high nonrigid (the foreground leaves),
  then drift; pull-back — ZOOM-OUT ease-out; descent — ZOOM-IN ease-in centered on a car or figure; tracking — the object
  stays put in frame, the background flows; sequence — cuts every 0.2–0.6 s between different aerial views.
  Distinctions: drone.fpv — low and fast (2–5 % of the frame per frame), rolls ±15–50°, barrel distortion;
  angle.birds_eye — strictly straight down, static or rising; angle.overhead_tracking — straight down with a lead object;
  shot.extreme_wide — camera on the ground, horizon closer to the middle, static; crane.telescopic — height up to ≈10 m,
  interior or crowd; time.hyperlapse — people, cars and clouds jerk, brightness flickers; arc.horizontal (aerial arc) —
  the subject in the center, the background rotates around them.
engine: |
  Search: classify_shot(clip, by='aerial') — detect cues (3 of 5) or telemetry; the variant — by the ed_motion curve.
  Placement: intro — scene_funnel(order=['aerial', 'EWS', 'WS', 'MS']), aerial 3–4 s; transition — cut at the end of the
  movement + match(on='motion') with the next same-direction aerial; ending — pull-back 3–4 s + fade(to='black', dur=1).
  Rhythm: cut on a downbeat; in dynamic genres speed(rate=1.3–2, interp='blend'); reverse() — only if there are no
  moving people, cars or water (local motion check).
  Sequence: cut every 0.25–0.5 s (½ beat at 120 BPM) across 8–14 different aerials in the same direction.
  High-shot imitation from 4K: transform(scale=[1.0, 1.25], center=[0.5, 0.45], t=[t0, t0+4], ease='linear')
  + transform(shift=[[0, 0], [-0.04, 0]], t=[t0, t0+4], ease='linear'); pull-back — transform(scale=[1.6, 1.0], t=[t0, t0+3],
  ease='outCubic') (+ outpaint the edges if the image runs out); low flyover — parallax_layers(depth_map, layers=3, push=1.2).
  Reveal in code: occluder_pass(tone='dark', dir='btt', dur=0.6) + transform(scale=[1.1, 1.0], ease='outCubic').
  Through the clouds: cut on the whitest cloud frame (find_cover_frame) or transition('dip', dur=0.5, params={color: 'white'})
  + blur(kind='zoom') + sfx('whoosh', at=seam, align='peak').
  Generation: generate_video(prompt=gen_hint, dur=5).
gen_hint: cinematic aerial drone shot high above <location>, smooth gimbal-stabilized <slow forward flyover | rising over the treetops to reveal the valley | pulling back and up away from <subject> | following <car or boat> from behind and above | slow orbit over the city lights>, horizon near the top of the frame, tiny people and cars, <golden hour | night city lights>, wide lens, no shake
commands: ["open the video with a drone flyover above the city", "find all the drone shots in the source footage and put a reveal on the drop", "at the end, a drone pull-back from the subject, up and back, under a title", "turn the 4K photo from the mountain into a slow 4-second drone flyover", "quick cuts of aerial views, half a beat each, on the intro"]
related: [drone.fpv, angle.birds_eye, angle.overhead_tracking, shot.extreme_wide, crane.telescopic, crane.pedestal, arc.horizontal, time.hyperlapse, pass.through, trans.hidden_cut, trans.zoom, cut.vector_match]
evidence: {examples: 33, sources: 28, measured: "all 28 sources in the section; shots 1.4–7 s (median ≈3 s); jitter ≤0.3 % in 26 of 33; forward flyover ×1.21–1.41/s (fast ×2.4/s), pull-back ×0.21–0.34 over 3.2–3.4 s (2 of 3 with a fast start — half the distance in 21 % of the time, one even), descent ×2.46 over 5.25 s, accelerating, spiral dives 118° in 3.4 s and −165° in 2.9 s, drift and tracking 3–27 % of the frame per second, hover ≤1 %/s; nonrigid 0.03–0.28 for high shots, 0.32–0.63 for low ones; night in 10 of 33; sequence — 14 views of 0.2–0.6 s each; altitude and tilt angle are visual estimates", confidence: high}
