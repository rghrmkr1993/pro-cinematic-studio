id: rig.spin_lock
family: rig
group: camera
level: C
aliases: [world spins around the subject, rotating with the subject, subject and camera on a turntable, spin lock, world spin, rotating platform shot]
what: the subject and the camera rotate together on one platform — the person is frozen in the center of the frame while the room or the city races around behind them
frames: |
  The subject — a medium shot or close-up in the center, often from below; relative to the frame they barely move
  (< 0.6 % of the frame per frame, only their own gestures). Everything standing on the platform with them (a table,
  a machine, dishes) is also still. The background behind them sweeps evenly sideways: 30–80 % of the frame width per
  second in the calm variant, 135–225 %/s in the energetic one — with strong horizontal motion blur of lights and
  walls. With the camera below, the ceiling also turns in the frame plane (≈2.5° per frame). Duration 0.7–5 s.
  The room light glides over the subject during the rotation — the face moves between highlight and shadow.
variants:
  - performer on a revolving stage: from below, smoke or lights behind them, hands up
  - working at a machine or a desk: the person is focused, the workshop flies around in a blur
  - view from below: a ceiling with pipes and lamps rotates around the head
  - change of places: behind the still subject at a table, the blurred background changes to other locations (hidden cuts)
  - table with guests: the camera and the dishes on the turntable are still, the guests change with cuts (a transitional case toward pan.round_table)
status: hybrid
fallback: |
  1) a real shot from the source footage (detect);
  2) imitation: a subject mask + a circular scroll of the background — a panorama, a 360 frame or a wide shot of the
     location, with motion blur; convincing with fast rotation (the blur hides the flat background), with slow rotation
     the "cardboard" look shows;
  3) generation with the user's consent from gen_hint
params:
  bg_speed: 30–80 %/s calm; 135–225 %/s energetic (≈20–150°/s with a normal lens)
  subject_drift: < 0.6 % of the frame per frame; a sway of ±3 % is acceptable
  roll_bg: when looking from below, the background turns 2–3° per frame in the frame plane
  blur: directional along the rotation, length ≈ the background shift per frame (5–15 % of the width on fast ones)
  duration: 0.7–5 s (18–125 frames @25 fps)
  light_sweep: brightness variation on the subject of 15–30 % with the period of one revolution
when: the subject's inner state — euphoria, dizziness, total absorption in the task, "the whole world spins and I'm at the center"; the climax of a music video or the drop; a transition between locations where the subject stays and the world changes; no more than once or twice per video
avoid: the subject moves a lot in the frame (the "lock" is lost); hair, smoke and anything transparent at the mask edges in an imitation; a slow imitation on a flat background; longer than 5–6 s (causes motion sickness); on top of handheld shake
sfx: a rising whistling pass or wind over the whole rotation; on a change of place — a whoosh at the moment of the blur; on the drop — a hit at the start of the rotation
genres: {fashion: allowed, drama: allowed, viral: allowed, fanedit: allowed, teaser: allowed, product: allowed, motivation: allowed}
detect: |
  ed_motion often reports "no global motion" (the frame is filled by the still subject) or gives a one-directional
  SHIFT with ROTATE when looking from below. Reliable check with a person mask: inside the mask the displacement is ≈0,
  in the background ring — a constant horizontal flow of 1.5–9 % of the frame per frame in one direction; blur only on
  the background.
  Difference from rig.locked_on (digital lock): there the whole frame moves together with the subject and the edges
  wander; here the frame is full and only the background moves.
  Difference from an orbit (arc): in an orbit the subject is seen from a changing angle (they turn relative to the
  camera); here the angle on the subject doesn't change.
  Difference from orbit.turntable: there the subject spins against a still background.
engine: |
  Imitation (D = 1–4 s):
    mask(method='mediapipe_person'|'hf_remove_background', feather=6)
    + background: reframe360(yaw=[0, 120–300], t=[0, D], ease='inOutQuad') or transform(shift=[[0,0],[-1.5,0]], t=[0, D], ease='inOutQuad') over a wide panorama
    + blur(kind='directional', amount∝background speed) on the background only
    + transform(rotate=[0, 45]) on the background when the subject is shot from below
    + light_sweep(angle=0, period=D, strength=0.2) on the subject mask
    + composite(layers=[background, subject])
  Change of places: in the middle of the blur, transition(kind='whip') on the background layer only.
gen_hint: <subject> stands still at the center of a rotating platform together with the camera, the subject stays locked in the frame while the room spins around behind them with strong horizontal motion blur, low angle, light sweeping across the face
