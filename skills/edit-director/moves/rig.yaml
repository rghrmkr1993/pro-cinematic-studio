id: rig.locked_on
family: rig
group: camera
level: B
aliases: [locked-on, lock-on, lock onto a point, pinned to an object, frame glued to the object, object stabilization, object lock, point lock, frame on black]
what: a chosen point — an object, a face, a ball — stays dead still in one spot of the frame while the whole world around it slides, spins and scales
frames: |
  1. Anchor: the object sits at one point on screen, usually the center (0.5, 0.45–0.5); its drift is < 0.4 % of the
     frame per frame, while the background next to it moves 2–30 times faster (0.65–5.5 % of the frame per frame).
  2. What is compensated: always position; optionally rotation (the object keeps its orientation while the world
     rotates at 50–110°/s, up to 150–320° per take) and scale (a person running at the camera doesn't grow — the
     background around them shrinks ×0.55 over 2.6 s).
  3. Edges: either the frame is scaled up in advance and the edges are not visible, or dark or blurred
     triangles of the rotated frame flash in the corners — this is part of the style too.
  4. "Frame on black" mode: the source is scaled down to 0.55–0.7 of the canvas side (0.34–0.40 by area),
     with a black field around it; the frame visibly slides and spins around the motionless subject. Sometimes previous
     frame positions are not erased and stack into a fan (the visible area grows from 0.40 to 0.75 over 2.5 s).
  5. Lock across cuts: in a series of shots with different people, the object stays at the very same point on screen.
variants:
  - product: a cup, an earbud, a bottle in the center, the world and the person sway around it (rotation up to 40° in 0.2 s)
  - sport: the ball in the center, the frame spins and flips with the play (up to 8° per frame), cuts matched on the ball
  - with scale lock: a person running toward the camera stays the same size, the background shrinks
  - top-down: the object in the center, the ground below it rotates ≈95°/s
  - frame on black: the source frame is a square, rectangle or circle on a black canvas, rotating around the subject
  - fan: the frame on black leaves a trail of its previous positions
  - across cuts: the object at one point over 5–10 different shots in a row
status: code
fallback: if the object gets close to the edge or a rotation beyond ±10° is needed and there is no margin — the "frame on black" mode (the edges are legitimately visible), outpaint for the edges, or a search for a wider take; if tracking breaks (motion blur, occlusion) — manual keyframes on 2–3 points
params:
  anchor: a point or an object (track(object:<name>)|track(face)), screen position [0.5, 0.45–0.5]
  lock: pos always; + rot (keep the object's orientation); + scale (keep the size)
  residual_drift: < 0.4 % of the frame per frame (smooth the tracking jitter with a 3–5 frame window)
  world_motion: background 0.65–5.5 % of the frame per frame; world rotation 50–110°/s, peaking at 7–8° per frame
  crop_fill: crop margin ×1.2–1.5 for pos, ×1.6–2 with rotation of ±30° or more — or visible edges
  shadow_box: frame scale 0.55–0.7 of the canvas side (or 0.96 by width for 16:9 inside a square), black background, rectangle or circle shape
  trail: off | a trail of frames fading 0–3 %/frame
  cut_lock: at a cut the new shot is aligned so that the object lands on the same screen point (±3 % of the frame)
  duration: 1.5–7 s per take; frame on black 4–12 s
when: |
  a product video — the product in the center, life around it; a sport edit — the ball or the athlete at the center of
  the trick; fan edit and phonk — on the drop the world starts rotating around the subject; "frame on black" — for
  vertical edits from horizontal source footage (the edges are legitimately visible); lock across cuts — editing a
  series of different people with one object.
  1–3 such fragments per video; put the lock's entry and exit on beats.
avoid: the object is often occluded or leaves the frame (the track breaks, the anchor jerks); a close-up face with rotation beyond 30° (causes motion sickness); low resolution with a heavy crop; over real handheld shake without smoothing the track; a calm talking shot — the lock doesn't read there
sfx: a whoosh or a whistle on fast world rotations; in product videos — soft clicks on the cuts that keep the point; a bass hit at the start of the rotation
genres: {sport: signature, product: signature, fanedit: signature, phonk: allowed, viral: allowed, fashion: allowed, teaser: allowed, clips: allowed, ugc: allowed, motivation: allowed, explainer: allowed, calm: allowed}
detect: |
  ed_motion sees the background motion: large ROTATE (60–320° over 2–4 s, peak 4–8°/frame) or a long ZOOM-OUT ×0.5–0.6
  while the subject's size stays constant; meanwhile the central zone is almost still. Custom check: an affine fit on a
  disk around the anchor versus a ring of background — anchor drift < 0.4 %/frame, background 2–30 times faster.
  Visually: dark or blurred triangles in the corners during rotation; a black field with a sliding frame; the object at
  one point across cuts.
  Difference from rig.body_mount: there the camera is on the body, the subject is a large foreground at the edge, real
  parallax, no visible frame edges.
  Difference from roll (camera roll): with roll everything rotates together with the subject, while here the subject
  keeps its orientation.
  Difference from rig.spin_lock: there the frame doesn't move, only the background behind the subject spins.
engine: |
  lock_on(target=track(object:<name>)|track(face), lock=['pos'] | ['pos','rot'] | ['pos','rot','scale'],
          screen_pos=[0.5, 0.47], smooth=3, fill='crop'|'edges'|'shadow_box', crop=1.3–2.0, box_scale=0.6,
          box_shape='rect'|'circle', bg='black', trail_decay=0)
    = frame-by-frame track (CSRT or a point-based homography) → inverse transform(shift, rotate, scale) on each frame.
  + blur(kind='directional') on frames where the world rotates more than 5° per frame
  + series: cut(at) + lock_on(..., screen_pos=the same one) on every shot of the series
  + sfx('whoosh', at=start of the rotation)
gen_hint: camera locked onto <object> so it stays perfectly fixed in the center of the frame while the world rotates and moves around it, product-centric stabilized motion, dynamic background, sharp subject
commands: ["lock the ball in the center and let the frame spin around it", "do a locked-on on the cup in #2–#4", "frame on black around the dancer in vertical format", "cut these 6 shots so the earbud stays at the same point"]
related: [rig.spin_lock, rig.body_mount, roll.camera, handheld.shaky, cut.match]
evidence: {examples: 11, sources: 11, measured: "anchor drift 0.02–0.37 %/frame (median), background 0.65–5.5 %/frame; world rotation 54–110°/s, up to 318° in 3.3 s; scale lock — background ×0.55 over 2.6 s with the subject unchanged; frame on black 0.58–0.71 of the canvas side (area 0.34–0.40) or 0.96 by width, a frame trail in 1 of 4; lock across cuts — 9 shots in a row with the object at one point ±0.05", confidence: high}
