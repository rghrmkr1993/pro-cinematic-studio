id: rig.body_mount
family: rig
group: camera
level: B
aliases: [body-mounted camera, body cam, body mount, chest camera, back-mounted camera, chest rig, camera on a body rig]
what: the camera is rigidly mounted on the subject's body — their face or the back of their head stays locked in frame while the whole world around sways, tilts and drifts; a move about an inner state
frames: |
  Front-facing (a chest camera looking at the face):
  1. The face is large, 20–45 % of the frame height, near the center (x 0.4–0.55), shot from below — behind the head
     a ceiling, vaults, the sky. A wide lens with slight barrel distortion.
  2. The subject barely moves in the frame (median 0.04–1.4 % of the frame per frame — only neck nods), while the
     background behind them sways: a vertical "gait" bob of 1–6 % of the frame peak to peak at 2–2.4 Hz when walking
     (4.5–5.5 Hz when running), a sideways sway of 1–2 Hz, a background roll of 4–18° edge to edge at 1–3 Hz.
     Background speed 10–25 % of the frame per second, up to 55–60 %/s when running.
  3. Lasts 1.5–7 s; exit — a cut or the camera breaking away into a smear (a 0.15–0.3 s jerk).
  Back-facing (camera behind the back): the back of the head and the shoulders take up the bottom 30–45 % of the
  frame or one side of it (40–50 % of the width), the world ahead advances and sways — the subject walks through a
  street, a crowd, a celebration.
variants:
  - front-facing from below: panic, intoxication, euphoria — the face in the center, the ceiling spinning
  - back-facing: a walk through a crowd, a street or a celebration, the back of the head at the bottom of the frame
  - on a seat: the camera on a chair, a wheelchair or a gurney — the person is still in profile or from behind, the world turns around them (≈14 %/s)
  - running: 5 Hz shake, strong rolls and background blur
  - series: the same rig on several people, cuts between them keeping the head position
  - exit into a smear: at the end the camera jerks away from the subject
status: footage
fallback: |
  1) search the source footage (detect) — arm's-length selfies on the move also fit here: they are a ready-made
     front-facing variant;
  2) imitation (hybrid) from a shot where the subject walks or sways: lock_on on the face (pos + rot) makes the face
     still and the world starts to drift; extra sway on the background only — via a person mask, the edges are
     covered with outpaint or blur;
  3) generation with the user's consent from gen_hint
params:
  framing_front: face 20–45 % of the frame height, x 0.4–0.6, y 0.3–0.5, low angle
  framing_back: back of the head and shoulders in the bottom 30–45 % of the frame (or 40–50 % of the width from the side)
  subject_drift: < 1.5 % of the frame per frame (median 0.04–1.4)
  bg_speed: 10–25 %/s walking, 50–60 %/s running
  bob: 1–6 % of the frame peak to peak; 2–2.4 Hz walking, 4.5–5.5 Hz running
  roll: background roll 4–18° peak to peak at 1–3 Hz
  lens: wide, slight barrel distortion (k ≈ −0.05…−0.12)
  duration: 1.5–7 s (38–175 frames @25 fps)
  fake: lock_on(face, pos+rot, crop 1.2–1.3) + background shake(rot 6–10°, 1.2–2 Hz) + shake(y 2–4 %, 2 Hz) via the mask
when: |
  the subject's inner state — intoxication, panic, nausea, euphoria, "the world is swimming"; the subject walking through
  a crowd, a celebration, a city (back-facing); a performer singing or walking straight at the viewer in a music video;
  the entry into the drop in phonk and fan edits; in UGC — selfies on the move. 1–2 times per video, 2–5 s each;
  strongest right after a calm tripod shot.
avoid: calm informational content and interviews; longer than 7–8 s (causes motion sickness); a face in shadow or backlit with no detail; digital shake on top of real shake; imitation without a mask (the subject rotates too — it becomes just a frame roll)
sfx: breathing and a heartbeat, muffled music (low-pass filter) in intoxication scenes; footsteps and crowd noise; a whoosh as the camera breaks away
genres: {drama: signature, fanedit: allowed, phonk: allowed, viral: allowed, ugc: allowed, teaser: allowed, fashion: allowed, sport: allowed, clips: allowed, motivation: allowed}
detect: |
  ed_motion gets fooled: the large still subject fills 17–86 % of the frame, so global events are weak
  or contradictory (small ROTATE and SHIFT of different signs). Mask check: the area that is stable in 60 %+ of frame
  pairs is the subject; the background outside it moves 0.5–2 % of the frame per frame with a 4–18° roll at 1–3 Hz
  and a vertical bob of ≈2 Hz.
  Visually: a large face from below with the ceiling behind the head, or the back of the head at the bottom of the
  frame; a wide lens.
  Difference from rig.locked_on: there it is digital stabilization — edges or a black field are visible, no real parallax.
  Difference from handheld.shaky: with a handheld camera the subject wanders around the frame along with the shake.
  Difference from a tracking shot following the subject: there the subject is seen whole and farther away, the
  background doesn't roll in time with the steps.
engine: |
  Real shot: cut(at), 2–5 s; exit — transform(shift=[[0,0],[0.3,0.1]], t=[t1-0.25, t1], ease='inCubic') + blur(kind='directional').
  Imitation (hybrid) from a shot with the subject walking or swaying:
    lock_on(target=track(face), lock=['pos','rot'], screen_pos=[0.5, 0.42], smooth=3, fill='crop', crop=1.25)
    + mask(method='mediapipe_person', feather=8) → background layer: shake(amp=8°, freq=1.5, axes='rot') + shake(amp=3 %, freq=2, axes='xy')
      + outpaint or blur(kind='gaussian') in the revealed edges → composite(layers=[background, subject])
    + lens_distort(k=-0.08) + vignette(0.2)
  Series of people: cut(at) on beats + lock_on(..., the same screen_pos) for each.
gen_hint: body-mounted camera shot, camera rigidly mounted on <subject>'s chest pointing up at their face, the face stays locked in the center of the frame while the world behind sways, tilts and rolls with every step, low angle, wide lens, <subject> stumbling through <place>, disorienting
commands: ["body-mounted camera on the main character in the club, 3 seconds", "turn my walking selfie into a body-cam effect", "camera behind the back: a walk through the crowd on the drop", "the world sways around the face on #4"]
related: [rig.locked_on, handheld.shaky, rig.spin_lock, pov.first_person, track.follow]
evidence: {examples: 14, sources: 14, measured: "the subject is stable (median drift 0.04–1.4 %/frame, fills 17–86 % of the frame); background 10–25 %/s walking, 57 %/s running; background bob 1–5.7 % peak to peak at 1.9–2.4 Hz (running 4.6–5.5 Hz), roll 4–18° peak to peak at 1.2–2.8 Hz; front-facing from below in 6 of 9, back-facing in 5; 2 examples — camera on a chair or wheelchair; 1 — exit into a smear; 1 example is generated", confidence: high}
