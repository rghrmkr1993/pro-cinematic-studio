id: rig.robot_arm
family: rig
group: camera
level: B
aliases: [robotic camera arm, high-speed robot camera, motion control, camera on a robot arm, robot arm, high-speed robotic crane, robo-arm move, snap orbit]
what: a camera on a high-speed robot arm performs, in half a second, a move no camera operator could — an orbit, a swoop from top to bottom, a lunge at a detail with a roll — and freezes exactly on the frame, with no jitter or overshoot
frames: |
  1. Start: the subject or a group in frame, the camera is static or drifts slowly; often a sterile environment (a white
     box, a corridor, a studio) or an urban location with a group.
  2. Snap: in 0.3–0.8 s (8–20 frames @25 fps) the camera runs a complex path along several axes at once —
     a 90–180° orbit around the head (back of the head → face), a swoop from a high point down to eye level, an arc
     pass with a 20–45° horizon roll, a lunge at a detail (glasses, an eye, a hand). Motion blur mid-path, strong
     background parallax.
  3. Landing: the camera brakes within 2–4 frames and settles exactly into the intended composition — no residual
     shake, no "settling" correction; the horizon often stays tilted.
  4. Series: 2–4 such snaps in a row within one shot, with 0.3–1 s holds between them; the move repeats
     frame-accurately (takes can be cut together and clones composited).
variants:
  - head orbit: from behind or from profile to the face, 90–180° in 0.4–0.6 s
  - top swoop: straight top-down view → eye level (or the reverse) in 0.5 s, the subject at the center of rotation
  - rolling pass around a group: the camera arcs with a tilted horizon, a rap crew or dancers, B&W
  - lunge at a detail: medium shot → macro of glasses, an eye, jewelry in 0.3–0.4 s
  - white box: the subject in a glowing corridor or cube, the camera flips around them
  - with slow motion: the action is in high-speed slow motion while the camera moves fast and smoothly — splashes, fabric, hair
status: footage
fallback: code imitation on a 4K or wide shot — a fast 2D move (transform with a 20–45° rotation, a shift and a scale of ×1.3–2) with ease inOutExpo, directional blur and a hard landing; without parallax it is honest only on short snaps ≤ 0.4 s; a head orbit — generation with consent or searching the source footage for a sharp stabilizer pass; repeatable passes for clones — only a dedicated shoot
params:
  move: 0.3–0.8 s (8–20 frames @25 fps), typically 0.5 s
  rotation: orbit 90–180° (up to 360°/s); roll 20–45° along the way
  translation: 0.5–2 m per move; frame shift up to 100 % of the width
  ease: inOutExpo — very fast acceleration and braking within 2–4 frames; no overshoot or jitter
  landing_jitter: ≤ 0.1 % of the frame after landing (steadier than any manually operated move)
  hold: 0.3–1 s between snaps; 2–4 snaps per shot
  motion_blur: strong mid-move (180° shutter), none on landing
  hfr: in product and sport — shooting at 120–1000 fps, so on screen the move looks smooth while the action is in slow motion
when: performance in a music video (verse or hook — a snap on every line), fashion and product (a lunge at a detail, an orbit around a model), the entry into the drop, a wow shot in a teaser, splashes and liquids in product videos; snaps on downbeats or hits; 1–2 shots with a series of snaps per video
avoid: a slow, contemplative tone; snaps not synced to the beat (looks chaotic); code imitation on close-up faces during an orbit (no parallax — the fake shows); too many snaps in a row without holds (causes motion sickness)
sfx: a whoosh on every snap, peaking mid-move; a mechanical servo sound or a "shh-shoosh" on the swoops; an impact or a bass hit at the moment of landing
genres: {fashion: signature, product: signature, viral: allowed, phonk: allowed, sport: allowed, teaser: allowed, fanedit: allowed, epic: allowed, clips: allowed, motivation: allowed, calm: forbidden, ugc: forbidden}
detect: |
  ed_motion: within 0.3–0.8 s several large events at once — ROTATE 20–180°, SHIFT 30–100 % of the frame, ZOOM ×1.3–3 —
  peaking at 10+ %/frame with nonrigid > 0.3 (real camera displacement, parallax); before and after the move shake
  jitter ≈ 0 (≤ 0.1 %), the move ends without oscillation (no opposite-sign peaks after landing); a series of identical
  moves with holds of 0.3–1 s.
  Difference from pan.whip and tilt.whip: there it is a rotation around one axis, the whole frame smeared and an
  imprecise landing with jitter. From handheld.shaky: no high-frequency shake. From orbit.turntable: there it is a
  slow, even orbit. From zoom.crash: the angle and parallax change, not just the scale.
engine: |
  footage: search by the detect signature; put the landing of the move on a downbeat.
  code imitation (4K/wide shot): transform(scale=[1.2, 1.8], rotate=[0, 30], shift=[[0,0],[0.2,-0.1]],
     t=[t0, t0+0.45], ease='inOutExpo', motion_blur=0.5) + blur(kind='directional', amount∝speed)
     + a landing without overshoot; series: robo_moves(count=3, hold=0.6, sync='beats').
  + sfx('whoosh', at=t0, align='peak') + sfx('impact', at=t0+0.45).
gen_hint: high-speed robotic camera arm move, the camera whips around <subject> in half a second from behind the head to a frontal close-up, tilted horizon, motion blur during the move, then stops dead perfectly framed, music video, white studio box
commands: ["a robot-arm snap around the head on every line of the hook", "a half-second orbit around the model on the drop", "camera lunge to the glasses at 0:09", "fake a robot arm on #5 — a fast turn with a roll and a hard stop"]
related: [pan.whip, tilt.whip, orbit.turntable, zoom.crash, dolly.crash, time.speed_ramp]
evidence: {examples: 18, sources: "≈8", measured: "visual review only, of all examples in the section at 5 points of the animation (scripted frame capture was blocked by browser permissions); move durations, orbit and roll angles are estimates (≈) from the frames", confidence: medium}
