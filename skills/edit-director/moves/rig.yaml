id: rig.mounted
family: rig
group: camera
level: B
aliases: [car mount, hood mount, object mount, camera on the hood, door mount, camera on an object, mounted action camera, rig-mounted shot]
what: the camera is rigidly mounted on a moving object — a hood, a door, a tool, a cart; part of the object stays dead still in frame while the whole world rushes, glides or tumbles around it
frames: |
  1. In frame — a piece of the object the camera is mounted on: a hood, a door with a window and a passenger, the edge
     of a convertible, a shovel, a steering wheel, a cart. It enters from the bottom or side edge and takes up 15–50 % of
     the frame; relative to the frame it doesn't move at all (flow < 0.1 % of the frame width per frame), only
     reflections and light glide over it.
  2. The world moves with the object: from the hood the road flies out of the vanishing point, from the door the street
     flows sideways (0.4–4.8 % of the frame width per frame at the edge), when the tool swings the world turns over —
     23° in 0.7 s, up to a full flip.
  3. The contrast between the still object and the moving world is 4–40 times; mount vibration shakes the frame together
     with the object (0.2–0.9 % on a car, 5.5 % when working with a tool).
  4. Take 1.3–9.6 s; in a series — a cut every 1–2 s between mount points on the same car.
variants:
  - on the hood: the hood at the bottom, 20–30 % of the frame, the road from the vanishing point; often sped up, rushing through tunnels and intersections
  - on the side: the door and window with a passenger at the frame edge, the street flies sideways, at night — lights as streaks
  - behind someone in a convertible: the person's back in the center and the seat below are still, the world recedes backward
  - on a tool or object: a shovel, a bat, a board — the world tumbles on the swing
  - on a cart among objects: the foreground (a plant, goods) stays still, a greenhouse or warehouse slowly glides past
  - mount series: hood → door → trunk of one car, a cut on every beat
status: footage
fallback: |
  hybrid imitation: a mask of the object (remove_background or manual) over a separate moving background shot
  (shift or zoom-in 0.5–2 % of the frame per frame) + overall vibration 0.2–0.5 %; without parallax it works on a night
  street and with fast motion. If the object was shot handheld — stabilize on the object (see rig.locked_on). No
  source — generation with the user's consent.
params:
  duration: 1.3–9.6 s; in a series 1–2 s per mount point (25–50 frames @25 fps)
  mount_area: 15–50 % of the frame, touching the bottom or side edge; flow < 0.1 % of the width per frame
  world_speed: 0.4–1.7 % of the frame width per frame @25 fps (median), up to 4.8 % at the edge
  contrast: world / object 4–40
  roll: car 0–8°; tool up to 23° in 0.7 s and a flip
  vibration: 0.2–0.9 % (car), up to 5.5 % (tool)
  series_cut: 1–2 s, on the beat
when: |
  Road and journey (hood, side), a ride with the subject, action and sport from the point of view of the gear, handwork
  (camera on a tool), a product in motion. A series of mounts on one car — a rhythmic build or verse, cuts on the beats;
  a tumble with a tool — a sharp accent or a transition.
avoid: a mount with no visible part of the object — that is just a travelling shot; strong vibration and rolling-shutter "jello" on a cheap camera; the world standing still (the car is parked) — the point is lost; longer than 4–5 s with no event in a dynamic genre
sfx: engine hum, wind, tire noise; suspension thumps on bumps; on the tool tumble — a whoosh and a hit at the stop
genres: {travel: signature, sport: signature, ugc: allowed, fanedit: allowed, viral: allowed, clips: allowed, teaser: allowed, product: allowed, drama: allowed, epic: allowed, motivation: allowed}
detect: |
  Custom measurement (a 4×4 grid of dense-flow medians over textured pixels): 1–6 adjacent cells at the bottom or
  side edge with flow ≤ 0.1 % of the width per frame, the rest 0.4–4.8 % (ratio 4–40); for a hood with reflections
  the ratio is lower (≈2.5). ed_motion: global events are contradictory (the static piece breaks the frame model),
  overlay-mask 0.05–0.44, nonrigid 0.25–0.45; on a tool — ROTATE 20–25° in 0.7–0.9 s.
  Difference from rig.locked_on: there the object is stabilized in code — it is usually in the center and doesn't touch
  the edge, and there may be black corners at the edges. From rig.body_mount: a person is still (face, torso), with the
  mount on the body. From track.subject: the subject "floats" and moves rather than staying dead still. From a static
  tripod: the world doesn't move.
engine: |
  footage: search by the flow grid (a static zone at the edge + a moving world); cut into 1–2 s pieces, switch mount
  points on the beats.
  hybrid: mount_sim(fg=mask(method='hf_remove_background', target=object), bg=clip, bg_motion='forward'|'side',
  speed=0.5–2 %/frame, vibration=0.3) — a still foreground over a moving background.
  code: stabilize(strength=1.0, anchor=track(object:<name>)) — "stitch" the object to the frame (see rig.locked_on).
gen_hint: camera rigidly mounted on the side of a moving car at night, the car door and the passenger leaning out of the window stay perfectly still in frame while the street lights rush past, slight vibration
commands: ["put the hood-cam shots into the road section", "car door camera on #4", "mount series: hood, door, trunk — one beat each", "fake a bike-mounted camera from #2 and #3"]
related: [rig.locked_on, rig.body_mount, pov.object, track.subject, drone.fpv, time.hyperlapse]
evidence: {examples: 8, sources: 8, measured: "a still zone at the bottom (3) or side (4) edge, or a person's back in the center (1); flow in it ≤ 0.1 % of the width per frame versus 0.4–4.8 % for the world (ratio 4–41, hood with reflections 2.5); takes 1.25–9.6 s; 1 example — a mount series with cuts every 1–2 s; 1 — a tool with a 23° roll in 0.7 s and a flip", confidence: high}
