related: [rig.locked_on, orbit.turntable, pan.round_table, rig.body_mount, dolly.double]
evidence: {examples: 10, sources: 9, measured: "in 6 of 10 the subject is locked (displacement < 0.6 %/frame), the background sweeps 1.5–4 %/frame (≈30–80 %/s) or 6–9 %/frame (135–225 %/s) with strong blur; when looking from below the background also turns ≈2.6°/frame; duration 0.65–4.65 s; in one example the locations change behind the subject in the blur; 3 of 10 are essentially pan.round_table, 1 unclear", confidence: medium}
