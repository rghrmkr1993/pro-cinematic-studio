id: frame.interview
family: frame
group: angle
level: A
aliases: [interview, soundbite, talking head, sit-down interview, answering off camera, off-axis interview]
what: a person answers an unseen interviewer — the gaze goes past the lens toward the interviewer, the face sits on a third with looking room in the direction of the gaze; the backbone of documentary and explainer editing
frames: |
  1. Establishing shot (optional): a wide shot of the subject in their space — the figure ≈25 % of the height in the center, often symmetrical and with
     backlight from a window; opens the interview block.
  2. Answer: a medium close-up or medium shot, face 25–35 % of the frame height, eyes at 30–40 % of the height. The face on a third
     (x 0.30–0.40 or 0.60–0.70), empty space 55–65 % of the width — on the side the subject is looking.
  3. Gaze: 10–30° past the lens — at the interviewer sitting next to the camera; the subject does not look into the lens.
  4. Camera: tripod (jitter ≤0.3 %) — or handheld in a documentary manner, with a push-in ×1.4–1.5 over ≈1 s on
     a strong phrase.
  5. Graphics: a title with the name or topic in the lower third; in the TV variant — a band 15–20 % of the height.
  6. In the edit: soundbite 3–10 s, illustrative cutaways over the voice; jumps within an answer are covered by a push-in or
     a cutaway.
variants:
  - documentary: handheld camera, natural light, face on a third, push-in ×1.47 over 1.1 s on an emotional moment
  - studio or talk show: tripod, two guests on a sofa (faces at 0.25–0.45 and 0.50–0.70 of the width) or a single medium close-up, a graphics band at the bottom, the gaze at the host off screen
  - environmental wide: the person in the center of a symmetrical, characteristic space, sets the tone of the block
  - profile or three-quarter: the subject has turned away — laughing, remembering; a microphone in the foreground
status: footage
fallback: |
  Needs a shot where the person talks while looking past the lens. In code: reframe to a third with looking room in the gaze direction, a lower-third
  title, a documentary push-in by cropping. If the person looks into the lens, it is address.direct and must not be substituted.
  Generation — via gen_hint with the user's consent.
params:
  duration: soundbite 3–10 s (75–250 frames @25 fps), cutaways 1–3 s (≈)
  face: 25–35 % of the frame height; establishing wide — the figure ≈25 % of the height
  position: face center x 0.30–0.40 or 0.60–0.70, looking room 55–65 % of the width in the gaze direction, eyes at 0.30–0.40 of the height
  gaze: 10–30° past the lens toward the interviewer
  camera: tripod (jitter ≤0.3 %/frame) or handheld; push-in ×1.4–1.5 over 0.8–1.2 s (20–30 frames)
  lower_third: name or topic in the bottom 15–20 % of the height, entrance 6–10 frames, hold 3–4 s (≈)
  two_shot: guests at 0.25–0.45 and 0.50–0.70 of the width, both looking the same way off screen
when: |
  Explainer and documentary videos, UGC testimonials, product videos with an expert: the soundbite is the backbone of the story, and
  cutaways are laid over it. The establishing wide goes at the start of the block; the push-in goes on the key phrase. A cutaway every 3–8 s so
  the soundbite doesn't lull the viewer. In music videos and teasers — a short quote insert of 1–2 s.
avoid: |
  A gaze into the lens is addressing the viewer, a different move. Face in the center or looking room on the wrong side (looking at the edge
  of the frame). A soundbite longer than 10–15 s without cutaways. Visible jumps within an answer with nothing covering them. One subject looking in different
  directions within one block.
sfx: |
  Clean voice (lav mic), room tone under it at −25…−30 dB, music ducked under the voice by −12…−18 dB. On the push-in —
  no effects. On a change of subject — 0.2–0.3 s of silence or a soft musical "breath".
genres: {explainer: signature, ugc: allowed, product: allowed, drama: allowed, sport: allowed, motivation: allowed, teaser: allowed, calm: allowed, clips: allowed}
detect: |
  ed_motion: tripod (jitter ≤0.3 %, 4 of 6) or handheld camera; sometimes ZOOM-IN ×1.4–1.5 over ≈1 s — a documentary
  push-in; in the TV variant a static graphics band gives overlay-mask 0.2–0.45.
  Visually: one face 25–35 % of the height on a third, gaze past the lens toward the larger empty area, the mouth moves almost all
  the time (soundbite), the background is the subject's environment or a studio.
  Difference from address.direct: the gaze is not into the lens. From look.news: there the reporter looks into the lens, with on-air banners and
  a news ticker. From shot.close_up: an interview is the shot size plus a sideways gaze, speech and looking room in the gaze direction.
engine: |
  footage: find_shot(speaking=True, gaze='off_axis', faces=1, face_h=[0.25, 0.35]) → soundbite.
  framing: reframe(aspect, target=track(face), thirds='against_gaze', headroom=0.30) — face on a third, looking room in the gaze direction.
  push-in: transform(scale=[1, 1.45], center=track(face), t=[t_key-0.5, t_key+0.5], ease='inOutQuad')
           + destabilize(profile='handheld') with a small amplitude.
  title: text(content=name or topic, style='lower_third', anim='slide_in 8fr', t=[t0+0.5, t0+4]).
  editing: duck(music, under=voice) by −15 dB + cutaways over the voice every 3–8 s, cuts on pauses in speech.
