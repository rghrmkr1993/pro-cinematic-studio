id: frame.voyeur
family: frame
group: angle
level: B
aliases: [peeping, surveillance, observer's gaze, voyeuristic shot, peeping shot, stakeout POV, hidden camera, through a scope or binoculars]
what: a peeping shot — the subject doesn't know they are being watched; we see them from afar through a gap, a window, a fence, a scope or binoculars, and most of the frame is covered by a dark obstruction
frames: |
  1. Position: the camera is far away (long lens) or behind an obstruction; the subject is small — 2–20 % of the frame height (in a scope after
     the search — up to 35–45 %), doesn't look into the lens, busy with their own business.
  2. Obstruction: 27–65 % of the frame is permanently dark (median ≈42 %) — out-of-focus bars, a car's pillar and frame, a door
     leaf, blinds, a gap; or an optical mask — a scope circle with a crosshair (∅ 0.9–1.0 of the height), two overlapping
     binocular circles (∅ ≈0.75 of the height), a small slit window (≈35–40 % of the area) in black.
  3. Movement: stakeout — the camera is static (jitter ≤0.17 %); optics — handheld "tracking" of the target: a pan of ≈20 % of the frame
     per second, shake 0.9–1.7 %, a search with a tilt (first it misses, then the target is found and held in the crosshair),
     adjustments with short zoom-ins ×1.04.
  4. Action: the subject walks, talks, sits; random people pass between them and the camera and block the view;
     climax — the subject "feels" the gaze and turns around.
  5. Shot length 2–5 s.
variants:
  - stakeout from a car or a window: a dark frame and pillar cover half of the frame, the subject is seen through the glass across the street
  - through an obstruction: out-of-focus bars, foliage or blinds in the foreground, the face in a gap (≈20 % of the height)
  - scope: a circular mask with a crosshair, bars of 11–12 % at the top and bottom, a tilt search up to a full frame over ≈2 s, then tracking
  - binoculars: two circles side by side, a distant target ≈2 % of the width, a smooth pan following it
  - slit or peephole: a small window in black, the subjects approach the camera and grow from 15 to 35 % of the height
  - the peeper: we show the observer themselves — half of a face (≈45 % of the height) peeks out from behind a door jamb, 60–65 % of the frame is a blank wall
status: code
fallback: |
  Best of all — a real long-lens shot or one from behind an obstruction (search the source footage via detect). In code: any wide
  shot where the person doesn't look into the camera → a "long-lens" crop + handheld drift + an optical mask (scope, binoculars,
  slit) or an out-of-focus obstruction on top (a drawn or generated overlay: bars, blinds, a car frame) + darkening.
  The subject must not look into the lens; if they look into the camera, the move breaks. Generation — via gen_hint with the user's consent.
params:
  duration: 2–5 s (50–125 frames @25 fps)
  subject_size: 2–20 % of the frame height (stakeout, binoculars, slit); after the search in a scope — 35–45 %
  occlusion: 27–65 % of the frame permanently dark (median ≈42 %); the edge of the obstruction is soft (sharpness 0.2–0.3 of the center)
  scope_mask: circle ∅ 0.9–1.0 H, crosshair 1–2 px, bars 11–12 % at the top and bottom
  binocular_mask: two circles ∅ ≈0.75 H, overlap ≈10–15 % of the circle width (≈), bars 8–14 %
  slot_mask: window ≈0.48 W × 0.77 H, softened edges
  camera: stakeout — static (≤0.17 %/frame); optics — shake 0.9–1.7 %, pan ≈20 % of the frame/s, search tilt up to 100 % of the frame over ≈2 s
  zoom: adjustment in steps of ×1.04 over 5–6 frames (≈)
  grade: darker and more muted than the neighboring shots — median brightness 17–60 of 255, lower saturation
when: |
  Tension and surveillance: a thriller, a detective story, "someone is watching you", a teaser with a threat; before a reveal — a switch to the
  observer's point of view. Comedic and in UGC: "spying on a friend", "watching the cat steal food". Place it in a quiet part of the track;
  the climax "the subject turns around" — on the drop or a hit. 1–2 times per video.
avoid: |
  The subject looks into the camera — that is already an address to the viewer or pov.object. Too close and too clean — the distance disappears. A scope aimed at
  people in light, kids' and product videos reads as a threat — replace it with binoculars or a slit; a scope only in an
  obvious game or fiction. Binoculars and scopes longer than 5 s get tiresome.
sfx: |
  Dead silence, the observer's breathing, the scene's sound distant and muted (no highs — "through glass"); mechanical clicks of the optics
  on adjustments, a camera shutter in photo surveillance; a sharp accent at the moment the subject turns around.
genres: {drama: signature, teaser: signature, fanedit: allowed, viral: allowed, ugc: allowed, epic: allowed}
detect: |
  ed_motion: stakeout — no events, jitter ≤0.17 %; optics — a long SHIFT (a pan of 70 % of the frame over 3.4 s or a tilt of
  108 % over 1.9 s), jitter 0.9–1.7 %; bars 8–27 % at the edges.
  Own checks: the share of pixels that are dark in ≥90 % of frames is 0.27–0.65; a circular mask (circle ∅ ≥0.7 H, crosshair —
  two thin dark lines through the center) or two circles side by side (binoculars); out-of-focus stripes in the foreground —
  an obstruction; the subject is small (≤20 % of the height) and doesn't look into the lens.
  Difference from pov.object: there the subject is right up close and looks into the lens; here they are far away and don't know about the camera.
  From pov.first_person: there the character's head moves and their hands are visible; here the camera hides and barely moves or
  tracks the target through optics. From fx.letterbox and lens.vignette: here the mask is motivated by an object (scope, binoculars, slit).
engine: |
  optics: mask_overlay(shape='scope'|'binocular'|'slot'|'peephole', size=0.95H, feather=6px, crosshair=True, bars=0.12)
          + transform(scale=[1.6, 1.65], center=track(person), t=whole shot) — a "long lens" by cropping
          + destabilize(profile='handheld') with an amplitude of ≈1 % + color(params={exposure: -0.5EV, sat: -20 %}).
  target search: transform(shift=[[0, -0.6], [0, 0]], t=[t0, t0+1.9], ease='outCubic') + 2–3 scale steps of ×1.04.
  obstruction: fg_frame(shape='bars'|'blinds'|'leaves'|'door_edge'|'car_frame', coverage=0.45, blur=20px, luma=0.1,
               source='draw'|'generate') + vignette(0.5).
  sound: muffle(cutoff_hz=1500) on the scene sound + sfx('click', at=each adjustment, gain=-12dB).
gen_hint: voyeuristic long-lens shot from a hidden position, <subject> unaware of being watched, seen far away through <a gap in a fence / a parked car window / half-closed blinds>, dark out-of-focus foreground covering half of the frame, slight handheld drift, muted desaturated colors, telephoto compression
commands: ["make #4 look like he is being watched from a car", "scope mask on #2 with a target search", "binoculars: follow the subject with a pan for 3 seconds", "before the drop — peeking from behind a door"]
related: [pov.object, pov.first_person, pov.dialogue, lens.vignette, fx.letterbox, focus.shallow, fx.night_vision]
