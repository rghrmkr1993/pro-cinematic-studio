id: frame.tableau
family: frame
group: angle
level: B
aliases: [painting-like shot, living picture, tableau vivant, tableau staging, staged mise-en-scène, painterly composition, postcard shot]
what: a still, carefully built frame like a painting — the camera stands still, people pose or barely move within a deliberate composition and palette, and the frame is viewed like a canvas
frames: |
  1. The camera is locked off: jitter ≤0.1 % of the frame, no zoom, no pan. The shot is held longer than its neighbors — in the edit
     usually 2–6 s (≈), so that the viewer has time to take in the frame.
  2. Almost no movement inside: 2–14 % of pixels change per frame (median ≈5 %). Small details are alive — a fan, a gesture, wind,
     a blink, extras in the background; the main figures pose.
  3. The composition is constructed: a frontal, flat staging with even geometry (lines deviate from horizontal and
     vertical by ≤2°) — or one strong diagonal of ≈20° across the whole frame. Figures are spread across planes: at the front
     edge cropped heads and shoulders, in the middle the main characters, at the back the set with a central symbol.
  4. The palette is controlled: the three main colors cover 60–78 % of the area; the costumes rhyme with the background (pastel,
     monochrome, one accent color).
  5. Filling — from a crowd across the whole frame to a single person framed by the set with a large empty area.
variants:
  - crowd canvas: 15+ figures in layers across the whole frame, edges cropped, the symbol of the scene in the center
  - poster group: 3–6 people at full height (70–80 % of the frame height) frozen around an object or a car
  - figure in a set: one person takes up 10–25 % of the area, the rest is a precise background and emptiness; often in a side third
  - diagonal: a row of identical figures recedes diagonally into depth, one detail in the foreground is alive
  - living portrait: a motionless face in the center, while blurred extras move behind it
status: footage
fallback: |
  1) search the source footage: tripod shots with little internal movement, even geometry and a unified palette;
  2) enhancement in code on any calm shot: stabilization to zero, leveling the horizon and reframing for
     balance, reducing the palette to 2–3 colors, slightly slowing the "life" in the frame, optionally — letterbox bars;
  3) generation via gen_hint with the user's consent.
params:
  duration: in the edit 2–6 s (50–150 frames @25 fps) (≈); measured excerpts 0.8–2.3 s without a single camera shift
  camera: locked off, jitter ≤0.1 %/frame; at most a barely noticeable push-in ≤×1.05 over the whole shot is allowed (≈)
  inner_motion: 2–14 % of pixels change per frame (median ≈5 %), mean brightness difference 0.8–5 levels
  geometry: lines ≤2° from horizontal and vertical (frontal scene) or one diagonal of ≈20° across the whole frame
  palette: top 3 colors — 60–78 % of the area; saturation from monochrome to pastel
  figures: crowd of 15+ | group of 3–6 at full height | one figure taking 10–25 % of the area | central portrait
  angle: eye level or slightly below, no roll
  symmetry: not required — strict mirror symmetry only in some tableaux; balance of masses and clean edges matter more
when: |
  An illustrative pause: an intro to set the world and the tone; a cutaway between chapters; a final postcard frame; a "living
  cover" for the track; in fashion — a group poster for a collection. Place it on a long note, the intro or the outro, where the music
  "stands still". 1–3 times per video, each from 2 s; the neighboring shots should move, so the contrast works.
avoid: |
  Fast cutting — there is no time to take in the frame (minimum 2 s). Handheld camera and zooms. Random composition and clutter
  at the edges. The drop and action moments — a tableau slows the rhythm. A viral hook: the first 1–2 s must move.
sfx: |
  Silence or room tone, music without drums. One "live" sound from the scene (a fan, wind, a shutter click) emphasizes
  the stillness. A soft hit or gong as the shot comes in, if the tableau opens a chapter.
genres: {fashion: signature, calm: signature, teaser: allowed, drama: allowed, epic: allowed, product: allowed, travel: allowed, fanedit: allowed, clips: forbidden}
detect: |
  ed_motion: no events, jitter ≤0.1 % (6 of 6), no cuts and no flashes over the whole shot.
  Own checks: share of changing pixels ≤0.15 per frame; the scene's lines are level (median deviation ≤2°) or there is one
  strong diagonal; top 3 colors ≥0.6 of the area; person detector — ≥3 people, or one person ≤25 % of the area surrounded by
  set dressing; shot ≥2 s.
  Difference from frame.central: a tableau does not have to be symmetrical (mirror correlation is high in only 1 of 6).
  From time.freeze: in a tableau small details are alive (2–14 % of pixels change), in a freeze frame — 0. From an ordinary static shot:
  a tableau stands out through staging — the figures pose, the palette is unified, the frame edges are clean.
