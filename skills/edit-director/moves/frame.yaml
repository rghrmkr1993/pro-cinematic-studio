id: frame.central
family: frame
group: angle
level: A
aliases: [center framing, centered composition, central composition, subject in the center, symmetrical shot, symmetrical composition, one-point perspective, on-axis shot]
what: composition on the central axis — the subject exactly in the middle, the surroundings mirror-symmetric, the horizon level; a "statement" frame that stops the eye
frames: |
  1. The frame is built on a vertical axis that coincides with the center (0.485–0.515 of the width): windows, doors, arches,
     columns, road edges or cars repeat in mirror image on the left and right.
  2. The subject stands on the axis — face or figure in the center (x 0.49–0.54), usually frontal, looking into the lens or
     straight ahead; horizontals and verticals are level (0°), no roll at all.
  3. The camera is static (5 of 8) or moves strictly along the axis — a push-in ×1.2 over 1.4 s behind a subject walking away, a forward
     tracking move toward the vanishing point (scaling center 0.49–0.50); everything that moves spreads symmetrically left and right.
  4. Held for 2.5–4 s (60–100 frames @25 fps): almost nothing changes within the shot except the subject's facial expressions or rhythmic
     action — the frame works as a pause and a statement.
variants:
  - a single frontal subject on the axis, looking into the lens, static camera (3 of 8)
  - a silhouette or figure in a symmetrical opening — a window, an arch, a halo behind the head (2 of 8)
  - movement along the axis — the subject walks away down a central corridor, the camera follows; a drive along a road with the vanishing point in the center (2 of 8)
  - a group or "triptych" — several people gathered around the axis, the outermost figures balance the frame (2 of 8)
  - the subject in the center against a non-symmetrical background — only the figure holds the center (1 of 8)
status: code
fallback: in code — only centering the subject with a crop by track(face|person) and leveling the horizon; real symmetry of the surroundings (architecture, openings, a road) — search the source footage for such shots via detect, otherwise generation with consent; mirroring half of the frame is already an effect, not composition
params:
  subject_x: center of the face or figure at 0.48–0.52 of the width (tolerance ±0.03); 0.42–0.46 reads as a mistake — either strictly center or thirds
  symmetry: mirror correlation of gradients about the 0.5 axis ≥ 0.5 and above the control (frame shifted by 25 %) by at least 0.2; axis 0.485–0.515
  horizon: horizontals and verticals level, roll ≤1–2°
  eye_line: 0.27–0.51 of the height depending on the shot size
  camera: static or movement strictly along the axis (zoom center 0.49–0.51); jitter ≤0.1 % for the "clean" version
  duration: 2.5–4 s (60–100 frames @25 fps); in fast cutting with the subject centered on every cut — 0.4–1 s per shot
  crop: to move the subject from x0 to the center without losing the format you need S ≥ 1 / (1 − 2·|x0 − 0.5|); when converting 16:9 → 9:16, centering is free for x0 0.16–0.84
when: intro and title frame (symmetry holds on-screen text above or below the subject), a statement frame on the drop or at the end, confrontation and ritual, the subject's power and status, a "doll-like" stylized presentation; a calm anchor frame between chaotic ones; in fast cutting — keep the face in the center on every cut so the eye doesn't jump; a road or corridor with the vanishing point in the center — a setup for a push-in or an infinite zoom
avoid: handheld reportage and chases — looks staged; a scene with no axis where symmetry would have to be forced; near-center (0.42–0.46) — looks like a miss; a tilted horizon; more than 3–4 static symmetrical frames in a row — monotonous
sfx: no SFX on its own — support it with a pause, a sustained note or silence; if the frame comes in on a downbeat — one impact on the cut
genres: {fashion: signature, product: signature, teaser: allowed, epic: allowed, fanedit: allowed, drama: allowed, calm: allowed, travel: allowed, motivation: allowed, explainer: allowed, ugc: allowed}
detect: |
  composition check on frames every 0.5 s: (a) center of the face or figure box at 0.47–0.53 of the width in ≥70 % of frames;
  or (b) mirror symmetry — correlation of the blurred gradient map with its reflection about x=0.5
  ≥0.5, best axis 0.485–0.515, gain over the same frame shifted by 25 % ≥0.2; color symmetry (a*/b* channels of the L*a*b* space) ≥0.65;
  long horizontals and verticals with a tilt ≤2°. ed_motion: "no significant global motion" or ZOOM-IN centered at
  0.49–0.51 (movement along the axis). Differences: rule of thirds — subject at 0.30–0.38 / 0.62–0.70; mirror or
  kaleidoscope effect — symmetry almost perfect (r ≥0.98, pixel for pixel); Dutch angle — roll ≥5°.
engine: |
  composition(clip) → {subject_x, sym_r, axis, tilt, vp} — new analysis; label 'central' per the detect rules.
  Synthesis: reframe(aspect, target=track(face|person)) placing the subject at [0.5, eye_line] (S per the crop formula)
  + transform(rotate=[-tilt, -tilt]) to level the horizon + stabilize(strength=1) against drift.
  Centered cutting: align_subject(clips, target=track(face), point=[0.5, 0.4], scale_match=True) — on every cut
  the face is at the same point on screen. Intro: text(content, style, anim, t, safe_zone='tiktok') on the axis above or below the subject.
gen_hint: perfectly symmetrical one-point composition, <subject> standing exactly in the center of the frame facing the camera, mirrored architecture on both sides, level horizon, static locked-off camera, stylized deadpan look
commands: ["put the subject dead center in #3", "symmetrical frame for the ending", "keep the face centered on every cut in the chorus", "find symmetrical shots for the intro"]
related: [shot.close_up, zoom.infinite, angle.dutch, fx.kaleidoscope, cut.match, frame.tableau]
evidence: {examples: 8, sources: 8, measured: "in 6 of 8 the symmetry axis is at 0.485–0.515 and the correlation with the reflection is 0.56–0.95 versus 0–0.57 for the same frame shifted by 25 %; in 2 the background is not symmetrical, but the face or group is centered (x 0.46–0.49); a single subject's face at x 0.49–0.54; 5 of 8 — static (jitter ≤0.05 %), 2 — movement along the axis (push-in ×1.22 over 1.4 s, tracking move ×8 over 1 s centered at 0.49–0.50), 1 — handheld static; in the strictly symmetrical ones horizontals are at 0°", confidence: high}
