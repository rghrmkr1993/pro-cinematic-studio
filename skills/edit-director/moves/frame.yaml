id: frame.two_shot
family: frame
group: angle
level: A
aliases: [two-shot, two in frame, pair shot, 50/50, two shot side by side, duet in frame]
what: two people in one frame — side by side facing the camera, facing each other, or one closer and the other in depth; the characters' relationship, distance and inequality are visible without a cut
frames: |
  1. Exactly two faces in the frame, both readable (the detector finds two faces in most frames).
  2. Three layouts, distinguishable by the numbers:
     (a) side by side facing the camera — faces almost equal (size ratio 1.01–1.10), eyes at the same height (difference
     ≤0.04 of the height), the pair in the center (midpoint between the faces x 0.48–0.51), 0.16–0.42 of the frame width between the faces;
     faces 27–44 % of the height — a tight chest-up two-shot;
     (b) facing each other — two profiles: the left one's nose is shifted right (+0.16…+0.25 of the box width), the right one's — left
     (−0.17…−0.18); 0.30–0.59 of the width between the faces, faces 10–15 % of the height — a medium or wide "50/50";
     (c) in depth — one closer, the other farther: face size ratio 1.3–2.8, the eye lines differ
     by 0.1–0.4 of the height; the near one at the edge (x 0.17 or 0.73–0.81), the far one on the opposite third.
  3. The camera is static (8 of 10, jitter ≤0.25 %), less often a slow pull-out ×0.93–0.96 over 0.5–1 s.
  4. Length 1.6–5.3 s — as long as the exchange of lines, the shared reaction or the coming together lasts.
variants:
  - side by side facing the camera — the two look into the lens or in the same direction, synchronized gestures and reactions (3 of 10)
  - face to face — two profiles at conversation distance or coming together up to a kiss (3 of 10)
  - in depth — the near one large at the edge, the far one smaller on the other third; scale contrast ×1.4–2.8, up to a double of the same character (3 of 10)
  - at different heights — one stands, the other sits, a landscape around them; faces 7–9 % of the height (1 of 10)
status: footage
fallback: the two-shot is cut in code from a wider frame that contains both (a window around the two faces with margin, lossless up to ×1.3 from 1080p and ×2 from 4K); if the characters were filmed separately — a hybrid composite (masks of both on a shared background, faces at the same height ±10 %, matching light) or an honest split screen; otherwise generation of a two-shot with consent
params:
  faces: 2 faces, both sharp (detector, threshold 0.6)
  size_ratio: side by side and face to face 1.0–1.15; in depth 1.3–2.8
  eye_delta: side by side ≤0.05 of the frame height; in depth 0.1–0.4
  separation: side by side 0.16–0.42 of the width; face to face 0.30–0.60; in depth 0.22–0.71
  face_h: tight two-shot 27–44 % of the height; medium and wide 7–15 %
  pair_center: midpoint of the pair x 0.47–0.55 (in depth up to 0.64)
  duration: 2–5 s (50–125 frames @25 fps), typically 3 s
  camera: static; optionally a slow pull-out ×0.93–0.96 over 0.5–1 s
  crop: window = box around the two faces + 0.5 of a face width on the sides and above, eyes at 0.33–0.45 of the height; limit ×1.3 (1080p) and ×2 (4K)
when: showing the characters' relationship and distance — closeness (heads together), confrontation (profiles face to face), inequality (one in depth or lower); the start of a dialogue before the shot/reverse shot and a return to the two-shot at the end of the scene to show the blocking again; a shared reaction of the two to an event; the climax of coming together — a kiss, a hug, a handshake in one shot without a cut; duets in music videos, two hosts, collab videos, a couple in a fan edit
avoid: when one character matters more — a two-shot makes them equal; faces smaller than 7–8 % of the height — emotions don't read, it is already a wide shot; a whole conversation in one two-shot in a dynamic genre — monotonous; faces overlapping each other; one of the two accidentally out of focus
sfx: both voices in the same perspective and room; in a comedic reaction — a shared sound for the synchronized gesture; as they come together — quieter music, closer breathing
genres: {drama: signature, fanedit: signature, ugc: allowed, viral: allowed, fashion: allowed, calm: allowed, teaser: allowed, explainer: allowed, motivation: allowed, sport: allowed, product: allowed}
detect: |
  YuNet (threshold 0.6) on frames every 0.5 s: exactly two faces in ≥60 % of frames, both ≥7 % of the frame height.
  Subtype by the numbers: size ratio ≤1.15 and eye-line difference ≤0.05 → "side by side"; plus opposite signs
  of the nose offset (left +, right −, |offset| ≥0.15) → "face to face"; ratio ≥1.3 → "in depth".
  ed_motion: usually static.
  Differences: frame.over_shoulder — only one face is sharp, the second person is a blurred mass of the back of the head at the edge;
  group shot — three or more faces; split screen — a seam between the halves and independent movement of the halves;
  angle.profile — one face.
engine: |
  classify_shot(clip, by='faces') → 'two_shot', subtype='side'|'facing'|'depth' (detect rules).
  Crop from a wide: shot_crop(size='two', targets=[track(face:1), track(face:2)], margin=0.5, eye_line=0.4, max_scale=2) —
  new parameter targets: a window around the box of the two faces.
  From two singles: mask(method='mediapipe_person') for each → composite(layers=[background, A@x0.3, B@x0.7], blend='normal'),
  faces at the same height ±10 %; the honest alternative — split_screen(layout='2v').
  Scene structure: two_shot (2–3 s) → frame.over_shoulder pairs → close-ups → two_shot again at the end.
gen_hint: two-shot of <person A> and <person B> <standing side by side facing the camera | facing each other in profile>, both faces in sharp focus, balanced composition with the pair centered, medium shot, eye level, static camera
commands: ["start the dialogue with a two-shot", "cut a two-shot out of wide #4", "find shots in the source footage where the two characters are together", "put the people from #2 and #3 together in one frame"]
related: [frame.over_shoulder, angle.profile, shot.medium_close_up, shot.wide, frame.central, layout.split_screen]
evidence: {examples: 10, sources: 10, measured: "two faces found in all 10 clips; \"side by side\": ratio 1.01–1.10, eye difference ≤0.04, pair midpoint 0.48–0.51, distance 0.16–0.42, faces 27–44 %; \"face to face\": nose +0.16…+0.24 / −0.17…−0.18, distance 0.30–0.59, faces 10–15 %; \"in depth\": ratio 1.28–2.83, eye difference 0.1–0.4; 8 of 10 — static ≤0.25 %, 2 — pull-out ×0.93–0.96; clips 1.6–5.3 s", confidence: high}
