id: frame.over_shoulder
family: frame
group: angle
level: A
aliases: [over-the-shoulder shot, OTS, over the shoulder, from behind the shoulder, dirty single, dirty shot, shot reverse shot]
what: over-the-shoulder shot — the subject in focus is filmed from behind the other person; that person's blurred back of the head and shoulder cover a third of the frame on one side, and the subject looks toward them; the basis of shot/reverse-shot dialogue and a way to show what a character sees without taking them out of the frame
frames: |
  1. Foreground: the back of the head, a shoulder, a profile or the arm of a pair of glasses of the near character at the side edge — 25–52 %
     of the frame width (typically ≈30 %) and 55–100 % of the height of the lower part of the frame. It is heavily blurred (sharpness below
     8 % of the sharp zone) and usually darker than the rest of the frame — a silhouette against the light; less often a light shirt or skin.
  2. The subject is in focus on the opposite third: face center x 0.66–0.68 with the shoulder on the left, 0.20–0.42 with the shoulder
     on the right; face 18–31 % of the frame height (medium close-up or medium shot), eye line 0.26–0.35 from the top. The face
     is turned toward the foreground — at the other person, past the lens.
  3. The camera is at the near character's shoulder height; if the far one is lower (lying, sitting, in water), the camera looks down over the shoulder.
  4. The camera is static or drifts handheld (jitter 0.03–0.4 %, shifts of up to 10 % of the frame over 0.5–1 s), occasionally
     a slow push-in ×1.07 over 0.7 s.
  5. Length 1.5–3 s. In a dialogue it is followed by the mirror shot: shoulder and face swap sides.
  Over the shoulder onto an object: a map, a screen, a newspaper in focus, while the character's head, glasses or shoulder is a blurred frame at the side.
variants:
  - shot/reverse-shot dialogue — the other person in focus, the near one's back of the head and shoulder blurred at the side (2 of 7; in one the shoulder is almost out of frame and the shot reads as a regular medium close-up)
  - over the shoulder onto an object — a map, a screen, a newspaper; the object is sharp, the character's head or glasses are a dark frame (3 of 7)
  - over the shoulder looking down — the near one stands, the far one lies or swims; the gaze goes down (1 of 7)
  - over the shoulder onto a figure in the environment — the far one walks toward the camera, the near one is a silhouette at the side (1 of 7)
status: footage
fallback: a dirty shot in code — if there is a wide two-person shot where the near one has their back to the camera, crop on the far one's face with the edge of the near one's back (crop headroom ×1.5–2); otherwise hybrid — mask the near one's silhouette from a neighboring shot (or a dark shoulder shape), blur it by 3–5 % of the width and place it on the side opposite the face, across 25–35 % of the width; if the characters were filmed separately and the fake is noticeable — generate an over-the-shoulder shot with consent
params:
  fg_width: 25–52 % of the frame width, typically 30–35 %
  fg_blur: sharpness ≤8 % of the sharp zone; when faking — Gaussian blur of 3–5 % of the frame width
  fg_luma: usually darker than the rest of the frame (silhouette), less often lighter (shirt, skin)
  face: 18–31 % of the frame height; center x 0.62–0.70 with the shoulder on the left or 0.20–0.42 with the shoulder on the right; eyes 0.26–0.35 from the top
  gaze: toward the foreground, past the lens
  duration: 1.5–3 s (38–75 frames @25 fps); in a dialogue — per line
  camera: static or handheld drift ≤0.4 %; optionally a push-in ×1.05–1.1 over 0.7–1.5 s
  pair_rule: mirror pair — shoulder and face swap sides, the shot size is the same, do not cross the 180° line
when: shot/reverse-shot dialogue — alternating two over-the-shoulder shots on every change of speaker; a bridge from the wide two-person shot to the close-ups; showing what a character reads or sees (a screen, a map, a letter) while keeping them in the frame — softer than a pure point-of-view shot; tension, surveillance, eavesdropping — the shoulder covers 40–50 % of the frame. 1–2 pairs per scene, then close-ups without the shoulder
avoid: a monologue and addressing the camera — the shoulder gets in the way; mixed-up sides in a pair (both shoulders on the left) — the axis breaks and the viewer confuses who is where; a sharp foreground — pulls attention away; a shoulder taking more than half the frame for no reason; different shot sizes in a mirror pair — one speaker unintentionally seems more important
sfx: the voice of the one in focus — closer and drier; the voice from behind the shoulder — slightly quieter and with more room sound; on the transitions between mirror shots — no hits, the line comes in 0.2–0.5 s before the cut
genres: {drama: signature, teaser: allowed, calm: allowed, explainer: allowed, product: allowed, ugc: allowed, sport: allowed, motivation: allowed, viral: allowed, fanedit: allowed}
detect: |
  1) a blurred mass at the side edge: blocks with sharpness <8 % of the sharp zone extend from the edge across 25–52 % of the width
     in ≥55 % of the rows of the bottom 85 % of the frame (6 of 7 examples); usually darker than the rest of the frame;
  2) a face (YuNet, threshold 0.7) on the opposite third, 18–31 % of the frame height, turned toward the mass;
  3) without a face — a sharp object (screen, paper, map) opposite a mass shaped like a head, a shoulder, the arm of a pair of glasses;
  4) ed_motion: static or drift ≤0.4 %.
  Differences: frame.two_shot — both faces are sharp and readable; shot.medium_close_up — there is no mass at the edge;
  pov.first_person — the camera is "the eyes", there is no shoulder or head in the frame; a frame of leaves, bars, a door
  opening — the mass does not look like a head and shoulders, and the subject's gaze does not go toward it.
engine: |
  classify_shot(clip, by='composition') → 'over_shoulder' with features 1+2 (or 1+3); side of the mass → fg_side.
  Dialogue: dialogue_cut(clips, by='speaker', overlap=0.3) — a new primitive: alternates pairs with fg_side 'L'/'R' on each change
  of speaker, the line's audio comes in before the cut by overlap seconds.
  Dirty shot from a wide: shot_crop(size='MCU', target=track(face), lead_room=0.1, include='edge:person_near', max_scale=2).
  Faking: mask(method='mediapipe_person') of the near one from a neighboring shot → blur(kind='gaussian', amount=0.04) →
  composite(layers=[frame, silhouette], blend='normal'), the silhouette across 30 % of the width on the side opposite the face.
