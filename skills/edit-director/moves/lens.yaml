id: lens.probe
family: lens
group: optics
level: B
aliases: [probe lens, tube lens, insect's-eye view, bug's eye, macro fly-through, camera inside an object, tabletop glide]
what: a thin tube lens, centimeters above a surface or inside an object, glides smoothly through a tiny world — grains, flowers, a table with food, a pocket, a bottle neck — at macro scale and yet with deep focus
frames: |
  1. Position: the lens is 1–5 cm above a table or the ground, inside an opening or a pocket, between objects;
     near objects (grains, petals, plates) are huge and pass right at the edge of the frame, the background is readable.
  2. Depth of field is large for macro: both near and far are sharp (people at the table, a landscape); at the same time
     there is real macro texture: drops, fabric fibers, skin pores.
  3. The motion is smooth and continuous, as on a motorized slider or a robotic arm:
     a forward pass changes the apparent scale ×1.4–7.3 over 1.8–2.6 s (almost linear or an S-curve);
     a pull-out ×0.2–0.5 over 2–6 s; jitter ≤0.5 % of the frame in 6 of 10; sometimes a roll of 20–50° over 0.4–0.9 s.
  4. The story of the move is a journey or a reveal: coming out of a tube or a pocket toward the subject, gliding along the body from
     the hand to the face and on into the space, a pass along a table past the guests, an approach to a product at plate level.
  5. Shot 1.2–6 s (up to 12 s), typically 2–4 s; strong parallax (nonrigid 0.09–0.43).
variants:
  - fly-through a mass — grains, flowers, grass, a macro world in which the camera "sinks"
  - from inside an object — a bottle neck, a pocket, a wallet: the object is taken out and the camera emerges
  - gliding along the body — from the clothes to the face of a subject lying down, then a pull-out into the space
  - a pass along the table — at plate height past hands, food and faces
  - an approach to a product at table level — a slow ×1.4 push-in under a title
status: footage
fallback: a real pass comes only from a tube lens or a small camera on a slider; look in the source footage for moving macro shots and table-level footage; a phone in macro mode on a slider near the surface is an acceptable substitute; otherwise generation with consent (generators handle such shots well); it cannot be simulated in code on a regular shot
params:
  height: 1–5 cm above the surface; near objects take up 20–60 % of the frame and pass at the edge
  move_in: apparent scale ×1.4–7 over 1.8–2.6 s, ease linear or inOutCubic
  move_out: ×0.2–0.5 over 2–6 s
  speed: 1–4 % of the frame per frame at the edges, the center nearly still
  roll: optionally 20–50° over 0.4–0.9 s when coming out of an opening
  stability: jitter ≤0.5 % of the frame, motorized smoothness
  dof: deep, both near and far are sharp
  shot: 2–4 s (50–100 frames @25 fps), a reveal up to 6 s
when: product and food videos (grains, ingredients, a product at plate level); intros and reveals of the subject, with the camera coming out of an object; a transition from the macro world into the space; mystery and wonder in children's and fairy-tale stories; 1–2 times per video as a "wow shot", best on a calm or rising part of the track
avoid: fast cutting, where the pass has no time to read; a shaky pass (smoothness is required); gaps that are too dark without extra light, giving noise and mush; repeating the same technique in every shot
sfx: a quiet rustle and crunch of the material (grains, leaves), the "breathing" of the space; coming out of an opening, a soft whoosh or pop; the ambience swells as the frame opens up
genres: {product: signature, teaser: allowed, calm: allowed, travel: allowed, epic: allowed, fashion: allowed, drama: allowed, explainer: allowed, fanedit: allowed}
detect: |
  ed_motion: a long smooth ZOOM-IN ×1.4–7 or ZOOM-OUT ×0.2–0.5 (actually a physical camera move) with nonrigid 0.1–0.45 and low shake
  (≤0.5 %), the scale center near the middle; near objects pass the edge at high speed, the center almost stands still.
  Visually: macro texture in the foreground and yet a sharp background; the camera position is at surface level or
  inside an object (the dark frame of an opening, the edges of a pocket). Difference from zoom.in: a zoom has nonrigid <0.15 and no parallax;
  from lens.ultra_wide: lines and perspective are not exaggerated, the subject is smaller, the motion goes through space; from focus.shallow:
  the background is not blurred.
engine: |
  selection: classify_shot(macro_motion) — high texture detail in the foreground + smooth ZOOM with nonrigid 0.1–0.45
  editing: cut on the start of the move, hold until the reveal (2–4 s), land the reveal on a downbeat;
  speed(rate=0.8–1) — do not speed it up, smoothness matters more; if footage is missing, generation(prompt=gen_hint, dur=4)
gen_hint: probe lens macro shot, camera glides a few centimeters above the <table / coffee beans / flowers>, huge foreground details passing by, deep focus with <people / landscape> sharp in the background, slow smooth motion-control move, bug's-eye perspective
commands: ["a probe-lens fly-through the grains in the intro", "the camera comes out of a pocket toward the subject on #3", "a pass along the table at plate level", "find macro passes in the source footage and put them at the start"]
related: [lens.ultra_wide, focus.shallow, pov.object, dolly.in, shot.extreme_close_up]
evidence: {examples: 10, sources: 9, measured: "push-in passes ×1.38–7.28 over 1.8–2.56 s, pull-outs ×0.2–0.53 over 2–5.95 s; curves almost linear or S-shaped; nonrigid 0.09–0.43; jitter 0.04–0.51 % in 6 of 10, 1.4–2.6 % in the rest; roll up to 53° over 0.84 s when coming out of an opening; shots 1.2–12 s", confidence: medium}
