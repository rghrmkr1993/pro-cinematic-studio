id: lens.ultra_wide
family: lens
group: optics
level: B
aliases: [ultra wide, ultra-wide angle, ultrawide lens, wide-angle lens up close, rectilinear wide, 0.5x, wide angle without distortion, wide-angle close-up]
what: an ultra-wide lens without barrel distortion (straight lines stay straight) right up close to the subject — the foreground is huge, the background far and small, the edges stretched, the space "inflates"; energy, comedy, scale
frames: |
  1. Distance: the subject is at 20–60 cm; a face, a hand or an object (a palm stretched toward the camera, a small vase, chewing gum)
     takes up 25–45 % of the width, people and space behind are 3–5 times smaller; the foreground object "pushes" into the lens.
  2. Geometry: straight lines stay straight up to the edges (in a hall, 17 of 20 long straight lines are in the outer quarters
     of the frame), but when the camera tilts, verticals converge, up to ≈10° at the edge, ≈22° across the frame width;
     objects at the side edges are stretched outward ≈1.2–1.5 times.
  3. Angle: often low, with the ceiling or sky taking up 40–50 % of the frame and a small figure at the bottom; or the camera
     at a table or on the floor, with the subject leaning down toward it from above and "looming".
  4. Depth of field is large, almost everything is sharp; the corners are darker than the center (corner/center 0.07–0.46 in 5 of 12).
  5. Camera: mostly static (9 of 12, shake ≤0.25 %), a slow push-in ×2 over 2.6 s or a tilt of 38 % of the frame over 3.3 s;
     in energetic shots, a handheld camera with jerks of up to 7 % of the frame per frame. Shot 0.85–6.9 s, typically 1–3.5 s.
variants:
  - face or object up close — a scream, a grimace, an object held out into the lens (comedy, food ads)
  - looming — the subject leans over the camera from above, the face stretches
  - huge space — a low position in a hall, on a staircase, under a dome, the person is small
  - a cramped interior wider than it is — a car, a room, a cabin; the subject's whole surroundings are visible
  - a hand or a gesture at the lens against a city or a landscape — a contrast of scale
status: footage
fallback: the field of view cannot be widened in code; look in the source footage for shots from a phone's ultra-wide camera (0.5×) or an action camera in linear mode; from fisheye or 360 footage, reproject to rectilinear with a horizontal angle of 100–120°; if the edges are missing, outpaint; otherwise generation with consent
params:
  hfov: ≈100–120° horizontal (equivalent to 12–18 mm on full frame)
  subject_distance: 20–60 cm; the near subject takes 25–45 % of the frame width, the background is 3–5 times smaller
  angle: low, camera tilted 10–40° up, or from above up close
  keystone: verticals converge ≈10–22° across the frame width when tilted; correct only if an "architectural" look is needed
  vignette: light, corner/center 0.4–0.8 (the originals go down to 0.07–0.46)
  camera: static or a slow push-in ×1.5–2 over 2–3 s; in energetic parts, handheld 2–7 %
  shot: 1–3.5 s (25–90 frames @25 fps)
  reproject: from fisheye, v360 input=fisheye, output=flat, h_fov=110, v_fov≈70
when: comedy and grimaces, a reaction "in the face" of the viewer; food and product ads, with the product held out to the camera; music videos and rap, with the performer looming over the camera; showing the scale of a space (a hall, a temple, a staircase) with a small person; UGC selfies at 0.5×; a hook in the first 1–2 s of the video; a series of 2–4 shots as a style
avoid: portraits and beauty, where the nose and forehead grow and a face at the edge stretches; people at the side edges in a group shot; calm, intimate moments; sport and action in the distance, where the subject is small; text and logos near the edges; frequent switching between wide and long focal lengths without purpose
sfx: sound "close to the mic" — breathing, crunching, rustling; a booming hall reverb on wide shots; in comedy, a short "boing" on a grimace
genres: {viral: signature, ugc: signature, fanedit: allowed, product: allowed, fashion: allowed, sport: allowed, travel: allowed, clips: allowed, phonk: allowed, motivation: allowed, teaser: allowed, drama: allowed, calm: forbidden}
detect: |
  Straight lines from 18 % of the height long stay straight near the frame edges (Hough: many long straight lines in the outer quarters),
  unlike lens.fisheye, where lines bend near the edges. Strong perspective: verticals converge (the tilt grows
  toward the edge, ≥10° across the frame width), the near subject is 3–5 times larger than the people behind, "looming" faces, stretched edges.
  Sharpness across almost the whole frame (no soft background as with focus.shallow). ed_motion: with camera motion, nonrigid 0.3–0.9
  (strong parallax between near and far); often static. Corner/center brightness ≤0.5 in half of the examples.
  Difference from a regular wide shot: the subject is close and large, not small in the center.
engine: |
  selection: classify_lens(wide) — long straight lines at the edges + converging verticals + a large near subject
  reprojecting fisheye or 360: ffmpeg v360=input=fisheye:ih_fov=180:iv_fov=180:output=flat:h_fov=110:v_fov=70
  imitation on a regular shot: outpaint(expand=1.3) → lens_reproject(model='rectilinear', hfov=110) + vignette(amount=0.3);
  editing: 1–3.5 s, enter on a downbeat; motion: transform(scale=[1, 1.3], t=[t0, t0+2.5], ease='outCubic')
gen_hint: ultra wide angle 14mm rectilinear lens, <subject> leaning right into the camera inches away, exaggerated perspective, huge foreground <object/face>, background far and small, straight lines, low angle, deep focus, playful energy
commands: ["make it look shot at 0.5×, face up close on #2", "ultra-wide from below in the hall for the intro", "find ultra-wide shots in the source footage and put them in the verse", "the product held out to the camera on a wide angle"]
related: [lens.fisheye, angle.low, shot.close_up, focus.shallow, pov.first_person]
