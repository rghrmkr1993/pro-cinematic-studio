id: lens.magnifier
family: lens
group: optics
level: B
aliases: [magnifier in the frame, magnifying glass, magnifying glass shot, shot through a magnifier, loupe, magnifier effect, detective magnifying glass]
what: a magnifying glass in the frame — inside the circle the area is magnified 1.6–2.5 times and slightly bulging, outside it the scale is normal; it reads a clue, text or a detail, or comically blows up an eye and a mouth
frames: |
  1. The magnifier takes up 0.6–1.05 of the frame height (median ≈0.8 H), centered near the middle (0.41–0.61 W, 0.39–0.63 H);
     a dark or metal rim of 2–4 % of the diameter, on the glass an elliptical highlight near the top edge, along the edge a slight
     rainbow fringe and compression (bulge).
  2. Inside, magnification of ≈×1.6–2.5: handwriting, a halftone newspaper photo, fingerprints, film frames, an eye or teeth.
     Sometimes everything outside is softer (focus on the image in the lens).
  3. Motion: the camera is static (7 of 9, jitter ≤0.25 %), the magnifier is moved slowly over text or film,
     0.3–2 % of the frame per frame, sometimes jumping to the next clue; a hold of 1–2 s on the key word or detail.
  4. Shot 1.3–3.7 s; often an insert: a wide shot with the magnifier → cut to a close-up through the magnifier.
variants:
  - clue — the magnifier glides over a letter, a newspaper, fingerprints, film; the find sits in the center of the circle
  - comic — the magnifier in front of an eye, a mouth or a face: the feature is blown up ×2–3, the rest of the face is normal
  - inverted image — a magnifier held farther away than its focal length shows the face upside down
  - a magnifier on a stand or with a ring light in front of the face — a distorted part of the face
  - monocle loupe at a craftsman's eye — a subjective blurred view through it
  - transition through the eye — macro on an object → an eye behind the magnifier → pull-out to the person holding the magnifier
status: code
fallback: a real magnifier in a hand is best found in the source footage or generated; code makes a plausible overlay, a round mask with digital magnification, bulge, rim and highlight; for a hand holding the handle, graphics or generation
params:
  diameter: 0.6–1.05 H, typically 0.8 H
  zoom_inside: ×1.6–2.5 (typically ×2) around the same center
  bulge: barrel inside the circle k1 ≈0.2–0.35, compression toward the rim
  rim: a dark or metal ring of 2–4 % of the diameter; highlight is a white ellipse of 8–15 % of the diameter near the top edge, transparency 40–60 %
  fringe: chromatic fringe of 1–2 px at the rim
  outside: optionally blur the background outside, σ ≈0.3–0.6 % of the width
  path: gliding at 0.3–2 % of the frame per frame across the text, ease inOutQuad; a hold of 1–2 s on the detail
  shot: 1.3–3.7 s (33–93 frames @25 fps)
when: explainer and detective videos, to show a detail, a figure, a line, fine print; an accent on a clue or a fact; product, to magnify texture, a seam, an engraving; comedy and memes, a blown-up eye or mouth; a transition from a detail to a face; 1–2 times per video, on a punchline
avoid: moving the magnifier too fast, so the text cannot be read; magnifying without enough spare resolution (mush inside the circle); the magnifier covering the speaker's face at an important moment; several magnifiers at once; a serious tone combined with a comically blown-up face
sfx: a quiet "squeak" or paper rustle as the magnifier moves; on the find, a "ding", a click or a short hit; in comedy, a "boing" on the blown-up eye
genres: {explainer: signature, teaser: allowed, product: allowed, viral: allowed, ugc: allowed, fanedit: allowed, drama: allowed, clips: allowed}
detect: |
  A circle (Hough) with a diameter of 0.6–1.05 H persists in most frames, its center shifts slowly (0.3–2 % of the frame per
  frame) while the camera is static (ed_motion: no global events, shake ≤0.25 %); texture inside the circle is larger
  than outside by 1.6–2.5 times (letters, halftone, pixels); a dark ring and a highlight along the rim. Difference from lens.fisheye:
  the magnified circle is part of the frame, with normal perspective outside; from lens.vignette: the boundary is sharp and the circle moves.
engine: |
  magnifier(center=path([[x0,y0],[x1,y1]]) | track(object:<name>), diameter=0.8, zoom=2.0, bulge=0.25, rim=0.03,
  highlight=0.5, fringe=1, outside_blur=0.004, t=[t0, t0+2.5], ease='inOutQuad') — new primitive:
  inside the circle transform(scale=zoom, center=the same center) + lens_distort(k1=bulge) + composite through a round mask.
  Comic variant: center=track(face:eye|mouth), diameter=0.3–0.5, zoom=2.5.
gen_hint: close-up of a hand sliding a round magnifying glass across <a handwritten letter / old newspaper photo>, the words inside the lens enlarged twice and slightly bulging, soft reflection on the glass, detective mood, static camera
commands: ["show this number through a magnifier at 0:21", "glide a magnifier over the contract text on #4", "blow up the eye with a magnifier on the reaction", "magnifier effect on the product's seam"]
related: [lens.fisheye, lens.vignette, zoom.punch, gfx.callout, focus.shallow]
evidence: {examples: 12, sources: 10, measured: "magnifier diameter 0.61–1.03 H (median ≈0.8); center 0.41–0.61 W; magnification inside ≈×1.6–2.3 (estimated from letter height on close shots); static in 7 of 9 measured (shake 0.02–0.25 %); the magnifier moves 0.24–1.9 % of the frame per frame; shots 1.3–3.7 s; clue 6 of 12, comic face 3, inverted image 1", confidence: medium}
