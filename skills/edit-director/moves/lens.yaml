id: lens.fisheye
family: lens
group: optics
level: B
aliases: [fisheye, fish-eye, circular fisheye, fisheye lens, action cam up close, peephole view, door peephole]
what: an ultra-wide lens with barrel distortion — the center bulges, straight lines bend near the edges, the image is often inscribed in a circle with black margins; it brings energy, closeness and a "street" or anxious subjectivity
frames: |
  1. Geometry: one of four formats by the size of the image circle:
     (a) full circle ≈1.0 of the frame height, black margins at the sides (40–60 % of the area);
     (b) circle ≈1.2 H, cropped at the top and bottom, black only at the sides;
     (c) circle ≈ the frame width (0.96–1.07 W) or the diagonal, only the corners are black (1–6 % of the area);
     (d) full-frame: no black, straight lines near the edges bow outward, the horizon is straight only through the center.
     The edge of the circle is sharp (feather 1–2 % H), often with a thin light ring of the lens rim or a blue fringe.
  2. Distance: the subject is 10–50 cm from the lens. In 5 of 13 examples a face or palms are right at the lens:
     nose, lips and hands are bloated, the face takes up 25–50 % of the width, the background sharply "runs away". In 3 of 13,
     a low position near the ground behind a skater or a BMX rider (camera 20–50 cm from the wheels).
  3. Motion: either static (3 of 13: observation, performing into the lens) or a ragged handheld
     or follow camera: shake of 2–4.5 % of the frame per frame, rolls of ±30–37° over 0.4–0.7 s,
     with BMX a tilt of up to ~90° and back over ~2.5 s; motion blur in fast sections.
  4. Shot length 0.7–2.3 s (18–58 frames @25 fps), rarely up to 3.3 s. Dark corners:
     corner/center brightness 0.24–0.35 in dark scenes; 3 of 13 are black and white.
variants:
  - full circle in the frame (≈1 H) — static observation or a handheld camera in a crowd with flashes
  - peephole: a small circle ≈0.8 H inside a light metal ring and door texture — spying
  - circle at frame width with black corners — selfies, indoor skating with curved arches
  - full-frame, face at the lens — bloated features, the artist shouts or sings straight into the lens
  - low follow shot — skateboard or BMX, camera near the wheels, big rolls
  - b/w 90s street aesthetic — low angle looking up, light flares, large captions on top
status: code
fallback: a true 180° view comes only from a fisheye lens or an action camera, so first look for such shots in the source footage (detect); code on a regular shot gives a convincing imitation if the subject is close and the camera moves; for "face into the lens" without a suitable shot, generation with consent
params:
  distortion: barrel; ffmpeg lenscorrection k1 0.3–0.6 (typically 0.45), k2 0–0.1 — a line near the edge bends by 3–7 % of the height, the edges are compressed 1.4–1.7 times
  fill_zoom: ×1.2–1.35 after the barrel to remove the black corners (full-frame format)
  circle: diameter 1.0 H (full) | 1.2 H | 1.0 W (black corners) | 0.8 H (peephole); center 0.48–0.52; feather 1–2 % H; a 1–2 px light or blue ring, optional
  vignette: 0.3–0.6 (corner/center brightness 0.25–0.35)
  shot_length: 0.7–2.3 s (18–58 frames @25 fps)
  camera: static or handheld — shake 1–4 % of the frame, rolls of ±20–40° over 0.4–0.7 s
  subject: 10–50 cm from the lens; face 25–50 % of the frame width; source footage from an ultra-wide works best
  look: optionally b/w or faded color, grain
when: an energetic verse or drop; street, skate and hip-hop aesthetics; performing straight into the camera; a comic selfie with a bloated face; parties and crowds; spying through a peephole; paranoia and anxiety in drama. A series of 2–4 short shots or a single accent; if it is not the style of the whole video, no more than 20–30 % of the running time
avoid: a product or face where proportions matter (beauty, luxury, product close-up); calm and meditative videos; a distant subject in the center, where the distortion is "empty" and looks like a mistake; different circle diameters in one scene; titles and captions near the edges of the circle (they bend and get cut off)
sfx: no sound of its own; supported by dry, close sounds (wheels, hits, breathing into the mic); in comedy, a "boing" or a distorted voice; entering a series, a short whoosh or a scratch
genres: {fanedit: allowed, ugc: allowed, viral: allowed, sport: allowed, clips: allowed, fashion: allowed, travel: allowed, drama: allowed, teaser: allowed, phonk: allowed, calm: forbidden, product: forbidden}
detect: |
  Circular formats: a region that is dark (brightness <22) in every frame of the clip covers 1–60 % of the area; its boundary
  fits a circle (fitting error ≤2 px on a 256 px tile), center 0.48–0.52, diameter 0.8–1.95 H,
  and it does not move when the camera moves; this separates the mask from dark content in the frame.
  Full-frame: straight lines near the edges bow outward, near the center they are straight; objects near the edges are compressed.
  ed_motion: nonrigid 0.3–0.8 even on simple moves, false ZOOM ×0.7–3.5 and ROTATE when approaching
  the subject (the similarity model cannot describe barrel distortion), shake 2–4.5 %; corner/center brightness ≤0.35.
  Difference from lens.vignette: a soft gradient with no bending of lines. From lens.ultra_wide: straight lines stay straight,
  the edges are stretched rather than compressed. From lens.probe: long optics right at the subject, no circle and no barrel at the edges.
engine: |
  full-frame: lens_distort(model='barrel', k1=0.45, k2=0.05, center=[0.5, 0.5], fill_zoom=1.3)
  circular: lens_distort(k1=0.5) + circle_mask(diam=1.0, of='H', center=[0.5, 0.5], feather=0.015, rim='light')
  + vignette(amount=0.45); for a static source, destabilize(profile='handheld') with rolls of up to 20°.
  ffmpeg: lenscorrection=k1=0.45:k2=0.05 → scale ×1.3 → crop to the original size; the circle via alphamerge with a mask.
  Peephole: circle_mask(diam=0.8) + a 4–6 % H ring with a light gradient + texture around it (or generation).
gen_hint: fisheye lens shot, camera inches from <subject's face / skateboard wheels>, 180-degree circular image with black corners, bulging center and curved horizon, handheld street energy, 90s skate video look
commands: ["fisheye on #3", "circular fisheye on all the selfie shots", "simulated fisheye on the skate shots in the second verse", "a view through a door peephole at 0:15"]
related: [lens.ultra_wide, lens.vignette, lens.probe, handheld.shaky, pov.first_person]
evidence: {examples: 13, sources: 12, measured: "full circle ≈1.0 H: 2, cropped 1.2 H: 1, circle at frame width 0.96–1.07 W with dark corners of 5–6 % of the area: 3, on the diagonal: 1, peephole ≈0.8 H: 1, full-frame: 5; shot length 0.7–2.3 s (up to 3.3 s); shake up to 4.5 %/frame, rolls of ±30–37° over 0.4–0.7 s; corner/center 0.24–0.35 in dark scenes; b/w 3 of 13; ffmpeg calibration on a grid: k1 0.15→0.6 bends a line near the edge by 3.1→6.7 % H", confidence: high}
