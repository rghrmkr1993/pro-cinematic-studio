detect: |
  Radial brightness profile: the center is bright and falls off toward the corners to ×0.01–0.05 (hard) or ×0.4–0.8 (light), regardless
  of the content and fixed relative to the frame even as the camera moves; the visible area is a compact circle or ellipse
  covering 27–75 % of the frame, center around 0.5. ed_motion: black-like edges in every frame, bars may catch the black sides;
  "closing": the window area drops monotonically over 1–2 s without a cut.
  Differences: a spotlight is darkness tied to the scene that moves with the subject; a window on a field (windowbox) is a rectangle
