id: lens.vignette
family: lens
group: optics
level: B
aliases: [vignette, vignetting, darkened edges, round vignette, iris frame, iris vignette, scope view, view through a sight, view through binoculars, tunnel vision]
what: the frame edges darken to black, leaving a round or oval "window" — focus on the center, a look through a tube, a scope, a peephole, a memory or anxiety
frames: |
  1. Window: a bright circle or oval in the center (center 0.45–0.52 in x, 0.43–0.56 in y), usually slightly elongated vertically
     (aspect 0.8–1.2 in pixels); the visible area is 27–52 % of the frame, a hard "scope" 75 %; the corners are almost black (×0.01–0.04 of the center).
  2. Edge: a soft falloff from 50 % to 10 % brightness over 5–25 % of the frame height (H), wide for a soft "old lens",
     sharp at 1–5 % H with a dark rim ring for a scope or a peephole.
  3. Light vignette: corners only ×0.4–0.8, no defined window, often combined with distortion and blurred edges (a cheap lens).
  4. Dynamics: an "iris close", the window shrinks from 100 % to 8 % of the area over 1.2–2 s (30–50 frames) toward the point
     of interest (center y 0.63) and holds; the reverse opening at the start of a scene; the vignette "breathes" with the camera.
  5. Scope or binocular attributes: crosshair, scale, red dot; the frame drifts slightly (handheld optics).
variants:
  - soft round vignette on black — a memory, a dream, "old cinema"
  - scope or monocular — a sharp circle covering 75 % of the frame, crosshair and scale
  - peephole or spyglass — a small sharp circle, the rest black, an observer's POV
  - iris close — the circle shrinks toward a detail and holds (the end of a scene)
  - light corner darkening — a cheap or antique lens, corners ×0.4–0.8, soft frame edges
status: code
fallback: everything is done in code on any shot; an "iris close" needs an uncluttered frame with a clear point of interest (object track); draw the crosshair and the scope scale as our own neutral graphics
params:
  shape: circle or ellipse; window aspect 0.8–1.2 (in pixels), not stretched to 16:9
  size: visible area 27–52 % of the frame (radius 0.3–0.45 H); scope 0.65–0.75 of the width; peephole 0.2–0.3
  feather: soft 10–25 % H, hard 1–5 % H; a light vignette has no edge, only a falloff
  darkness: corners ×0.01–0.05 of the center (black), ×0.4–0.8 (light)
  center: frame center or the target track [0.5, 0.45–0.63]
  iris_close: 100 → 8 % of the area over 1.2–2 s (30–50 frames), inOutCubic; hold 1–2 s, then a cut or a fade to black
  scope_extras: 1–2 px crosshair, scale, a 2–3 % H rim, a slight drift of 0.2–0.5 % per frame
  grade: +5–10 % contrast inside; b/w or a light sepia for "old cinema"
when: memories and flashbacks, an observer's POV (binoculars, a scope, a peephole, a keyhole), ending a scene with an "iris" in a retro style, singling out one person in a crowd, anxiety and tunnel vision; a light vignette as a permanent part of the look
avoid: vertical 9:16 (the circle eats the usable width, so reduce the strength); text and captions near the edges; overuse; a hard vignette in product and explainer videos, where the frame edges matter
