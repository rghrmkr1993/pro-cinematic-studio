id: address.aside
family: address
group: editing
level: B
aliases: [aside, look into the camera, reaction glance into the lens, look to camera, camera glance, wink at the viewer, viewer as accomplice]
what: a fleeting glance by the character into the lens mid-scene — a smirk, an eyebrow raise, a deadpan face, a shrug or a short line to the viewer — and straight back into the action; the viewer becomes an accomplice
frames: |
  1. Trigger: something absurd, awkward or lucky has just happened in the scene; the character is busy — talking to someone,
     walking, eating, doing a stunt. The camera is static or slowly pushes in over the last 1.4–4 s (×1.14–1.30 per second).
  2. Turn: the head turns to the lens in 0.15–0.25 s (4–6 frames @25 fps). Variants: only the eyes move while the head
     stays in three-quarter view; or a slow turn over the shoulder or with the whole body in 0.4–1 s.
  3. Contact 0.3–1.6 s (8–40 frames): a smirk, a raised eyebrow, a deadpan face, an awkward grimace, a shrug, an eye
     roll; silent in 15 of 24. The others in the frame don't notice the glance and carry on with what they are doing.
  4. Exit: the head returns to the scene in 0.2–0.4 s — or cut right at the peak of the expression while the gaze
     still holds.
  5. Boosters (optional): a ×2 crash zoom into the face in 0.2 s before the contact; a long zoom that ends on the glance;
     ×0.1–0.2 slow motion at the peak of a stunt; a freeze frame on the glance.
variants:
  - close-up smirk (4 of 24): profile → turn to camera → a smug half-smile or a raised eyebrow; in hand-drawn animation — a laughing grimace straight at the viewer
  - over-the-shoulder glance (3): the character walks away from the camera or stands in a crowd with their back to it and looks back into the lens; the camera slowly pushes in
  - side-eye (2): only the eyes move to the lens, the head stays turned away in three-quarter view, the character keeps talking or smoking
  - spoken aside (4): a short line or gesture to the viewer (a shrug, "did you see that?"), the people around don't hear it; the character sometimes steps a pace away from the group
  - one of the group (2): everyone is busy or has their back turned, and only one person looks into the camera
  - deadpan stare after something absurd (2): a scared or awkward look without words, at the end of a zoom
  - with an object: the character briefly looks into the camera and raises an item toward it
  - at the peak of a slow-motion stunt: time has almost stopped, the athlete in mid-air smirks into the lens
  - camera inside an object: a look "into the tank" or "into the cupboard", then a smile into the camera
  - a narrator downstage turns to the viewer (2) — borderline with address.direct
  - point-blank cut (general section): after loud action — a hard cut to a close-up where the character is already looking into the lens, displeased, for ≈0.9 s; there is no turn, the cut itself "delivers" the glance
status: footage
fallback: |
  1) Search the source footage: vlogs, sketches, behind-the-scenes and stories are full of accidental 0.3–1 s glances
  at the camera — look for those. 2) Code (hybrid): if the shot has at least 2–3 frames where the person looks into
  the lens — freeze 0.6–1.2 s on that frame + punch-in ×1.15–1.3 + a record scratch or a music pause — gives a "built" aside.
  3) Generation with consent: the same character in the same scene with a short glance into the lens (gen_hint).
params:
  turn_in: 0.15–0.25 s (4–6 frames @25 fps) in 5 of 8 measurable cases; slow — over the shoulder or with the whole body — 0.4–1 s (3)
  contact: 0.3–1.6 s (8–40 frames) in 17 of 24; comic holds and over-the-shoulder glances — 2–2.5 s; longer and with speech to the viewer, it is already address.direct
  head: frontal or near-frontal (|nose − eye midpoint| ≤0.2 of the interpupillary distance) — 15 of 24; three-quarter 0.25–0.6 with eyes on the lens — 8 (over-the-shoulder glance, side-eye, smirk)
  face_h: close-up 0.43–0.76 of frame height (8 of 24), medium 0.16–0.31 (10), wide 0.07–0.14 (5)
  silence: no words in 15 of 24; a line — at most 1 sentence
  lead: the glance comes 0.3–0.8 s after the trigger (punchline, fall, awkwardness) (≈)
  camera: static (jitter ≤0.3 %) — 11 of 24; a push-in ending on the glance, ×1.33–2.42 over 1.44–4.05 s (×1.14–1.30 per second) — 4; fast zoom ×2.07 in 0.2 s or ×5.32 in 1.5 s (ease-out) — 2; pull-out ×0.47–0.91 — 2; slow motion ×0.1–0.2 — 1
  exit: head back to the scene in 0.2–0.4 s or a cut at the peak of the expression, 0.5–1.2 s after the contact starts (≈)
when: |
  A comic beat after a punchline, a fail, absurdity or awkwardness — the character "shares" it with the viewer; a sly look
  when the character has got away with something; a departing character's over-the-shoulder glance at the end of a shot;
  in a music video — the performer's quick glance into the lens on a lyric accent; in an ad — a knowing look after the
  product has worked; in sport — a smirk at the peak of a stunt. Place it on a downbeat or in a music pause.
  At most 1–2 times per minute, never two in a row.
avoid: |
  It needs a trigger: a glance with no event looks like an accidental mistake. Don't hold it longer than 1.6–2 s — it
  turns into direct address or an awkward pause. A talking head that looks into the camera all the time anyway — there
  is no contrast, the move doesn't read. Epic and serious tone: a wink undercuts the solemnity. If the glance has an
  addressee in the story (a reverse shot of the listener), it is pov.dialogue. Passers-by accidentally glancing at the
  camera in reportage are an artifact, not a move, unless the edit emphasizes them.
sfx: |
  On the head turn — the music stops or dips by −15…−20 dB for 0.3–0.6 s, sometimes a record scratch; in comedy — a
  single "ding", chirping crickets, a short hit or a laugh track; with a crash zoom — whoosh + impact on the landing.
  Back to the scene — the music comes back on the next beat.
genres: {viral: signature, ugc: signature, fanedit: allowed, clips: allowed, teaser: allowed, product: allowed, fashion: allowed, sport: allowed, travel: allowed, explainer: allowed, phonk: allowed, calm: allowed, epic: forbidden, drama: forbidden, motivation: forbidden}
detect: |
  By the face over time: head or eyes turned away (|nose − eye midpoint|/interpupillary distance >0.3) → turn to the
  lens in 0.15–0.25 s (rarely up to 1 s) → contact 0.3–1.6 s (frontal or three-quarter with eyes on the lens) → turned
  away again or a cut. What's in frame before the glance is a live scene: a conversation partner, action, other people
  who don't look at the camera; there is no reverse shot.
  ed_motion: "no significant global motion" or a slow ZOOM-IN ×1.3–2.4 over 1.4–4 s (peak ≤×1.03/frame) that
  ends on the glance; or a sharp ZOOM-IN peaking at ≥×1.2/frame with a cut right before the glance; in slow motion
  the difference between adjacent frames drops by a factor of 4–8.
  Distinctions: address.direct — contact ≥1.5–2 s, speech to the viewer, the character "steps out" of the scene; here —
  an instant reaction inside the scene. pov.dialogue — the gaze is aimed at a character who is the camera (there are
  reverse shots). frame.interview — the gaze passes the lens. An accidental glance at the camera in documentary
  footage — no trigger and no emphasis from the edit.
engine: |
  footage: find_shot(gaze='lens', dur=[0.3, 1.6], prev_gaze='off', faces>=1) → events [t_in, t_out];
           t_in — end of the head turn, t_out — the gaze has left.
  assembly: cut(at=t_in−0.4) … cut(at=min(t_out, t_in+1.2)) — glance 0.3–0.8 s after the trigger, cut at the peak
            of the expression; put t_in on a downbeat.
  accent (pick one):
    pause: duck(music, −20 dB, t=[t_in, t_in+0.5]) + sfx('scratch', at=t_in)
    crash: transform(scale=[1, 2.0], center=track(face), t=[t_in−0.2, t_in], ease='inOutCubic') + blur(kind='zoom')
           + sfx('whoosh', at=t_in−0.2) + sfx('impact', at=t_in)
    zoom-in: transform(scale=[1, 1.25], center=track(face), t=[t_in−2.0, t_out], ease='inOutQuad')
    freeze frame: freeze(at=t_in+0.3, dur=0.8) + text(caption, style='caption', anim='pop', safe_zone='tiktok')
    slow motion: speed(curve=[[t_in−0.3, 1], [t_in, 0.2], [t_out, 0.2], [t_out+0.2, 1]], interp='flow')
  no ready-made glance: find_frames(gaze='lens', min=2) → freeze(dur=0.8) + transform(scale=[1, 1.2], ease='outCubic').
gen_hint: <character> in the middle of <scene action> briefly glances straight into the camera lens with a knowing smirk (or raised eyebrow, deadpan stare, shrug) for about one second, then turns back to the scene; the other people in the frame do not notice; static camera, medium close-up, natural light
commands: ["after his line — a glance at the camera with a pause and a record scratch", "find the moments where she briefly glances into the lens", "on #5 do a crash zoom into his smirk", "freeze the glance at the camera for a second and add a caption", "at the end, have him look back over his shoulder into the camera"]
related: [address.direct, pov.dialogue, zoom.crash, zoom.slow, time.freeze, time.slow_motion, address.lens_touch, frame.interview]
evidence: {examples: 24, sources: 19, measured: "YuNet frame by frame: head turn to the lens 0.15–0.24 s in 5 of 8 measurable (slow 0.4–1 s in 3 — over the shoulder, whole body); contact 0.3–1.6 s in 17 of 24, 2–2.5 s in 5, narrator ≥3 s in 2 (some clips are cut off on the glance); frontal or near-frontal 15, three-quarter with eyes on the lens 8; silent in 15 of 24; face 0.07–0.76 of the height (close-up 8, medium 10, wide 5); ed_motion: static 11, push-in ×1.33–2.42 over 1.44–4.05 s (4), zoom ×2.07 in 0.2 s and ×5.32 in 1.5 s, pull-out ×0.47–0.91, slow motion (frame difference drops from ≈25 to 2–8); general fourth-wall section: 10 of 32 examples are this move (9 match the section, 1 new — the point-blank cut)", confidence: high}
