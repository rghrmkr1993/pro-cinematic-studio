id: address.direct
family: address
group: editing
level: B
aliases: [direct address, addressing the viewer, looking into the lens, breaking the fourth wall, talking to camera, piece to camera]
what: "speaking to the audience: the subject turns to the lens to explain, point something out or lean in, and the viewer is pulled into the conversation instead of watching from outside"
frames: |
  1. Entry (optional): the character is busy with the scene — in profile, back to camera, on the move; a narrator
     enters the frame from the edge in 1–4 s, or a camera pan across 15–49 % of the frame in 0.8–1.8 s reveals them
     next to the scene.
  2. Contact: the head turns to the lens in 0.2–0.35 s (5–9 frames @25 fps) and the gaze locks straight onto the lens.
     The face is frontal (nose offset from the eye midpoint ≤0.15 of the interpupillary distance) or three-quarter, but
     with the eyes on the lens.
  3. Address: a line to the viewer or a silent challenging stare plus an action toward the camera — an open palm
     "presenting", fists or an object to the lens, a lean or a lunge: the face grows ×1.2–2.3 in 0.3–1.0 s against a
     still background. During the contact the camera is static (16 of 25) or slowly pushes in ×1.2–2.0 over 0.5–3.5 s.
  4. Duration: a performer's silent beat 1–2.8 s; a line 3–7 s; a long monologue — takes of 3–7 s each (median ≈4 s),
     joined with jump cuts that change the outfit or the location.
  5. Exit: the character turns back to the scene, leaves the frame in 0.9–1.5 s (the camera stays on the scene or
     pans away) — or a cut right on the last word.
variants:
  - narrator-host (6 of 25): stands at the edge of a wide shot (face center at 0.14–0.15 or 0.74–0.77 of the width in 5 of 6, face 8–14 % of the height), the scene plays out in the other half of the frame; talks into the lens, "presents" the scene with a gesture and leaves — the scene goes on
  - monologue to the viewer (5 of 25): a close-up or medium shot, centered or on a third, 3–7 s of speech per take; the long version has 7 takes in 32 s with a change of outfit and location at every cut
  - a line mid-task: the character is riding, holding on, working — turns the head to the camera in ≈0.2 s, comments and goes back to the task
  - performer challenge (8 of 25, music video and ads): a silent stare, a lean or a lunge toward the lens, hands, fists or a dish reaching toward the camera; often from below or with a wide-angle lens
  - push-in to the turn: the camera slowly pushes in (×1.5–1.9 over 1.5–3.5 s), and by the end of the push-in the character turns to the lens
  - group into the lens: several people loom over the camera, shot from below, and look straight into it
  - with graphics: outlines and labels appear next to the characters, then full-frame kinetic text
  - camera inside an object (a fridge): the person looks into the lens and talks to the viewer, not to the object — borderline with pov.object
  - beckoning host (5 examples from the general section): waves and calls the viewer — the camera lurches in after him through a door in ×1.3 jerks of 0.2–0.5 s and chases him through the house with motion blur; or he stands in frame while the set behind him breaks apart and changes (trans.set_change)
status: footage
fallback: |
  Needs a shot where the person looks into the lens. 1) Search the source footage: selfies, stories, vlogs and stand-up
  are made almost entirely of such pieces; even an accidental glance at the camera of 0.3 s or more will do. 2) Code
  (hybrid): the accidental glance is stretched with freeze or slow-mo 0.5–1.5 s + punch-in ×1.15–1.3 on the face + a
  caption — this gives a silent address beat (see address.aside); speech can't be made this way. 3) Generation with
  consent: a host or character speaking to camera over a ready voice-over script (gen_hint).
params:
  gaze: into the lens for the whole fragment; head frontal (|nose − eye midpoint| ≤0.15 of the interpupillary distance in ≥60 % of frames) in 17 of 25, the rest three-quarter (0.15–0.3) with eyes on the lens
  face_h: close-up — face 0.40–0.71 of frame height (8 of 25), medium 0.19–0.35 (8), wide — full figure, face 0.08–0.15 (9)
  face_x: centered 0.46–0.53 of the width (14 of 25); on a third 0.29–0.40 or 0.59–0.64 (5); narrator at the edge 0.14–0.15 or 0.74–0.77 (5)
  turn_in: turn to the lens 0.2–0.35 s (5–9 frames @25 fps), contact holds ≥1.5 s
  approach: a lean or a lunge — face ×1.2–2.3 in 0.3–1.0 s (8–25 frames @25 fps), background scale ×1.00–1.02
  camera: static (jitter ≤0.3 %) during the contact — 16 of 25; push-in ×1.2–2.0 over 0.5–3.5 s (≤×1.03/frame @25 fps) — 5; handheld 0.5–0.7 % — 4; a pan to or away from the narrator, 15–49 % of the frame in 0.8–1.8 s
  duration: silent beat 1–2.8 s (25–70 frames @25 fps); a line 3–7 s (75–175 frames); monologue — pieces of 3–7 s, median ≈4 s
  speech: they speak in 13 of 25, the rest — a silent look with an action toward the camera
  exit: leaving the frame 0.9–1.5 s, a pan away or a cut on the last word
when: |
  Hook: the first 0–2 s — a look into the lens and the first line; the strongest opening for UGC, explainer and
  motivation videos. A narrator opens a chapter or introduces the next scene. A commentary line mid-story — irony,
  "did you see that?". In a music video — the performer leans toward the lens on a downbeat or on the chorus entry.
  Ending — a call to action to the viewer in the last 2–4 s. In a narrative edit, 1–3 addresses per video, otherwise
  the move wears thin; in a talking head the address is the whole video, but with cutaways over the voice every 3–8 s
  and a change of shot size every 2–4 s.
avoid: |
  A gaze 10–30° off the lens is an interview (frame.interview), not direct address. After the address, don't put a
  reverse shot of the listening character — the picture turns into pov.dialogue. Don't cut in the middle of a line said
  straight to the viewer. Several different people addressing the camera in a row with no link confuse the viewer. Jump
  cuts between takes with different eyelines. In immersive drama, an unintended address breaks the illusion.
sfx: |
  Voice dry and close, music under the voice at −12…−18 dB. In a story scene, as the head turns to camera, the background
  and music dip or fall silent for 0.2–0.5 s — the viewer is "caught"; in comedy — a record scratch or a music stop. A
  performer's lunge — a whoosh or a riser with a hit at the peak. The narrator gets a "studio" tone of their own, with
  the scene sound behind them 6–10 dB quieter.
genres: {ugc: signature, explainer: signature, viral: signature, motivation: allowed, product: allowed, fanedit: allowed, teaser: allowed, drama: allowed, fashion: allowed, travel: allowed, sport: allowed, phonk: allowed, clips: allowed, calm: allowed, epic: allowed}
detect: |
  A face in frame, eyes on the lens (pupils centered in the eye opening — visually or with a gaze detector), head frontal
  (|nose − eye midpoint|/interpupillary distance ≤0.15) or three-quarter ≤0.3; continuous contact ≥1.5 s; the mouth
  moves (speech) or there is an action toward the camera. ed_motion: "no significant global motion", jitter ≤0.3 % — or
  a slow ZOOM-IN ×1.2–2.0 peaking at ≤×1.03/frame, or SHIFT 15–49 % over 0.8–1.8 s (the camera reveals the narrator).
  Lunge toward the camera: the face grows ×1.2–2.3 in 0.3–1.0 s while the background scale is ×1.00–1.02 (ed_motion over
  the whole frame will show ZOOM-IN with nonrigid ≥0.3).
  Distinctions: address.aside — a reaction glance of 0.3–1.6 s, usually wordless, in the middle of an ongoing scene and
  straight back; pov.dialogue — the same picture, but next to reverse shots of the listening character or answers from
  off-screen; frame.interview — the gaze passes the lens by 10–30°; look.news — a reporter with broadcast lower thirds;
  pov.object and pov.mirror — an object's rim framing the picture or everyday actions near the face, with no talking
  to the viewer.
engine: |
  footage: find_shot(gaze='lens', faces>=1, min_dur=1.5, speaking=any) → contact segments [t0, t1]; t0 — end of
           the head turn to the lens.
  hook: cut(at=t0) as the first shot + text(hook, style='caption', anim='pop', t=[0, 1.5], safe_zone='tiktok').
  monologue: jump_cut(remove_pauses>0.35 s) + transform(scale=[1, 1.15], center=track(face), ease='hold') on every
             second piece + subtitle(style='bold', karaoke=True) + duck(music, under=voice) −15 dB;
             cutaways over the voice every 3–8 s.
  narrator: hold from the entry into the frame until the exit; reveal on a wide source —
            transform(shift=[[0, 0], [±0.3, 0]], t=[t0−1.2, t0], ease='inOutQuad').
  lunge: the peak of the face growth goes on a downbeat; on a static shot boost it with transform(scale=[1, 1.2],
         center=track(face), t=[beat−0.3, beat], ease='outCubic') + sfx('whoosh', at=beat−0.3) + sfx('impact', at=beat).
  story break: duck(ambience+music, −20 dB, t=[t0, t0+0.4]) at the moment of the turn to camera.
gen_hint: <character> stops what they are doing, turns and looks straight into the camera lens and speaks directly to the viewer, eye contact held, frontal medium close-up centered (or wide shot with the narrator standing at the edge of the scene, presenting it with an open hand), static camera, natural light, breaking the fourth wall
commands: ["start the video with the line he says straight to camera", "find all the bits where people look into the lens and build a hook from them", "insert a direct address to the viewer between #3 and #4", "on the drop, have the singer lean toward the camera", "at the end — a call to action to camera with subtitles"]
related: [address.aside, pov.dialogue, frame.interview, address.lens_touch, address.frame_break, cut.jump, zoom.punch, type.subtitles, look.news, pov.object]
evidence: {examples: 25, sources: 15, measured: "YuNet on all frames: frontal in ≥60 % of frames in 17 of 25 (nose offset ≤0.15 of the interpupillary distance), three-quarter 0.15–0.3 with eyes on the lens in the rest (gaze judged visually on 340–1024 px frames); face 0.08–0.71 of the height (close-up 8, medium 8, wide 9); face center 0.46–0.53 in 14, narrator at the edge 0.14–0.15/0.74–0.77 in 5; turn to the lens 0.21–0.32 s; lunge — face ×1.2–2.3 in 0.36–0.9 s with the background at ×1.00–1.02 (5 cases); ed_motion: static during the contact 16 of 25, push-in ×1.22–2.03 over 0.5–3.5 s (5), pans to the narrator 15–49 % over 0.84–1.8 s; 32 s monologue — 7 pieces of 3–7 s; speech in 13 of 25; general fourth-wall section: 15 of 32 examples are this move (8 match the section, 7 new, 5 of them the beckoning host with push-ins ×1.29–1.31 in 0.2–0.5 s)", confidence: high}
