id: address.frame_break
family: address
group: editing
level: C
aliases: [character breaks the frame, character touches the frame, breaking out of the frame, out of bounds, OOB effect, pop-out, frame break, breaking the frame, live split screen, character moves the split, climb out of the panel, push the frame apart, rip the frame off]
what: "the borders of the edit become things to touch: bars pried apart, a divider line shoved aside, an image that tears like paper, a frame edge used as a ramp"
frames: |
  1. The frame is visible in advance: a split of 2–3 panels with lines 1–2 % of the width (white ≈2 %, black
     1–1.2 %), vertical or slanted ±4–20° (with three panels the slants are mirrored: ≈+18° and −16°, the middle
     panel is a trapezoid); or letterbox or pillarbox bars with a light trim ≈1 % of the height; or an ordinary
     full frame whose edge will become a "sheet".
  2. The character notices the frame: looks at the edge for 0.5–1 s (13–25 frames @25 fps), raises a hand, winds up,
     reaches for the line.
  3. Contact — the frame reacts exactly at the peak of the gesture (±1 frame), through one of these mechanisms:
     - crossing the line: a hand, a gun barrel, a fist or the whole body enters the neighboring panel and is drawn
       over the divider (the line is broken along the silhouette) for 0.4–0.6 s; the object often flies toward the
       lens and grows;
     - push: the divider shifts with a punch, a throw or a step — 0.5–4.3 % of the width per frame @25 fps
       (0.12–1.1 widths per second), e.g. 0.51 → 0.22 of the width in 0.25 s (6 frames), then holds for 1–2 s;
     - merge: the divider slides off the edge in 0.15–0.5 s (4–12 frames), the panels become one frame — characters
       from different panels end up in the same space;
     - spreading: the hands press against the pillarbox edges, the window widens linearly 71 → 92 % of the width
       in 2.1 s (52 frames), symmetrically, ≈5 % of the width per side per second;
     - snap: bars of 10–11 % slide in at the top and bottom in 0.35 s (9 frames), the woman looks at the top edge
       for ≈0.9 s, a finger snap — the bars vanish in 2 frames;
     - ripping the picture: the new shot is pulled down from the top like a blind — 0 → 45 % of the height in 0.2 s
       (5 frames), then a cut; or the character bursts through the picture as if through paper — a ragged wedge from
       the top edge, area 4 → 84 % in 0.6 s (15 frames), accelerating; or a finger at the edge swipes the frame like
       a feed (the border reaches the middle in 7 frames, a 0.5 s pause, finished off in 3 frames);
     - grab from the neighboring panel: a hand crosses the invisible seam of the split, grows toward the lens, grabs
       a car — back in their own panel the character already holds it as a toy; the whole gag ≈1.3–1.5 s;
     - the edge as a surface (animation): a hand-drawn skater rides around the whole perimeter of the frame in 1.9 s
       (48 frames), feet toward the edge, turning 90° at every corner.
  4. Landing: the new layout or the full frame holds for 1 s or more; the character's reaction (a smirk, a look into
     the camera) is the payoff of the gag.
variants:
  - crossing the split line — a weapon, hand or body over the divider, often across three panels with the same gesture (5 of 16)
  - divider as a wall — punches, throws and steps push it, the panels "breathe" over the course of a fight or a walk (5 of 16)
  - merging panels — the line goes off past the edge, the characters meet in one frame (3 of 16)
  - grabbing an object from the neighboring panel through the invisible seam, the object becomes a toy (1 of 16)
  - spreading or opening the bars — with the hands or a finger snap (2 of 16)
  - ripping off, pulling down, swiping away the picture — a blind, bursting through as if through paper, a finger at the edge (3 of 16; finger swiping in detail — gfx.touch_gesture)
  - the frame edge as a ramp for a hand-drawn character (1 of 16)
status: hybrid
fallback: |
  Needs a shot with a clear gesture toward the frame edge (a push, a punch, an outstretched hand, a swing, a snap,
  arms spread apart) — search the source footage with hand tracking: a hand moves toward the edge or toward the panel
  center faster than 3 % of the frame per frame. With a gesture, the code draws the frame (split, bars, blind, ragged
  edge) and drives it by the hand; for crossing the line — a person mask (mediapipe or remove_background) so the hand
  lies over the divider. No gesture — shoot a "reaching for the edge" take on a plain background or generate a shot
  with consent; without a gesture only the plain layout.split_screen and fx.letterbox remain.
params:
  panels: 2–3; line 1–2 % of the width (white ≈2 %, black 1–1.2 %); slant 0° or ±4–20°, mirrored with three panels
  divider_speed: 0.5–4.3 % of the width per frame @25 fps (0.12–1.1 widths/s), starts at the peak of a punch or step, outCubic; hold 1–2 s
  merge: the line goes off the edge in 0.15–0.5 s (4–12 frames @25 fps), inCubic
  crossing: the object over the line for 0.4–0.6 s (10–15 frames), the line is broken along the object mask, no feathering
  grab_gag: reaches for 0.55 s (14 frames) → grabs in 2 frames → pulls back in 0.55 s; in the hand — a scaled-down copy of the object (a toy or a cut-out object)
  aspect_push: window 71 → 92 % of the width in 2.1 s (52 frames), linear, symmetric; the window edges follow the hands (≈)
  aspect_snap: bars 0 → 10–11 % H in 0.35 s (9 frames), hold ≈0.9 s (22 frames), opening in 2 frames on the snap
  bar_edge: a light 1 % H trim along the inner edge of the bars — makes the frame feel "tangible"
  pull_down: blind 0 → 45 % of the height in 0.2 s (5 frames), then a cut
  tear: a ragged wedge from the edge, area 4 → 84 % in 0.6 s (15 frames), inExpo; the character of the new shot is over the torn edge
  edge_ride: a lap of the perimeter in 1.9 s (48 frames), the sprite oriented along the edge normal
  sync: the frame change starts on the frame of the gesture peak ±1 frame; a lag of more than 2 frames breaks the illusion
when: |
  Hook and intros: introducing characters in comic-book style panels where every gesture moves the frame; action and
  fights — the divider gets hit on the downbeats; in-world transitions (blind, burst-through, spreading) — on the drop or
  on a change of track section; UGC and comedy — "pulled an object out of the next frame", "spread the screen apart",
  "opened the bars with a snap"; ending — the panels merge when the characters meet. Gesture transitions — 1–2 per
  video; a panel sequence reacting to every beat — 5–15 s.
avoid: |
  The frame reacting more than 2 frames before or after the gesture. No mask — the hand "slips" under the divider. A
  small or distant character — the gesture doesn't read. Three vertical panels in 9:16 are too narrow (split horizontally).
  Rip transitions back to back get stale. Dramatic and calm delivery — frame tricks break the immersion.
sfx: |
  Divider push — a short whoosh and a hit at the peak; panel merge — a dull thud or a "clap" as the line disappears;
  snap on the bars — a finger snap or a "pop"; blind — the rattle of a roller blind; burst-through — tearing paper;
  swipe — a soft UI tick; object grab — a "swoosh" there and a "pop" in the hand; edge ramp — the rustle of wheels.
genres: {ugc: allowed, viral: allowed, fanedit: allowed, teaser: allowed, clips: allowed, sport: allowed, product: allowed, explainer: allowed, fashion: allowed, drama: forbidden, calm: forbidden}
detect: |
  The frame is visible and changes in time with the character's action: a custom tracker of straight seams across the
  full height (coverage ≥ 0.95, slant up to ±25°) — the seam position shifts by 0.5–4.3 % of the width per frame @25 fps
  as the person moves toward it (pose: a hand or the torso within 5 % of the width from the seam); for 0.4–0.6 s the
  seam is broken by a silhouette (crossing the line); the seam leaves past the edge in 0.15–0.5 s, after which there are
  no seams (merge). ed_motion: the bars field changes while the camera is static and the hands are at the window edges
  (spreading), or disappears in ≤ 2 frames at the peak of a hand movement (snap); a "cut" right after the edge pulled by
  the character's hand has covered 45 % of the height (blind); a growing area of the new shot with a ragged edge from
  the border where the person bursts through (burst-through).
  Distinctions: layout.split_screen and fx.letterbox — the frame moves by itself, without the character's gesture;
  gfx.touch_gesture — a hand controls the scene with a phone gesture rather than grabbing the frame edge; trans.wipe —
  the wipe comes from an object passing the lens; address.lens_touch — the character touches the lens (the glass),
  not the frame.
engine: |
  panels: split_screen(layout='2v'|'3v', angles=[18, -16], gutter=0.012, gutter_color='#000'|'#fff')
  push: divider_follow(divider=i, driver=track(person:wrist|torso).x, gain=1.0, max_speed=0.043, ease='outCubic',
        t=[peak, peak+0.25]) — new primitive: the divider follows a tracking point
  crossing the line: composite(layers=[panels, cutout(mask('hf_remove_background'|'mediapipe_person'), panel=i)],
          blend='normal', t=[t0, t0+0.5]) — the cut-out character over the dividers
  merge: divider_follow(divider=i, to='offscreen', dur=0.3, ease='inCubic') → full frame of the panel
  spreading: windowbox(scale=[0.71, 0.92], aspect='native', driver=track(wrists).dx, t=[t0, t0+2.1], ease='linear')
  snap: letterbox(ratio=[1.78, 2.3], t=[t0, t0+0.35], ease='outCubic') + bar_edge(color='#fff', px=0.01H)
        + letterbox(ratio=[2.3, 1.78], t=[snap, snap+0.08])
  blind, burst-through: transition(kind='wipe(shape="blind"|"tear")', dur=0.2|0.6, params={driver: track(hand), edge: 'ragged'})
          + cutout(hero, over the torn edge)
  grab: composite(hand cutout across seam) + object_cutout(scale=[1, ≈0.2]) — the object moves into the character's hand
  edge ramp: sprite_path(path='frame_perimeter', dur=1.9, orient='edge_normal') — new primitive for graphics
  + sfx('whoosh', at=peak, align='attack') + sfx('impact', at=peak+0.25)
gen_hint: comic-book style split screen with three slanted panels divided by thin black lines, a character in the middle panel swings his fist toward the left panel and his arm breaks out over the divider line into the neighbouring panel, the divider shifts with the punch, cinematic warm color, static camera
commands: ["have the character push the divider out on the punch so the panels merge into one frame", "three slanted panels, and the gun pokes out over the line on the drop", "at the start the character spreads the black bars apart with his hands", "transition: he bursts through the frame as if through paper"]
related: [layout.split_screen, fx.letterbox, gfx.touch_gesture, trans.wipe, layout.windowbox, address.direct, address.lens_touch]
evidence: {examples: 16, sources: 9, measured: "custom seam tracker over 16 sheets (full frame rate in 5): lines 1–2 % of the width, slant 0–20° (with three panels +18°/−16° and +19°/−15°); divider shift 0.6–5.4 % per frame @20 fps (0.51→0.22 in 0.25 s; 0.67→0.94 in 0.75 s; 0.98→0.58 in 1.5 s), merge in 0.15–0.5 s; crossing the line 0.4–0.6 s; pillarbox 71→92 % in 2.07 s, linear; letterbox 0→10.5 % in 0.35 s, holds 0.88 s, opens in 2 frames on the snap; blind 0→45 % in 0.2 s; burst-through 4→84 % of the area in 0.6 s; feed swipe 96→43 % in 7 frames, pause 0.5 s, finish in 3 frames; perimeter lap in 1.92 s; 8 of 16 examples come from one source with a panel layout", confidence: medium}
---
id: address.lens_touch
family: address
group: editing
level: C
aliases: [character touches the lens, camera as an object, hand into the lens, push the camera away, hit the camera, cover the lens with a palm, drops on the lens, dirt on the lens, drawing on the lens glass, hand over lens, grab the camera, kick the camera, lens splash, cracked lens, rain on lens, camera knock]
what: the camera stops being invisible — the character reaches for it, covers it with a palm, grabs, pushes away, kicks or carries it off, and the world leaves marks on the lens glass (splashes, dirt, drops, a crack, a drawing); the viewer feels they are standing right inside the scene
frames: |
  1. Addressee: the character sees the camera — looks into the lens, walks up or leans toward it; the camera is static
     or hangs low, often shooting from below, wide-angle, with the face or body filling 40–90 % of the frame.
  2. Contact (17 of 21) — one of these mechanisms:
     - a palm or a foot covers the lens: the hand travels to the camera in 0.25–0.5 s, the frame stays covered and
       smeared for another 0.25–0.4 s (sharpness ≤ 0.35 of the shot baseline, brightness drops to 20–40 or drowns in
       skin tone), and inside this window comes a cut to a new scene or to black; a sole point-blank — 0.32 s to a
       black frame;
     - grabs and carries off: the camera is picked up, spun (spin 60–80° per frame), shaken (±10–30° in 0.2–0.4 s)
       or carried — 0.4–0.85 s of a dark blurred frame, then a new view;
     - pushes or hits: the camera breaks into a smear of 0.3–0.65 s (6–16 frames @25 fps) — a whip pan to a new
       character in the same room or a cut to another place hidden in the smear;
     - the camera flies: thrown or knocked down, it tumbles for 0.7–1.8 s with rotational motion blur and lands — the
       world is turned 90° or 180°, the frame holds for 1.8–2.4 s, the character walks up to or looks at the "fallen" camera.
  3. Mark on the glass (7 of 21): splashes of mud or water fly into the lens in 0.25 s and stay as spots — in the next
     shot too; drops 5–12 % of the frame width (≈) as soft circles; a crack — 2–4 thin dark lines across the whole
     frame after a hit, the frame holds for 2.5 s; a smudge in the corner stays put while the scene shifts by 19 % of
     the width; a marker drawing right on the glass grows in ≈1 s; flare rings from a lamp.
  4. Resolution: a cut hidden in the cover — the new scene emerges from the smear or defocus in 0.2–0.7 s;
     or the character "fixes" the lens — wipes the dirt off with a cloth in 0.55 s; or the hit breaks the picture
     off into interference or black.
variants:
  - palm covers the lens → cut: the new scene emerges from defocus in 0.5–0.7 s, sometimes with a slight push-in ×1.2
  - grabs the camera → new place: the same character in another location, the cut inside the grab
  - pushes away or hits → whip smear: into the same room to a new character or to another city with smeared lights
  - grabs the camera with both hands and spins it → spin transition
  - point-blank kick with the sole → black frame
  - the camera is picked up off the floor and carried away: the frame drowns in skin and darkness, then shows what it was brought up to
  - camera as a projectile or camera on a toy: flies, tumbles and lands on its side — the world at 90°, the character looks down from above
  - holds the camera themselves: fingers in the frame edges (≈ 8–18 % of the width on each side), the character shakes and twists the camera near the face
  - splash and wipe across a cut: in shot A mud flies into the lens, in shot B another character wipes it off with a cloth
  - drops, tears, rain on the glass: soft circles in the upper part of the frame build up over 0.5–1 s
  - hit → crack: after the shake the frame freezes with cracks across the whole glass
  - hit → signal failure: the picture breaks up into horizontal bands and noise ≥ 0.64 s
  - drawing on the glass: the character draws with a marker "on the lens", the drawing is fixed relative to the frame
  - lens smudges and flares as texture: a smudge in the corner, ring flares from lamps
status: footage
fallback: |
  The contact (palm, grab, push, kick) must be in the source footage: code looks for the moment when, within 4–12 frames
  @25 fps, the share of a blurred dark or skin-toned area grows to 85–100 % of the frame (sharpness ≤ 0.35 of the shot
  baseline, brightness ≤ 40 or skin), often after a look into the lens — that is where the cut goes; no such shot — shoot
  a "hand into the camera" take or generate one with the user's consent. Code can do this on any shot: push and throw —
  a whip smear or a spin of 0.3–0.65 s, fall — a 90° frame rotation with a bounce; marks on the glass — an overlay of
  drops, dirt, a crack, a drawing or a ring flare (fixed relative to the frame); breakage — interference and black.
params:
  reach: a hand or foot to the lens in 0.25–0.5 s (6–12 frames @25 fps), face or body filling 40–90 % of the frame
  cover: 85–100 % of the frame covered for 0.25–0.4 s (6–10 frames @25 fps), sharpness ≤ 0.35 of the shot baseline, brightness ≤ 40 or skin tone; the cut in the middle of the window
  reveal: the new scene out of defocus or smear in 0.2–0.7 s (5–18 frames @25 fps), optionally a push-in ×1.06–1.22 ease-out
  push_whip: smear after a push or hit 0.3–0.65 s (8–16 frames @25 fps), direction — away from the hand
  grab_spin: rotation 60–80° per frame, 0.25–0.35 s
  shake_in_hands: roll ±10–30° in 0.2–0.4 s, shake 5 % of the frame per frame, fingers at the edges 8–18 % of the width
  kick: the sole fills the frame in 8 frames @25 fps (0.32 s), then black ≥ 3 frames
  carry: a dark blurred frame for 0.4–0.85 s between the grab and the new view
  throw_fall: tumble 0.7–1.8 s with rotational motion blur → frame at 90° or 180°, hold 1.8–2.4 s
  splash: splashes 0.25 s (5–6 frames) to the peak, the spots stay 2+ s and carry across the cut; translucency ≈ 30–50 %
  droplets: 3–8 soft circles 5–12 % of the width (≈), upper half of the frame, build up over 0.5–1 s
  crack: 2–4 thin dark lines across the whole frame (≈ 1 % of the area), after a hit; hold 2–2.5 s
  wipe: a cloth or palm covers 50–70 % of the frame for 0.5–0.6 s, after that the frame is cleaner
  signal_break: horizontal bands and noise 0.6+ s, mean brightness 55 → 20–30 with flashes of bands
  drawing: a dark line 0.3–0.5 % of the width, the drawing grows over ≈1 s, fixed relative to the frame
when: |
  Hook (first 1–2 s: the character grabs the camera and carries the viewer into the scene), a transition between
  locations or looks within one scene (palm, grab, hit — the cut inside the cover on a downbeat), ending (a kick or a
  palm into the lens — black and the end of the video), comedy gag (the character pushes the camera away, wipes the
  lens, cries streams of tears onto the camera), action and sport (mud, splashes, water fly into the lens). 1–2 contacts
  per video; marks on the glass can stay for the whole episode.
avoid: a contact without an addressee — a hand to the camera with no look and no reason reads as an accidental wipe; a cut before full cover (it shows) or after it (the grab is lost); more than 2–3 contacts in a row; marks on the glass that move with the scene instead of staying put; drops and cracks over titles and faces; a dramatic or calm tone without a reason
sfx: |
  Lens touch — a dull "thud" or a palm rustle exactly on the cover; grab — a rustle and a "swoosh" on the smear;
  push or hit — a whoosh and a hit; kick — a heavy hit and silence on the black; fall — a knock and the rattle of the
  camera body; splashes — a splash or a slap of mud; crack — glass crunching; interference — crackle and the sound
  cutting out; wipe — the squeak of a cloth on glass; drawing — the squeak of a marker.
genres: {ugc: signature, viral: signature, fanedit: allowed, clips: allowed, phonk: allowed, sport: allowed, teaser: allowed, travel: allowed, product: allowed, fashion: allowed, motivation: allowed, explainer: allowed, epic: allowed, drama: allowed, calm: forbidden}
detect: |
  Custom frame-by-frame measurement: within 4–12 frames @25 fps sharpness drops to ≤ 0.35 of the shot baseline,
  brightness to ≤ 40 (or skin tone floods the frame), a large object grows from the center or an edge; before that the
  face looks into the lens (as in address.direct). ed_motion: in the cover window — false cuts in a row (cuts every
  other frame) and/or black frames; after it — ROTATE 60–80°/frame (spin), a long SHIFT with smear (push), ROTATE 90°
  with no return (fall).
  Marks on the glass: an area that stays put (shift < 1 % of the width) while the scene shifts by 5+ %; thin dark
  lines across the whole frame after a hit (crack); soft circles 5–12 % of the width that appear within the shot (drops).
  Difference from trans.wipe: there an object passes the lens on its own (a passer-by, a column), here the character
  touches the camera on purpose. From address.direct: there the character only looks and talks into the lens without
  touching it. From address.frame_break: there the character touches the frame border (split, bars), not the glass.
  From pov.first_person: there the hands in frame are the viewer's hands, while here the character's hands reach
  toward the viewer or hold the camera as an object. From trans.whip: there the smear is an editing device with no
  cause in the frame, here it is caused by the character's hit or push.
engine: |
  lens_contact_cut(a, b, detect='cover', min_cover=0.85, sharp_max=0.35, cut='mid_cover', reveal='defocus',
                   reveal_dur=0.5, push=1.1) — new: finds the window where a palm or sole covers the lens in shot A
                   and cuts in its middle; shot B emerges from blur(kind='gaussian', amount 12→0) in 0.5 s.
  push_off: transition('whip', dur=0.4, params={dir: away from the hand}) | grab_spin: transition('spin', dur=0.3, angle=70);
  kick_to_black: cut(at=cover_peak) + fade(to='black', dur=0); throw_fall: transform(rotate=[0, 90], t=[t0, t0+0.8],
  ease='outBack') + shake(amp=0.03, freq=12, decay=6) + blur(kind='directional').
  lens_overlay(kind='droplets'|'dirt'|'crack'|'drawing'|'ring_flare', opacity=0.3–0.5, size=0.05–0.12, region,
               t, grow=0.25–1.0) — new: an "on the glass" layer, fixed relative to the frame, with background
               refraction under the drops (a slight displace) and defocus; it holds across cuts until lens_wipe(t, dur=0.55).
  signal_break: glitch.tv_noise(dur ≥ 0.6) after a hit; held_camera: destabilize(profile='handheld', amp=0.05,
  rot=±20) + overlay of hands at the edges (mask from the source).
  sfx('impact', at=cover_peak, align='attack'); sfx('whoosh', at=smear); sfx for the splashes and the crack — when
  the layer appears.
