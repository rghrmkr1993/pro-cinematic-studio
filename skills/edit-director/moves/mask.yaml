id: mask.silhouette_window
family: mask
group: effect
level: B
aliases: [masking, mask, silhouette window, window in a silhouette, cutout mask, track matte, matte, silhouette fill, silhouette cutout]
what: the silhouette of a person, face or object becomes a window — inside it another video, a texture or a color, outside it the original shot or a frozen photo; a surreal collage-style accent
frames: |
  1. The base is a still or almost still frame (45–94 % of the pixels do not change at all): an old B&W photo,
     a frozen shot, a white sheet. The mask is the outline of a head, a face, a whole figure or an animal with a hard edge,
     "as if cut with scissors" (feather 0–2 px).
  2. The window takes up 8–21 % of the frame (a face, a head) or the whole figure; inside, a life of its own goes on — a sunset with drifting
     clouds, a small glowing scene inside the head, paper cutouts. Motion only inside the window.
  3. Fill rhythm: a "boiling" collage texture changes every frame at 16–17 fps; flat color
     fills of silhouettes switch every 6–13 frames @50 fps (0.12–0.26 s = 3–6 frames @25 fps),
     neighboring figures offset by 2 frames, out of sync.
  4. Accent: at the cut the mask inverts (a black silhouette against a light sky ↔ white on black) or there is
     a push-in ×3 over 1.5 s into the next nested silhouette.
variants:
  - face window in an old photo: a B&W portrait, instead of the face — a color landscape or someone else's face, 8–21 % of the frame moves
  - scene inside the head: a dark profile on black, inside — a small glowing world
  - collage fill: the silhouette of an animal or a rider on white, inside — a new cutout of packaging or newspaper every frame
  - color silhouettes: people filled with flat acid colors with a pattern, the colors change to the rhythm every 0.12–0.26 s
  - silhouette matte: a person as a pure black silhouette against a light sky (30–39 % of the frame black), inverting at the cut to white on black
  - nested profiles: inside a profile, the next profile, a push-in ×3 over 1.52 s — an endless plunge
  - dark mask over the scene: a black foreground figure creeps in and hides part of the frame
  - foreground wipe: a person or a door jamb passes by the lens and "wipes" the frame into the next one
status: hybrid
fallback: mask — mediapipe (person/selfie/face) or hf_remove_background; old portraits for the collage — a search in the source footage or generation with consent; without segmentation — a window of a simple shape (a circle, an oval, a rectangle) in pure code
params:
  mask_source: person / face / object; frame-by-frame tracking; for a photo — one mask for the whole shot
  edge: hard 0–2 px (cutout) or a feather of 1–3 % of the frame (the dreamy variant)
  window_area: 8–25 % of the frame (a head, a face) or the whole figure
  inside: video with slow motion (clouds, lights, water, a city), a texture or a flat color
  outside: the original shot, a freeze or a B&W photo; outside, saturation and contrast are lower than in the window
  fill_cycle: 0.12–0.26 s per color (3–6 frames @25 fps); the "boiling" collage variant — a new texture every 1–2 frames at 12–17 fps
  palette_flat: "#00f0ff, #ff2bd6, #e01010, #1020ff + a pattern on top"
  invert: 1 frame on the cut or a downbeat
  nested_zoom: ×3 over 1.5 s (≈×1.05/frame), center — in the next silhouette
  duration: 1.5–10 s; hold the window ≥2 s so the eye reads both layers
when: intro and outro, "the subject's thoughts", a dream or a memory, a surreal music video, a fashion collage; color silhouettes — on the chorus or drop, switching on 1/8; inversion — on a downbeat. Once or twice per video
avoid: a ragged or jittery mask — gives the fake away; a small figure (<10 % of the frame height); two saturated layers of equal brightness — a mess; flickering fills for longer than 4 s in a row are tiring
sfx: the window appearing — a soft swell or reverse_whoosh; fill changes — a click in time; inversion — impact; collage — paper rustle
genres: {fashion: allowed, fanedit: allowed, viral: allowed, teaser: allowed, drama: allowed, travel: allowed, calm: allowed, product: allowed, motivation: allowed, explainer: allowed}
detect: |
  Temporal variance map: ≥45 % of the frame is static, a compact area with a sharp boundary moves,
  shaped like a head, a face or a figure. Fill variant: person-shaped areas of a uniform saturated color
  (saturation >70 %), the color changes every 3–13 frames. Matte variant: ≥60 % of the pixels almost black
  or white, saturation ≈0.
  ed_motion: most often "no significant global motion"; the nested variant — ZOOM-IN ×3 almost linear, center near the frame edge.
  Unlike mask.double_exposure: there the layers are semi-transparent and blended, here the window is opaque.
  Unlike mask.bg_replace: there the person stays real and the background changes.
  Unlike a split screen: the boundaries are silhouettes, not straight lines.
engine: |
  mask(method='mediapipe_person'|'face'|'hf_remove_background', feather=0.005)
  + composite(layers=[outside(freeze|bw), inside(clip|texture|solid), mask], blend='normal')
  + fill_cycle(colors=['#00f0ff','#ff2bd6','#e01010','#1020ff'], every='1/8', phase_offset=2)  # color silhouettes
  + mask(invert=True, t=[beat, beat+0.04])  # inversion on the beat
  + transform(scale=[1, 3], center=track(next_silhouette), t=[t0, t0+1.5], ease='linear')  # nested profiles
gen_hint: surreal paper collage, silhouette of <subject> cut out with clean hard edges, inside the silhouette a moving <scene>, outside a still black-and-white photograph, minimal background
commands: ["fill the subject's silhouette with a sunset", "turn the head in #3 into a window to another world", "color silhouettes on the chorus, switching on every eighth", "cut the face out of the photo and show video #5 inside it"]
related: [mask.double_exposure, mask.bg_replace, mask.window_replace, trans.double_exposure, zoom.infinite]
evidence: {examples: 10, sources: 10, measured: "window 8–21 % of the frame, static part 45–94 %; color fills change every 6–13 frames @50 fps (0.12–0.26 s), neighboring figures offset by 2 frames; collage texture — every frame at 16.7 fps; matte: 30–39 % black, inversion at the cut; nested push-in ×3.02 over 1.52 s, center (0.94, 0.42)", confidence: medium}
