id: mask.bg_replace
family: mask
group: effect
level: B
aliases: [background replacement, chroma key, green screen, keying, background removal]
what: the subject is cut out of their shot and placed on a different background — a landscape, an interior, outer space, a rushing road; the background can be swapped to the rhythm, and a "cheap" chroma key can be played as a deliberate device
frames: |
  1. The subject — the same take and the same pose, no camera movement; takes up 60–90 % of the frame height
     (full-length or waist-up), stands in one spot for the whole episode.
  2. The background is replaced: a still picture (the sky, an interior, a plane by the airstairs) or a moving plate —
     for "driving", sideways blur streaks or a road rushing toward the camera; the subject stays still meanwhile.
  3. Background swaps to the rhythm: every 8–10 frames @20 fps (0.4–0.5 s ≈ a beat at 120–150 BPM), the subject's pose
     continues through the cut; the last background holds longer — up to 1.5 s.
  4. A deliberately "low-budget" variant: first a green screen with a polygonal cutout is visible, an eyedropper cursor
     clicks the green — and the background turns into a gray-and-white transparency checkerboard; then backgrounds
     with visible watermarks and a hand cursor are slipped under the subject, with no shadows and no light matching.
variants:
  - honest replacement: a clean mask, light and perspective matched — the subject "ends up" somewhere else
  - a background on every beat: the same dance on 4–5 different backgrounds in a row (interiors, streets), 0.4–0.5 s each
  - driving on a plate: the subject in a car, behind them sideways blur streaks or a rushing road
  - sky and space: the subject on clouds, then against a planet, with graphic stickers on top
  - meta chroma key: a green screen, an eyedropper cursor, a transparency checkerboard, a photo plate smaller than the frame floating on the checkerboard
status: hybrid
fallback: mask — mediapipe selfie or hf_remove_background (hair and motion blur — only the latter); a green screen — chroma key; backgrounds — the user's clips, a search in the source footage or generation of empty backgrounds with consent
params:
  mask: hf_remove_background or chroma(#00b140 ± 15 % hue), feather 1–2 px, green spill suppression
  subject: 60–90 % of the frame height, the position unchanged as backgrounds swap
  bg_swap: every 0.4–0.5 s (10–12 frames @25 fps) on the beat; the last background 1.5–2 s
  plate_drive: the plate shifts by 3–8 % of the frame width per frame + directional blur of 2–5 % of the width; a slight shake of the subject of 0.3–1 %
  match: for an honest replacement — matching horizon height (±5 % of the frame), light direction and grain; a shadow under the feet at 20–40 % opacity
  lofi_extras: a checkerboard with cells of 1–1.5 % of the width (#cccccc/#ffffff), a cursor of 3–4 % of the height, a polygonal cutout, an unbranded watermark at 30–50 % opacity
when: memes and humor (a deliberately cheap chroma key), "me everywhere" — a dance through different places on every beat, travel daydreams, an explainer presenter against a screenshot or a chart; background swaps — on the beat, speed up to 1/8 on the drop
avoid: hair and fast hands with a rough mask — the edges "boil"; mismatched light when realism is needed; background swaps off the rhythm; more than 8–10 backgrounds in a row without a pause
sfx: on every background swap — a click or a short swish on the beat; in the meta variant — a mouse-click sound on the eyedropper
genres: {viral: signature, ugc: signature, fanedit: allowed, explainer: allowed, travel: allowed, fashion: allowed, motivation: allowed, teaser: allowed, epic: allowed, product: allowed}
detect: |
  The subject's pose and position are continuous, although every 8–12 frames the surroundings behind them are swapped by a cut.
  Compositing cues: a 1–3 px halo (light or green) along the outline, no shadow at the feet, the light on the subject does not match the background.
  ed_motion: cuts at equal intervals with an unchanged medium shot; when "driving" the background shifts but the subject does not (overlay-mask ≥0.15, high nonrigid).
  Meta cues: a checkerboard of two gray tones, an arrow or eyedropper cursor, watermarks on the background.
  Unlike mask.silhouette_window: there the figure is a window into another picture; here the figure is real and the surroundings change.
  Unlike changing locations with real footage: there the angle and the light on the subject change.
engine: |
  mask(method='hf_remove_background'|'mediapipe_selfie'|'chroma(key=#00b140, tol=0.15)', feather=0.002)
  + composite(layers=[bg_i, shadow(opacity=0.3), subject], blend='normal'), bg_i changes via beat_sync(event='bg_swap', grid='1/4')
  + transform(shift=[[0,0],[-0.05*D,0]], t=[t0,t0+D], layer='bg') + blur(kind='directional', amount=0.03, layer='bg')  # driving
  Meta chroma key: shape(kind='checkerboard', cell=0.012) instead of the background + shape(kind='cursor_eyedropper', path=[...], t=[t0,t0+0.5]) + sfx('click', at=t0+0.5)
gen_hint: <subject> performing in front of an evenly lit green screen, full body, static locked-off camera, no shadows on the backdrop; separate clean background plate of <location>, eye-level, static, no people
commands: ["cut me out and put me on background #7", "swap the background behind the subject on every beat in the chorus", "a cheap chroma-key meme with a checkerboard and a cursor", "put the subject in a car over a rushing road"]
related: [mask.silhouette_window, mask.double_exposure, mask.window_replace, trans.set_change, cut.quick]
evidence: {examples: 9, sources: 1, measured: "background swap every 8–10 frames @20 fps (0.4–0.5 s), the last background up to 1.5 s; the subject 60–90 % of the frame height, the camera static; \"driving\" plates — 3 of 9; watermarks on the background — 4 of 9; transparency checkerboard — 2 of 9; cursors — 2 of 9", confidence: medium}
