id: mask.double_exposure
family: mask
group: effect
level: B
aliases: [double exposure, double exposure in a silhouette, multiple exposure, silhouette double exposure, portrait with a landscape inside]
what: the silhouette of a person or an animal on a light background with a second shot showing through inside it — a forest, a city, a road, foliage; the facial features remain semi-transparent — an image of the "inner world"
frames: |
  1. The background is light and empty: white or cream, L 190–247 (≈RGB 247/247/247 or 240/228/201) — 70–90 % of the frame.
     The silhouette — a head in profile, a figure or an animal — takes up 9–28 % of the frame, the edge is soft, with strands of hair and fur.
  2. Inside the silhouette — a second shot blended with "lighten": where the portrait is dark, the landscape shows; an eye, the line
     of the nose, a beard, hair, the texture of fur remain 20–40 % visible. The horizon line of the inner scene
     often runs along the neck or shoulders.
  3. Little motion: the inner layer drifts slowly or a tiny figure walks across it; 1–17 % of the pixels
     change; the shot holds for 2.7–10.6 s.
  4. Intro and outro: a full-screen scene shrinks into a profile (×0.79 over 1.75 s) and a white background floods in around it;
     or the other way round — the silhouette dissolves in and the frame evenly darkens over ≈4 s (mean brightness 230 → 14), leaving only
     the inner scene (a night city) — a transition onward.
variants:
  - animal landscape: a bear, a whale on white, inside — mountains with a wanderer or a forest with light rays
  - dream profile: a woman's or man's profile, inside — a road, a desert or a forest with a small person
  - foliage in a figure: the whole figure in warm sepia filled with branches and leaves, the face reads by its edge
  - body as a window: the face stays normal, while the shoulders and chest are filled with a sunset
  - shrink-in intro: the scene shrinks into a profile, a white background emerges around it
  - outro into the scene: the background darkens to black, the inner city remains — a smooth transition to the next shot
status: hybrid
fallback: a portrait on a white background is blended without a mask (screen); for ordinary shots — mediapipe selfie or hf_remove_background to make the background white; suitable portraits and landscapes — a search in the source footage or generation with consent
params:
  background: "#f7f7f7 (neutral) or #f0e4c9 (warm sepia), L 190–247"
  silhouette: 10–30 % of the frame (full-length, an animal) or 40–70 % (a large profile); feather 1–3 px, keep the strands
  portrait: B&W or sepia, contrast +20–30 %, deep shadows — the landscape will show up in them
  blend: screen or lighten (the landscape over the portrait), facial features 20–40 % visible; limit with the silhouette mask
  inner: a landscape with a clear horizon line, the horizon at the level of the neck/shoulders; a drift of 0.5–2 % of the frame per second or a small walking figure
  grade: monochrome or warm sepia, saturation 15–35 %
  intro: scene scale ×1.25 → ×1 (shrinking into the silhouette) over 1.5–2 s, ease linear
  outro: the frame goes white → black over 3–4 s linearly, the inner scene remains
  duration: 3–10 s (75–250 frames @25 fps)
when: intro and titles, "the subject's thoughts and dreams", the bond between a person and a place (travel, a hometown), memory and nostalgia, a calm opening before things build up; hold it long, under slow, drawn-out music or a pause before the drop. Once per video
avoid: a dark or busy portrait background without a mask — the effect turns to mush; a landscape without a clear horizon and shape; quick cutting; two bright layers of equal density (it is unclear what matters most)
sfx: soft ambience, wind or nature from inside the picture, a swell on the intro; on the outro to black — a fading hum
genres: {travel: allowed, motivation: allowed, drama: allowed, calm: allowed, epic: allowed, teaser: allowed, fashion: allowed, fanedit: allowed}
detect: |
  A light empty background L>190 takes up 70–90 % of the frame; a compact dark silhouette inside which
  a second scene is visible (a horizon line, trees, city lights), while the features of the portrait show through;
  the edge of the silhouette is soft, not cut out. Little motion (1–17 % of the pixels), duration 3–10 s.
  ed_motion: "no significant global motion" or a slow ZOOM-OUT ×0.8 on the intro; on the outro — a series of black frames with the inner scene unchanged.
  Unlike mask.silhouette_window: there the window is opaque with a hard edge, the features of the portrait are not visible.
  Unlike trans.double_exposure: there two full shots are overlaid entirely, without a silhouette or a light background.
engine: |
  mask(method='mediapipe_selfie'|'hf_remove_background', feather=0.003) → portrait background = solid('#f7f7f7')
  + color(params={desaturate: 1.0, contrast: 1.25}, layer='portrait')
  + composite(layers=[portrait, inner(clip, drift=0.01/s)], blend='screen', mask=silhouette, inner_opacity=0.8)
  + color(lut='sepia_warm' | 'mono')
  Intro: transform(scale=[1.25, 1], t=[t0, t0+1.75], ease='linear', layer='inner') + fade of the background from transparent to white
  Outro: color(params={bg: '#f7f7f7' → '#000000'}, t=[t1, t1+3.5]) — the inner layer remains
gen_hint: silhouette double exposure, side profile of <person> on a clean white background blended with <landscape>, the landscape visible inside the head, facial features softly visible, minimal, monochrome or warm sepia
commands: ["double exposure: the subject's profile with a forest inside", "intro — a silhouette with a city inside, then go into the city", "fill the figure with foliage in sepia", "make a bear with mountains inside for the title sequence"]
related: [mask.silhouette_window, trans.double_exposure, mask.bg_replace, fx.xray]
evidence: {examples: 7, sources: 5, measured: "background L 192–255 in all 7 (in two — only at the start or the end), warm cream in 3; silhouette 9–28 % of the frame; motion 1–17 % of the pixels in static shots; shots of 1.4–10.6 s; shrink-in intro ×0.79 over 1.75 s (brightness 115→160); outro — mean brightness 230→14 linearly over 4 s", confidence: medium}
