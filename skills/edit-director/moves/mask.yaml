id: mask.window_replace
family: mask
group: effect
level: C
aliases: [window replacement, window comp, view out the window, window into another time, window mask, screen replacement, window cells, window strips]
what: ready-made "windows" inside the frame — glass, grid cells, horizontal strips — become masks for another video — time flies by outside the window, the cells of a fence fill up with pictures, strips join different shots by one shape
frames: |
  1. The base is a static camera and an almost static scene: a room with a window, a chain-link fence,
     a round object in the center. Outside the windows ≈1 % of the pixels change per frame.
  2. The mask is the geometry of the scene itself: the window glass (≈17 % of the frame, upper half), the diamonds of a mesh
     (0.7–1.2 % of the frame per cell), 3–5 horizontal strips ≈10–25 % of the frame high.
  3. The window has its own timeline: a sped-up street (in the window area 52 % of the pixels change every frame),
     light and passers-by race past, while the people in the room sit almost motionless; toward the end the sun flares in the window.
  4. The cells fill up one by one: a new sticker picture every 3–6 frames @14 fps (0.2–0.4 s),
     the stickers rotated 45° to match the grid, after 4 s 10+ cells are filled.
  5. Strips: each holds its own shot with a similar round object (a speaker, a bowl, a wheel, a steering wheel),
     the center of the object matches across all strips; the layout and content of the strips change every ≈1–3 frames — a stop-motion collage.
variants:
  - time outside the window: the interior is frozen, behind the glass a sped-up day, people and light rush past
  - grid cells: a fence or a grille as the layout, pictures are "pasted" into the diamonds one by one
  - strips of one shape: the frame is cut into horizontal strips, each with a different object of the same shape at the same point
status: hybrid
fallback: window — a four-corner (planar) track or a luma key on the glass; without a track — only with a static camera; a street time-lapse — a search in the source footage or generation with consent; strips and cells are drawn in code
params:
  window_mask: a quadrilateral on the corners of the glass or a luma key (the glass brighter than the interior), feather 1–2 px; takes up 10–25 % of the frame
  inside: a time-lapse ×20–100 or a different place; the window exposure 1–2 stops brighter than the interior
  room: a freeze or an almost static take; motion outside the window ≤1–2 % of the pixels
  grid: cell pitch 6–10 % of the width, 45° rotation, a sticker covering 85–100 % of a cell, a new one every 0.2–0.4 s (5–10 frames @25 fps) or on every beat
  strips: 3–5 strips 10–25 % of the frame high, content changes every 1–3 frames, the object center matches to within ±3 % of the frame
  duration: 1.5–5 s
when: the passage of time and waiting (outside the window day turns into night while the subject sits), a dream of escape, a "window into another city" in travel; cells on every beat — for lists and collages; strips of one shape — a product or a selection of objects in a music video
avoid: a moving camera without a track — the window will "float"; glass with reflections and people by the window overlapping the mask; the light outside the window contradicting the light in the room when the look is meant to be realistic
sfx: time outside the window — a swelling city hum or wind, a swoosh on the sun flare; cells — a pop or click for every sticker; strips — rapid shutter clicks
genres: {travel: allowed, drama: allowed, calm: allowed, fashion: allowed, product: allowed, fanedit: allowed, viral: allowed, teaser: allowed, explainer: allowed}
detect: |
  Temporal variance map: a compact zone with straight boundaries (a window, a cell, a strip) changes every frame,
  the rest of the frame is static (≤1–2 % of the pixels). Grid — small local changes of 0.7–1.2 % of the frame
  at a step of 3–6 frames, each time in a new cell. Strips — horizontal breaks across the full width,
  the object in the center keeps its outline as the texture changes.
  ed_motion: "no significant global motion", while the frame diff is high in one zone.
  Unlike mask.silhouette_window: the window is defined by the architecture or a grid, not by the subject's silhouette.
  Unlike a split screen: the windows are part of the filmed scene, not graphic panels on top.
engine: |
  mask(method='quad', target=track(quad:window), feather=0.002) | mask(method='luma_key', thr=0.8, region=[0.2,0.05,0.6,0.5])
  + composite(layers=[room(freeze), inside(clip, speed=40)], blend='normal') + color(params={exposure: +1}, layer='inside')
  Cells: grid_cells(step=0.08, angle=45) + composite(cell_i ← image_i, t=beat_i, anim='pop 3 frames') + sfx('click', at=beat_i)
  Strips: split_screen(layout='hstrips', n=4, heights=[0.1,0.25]) + match(on='shape') on the object center + source changes every 0.04–0.12 s
gen_hint: static shot of a quiet room with a large window, people sitting still inside, outside the window a fast time-lapse of a busy street with shifting sunlight, locked-off camera
commands: ["let time fly by outside the window while we sit", "fill the fence cells with pictures on every beat", "cut the frame into strips with the round objects from #2–#6", "put the view from #9 into the window"]
related: [mask.silhouette_window, mask.bg_replace, time.timelapse, layout.split_screen, gfx.collage]
evidence: {examples: 3, sources: 3, measured: "window ≈17 % of the frame: in its area 52 % of the pixels change per frame, in the room 1 %, frame difference 6–12 vs 0.2–1.5 levels; cells 0.7–1.2 % of the frame, a new one every 3–6 frames @14.3 fps; strips 3–5 of them, changing every 1–3 frames @33 fps (≈)", confidence: low}
