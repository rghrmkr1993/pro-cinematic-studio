id: gfx.counter
family: gfx
group: graphics
level: B
aliases: [counter, count-up, rising numbers, rolling digits, infographics, infographic, animated stats, stat card, odometer, progress bar, bar chart, chart overlay]
what: counter and infographics — a number counts up to its total, slowing toward the end, bars grow from a common baseline, a chart line draws itself, a ring fills; the total lands exactly on a beat or on the spoken number word
frames: |
  1. Entrance (4–6 frames @25 fps / 5–7 @30 fps): the plate or the number appears with a "pop" ×0.9 → ×1.0 (outCubic) or slides up from below
     by 4 % H; the starting value (0 or the "before" value) holds for 2–4 frames before the count begins.
  2. Count 0.8–2.0 s (20–50 frames @25 fps / 24–60 @30 fps), typically 1.2 s. Default outCubic: half the total in the first
     ≈21 % of the time, the last 10 % of the value stretches over the last ≈46 % of the time; "slow settle" outExpo: half in ≈10 %,
     the last 10 % over the last ≈67 % (only from 1.5 s up). Digits are tabular (equal width), room for the final width
     is reserved so the number does not "wiggle"; the lowest digit changes every frame, the higher digits settle first.
  3. Landing: the last frame shows the exact total (outExpo never reaches 1 by itself, so substitute it); a ×1.10 pulse over 3 frames
     and back over 5 @25 fps (4 + 6 @30 fps, outBack), a color change to the accent, the unit or label "trickles in" (fade 4 frames
     @25 fps / 5 @30 fps). The landing goes on a downbeat or on the end of the spoken number word.
  4. Hold ≥ 1.2 s after the landing (+0.3 s per word of the label).
  5. Charts: bars grow from a common baseline over 0.5–0.8 s (outCubic) staggered by 3–5 frames @25 fps (4–6 @30 fps) or one per beat,
     the values above them count in sync; a line draws left to right over 1.0–1.6 s (inOutCubic), the dot at its end
     pulses; a ring fills from "12 o'clock" clockwise over 0.8–1.2 s (outCubic), the number in the center moves with the arc;
     a progress bar fills from the left over 0.8–1.5 s (outCubic), the percentage rides on the edge of the fill.
  6. Exit: fade 4–6 frames @25 fps (5–7 @30 fps) or together with the cut; charts shrink back over 6 frames @25 fps (7 @30 fps, inCubic).
variants:
  - big number — a single number in the center (+340 %, 12 500 ₽, 1.2M), a unit label under it; lands on a downbeat
  - before → after — the old number is struck through (a line over 6 frames), the new one counts up beside or below it; price, time, weight
  - bars — 2–6 bars from a common baseline, the main one in the accent color, the rest gray; comparisons such as "before / after", "us / the market"
  - line chart — the line draws left to right, the end point pulses and is labeled with the total
  - ring or progress bar — fills up to a percentage, the number in the center or at the edge of the fill
  - timer and clock — mm:ss or hh:mm run linearly (real time or sped up ×10–×60 for a timelapse), the colon blinks once per second
  - year rewind — the year "rolls" to the target one over 1.5–2 s (inOutCubic) with vertical motion blur on the digits; a time jump
  - odometer — each digit scrolls on its own drum with vertical motion blur, the lower digits spin faster
  - speed and distance — km/h next to a car or a runner (tracking) or the mileage along a route line on a simple diagram; only from the user's data
status: code
fallback: |
  Numbers and data come from the user or the script; if the narrator says a number, take it from speech recognition and
  ask again when in doubt. The engine does not invent figures or touch up "nice" values. No calm
  background: a plate or a 30–50 % dim, or a separate card on a solid background. Speed and distance are not estimated from the video
  without data from the user. No base maps from third-party services: a simple route diagram
  as a line, or the user's own map.
params:
  type_class: "number: grotesque sans 700–900 with tabular figures (tnum), a condensed cut for long numbers of ≥ 7 characters; label: the same grotesque at 500–600; monospaced for timers and a \"technical\" tone; caption-language coverage for labels; font size = em size, digit height ≈ 0.72 × font size"
  size_16x9: "big number: font size 18–30 % H (typically 24 % ≈ 260 px @1920×1080), label 3–4 % H; on a chart, values 2.5–3.5 % H, bar and axis labels 2.2–2.8 % H"
  size_9x16: "number: width ≤ 72 % W (5–7 characters ≈ 9–13 % H); label 2.4–3.0 % H; chart values ≥ 2.2 % H"
  position: "big number: center of the safe zone (16:9: x 0.5, y 0.42–0.50; 9:16: x 0.47, y 0.32–0.55) or a free third of the frame next to the object; chart in 16:9: a block of 50–70 % W × 40–55 % H; 9:16: x 0.08–0.86, y 0.25–0.70 (top 12 %, bottom 20 % and right 12 % are platform UI)"
  format_ru: "digit grouping: a narrow no-break space U+202F from 5 digits (12 500, 250 000), 4-digit numbers unspaced (2500), but one format within a series; decimal separator: comma (3,5); decimal places as in the total from the first frame of the count (0,0 → 4,8); percent: \"45 %\" with a narrow space; currency after the number: \"1 990 ₽\"; growth \"+\", decline \"−\" (minus sign U+2212, not a hyphen); from 1 000 000, by default \"1,25 mln\" (the Russian abbreviation for million, 1–2 digits after the comma), the full form only when precision matters and the width allows; the abbreviation for thousand (\"tys.\") only when space is short; count abbreviated numbers directly in these units (0,00 → 1,25 mln)"
  format_en: "digit grouping: comma (12,500), decimal separator: dot (3.5), \"45%\" with no space, \"$1,990\", abbreviations 1.2K and 3.4M"
  count: "0.8–2.0 s (20–50 frames @25 fps / 24–60 @30 fps), typically 1.2 s; a short fact 0.6–0.8 s; a \"suspenseful\" total 2–3 s; ease outCubic (default) | outExpo (slow settle, ≥ 1.5 s) | inOutCubic (year rewind) | linear (timers and clocks only); each frame shows floor(value) when rising and ceil when falling, so it stays monotonic; last frame = exact total"
  roll: "odometer: each digit has its own drum of digits, offset = the fractional part of its value; vertical motion blur ≤ 0.5 of the digit height per frame; a digit settles once its value no longer changes"
  landing: "pulse ×1.08–1.12 over 3 frames and back over 5 @25 fps (4 + 6 @30 fps), outBack; color → accent; label fade 4 frames @25 fps / 5 @30 fps; landing on the downbeat frame (±1 frame) or on the end of the spoken number word"
  bars: "2–6 bars; width 6–10 % W (16:9) / 9–14 % W (9:16), gap 40–60 % of the bar width; baseline at 0.72–0.78 H; maximum 40–50 % H; growth 0.5–0.8 s outCubic, staggered by 3–5 frames @25 fps / 4–6 @30 fps or per beat; axis from zero, one scale per comparison"
  line: "thickness 0.4–0.6 % H, drawing 1.0–1.6 s inOutCubic; a fill under the line at 15–25 % opacity fades in over 8 frames afterwards; end point ⌀ 1.2 % H with a pulse"
  ring: "thickness 3–5 % H, radius 10–16 % H; starts at \"12 o'clock\", clockwise, 0.8–1.2 s outCubic; ring track in the same color at 20 %"
  progress: "bar 60–76 % W, thickness 1.5–2.5 % H, rounded ends; fill 0.8–1.5 s outCubic, the percentage rides on the edge of the fill"
  timer: "mm:ss in tabular figures, linear; the colon blinks at 1 Hz (0.5 s on, 0.5 s off), optional"
  color: "number #FFFFFF; growth: green #2BD96B with a ▲ or \"+\" sign; decline: red #FF4D4D with a ▼ or \"−\" sign (meaning not by color alone); landing: accent #FFC400 or one from the video's palette; secondary bars #8A8F98 at 60 % opacity; plate #000 50–60 % or a 30–50 % frame dim; contrast ≥ 4.5:1"
  timing_speech: "the count starts 1.0–1.5 s before the end of the number word (from word-level timestamps) and lands on its end; if the number comes at the very start of a phrase, start with the beginning of the word and land 0.8 s later"
  limits: "one counter on screen (2 for a comparison); in speech genres ≤ 1 per 8–10 s; in music genres ≤ 3 per video; charts ≤ 6 bars and ≤ 2 lines"
when: |
  Explainer and clips: when the voice names a number, the count lands on the end of the number word; bars and lines for comparisons
  and trends. Sport: player or match stats on a freeze frame (time.freeze), speed or distance. Product:
  a spec in numbers in the build, a "before → after" price before the CTA in the outro. UGC: "saved 12 000 ₽" on the hook.
  Motivation: "365 days", "1 % a day". Travel: kilometers and days on the road. Teaser: a timer to the date at the end. Phonk and
  car edits: km/h by the car in the build, landing on the drop. Music genres: start the count on a beat, land on a downbeat
  or on the drop (together with sfx.impact). Limit: ≤ 1 counter per 8–10 s of speech, ≤ 3 per music video, one on screen.
avoid: |
  Made-up numbers or numbers "rounded to look nice"; a truncated bar axis (baseline not at zero) and different scales in one
  comparison; proportional figures, which make the number jitter while counting; a total that holds for less than 1 s; linear on large numbers
  (the last digits are unreadable); more than 6 bars and labels smaller than 2.2 % H in 9:16; meaning by color alone (red /
  green) without a sign; a hyphen instead of a minus and a dot instead of a comma in Russian text; several counters at once;
  infographics over a face; calm, fashion and fan edit: it breaks the tone.
sfx: |
  Ticks during the count (sfx click, −22…−26 dB under the voice, ≤ 15 per second, sparser as the count slows) and a single accent
  on the landing: a "ding" or a short sfx.impact at −14…−18 dB, align='attack' on the total frame; bars growing: a short
  rising sweep of 0.3–0.5 s; timer: a tick once per second; in a music video no ticks are needed, the landing goes on a downbeat
  or on the drop and the track itself provides the accent.
genres: {explainer: signature, sport: signature, product: allowed, clips: allowed, ugc: allowed, motivation: allowed, travel: allowed, viral: allowed, teaser: allowed, epic: allowed, drama: allowed, phonk: allowed, calm: forbidden, fashion: forbidden, fanedit: forbidden}
detect: |
  OCR per frame: a numeric string (digits, "%", "₽", "M"/"mln") changes value monotonically over 0.5–3 s, almost every frame at the start
  and less and less often toward the end (half the total in the first 10–25 % of the time: outExpo or outCubic), then holds ≥ 1 s; the width of the number's
  box is constant (tabular figures), on the landing the box height goes ×1.08–1.12 for 3–5 frames. Charts: rectangles grow
  from a common baseline staggered by 3–5 frames; a polyline lengthens left to right; a ring arc grows in angle. ed_motion: on a card,
  holds after the landing; on a live background, overlay-mask 0.03–0.2 (a static plate) with normal shot motion;
  the graphics produce no global events.
  Differences: a 3-2-1 countdown (type.kinetic) is separate digits cut on the beats, with no intermediate values; pov.screen is
  a mirrored phone interface with a counter; type.margin_notes is handwritten sums written out letter by letter and crossed out;
  look.retro_graphics is a static teleshopping plate with a price; gfx.callout is a pointer to an object with no animated value.
engine: |
  counter(from=0, to=V, dur=1.2, ease='outCubic'|'outExpo'|'inOutCubic'|'linear', end_at=word_ts(number).end | beat('downbeat'),
          format={locale:'ru', group:'U+202F', group_from:5, decimal:',', decimals:'auto', prefix:'', suffix:' %'|' ₽'|'',
                  sign:'auto', minus:'U+2212', abbreviate:'auto'},
          style={class:'grotesk_black', weight:900, tabular:True, size:0.24*H (16:9) | fit_width(0.72) (9:16), color:'#FFFFFF'},
          land={pulse:1.1, dur:[3fr, 5fr], ease:'outBack', color:'#FFC400', label_fade:4fr},
          mode='count'|'roll'|'clock', round='floor'|'ceil', snap_final=True,
          plate={color:'#000', alpha:0.55}|None, pos=..., safe_zone='tiktok')
  — counter(...) from the engine vocabulary, refined: format, land, mode, round, snap_final, end_at (start = end_at − dur).
  chart(kind='bar'|'line'|'ring'|'progress'|'compare', data=user_data, baseline_zero=True, highlight=i,
        colors={main:'#FFC400', rest:'#8A8F98'}, grow={dur:0.6, ease:'outCubic', stagger:4fr | beat_sync(event='bar_in', grid='1/4')},
        labels={size:0.025*H, count_with=True}, pos=..., safe_zone='tiktok') — new primitive.
  before → after: shape(kind='strike', over=old, draw_on=6fr) + counter(from=old, to=new, dur=1.0).
  speed next to an object: counter(values=user_series, anchor=track(object:<car|person>), offset=[0.12*W, 0], smooth=0.3).
  frames are given @25 fps, for 30 fps multiply by 1.2 and round.
  + sfx('click', rate_max=15, gain=-24dB) on the count, sfx('impact', at=landing, gain=-16dB, align='attack').
  check: qa_numbers(source=user_data) — new (the total on screen = the value in the data); qa_text_safe_zone(layout='tiktok').
gen_hint: clean minimal background plate for data graphics, <calm wide shot or soft gradient> with a large empty dark area in the center, low detail, gentle slow camera drift, no text, no numbers, no charts
commands: ["a counter up to 12 000 ₽ when he says the amount", "\"before and after\" bars growing on the beats", "a percentage in a ring on the drop", "rewind the year to 2026 on the transition", "a 00:59 countdown timer at the end of the teaser"]
related: [gfx.callout, type.kinetic, type.margin_notes, time.freeze, pov.screen, look.retro_graphics, type.title_card, layout.split_screen, sfx.impact]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
