id: gfx.floating_ui
family: gfx
group: graphics
level: B
aliases: [floating UI, messages in the frame, chat bubbles, text in the air, floating text messages, on-screen texting, diegetic interface, chat overlay]
what: a device interface (messages, a chat, a typing window) hangs right in the scene next to the subject — you see both the face and what they are reading or writing, without cutting away to the screen
frames: |
  1. Trigger: the subject looks at a phone or laptop; the device is in the frame or implied by the pose.
  2. Appearance: a bubble flies out of the device and grows into place over 5–6 frames (200–240 ms, decelerating)
     — or "pops" in by scale over 2–3 frames.
  3. Placement: next to the head, on the empty side of the frame, at head height (upper third); it does not cover faces.
     Bubble 12–35 % of the frame width, letters 1.5–4.5 % of the height (larger on close-ups); a chat is a stack in an upper
     corner with avatars, other people's messages on one side, one's own on the other and in a different color.
  4. Life: text types out letter by letter at 9–14 characters per second (1–2 frames per character); a new message pushes the stack
     up by one bubble height; a typed word "flies off" into the open space over 3 frames.
  5. It stays while the subject reads (1.5–4 s) and survives a cut to another angle at the same screen position; it leaves
     with a dissolve over 4–6 frames or together with the cut.
variants:
  - single incoming message: a flat semi-transparent bubble (teal, ≈18 % of the width) flies out of the phone and settles by the head
  - chat stack: 3–4 bubbles in the upper left corner with avatars, scrolling up as new messages arrive
  - typing window: a dark semi-transparent panel over ≈30–45 % of the frame, a word types out letter by letter, then flies off into the open space
  - reactions around the subject: 3–4 bubbles with a white outline and no fill, small names above them, scattered around the head and the phone
  - text without a bubble: message lines type out in an empty part of the frame and continue after the cut
  - in a wide shot: a tiny bubble (letters ≈2.5 % of the height) next to a small figure, growing out of its phone
status: code
fallback: with a moving camera, point or planar tracking is needed (otherwise the bubble "drifts" across the scene); if there is no room next to the subject in the frame, reframe with extra space or outpaint
params:
  pop_in: 5–6 frames (200–240 ms) flying out of the device with deceleration (outBack | outCubic); short variant, a scale of 0.6→1.0 over 2–3 frames
  size: bubble 12–35 % of the width, 5–8 % of the frame height tall; window panel up to 30–45 % of the frame
  text: grotesque (sans), lowercase height 1.5–4.5 % of the frame height; name or time label at 50–60 % of the main font size, gray
  style: flat fill with 10–30 % transparency (teal, blue, pink) and white text | white 1–2 px outline with no fill | dark semi-transparent panel
  position: at head height (y 0.15–0.35 in a medium shot), offset 0.10–0.25 of the width toward the empty side; a chat goes in an upper corner, 3–5 % margin
  typing: 9–14 characters/s (≈), the cursor blinks 2 times per second
  stack: a new bubble shifts the stack by its own height over 4–6 frames
  hold: 1.5–4 s per message; exit with a 4–6 frame dissolve
when: |
  Scenes with texting and social media: a message arrives, a "read" reply, a group chat reacts; UGC storytelling
  "he texted me…"; explainer and product videos, to show what an app does without leaving the user's face;
  comedy, an awkward text exchange. A separate beat for each message; no more than 3–4 bubbles at once.
avoid: |
  Real logos and interfaces of specific apps: neutral style only. Small text on a vertical screen
  (below 3 % of the height it is unreadable on a phone). Bubbles over faces. A bubble that does not stick to the scene when the camera
  moves. Different bubble styles in one video. Long messages: 1 line of up to 30–40 characters.
sfx: |
  A "knock" or a notification sound when the bubble appears; keyboard clicks while typing (on every 2nd–3rd letter); a short
  send whoosh; phone vibration on an incoming message. Everything quiet (−12…−18 dB) under the music, on the beat.
genres: {ugc: signature, viral: allowed, explainer: allowed, product: allowed, drama: allowed, teaser: allowed, fanedit: allowed, calm: allowed}
detect: |
  ed_motion: a static graphics layer gives overlay-mask 0.05–0.5; camera motion meanwhile is normal or zero.
  Visually: flat rounded rectangles with thin white grotesque text, sharp against a blurred background (they ignore
  the scene's depth of field and lighting), semi-transparent; they appear from a point at the phone, scaling up over 5–6 frames;
  the text grows letter by letter; the stack shifts up.
  Difference from pov.screen: there the camera is the screen itself, with a mirrored interface over the face. From layout.screen_in_screen: there
  the screen itself or an inset window is shown as a picture. From type.subtitles: captions sit bottom center and carry speech. From type.kinetic:
  that is decorative typography, not a device interface.
engine: |
  ui_overlay(kind='bubble'|'chat_stack'|'window'|'outline_bubble', text=<message>, anchor=track(person:head),
             offset=[0.15*W toward the empty side, 0], width=0.18*W, opacity=0.85, color='#2bb3a8', font='sans', cap_h=0.03*H)
  + pop_in(from=track(object:phone), dur=0.22, ease='outBack') + type_on(cps=12, cursor=True)
  + chat_stack(messages[], corner='top_left', bubble_h=0.06*H, gap=0.01*H, push_dur=0.2) for a chat
  + fade(to='transparent', dur=0.2) on exit
  + sfx('click', at=pop_in.t0, gain=-14dB); with camera motion, track(kind='planar'|'point') for the anchor.
gen_hint: medium shot of <person> reading a message on their phone, natural light, clean empty space beside their head for floating message graphics added later, static camera, shallow depth of field, no on-screen text
commands: ["a message pops up as a bubble by the subject's head at 0:04", "a chat in the upper left corner, new messages push the old ones up", "in #5, text typing out letter by letter in a floating window", "friends' reactions as bubbles around the heroine"]
related: [pov.screen, layout.screen_in_screen, type.subtitles, type.kinetic, layout.split_screen]
evidence: {examples: 6, sources: 6, measured: "bubble flying out of the phone in 5–6 frames (200–240 ms) in 2 clips; letter-by-letter typing at ≈14 characters/s (a 9-letter word in 0.65 s) and ≈9 characters/s; bubble 12–35 % of the width, letters 1.5–4.5 % of the height; placement by the head in the upper third or as a stack in the upper left corner; 1 clip is a still frame with 4 outline bubbles; transparency and colors by eye (≈)", confidence: medium}
