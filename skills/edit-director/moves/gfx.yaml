id: gfx.collage
family: gfx
group: graphics
level: B
aliases: [collage, cut-out collage, cutouts, paper collage, scrapbook, zine aesthetic, zine, stickers, photo stack, photo pile, moving moodboard]
what: the frame is assembled from cut-out photos, video windows and stickers — pieces land in layers, slightly rotated, with paper borders, tape and shadows, and change in jerks like stop-motion; a handmade, "magazine" feel
frames: |
  1. Backing: clean white (L≈245, the pieces cover 1 → 33 % of the frame as it grows), a flat color
     or a soft gradient (peach RGB 245/195/130 → pink 209/152/185), black; or the video itself.
  2. Pieces: rectangular photos and video windows 16–50 % of the frame width, stickers 2–11 % of the area, figures and objects
     cut out along their silhouette; each one rotated by ±5–30°; cutouts have a white paper border ≈1–1.5 %
     of the width and a torn edge; strips of clear tape, an ink blot, grain.
  3. Pace: stop-motion at 6–14 fps (5 of 9 examples), a new piece or a swap every 1–3 frames
     (80–150 ms); a photo stack grows by one shot every ≈0.6 s while the whole table "moves closer":
     stack width 0.16 → 1.1 of the frame width over 5.8 s.
  4. Entrances: slap (the piece appears whole in 1 frame), slide-in from the side as a strip, grow from a point,
     "boiling" — the cutout is replaced every frame by a new variation of the same shape (7 fps).
  5. Ending: the frame is fully covered (a sticker wall) or a transition to clean full-frame video.
variants:
  - photo stack: shots drop onto a white table one after another, each one rotated, the stack grows, the product sits in the center
  - sticker wall: badges and stickers cover the whole frame in 2 s, a new one every 2–3 frames @20 fps
  - cut-out figure: a person cut along the silhouette with a paper border on a colored gradient, the background changes every 1–2 frames, tape and blots
  - boiling strip: a torn paper strip over the eyes of a portrait, a new shape every frame (7 fps)
  - strip of video windows: rectangles with different clips slide in from the side one after another, overlapping
  - memory windows: 1–2 rectangles with other moments of the same scene pop up over the main frame
  - mosaic page: photos and frames are laid out as tiles, then full-screen video follows
  - sticker object: a cut-out object grows next to the subject in the frame
status: hybrid
fallback: without masks, only rectangular pieces (photos, windows, strips) in code; silhouette cutouts via mediapipe/hf_remove_background; paper textures, tape and blots from an overlay library or a generation with consent; image pieces are frames from the user's source footage (freeze frames of their own video)
params:
  bg: "#ffffff | flat color | gradient #f5c382 → #d198b9 | black | video"
  pieces: photos 16–50 % of the width; stickers 2–11 % of the area; 3–30 pieces per frame
  rotation: ±5–30° per piece, random, never uniform
  edge: paper border 1–1.5 % of the width (white), torn edge, shadow at 20–35 % opacity with a 0.5–1 % offset
  texture: grain 0.04–0.08, tape (semi-transparent, 30–50 %), 1–3 blots
  pace: a new piece every 1–3 frames (40–150 ms) in a "wall"; 0.5–0.7 s in a stack; on the beat, 1/8 or 1/4
  fps: 6–14 fps for the whole collage (hold 2–4 frames @25 fps); video inside the windows plays on ones
  enter: slap (1 frame) | slide-in 3–6 frames | grow from a point 4–8 frames
  camera: slow zoom-in on the stack ×2–3 over 5–6 s or a static table
  duration: 2–8 s per collage episode; an intro can run up to 20 s
when: intros and title sequences, moodboards and fashion lookbooks, a product surrounded by "life" (a stack of shots with people and the product), memories and year-in-review recaps, lists (each item is a new piece on a beat), chapter changes; 1–3 episodes per video
avoid: identical rotations and sizes of the pieces look like a template; overly smooth motion (60 fps) kills the handmade aesthetic; small text on the pieces; more than 30 pieces with fast swaps turns into a mess; cutouts with a dirty mask and no border
sfx: a paper slap or a click for each piece, paper rustle, tape being torn off, a shutter click for photos; the rhythm of the pieces follows the beats of the track
genres: {fashion: signature, fanedit: allowed, viral: allowed, product: allowed, teaser: allowed, ugc: allowed, clips: allowed, travel: allowed, motivation: allowed, explainer: allowed, calm: allowed}
detect: |
  Several rectangles or cutouts with different scenes and different exposure in the frame, rotated at different angles,
  with white borders and shadows; a flat or white background. Over time, new compact regions appear
  (2–50 % of the frame) while the rest of the frame stays still; the animation frame rate is 6–14 fps (repeated frames).
  ed_motion: "no significant global motion", cuts in parts of the frame, low overlay-mask; sometimes a slow ZOOM-IN of the whole stack.
  Difference from layout.split_screen: that is an even grid with no rotation, borders or overlaps.
  Difference from mask.silhouette_window: that is one window inside a silhouette, here there are many layers.
  Difference from anim.stop_motion (cut-out animation): there parts of a character move, here image pieces pile up and swap.
engine: |
  collage(bg='#ffffff'|gradient(['#f5c382','#d198b9']),
          pieces=[collage_piece(src=still|clip, cutout='rect'|mask('hf_remove_background')|'torn', scale=0.16–0.5,
                                rotate=uniform(-30, 30), pos=random_in(safe=0.1), border=0.012, shadow=0.3, enter='slap'|'slide'|'grow', t=beat_i)],
          fps=10)
  + paper_texture(amount=0.06) + tape(n=1–2, opacity=0.4) + grain(amount=0.05)
  + step_print(hold=2)  # stop-motion
  Stack with a zoom-in: transform(scale=[1, 2.5], t=[t0, t0+6], ease='linear', layer='collage')
  + sfx('click'|'paper_slap', at=beat_i)
gen_hint: handmade paper collage animation, cut-out photographs and stickers with white paper borders, torn edges and tape, pieces slapped onto a <white table / pastel gradient background> one by one, slightly rotated, stop-motion at 8 fps, zine aesthetic
commands: ["build the intro as a collage of freeze frames from #1–#8", "a photo stack with the product in the center, one shot per beat", "cut out the subject with a paper border on a pink gradient", "cover the frame with stickers on the drop"]
related: [mask.silhouette_window, layout.split_screen, layout.windowbox, anim.stop_motion, time.step_print]
evidence: {examples: 9, sources: 9, measured: "5 of 9 at 6.25–14.3 fps; a new sticker every 2–3 frames @20 fps (stickers 2–11 % of the area); stack: frame coverage 1.2 % → 33 %, width 0.16 → 1.14 of the frame width over 5.8 s, a new shot ≈ once every 0.64 s; cutout background: peach 245/195/130 with the gradient replaced every 1–2 frames @12.5 fps; the paper strip changes shape every frame @7.1 fps", confidence: medium}
