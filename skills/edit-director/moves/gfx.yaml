id: gfx.route_map
family: gfx
group: graphics
level: B
aliases: [route map, travel route, animated route, route on a map, route line, path across a map, plane flying across the map, trip map, track on a map, minimap]
what: a route on a map — the path line is drawn in code from point to point over a solid background or a stylized map, place pins pop up on arrival, a running dot or a transport icon leads the eye, labels are set in our own font; each leg starts on a beat and lands on a downbeat
frames: |
  1. Entrance (6–10 frames @25 fps / 7–12 @30 fps): the background fades in or is already there; the virtual camera shows the start point
     with room around it; the start pin pops ×0 → ×1.15 → ×1.0 over 5 frames @25 fps / 6 @30 fps (outBack), the place label
     fades in over 4 frames @25 fps / 5 @30 fps with a 1 % H shift.
  2. Leg: the line grows from point to point by path length (not by x) over 0.6–1.2 s, typically 2 beats (1.0 s at 120 BPM =
     25 frames @25 fps / 30 @30 fps), ease inOutCubic, the last leg outCubic. At the end of the line, a running dot with a halo
     or a transport icon turned along the tangent of the path. A land route is a solid polyline through the track points,
     a flight is a dashed arc with a height of 15–30 % of the leg length, a water route is dashed.
  3. Camera: the frame smoothly follows the end of the line (inertia 0.3–0.5 s), at a scale where the current leg takes up
     40–70 % of the width; before a long leg, a zoom-out to ×0.6–0.8 over 0.4 s and back in at the arrival point; no rotation.
  4. Arrival: the end of the line touches the point exactly on the downbeat frame (±1 frame); the pin pops, a ripple ring
     goes ×1 → ×2.5 fading 0.6 → 0 over 10 frames @25 fps / 12 @30 fps; the place label appears; the path traveled stays at full
     brightness, the path ahead (if shown in advance) is dashed at 25–35 %.
  5. Summary (optional): zoom out to the whole route over 0.8–1.2 s, all pins and labels, kilometers or days of travel counted up by
     gfx.counter landing on a downbeat; hold ≥ 1.2 s (+0.3 s per label word); exit: fade 6 frames
     @25 fps / 7 @30 fps, a whip or a light flash into the next shot.
variants:
  - diagram on a solid background — only points, the line and labels on a dark or light field; the default variant, needs no map at all
  - stylized map — a background with land and water in 2–3 muted tones and no lettering, an image from the user or one generated with their consent
  - flight arc — a dashed arc and a small plane along the tangent; several flights in a row, one per bar
  - route from a track — a polyline through GPS points from the footage metadata or from the user's track file (thinned to 1 point per 0.5–1 % of the width)
  - overview recap — the whole route in the outro: the line draws in over 1.5–2 s, the pins land on the beats, then the distance counter
  - minimap — a diagram 30–40 % of the width on a plate in a corner of the safe zone over road footage; the dot moves along with the shots
  - diagram without geography — places in order on a straight line or an arc with equal segments when there are no coordinates; distances are not labeled
status: code
fallback: |
  Points: place names and order come from the user (coordinates from the user as well, or from the GPS metadata of videos and photos);
  the engine does not guess places from the picture and does not draw a "nicer" path. No coordinates: a diagram without geography
  (equal segments, no kilometers). Background: solid or gradient by default; the line and pins stand on their own.
  If a real map is needed, only an image from the user (their own or freely licensed) georeferenced by 2 control
  points (pixel ↔ coordinates), or a generation after the price is confirmed: a generated map is decorative texture,
  coastlines are not guaranteed, so without anchoring to real coordinates the points are placed schematically.
  Base maps and styles of third-party map services, their icons, labels and logos are never used; place
  labels are set in our own font.
params:
  points: "2–8 places per showing (more: group them by region or split into 2 showings); order by capture time from the metadata or by the user's list; track: polyline simplification by maximum deviation with a tolerance of 0.5 % of the width"
  projection: "region up to ≈ 2000 km: equidistant x = (lon − lon0)·cos(lat0), y = lat; larger: conformal cylindrical y = ln tan(π/4 + lat/2); the route bounding box fits into 60–76 % of the width with margins ≥ 12 %; north up"
  background: "solid #0F1A24 (night) or #F3EEE4 (paper), or a vertical gradient of ±6 % brightness; stylized map: saturation ×0.5–0.7, contrast ×0.8, no text; the line is always the highest-contrast element (≥ 4.5:1 against the background)"
  line: "thickness 0.5–0.8 % H (10–15 px @1080×1920), round caps and joins; color: a single accent from the video's palette (default #FF5A36); a 0.15 % H #000 outline at 30 % opacity on a busy background; dashes: 1.5 % H dash, 1 % H gap"
  arc: "flight: a quadratic curve with one control point, height 15–30 % of the leg length, bowing away from the frame center; the dashes \"run\" behind the plane"
  leg_timing: "leg 0.6–1.2 s: t = clamp(0.5 + 0.35·L/W, 0.6, 1.2) s, where L is the on-screen leg length and W the frame width; with music, round to 1 or 2 beats; start on a beat, arrive on the frame of the next downbeat ±1 frame; with speech, arrive on the end of the place word"
  head: "running dot ⌀ 1.6–2.2 % H with a halo ⌀ 3–4 % H (30 %); transport icon (plane, train, car, boat, footsteps) 3–4 % H, our own vector drawing, turned along the tangent with 3 frames of angle smoothing"
  pins: "pin ⌀ 1.4–1.8 % H or a 3 % H \"teardrop\"; pop ×0 → ×1.15 → ×1.0 over 5 frames @25 fps / 6 @30 fps (outBack); ripple ring ×1 → ×2.5 over 10 frames @25 fps / 12 @30 fps; pin color = line color, visited pins turn white"
  labels: "our own font: grotesque sans 600–700 in sentence case or handwritten (as in type.hand_drawn); the font must cover the caption language; font size 2.6–3.4 % H in 9:16 (never below 2.4 % H), 3–4 % H in 16:9; ≤ 18 characters; the label goes toward the free space and does not cross the line; fade-in 4 frames @25 fps / 5 @30 fps; plate #000 50 % or a 0.3 % H shadow"
  camera: "the virtual camera follows the end of the line: a critically damped spring, τ 0.3–0.5 s; the current leg takes 40–70 % of the width; long flight: zoom out to ×0.6–0.8 over 0.4 s (inOutCubic) and back; no rotation or shake"
  trail: "path traveled: 100 %; path ahead (the \"whole route in advance\" variant): dashed at 25–35 %, fades in together with the background"
  overview: "summary: zoom out to the whole route over 0.8–1.2 s (inOutCubic), hold ≥ 1.2 s + 0.3 s per word; kilometers and days via gfx.counter only from the user's data or from the summed track length"
  duration: "showing 2–6 s (2–4 legs); overview recap 2.5–4 s; minimap: as long as the road footage runs, but ≤ 8 s in a row"
  safe_zone: "9:16: all graphics within x 0.06–0.88, y 0.12–0.80 (top 12 %, bottom 20 % and right 12 % are platform UI); minimap: upper left corner of the safe zone, 30–40 % of the width, margins 3 % of the width"
  limits: "≤ 2 showings per video (road + summary); ≤ 8 pins in the frame; ≤ 1 transport icon in the frame; one style for the line, pins and labels across the whole video"
when: |
  Travel is the move's home: in the build, 2–4 s between road shots (train window, airplane wing, highway), a "from → to"
  leg before the first shots of a new place; in the outro, an overview recap of the whole route with pins on the beats and
  a counter of kilometers or days; in the hook, optionally "the whole trip in a second" (1 beat per leg). Explainer:
  where it happened, the path of a shipment or parcel, the story of an expedition; the dot arrives on the end of the place word. Sport: the course
  of a marathon, race, swim or bike route, with the dot moving in sync with the athlete's shots. Teaser: tour cities
  pop up on the beats, the final pin is the place and date. Clips and vlogs: "where we've been" between segments. Epic:
  the path of an expedition at a large scale. Calm: a slow line, 1.5–2.5 s per leg, pins without the ripple ring.
  Music genres: leg = 1–2 beats, arrival on a downbeat; the first beat of the drop is not the map but the best shot of the place.
  Limit: ≤ 2 showings per video, ≥ 8 s apart.
avoid: |
  Made-up geography and "approximate" distances without data; base maps, styles, icons and labels of map
  services and other people's maps; real outlines from a generated map passed off as accurate; more than 8 pins in one
  frame and labels smaller than 2.4 % H in 9:16; a leg faster than 0.5 s (the path does not read) or slower than 1.5 s in a music
  video (it drags the pace); rotating or shaking the map; the line and labels over faces, captions and UI zones; a map
  on the drop instead of the places; several map styles in one video; phonk, fan edit and fashion: information graphics
  break the mood and the look.
sfx: |
  Leg growth: a soft whoosh of 0.3–0.6 s (sfx.whoosh, 6 kHz low-pass filter, −12…−14 LU relative to the music, peak on arrival);
  flight: a short fly-by, noise with a rising band-pass sweep of 0.6–0.8 s, panned ±0.3 along the arc;
  pin: a "tick" or "pop" of 30–60 ms (sfx click, −18…−22 dB, align='attack' on the arrival frame); summary: no sound or
  sfx.impact at −16 dB on the counter landing. Under a voice, only the pin ticks; drop the whooshes. In a music video
  where the place changes on every beat no sounds are needed, the track provides the accent.
genres: {travel: signature, explainer: allowed, sport: allowed, teaser: allowed, clips: allowed, epic: allowed, calm: allowed, viral: allowed, phonk: forbidden, fanedit: forbidden, fashion: forbidden}
detect: |
  frame: a solid or muted background (histogram with 1–3 peaks, low texture) or a flat map in 2–3 tones
  with no parallax; a thin line of constant thickness 0.4–1 % H whose total length grows monotonically over 0.5–1.5 s
  per segment (the line's pixel count grows, then holds), the end of the line is a bright dot or an icon turned in the direction of travel;
  round markers appear with a ×1.1–1.2 overshoot at the ends of segments; OCR finds short place-name labels (1–2 words)
  next to the markers; dashed arcs between distant points.
  ed_motion: on a map background, smooth SHIFT and ZOOM-IN/ZOOM-OUT (the virtual camera follows the end of the line) with nonrigid
  ≈ 0 and jitter ≈ 0 (flat graphics, a perfect similarity transform), direction changes without jerks; while the camera holds and only
  the line grows, holds (small frame difference: < 1 % of the pixels change); a minimap over video gives overlay-mask
  0.05–0.15 (a static plate in a corner over a moving shot).
  Differences: anim.line_art is an outline drawing without points, pins or place labels; gfx.counter is a number without a path (its variant
  "mileage along the route line" combines with this move); gfx.callout is a pointer to an object in a live frame,
  not a path between places; drone.aerial and angle.birds_eye are real overhead footage (texture, parallax, nonrigid
  > 0.1); type.diegetic is lettering in the perspective of a surface in the frame.
engine: |
  route_map(points=[{name, lat, lon} | {name, xy:[x, y]}], source='user'|'gps_meta'|'track_file'|'schematic',
            projection='equirect'|'conformal', fit={box:[0.06, 0.12, 0.88, 0.80], fill:0.68},
            bg={kind:'solid'|'gradient'|'image', color:'#0F1A24', image=user_map|generated, georef=[2 control points] | None,
                desat:0.6, contrast:0.8},
            legs=[{mode:'plane'|'train'|'car'|'boat'|'walk', dur:'auto'|1.0, start=beat(n), arrive=beat('downbeat') | word_ts(place).end}],
            line={w:0.006*H, color:'#FF5A36', cap:'round', outline:{w:0.0015*H, alpha:0.3}, dash_for=['plane', 'boat'], arc_h:0.2},
            grow={by:'arc_length', ease:'inOutCubic', last:'outCubic'},
            head={kind:'dot'|'icon', d:0.02*H, halo:0.035*H, orient:'tangent', angle_smooth:3fr},
            pins={d:0.016*H, pop:{scale:[0, 1.15, 1.0], dur:5fr, ease:'outBack'}, ripple:{to:2.5, dur:10fr}},
            labels={font:'own_grotesk_600'|'own_hand', size:0.03*H, side='auto' → free_side(...), fade:4fr, max_chars:18},
            camera={follow:'head', tau:0.4, leg_fill:[0.4, 0.7], hop_zoom_out:0.7, rotate:False},
            trail={done:1.0, todo:0.3}, overview={at:'end', dur:1.0, hold:1.2}, safe_zone='tiktok')
  — new primitive: point projection, line growth by path length, pins and labels, a virtual camera; built from shape(...),
  text(...) and transform(...) over its own background, rendered as vectors (antialiased, no raster base maps).
  minimap: route_map(..., layout={kind:'inset', box:[0.06, 0.12, 0.40, 0.32], plate:{color:'#000', alpha:0.5}}).
  summary: + counter(from=0, to=km_total, dur=1.2, ease='outCubic', end_at=beat('downbeat'), format={locale:'ru', suffix:' km'}).
  sound: + sfx('whoosh', at=leg_end, align='peak', gain=-13dB, lowpass=6000) per leg; sfx('click', at=pin_in, gain=-20dB, align='attack').
  background on request: generate_image(prompt=gen_hint) — only after the price is confirmed; third-party map base layers are forbidden.
  frames are given @25 fps, for 30 fps multiply by 1.2 and round.
  check: qa_route_data(points) — new: every point, label and number exists in the user's data or in the metadata;
  qa_text_safe_zone(layout='tiktok').
gen_hint: stylised flat map background of <region>, top-down view, land and water in two muted tones, subtle paper texture, no text, no labels, no roads, no icons, no logos, wide empty margins, clean minimal look
commands: ["draw a route through my three cities in the build", "a route on the map from the GPS in my videos", "at the end show the whole trip and count up the kilometers", "a flight as a dashed arc with a little plane on the beat", "a minimap in the corner while the road footage runs", "a route diagram without a map, just points and a line"]
related: [anim.line_art, gfx.counter, gfx.callout, type.hand_drawn, drone.aerial, trans.whip, zoom.out, time.hyperlapse, layout.screen_in_screen, sfx.whoosh]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
---
id: gfx.touch_gesture
family: gfx
group: graphics
level: B
aliases: [screen gesture in real life, mid-air hand swipe, touch gesture, scrolling through reality, swiping through places, air swipe, swipe transition, pinch to zoom]
what: a hand in the frame controls reality like a phone screen — a swipe flips through scenes, a pinch zooms in, a tap opens, a finger scrolls the frame like a feed, a snap turns day into night; the edit and the graphics fire exactly in time with the gesture
frames: |
  1. Setup: the hand enters the frame (usually first-person) over 0.3–1 s and takes up 15–40 % of the frame;
     the target of the gesture is in the center: a building, a painting, a photo grid, an interface card.
  2. The gesture and the frame's instant reaction:
     - sideways swipe — the scene slides away in the direction of the hand's movement with motion blur: 49 % of the width in 0.25 s
       (peak 13 % per frame), after the cut the motion continues in the new scene; the whole transition is 0.3–0.4 s;
     - upward swipe, as in a feed — the new clip rises from below: the border between the two clips creeps from 81 to
       46 % of the height in 0.3 s (dragged by the finger), holds for 0.4 s, then rolls on to the top in 0.2 s;
     - pinch or spreading the fingers — a zoom of ×1.15 in 2 frames (a jolt) or a smooth ×7.5 over 2.7 s
       through a series of pinches;
     - tap on a cell — the rest of the grid fades to ≈50 % in 0.3 s, the chosen picture grows from
       its cell to the frame width in ≈1.3 s and comes alive;
     - a squeeze or a snap of the palm — a cut of the same frame "day → night" exactly on the change of hand pose;
     - grabbing a corner — the frame curls up like a sheet of paper and flies away in 0.75 s, a new scene underneath;
     - a swipe on an interface card hanging in the room (player, notification) — it changes its content in ≈0.3 s.
  3. Landing: the new state holds from 0.9 s on; the hand leaves or prepares the next gesture;
     chains of 2–4 gestures at 1–2 s intervals.
variants:
  - swiping through places — a sideways swipe, each scene is a new location from the same trip
  - feed — an upward swipe, clips change as in a vertical feed, with a "halfway" pause
  - pinch zoom — a zoom into a painting or a building, the painting becomes a real landscape
  - tap in a profile grid — a tile expands to full frame and comes alive
  - finger snap "day ↔ night" — the same camera position at a different time of day
  - turned page — the frame curls up like a sheet of paper
  - interface in space — a player card on the wall, a hand swipe switches the track
status: hybrid
fallback: if there is no shot with a hand, film the hand separately against a solid background and composite it via a mask (mediapipe hands / selfie) or generate a POV shot with the gesture (with consent); "day ↔ night" needs a second take from the same position, otherwise a night version in code (exposure −1.5…−2 stops, a blue tint, light in the windows via masks), which is honestly weaker
params:
  gesture: swipe_x | swipe_up | pinch | tap | snap | peel | ui_swipe
  sync: the reaction starts on the frame where the fingertip speed exceeds 3 % of the frame per frame (±1 frame) and ends when the hand stops
  swipe: 0.25–0.4 s (6–10 frames @25 fps), displacement of 100 % of the width, peak 8–13 % per frame, directional motion blur, inOutCubic; cut at the midpoint
  scroll: drag of 35 % of the height in 0.3 s → pause 0.3–0.5 s → roll-on in 0.2 s (outCubic)
  pinch: a jolt of ×1.15–1.3 in 2–3 frames or smoothly ×2–7.5 over 1.7–2.7 s; the zoom center is between the fingers
  tap: the rest fades to 50 % in 0.3 s; the chosen item grows ×3 from its cell over 1–1.3 s, outCubic
  snap_cut: cut on the change of hand pose; the frames match in composition within ±2 %
  peel: frame curl 0.6–0.8 s, the corner follows the fingertip
  hand: 15–40 % of the frame, in focus, the fingertip is point 8 in the hand landmarks
  ui_card: a card 30–40 % of the width, semi-transparent gray (alpha 0.6), 8 % corner radius, attached to a plane
when: first-person travel and lifestyle ("swiping through places"); before/after and day/night with a single gesture; a "watch what happens if I swipe" hook; videos about social media, apps and products with a screen; 2–4 gestures per video, on downbeats
avoid: the hand out of focus or half out of frame; a reaction more than 2 frames late breaks the illusion; day and night shot from different positions turn into an ordinary cut; small frequent gestures in a row; interfaces with other companies' logos and names, only neutral cards
sfx: swipe — a short whoosh or an interface click; tap — a click; pinch — a "pop" or a stretch sound; a finger snap on "day → night" plus a change of ambience; feed — a quiet scroll tick
genres: {travel: signature, ugc: signature, viral: allowed, product: allowed, explainer: allowed, fashion: allowed, teaser: allowed, fanedit: allowed, clips: allowed}
detect: |
  A hand or finger in the foreground (mediapipe hands), and at the moment of a fast finger movement
  (±1 frame) the whole frame starts reacting: ed_motion shows SHIFT of 8–13 %/frame in the direction of the hand's movement,
  a ZOOM jolt or a cut; feed: a horizontal border between two clips creeping upward in jerks
  (81 → 46 → 5 % of the height) with a pause; tap: the rest lightens, one rectangle grows; snap:
  a cut with no change of angle and a sharp change in brightness and color (day/night).
  Difference from trans.whip: there the blur comes from a camera turn, here the motion is driven by the hand in the frame.
  Difference from a floating interface: there the cards just hang, here the gesture moves them.
engine: |
  track(hand) → fingertip path, speed; gesture_detect(kind='swipe'|'pinch'|'tap'|'snap') → t_g, direction, scale
  swipe: transition(kind='whip', dur=0.3, params={dir: <swipe direction>, blur: 0.6}) starting at t_g
  swipe_up: feed_scroll(A, B, drag=0.35, drag_dur=0.3, hold=0.4, snap_dur=0.2) — new primitive
  pinch: transform(scale=[1, 1.2], center=pinch_center, t=[t_g, t_g+0.1]) or scale=[1, 7] over 2.7 s
  tap: tap_expand(cell=<cell bbox>, dim=0.5, dim_dur=0.3, grow=3, dur=1.2, ease='outCubic') — new primitive
  snap: cut(at=t_g) + match(on='shape') between the "day/night" takes
  peel: page_curl(corner=fingertip, dur=0.75) — new primitive
  ui_swipe: ui_card(kind='player', anchor=plane_track, swipe_out=0.25) — new primitive
  + sfx('click'|'whoosh', at=t_g, align='attack')
gen_hint: first-person POV, my hand in the foreground makes a swipe gesture in the air as if scrolling a phone screen, the whole scene slides away in the direction of the swipe and <next location> slides in, sharp hand, natural light
commands: ["swipe through the locations with a hand swipe", "on a finger snap day turns into night on #3", "pinch to zoom into the painting and it comes alive", "flick the clips upward with a finger, like a feed"]
related: [trans.whip, trans.portal, pov.first_person, trans.wipe, cut.match, gfx.floating_ui]
evidence: {examples: 9, sources: 8, measured: "swipe: 49 % of the width in 0.25 s (peak 13 %/frame), motion blur 0.2 s; feed: border 81→46 % of the height in 0.3 s, pause 0.4 s, roll-on to 5 % in 0.2 s; pinch: ×1.15 in 2 frames twice or ×7.5 over 2.7 s; tap: the grid fades in ≈0.3 s, the tile grows in ≈1.3 s; day → night as a cut on the change of hand pose, night holds 0.9 s; the sheet-frame flies away in 0.75 s; the player card changes the track in ≈0.3 s", confidence: medium}
