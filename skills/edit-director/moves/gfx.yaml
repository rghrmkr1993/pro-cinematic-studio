id: gfx.mixed_media
family: gfx
group: graphics
level: C
aliases: [mixed media, mixed technique, hybrid graphics, video plus graphics, layered frame, assembled frame]
what: live video is mixed in one frame with foreign layers — "machine vision" labeling, interfaces, handwritten marks, print texture, 3D elements; each layer has its own texture and its own pace, and the frame looks assembled rather than shot
frames: |
  1. Base: live video at 20–33 fps or a photo; on top of it or instead of the background, 1–3 layers of a different nature.
  2. Each layer is recognizable by its texture: thin colored boxes with labels (object labeling), interface screens
     and icons, white or red hand-drawn lines, halftone and torn paper, 3D particles.
  3. Two paces in one frame are the technique's main signature: the live layer changes every frame, while the graphic one
     holds each drawing for 2–6 frames @25 fps (80–220 ms) or lives in bursts: the interface scrolls for 7–8 frames in a row
     (0.3 s), then holds for 0.3–0.7 s; the background behind a cutout changes every frame (90–100 ms).
  4. Often the rest of the frame is still: in a live collage 65–89 % of the pixels stand still, while one cut-out
     figure or one screen inside the picture moves.
  5. The palette goes to extremes: acid (saturation 130–190 of 255) or near-monochrome print (25–40).
variants:
  - object labeling: rectangular 2 px boxes (≈0.7 % of the frame height) colored by class — magenta for people, green for objects, teal for furniture; label tags ≈4–5 % of the height; the boxes follow the objects every frame
  - live plus interface: a person shot on chroma key stands in front of phone screens, the interface scrolls in bursts of 7–8 frames, a second screen appears beside it
  - handwritten marks: a photo or video of a product, red ovals and arrows circle details (line ≈1 % of the height), a pencil in the frame, the sheets change every 0.5–1 s
  - print texture: torn paper strips with halftone portraits, large text, cut-out hands; 4.5 fps (each drawing holds for 5–6 frames @25 fps)
  - cutout on a changing background: one cut-out object (an eye) in the center, the background — a butterfly, op art, a lizard — changes every frame
  - color cycle: a poster or placard whose plate and letter colors change every 100 ms
  - live plus 3D: CG petals, particles or a whole world around a live person (saturation 170–190)
  - negative window and scribbles: inverted b/w video in a window ≈50 % of the width jumps between positions, with white handwritten lines on top
  - living postcard: a static collage where one element comes alive — a TV set inside the picture or a figure on a paper background (see gfx.collage)
status: hybrid
fallback: |
  code: object labeling (detector + drawn boxes), handwritten marks (stroke animation), print textures
  (halftone, paper, photocopy), color cycle, an inset window that jumps around. hybrid: cutouts and "live plus interface"
  (person mask via mediapipe or hf_remove_background). generation: 3D elements and worlds around a person, with consent;
  otherwise a library of ready-made overlays (particles, paper, tape).
params:
  layers: 2–4 heterogeneous layers, one of them live
  graphic_hold: 2–6 frames @25 fps (80–220 ms) per drawing of the graphic layer; the live layer changes every frame
  ui_burst: bursts of 7–8 frames (0.3 s) with pauses of 0.3–0.7 s
  bg_cycle: the background behind the cutout changes every 90–100 ms (2–3 frames @25 fps)
  static_share: 0.65–0.89 of the pixels still in the "living postcard" variant
  boxes: 2 px line at 288 px height (≈0.7 %), tag ≈4–5 % of the height, 3 colors by class, lowercase label
  marker: line ≈1 % of the frame height, red 200/60/90 or white; an oval draws over 3–6 frames
  palette: acid (saturation 130–190) or print (25–40, halftone, torn edges)
  duration: 1.5–8 s per scene; in a cut sequence, inserts of 0.5–1.5 s
when: |
  Explainer and tech videos (object labeling "the way a machine sees it", marks on a product), product and
  archive breakdowns (a moodboard with circled details), music videos and fan edits with a collage aesthetic, teasers and intros with a "magazine" feel.
  Tie the pace of the graphics to the beats: background and color changes on every eighth note, interface scrolling on the drum fills.
  No longer than 8 s in a row: then a "clean" live frame to give the eye a rest.
avoid: more than 3 heterogeneous layers at once is a mess; meaningless labeling (boxes on everything); small labels under 3 % of the height in vertical video; print texture on faces in close-up without need; an acid palette in a calm or luxury video; boxes lagging behind objects (drifting tracking)
sfx: interface clicks and "beeps" when boxes appear and screens change; paper rustle and marker squeak on the marks; glitch ticks on background changes; a soft rustle for 3D particles
genres: {explainer: signature, fanedit: allowed, viral: allowed, product: allowed, fashion: allowed, teaser: allowed, clips: allowed, ugc: allowed, phonk: allowed, calm: forbidden}
detect: |
  Custom measurement: live motion and a layer with repeated frames in the same frame at once (the graphics hold each drawing for
  2–6 frames), so the rate of change differs by region; a share of still pixels of 0.65–0.89 alongside a live area;
  thin rectangles of pure color (magenta, green) with tags ≈4–5 % of the height, moving with objects;
  red or white closed strokes growing over 3–6 frames; a halftone grid and torn edges.
  ed_motion: overlay-mask 0.3–0.9 (large areas stand still) or frequent cuts in part of the frame; no global motion.
  Difference from gfx.collage: there the whole frame is made of paper cutouts and photos; here the base is live video with a foreign layer.
  From anim.live_mix: there it is drawn characters. From gfx.floating_ui: there the interface is part of the story next to the subject.
engine: |
  labeling: detect_overlay(model='yolo-onnx', classes={person:'#ff00ff', object:'#33ff33', furniture:'#33ffcc'},
  line_px=0.007*H, label_h=0.045*H, track=True, every=1) over the clip.
  marks: annotate(shape='ellipse'|'arrow'|'scribble', target=track(object:<name>), color='#c83c5a', width=0.01*H,
  write_on=4 frames, t=on the beat) + text(style='serif', size=0.05*H).
  print: texture(kind='halftone'|'torn_paper'|'photocopy', amount=0.6) + step_print(hold=5) for the graphic layer.
  cutout: mask(method='hf_remove_background') → composite over bg_cycle(images, every=0.1 s) or over UI screens
  ui_scroll(burst=8 frames, pause=0.4 s). color: palette_cycle(colors=5, every=0.1 s). Keep the live layer at 25 fps.
gen_hint: mixed media music video frame, live action footage of <subject> layered with <torn paper cutouts / hand-drawn red marker circles / computer vision bounding boxes / phone interface screens>, graphic layers animated at a low choppy frame rate while the live footage moves smoothly
commands: ["make #3 mixed media with halftone and torn paper", "add neural-network-style object labeling at 0:05–0:09", "circle the sneaker with a marker on #2", "put the subject on a background of phone screens"]
related: [gfx.collage, anim.live_mix, anim.doodle_overlay, gfx.floating_ui, time.step_print, time.echo_trail]
evidence: {examples: 13, sources: 13, measured: "2 object labelings: 2 px lines at 288 px height, tags ≈4–5 % of the height, 3 class colors, boxes update every frame @14.3 fps; interface: background-change bursts of 7–8 frames @25 fps with pauses of 7–17 frames; living postcard: 65 % and 89 % still pixels; print texture at 4.5 fps with saturation 25; background change behind the cutout 90 ms, color cycle 100 ms; 3D petals and a CG world: saturation 169–186", confidence: medium}
