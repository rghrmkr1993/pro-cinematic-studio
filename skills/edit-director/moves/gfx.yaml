id: gfx.callout
family: gfx
group: graphics
level: B
aliases: [callout, callout box, pointer, arrow to object, object outline, label pointer, annotation, hotspot, labeled pin, object highlight]
what: a callout — a dot with a leader line, an arrow, an outline ring, target brackets or a darkened surround latches onto an object in the frame and labels it with a short fact; it stays on the object via tracking and appears exactly when the object is mentioned, or on a beat
frames: |
  1. Target: the object is found and tracked (box + anchor point) at least 0.3 s before the callout appears; the track is smoothed, the box
     jitters no more than 0.2 % W per frame.
  2. The pin dot "pops" on the anchor point over 4 frames @25 fps (5 @30 fps): ×0 → ×1.2 → ×1.0 (outBack); optionally a
     ripple ring from the dot (radius ×1 → ×2.5, opacity 0.6 → 0 over 10 frames @25 fps / 12 @30 fps).
  3. The leader line draws from the dot toward the free side over 6–8 frames @25 fps (7–10 @30 fps, inOutCubic): a 45° segment
     4–6 % H long and a horizontal "shelf" of 8–14 % W.
  4. The label plate unfolds from the end of the line in the direction the line runs (wipe mask, 6–8 frames); the text fades in
     last over 4 frames @25 fps (5 @30 fps), starting 2 frames before the wipe ends. The whole assembly takes 0.6–0.8 s (16–20 frames @25 fps /
     19–24 @30 fps) and finishes by the end of the word the narrator uses to name the object.
  5. Hold ≥ 1.5 s + 0.3 s per word of the label. The dot moves rigidly with the object, the plate follows with a "spring" lag
     of 2–4 frames so it does not jitter; the line stretches between them.
  6. Exit: reverse order over 6–8 frames (inCubic) or an overall fade of 4 frames @25 fps (5 @30 fps); if the object nears the edge (box
     closer than 5 % to the frame edge) or the track is lost for longer than 6 frames, the callout leaves early.
  Other forms: an outline ring draws over 8–12 frames from "10 o'clock" clockwise; an arrow has its shaft drawn over 8–12 frames and the head
  over 2 frames; target brackets converge from ×1.15 onto the object box over 6 frames; a darkened surround takes 8 frames to drop to 45–60 % brightness.
  Unmarked frame counts are @25 fps; for 30 fps multiply by 1.2 and round (4 → 5, 6–8 → 7–10, 8–12 → 10–14).
variants:
  - labeled pin — a dot, a shelf leader line and a plate with a fact; a series of 2–4 callouts on a product, one per beat ("specs")
  - arrow — a vector or "marker" arrow from empty space toward the object, the tip stops 2–4 % H short, 1–3 words next to it
  - outline — a circle or ellipse around the object draws over 8–12 frames, as a clean line or a marker stroke with overlap
  - target brackets — four corners converge onto the object box and "snap" into place, a small label by one corner (tech, sport)
  - darkened surround — everything except the object dims to 45–60 % brightness, the object and the label stay bright (sports breakdown, product)
  - price-tag sticker — a plate rotated by 4–8° with a number or word pops up by the object with a ×1.15 bounce (price, discount, "new")
  - who's who — short pointer labels above people in a group shot, each one follows its own head
status: code
fallback: |
  Requires an object track: a detector (onnx model) + optical flow with re-detection every 10 frames; if the object is not
  recognized by class, the user points it out once (a click or "left sneaker on #3"), then tracking takes over.
  If the object barely moves, pin to a frame point without tracking. A darkened surround following the exact silhouette is hybrid
  (mediapipe mask or remove_background); without a mask, an ellipse with a 3–5 % H feather. If the object is smaller than 3 % of the frame
  area, first magnify it (zoom.punch, lens.magnifier or cut.insert), then label it.
params:
  target: "track(object | face | person | point); the anchor point is the box center or a set point on the object; re-detection every 10 frames; One Euro smoothing (min_cutoff 1 Hz, beta 0.02) or EMA τ ≈ 0.1 s; jitter ≤ 0.2 % W per frame"
  dot: "diameter 1.2–1.6 % H (16:9) / 0.9–1.2 % H (9:16); accent fill, a thin #000 ring at 30 % opacity, 0.15 % H thick, so it reads on any background"
  leader: "thickness 0.25–0.35 % H (3–4 px @1920×1080, 5–7 px @1080×1920); shape: \"elbow\" (a 45° segment 4–6 % H long + an 8–14 % W shelf) or straight; angles 0 / 45 / 90° only; the line never crosses the object, faces or other callouts"
  type_class: "grotesque sans 600 (semibold), sentence case; numbers in tabular figures, 700; the font must cover the caption language; marker style: a handwritten marker font (as in type.hand_drawn); font size = em size"
  label_16x9: "font size 2.8–3.6 % H (30–39 px @1920×1080); up to 2 lines, ≤ 24 characters per line; plate height ≈ 1.8 × font size per line"
  label_9x16: "font size 2.2–2.8 % H (42–54 px @1080×1920), never smaller than 2 % H; up to 2 lines, ≤ 18 characters per line"
  plate: "padding 0.5 × font size on the sides and 0.3 × font size top and bottom, corner radius 0.2 × font size; plate-less variant: text with a 0.3 % H shadow"
  color: "line and dot: accent #FFC400 or white #FFFFFF with a 1 px shadow; plate #FFFFFF 92 % + text #111 (light) or #111 80 % + text #FFFFFF (dark); marker outline and arrow: red #E8323C or white; one accent per video; label contrast ≥ 4.5:1"
  ring: "thickness 0.5–0.8 % H; radius 0.55–0.70 of the object box diagonal, gap to the object ≥ 1.5 % H; draws over 8–12 frames @25 fps / 10–14 @30 fps (inOutCubic), starting at \"10 o'clock\", clockwise; marker style: open, with a 10–15° overlap"
  arrow: "shaft 0.6–1.0 % H, head 3–4 shaft widths, arc bend 20–40°; the shaft draws over 8–12 frames @25 fps / 10–14 @30 fps, the head pops in over 2 frames; the tip stops 2–4 % H short of the object; the arrow comes from an empty part of the frame"
  brackets: "corners 15–20 % of the box side, thickness 0.4 % H, 3 % margin from the object; converge from ×1.15 to ×1.0 over 6 frames @25 fps / 7 @30 fps (outCubic)"
  spotlight: "brightness outside ×0.45–0.60 over 8 frames @25 fps / 10 @30 fps; ellipse = object box × 1.25, edge feathered by 3–5 % H; optionally a slight background blur of 0.3 % W"
  in: "dot 4 frames @25 fps / 5 @30 fps (outBack) → line 6–8 / 7–10 frames (inOutCubic) → plate 6–8 / 7–10 frames (wipe) → text 4 / 5 frames (fade); whole assembly 0.6–0.8 s"
  timing: "speech: the dot lands on the first frame of the object word minus 2 frames (from word-level timestamps), assembly complete by the end of the word (+0…4 frames); music: dot on the beat, label on the next half-beat; series: a step of 1 beat or 8–12 frames @25 fps / 10–14 @30 fps"
  hold: "≥ 1.5 s + 0.3 s per label word, but no longer than the object stays in frame"
  out: "reverse order 6–8 frames @25 fps / 7–10 @30 fps (inCubic) or fade 4 / 5 frames; early exit if the box is closer than 5 % to the edge or the track is lost for > 6 frames"
  layout: "the label goes toward the side with the most free space (little texture, no faces or captions); 9:16: everything within x 0.06–0.88 and y 0.12–0.80 (top 12 %, bottom 20 % and right 12 % are platform UI); 16:9: margins ≥ 5 %; at once ≤ 3 callouts in 16:9 and ≤ 2 in 9:16"
when: |
  Explainer and product are the main use: a detail, feature or spec at the moment the voice names it
  ("this seam right here…"); a series of 2–4 pins on a product in the build, one per beat. UGC: a "look here" arrow or outline
  on the hook (first 1–2 s). Clips: an outline around whatever is being talked about. Sport: a darkened surround on a player or target brackets
  0.5–1 s before the key action, ideally on a freeze frame. Travel: a pin with the place name on a landmark. Fashion: labels for the pieces
  of the look in a minimal style. Teaser: only an outline of a detail, no label. Product outro: one callout with the price
  or the main fact by the packshot, together with the CTA. Limit: ≤ 1 callout per 3–4 s of speech, series ≤ 4, at once ≤ 3 (16:9) /
  2 (9:16); do not use on the drop or in fast cutting, there is no time to read them.
avoid: |
  A callout that does not stick to the object (drifts or jitters more than 0.2 % W per frame) is worse than none; a label
  over a face or captions; lines crossing the object or each other; more than 3 words on a plate in fast-moving sections;
  holds shorter than 1.5 s and callouts on shots shorter than 1.5 s; different callout styles in one video; small text below
  2 % H in vertical video; an arrow jammed right up against the object; unverified facts in labels; epic, calm,
  dramatic tone, phonk and fan edit: pointers break immersion.
sfx: |
  Pin dot: a short "pop" or "tick" (−18…−22 dB under the voice) on the frame it appears, align='attack'; line and plate:
  a quiet whoosh of 0.2–0.3 s (sfx.whoosh); marker outline: a marker scratch for the duration of the drawing; darkened surround:
  a soft low "inhale" or sfx.impact at −18 dB at the moment of full dimming; a series of pins on beats needs no sound.
genres: {explainer: signature, product: signature, ugc: allowed, clips: allowed, viral: allowed, sport: allowed, travel: allowed, motivation: allowed, epic: forbidden, calm: forbidden, drama: forbidden, phonk: forbidden, fanedit: forbidden, fashion: forbidden, teaser: forbidden}
detect: |
  Custom check (ed_motion does not do it): thin straight lines (Hough transform) 0.2–0.4 % H thick at 0 / 45 / 90° angles,
  one end at a small circle or at the object, the other at a short text plate (OCR: 1–4 words, ≤ 2 lines);
  or a ring around the object, or a triangular arrowhead, or four corners around the object box. Over time:
  line and arc length grows over 6–12 frames (drawing), the dot pops with a ×1.2 overshoot; the graphics move together
  with the object: their displacement matches the local motion of the object region (optical flow), not the global
  motion of the frame; darkened surround: brightness outside the ellipse drops by 40–55 % over 6–10 frames while it stays unchanged inside.
  ed_motion: global events are those of the shot itself; overlay-mask is low (the graphics ride with the object), on a static
  shot 0.01–0.06.
  Differences: type.margin_notes is a handwritten list next to the subject with no anchoring to an object; gfx.mixed_media is object
  labeling and scribbles as texture (many boxes, a choppy pace of 2–6 frames per drawing); lens.magnifier is a circle with magnification
  inside; type.lower_third is a caption for the shot in the bottom strip without a pointer; anim.doodle_overlay is faces drawn on objects;
  type.diegetic is lettering on a surface with that surface's perspective; cut.insert is a cut to a close-up instead of graphics.
engine: |
  callout(target=track(object:<name>|face|person|point:[x,y], redetect=10fr, smooth='one_euro(1.0, 0.02)'),
          kind='pin_label'|'arrow'|'ring'|'brackets'|'spotlight'|'tag'|'who', text='<fact ≤ 24 chars>',
          side='auto' → free_side(target, avoid=[faces, subtitles], safe_zone='tiktok'),
          dot={d:0.014*H, color:'#FFC400', pop:'4fr outBack', ripple:{to:2.5, dur:10fr}},
          leader={shape:'elbow'|'straight', diag:0.05*H, shelf:0.11*W, w:0.003*H, draw:'7fr inOutCubic'},
          label={class:'grotesk', weight:600, size:0.032*H (16:9) | 0.025*H (9:16), plate:'#FFFFFF', alpha:0.92, color:'#111',
                 pad:[0.5, 0.3], radius:0.2, reveal:'wipe(7fr)+fade(4fr)', lag:3fr},
          t=[word_ts(object)-2fr, ...] | beat_sync(event='callout_in', grid='1/4'), hold='auto',
          out='reverse(7fr, inCubic)'|'fade(4fr)', exit_on_edge=0.05, lost_track=6fr)
  — composite primitive = shape(...) + text(...) + track(...); frames are given @25 fps, for 30 fps multiply by 1.2 and round.
  free_side(target, avoid, safe_zone) — new: the side with the most free space (texture, faces, captions).
  spotlight(target, dim=0.5, feather=0.04*H, shape='ellipse'|mask('mediapipe_person'|'hf_remove_background'), dur=8fr) — new.
  outline: shape(kind='ring', around=target, scale=0.62, w=0.006*H, draw_on=10fr, start=300°, cw=True, style='vector'|'marker').
  arrow: shape(kind='arrow', from=free_point, to=target, gap=0.03*H, w=0.008*H, head=3.5, curve=30°, draw_on=10fr, head_pop=2fr).
  target brackets: shape(kind='brackets', around=target, arm=0.18, w=0.004*H, from_scale=1.15, dur=6fr, ease='outCubic').
  series: callout_series(items=[...], step='1/4'|0.4, max_on_screen=3|2) — new.
  + sfx('click', at=dot_in, gain=-20dB, align='attack').
  check: qa_track_jitter(layer, max=0.002*W) — new; qa_overlap(face|subtitles); qa_text_safe_zone(layout='tiktok').
gen_hint: clean product shot of <product> on a plain seamless background, the product slightly left of center, generous empty space on the right for labels, soft even studio light, static camera, sharp details, no text, no logos
commands: ["label the seam on the sneaker with a callout when he talks about it", "three spec pins on the product, one per beat", "circle the ball before the kick in #4", "darken everything around the player at 0:12", "a \"look here\" arrow on the hook"]
related: [type.margin_notes, gfx.mixed_media, gfx.counter, lens.magnifier, cut.insert, zoom.punch, type.lower_third, anim.doodle_overlay, product.hero, time.freeze]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
