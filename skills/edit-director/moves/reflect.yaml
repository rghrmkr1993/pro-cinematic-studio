id: reflect.surface
family: reflect
group: optics
level: B
aliases: [reflection shot, reflection, water reflection, puddle reflection, mirror floor, reflection in glass]
what: the character is shown not directly but through a reflection — in water, a puddle, a glossy floor, metal, a lens or glass; a double, an upside-down world, a view "from the outside"
frames: |
  1. The camera films the surface: the frame holds only the reflection (5 of 8) or the boundary "original above the reflection" (a line in the lower third).
  2. The reflection is distorted by the surface itself: water and puddles — upside down, with ripples; convex metal and a lens —
     a small, stretched or curved figure; a glossy floor — a blurred dark double; glass over a picture —
     a semi-transparent face over the image behind the glass (a natural double exposure).
  3. The reflection is darker and softer than the original (≈ by 0.3–1 stop, details blurred); on water in daytime — almost the same brightness (sky).
  4. The camera is locked off, the shot holds 2–6 s; motion comes from the character or the surface itself.
  5. Payoff: the surface is disturbed — a hand touches the water, rings run across the reflection and it breaks up within ≈ 1 s
     (25 frames); or a cut to the real character, sometimes through a white flash of 1–3 frames.
variants:
  - water or a puddle — the character upside down, ripples, a touch breaks the reflection
  - glossy floor or table — a figure and its dark double below the contact line
  - convex object or lens — a tiny curved figure in a shiny surface
  - narrow strip (a blade, the edge of a mirror) — only the eyes are visible
  - glass over a poster or painting — a face over the image
  - car body and car glass — the character and the street in one curved reflection
status: footage
fallback: hybrid simulation — a reflection in water or gloss from any shot of the character via a mask — a copy flipped along the line of the feet, 0.5 stop darker, slightly blue or matched to the surface color, ripple displacement 0.5–1.5 % H; to "break" the reflection — ramp the ripple up to 3–5 % H over 0.5–1 s; otherwise search the source footage (puddles, shop windows, gloss) or generate
params:
  darken: 0.3–1 stop (glossy floor ≈ 0.7), saturation ×0.8
  axis: the contact line (feet, the surface edge), usually 0.6–0.85 of the frame height; a "reflection only" frame — flip the whole frame
  ripple: amplitude 0.5–1.5 % H, wavelength 3–8 % H, 0.5–1.5 Hz; vertical blur 0.3–0.8 % H
  disturb: ripple growth to 3–5 % H over 0.5–1 s (12–25 frames) centered on the touch point, then decay over 1–1.5 s
  tint: water — toward the sky color (#7fa3c0 at 15–25 %), floor — warm, toward the wood color
  glass_overlay: face over the picture — screen, opacity 0.35–0.5
  shot_length: 2–6 s; transition to the real character — a cut or a white flash of 1–3 frames
when: introducing the character "through a reflection", self-discovery, dreams and an upside-down world, travel and nature (mountains and sky in a lake), a product on a glossy surface; the "break the reflection" payoff — on a hit or a change of section in the track
avoid: frequent repetition; murky water and dirty glass for no reason; a fake reflection whose perspective doesn't match or that lacks surface distortion; a reflection where the face is unreadable when the emotion matters
sfx: water — a splash or a drip on the touch, a soft hum; gloss and glass — a quiet chime or a pad; flash transition — a short whoosh
genres: {drama: allowed, teaser: allowed, travel: allowed, fashion: allowed, fanedit: allowed, calm: allowed, product: allowed, motivation: allowed}
detect: |
  The reflection is often flipped: the top and bottom of the scene are swapped (head at the bottom), sky at the bottom of the frame; ripples — wavy
  horizontal displacements that run across the frame while the camera is static; a convex surface gives a distortion
  similar to a fisheye, but only inside the object. A double below the contact line: gradient correlation between the top and the
  flipped bottom > 0.2 around a horizontal axis, the bottom darker. ed_motion: the camera is static, no events or
  local motion (ripples, nonrigid > 0.5).
  Differences: a mirror — a clear, non-flipped reflection in a frame (reflect.mirror); shooting through glass — a moving
  semi-transparent layer over the character (reflect.window); the mirror effect (symmetric joining of halves) — the seam exactly in the center,
  without surface distortions.
engine: |
  search: reflection_detect(shot) → {kind='surface', axis_y, flipped_score, ripple}
  simulation: mask('mediapipe_person') → water_reflection(axis_y=feet, darken=0.5, saturation=0.8, tint='#7fa3c0', tint_amount=0.2,
            ripple_amp=0.01*H, ripple_len=0.05*H, ripple_hz=1.0)
  break: water_reflection(ripple_amp=[0.01, 0.04]*H, center=touch_point, t=[t0, t0+0.8], ease='outQuad') + sfx('splash', at=t0)
  glass over a picture: composite([art, face], blend='screen', opacity=0.4)
gen_hint: upside-down reflection of a person standing at the edge of calm water, only the reflection is in frame, soft sky in the water, gentle ripples, then a hand touches the surface and the reflection breaks into rings, static camera, cinematic
commands: ["show the character first as a reflection in a puddle", "make a reflection of the character on a glossy floor on #3", "break the reflection in the water on the drop", "pick shots with reflections from the source footage"]
related: [reflect.mirror, reflect.window, trans.double_exposure, light.silhouette]
evidence: {examples: 8, sources: 8, measured: "camera static in 7 of 8 (ed_motion without events); water — touch at ≈ 0.7 s, the reflection breaks up by ≈ 2.1 s; glossy floor — double below the axis at ≈ 0.8 H, darker by ≈ 0.7 stop (correlation weak, 0.23); transition through white frames (3 flash frames) in 1 of 8; the rest — visual analysis", confidence: medium}
