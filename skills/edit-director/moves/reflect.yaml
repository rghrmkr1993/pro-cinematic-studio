id: reflect.mirror
family: reflect
group: optics
level: A
aliases: [mirror shot, mirror, shot in the mirror, mirror reflection, rear-view mirror shot]
what: we see the character in a mirror — the mirror becomes a frame within the frame; talking to oneself, a double, the "true face", watching from the outside
frames: |
  1. The mirror is a frame within the frame: ≈ 20–85 % of the area (a shard ≈ 20–25 %, a wall mirror ≈ 35–45 %, an oval near the face ≈ 85 %);
     a rear-view mirror is shot so tight that it fills the whole frame.
  2. Around it — a wall, a dark room or the character's own back: a dark blurred foreground ≈ 25 % of the frame, focus on the reflection.
  3. The camera is locked off or pushes in slowly (×1.06 over 0.45 s — ×1.2 over 3 s); shot 2–6 s; it shakes only in a car.
  4. Action inside the mirror: looks themselves in the eye, touches their face, cries, adjusts their look; or walks away —
     the reflection of the room stays empty after ≈ 2 s; or the mirror opens (a cabinet door) and shows what is behind it.
variants:
  - the face in the mirror in close-up — emotion, talking to oneself
  - over the shoulder into the mirror — the character's back blurred in the foreground, the face in the reflection
  - shard of a broken mirror — a fragmented character in a small shard against a dark background
  - rear-view mirror — the driver's eyes or passengers in a narrow strip
  - empty mirror — the character has left, the reflection of the room remains
  - camera behind the mirror — the character approaches the mirror as if it were the camera, opens the door, the view changes
status: footage
fallback: search the source footage for mirror cues (detect); code only does the entry "into the mirror" — a zoom-in on the mirror area until the reflection fills the whole frame, and a cut to the "reflection world"; a convincing mirror from scratch — generation
params:
  mirror_area: ≈ 20–85 % of the frame; the face in the reflection 15–40 % of the frame height
  placement: mirror on the thirds (center x 0.3–0.7), less often centered
  focus: sharpness on the reflection, the real foreground soft
  move: static or a push-in ×1.05–1.2 over 2–4 s, ease inOutQuad
  hold: 2–6 s
  enter_mirror: zoom-in on the mirror area until it fills the frame over 0.8–1.5 s (20–38 frames), inCubic, then a cut
when: a moment of self-realization, a confession, a crisis, "getting ready" before going out (fashion, UGC try-on), horror and anxiety (something is wrong in the mirror), dialogue in a car through the rear-view mirror, a transition "into another world" through the mirror
avoid: the camera or crew visible in the mirror; text in the reflection not flipped (gives the fake away); many mirror shots in a row; the face in the mirror too small when the emotion matters
sfx: quiet scene — room tone, breathing; horror — a low rumble, a sharp hit on an appearance; entering the mirror — a soft whoosh or a "glassy" chime
genres: {drama: signature, teaser: allowed, fashion: allowed, ugc: allowed, fanedit: allowed, motivation: allowed, calm: allowed, viral: allowed}
detect: |
  A frame within the frame with a clear border (rectangle, oval, arch, shard; often a light rim or a sharp edge),
  inside — a scene with a different perspective and mirror-flipped text; a face inside the frame; sometimes outside it
  the same clothes seen from behind (the real character). ed_motion: the camera is static, movement only inside the region; with the "camera
  behind the mirror" the character looks straight into the lens and reaches toward it.
  Differences: a window — a different space behind the frame, not flipped, no double; screen within a screen — a glowing
  plane with an interface; a reflection in water and gloss — flipped vertically and distorted (reflect.surface).
engine: |
  search: reflection_detect(shot) → {kind='mirror', region, flipped_text, face_inside}
  mirror entry: transform(scale=[1, 1/region_w], center=region_center, t=[t0, t0+1.2], ease='inCubic') + cut(at=t0+1.2)
  editing: hold the mirror shot 2–6 s, place it before the character's change of state
gen_hint: close-up of a person looking at their own reflection in an oval wall mirror, the real person soft and out of focus in the foreground, the reflection in sharp focus, dim moody room light, static camera, intimate cinematic
commands: ["find shots with a mirror in the source footage", "put a mirror shot before the chorus", "do a mirror entry on #6 and a cut to the next scene", "through the rear-view mirror in the car dialogue"]
related: [reflect.surface, reflect.window, pov.mirror, pov.object, frame.central]
evidence: {examples: 6, sources: 6, measured: "mirror share visually ≈ 20–85 % (shard, wall mirror, oval), rear-view — the whole frame; camera static in 4 of 6 (ed_motion without events), push-in ×1.058 over 0.45 s; only the car shakes (jitter 1.9 %); the character leaves the mirror within ≈ 2 s; camera-behind-the-mirror — the door opens at ≈ 4.4–5 s", confidence: medium}
