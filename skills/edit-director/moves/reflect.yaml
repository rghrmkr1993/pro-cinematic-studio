id: reflect.window
family: reflect
group: optics
level: B
aliases: [through-glass shot, shooting through glass, through the car window, reflections on glass, window reflection, glass reflection overlay, through the windshield]
what: the character is filmed through glass (a car window, a shop window, an apartment window) — reflections of the street, trees, lights slide across the face; two layers of the world in one frame, pensiveness and the road
frames: |
  1. The camera is outside the glass, the character inside and almost still: sitting, riding, looking out of the window.
  2. On the glass — a reflection of the outside world (sky, treetops, streetlights, neon): soft, out of focus, semi-transparent;
     adds +40…+70 of 255 of light, mostly on the dark parts (hair, clothes, shadows), on light skin it is almost invisible.
  3. The reflection drifts: in a moving car 0.5–1.3 % of the width per frame @25; a light streak 14–16 % W wide
     crosses the frame from left to right in ≈ 3 s (≈ 1.3 % W per frame); at a stationary window the reflection stays put,
     while the camera slowly pushes in (×1.39 over 2.9 s).
  4. The frame often includes the edge of the glass — a door, a seal, a rounded window corner — as a dark line or a darkening on one side.
  5. The shot holds 3–6 s; a bright reflection passing across the face is an emotional point within the shot.
variants:
  - side car window by day — trees and sky run across the face
  - night road — neon and streetlights pass across the faces in streaks
  - windshield — the driver is still, treetops and sky stand in the glass
  - house window or shop window — city lights over the character, a slow push-in
  - train or bus — the landscape and the reflection of the interior together (travel)
status: code
fallback: code simulation — flip a second clip (trees, lights, city) horizontally, blur it, combine it with screen at 0.25–0.55 opacity and move it at road speed; a real through-glass shot is better — search the source footage for two-layer motion (detect) or generate
params:
  overlay_opacity: 0.25–0.55 (screen or lighten); by day 0.25–0.35, at night for lights 0.4–0.55
  overlay_blur: 1–3 % H — the reflection is always softer than the character
  overlay_speed: in a car 0.5–1.5 % W per frame @25, against the direction of travel; a house window 0.05–0.3 % W
  overlay_content: by day treetops and sky, at night streetlights, neon, headlights; city — windows and lights
  overlay_flip: mirrored horizontally
  subject_contrast: ×0.85–0.95 (the glass adds a slight "veil")
  glass_edge: darkening of 5–10 % of the width on one side or a dark line of the window frame
  hold: 3–6 s
  streak: light streak 12–16 % W, passes in 2–3 s
when: the road, a journey, pensiveness, sadness, waiting, a night city, travel transitions between locations; a calm verse or bridge; works well as a pause after a noisy scene
avoid: fast, hard-hitting parts of the track; an overlay so dense it hides the face; an overlay flowing in the opposite direction to the car's movement; a sharp (in-focus) reflection — looks like a double exposure, not glass
sfx: road or cabin noise, a muffled street, rain on the glass; the outside sound is muffled — as if behind glass
genres: {travel: signature, calm: allowed, drama: allowed, fanedit: allowed, teaser: allowed, fashion: allowed, motivation: allowed, ugc: allowed}
detect: |
  Two-layer motion: after subtracting the global shift a semi-transparent layer remains, drifting 0.5–1.5 % W per frame
  (Farneback), while the character stays still; added light above the 10th percentile over time +40…+70 on 10–37 % of pixel-frames,
  mostly on dark parts; the reflection is soft and mirrored; the glass frame at the edge of the frame.
  ed_motion: no global events or a slow push-in, nonrigid high with small overall motion.
  Differences: double exposure — both layers sharp, mixed deliberately, often via a dissolve; flash and flicker —
  the brightness of the whole scene changes rather than a shape sliding; a mirror shot — the reflection is the character (reflect.mirror).
engine: |
  reflection_overlay(layer=clip('trees'|'city_lights'|'neon'), flip_x=True, blur=0.02*H, blend='screen', opacity=0.35,
                     speed=0.01*W per frame, direction=-travel, tint=None, t=[t0, t1])
  + color(contrast=0.9) + vignette(side='left', amount=0.2)
  search: reflection_detect(shot) → {kind='window', overlay_speed, additive_light}
gen_hint: shot from outside a car side window, a person sitting inside looking out, reflections of passing trees and sky sliding across the glass over their face, soft out-of-focus reflections, quiet melancholic mood, natural light, cinematic
commands: ["add tree reflections on the glass on #4", "night lights sliding across the faces in the car — on the bridge", "find shots through a car window in the source footage", "make the shot look as if through glass, slow reflections"]
related: [reflect.mirror, reflect.surface, trans.double_exposure, light.flash]
evidence: {examples: 6, sources: 6, measured: "residual layer 0.44–1.06 % W per frame @25 (Farneback, after subtracting the global shift); added light +39…+70 on 10–37 % of pixel-frames; light streak 14–16 % W crosses x 0.03→0.99 in 3.0 s; stationary window — push-in ×1.39 over 2.9 s; camera static in 5 of 6", confidence: medium}
