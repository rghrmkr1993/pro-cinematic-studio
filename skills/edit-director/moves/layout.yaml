id: layout.screen_life
family: layout
group: graphics
level: B
aliases: [screenlife, screen life, desktop film, screen-based film, full-frame interface, screen recording, UI shot, stream overlay, full-frame UI]
what: the whole frame is a device screen (a desktop, a browser, a messenger, a feed, a phone camera, a stream with chat, a terminal), and the story is told through actions in the interface — taps, the cursor, pop-up windows, scrolling and typing
frames: |
  1. Frame: the interface fills 100 % of the frame, the device body isn't visible; at the top a system bar or a browser header
     4–10 % of the height; buttons, lists, windows with a close button, a system font. A clean screen capture is flat and sharp
     (static camera, jitter < 0.05 % of the frame); a filmed screen — a macro of keys with a shallow depth of field, or a
     terminal: green monospace text on black (frame brightness < 10).
  2. Action: windows and notifications pop up in a cascade every 0.1–0.3 s, each 5–14 % of the area, offset in a
     staircase; the feed scrolls in jerks of 0.4–0.5 s at 35–50 % of the frame per second (1.3–2 % per frame);
     a finger tap or the cursor presses a button; text is typed letter by letter; a large action-confirmation banner
     slides across on top.
  3. Camera over the interface: a digital zoom-in to the active element ×1.7 over 1.5 s on an S-curve, shifting toward it (center
     in a corner of the screen); a device change — the browser window crumples and turns into a phone screen.
  4. Hybrids: a cut-out author (chroma key) over a scrolling feed, at the bottom to one side; a stream layout — a webcam window
     ≈60 % of the width on the left, a chat column ≈20 % on the right, a game window ≈30 % bottom right, entering it — a jerk transition
     of 3 frames from a full-screen game; a phone camera interface with a face-detection frame.
variants:
  - messages and notifications: messages and windows pour down in a cascade, a comic pile-up
  - window collage: a picture assembles from dozens of pop-up windows, each showing its own part
  - desktop → phone: the story runs through a browser, search and profiles, the window turns into a mobile screen
  - feed and author: scrolling a list or a feed, with a cut-out host reacting on top
  - stream overlay: webcam, chat and game window in a branded frame
  - phone camera: a camera interface with a face frame and buttons over the scene being filmed
  - terminal: command lines are typed on a black screen, then fade out
  - filmed screen: a macro of a keyboard and a finger, then a cut to the clean interface
status: code
fallback: |
  footage — the user's screen recordings (the real interface of their product or phone);
  code — neutral interface templates (no third-party logos or brand colors) are rendered to PNG and filled with
  the user's clips, images and text; generation is no good for large interface text (the letters
  get distorted) — only for backgrounds and macro shots of a "filmed screen"
params:
  coverage: interface 100 % of the frame; system bar 4–10 % of the height; key text no smaller than 3–4 % of frame height in vertical video
  popup: a new window every 0.1–0.3 s (3–8 frames @25 fps), 5–14 % of the area, cascade offset 3–6 % in x and y; appears with outBack over 3–5 frames
  scroll: 35–50 %/s (1.3–2 % of the frame per frame) in jerks of 0.4–0.5 s, a stop with a 2–3-frame bounce
  zoom_to_element: ×1.5–2 over 1–1.6 s, inOutCubic, centered on the element (can be near the frame edge)
  typing: 8–15 characters/s ≈, cursor blinks at 2 Hz; terminal — monospace, green on black
  cutout_host: cut-out host 35–45 % of frame height in a bottom corner
  stream_layout: webcam 55–65 % of the width, chat 18–22 %, game window 25–35 % ≈
  shot_length: 2–6 s per screen fragment (50–150 frames @25 fps); one interface per scene
when: a hook in viral and UGC videos — messages, notifications, "I'm buried in messages"; explainer and product videos — a demo of an app, a service, a search; storytelling through chats and a browser (screenlife drama, a thriller teaser); a reaction or a stream — the host over the feed; a meme collage of windows; place notifications and taps on the beats of the track
avoid: recognizable third-party interfaces, logos, real usernames and personal data in the frame (rights and privacy); small unreadable text; more than 5 new windows per second without a narrative payoff; a static screen longer than 4 s with no action; mixing three or more different interfaces in one scene
sfx: system sounds — a short "ping" or click for each window and notification (on the beat), mouse clicks, keyboard clatter while typing, a whoosh on an app switch, an "error" sound on a comic cascade, typing ticks in the terminal
genres: {explainer: signature, ugc: allowed, viral: allowed, product: allowed, drama: allowed, teaser: allowed, clips: allowed, fanedit: allowed, motivation: allowed}
detect: |
  ed_motion: static camera (jitter ≤ 0.05 %, up to 0.3 % for a filmed screen); scrolling — vertical SHIFT 1.3–2 %/frame
  in jerks of 0.4–0.5 s; digital zoom-in ×1.5–2 with nonrigid < 0.08 (a flat picture); fast window changes produce false cuts.
  Own check: frame changes happen in rectangular areas of 5–14 % of the area with straight edges (new windows);
  bright frames (brightness 140–215, low saturation) or a black terminal (< 10); sharp pixel text, a system bar.
  Differs from layout.screen_in_screen: there the screen is visible inside the scene with a bezel and a room around; here the frame is the screen.
  Differs from gfx.floating_ui: there the windows hang in a live scene next to the subject.
  Differs from pov.screen: there the camera looks out of the screen at a person through a mirrored interface.
engine: |
  new primitive ui_frame(template='chat'|'feed'|'desktop'|'browser'|'phone_camera'|'stream'|'terminal', theme='neutral',
    slots={video: clip, image: [...], text: [...]}, status_bar=True, safe_zone='tiktok') — renders an HTML template to PNG + inserts clips into the slots
  new primitive popup_cascade(items=[image|text], every=0.2, offset=[0.04, 0.04], scale_in='outBack', dur_in=0.15, max_visible=8, beat_sync=True)
  new primitive cursor_path(points=[[x,y,t]...], clicks=[t...], style='arrow'|'finger', ripple=True)
  scrolling: transform(shift=[[0,0],[0,-0.2]], t=[t0, t0+0.45], ease='outCubic') over a tall render of the feed, repeated in jerks
  typing: text(content, anim='typewriter', cps=12, cursor_blink=2)
  zoom to element: transform(scale=[1, 1.7], center=element_xy, t=[t0, t0+1.5], ease='inOutCubic')
  host: mask(method='selfie') + composite(layers=[ui_frame, person], pos='bottom_left', height=0.4)
  sound: sfx('click', at=each_window, align='attack') (+ a new sfx kind 'ping')
