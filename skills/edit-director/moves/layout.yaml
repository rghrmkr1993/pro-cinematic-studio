id: layout.aligned_split
family: layout
group: graphics
level: B
aliases: [aligned split, half and half, face from two halves, body from two people, spatial cut, composite frame, spatial rhyme, exquisite corpse]
what: the frame is assembled along straight seams from parts of different shots, aligned so that together they form one object — a face from two people, a body from two dancers, day and night of one view, one strike from two sports; a "match cut", only in space rather than in time
frames: |
  1. Selection: two or three shots with the subject or lines in the same place and at the same shot size — the same angle and camera height,
     the face or body centered, the horizon at the same height; or takes from one static camera at different times.
  2. Seam: a straight line through the object itself — a vertical exactly at the center (0.50 in 6 of 6 "halves"), a horizontal
     at 0.46–0.50 (top/bottom) or on the thirds (0.34 and 0.68 — three bands of a face). No gap (17 of 20 split
     examples), once — a thin line ≈1 % of the frame. The seam isn't hidden: the brightness step across it is 7–60 levels
     (median ≈24 versus 3–25 inside a whole frame); unity is held by geometry — contours, the face axis, the eye line,
     the horizon continue across the seam (profile correlation at the seam 0.23–0.83, median ≈0.55, versus −0.23…0.07
     for deliberately mismatched parts).
  3. Life of the parts: the parts change independently — one half stays, the other is replaced (a change on only one
     side of the seam), the camera moves the same way in both parts (motion correlation between halves 0.80–0.98) or is static.
  4. Rhythm: a pair holds 0.35–1.7 s (typically 0.5–0.8 s, on the beat) and is hard-cut to the next pair; one
     half is replaced every 0.5 s; "boiling" face bands reshuffle every 1–3 frames (40–210 ms); the whole
     construction 1.2–5.6 s.
  5. Entry and exit: a cut straight into the split frame (most), a seam sweep across the whole frame in ≈2 s or
     replacing the object with rectangular pieces in ≈0.5 s; exit — to the full frame of one of the parts.
variants:
  - two halves — one subject: the left half of one person and the right half of another (or of one person in two places, times, costumes) along the axis of the body or face; in motion — both takes shot with identical camera moves
  - pairs in a series: two athletes, buildings or objects split in half, a strike or a gesture continues across the seam; a new pair every 0.56–1.7 s
  - top/bottom: the top half of one shot and the bottom half of another — the subject's head stays the same while jerseys with different numbers change every 0.5 s; a statue above a launch pad "takes off"; a hand holding a can above seated legs
  - face bands: three horizontal bands (1/3 of the height each) from different takes and shot sizes of one person, drifting and now aligning, now diverging; or 2–6 strips 15–40 % of the face width reshuffled every 1–3 frames
  - face flow: vertical strips gradually replace one face with another over 2–3 s
  - time along the seam: a static camera, different takes — columns with different people, a rectangle of daytime sky on a night view, a horizontal seam creeps from bottom to top over 1.9 s and turns night into day (≈1.9 % of the height per frame @25 fps, linear)
  - piecewise replacement: one object (a car in profile) is replaced by the same kind of object from another shot in 3–4 rectangles over ≈0.5 s
  - grid on one background: 3×3 cells with one subject in different looks on an identical white background — without gaps it reads as one wall (borderline with layout.frame_division)
status: code
fallback: |
  You need shots with a matching subject position and shot size — search the source footage for pairs by face, pose and horizon
  (find_split_pairs); transform fixes an inexact match (shift ≤ 5 % of the frame, scale ±8 %, rotation ≤ 3°).
  "Time along the seam" needs a tripod — without one, stabilize the takes on the background (stabilize + alignment on static
  points) and put the seam on a vertical of the scene (a column, a person). No second take — generate the second half
  from the first frame (same angle, a different subject or time) with the user's consent; as a last resort — a mirrored
  half of the same shot (fx.kaleidoscope, mirror) or a time offset of the same shot.
params:
  layout: half_v (vertical 0.50) | half_h (horizontal 0.46–0.50) | bands_3 (0.34 and 0.68) | strips (2–6 strips 15–40 % of the face width) | time_columns (seams along the scene's verticals) | patch (rectangles 15–45 % of the width) | grid_3x3
  gutter: 0 px; a thin line ≤ 1 % is acceptable (then it is already bordering on layout.split_screen)
  align: face or body axis on the seam ±3 % of the width, eye line and horizon ±3 % of the height, scale ±8 %, roll ≤ 3° (≈, visual)
  seam_step: the brightness step across the seam doesn't have to disappear (7–60 levels); align the geometry, and the color only if an "almost seamless" image is intended
  motion: both parts with the same camera move (correlation ≥ 0.8) or both static; different movements on the two sides of the seam — only as a deliberate device
  pair_hold: 0.35–1.7 s (9–43 frames @25 fps), typically 0.5–0.8 s; pair change — a hard cut on the beat
  half_swap: one half replaced every 0.5 s (½ beat at 120 BPM), the other half continuous
  strip_shuffle: 1–3 frames (40–210 ms) per strip reshuffle
  seam_sweep: the seam crosses 90 % of the frame in 1.5–2 s linearly (≈1.9 %/frame @25 fps)
  patch_swap: 3–4 rectangles over 8–12 frames (≈0.5 s)
  duration: 1.2–5.6 s per construction
when: duality and kinship — one person out of two, "me and my double", generations in the same uniform, you here and there; music video and fan edit (the faces of two characters in one), fashion lookbook (a grid of looks, halves of outfits), sport (two sports — one movement, legends' numbers on one back), travel (half the frame city, half the frame sea, the same pose), "day and night" of one view, product "old — new"; a series of pairs — on a verse or a build, on the beat; seam sweep — on a section change; 1–2 constructions per video
avoid: a "roughly" matching alignment — an axis or eye-line offset of more than 5 % reads as an editing mistake; different camera height and lens (the perspective breaks at the seam); a seam across the eyes without intent; strips narrower than 6 % of the width on a phone; more than 6 strips — it is already a mosaic; holding a static split longer than 2 s without changes; different camera moves on the two sides of the seam without intent — the frame "tears"
sfx: pair change — a click or a hit on the beat; half swap — a short tick; strip reshuffle — dry clicks or a glitch stutter; seam sweep — the ambience of one side smoothly turns into the ambience of the other, following the seam; if both halves are talking — keep one voice
genres: {fanedit: signature, fashion: signature, teaser: allowed, viral: allowed, ugc: allowed, sport: allowed, travel: allowed, product: allowed, drama: allowed, clips: allowed, motivation: allowed, epic: allowed, explainer: allowed, phonk: allowed, calm: allowed}
detect: |
  Own check (ed_motion doesn't do it): search each frame for straight discontinuities — for each vertical (horizontal) the share of its length
  where the local step is > 6 levels and 2 times larger than the neighbors'; a line ≥ 0.3 of the length in ≥ 60 % of frames at 0.50, 0.46–0.50
  or 0.34/0.68 is a candidate. Signs of the move: (1) there is no solid-color band wider than 1 % along the seam; (2) the parts change
  independently — frame pairs where the difference is > 12 on only one side of the seam, cuts and camera moves differ between the sides;
  (3) the object crosses the seam: the face or body center within ±10 % of the seam, the eye line at the same height on both sides
  ±3 %, brightness profiles at the seam correlate ≥ 0.2 (typically 0.45–0.85), while the brightness step across the seam is 7–60 levels; (4) "time along the seam" —
  static background edges match (correlation > 0.8), while the brightness and color of the sides differ (day/night).
  Differs from layout.frame_division: there the parts don't have to form one object (a mosaic of different scenes, wallpaper of copies,
  three different people butted together); here the seam runs through the object and alignment is the point. From layout.split_screen: there is a border
  or a 0.6–6 % gap and the windows live separately. From cut.match: there the match is in time (a cut), here it is in the space
  of one frame. From trans.wipe: a wipe crosses the whole frame in ≤ 1 s and hides behind an object, while a split holds. From
  fx.duplicate: there clones are placed by a mask in a whole picture without straight seams. From trans.morph: there it is a smooth deformation.
engine: |
  aligned_split(clips=[a, b, ...], layout='half_v'|'half_h'|'bands_3'|'strips'|'time_columns'|'patch'|'grid_3x3',
              seams=[0.5] | [0.34, 0.68], align=track(face|person|horizon), tol_pos=0.03, tol_scale=0.08, tol_rot=3,
              gutter=0, swap=None|{side: 'a'|'b', every: '1/2'}, shuffle_every=None|1..3 (frames),
              seam_sweep=None|{from: 0.95, to: 0.05, dur: 1.9, ease: 'linear'}, patch=None|{tiles: 4, dur: 0.5}, t=[t0, t1])
  — first reframe/transform each part to a common axis (face, body, horizon), then cut along the seams and assemble;
  pair search: find_split_pairs(clips, by='face'|'pose'|'horizon'|'static_bg', tol_pos=0.04, top_k=10);
  series: aligned_split_chain(pairs, per_pair='1/2 bar'|'1 beat', cut='hard'); changes — beat_sync(grid='1/4');
  + sfx('click'|'impact', at=pair_change) + sfx('whoosh', at=swap) when a half is swapped.
gen_hint: "two shots for a seamless half-and-half composite: <subject A> and <subject B> filmed with an identical locked-off camera, same height, lens and framing, the face exactly centered at the same size, eyes at the same height, matching background, so the left half of one and the right half of the other form one face"
commands: ["a face from two halves: me and my brother, seam in the center", "half the frame day, half night — the seam moves up over 2 seconds", "join pairs of athletes in halves, a new pair on every bar", "a face from three bands of different takes on the chorus"]
related: [layout.frame_division, layout.split_screen, cut.match, trans.wipe, fx.duplicate, trans.morph, cut.vector_match]
evidence: {examples: 22, sources: 18, measured: "own search for straight seams (share of the line with a step), independence of the sides (frame difference on each side of the seam), profile correlation at the seam, phase correlation of the halves' motion, timing from the cuts: seams at 0.50 (6 of 6 halves), 0.46–0.50 (top/bottom), 0.34/0.68 (bands); gap 0 in 17 of 20 split examples; step across the seam 7–60 levels; profile correlation at the seam 0.23–0.83 (median ≈0.55) for aligned parts versus −0.23…0.07 for deliberately different ones; the halves' motion correlates at 0.80–0.98; pair 0.35–1.7 s, half swap 0.5 s, strips 40–210 ms, seam sweep 1.9 s; 2 examples without a visible seam (a camera orbit, fast background changes behind a static face)", confidence: medium}
