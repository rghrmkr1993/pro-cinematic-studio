id: layout.windowbox
family: layout
group: graphics
level: B
aliases: [windowbox, windowboxing, window on black, window on white, framed shot, window picture, passe-partout, framed clip, boxed frame, photo on a white background]
what: the shot doesn't fill the whole screen but sits as a window on a solid field (black or white) — lots of empty space around, a feeling of a photograph, an archive, a screen or a private moment
frames: |
  1. Field: black (#000–#0e1116) or white (#eef4f5–#fff), solid on all four edges, the same throughout the episode.
  2. One window in the center: 9–45 % of the frame area (typically 20–24 %), center 0.5 ± 0.05; aspect — native to the footage
     or a crop: vertical 0.63–0.76, square 1.0, 4:3, wide 1.75.
  3. Appearance: the window "pops out" from a point — 3 % → 21 % of the area in 0.24 s (6 frames @25 fps) — or floats in from the side
     in 0.4–0.6 s; exit — a fade of 0.2–0.3 s or sliding off past the edge.
  4. Rhythm: on every beat or cut the crop and height of the window change (every 0.14–0.6 s), the width holds;
     sometimes one shot full-screen (100 %) as a hit, then a window again.
  5. Several windows: diptych — 2 windows of ≈ 11 % each with a gap of ≈ 10 % of the width; collage — 6–17 fragments (eyes, lips)
     cover 53–64 % of the field and rearrange every 0.1–0.6 s.
  6. Styling: a hard edge, rounded corners, a thin "picture" frame, a torn paper edge
     or an instant photo with a white border and a wide bottom margin.
variants:
  - dark field: a window on black — intimate, "a screen in the dark", archive
  - light field: a photo on white — an album, a lookbook, memories
  - jumping window: the crop and height of the window change on the beats
  - window collage: pieces of a face or a scene laid out on the field and rearranging
  - photo stack: photos of one subject from different years change every 0.14–0.3 s with a ±3–8° rotation
  - instant photos: cards with a white border slide in and out, one at a time or in pairs
status: code
fallback: any material works; if the source is low-resolution, the window actually helps — a 0.3–0.5 scale hides the softness; a collage of face fragments needs a face mask (mediapipe face) — that is already hybrid
params:
  canvas: "#000000, #0e1116, #ffffff or #eef4f5 — one per episode"
  scale: window area 9–45 % (linear scale 0.3–0.67), typically 0.45–0.5 of the width
  aspect: native | 0.7 | 1.0 | 1.33 | 1.75
  position: center [0.5, 0.5] ± 0.05; diptych — centers 0.33 and 0.67, gap 0.08–0.1 W
  corners: 0 | 3–6 % of the window height
  border: none | a dark brown frame 1–1.5 % H | a white photo border 4 % with a ×3 bottom margin | torn edge
  pop_in: 0.24 s (6 frames), outCubic; slide-in from the side 0.4–0.6 s; fade 0.2–0.3 s
  rhythm: crop and window height change on every beat (0.14–0.6 s)
  collage: 6–17 cells, coverage 0.5–0.65, rearranged on the beat
  photo_stack: a new photo every 0.14–0.3 s, rotation ±3–8°, scale 0.25–0.8
  vertical_safety: in a 9:16 output the window ≥ 20 % of the area, otherwise it doesn't read on a phone
when: memories, archive and "found" footage, vertical video inside a horizontal video, a photo album of one subject, an intimate quiet moment, messaging and a screen, a music video intro; the "small window → full screen" contrast on the drop
avoid: details that must read on a phone (a window smaller than 20 % of the area); changing the field color within an episode; text and stickers over the window; a window in a dynamic action scene for no reason; a border whose color clashes with the shot
sfx: a shutter click for each new photo, a paper rustle as a card slides in, an interface "ding" for messages; for quiet moments — only room tone
genres: {fanedit: signature, fashion: allowed, teaser: allowed, clips: allowed, ugc: allowed, viral: allowed, calm: allowed, drama: allowed, explainer: allowed, travel: allowed}
detect: |
  A ring along the frame edge is solid (black ≤ 15 or white ≥ 238) in all frames, the content is a compact rectangle
  (or several) with straight edges and margins on all four sides; area 9–70 %. ed_motion: bars on the top,
  bottom, left and right at once > 0.05 (for a white field the bars aren't caught — an own check on the color of the frame border is needed);
  changes in window geometry coincide with cuts or beats.
  Differences: letterbox — bars only at the top/bottom (or on the sides), the picture touches two edges; split screen —
  panels fill the frame without a field; screen in screen — a device inside the scene; vignette — a soft darkening, not a rectangle.
engine: |
  windowbox(clip, canvas='#000', scale=0.47, aspect='native', center=[0.5, 0.5], corner=0.04, border=None|'frame'|'instant'|'torn')
  appearance: windowbox(scale=[0, 0.47], t=[t0, t0+0.24], ease='outCubic'); rhythm: windowbox(crop='beat_random', min_area=0.15, max_area=0.4, at=beats)
  collage: layout_grid(clips|face_parts, cells=9, cover=0.6, gutter=0.02, canvas='#000', reshuffle_on='beat')
  photo stack: photo_stack(images, every=0.2, rotate=6, canvas='#fff', border='instant') + sfx('click', at=each)
gen_hint: a small framed video window floating in the center of a pure black canvas, wide empty negative space all around, rounded corners, minimal editorial layout; alternatively instant photos with white borders laid on a white tabletop
