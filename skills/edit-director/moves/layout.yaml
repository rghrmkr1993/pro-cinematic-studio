id: layout.frame_division
family: layout
group: graphics
level: B
aliases: [seamless split screen, borderless split, frame division, shot mosaic, cubist face, face mosaic, seamless split, patchwork frame]
what: the frame is divided into halves, strips or rectangles from different takes with no borders or gaps — the parts butt up against each other and add up to one "almost seamless" picture — two people in one bed, a face from pieces of different takes, a stadium with a player pasted in
frames: |
  1. Division: 2–4 large zones (halves, thirds, a horizontal strip) or a mosaic of 6–40 rectangles;
     there is no divider strip between the zones — the edge of one take runs straight into another.
  2. The join is masked by composition: the seam follows a natural line (the edge of a bed, a wall, a door frame, a field
     line), and the lines of the scene — horizon, floor, face axis, body contour — continue across the seam with an error of a few
     percent. The eye first sees one picture, then notices the "glitch".
  3. Life of the zones: each zone plays its own take — its own pace, its own time (day / night, different people in the same
     bed), and a face mosaic moves out of sync: the mouth talks in one rectangle, the eyes blink
     in another. On the beats the zones rearrange: rectangles change size, disappear, appear one by one.
  4. Assembly and breakup: the parts slide together into a whole frame (two halves of a bed close up) or a whole frame
     cracks into a grid that fills with copies — up to a "wallpaper" of 50–200 tiny tiles.
variants:
  - seamless halves: two or three scenes side by side as one (neighboring beds, two people face to face, a third in the distance)
  - strip insert: a horizontal strip 15–35 % of the height — from another take (mouth, hands, jewelry), the rest from the original
  - face mosaic: eyes, mouths and cheeks from different takes of one face in rectangles, the grid offset
  - irregular rectangles: a stadium, a crowd, the sky and a player — rectangles of different sizes butted together
  - repeat grid: the same shot in 3×4–10×20 tiles, the tiles slightly out of sync in time — a wallpaper pattern
  - closing up: two halves slide together into a whole scene or the frame cracks into parts
status: code
fallback: joins with continuing lines need takes from one position (a tripod) — search the source footage for series shot with the same camera setup; if the camera differs — align the zones by the horizon and the face axis (reframe + transform) and put the seam on a contrasting line of the scene; without suitable takes — a mosaic grid from any close-ups (it doesn't hide the seam and doesn't need a match)
params:
  regions: 2–4 large zones or 6–40 rectangles; wallpaper grid 3×4…10×20 tiles
  gutter: 0 px — no gap; hard edge, feather 0–1 px
  seam: along a natural line of the scene; lines across the seam match with an error ≤ 2–4 % of frame height
  strip: strip insert 15–35 % of the height, across the center of the face (eyes or mouth) or along the line of the hands
  mosaic: rectangles 8–30 % of the frame width, the grid offset by ½ cell between rows; takes offset 2–10 frames from each other
  rhythm: zones rearrange on every beat or ½ beat (0.25–0.5 s at 120 BPM); tiles appear one by one — 1–3 frames per tile
  merge: halves close up over 8–15 frames (0.3–0.6 s), ease inOutCubic
  duration: 1.5–5 s per construction (38–125 frames @25 fps)
when: parallel lives (two people at the same time, day and night in one room), a portrait from many takes — emotions, performance, beauty and fashion, sport (player + crowd + sky), products or flavors side by side, a hook frame you want to study; rearrangements — on the beats, closing up — on a downbeat; 1–3 times per video
avoid: different color and exposure between zones when an "almost seamless" image is intended (the seam shows immediately); a seam cutting the face across the eyes without intent; tiles too small on a phone (under 6 % of the width they don't read); a random mosaic without rhythm — turns into noise; a split with borders — that is a different move (layout.split_screen)
sfx: a click or tick as each tile appears; on a grid rearrangement — a short glitch or whoosh; on the halves closing up — a dull thud or a rustle of fabric; face mosaic — voices or sounds offset in time, like an echo
genres: {fashion: signature, fanedit: allowed, viral: allowed, product: allowed, sport: allowed, teaser: allowed, drama: allowed, clips: allowed, ugc: allowed, explainer: allowed, motivation: allowed, phonk: allowed}
detect: |
  Own check: long straight discontinuities (vertical or horizontal) along 30–100 % of a frame side, across which
  texture, color or time change abruptly, but without a solid-color strip (otherwise it is a split with a border).
  Time: the zones on both sides of the seam change independently — high frame diff in one, ≈0 in the other; blinks,
  lip movements and steps don't coincide.
  ed_motion: the global estimate has a low share of inliers and high nonrigid with no real parallax;
  cuts inside one zone while the other stays unchanged.
  Differs from layout.split_screen: there a border or a 1–4 % gap separates the windows. From gfx.collage: there the cutouts follow the
  contour rather than being rectangles. From layout.windowbox: there it is a window on a solid field, here the whole frame is filled.
  From fx.kaleidoscope: there it is the mirror symmetry of one image. From layout.aligned_split: there the seam runs through
  one object and matching geometry on both sides is the point of the device; here the pieces don't have to add up to one whole.
engine: |
  frame_division(layout='halves'|'thirds'|'strip'|'mosaic'|'grid'|'free', regions=[{clip, rect=[x,y,w,h], src_offset, t_offset}],
                 gutter=0, align='horizon'|'face_axis'|None, reshuffle_on='beat', reveal='one_by_one', reveal_step=2)
  — rect in fractions of the frame; align lines up the scene's lines across the seam (reframe + transform of each zone);
  face mosaic: face_mesh(clip) → tiles over the eyes and mouth from different takes, t_offset 2–10 frames;
  closing up: transform(shift=[[−0.5,0],[0,0]]) for the left zone and mirrored for the right, dur=0.5, ease='inOutCubic';
  + sfx('click', at=each_tile) + sfx('whoosh', at=rearrange).
gen_hint: seamless split composition with no borders, the frame divided into <two halves | horizontal strips | a mosaic of rectangles> from different takes of <subject>, lines of the scene continue across the seams, overhead view, consistent lighting
commands: ["two beds side by side without a border: me by day and me by night", "a face from pieces of different takes on the chorus", "paste a strip with the smile from another take into #4", "the frame cracks into a grid of copies on the drop"]
related: [layout.split_screen, layout.windowbox, gfx.collage, fx.kaleidoscope, mask.double_exposure]
evidence: {examples: 26, sources: 17, measured: "visual review only of all examples in the section at 5 moments of the animation (scripted frame capture blocked by browser permissions); the number of zones and the sizes of strips and tiles are approximate (≈) estimates from frames; the timing of rearrangements was not measured", confidence: medium}
