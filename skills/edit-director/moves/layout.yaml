id: layout.split_screen
family: layout
group: graphics
level: B
aliases: [split screen, split, divided screen, screen in half, double screen, multi-panel, polyscreen, panels, multiscreen]
what: the screen is divided by a thin line or gap into 2–6 windows, each with its own shot, all running at the same time — parallel action, a comparison, a phone call, different times; windows can slide in, rearrange and rotate the border
frames: |
  1. Division: 2 windows butted against a line — vertically 50/50 (most often) or top/bottom 50/50; 3 windows — a wide strip
     at the bottom + two halves on top, or three columns 0.31/0.67; 4–6 windows in dynamic montages.
  2. Divider: a line of 0.6–1.8 % of the frame — black (almost 0) or white; in the "designer" variant thick white gaps
     ≈6 % of the width and solid color fields at the edges. Without a line it is already layout.frame_division.
  3. The window contents are independent: their own cameras, their own cuts, often a different grade (warm versus cool:
     mean RGB 83/45/22 versus 109/115/116), the motion in the windows isn't coordinated (correlation −0.3…0.35).
     Glances and movements are directed toward each other across the line (a call, an argument, a chase).
  4. The windows appear: right from the cut; the third window — by a cut after ≈1.2 s; in dynamic versions windows slide in and push each
     other, rearranging in 0.2–0.4 s (≈8 % of the width per frame), a new window every 1–1.5 s.
  5. Holds 1.2–7.5 s; exit — a cut to one window full-frame or the windows "collapsing".
variants:
  - vertical halves: two people in different places at the same time (a call, messaging, an argument), a 0.8 % white or black line
  - top/bottom: one couple in two times or places — different grades, a thin dark line of 0.6–1.2 %
  - L layout: a wide shot across the full width at the bottom, two halves with the subjects on top; the third window appears with a cut
  - window carousel: 1 → 2 → 3 → 4 columns, windows slide in from the side and push their neighbors, black gaps ≈1 %, cut to the beat
  - rotating border: the line appears horizontally and rotates at ≈30°/s, the windows are "re-cut" diagonally, with a color shift
  - central strip: a vertical strip with the subject and color fields on the sides behind thick white gaps — a designer music video
  - splitting: one frame is divided by glowing seams into 2–4 versions of the subject ("parallel worlds")
status: code
fallback: if there is no parallel shot — windows from one source with a time offset (the same shot +0.5–2 s), a mirrored copy, a different shot size from a 4K crop of the same shot, or generation of a second shot with consent
params:
  layout: 2v (50/50 vertical) | 2h (top/bottom) | L3 (wide at the bottom + 2 on top) | 3v (columns) | grid (4–6) | diag (angle, rotation) | strip (center + fields)
  gutter: "0.6–1.8 % of the frame (1 % typical), color #000 or #fff; designer — 5–6 % white"
  panel_reframe: each window — reframe on the face or object in its own aspect ratio (half of 16:9 = 8:9)
  enter: cut | slide (0.2–0.4 s, ease outCubic) | wipe along the line; a new window every 1–1.5 s in dynamic versions
  diag_rotation: 0–30°/s (rotating border), angle 0–75°
  hold: 1.2–7.5 s per layout; 2–4 s typical
  sync: events in the windows (a gesture, a line, a hit) — on the same beat; layout change — on a downbeat
when: a phone conversation and messaging, parallel action (a chase, waiting, preparation), "before and after", comparing products or options, a reaction next to the content (UGC), two eras or two moods of one couple, a music video finale with a multi-screen; dynamic carousel — the build before the drop; no longer than 8 s per layout
avoid: vertical 9:16 format with a vertical division — the windows are too narrow (split top/bottom instead); small faces and text in 4+ windows on a phone; windows with no connection in meaning; too much motion in all windows at once — the eye doesn't know where to look; different window brightness without intent
sfx: each window with its own sound, but keep only one loud; a window appearing — a short whoosh or click; in a carousel — a hit on each rearrangement; in a call — voices with a telephone filter, taking turns
genres: {viral: allowed, ugc: signature, product: allowed, explainer: allowed, teaser: allowed, fanedit: allowed, clips: allowed, drama: allowed, sport: allowed, fashion: allowed, travel: allowed, epic: allowed, phonk: allowed}
detect: |
  Stable straight seams across the whole frame (or across half of it) at 0.5, 0.31/0.67 or at an angle: a thin solid
  strip of 0.6–6 % (brightness <25 or >225, spread along the line <6) or an abrupt content break at the same coordinate
  in all frames. The two sides of the seam have different grades, motion and cuts (window motion correlation −0.3…0.35).
  ed_motion: "cuts" only on layout changes, a large overlay-mask (static seams), no global events or
  uncoordinated ones. Rotating border — a line whose angle changes by 1–2.5° per frame.
  Differs from layout.frame_division: there is no line or gap there, the join is masked by composition.
  From layout.windowbox: one window on a field. From mask.double_exposure: the shots are blended by transparency, not divided.
engine: |
  split_screen(layout='2v'|'2h'|'L3'|'3v'|'grid'|'diag'|'strip', panels=[clipA, clipB, ...], gutter=0.01,
               gutter_color='#000', reframe=track(face), enter='cut'|'slide', enter_dur=0.3, diag_angle=[0, 75],
               diag_speed=30, t=[t0, t1])
  — each window: reframe(aspect=panel, target=track(face)); slide — transform(shift) of neighboring windows, ease='outCubic';
  layout changes — on a downbeat: beat_sync(event='layout_change', grid='1/1'); exit — cut to a window full-frame.
gen_hint: split-screen composition, the frame divided by a thin black line into <two halves | top and bottom | three panels>, each panel shows <subject A> and <subject B> in different locations at the same moment, matching eyelines across the divider, cinematic color contrast between panels
commands: ["50/50 split screen on the call in #3", "top/bottom: the past warm, the present cool", "window carousel on the build before the drop", "before and after in halves with a thin white line"]
related: [layout.frame_division, layout.windowbox, mask.double_exposure, cut.quick, fx.kaleidoscope, frame.two_shot]
evidence: {examples: 8, sources: 8, measured: "dividers 0.6–1.8 % (white 0.8 %, black 1–1.8 %), designer ones 5.9 %; division at 0.50 (vertical — 3, horizontal — 2), 0.31/0.67 in three columns; L layout — the third window by a cut after 1.2 s; carousel — windows shift ≈1/3 of the width in 0.2 s, a new window every 1–1.5 s; rotating border 0→74° over ≈3.3 s (≈20–30°/s); different grades in the windows; window motion correlation −0.32…0.35; duration 1.2–7.5 s", confidence: high}
