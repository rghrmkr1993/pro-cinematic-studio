id: layout.screen_in_screen
family: layout
group: graphics
level: B
aliases: [screen within the frame, screen in shot, video on a TV, picture on a screen, TV in the frame, phone in hand playing video, monitor insert, corner-pin screen, screen replacement]
what: a screen glows inside the scene — a TV, a monitor, a phone, a laptop — and shows another video; "media within media", the subject watches or films, archive footage or a broadcast in the room
frames: |
  1. The screen is a bright quadrilateral inside the frame: 3–45 % of the area (a small TV in a dark cabin ≈ 3–5 %,
     a phone in hand ≈ 5–10 %, a monitor or wall-mounted TV ≈ 20–45 %); the screen shows a different image.
  2. The screen is 1.6–11 times brighter than its surroundings (up to ×40 in total darkness): the room is dark, the screen is the main light source,
     a bluish glow falls on the viewer's face.
  3. The camera is static (5 of 8 — jitter ≤ 0.2 %) while the screen content is alive: variability inside the screen is 5–70 times higher
     than outside; on a phone — swipes and scrolling with a finger.
  4. The screen faces the camera (centered, a frame within the frame) or is angled in perspective; old TVs have rounded corners,
     lines, a murky picture, a slight blue or green tint.
  5. Delivery: a static shot of 1–4 s; a fast push-in into the screen ×1.5 over 0.2 s (5 frames) centered on the screen; a whip
     pan to a hanging TV and a hold; the subject looks at the screen — a cut to the content full-frame.
variants:
  - TV in a dark room — the subject watches, the face in the glow
  - a small screen in a huge dark space — the screen 3–5 % of the frame, loneliness
  - phone in hand — messaging, scrolling, a video call; over the shoulder
  - a phone filming the scene — the same scene live on its screen
  - a wall screen in a bar or a hall — a broadcast for everyone, handheld camera
  - push-in into the screen — the camera "dives" into the TV, then the content full-frame
status: hybrid
fallback: search the source footage for shots with screens (detect) and replace the content — corner-pin to the 4 corners of the screen with tracking, + glow and glare; if there is no shot — generate a TV, a monitor or a phone in the right setting with a green or black screen (with consent), then insert the needed clip
params:
  screen_area: 3–45 % of the frame (phone 5–10 %, TV 15–45 %)
  screen_luma: ×1.6–11 relative to the surroundings; content −10…−20 % contrast, ±5 % blue for an old TV
  insert: corner-pin to 4 track points, feather 1 px, glass glare 5–10 % screen, glow on the viewer's face (+10–20 % brightness on the side facing the screen)
  crt_look: corner rounding 6–10 % of the screen height, scanlines at 30–50 % contrast with a 2–3 px pitch, barrel 2–4 %, blur 0.5–1 px
  hold: 1–4 s of a static shot
  push_in: fast ×1.5 over 0.2 s (5 frames) or slow ×2–3 over 2–4 s, centered on the screen center; then a cut to the content full-frame
  phone_ui: status bar and buttons — only our own neutral ones, no third-party logos
when: exposition "the subject watches the news or a broadcast", a memory or archive footage on an old TV, messaging and social media on a phone, a reaction to what was seen, a transition from reality into the video (push-in into the screen); "screen → reaction → screen" editing carries the story in explainer and UGC videos
avoid: recognizable third-party interfaces and logos on the screen; an insert without perspective, tracking and glare (looks pasted on); a screen too small without a push-in when the content matters; a screen overexposed into a white blob
sfx: sound from the screen (muffled, band-limited like from a TV speaker), a remote click or a tap on the screen, room noise; on the push-in into the screen — a short whoosh or static
genres: {explainer: allowed, ugc: allowed, drama: allowed, teaser: allowed, fanedit: allowed, clips: allowed, viral: allowed, calm: allowed, product: allowed}
detect: |
  A bright quadrilateral in the frame (straight edges, 4 corners, often in perspective) brighter than the surroundings ≥ ×1.6, area 3–45 %;
  with a static camera the temporal variability inside it is 5–70 times higher than outside (ed_motion: no events,
  overlay-mask high outside the screen); sometimes the glow on the viewer's face changes with the content.
  Differences: a window (layout.windowbox) — the picture sits on a solid field, not inside a filmed scene; a mirror — a reflection
  of the same scene; a full-frame interface — the screen fills the whole frame with no surrounding room; the screen's view (pov.screen) —
  the camera looks FROM the screen at a person.
engine: |
  screen_detect(shot) → quad[4] + track(corners)
  screen_insert(shot, clip, quad=track(screen_corners), feather=1, glare=0.08, glow=0.15, spill_on='face', crt=True|False,
                crt_params={round=0.08, scanlines=0.4, barrel=0.03})
  push-in into the screen: transform(scale=[1, 1.5], center=quad_center, t=[t0, t0+0.2], ease='inCubic') + cut(at=t0+0.2) → clip full-frame
  (or transition('nest', quad=track(screen)) for a smooth entry)
gen_hint: a dark room lit only by an old CRT television showing <scene>, a person watching in silhouette, blue screen glow on their face, rounded screen corners, slight scanlines, static camera, cinematic; variant - close over-the-shoulder shot of a phone in hand showing <content>
commands: ["put my clip into the TV on #3", "push into the screen and then the video full-frame", "find shots with a phone in hand in the source footage and replace the screen", "show the archive video on an old TV in a dark room"]
related: [layout.windowbox, pov.screen, trans.screen, zoom.crash, glitch.vhs]
evidence: {examples: 8, sources: 8, measured: "screen 3–45 % of the frame (visually and by a luminance mask); brighter than the surroundings ×1.6–11 (up to ×40); with a static camera (5 of 8, jitter ≤ 0.17 %) variability inside the screen 2–81 versus 0.5–1.8 outside; push-in into the screen ×1.49 over 0.2 s centered at 0.5/0.5; handheld camera at the wall screen jitter 0.6 %", confidence: medium}
