id: trans.dissolve
family: trans
group: transition
level: A
aliases: [dissolve, shots flowing into each other, crossfade, cross dissolve, mix, match dissolve]
what: the outgoing shot fades out smoothly while the next one emerges on top of it over 0.6–2.6 s — a soft change of time, place or thought; in the match variant the main shapes of both frames sit in the same place
frames: |
  1. Setup: the last 0.5–1 s of the outgoing shot — calm action or a static composition.
  2. Dissolve: the share of the new frame grows almost linearly — 10→90 % over 0.6–2.6 s (15–65 frames
     @25 fps), typically 1.4–1.8 s; 50 % is reached around the middle of the transition. Fast dissolves take 0.6–0.9 s.
  3. Middle: both frames are visible at once for 0.3–1 s; matching shapes (face into face, horizon into horizon,
     bright spot into bright spot) hide the seam; brightness changes smoothly from the level of A to the level of B.
  4. Landing: the new shot at full strength, its motion already under way; often this is the start of a new episode or
     a different time.
variants:
  - a regular crossfade between scenes, 1–2 s
  - match — the same composition — portrait into portrait (different makeup, age), a horizon into a figure on the horizon
  - through light — the frame goes into a flare or overexposure, the new one emerges from the light (50 % already within 0.3 s, tail up to 1.2 s)
  - through darkness — the frame goes into shadow, the new one emerges from near black (0.1–0.5 s of darkness)
  - title reveal — the text fades in over the shot in ≈0.4 s
  - a chain of 0.7–0.9 s dissolves between close-ups (memories, a montage of faces)
status: code
params:
  dur: "10→90 %: 0.6–2.6 s (15–65 frames @25 fps), typically 1.5 s (38 frames); fast 0.6–0.9 s; lyrical 2–3 s"
  curve: linear (most cases) or inOutSine; ease-out for the through-light transition
  handles: both clips have ≥ dur/2 of spare footage beyond the cut point
  match: the main shape (face, horizon, bright spot) lines up within ±5 % of the frame, scale ±10 %
  luma: if the mean brightness differs by more than 2 times — go through darkness or light (0.1–0.3 s) or even it out beforehand
  colour: in black and white or a single tone the seam is softer
  audio: an audio crossfade of the same length, or the new shot's sound 0.3–1 s ahead of the picture
when: time has passed, a flashback, a dream; a change of place without a hit; portrait → place, thought → image; slow music, intro and outro, lyrical parts and the bridge; in a calm video it is the main transition, in a dynamic one no more than once every 10–15 s
avoid: the downbeat and the drop (the hit gets smeared); fast cutting and action; frames of very different brightness or color without preparation (the middle sinks into a gray murk); the eyes of two faces in different places; a duration of 0.2–0.3 s — it looks like a mistake, a straight cut is better then
sfx: an ambience crossfade of the same length; a soft swell or "air" in the middle; no hits
genres: {calm: signature, drama: allowed, travel: allowed, motivation: allowed, epic: allowed, fashion: allowed, teaser: allowed, product: allowed, explainer: allowed, fanedit: allowed, ugc: allowed, viral: forbidden, phonk: forbidden, sport: forbidden, clips: forbidden}
detect: |
  ed_motion: no cut, the histogram changes gradually over 15–65 frames, the difference between frames
  is moderate and even, little global motion, nonrigid rises toward the middle (two layers).
  Custom check: frame ≈ (1−a)·A + a·B, fit residual ≤ 0.3 of the A–B difference for static shots,
  a rises monotonically 0 → 1; measure the duration as 10→90 % of a.
  Difference from trans.double_exposure: there a share of 0.3–0.7 holds for longer than 1–2 s.
  Difference from trans.morph: here the contours do not shift, both images are visible at once.
  Difference from a fade to black: in a fade/dip 2+ frames in the middle are nearly black (luma < 15) with no trace of either frame.
engine: |
  transition(kind='dissolve', dur=1.5, params={curve:'linear'|'inOutSine'})
  Match: match(on='shape') — shift and scale B so that the face or the horizon lines up with A, then dissolve.
  Through darkness: transition(kind='dip(black)', dur=0.8); through light: flash(color='white', dur=0.3, curve='outQuad') + dissolve(dur=1).
  Title: text(anim='fade', dur=0.4).
  Sound: an audio crossfade of the same length, or B's sound 0.3–1 s earlier.
gen_hint: <subject B> framed exactly like the previous shot — same position, scale and horizon line, same soft light — for a slow match dissolve; calm, no camera shake
commands: ["a one-and-a-half-second dissolve between #3 and #4", "match dissolve: portrait into portrait", "smooth dissolve into the flashback", "make every transition in the outro a dissolve"]
related: [trans.double_exposure, trans.morph, cut.match, trans.fade, light.flash]
evidence: {examples: 8, sources: 8, measured: "10→90 %: 0.8 and 0.6 s (chain of dissolves), 1.0 s through a flare (50 % within 0.3 s), 1.4 s portrait into portrait, 1.5, 1.6 and 1.8 s between scenes, 2.6 s face into foliage; the curve is almost linear in 5 of 8 transitions, ease-out in 3; mix-fit residual 0.0–0.3 for static shots; the title fades in over ≈0.4 s", confidence: high}
