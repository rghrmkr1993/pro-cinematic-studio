id: trans.flash
family: trans
group: transition
level: B
aliases: [flash transition, white flash, flash frame, dip to white, color flash, exposure flash, flash on the cut, white frame, overexposure on the cut, flash on the beat, black hit]
what: a flash on the cut — 1–4 frames of white or colored overexposure (or a short fade to white and back out of it) hide the join and hit the beat of the track; an accent hit, not a change of time
frames: |
  1. Setup (optional): the last 1–2 frames of shot A "overheat" — white mixed in at 35 and 65 %
     (or exposure +1 and +2 stops), mean brightness rises ×1.5–2.5.
  2. Peak — on the cut frame, which is also the beat frame: solid white (brightness 245–255 of 255, spread < 5 — no frame
     structure) or a single-color frame. 1 frame (40 ms @25 fps, 33 ms @30 fps) — a "hit"; 2 frames — a strong flash
     on the entry into the drop; 3–4 frames — a "burn".
  3. Decay: shot B emerges from the white exponentially with a time constant τ ≈ 60 ms — white share @25 fps: 1 → 0.51 → 0.26
     → 0.14 → 0.07 (4 tail frames), @30 fps: 1 → 0.57 → 0.33 → 0.19 → 0.11 → 0.06 (5 frames). A "hit" has no tail
     (a white frame and then clean B right away), a "memory flash" has τ 100–120 ms and 8–9 tail frames.
  4. Landing: 0.04–0.45 s after the cut B is already at its own exposure; sometimes the bright areas keep glowing for another 2–4 frames
     (glow, fx.glow).
variants:
  - "hit: 1 frame of pure white exactly on the cut, with no setup and no tail — the most common variant in phonk and beat-synced edits"
  - "flash with a tail: a 1-frame peak + a 4–5 frame decay (τ 60 ms) — softer, B 'comes out of the light'"
  - "short white-out (dip to white): A goes to white over 2–4 frames, white for 0–2 frames, B comes out over 4–8 frames — 0.3–0.6 s in total; white longer than 2 frames or the whole move longer than 0.6 s is trans.fade"
  - "exposure burn: not a white fill but an exposure overdrive of +2…+5 stops with glow — the shadows stay, the frame 'burns out'; costlier and softer, for fashion, beauty and product"
  - "color flash: 1–2 frames of a single solid color — from B's palette, the brand color or chosen by meaning (red — threat, acid — club)"
  - "black hit: 1–2 frames of black on the cut with no ramp — a 'blink' on the bass; 3 frames or more, or with a ramp, is trans.fade"
  - "negative flash: 1 frame of the inverted first frame of B (borderline with fx.glitch, where the negative is part of a glitch burst)"
  - "double flash: white — 1–2 frames of picture — white (within 3–5 frames) on a snare roll or a 'double photo flash'"
  - "photo flash with a freeze frame: a white peak, then B freezes for 0.3–0.8 s (time.freeze) under a shutter click — a 'photo shoot', presenting a look"
  - "strobe across cuts: a flash on every cut of the drop alternating white / color / black — only within 3 flashes per second"
status: code
params:
  peak: "1 frame @25 fps and @30 fps — hit (default); 2 frames — the first cut of the drop; 3–4 frames (120–160 ms @25 fps, 100–133 ms @30 fps) — burn; if frame rates are mixed — count in ms and round to whole frames"
  pre: "0–2 frames at the tail of A with a white share of 0.35 → 0.65 (or exposure +1 → +2 stops); for a hit — 0"
  decay: "white share after the peak a(t) = exp(−t/τ), cut off below 0.05; τ = 0 (hit) | 50–70 ms (flash, typically 60) | 100–120 ms (memory). With τ 60 ms — @25 fps: 1, .51, .26, .14, .07; @30 fps: 1, .57, .33, .19, .11, .06. With τ 110 ms and a 2-frame peak — @25 fps: 1, 1, .70, .48, .34, .23, .16, .11, .08, .05; @30 fps: 1, 1, .74, .55, .40, .30, .22, .16, .12, .09, .07"
  mix: "solid — (1 − a)·frame + a·color on sRGB values (default); add — frame + a·color with clipping (the structure stays visible longer); exposure — linear light ×2^EV; black and invert — solid black or a negative on the peak frame"
  luma: "white peak — brightness ≥ 245 of 255 with a spread ≤ 5; a 'near-white' peak of 0.85–0.95 (brightness 220–245, B barely shows through) — this is how ed_render currently renders it: frames=3 gives 0.92, 0.55, 0.25 (with frames=4 another 0.1)"
  exposure: "peak EV = log2(0.85 / median frame brightness in linear light), within +2…+5 (dark frame +4…+5, bright frame +2); per frame +1, +2, peak, then decay with τ 80 ms; on dark frames mix in 0.2–0.4 white at the peak; glow threshold 0.7, radius 2–4 % of the height, strength 0.6 → 0 over the tail"
  color: "white #ffffff (default) | warm #fff1dc | from B's palette — the most saturated of 5 k-means clusters, S 0.85, V 1.0 | presets — red #ff2a2a, cyan #29e6ff, magenta #ff2bd6, acid #b6ff2b, amber #ffb02e"
  seam: "the peak replaces the first frame of B (B starts under the flash and loses no motion); peak frame = beat frame, 1 frame early is acceptable, never late; the video's duration does not change"
  sync: "a beat at 120 BPM is 12.5 frames @25 fps (alternate 12 and 13) and 15 frames @30 fps; flashes on the kick or snare, the strongest one on the first beat of the drop"
  spacing: "at least 9 frames @25 fps and 10 frames @30 fps between peaks (no more than 3 flashes per second); saturated red — no more than 1 time per second and never in series"
  contrast: "A and B are bright (brightness > 180) — a white flash does not read and is not caught by the detector (it needs ×1.25 over its neighbors): use a black hit or a color flash; both dark night shots — peak 0.7–0.85 or τ ≤ 40 ms, so as not to blind"
  budget: "a flash on no more than ≈40 % of the video's cuts; no more than two accents on one frame (flash + shake or flash + punch)"
when: |
  A cut on the downbeat, kick or snare; the entry into the drop (the first cut of the drop is the strongest, 2-frame peak);
  a change of track section; an impact in frame (a punch, a landing, a shutter click); a "memory flash" into a flashback (τ 100–120 ms);
  a photo flash with a freeze frame on each look in fashion. By part: hook — 0–1 flash (the first cut on the beat);
  build — on the snare once every 1–2 bars, toward the end of the riser it can speed up to every beat; drop — on every on-beat cut
  in stretches of 2–4 bars, then 1–2 bars without flashes; outro — one on the last hit. In speech genres
  (clips, explainer, UGC, motivation) — only on a block change or a punchline, no more than once every 10–15 s and never
  mid-phrase. Limits: no more than 3 per second, no more than 1 per beat, no more than ≈40 % of the video's cuts.
avoid: a calm, contemplative tone (use trans.dissolve or trans.fade there); speech mid-phrase — reads as a glitch; both shots bright — the white is not visible; series of white flashes in dark night scenes — blinding; red flashes in series; the same flash on every cut of the whole video — cheap; a flash off the beat is worse than none; series faster than 3 per second are dangerous for photosensitive viewers
sfx: a hit (sfx.impact) or a snare accent exactly on the peak frame; burn and photo variants — a shutter click or a short 60–120 ms noise "pfft"; short fade to white — a reverse cymbal or sfx.riser of 0.3–0.6 s peaking on the flash frame; no more than one sound accent per flash; if the track itself hits those beats, the drop flashes go without sounds of their own
genres: {phonk: signature, fanedit: signature, fashion: signature, teaser: signature, viral: allowed, epic: allowed, product: allowed, sport: allowed, travel: allowed, clips: allowed, explainer: allowed, ugc: allowed, motivation: allowed, calm: forbidden, drama: forbidden}
detect: |
  ed_motion (verified on synthetic renders): on the cut, white frames (brightness > 225) and flash frames (a frame brighter than the
  medians of frames k−5…k−2 and k+2…k+5 by 30+ and by 1.25+ times). A 1-frame white — two "cuts" in a row [k, k+1] around
  the white frame and strobe flips 1; a flash with a tail — 2–4 "cuts" in a row on the decay frames, flash frames on the peak and
  the next frame; "memory" with a 2-frame peak — white frames on both; black hit — black frames (< 12) on 1–2
  frames between two cuts; strobe across cuts — one strobe flip per flash and flash frames every 9–15
  frames. ed_analyze gives such a seam cut_in 'flash' (a spike frame within ±3 frames of the cut) or 'dip_black'.
  Custom check: peak — mean brightness ≥ 225 with a spread ≤ 8 (no structure) or a single-color frame with a spread ≤ 8 and
  saturation ≥ 0.5 — ed_motion does not see a color flash if its brightness is close to its neighbors (red #ff1e1e gives
  ≈ 97 of 255); decay — (Y_k − Y_B) / (Y_(k−1) − Y_B) = 0.4–0.75 per frame; setup — A's brightness rises by 20 %+ over
  the 1–2 frames before the cut. Negative flash: brightness shoots up, the spread stays the same, correlation with neighboring frames < −0.5.
  Difference from cut.flash: there it is dozens of different images of 1–2 frames each (8–25 changes per second), not a single-color frame.
  From light.flash: there is no cut, the structure stays visible even in the flash, the light is uneven — coming from the side of the source.
  From trans.fade: a fade to black or white runs 3+ frames with a ramp and a hold (0.3–3 s), while a flash is a peak of
  1–4 frames with a fast decay. From glitch.film_damage: a light burn there is an orange gradient blob from the edge (R/B 3–6), not
  an even fill. From fx.glitch: there the negative sits inside a glitch burst with band shifts.
engine: |
  transition(kind='flash', dur=peak+decay, params={color:'#ffffff', mode:'solid'|'add'|'exposure'|'black'|'invert',
             peak_frames:1, pre_frames:0–2, pre:[0.35, 0.65], tau:0.06, cutoff:0.05, bloom:None|{thr:0.7, r:0.03, k:0.6}})
  = flash(color, t=seam, dur=peak, curve='exp(τ)') on the head of B + flash(t=[seam − pre, seam]) on the tail of A;
  exposure — color(params={exposure: [+1, +2, EV_peak, …]}) in linear light + glow(threshold=0.7, radius=0.03).
  Timeline: cut_in={id:'trans.flash', frames:N, tau:0.06, color:'#ffffff', pre:0}; EDL: ops
  [{f:[k], op:'white', a:1.0}, {f:[k+1], op:'white', a:0.51}, {f:[k+2], op:'white', a:0.26}, …] (@25 fps, τ 60 ms).
  palette_pick(B.first, mode='most_saturated', k=5) — new: the flash color from the palette of the incoming shot.
  flash_guard(max_per_s=3, min_gap={25: 9, 30: 10}, red_min_gap=1.0, dY=0.1, area=0.25) — new: the planner does not
  place flashes any denser, QA counts brightness jumps > 10 % over > 25 % of the frame area and warns.
  + beat_sync(event='flash', grid='1/4') + sfx('impact', at=seam, align='attack').
gen_hint: "<scene B> starting from a completely white overexposed frame, the bright light settles within a quarter of a second and reveals the scene, like the moment right after a camera flash; static framing, high energy music video moment"
commands: ["white flash on every cut in the drop", "flash between #3 and #4 on the hit", "one-frame red flash at 0:12", "photo flash with a freeze frame on every look", "burn to white and come out into the next shot on the chorus", "black hit on every bass note in the first bar of the drop"]
related: [light.flash, cut.flash, trans.fade, trans.dissolve, time.freeze, zoom.punch, shake.beat, fx.glow, fx.glitch, glitch.film_damage, fx.light_leak, cut.crash, cut.quick, sfx.impact]
