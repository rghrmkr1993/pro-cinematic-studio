id: trans.liquid
family: trans
group: transition
level: B
aliases: [liquid transition, ink transition, luma fade, luma wipe, luma key transition, displacement transition, melt transition, brightness-based transition, luma transition, blot transition, frame melt]
what: a cut "through liquid" — the boundary between shots is organic — the new shot shows through in patches in the dark or bright areas of the old one, grows as a soft blot, or the whole frame melts into ripples like glass under water and the next shot assembles out of them
frames: |
  1. Setup: the last 0.3–1 s of the outgoing shot; almost always a high-contrast frame — a silhouette, a back, a shadow,
     night lights and bokeh; large dark areas take up 30–70 % of the frame.
  2a. Patches by brightness: the new shot appears inside areas of the old one — in 2 of 3 examples first in the dark ones
     (a boot, a shadow, a silhouette), the boundary follows the contours of light and shadow and stays ragged; the new shot's share goes
     10→90 % in 0.32–0.6 s (8–15 frames @25 fps). Burn: in the middle the frame sinks almost to black
     (mean brightness 46 → 18 of 255), ragged patches with a grainy edge eat the picture, and the new shot comes out
     of the black.
  2b. Blot: a single rounded drop grows from a point inside a dark area (sometimes a second one in a corner) with a soft
     bright rim of 1–2 % of the frame; 10→90 % of the area in 0.85 s (21 frames @25 fps), the radius grows fast at first
     and slows toward the edges; from the first spot to the full frame — ≈1.4 s.
  2c. Melt: the whole frame starts to flow — a non-rigid deformation of 1–2 % of the width per frame (2–4 % in peak areas),
     the picture becomes "glass under water" with drops and bright rims; under the ripples the new shot's share
     grows almost linearly 15 → 75 % in 0.9–1 s, then the ripples die down over 0.3–0.8 s. The whole move takes 0.35–1.9 s.
     With a flash: in the middle the frame floods with light (mean brightness 31 → 236), and the new shot comes out of the burn.
  3. Landing: the boundary disappears, the new shot is clean and immediately lives its own motion (a push-in, a walk, lights).
variants:
  - patches through the shadows (luma key) — the new shot shows through first in the dark areas of the old one, 0.5–0.6 s
  - burn — ragged black patches with a grainy edge, a dip to almost black, 0.3–0.5 s
  - blot from the shadow — a single soft drop with a bright rim grows from a dark area to fill the whole frame, 0.85–1.25 s
  - ripple melt — the whole frame flows like liquid glass, the next shot assembles out of the ripples, 1–1.75 s
  - bubbles — the frame breaks into oval cells with bright rims, the next shot is already inside the cells, 0.4–0.5 s
  - melt with a flash — ripples and a burn almost to white, exit into a dark scene, ≈1 s
status: code
fallback: a "live" blot of real ink or paint in water — shot on a white or black background and used as a mask — looks richer than a procedural one; look for such a stock element in the user's source footage or generate one (with consent); without it the code builds the mask from frame brightness and noise
params:
  mode: luma (dark_first | light_first) | burn | blob | melt | bubbles
  dur: "luma 0.5–0.6 s (12–15 frames @25 fps); burn 0.3–0.5 s (8–12 frames); blot 0.85–1.25 s (21–31 frames); melt 1–1.75 s (25–44 frames); bubbles 0.4–0.5 s (10–12 frames)"
  curve: luma and melt — almost linear in the new shot's share; blot — radius outCubic; burn — a dip to black in the middle (brightness down to ≈18/255)
  matte: "luma: the threshold on A's brightness runs 0→1 (dark first is typical), + fbm noise at a scale of 3–8 % of the frame with strength 0.1–0.2 for an organic look"
  edge: "luma and burn — a ragged boundary (perimeter²/4π·area = 4–11), 10–30 separate patches, a soft edge of 1–3 % of the frame; burn — specks of 0.3–1 % of the frame; blot — roundness 1.1–1.6, a bright rim of 1–2 % of the frame at 60–80 % of white"
  blob_seed: the center of A's darkest connected area (at least 15 % of the frame darker than 40/255)
  displace: "melt: a non-rigid shift of 1–2 % of the width per frame (p90 2–4 %), a noise field at a scale of 5–15 % of the frame, the amplitude rises toward the middle and falls off; A and B mix linearly under the ripples"
  light_peak: the flash variant — a burn up to 230–240/255 for 2–4 frames in the middle
  contrast: A needs distinct dark areas covering 30–70 % of the frame; on a flat bright frame a luma transition does not read
when: night, neon and "dreamlike" music videos, a memory, a trip, the subject's shift into another state; between two dark high-contrast scenes; luma — when the outgoing shot has an expressive silhouette or shadows; melt — on a sustained synth, a break, the transition into a verse; no more than once every 10–15 s, in a stylized episode — a series of 2–4 in a row of the same kind
avoid: bright flat frames without contrast (the luma transition turns into a muddy dissolve); close-up faces in a melt — the ripples disfigure the features; text and titles in frame during the transition; a downbeat that needs a hit — the organic look blurs the accent; a business, news or explainer tone
sfx: a "liquid" whoosh, gurgling or a reverse swell over the whole transition; for the burn — hissing and crackling; on the flash — a soft hit or a reverse cymbal; the sound peaks at 50 % of the reveal
genres: {fanedit: allowed, fashion: allowed, teaser: allowed, drama: allowed, calm: allowed, product: allowed, viral: allowed, explainer: forbidden}
detect: |
  ed_motion: no cut, or false "cuts" every other frame on the ripples (ECC method instead of LK), global motion does not
  explain the change of picture, high nonrigid; the flash variant has flash/white frames in the middle, the burn has
  a dip in brightness.
  Custom check — a per-frame mask of "closer to B than to A": B's share grows 0→1 over 0.3–1.75 s, not across the whole frame at once
  but in patches. Luma: the reveal order is linked to A's brightness (rank correlation |ρ| ≥ 0.25), the boundary is ragged
  (compactness 4–11), 10–30 patches. Blot: a single component with roundness 1.1–1.6, the equivalent radius grows while
  slowing down. Melt: residual optical flow after an affine fit of 1–2 % of the width per frame for 0.5–1.5 s in a row
  (0.1–0.4 % in calm frames).
  Difference from trans.dissolve: there B's share is the same across the whole frame. From trans.iris: there it is a regular shape with a hard
  edge. From trans.morph: a morph moves A's features to B's positions, here the shape of the boundary is unrelated to the features.
  From glitch.datamosh: there square blocks of 8–16 px flow along B's motion. From the "tear" in trans.portal: there the window is
  part of the scene and the subject walks through it.
engine: |
  Luma: transition(kind='luma', dur=0.55, params={source:'A', order:'dark_first', softness:0.08,
