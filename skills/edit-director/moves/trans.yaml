id: trans.whip
family: trans
group: transition
level: B
aliases: [whip pan transition, swish pan, whip transition, motion blur transition, swish, smear transition]
what: a cut hidden inside a sharp sideways jerk of the camera — the outgoing shot breaks into solid motion blur, the incoming one comes out of the same blur in the same direction and brakes on a new subject
frames: |
  1. Acceleration: over the last 2–9 frames of the outgoing shot the camera (or a digital shift) swings sideways, the speed roughly
     doubles every frame (2 → 5 → 12 → 20 % of the frame width per frame); sharpness drops to ×0.03–0.25 of normal.
  2. Seam: a cut at peak speed, inside 1–3 frames of almost solid directional motion blur (≈15–40 % of the frame width).
     In 8 of 13 seams the peak frames fall on a uniform area — sky, a burn-out, the dark edge of a wall or the subject's body
     (frame brightness <60 or >140 of 255), so the moment of the swap does not read.
  3. Landing: the incoming shot starts in the same direction and brakes within 0–5 frames (speed 29 → 18 → 4 → 0 % of the
     width per frame), with no bounce; the new subject settles in the center of the frame (±0.15).
  4. The whole blur window is 3–17 frames @25 fps (0.12–0.7 s), typically 4–6 (0.16–0.24 s); then a normal shot.
variants:
  - symmetrical: 2–3 frames of blur before the cut and 2–3 after — the most common (6 of 13 seams)
  - whip-out: blur only on the outgoing shot, the incoming one lands sharp right away, sometimes with a fading 3–4 frame drift to a stop
  - whip-in: the outgoing shot breaks off without blur, the incoming one flies in with 3 frames of blur
  - long, lyrical: 13–17 frames @25 fps with a smooth acceleration through the sky or a burn-out
  - through a dark plane: a diagonal or vertical pass past the dark edge of a building or the subject's body — borderline with a wipe
  - within a scene: the same subject, but tighter — a whip pan as a change of shot size without a change of place
status: code
fallback: the best result comes from real camera whips in the source footage (the engine looks for frames with directional motion blur in the tail and head of clips and cuts at the peak); if there are none — a digital shift of the frame with directional blur in code; for the long variant — generate a pair of shots with a whip in the same direction
params:
  window: 3–17 frames @25 fps (0.12–0.7 s) of total blur; typically 5 (0.2 s)
  split: the share of the window before the cut 0–1, typically 0.5; 1.0 = whip-out, 0 = whip-in
  ramp_out: 2–9 frames of acceleration, ease inExpo (speed ×2 per frame)
  ramp_in: 0–5 frames of deceleration, ease outExpo, no bounce
  peak_speed: 5–9 frame widths per second (20–36 % of the width per frame @25 fps)
  blur: directional, length ≈0.5–1× the per-frame displacement; at the peak ≈15–40 % of the width; angle = direction of motion
  direction: horizontal (9 of 13 seams), diagonal or vertical (4 of 13); on both sides of the seam — the same direction and the same axis
  seam_zone: a uniform area (sky, light, a dark wall) at the peak; if there is none — 1 frame of dissolve inside the blur
  landing: the incoming shot's subject in the center ±0.15 by the end of the deceleration
  edge: mirrored edge extension for a digital shift
when: a change of location or look without losing pace — music video, travel cut, vlog; the seam on the downbeat or the snare; a series of 1 transition every 1–1.75 s is acceptable in travel and UGC; a change of shot size on the same subject on an accent; no more than 4–6 in a row, after that switch the transition type
avoid: calm and slow editing; shots moving in different directions or on different axes at the seam; an incoming shot where the subject leaves the frame; a strong brightness difference between the sides without a uniform area; a digital whip on frames with tight close-up faces and small text (smeared text looks like a defect); rolling-shutter "jello" on phone whips
sfx: a whoosh or swish as long as the whole blur window, the sound peaks exactly on the cut; in the long variant — a short riser before the whip; on a landing on the beat — a light hit
genres: {travel: signature, ugc: signature, viral: signature, fanedit: allowed, phonk: allowed, sport: allowed, fashion: allowed, clips: allowed, teaser: allowed, motivation: allowed, explainer: allowed, product: allowed, epic: allowed, calm: forbidden}
detect: |
  ed_motion: at the seam — one or several "cuts" in a row (cuts on 2–4 neighboring frames of the blurred stretch), around them —
  SHIFT peaking at ≥8–25 %/frame in one direction on both sides; min sharpness ×0.03–0.25 near the cut; bright blur
  frames are sometimes flagged as flash. Custom check: gradient anisotropy (coherence ≥0.5, the same blur angle before
  and after), the histogram switches from the outgoing shot to the incoming one within 1–3 frames.
  Difference from pan.whip (a whip within one shot): no cut, the histogram does not change, the place is the same.
  Difference from trans.spin: there ROTATE dominates (tens of degrees per frame), the blur is arc-shaped. From trans.wipe: there two images
  share the frame at once along a sharp edge, while in a whip transition the whole frame is blurred. From zoom.crash: radial blur, ZOOM events.
engine: |
  Real whips: find_motion_peak(A, side='tail', axis) + find_motion_peak(B, side='head', axis) →
  cut on A's peak frame, B starts from its own peak frame; match(on='motion') checks for a single direction.
  Digital: transition(kind='whip', dur=0.2, params={dir:'right', angle:0, split:0.5, ease:['inExpo','outExpo'],
  travel:1.2, blur:'directional', shutter:0.7, edge:'mirror', seam_mix:1}) =
  A: transform(shift=[[0,0],[-1.2,0]], t=[seam-0.1, seam], ease='inExpo') + blur(kind='directional', angle=0, amount∝speed)
  B: transform(shift=[[1.2,0],[0,0]], t=[seam, seam+0.1], ease='outExpo') + blur(kind='directional', angle=0, amount∝speed)
  + sfx('whoosh', at=seam, align='peak'); place the seam on the beat of the track.
gen_hint: "two clips for a whip transition — clip A: <scene A>, at the end the camera suddenly whip-pans to the right and the whole frame smears into heavy horizontal motion blur; clip B: starts in the middle of the same rightward whip pan with identical horizontal motion blur, quickly decelerates and settles on <subject B> centered in frame"
commands: ["whip to the right between #3 and #4", "every location change in the travel cut as a whip pan on the beat", "whip transition on the drop, 5 frames of blur", "join #2 and #5 with a camera whip through the sky"]
related: [pan.whip, tilt.whip, trans.spin, trans.wipe, trans.hidden_cut, zoom.crash]
evidence: {examples: 8, sources: 8, measured: "13 seams: blur window 3–17 frames @25 fps (median 5 = 0.2 s); 0–9 frames before the cut, 0–5 after; sharpness at the peak ×0.03–0.25; displacement near the peak 20–45 % of the width per frame at 20 fps; blur ≈15–40 % of the width (from gradient anisotropy with calibration); 9 of 13 horizontal; direction before and after matches in all measurable seams; 8 of 13 seams in a uniform area", confidence: high}
