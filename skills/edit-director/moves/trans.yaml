id: trans.screen
family: trans
group: transition
level: B
aliases: [screen pull-out, screen push-in, through the screen, screen transition, it was on a screen, screen in hand, transition into the phone]
what: a full-screen picture turns out to be the image on a device screen in the next shot (a phone, a TV, a monitor, a scoreboard) — or the other way round, a screen in the frame grows and its content becomes the new frame
frames: |
  1. Out (5 of 8): the source shot fills the whole frame; then it shrinks into a rectangle with a device bezel —
     the linear scale drops to ×0.06–0.8 over 0.1–1.3 s; a new scene appears around the edges (a hand holding a phone, a room with
     a TV, a stadium with a scoreboard). Smooth variant — ease-in-out, ≈×0.9 per frame in the middle; sharp — ×0.74 over 2 frames.
     On the way the screen rotates by 25–30° to match the device's tilt.
  2. In (3 of 8): the screen in the frame grows with acceleration — area 0.2 → 1.0 over 0.3–0.6 s (a push-in ×1.7 over 0.4 s,
     or the screen is brought up to the lens, or the device flies in spinning); on fill the screen content becomes the frame.
  3. Switch (optional): a 1-frame interference band and white noise or a 2–3 frame flash — "the channel changed"; then
     a pull-out into the room ×0.77–0.36 over 0.9–1.2 s with a smooth stop.
  4. The picture on the screen is the same one that filled the frame all along: the motion inside is not interrupted.
variants:
  - it was on the phone: a full-screen video shrinks into a phone in someone's hand (×0.09 over 1 s or ×0.74 over 0.1 s), with the app interface around it
  - a game or animation filling the frame → a pull-out with a 25° roll to the subject's phone on the street
  - bridge through a screen: a push-in into a phone, the content fills the frame, a pull-out from another phone in another place
  - screen brought up to the camera: the frame in the subject's hands grows and becomes the new frame (area 0.05 → 0.87 over 1.5 s with acceleration)
  - flying-in device: a phone flies in from the side with a turn, its screen shows the next scene and fills the frame
  - old TV: the picture goes into a CRT (rounded corners, scan lines, vignette), interference and a channel change
  - nested screens with a twist: ×0.12 over 0.56 s with a −83° rotation, then ×0.06 over 0.72 s with a −205° rotation
status: hybrid
fallback: a screen quad is needed in the next shot (corner tracking or a mask); if there is no such shot — a device mockup in code (a phone or TV bezel, a hand from the source footage or generated) and the same animation; for a "screen in hand" pair you can generate a shot of the subject looking at a phone with a chroma key screen
params:
  dir: out (the picture goes into the screen) | in (the screen grows into the frame) | bridge (in + out via two devices)
  scale_out: linear ×0.06–0.8 (phone in hand 0.09–0.35, TV 0.3–0.8, scoreboard 0.06–0.12)
  dur_out: 0.1–1.3 s; smooth typically 1.0 s (ease inOutCubic), sharp 2–3 frames with motion blur
  dur_in: 0.3–0.6 s of final growth, ease inCubic; area 0.2 → 1.0
  rotate: rotation to match the device tilt 25–30°; twist for nested screens 80–205°
  switch: 1 frame of interference + noise or a 2–3 frame flash (TV)
  after: a pull-out into the surroundings ×0.36–0.77 over 0.9–1.2 s, ease outCubic
  style: a phone bezel and interface or a CRT (6–10 % corner rounding, scan lines, a warm tint, vignette)
  continuity: the same video keeps playing inside the screen without a pause; the screen corners are pinned to the track
when: a "we're watching a video → it turns out the subject is watching it" moment; UGC and ads for apps, gadgets, social networks; sports promos (match → scoreboard); a retro presentation via a TV; the hook and a change of context; once per 20–30 s
avoid: a shaky screen without a track — the insert "floats"; different aspect ratios (16:9 into 9:16) without reframing; a glare or reflection on the real screen that the insert lacks; a screen too small at 1080p without upscaling
sfx: on the shrink — a short whoosh; on the "device" — a click or a tap; on the channel change — CRT noise for 0.1–0.2 s; the video's sound gets quieter and goes "through a speaker" (a 300–3000 Hz band), while the room sound swells
genres: {ugc: signature, product: signature, viral: allowed, explainer: allowed, sport: allowed, teaser: allowed, fanedit: allowed, clips: allowed, fashion: allowed, travel: allowed, drama: allowed, calm: allowed}
detect: |
  ed_motion: ZOOM-OUT ×0.06–0.8, often with ROTATE 25–30° or a twist of 80–205°, while the shrinking picture
  gains a rectangular frame (a device body, an interface, a CRT) with a new scene around it; or an accelerating ZOOM-IN
  that ends in a cut exactly when the screen fills the frame. 1–3 white or noise frames in a row — a channel change.
  Difference from trans.portal: there the opening can be anything (a mouth, an eye, a door) and the camera passes through; here it is always a device and
  the picture's corners are pinned to the screen. Difference from pov.screen: there the camera takes the place of the screen, with no transition.
engine: |
  screen_track(B, kind='phone'|'tv'|'monitor') → quad(t); corner_pin(A, quad(t)) interpolating the corners
  from the frame border to the quad over dur=1.0, ease='inOutCubic' + blur(kind='zoom') on the fast part;
  style: device_overlay(kind='phone_ui'|'crt', round=0.08, scanlines=true) ; switch: channel_switch(noise_frames=2) +
  flash(color='white', dur=0.08); after: transform(scale=[1, 0.5], ease='outCubic', dur=1.0).
  In: the reverse interpolation quad → frame, cut on fill. No B: device_mockup(kind='phone', hand=true, tilt=25).
  + sfx('whoosh', at=start of the shrink) + sfx('click', at=landing).
