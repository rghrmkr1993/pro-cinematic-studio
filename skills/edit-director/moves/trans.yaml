id: trans.fade
family: trans
group: transition
level: A
aliases: [fade, fade to black, fade from black, fade in, fade out, dip to black, fade to white, cut to black, go to black, fade up from black, white-out, through black, black pause]
what: a fade to black or to white — the shot fades to black (or goes to white), a pause holds, and the next shot emerges from it; it puts a full stop, separates chapters, opens and closes the video
frames: |
  1. Out: A darkens evenly to black — a multiplier 1 → 0 on sRGB values over 4–8 frames (fast dip) or
     0.5–3 s (chapter, ending); mean brightness falls almost linearly (from 95 to 0 over 6 frames: 79, 63, 48, 32, 16).
  2. Hold: pure black (brightness ≤ 8 of 255) — 0–2 frames in a dip, 0.5–2 s in a chapter break (often with a title), until the end
     of the file at the ending. A fade to white is the same, but into white (brightness ≥ 245).
  3. In: B emerges from black over 4–8 frames (dip) or 0.5–2 s (opening, new chapter); B's sound may
     start in the black 0.2–0.5 s before the picture.
  4. Asymmetry: often one side is hard — a cut to black and a slow fade-in, or a slow fade-out and a hard
     cut from black straight into the first beat of the drop.
variants:
  - "fast dip: 4–6 frames down, 0–2 of black, 4–8 up (0.3–0.6 s) — a 'blink' between scenes, the darkest frame on the beat"
  - "chapter: out 0.5–1 s, black 0.5–2 s with a title (type.intertitle), in 0.5–1 s — a change of day, place or topic"
  - "opening from black: 0.5–2 s up to the first downbeat; in genres with a hook — no longer than 0.3 s, or none at all"
  - "ending to black: 1–3 s on the last note or phrase, then 0.5–1 s of black; or a hard cut to black on the last hit"
  - "black pause before the drop: a fade-out over 4–12 frames or a cut to black on the last beat of the build, 1–2 beats of black under the break or riser, the drop comes in with a hard cut from black"
  - "trailer-style drops to black: in the build the shot goes black for 2–6 frames on every downbeat — a pulse of black under the hits"
  - "white-out (fade to white): 0.3–1 s into white with a hold of 3 frames or more and back — a memory, a dream, light; white shorter than 3 frames is trans.flash"
  - "blink (POV): black 'eyelids' with a soft edge close from the top and bottom over 3–4 frames, 1–2 frames of black, then open over 4–6 frames"
  - "color dip: into a brand color or a night dark blue (#0b1020) instead of black — rare"
status: code
params:
  out: "dip 4–6 frames @25 fps / 5–7 @30 fps (0.16–0.24 s); chapter 12–25 @25 fps / 15–30 @30 fps (0.5–1 s); ending 25–75 @25 fps / 30–90 @30 fps (1–3 s); trailer-style drop 2–4 frames"
  hold: "dip 0–2 frames; trailer-style drop 1–3 frames; chapter 12–50 @25 fps / 15–60 @30 fps (0.5–2 s, at least 1.2 s with a title); pause before the drop 1–2 beats (at 120 BPM 12–25 frames @25 fps / 15–30 @30 fps); ending 12–25 @25 fps / 15–30 @30 fps"
  in: "dip 4–8 frames @25 fps / 5–10 @30 fps; opening and chapter 12–50 @25 fps / 15–60 @30 fps (0.5–2 s); in hook genres no more than 8 frames @25 fps / 9 @30 fps, or 0 (hard entry)"
  curve: "linear on sRGB values by default — looks even to the eye; inOutQuad — soft, 'cinematic'; fade-out inQuad — the picture holds longer and dies at the end; fade-in outQuad — the shadows appear right away; when blending in linear light use the multiplier (1 − p)^2.2, otherwise the frame 'hangs' bright and collapses at the end"
  frames_rule: "the last frame of the fade-out is fully black, the first frame of the fade-in already is not (B share = k/(N+1)); the run of frames darker than 12 of 255 = the hold + 2–5 frames (the ends of the ramp are dark too: with 4-frame ramps +2, with 6 +3, with 12 +5)"
  level: "black 0 (16 in limited range), white 255; with grain running through the whole video (look.film) keep 30–50 % grain strength in the hold so the black does not look 'dead'"
  sync: "dip — the darkest frame on the beat; chapter — black on the last beat of the phrase, fade-in on the downbeat; opening — 100 % picture by the first downbeat; ending — black on the last note or the end of its tail"
  audio: "in music genres do not fade the music on a dip; ending — volume linear in decibels down to −60 dB over the same time as the picture; chapter in speech genres — B's sound 0.2–0.5 s ahead of the picture, A's ambience fades out 0.2 s before the picture"
  lids: "blink — two 'eyelid' masks with a feather of 8–12 % of the height, closing inQuad over 3–4 frames, opening outQuad over 4–6 frames"
  limits: "dip — no more than once every 4–8 bars (except the trailer-style pulse in the build, 2–4 bars in a row); chapter — 1–3 per minute; ending — one; do not open or close a loop video with a fade"
when: |
  Opening (from black to the first downbeat) and ending (to black on the last note); a change of chapter, day, place or
  topic, time has passed; a pause for meaning after a strong line or punchline; the trailer-style pulse in the build (drops to
  black on the downbeats under the hits) and a black pause before the drop, exiting with a hard cut on the first beat of the drop;
  fade to white — a memory, a dream, "light". By part: hook — only a short opening of up to 0.3 s in genres with a hook
  (up to 2 s in cinematic ones); build — a pulse of drops to black or a pause before the drop; drop — not used (except
  a cut out of black); outro — the final fade-out of 1–3 s. In speech genres — between blocks of meaning at
  a pause in the speech, often with a chapter title. Limits: a dip no more than once every 4–8 bars, chapters 1–3 per minute.
avoid: the middle of the drop and dense cutting — it kills the energy (use trans.flash or a straight cut there); mid-phrase in speech genres — looks like a freeze; a long opening from black in the first 1–2 s of a short video — the viewer scrolls on; a final fade to black in a loop video (breaks the loop, see loop.end); fading the sound together with a dip in a music video — the beat must not sag; drops to black in a row without a musical reason — a "blinking" edit; 1–2 frames of black without a ramp — that is the black hit from trans.flash
sfx: in the hold — silence, a breath or sfx.riser peaking on the fade-in; trailer-style drop — a hit (sfx.impact) or sfx.sub_drop on the black frame; fade to white — a 0.4–0.8 s reverse cymbal peaking in the white; ending — the music goes out with the picture or is cut off by a hit, and the black holds for 0.5–1 s; chapter — A's ambience fades out, B's ambience comes in while still in black
genres: {drama: signature, teaser: signature, epic: signature, calm: allowed, motivation: allowed, travel: allowed, product: allowed, explainer: allowed, ugc: allowed, phonk: allowed, sport: allowed, fashion: allowed, fanedit: allowed, clips: allowed, viral: forbidden}
detect: |
  ed_motion (verified on synthetic renders): black frames (brightness < 12) — a run as long as the hold + 2–5 frames (the
  frames at the ends of the ramp are < 12 too); holds on pure black when the hold is 2 frames or longer; a slow fade has
  no cuts at all (the histogram changes smoothly), a fast dip has 1–2 "cuts" on the darkest frames; a
  cut to black has a cut exactly on the first black frame with no ramp. Fade to white — a run of white frames (> 225) and
  a cascade of false "cuts" on almost every frame of the ramp (the histogram drifts into white). ed_analyze: cut_in
  'dip_black' (a black frame within ±3 frames of the cut).
  Custom check: the brightness curve falls monotonically below 12 and rises monotonically; on the ramp frame ≈ g·A (normalized
  correlation with A ≥ 0.9 while brightness falls — A's structure is preserved, B is not mixed in); the number of frames with brightness
  between 15 and 85 % of A's level: 0 — a cut to black, 3 or more — a fade.
  Difference from trans.dissolve: there both shots are visible in the middle and there are no 2+ nearly black frames. From trans.flash: a peak of
  1–4 frames with a fast decay and usually no fade-out ramp; 1–2 frames of black without a ramp are the black hit from there. From
  look.drunk: drops of 1–5 frames inside one shot, the shot does not change. From trans.iris: the black comes in as a shape with a
  hard edge. From light.silhouette and scene.void: the black is part of the frame's content, not a ramp of the whole frame. From
  glitch.film_damage (film tail): black frames with dust and a flash.
engine: |
  transition(kind='dip(black)'|'dip(white)'|'dip(#0b1020)', dur=out+hold+in, params={out:0.24, hold:0.04, in:0.28,
             curve:['linear', 'linear']|['inQuad', 'outQuad'], space:'srgb', hard_in:false, grain_keep:0.4})
  Opening: fade(to='black', t=[0, 0.8], dir='in', curve='outQuad'); ending: fade(to='black', t=[T − 2.0, T − 0.5])
  + 0.5 s of black; black pause before the drop: fade(to='black', t=[drop − 0.74, drop − 0.5]) + cut(at=drop).
  Timeline: cut_in={id:'trans.fade', frames:N} — currently ed_render only does B's linear fade-in from black over N
  frames (8 by default); A's fade-out is the clip field fade_out={frames, curve}; EDL: ops [{f:[k], op:'black', a}] on the
  frames of the ramp.
  Blink: transition(kind='wipe(shape)', dur=0.4, params={shape:'lids', close:0.14, hold:0.06, open:0.2,
  feather:0.1}). Sound: duck(music, to=−60, t=[T − 2.0, T − 0.5], curve='linear_db') at the ending; in a chapter B's sound
  comes 0.2–0.5 s ahead of the picture; text(...) in the chapter hold (type.intertitle).
