id: trans.page
family: trans
group: transition
level: B
aliases: [page turn, page peel, page curl, paper tear, paper transition, fold transition, crumple transition, page flip, torn paper, torn frame, crumpled frame, paper-sheet frame]
what: the outgoing frame behaves like a sheet of paper or a photo print — it folds back and falls, tears down the middle or crumples up and flies away, while the next shot is already playing underneath
frames: |
  1. Setup: the outgoing shot runs as usual and keeps playing "on the sheet" until the very end of the transition;
     the incoming shot already sits whole underneath it and starts to show from the edge.
  2a. Fold-down: the sheet is hinged along its bottom edge and falls toward the viewer — the top edge drops
     and in perspective becomes wider than the frame; a slow start (over the first 0.6–0.9 s the edge moves by ≤7 % of the
     height), then ≈0.25–0.3 frame heights per second. The new shot's share goes 10→90 % in ≈3.5 s; midway
     the lower part of the sheet "lingers" (a plateau at 55–60 % for ≈0.6 s), and the sheet leaves past the bottom edge by 4.6 s.
  2b. Tear: a rip appears in the middle of the top edge, a V-shaped gap grows downward with the new shot inside it;
     10→90 % of the area in 0.55 s (14 frames @25 fps) with acceleration (50 % at 0.35 s from the start); at the end, at the bottom
     corners, curled light flaps are visible for 3–4 frames — the back of the paper (brightness 200+ of 255). The whole move ≈1 s.
  2c. Crumple: the sheet gets crushed — bends in a wave, crumples into folds with shadows and, shrinking, flies off into a corner;
     10→90 % reveal in 1.1 s, almost evenly. In the example the sheet is "grabbed" by the hand of the subject in the outgoing shot —
     they press a palm to the frame as if to glass and pull.
  3. Landing: the sheet is gone, the new shot is clean; often the next trick follows right away — a dissolve, the subject appearing.
variants:
  - fold-down toward the viewer — slow, 3.5–4 s, the sheet falls on its bottom hinge with perspective
  - tear down the middle — a gap from the top edge downward, flaps with a white back side, 0.55–1 s
  - crumple and toss — the sheet crumples into folds and flies off into a corner, 1.1–1.3 s; with a hand gesture — see gfx.touch_gesture
status: code
fallback: fold-down, corner curl and a straight tear — code (the sheet as a 3D plane or a mesh); realistic crumpling and a ragged edge with fibers — generate a paper mask element or take footage of a real sheet on a green background from the source footage; the hand that "grabs" the frame — a separate shot of the hand via a mask (mediapipe hands) or generation with consent
params:
  mode: fold | tear | crumple | curl
  dur: "fold-down 3–4 s (75–100 frames @25 fps), 10→90 % in ≈3.5 s; tear 0.55–1 s (14–25 frames); crumple 1.1–1.3 s (28–33 frames); corner curl 0.75 s"
  hinge: fold-down — along the bottom edge, the top edge comes toward the camera (in perspective 5–15 % wider than the frame)
  curve: "fold-down inCubic (slow start, ≤7 % of the height over the first 0.6–0.9 s), tear inQuad, crumple almost linear"
  backside: the back of the sheet is light, 200–240 of 255, with no image (or a mirrored copy of the frame, dimmed by 40–60 %)
  shadow: the sheet's shadow on the new shot at 15–30 % opacity, offset 1–3 % of the frame in the direction of motion
  tear_edge: a V-shaped gap from the center of the top edge, a ragged edge (noise 0.5–1.5 % of the frame), a white strip of fibers 0.5–1 % of the frame
  a_plays: the outgoing shot keeps playing on the sheet; the incoming one may stand still or have its own motion
when: a "turn the page" moment — a new chapter, day or location; a travel diary, an album, a magazine-style fashion presentation, a UGC joke "throwing out a bad take", a product reveal "from under the sheet"; fold-down — on calm music, in the intro or between chapters; tear — on a downbeat or a hit (a jerk); crumple — on a comedic pause; no more than once every 20–30 s, except in a stylized album-style video
avoid: drama and epic (the paper play kills the seriousness); fast beat-synced cutting — the fold-down is too long; titles and important details near an edge that tears or curls; a dark incoming shot under a light back side — the seam is too harsh; several paper transitions of different types in a row
sfx: paper rustling over the whole motion; for the tear — a short paper rip at the moment of tearing; for the crumple — a crunch and a slap at the end; for the fold-down — a soft slap when the sheet lands
genres: {ugc: allowed, travel: allowed, fashion: allowed, product: allowed, viral: allowed, explainer: allowed, calm: allowed, drama: forbidden, epic: forbidden, fanedit: forbidden, teaser: forbidden, motivation: forbidden}
detect: |
  ed_motion: no cut; in the sheet area — ZOOM-OUT or SHIFT with a shifted center, a small ROTATE and high nonrigid
  (the sheet deforms, unlike a rigid frame).
  Custom check — a per-frame mask of "closer to B than to A": the new shot opens from an edge or from a gap and grows
  monotonically; the old shot's area is a trapezoid with a widening far edge (fold-down), a V-shaped
  gap with white flaps along its edges (tear) or a shrinking crumpled blob with internal fold shadows
  (crumple); the image of A on the sheet keeps moving.
  Difference from trans.wipe: there the boundary is the edge of a real object or a straight line, and A is not deformed.
  From trans.set_change: there the set falls inside the scene while the subject stays in place; here the whole frame becomes the "sheet".
  From trans.screen: there the picture shrinks into a device screen. From gfx.touch_gesture: the same sheet, but it is
  triggered by a hand gesture in the frame.
engine: |
  Fold-down: page_fold(a=A, b=B, hinge='bottom', toward='camera', dur=3.5, ease='inCubic', backside='light', shadow=0.25)
  Corner curl: page_curl(corner='top_right', dur=0.75) — a primitive from gfx.touch_gesture
  Tear: paper_tear(a=A, b=B, start=[0.5, 0.0], dir='down', dur=0.6, ease='inQuad', edge_noise=0.01, fiber=0.007, flaps=true)
  Crumple: sheet_crumple(a=A, b=B, to='bottom_left', dur=1.2, folds=8) or a generated sheet mask
  + sfx('paper', at=start) + sfx('impact', at=end, gain=-6) for the fold-down; tear — starts on the beat of the track.
