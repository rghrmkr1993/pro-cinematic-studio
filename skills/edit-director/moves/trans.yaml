id: trans.spin
family: trans
group: transition
level: B
aliases: [spin transition, barrel roll, rotation transition, barrel roll transition, twist]
what: a cut inside a rotation of the frame around the lens axis — the outgoing shot spins up, the incoming one continues the rotation in the same direction and settles level
frames: |
  1. Spin-up: the outgoing shot starts to roll clockwise or counterclockwise, accelerating over 2–10 frames @25 fps; in the full variant it makes
     a whole 360° turn in 0.7 s, the speed rising from 9–12 to 55–60° per frame (14 fps).
  2. Seam: a cut at the peak of angular velocity, usually 600–900°/s (24–36° per frame @25 fps); rotational motion blur,
     sharpness ×0.3–0.5; the center of the frame holds one anchor before and after (an object, a vanishing point, a graphic), so the eye does not lose focus.
  3. Landing: the incoming shot starts rotated by 75–280° from its level position and keeps turning in the same
     direction down to 0° over 5–14 frames @25 fps (0.2–0.55 s), decelerating (35 → 20 → 10 → 0° per frame); often combined with
     a pull-out or push-in of 5–15 % per frame.
  4. Slow variant without landing: both shots rotate at the same constant speed (110–170°/s), the cut sits
     inside the motion; the angular velocity matches within ±10 % (−5.7 → −5.1° per frame; 24.9 → 25.8° per frame).
variants:
  - turn and landing: the outgoing shot makes 360°, the incoming one turns the remaining 80–100° and settles
  - continuous rotation: the cut is inside a continuous spin, the speed does not change (wide-angle flight, dance)
  - rotation + push-in: a constant roll of 5–6° per frame with a push-in of 5–8 % per frame, the next shot continues the same
  - landing with a pull-out: the incoming shot unwinds by 185° while pulling out
  - rotating insert: the whole shot is rolling (≈270° in 1.6 s), the entry and exit are dark 3-frame wipes
  - turn around an object: the background turns like a cube face around a stationary product in the center, 4–5 frames
status: code
fallback: best of all — real rolls in the source footage (gimbal, flight, a handheld camera being spun); the engine looks for ROTATE events with the same direction of rotation in the tails and heads of clips and cuts where the speeds match; otherwise — a digital rotation with rotational motion blur; a product turn around the vertical axis — generate a pair of frames or use a product mask over two backgrounds
params:
  seam: at the peak of angular velocity; the same direction on both sides; speeds match ±15 %
  angular_speed: fast 600–900°/s (24–36° per frame @25 fps); slow continuous 110–170°/s (4–7° per frame @25 fps)
  ramp_out: 2–10 frames @25 fps, ease inCubic; a full 360° turn — up to 0.7 s
  land_in: 5–14 frames @25 fps (0.2–0.55 s), ease outCubic; the incoming shot's starting angle 75–280° away from level
  total_roll: 90–360° per transition (usually 180–270°)
  center: the frame center; on it — a shared anchor for both shots (a face, a product, a vanishing point, a circle or a crosshair)
  scale: an accompanying push-in of +5–8 % per frame or a pull-out of up to −15 % per frame; with a digital rotation — a ×1.3–1.5 scale-up against empty corners
  blur: rotational motion blur, arc angle ≈0.5–1× the per-frame rotation; at the peak sharpness ×0.3–0.5
  edges: mirrored edge extension if the scale-up is less than needed
when: a scene change in a music video, dance, skate or flight footage; the entry into the drop or chorus; a showy cut between two different locations that share a common center; product variant changes (flavor, color) around a stationary object; no more than 1–2 times per 15 s, continuous rotation — once per story
avoid: calm, documentary and talking-head material; shots with important content near the frame edges (it goes into the corners when rolling); text and titles in frame during the rotation; rotation in opposite directions at the join; repeating it back to back — it causes motion sickness
sfx: a rotating whoosh or a "swirl" over the whole turn, the sound peaks on the cut; on the landing — a hit or bass on the beat
genres: {fanedit: signature, phonk: allowed, viral: allowed, sport: allowed, travel: allowed, ugc: allowed, teaser: allowed, product: allowed, fashion: allowed, clips: allowed, epic: allowed, calm: forbidden, explainer: forbidden}
detect: |
  ed_motion: ROTATE events peaking at 5–50° per frame on both sides of the cut, with the same sign; on fast frames
  ed_motion often adds extra "cuts" and underestimates the angle (LK cannot hold more than ~30° per frame) — then measure the per-frame angle
  by matching rotation-invariant keypoints (SIFT + RANSAC). Signs: rotational motion blur,
  a stationary center, the histogram changes inside the rotation; the incoming shot ends its rotation exactly at 0°.
  Difference from roll.camera (a roll within one shot): no scene change. From trans.whip: there shift and
  directional motion blur dominate. From the spiral zoom.infinite: there the constant push-in is the point, the roll is secondary.
engine: |
  Real rolls: find_motion_peak(A, side='tail', kind='rotate') + find_motion_peak(B, side='head', kind='rotate'),
  check the sign and |ω_A − ω_B| ≤ 15 % → cut at the peak.
  Digital: transition(kind='spin', dur=0.5, params={dir:'cw', out_angle:120, in_angle:-120, center:[0.5,0.5],
  ease:['inCubic','outCubic'], scale:1.4, blur:'spin', edge:'mirror'}) =
  A: transform(rotate=[0, 120], scale=[1, 1.4], center=[0.5,0.5], t=[seam-0.2, seam], ease='inCubic') + blur(kind='spin', amount∝ω)
  B: transform(rotate=[-120, 0], scale=[1.4, 1], t=[seam, seam+0.3], ease='outCubic') + blur(kind='spin', amount∝ω)
  + sfx('whoosh', at=seam, align='peak') + sfx('impact', at=seam+0.3). Center anchor: center=track(face|object) on both shots.
gen_hint: "two clips for a spin transition — clip A: <scene A>, the camera rolls clockwise around the lens axis faster and faster, frame spins with rotational motion blur; clip B: starts mid-roll in the same clockwise direction with rotational blur, decelerates and settles perfectly level on <subject B> centered"
commands: ["clockwise spin transition between #2 and #3", "spin the camera into the next shot on the drop", "full turn and a cut at 0:14", "0.4 s spin transition, centered on the face"]
related: [trans.whip, roll.camera, zoom.infinite, trans.arc, trans.wipe]
evidence: {examples: 8, sources: 8, measured: "6 rotation seams + 2 variants; angular velocity at the seam 600–900°/s (fast) and 110–170°/s (continuous); landing 0.2–0.55 s with a starting angle of 75–280°; the direction of rotation matches in all seams, the speed in continuous ones matches within ±10 %; per-frame angles via SIFT + RANSAC and log-polar correlation (verified on synthetic data to ±0.3°)", confidence: high}
