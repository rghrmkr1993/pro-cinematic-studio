id: trans.morph
family: trans
group: transition
level: B
aliases: [morph, morphing, morph transition, flowing morph, face morph, morph cut]
what: one image flows smoothly into another — contours and features shift into the positions of the new object at the same time as the color changes; a transition between faces, objects, shapes, or a chain of such transformations
frames: |
  1. Setup: the two objects are aligned — the same shot size, the eyes or silhouette on one line (±2–3 % of the frame),
     size ±10 %, a background of the same tone. The camera is static; if the sources move, the morph is done
     on freeze frames or on nearly motionless phases.
  2. Flow: contours, features and patches of color travel to their new places, the tone changes together with the shape.
     The middle frame is not an overlay of two pictures but a "hybrid": there are almost no double contours.
     A single morph — 0.3–1.2 s (8–30 frames @25 fps); a slow artistic one — up to 4–5 s
     (10→90 % in 4.0 and 5.3 s); a cartoon one — 0.8 s.
  3. Landing: the new object comes together and holds for 0.3 s or more — or immediately starts the next morph (chain).
  Chains: 10 faces in 1.8 s (≈0.18 s per face) with no pauses; 2–4 frames per face in a fast neural-network
  chain; 0.5–0.8 s per transformation in a hand-drawn chain (drawings animated "on twos"); ≈1 s per identity
  when the face changes right during speech.
variants:
  - a direct morph of two faces or objects with aligned features (mesh warp + color change)
  - portrait chain: faces flow continuously one into another, the eyes stay in place
  - identity change during speech: a person talks while their face gradually becomes someone else's
  - through a "bridge": a shared intermediate shape — a wide-open mouth, a blot, a splash of liquid, a silhouette
  - metamorphosis of a creature or shape (human → butterfly, fish → bird → airplane), often looped
  - glitch morph: a flow with pixel blocks, color shifts and smear
  - neural-network morph of a whole scene: the street or the figures are continuously "rewritten"
status: code
fallback: if the shapes are too different (human → animal, object → logo) and the mesh warp produces mush — generate an in-between video from the first and last frames, with the user's consent; changing the identity of a real person — only with that person's consent
params:
  dur: single 0.3–1.2 s (8–30 frames), typically 0.6 s (15 frames); slow artistic 2–5 s
  chain_link: fast chain 0.15–0.3 s per link (4–8 frames); readable — 0.5–1 s + a 0.2–0.5 s pause
  align: similarity transform (shift + scale + rotation) by the eyes and mouth (face mesh) or by the silhouette; eyes ±2–3 % of the frame
  points: face_mesh for faces, pose for figures, optical flow for objects without landmarks
  warp_ease: inOutCubic — the geometry moves over the full length of the morph
  blend_window: the color change happens in the middle 30–70 % of the duration (smoothstep), to avoid double contours
  bg: same background — morph the whole frame; different — an object mask + a separate dissolve of the background
  bridge: optional — an intermediate shape at 40–60 % (a dark spot, an open mouth, a blot)
  glitch: optional — rgb_split 4–10 px and 8–16 px blocks over 30–70 % of the duration
when: portraits of one type flowing into each other (people, products, logos); "before/after", growing up and aging, the evolution of an object; a chain of faces about a community ("all of us"); silhouette → logo in the finale; a long note or a sustained sound; a single morph — no more than once every 20–30 s, a chain — a separate 2–5 s segment
avoid: objects not aligned in scale, angle and position — the result is mush; different backgrounds without a mask; fast motion in the sources (the points jitter) — morph freeze frames instead; changing the identity of real people without consent; frequent use looks like a 90s effect unless it is a deliberate style
sfx: a sustained swell or a "liquid" whoosh over the whole morph; in a chain — a rhythmic pulse on every link; a reverse_whoosh leading into the moment the new object comes together; a shimmering synth pad under a slow morph
genres: {fanedit: signature, viral: allowed, teaser: allowed, fashion: allowed, product: allowed, explainer: allowed, motivation: allowed, epic: allowed, drama: allowed, calm: allowed, ugc: allowed}
detect: |
  ed_motion: no cuts (in a fast neural-network chain histogram jumps produce false "cuts"
  every 2–8 frames); no global motion, only the shapes inside the frame change; no holds.
  Custom check — the middle frame as a mix of its neighbors: M ≈ (1−a)·A + a·B; for a morph the fit residual is
  0.34–1.1 of the A–B difference (typically 0.55–0.75): the features have moved, this is not an overlay.
  Landmarks (eyes, mouth, silhouette) stay in place from link to link, the "identity" changes.
  Difference from trans.dissolve: in a dissolve the contours do not move, both images are visible at once.
  Difference from cut.match: the shapes match, but the change is instantaneous, with no in-between frames.
  Difference from trans.metamorphosis: there the transformation is staged within one shot (light, particles,
  an occluder, makeup), rather than a geometric interpolation of two pictures.
engine: |
  transition(kind='morph', dur=0.6, params={points:'face_mesh'|'pose'|'flow', align:'similarity',
    warp_ease:'inOutCubic', blend:[0.3, 0.7], bg:'warp'|'mask'})
  Chain: morph_chain(images[], per_link=0.3, hold=0–0.3, align='eyes', points='face_mesh')
  Bridge: morph(A → bridge_shape → B) as two halves of 0.3 s each; glitch: + rgb_split(px=6) + datamosh in the middle.
  Complex shapes: gen_transition(first=A.last_frame, last=B.first_frame, prompt='<A> morphs into <B>', dur=1–2)
  + sfx('swell', at=t0) + sfx('reverse_whoosh', at=t0+dur, align='peak')
gen_hint: smooth seamless morph, <subject A> gradually morphs into <subject B>, features stay aligned, same framing and plain background, continuous liquid transformation, no cut
commands: ["morph face #2 into face #3", "a chain of morphs through all the portraits, 0.3 s each", "the product silhouette flows into the logo in the finale", "morph transition between #4 and #5 on the long note"]
related: [trans.metamorphosis, trans.dissolve, cut.match, glitch.datamosh, fx.glitch]
evidence: {examples: 14, sources: 14, measured: "10→90 %: human → butterfly 4.0 s, portrait 5.3 s, cartoon through an open mouth 0.8 s; chains — 10 faces in 1.8 s, 2–4 frames per face, 0.5–0.8 s per hand-drawn transformation (on twos), ≈1 s per identity during speech; the middle frame is not a mix of its neighbors — residual 0.34–1.1; no cuts and no global motion", confidence: high}
