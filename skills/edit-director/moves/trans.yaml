level: C
aliases: [side-scrolling shot, side scroll, side-scroller, tracking through a cutaway set, cutaway set tracking, dollhouse, dollhouse shot, lateral oner, transition behind a column, outfit change behind pillar]
what: the camera tracks steadily sideways along a row of adjacent "cells" — train compartments, rooms, shops, lockers — and behind each wall or column a new scene, a new time or the same subject in a new state is revealed; several scenes are tied together by one continuous move
frames: |
  1. The camera looks frontally and strictly perpendicular to the set, at eye level; the frame is symmetrical,
     the light is even. A sideways move begins at a constant speed of ≈0.6–1.5 % of the frame width per frame.
  2. Cell: 1–3 s of screen time for each — a room, a train compartment, a shop window, a booth, a gap between lockers
     or bookshelves, a row of spectators. Inside — a short scene: the subject does one action,
     turns around, changes clothes, meets someone else.
  3. Boundary: a wall, a column, the end of a shelf, a tree trunk, a door jamb or a dark gap takes up
     5–25 % of the width and crosses the frame in 4–12 frames; behind it is already another cell (another place, time
     of day, year, group of people) or the same subject walking beside the camera, but in new clothes.
  4. 2–6 cells per pass; the camera does not stop, the music is continuous. The ending — a stop on the last
     cell or an exit past the edge of the set.
variants:
  - cutaway of a train car or a house: the walls of compartments and rooms are seen in cross-section, the camera glides from room to room
  - subject walks with the camera: passes behind a column or a locker and comes out in different clothes, at a different age, in a different place
  - row of shop windows or stalls: facades with a subject in each opening, a flat theatrical set
  - along a row of faces: spectators, visitors, guests at a table — one reaction per cell
  - shelves and aisles: the ends of the shelves act as wipes, a new scene in each aisle
  - the set moves by itself: the camera stands still, the backdrop and objects glide past the subject as if on a conveyor belt
  - graphic strip: clips sit in cell frames along a single strip, the strip slides sideways (code version)
status: code
fallback: the real version is footage (a lateral tracking shot along a cutaway set or columns; look in the source footage for a long steady tracking shot with foreground pass-bys and put hidden cuts on the frame of full occlusion); the code version — a strip of the user's clips in "cells" separated by walls; a subject passing from cell to cell — hybrid (a subject mask over the strip); no suitable cells — generate room plates with the same camera height, with the user's consent
params:
  speed: 0.6–1.5 % of the frame width per frame @25 fps (≈0.15–0.4 widths per second), typically 1 %; constant, no slowing down at cells
  cell: 1–3 s of screen time (25–75 frames), typically 1.8 s; cell width 0.8–1.2 frame widths
  cells: 2–6 per pass, typically 4
  divider: 5–25 % of the frame width (a wall, a column, a dark gap); the same texture and color for all walls; crosses the frame in 4–12 frames
  hidden_cut: if the cells are different clips, cut on the frame where the wall covers ≥85 % of the frame, or along its edge with a mask
  direction: one for the whole pass (usually left to right); do not change it within a series of passes
  match: one camera height, floor line and horizon ±2 % of the frame height, the same focus and light in all cells
  framing: frontal, symmetrical, the subject in the center of their cell at the moment the cell is centered in the frame
  ease: linear; acceleration and deceleration only at the start and end of the pass, 0.3–0.5 s
when: introducing a team or characters (each in their own cell), parallel lives and simultaneous actions, the passage of time (the same subject years or days later), outfit changes in fashion and UGC (a pass behind a column — a new look), a tour of an apartment, an office, a shop, the steps of a process in an explainer video; a cell = a beat or a bar, a pass — over a verse or a build; 1–2 passes per video
avoid: cells with different camera heights, floor lines or perspective — the "strip" falls apart; jerky speed; cells shorter than 0.8 s (they do not read); a lateral tracking shot where nothing changes behind the wall (that is just truck.lateral); cells with their own camera movement
sfx: on each wall — a short whoosh or rustle; the sound of the cells (room tone, voices, street) changes with a 0.2–0.3 s crossfade at the wall; the music is continuous, the cell change lands on the beat
genres: {fashion: signature, product: allowed, explainer: allowed, ugc: allowed, viral: allowed, travel: allowed, teaser: allowed, calm: allowed, drama: allowed, fanedit: allowed, clips: allowed, motivation: allowed}
detect: |
  ed_motion: a long SHIFT along X for 3–10 s with an almost constant speed of 0.6–1.5 %/frame and little rotation;
  nonrigid is low for a flat cutaway set (≈0.1–0.3), higher for columns in front of a deep background.
  Custom check: vertical dark or uniform bands 5–25 % of the frame wide cross the frame
  at the same speed every 1–3 s; after each band the content histogram changes noticeably
  (a new scene), while the shift speed and the floor line do not. A hard cut, if any, falls on the frame of full
  occlusion by the wall.
  Difference from truck.lateral: there the scene behind the obstacle does not change. From trans.wipe: there it is a single wipe between
  two frames, while here it is a series of cells in one move. From trans.set_change: there the subject stands still and the set
  physically goes away; here the camera (or the set strip) moves sideways past a row of cells.
engine: |
  Code strip: side_scroll(clips=[c1..cN], cell_w=1.0, divider=wall(width=0.12, texture='plaster'|'black', blur=0.02),
                 speed=0.01 widths/frame, dir='ltr', ease='linear', play='while_visible')
  — the clips are placed in the cells of one horizontal strip, the viewfinder travels along the strip; the floor line is aligned
  for each cell (reframe by the horizon).
  Real tracking shot: find_cover_frame(clip, min_cover=0.85) on each column → cut on the occlusion frame.
  The subject moves from cell to cell: mask(method='mediapipe_person') + composite over the strip.
  + sfx('whoosh', at=each wall, align='peak') + ambience_xfade(cell_i, cell_i+1, dur=0.25).
gen_hint: smooth lateral tracking shot along a cutaway set of adjacent rooms, the camera slides sideways at a constant speed past thin walls, each room shows a different short scene with <characters>, symmetrical frontal framing, flat even lighting, dollhouse cross-section look
commands: ["move the camera sideways through scenes #2–#5, with walls between them", "team intro: everyone in their own room, sideways tracking shot", "pass behind a column into a new look, on every beat of the chorus", "make an apartment tour in one sideways tracking shot"]
related: [trans.wipe, trans.set_change, truck.lateral, frame.tableau, frame.central, layout.split_screen]
evidence: {examples: 40, sources: "≈25 (different works, judging by their look)", measured: "visual review only: about 40 examples of the section at 3–4 moments of the animation (scripted frame capture was blocked by browser permissions); speed, cell length and wall width are '≈' estimates, not measured", confidence: medium}
