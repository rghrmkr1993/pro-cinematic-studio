id: trans.zoom
family: trans
group: transition
level: B
aliases: [zoom transition, crash zoom transition, zoom-through, zoom punch transition, push-in transition, flying through the frame]
what: a cut at the peak of a sharp push-in — the outgoing shot accelerates into a detail, the frame blurs radially, and the next shot comes out of the same motion, braking on the new scene
frames: |
  1. Acceleration: the outgoing shot pushes in ×1.7–5 over 0.25–0.65 s (6–16 frames @25 fps), speeding up; peak ×1.12–1.38 per frame
     @25 fps on the last frame; the center is on a detail (a logo, teeth, a shadow on a wall, a point in the sky), 0.49–0.63 of the frame.
  2. Seam at peak speed: sharpness drops to ×0.12–0.36 (radial motion blur); 0–5 frames of "filler" — solid
     blur, a bright surface the camera has driven into, or the coarse texture of a screen (colored pixel stripes) when
     pushing into a display; a jump in brightness is acceptable (driving into a white wall → coming out of a dark scene).
  3. Exit, "through" variant (3 of 4): the incoming shot continues the push-in while braking — ×1.2–1.75 over 0.25–0.3 s,
     the first frame ×1.3–1.43 per frame @25 fps, or a long smooth glide ×45 over 1.6 s; the frame quickly regains sharpness.
  4. Exit, "rebound" variant (1 of 4): the incoming shot starts scaled up ×1.3–1.4 and pulls back to ×1 over 4–8 frames,
     the blur fades — this is how the typical zoom transition template works.
variants:
  - through into a new scene: a push-in on a detail → the new scene continues the push-in and brakes
  - two-step: a punch-in to a tighter shot of the same object (+×1.3–2.5 over 3 frames), then a cut into the new scene
  - through screen texture: a push-in into a logo or display down to the colored pixel grid (5 frames), exit into a live-action scene
  - through light: a push-in into a bright wall or a blown-out area → a new dark scene (the contrast acts as a hit)
  - rebound: the new scene "pulls back" from a ×1.3–1.4 scale-up to normal in 0.2–0.3 s with blur
status: code
fallback: with a small source (1080p and a push-in of ×3+) — upscale the clip's tail or replace the peak of the push-in with blur frames; for the "through texture" variant — generate a macro texture (pixel grid, fabric, skin) for 3–5 frames
params:
  out_scale: ×1.7–5 over 0.25–0.65 s (6–16 frames @25 fps), ease inExpo/inCubic, peak ×1.12–1.38 per frame @25 fps
  in_scale: through — ×1.2–1.75 over 0.25–0.3 s (6–8 frames @25 fps), ease outExpo, first frame ×1.3–1.43; long — up to ×45 over 1.6 s; rebound — ×1.35 → ×1 over 0.2–0.3 s
  seam: at peak speed; filler 0–5 frames (blur, texture, burn-out)
  blur: zoom_blur, strength ∝ scale speed; at the seam sharpness ×0.12–0.36
  center: on A's detail and on B's center of interest (track(face|object)), spread 0.49–0.63
  total: 0.4–1 s from the start of the acceleration to the landing
  match: ideally A and B have a similar shape or tone in the center (bright into bright, circle into circle); otherwise the blur hides the seam
when: a change of location in a travel cut and promos; the entry into the drop and a change of track section; "here's where we're headed" — a push-in into a map, a logo, a screen; an accent cut once every 10–20 s; pairs well with trans.whip as a change in the direction of motion
avoid: calm, slow stories; frame A without a clear detail in the center (a push-in "into nowhere"); different centers of interest in A and B (the eye jumps); repeating it too often — causes motion sickness; low resolution without upscaling (mush at ×3+)
sfx: a rising whoosh or riser on the acceleration, peaking on the cut; on the landing — a hit or bass on the beat; when pushing into a screen — a short digital crackle
genres: {travel: signature, viral: signature, fanedit: signature, phonk: allowed, sport: allowed, product: allowed, teaser: allowed, ugc: allowed, clips: allowed, motivation: allowed, epic: allowed, fashion: allowed, calm: forbidden}
detect: |
  ed_motion: ZOOM-IN with ease-in (50 % of the travel after 0.7 of the duration) ×1.7–5 → a cut (often 2–3 "cuts" in a row on the blur
  frames) → ZOOM-IN again with ease-out and its peak on the first frame (or ZOOM-OUT ×0.75–0.88 in the "rebound" variant);
  min sharpness ×0.12–0.36 at the seam; scale center 0.49–0.63 before and after.
  Difference from zoom.crash: there is no cut there, the jerk ends on a detail of the same scene. From trans.portal: there the camera
  passes through a real opening (a screen, a mouth, a door) and the seam is at the moment it fills the frame. From zoom.infinite: there the speed is constant
  with nested links, no acceleration and braking. From trans.whip: shift dominates there, not scale.
engine: |
  transition(kind='zoom', dur=0.5, params={out_scale:3, in_scale:1.5, mode:'through'|'punch', center:track(target),
  ease:['inExpo','outExpo'], blur:'zoom', filler:0|'texture'|'white', filler_frames:0–5})
  = A: transform(scale=[1, 3], center=target_A, t=[seam-0.35, seam], ease='inExpo') + blur(kind='zoom', amount∝speed)
  + B (through): transform(scale=[1, 1.5], center=target_B, t=[seam, seam+0.28], ease='outExpo') + blur(kind='zoom')
  + B (punch): transform(scale=[1.35, 1], t=[seam, seam+0.25], ease='outCubic') + blur(kind='zoom')
  + sfx('riser'|'whoosh', at=seam-0.35, align='attack') + sfx('impact', at=seam). The seam lands on the beat of the track.
gen_hint: "two clips for a zoom transition — clip A: <scene A>, the camera rapidly accelerates forward straight into <detail at frame center> with heavy radial motion blur; clip B: starts with heavy radial zoom blur, the camera keeps moving forward and quickly decelerates, settling on <scene B>"
commands: ["zoom transition between #1 and #2 on the drop", "fly into the logo on the map and come out on the street", "crash transition through the light into the dark scene at 0:09", "two-step push-in on a detail and a cut into the next scene"]
related: [zoom.crash, trans.portal, zoom.infinite, trans.whip, trans.hidden_cut]
evidence: {examples: 4, sources: 3, measured: "ed_motion: acceleration ×1.75–5.1 over 0.3–0.65 s, peak ×1.15–1.5 per frame at 20 fps (≈×1.12–1.38 @25 fps); sharpness at the seam ×0.12–0.36; through exit — ×1.2–1.75 over 0.25–0.3 s with a peak of ×1.4–1.57 per frame on the first frame, or ×45 over 1.6 s ease-out; rebound ×0.75 over 0.2 s; filler 0–5 frames (blur, pixel grid, burn-out); center 0.49–0.63", confidence: medium}
