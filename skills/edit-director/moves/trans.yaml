id: trans.shatter
family: trans
group: transition
level: B
aliases: [shatter transition, glass shatter, broken glass, disintegration, dust transition, particle dissolve, shards, frame shatters, crumble to dust, particle disintegration, cracks]
what: the outgoing frame breaks like a material — it cracks into glass shards in which the next shot is already visible, or crumbles into fine dust that the wind blows away, revealing the new scene
frames: |
  Shards:
  1. Impact: a flash almost to white for 3–4 frames (mean brightness 143 → 236 → 241 → 148 of 255, ≈0.15–0.2 s) —
     the moment of the "hit"; sometimes preceded by 4–5 frames of ragged pieces with a paper edge.
  2. Cracks: 6–10 thin bright jagged lines divide the frame from edge to edge (1.3–2.6 % of the frame's pixels),
     making 8–12 shards. The shards hold pieces of two different images (another face, another shot);
     the shards change their content not all at once but out of sync over 0.75–1 s.
  3. Landing: the new shot assembles in the shards, the cracks lie over it as a trace for another 1–2 s, then
     go away or stay as the texture of the episode.
  Dust:
  1. Setup: a push-in on the subject ×2.8 over 0.5 s against a plain background.
  2. Disintegration: the figure and the background crumble into fine grains of 0.5–1 % of the frame, the grains are carried to one side
     by 10–30 % of the width; the disintegration boundary is grainy and runs across the frame, with the new shot behind it;
     10→90 % reveal in 0.45 s (11 frames @25 fps), the frame's sharpness jumps 2–5 times during this because of the grit.
  3. Landing: the remainder of the old shot disappears with a cut; 0.5 s later, in the example, the whole disintegration runs in reverse
     — the dust gathers back into the subject (a "boomerang").
variants:
  - glass shards with a flash — cracks across the face, other people's faces and the next shot in the shards, 1–1.2 s
  - crumbling to dust — the grains blow away to the side, the new scene behind them, 0.45–0.6 s
  - boomerang — disintegration and reassembly 0.5 s later (A → B → A), on a repeated musical phrase
status: code
fallback: shards with volume, refraction and rotation in 3D — generate a short stock element of shards flying apart (with consent) and use it as a mask; without it the code cuts the frame into Voronoi cells that fly apart flat; dust — code using a figure mask (mediapipe_person or hf_remove_background), so that the subject crumbles rather than the whole frame
params:
  mode: shards | dust
  dur: "shards 0.75–1 s of content change + a 0.15–0.2 s flash (3–5 frames @25 fps); dust 10→90 % in 0.45–0.6 s (11–15 frames)"
  cells: 8–12 shards, Voronoi cells or radial cracks from the impact point (the center of the face or a point at 0.4–0.6 of the frame)
  crack: lines 0.1–0.2 % of the frame width, bright (85–95 % of white), jagged; together 1–3 % of the frame area
  flash: a white flash of 3–4 frames (inQuad up over 1 frame, holds 1–2 frames, falls off over 1 frame) at the moment of impact
  swap: the shard contents change out of sync in steps of 1–3 frames; or the shards fall with an acceleration of 2–3 frame heights/s² and a rotation of up to 30°
  grain: grains of 0.5–1 % of the frame, the disintegration front crosses the frame at ≈1 width/s, drift of 10–30 % of the width downwind
  boomerang: the reverse pass 0.4–0.6 s later (mirrored time)
  color: in the shards example — black and white (saturation 0), the cracks show better on a dark frame (brightness 30–35)
when: a "break" — an impact, a bass hit, the entry into the drop, collapse and loss, a villain, the mystical; dust — the subject vanishing, magic, a character's death, a fantasy teaser; boomerang — a dance music video on a repeated phrase; no more than once every 20–30 s; shards — once per scene, the other hits get something simpler (cut.flash, shake)
avoid: a calm, explanatory or business tone; a small subject in frame — the shards and dust do not read; a bright flat frame — the thin bright cracks get lost; frequent repetition — the effect cheapens; a low-resolution source (the shards turn "mushy")
sfx: shards — a hit and the crash of breaking glass exactly on the flash, then small shards trickling down for 0.5–1 s; dust — a rustling, hissing whoosh over the whole disintegration, a sub hit at the start; boomerang — the same sound reversed
genres: {fanedit: allowed, phonk: allowed, teaser: allowed, viral: allowed, drama: allowed, epic: allowed, calm: forbidden, explainer: forbidden}
detect: |
  ed_motion: shards — white/flash frames for 2–4 frames at the moment of impact and false "cuts" on every frame while the pieces
  change; dust — often a ZOOM-IN ×2–3 over 0.5 s before the disintegration, then a "cut" on the last frame of the disintegration.
  Custom check: shards — thin bright jagged lines (brightness 45+ above the local median) take up
  1–3 % of the frame and run from edge to edge, between them pieces of different images change on different frames
  (difference between neighboring frames 6–9 versus 1.5–3 in calm ones); dust — the "closer to B" mask grows from one side
  with a grainy front (many small spots along the boundary), the frame's sharpness is 2–5 times higher than normal for 0.3–0.5 s.
  Difference from trans.iris (the shards variant): there regular pieces of the new shot grow over the intact old one,
  the old one does not crack or fly apart. From trans.metamorphosis (disintegration into particles): there the subject disintegrates and
  reassembles within one shot, the background stays the same. From trans.liquid (burn): there it is ragged soft patches,
  with no cracks or flying grains. From fx.glitch: there bands slide sideways, with no cracks.
engine: |
  Shards: shatter(a=A, b=B, impact=track(face)|[0.5, 0.5], cells=10, crack={width:0.0015, brightness:0.9},
  mode='swap'|'fall', stagger=0.08, fall={gravity:2.5, spin:30}, dur=0.9) + flash(color='white', t=impact, dur=0.15, curve='outQuad')
  Dust: disintegrate(a=A, b=B, mask=mask('mediapipe_person')|None, dir='right', grain=0.007, front_dur=0.5, drift=0.2, noise_scale=0.05)
  Boomerang: the same disintegrate in reverse time 0.5 s later.
  + sfx('impact', at=impact) + breaking glass; dust — sfx('whoosh', at=start, align='attack'). The impact lands on the downbeat.
gen_hint: "<scene A> shatters like a pane of glass from an impact point, thin bright jagged cracks, sharp shards fly apart revealing <scene B> behind; alternative: <subject> disintegrates into fine dust carried away by the wind, revealing <scene B>"
commands: ["shatter the frame like glass on the drop", "crumble her to dust and reveal the next scene", "cracks across the face, other faces in the shards", "crumble and reassemble on #7"]
related: [trans.iris, trans.metamorphosis, trans.liquid, trans.page, fx.glitch, cut.flash, look.video_game]
