id: trans.wipe
family: trans
group: transition
level: B
aliases: [wipe, object wipe, body wipe, foreground wipe, lens occlusion, walk-by at the lens]
what: a wipe — the boundary between shots travels across the frame, most often hidden by an object right at the lens (a passer-by, a column, palms, a back), behind which the new scene opens up
frames: |
  1. Entry: a heavily blurred close object appears at the edge of the frame (dark in 5 of 9 examples, light in 2, palms
     or a back in 2) and moves across the frame, more often right to left (6 of 9); the edge moves by 4–10 % of the frame width
     per frame @25 fps, up to 27 % in a fast pass.
  2a. Full occlusion (4 of 9): the object covers 85–100 % of the frame for 4–8 frames @25 fps (0.18–0.32 s), frame brightness
     drops to 1–30 or rises to 195–220; the cut is inside this window. In the incoming shot an object of similar tone
     continues moving in the same direction and reveals the new scene.
  2b. Moving matte (5 of 9): the object covers only 20–45 % of the width, the new scene appears behind its trailing
     edge, the old one remains ahead of its leading edge — both shots are visible at once for 0.25–0.9 s.
  3. Exit: the object leaves past the edge, the new scene is fully revealed. The whole move takes 0.25–1.3 s (6–32 frames @25 fps), typically 0.4–0.9 s.
variants:
  - passer-by at the lens: a person walks a meter from the camera, dark clothes or a back, full occlusion
  - columns during a lateral tracking shot: the camera moves sideways, columns 30–35 % of the frame wide pass in 0.3 s, a new scene behind each one
  - palms over the lens: the subject covers the camera with their hands, the new scene opens between the palms
  - static shot and the passage of time: several passes through the same frame, after each one a detail of the scene changes
  - continuation of the object: a dark jacket in the outgoing shot → a similar jacket in the incoming one, moving in the same direction
  - silhouette as the edge: a person walks across the frame (≈1 width per second), the new scene is right behind their back
  - toss at the lens: fabric, banknotes, splashes of water or a napkin fly straight into the camera and cover it for 4–6 frames @25 fps (brightness 16–26 for dark fabric or 120–190 for water and white fabric); the incoming shot often starts with the same "material" (water, a cloud) and clears up over 0.3–0.6 s
  - a graphic soft wipe with no object (a straight feathered edge) — the fallback code variant
status: hybrid
fallback: if the source footage has no pass by the camera — code simulates it with a dark or light blurred blob that crosses the frame with full occlusion for 4–6 frames; a moving matte requires an object mask (mediapipe or remove_background); a shot with a passer-by right up against the camera can be generated
params:
  dur: 0.25–1.3 s (6–32 frames @25 fps), typically 0.5 s (12 frames)
  cover_peak: full occlusion of 85–100 % for 4–8 frames (0.18–0.32 s); the cut in the middle of the window
  edge_speed: 4–10 % of the width per frame @25 fps (1–2.5 widths per second), a fast pass up to 27 %
  direction: right to left (6 of 9) or left to right; the object has the same direction before and after the cut
  occluder: with a matte — 20–45 % of the frame width; dark tone (brightness 1–30) or light (195–220); out of focus (texture <0.2 of the background)
  feather: the edge is blurred over 3–10 % of the frame width
  match: in the incoming shot an object of the same tone in the same place continues the motion; the camera moves in the same direction at the same speed
when: a change of location or time without losing continuity — music video, fashion, travel, UGC; "a passer-by carries the subject to a new place"; on a static shot — the passage of time; put the full occlusion on the downbeat; a series of column wipes — as a rhythmic device for 2–4 changes in a row
avoid: a sharp (in-focus) object — it reads as part of the scene rather than a wipe; different directions of motion before and after; a dark occlusion before a very bright incoming shot with no intermediate brightness; a digital blob on a static frame with no camera motion of its own — it looks pasted on
sfx: a fabric rustle or an airy whoosh peaking at the moment of full occlusion; with a series of columns — short rhythmic swishes on each column; with a person passing — footsteps
genres: {fashion: signature, ugc: signature, travel: allowed, viral: allowed, fanedit: allowed, clips: allowed, drama: allowed, calm: allowed, product: allowed, explainer: allowed, teaser: allowed, motivation: allowed, epic: allowed, sport: allowed, phonk: allowed}
detect: |
  Custom check by strips: in part of the frame the texture drops below 0.2 of the same zone in clean frames and brightness goes to
  1–30 or 195–220; this zone widens and shifts in one direction. Type 2a: coverage reaches 85–100 %,
  the histogram switches inside the window, ed_motion often flags black frames or a cut in the middle.
  Type 2b: coverage ≤45 %, the histogram changes smoothly over 0.25–0.9 s, two different backgrounds meet at the edge.
  Difference from trans.whip: there the whole frame is blurred, with no edge. From trans.iris: there the edge is a geometric shape with no
  physical object. From a fade to black: brightness drops evenly across the whole frame. From a dissolve: the images
  are mixed across the whole frame, with no edge.
engine: |
  Real pass: find_cover_frame(A, side='tail', min_cover=0.85) + find_cover_frame(B, side='head') → cut in the occlusion
  window; sfx('whoosh', at=cover_mid, align='peak').
  Moving matte: mask(method='mediapipe_person'|'hf_remove_background', target=occluder, feather=0.04) →
  matte_wipe(fg=A_mask, reveal='trailing', incoming=B) — B is placed behind the object's trailing edge.
  Simulation in code: occluder_pass(tone='dark', dir='rtl', dur=0.5, width=1.3, blur=0.1, ease='inOutQuad')
  + cut(at=middle of the occlusion); or transition(kind='wipe(linear)', dur=0.4, params={angle:0, dir:'rtl', feather:0.08}).
gen_hint: "<scene A>, a person in dark clothes walks right-to-left very close to the camera lens, completely out of focus, briefly filling the whole frame; next clip starts with the same kind of dark out-of-focus figure filling the frame and moving right-to-left, revealing <scene B>"
commands: ["passer-by wipe right to left between #3 and #4", "cover the frame with a dark blob and reveal the new location", "palms-over-the-lens transition at 0:08", "a series of column wipes to the beat in the chorus"]
related: [trans.iris, trans.whip, trans.hidden_cut, trans.set_change, mask.bg_replace]
evidence: {examples: 9, sources: 9, measured: "frame coverage by strips, from texture and brightness: full occlusion of 85–100 % in 4 of 9 for 0.18–0.32 s, moving matte of 20–45 % of the width in 5 of 9; the whole move 0.25–1.3 s; edge 4–10 % of the width per frame @25 fps (up to 27 %); right to left in 6 of 9; object tone dark 1–30 or light 195–220", confidence: high}
