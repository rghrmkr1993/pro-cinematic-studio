id: trans.chain
family: trans
group: transition
level: C
aliases: [endless pan, continuous pan through scenes, one-move transition chain, endless tracking shot, transition chain, seamless pan, one pass through all scenes, recursive screens]
what: one continuous camera move carries the viewer through 3 or more scenes in a row — new worlds are "docked" at the side (or nested inside a screen), the seams are hidden behind people, trees, posts and dark passes, and it feels like the move will never end
frames: |
  1. A steady lateral pan or tracking move: the frame content moves to one side at a constant speed of
     0.15–0.3 frame widths per second (≈0.6–1.2 % of the width per frame @25 fps), with no speeding up or stopping.
  2. Seam: the next scene stands "flush" against the current one and slides in from the edge in the direction of travel; the boundary between
     them is vertical, soft or hidden behind a vertical object (a person, a tree trunk, a post, a door jamb, a column);
     it crosses the frame in 1.3–1.7 s, i.e. 2–3 times faster than the pan itself (0.55–0.72 widths per second).
  3. Link: the new scene fills the whole frame for 1.5–2.5 s, then the next one slides in the same way; 3–6 links in total.
  4. Fast variant: a dark object near the lens (a back, a jacket) covers the frame every 0.6–0.8 s;
     a pass takes 0.4–0.5 s, full occlusion 1–2 frames; the rhythm comes out almost musical.
  5. Recursive screen: the camera keeps pulling out (×0.5 scale per second) — each time the frame turns out to be
     the picture on a TV in the next scene, link ≈1.75 s; or it pushes into a phone in the subject's hand (×6 per second
     slowing toward the end of the link), where the next scene with a subject and a phone is playing, link ≈1 s.
variants:
  - docked pan: the scenes are set side by side, the boundary is hidden by a person, a tree or a post (5 of 8)
  - pendulum: the pan reaches the second scene, holds for 0.4 s and returns the same way to the first one (loop)
  - fast passes through the dark backs of passers-by, link 0.6–0.8 s
  - TV in a TV: a constant pull-out through nested screens (6 links in 10 s)
  - phone in a phone: a push-in through phone screens in the hands of different subjects
status: hybrid
fallback: without source footage that has its own lateral motion — a digital pan across a "stitched canvas" of neighboring clips (scale ×1.15–1.3 for headroom); the boundary is hidden by a soft wipe or a mask of a vertical object (a person — mediapipe, everything else — remove_background); recursive screens — track the screen in each link or generate links of "a subject holding a phone with a chroma key screen"
params:
  pan_speed: 0.15–0.3 frame widths per second (0.6–1.2 % per frame @25 fps), constant, ease linear
  direction: one for the whole chain — in 6 of 6 lateral ones the picture moves left and the camera moves right; pendulum — there and back with a 0.4 s pause
  seam_sweep: 1.3–1.7 s for the boundary to cross the frame (0.55–0.72 widths per second), ease linear
  seam_edge: vertical; feather 4–8 % of the width or a mask of an object (a person, a tree trunk, a post)
  link: 1.5–2.5 s per link, 3–6 links; fast variant 0.6–0.8 s
  fast_pass: dark pass 0.4–0.5 s, full occlusion 1–2 frames (≥90 % of the area)
  recursive_out: pull-out ×0.5 per second (≈×0.973 per frame @25 fps), link ≈1.75 s, the screen takes 25–35 % of the width
  recursive_in: push-in ×5–6 per second, slowing toward the end of the link, link ≈1 s, center 0.48–0.52
  continuity: across the scenes — the same camera height and horizon, similar brightness; people move in the direction of the pan or stand still
when: intro and outro of a music video, a fashion lookbook, "so much in a single day", showing several subjects, looks or locations in a row; recursive screens — the theme of social media and life on screens; one chain per video, usually 6–12 s; put the seams on the beat, a link lasts 2 or 4 bars
avoid: scenes with different camera heights, horizons or perspective — the seam reads immediately; people and cars moving against the pan; the pan stopping at the seam; changes that are too frequent in a slow chain (less than 1.2 s per link); a calm video with the fast variant
sfx: one continuous ambience or track for the whole chain; on each seam a light whoosh or the rustle of the passing object, in sync with the beat; in the fast variant short "fly-by" sounds on each back
genres: {fashion: signature, fanedit: signature, travel: allowed, viral: allowed, teaser: allowed, product: allowed, ugc: allowed, clips: allowed, epic: allowed, motivation: allowed, calm: allowed, explainer: allowed}
detect: |
  ed_motion: a long series of SHIFT in one direction (0.15–0.3 widths per second) across several scene changes, often with no
  cuts found; custom check by vertical strips of the frame — whether each belongs to the "old" or the "new" scene by histogram:
  the boundary is vertical, crosses the frame in 1.3–1.7 s and repeats 2+ times. Fast variant — dark occlusions of
  ≥90 % of the frame every 0.6–0.8 s. Recursive — endless ZOOM-OUT or ZOOM-IN (×0.003 over 9.5 s, ×378 over 3.4 s),
  with a screen frame inside. Difference from trans.side_scroll: there the set walls move at the same speed as the
  pan, while here the scene boundary runs 2–3 times faster (a composite seam). From trans.wipe: a single seam. From zoom.infinite:
  there the push-in is the point, here the lateral motion is (or the screen as the frame of each link). From split-screen: the boundary does not stay in place.
engine: |
  pan_chain(clips=[A,B,C,...], dir='rtl', speed=0.2 (widths/s), per_link=2.0, seam='soft'|'mask(person)'|'mask(object)',
  seam_speed=0.65, feather=0.06, scale=1.2) — the clips are placed edge to edge on a wide canvas, a virtual camera moves
  at constant speed, the boundary between neighbors moves at seam_speed and, if there is a mask, follows the object's contour.
  Pendulum: pan_chain(..., pingpong=true, hold=0.4). Fast variant: a series of occluder_pass(tone='dark', dur=0.45) every 0.7 s.
  Recursive screens: chain_zoom(clips, per_link=1.75, rate=ln(0.5), seam='nest(quad=track(screen))') — pull-out;
  rate=ln(6), per_link=1.0 — push-in. + sfx('whoosh', at=each seam, align='peak'), seams on the beats.
gen_hint: "one continuous lateral tracking shot moving right at constant slow speed past <scene A>, then a person walks close to the lens and behind them <scene B> continues the same camera height and horizon, then a tree trunk passes and <scene C> appears, seamless single take, consistent lighting"
commands: ["one continuous pan through all the looks #1–#5", "chain: each new outfit slides in from the right behind a passer-by", "make a loop — pan into the second scene and come back", "TV in a TV through all the intro scenes"]
related: [trans.side_scroll, trans.wipe, trans.hidden_cut, zoom.infinite, trans.screen, truck.lateral]
evidence: {examples: 8, sources: 4, measured: "ed_motion: lateral shift of 0.15–0.31 widths per second in one direction; the scene boundary, tracked by histogram strips, crosses the frame in 1.33–1.68 s (0.55–0.72 widths per second), link 1.7–2.9 s; pendulum — 1.68 s there, 0.4 s pause, 1.54 s back; fast passes of 0.42–0.5 s every 0.63–0.77 s; pull-out through TVs ×0.003 over 9.45 s (×0.954 per frame at 14.3 fps), push-in through phones ×378 over 3.36 s, center 0.48–0.52", confidence: medium}
