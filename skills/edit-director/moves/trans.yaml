id: trans.lens_distort
family: trans
group: transition
level: B
aliases: [lens distortion transition, lens warp transition, bulge transition, pinch transition, twirl transition, swirl transition, spherize transition, lens transition, bulge, bubble transition, pinch to a point, vortex, barrel punch]
what: a transition through optical distortion — over 5–9 frames the image bulges like a lens, gets pinched into a point or twists into a vortex around a single center, is blurred at the peak of the deformation and gives way to the next shot, which straightens out of the same deformation
frames: |
  1. Setup: the last 0.2–0.4 s of shot A; the center of the deformation is the frame center or an object (a face, an item, a vanishing point).
  2. Build-up (5–9 frames @25 fps, 6–11 @30 fps, ease inCubic): a non-rigid distortion grows around the center — bulge
     (the center magnified up to ×1.8–3, the frame border stays put, straight lines bow into arcs), pinch (the center squeezed to
     ×0.5–0.65, everything gets "sucked" inward), vortex (the center rotated by 180–540°, the angle falls off toward the edges, the edges do not
     rotate) or barrel punch (the whole frame inflated as if by an ultra-wide lens, the edges squeezed). Displacements at the peak — 10–20 % of the short
     side of the frame; radial or rotational motion blur grows toward the peak, sharpness drops to ×0.15–0.5.
  3. Seam at the peak of the deformation and on the beat: a cut inside the motion blur, with no filler.
  4. Straightening (6–10 frames @25 fps, 7–12 @30 fps, ease outCubic): B starts with the same deformation (mirrored) or with
     the opposite one (the through variant — the motion continues) and settles flat within 0.25–0.4 s; the vortex keeps twisting in the same
     direction as it settles.
variants:
  - "bulge: the center inflates ×1.8–3 toward the seam, B comes out of the same bubble — a 'bass hit'"
  - "pinch: A gets sucked into the center (×0.5–0.65), B 'turns itself inside out' from the point — a teleport, a fall"
  - "vortex (twirl): a 180–540° twist in the center fading toward the edges, B keeps twisting in the same direction and settles"
  - "barrel punch (barrel): within 5–7 frames the whole frame goes into an ultra-wide barrel (k1 up to +0.9) with a push-in, B opens back out"
  - "pincushion: an inverse barrel — the corners stretch outward, the center sinks in; an unsettling variant"
  - "through: A bulges, B starts pinched and opens up — the 'forward' motion does not stop (borderline with trans.zoom)"
  - "local bubble: a bulge only on the object (radius 35–60 % of the half-diagonal), the seam inside the bubble — a product, a face, a ball"
  - "soft: 0.8–1.6 s, half the strength (×1.4–1.8, 90–180°) — a dream, a trip"
status: code
fallback: if A and B have no common center of interest — take the frame center and shift B so its object lands on the same point (± 5 % of the frame); if B has a close-up face — B comes out not from the deformation but with a short pull-out ×1.15 → 1 over 5 frames; if the source is smaller than 1080 on the short side — bulge no more than ×2, or use the pinch and vortex modes (they do not magnify the center)
params:
  mode: "bulge | pinch | twirl | barrel | pincushion; one or two modes per video"
  out: "5–9 frames @25 fps / 6–11 @30 fps, typically 6 / 7 — that is ≈ a 1/8 note at 120 BPM (0.25 s); ease inCubic; for bulge and pinch the strength is interpolated on the log of the scale M(t) = M_peak^ease(p)"
  in: "6–10 frames @25 fps / 7–12 @30 fps, typically 7 / 8; ease outCubic; soft variant — out 12–20 / 15–24 and in 12–25 / 15–30 frames"
  peak_hold: "0 frames (default); 1 frame — a heavy hit"
  bulge: "r_src = r·(1 − (1 − 1/M)·(1 − u²)²), u = r/R < 1, unchanged outside; M — the scale at the center, 1.8–3 (typically 2.4), locally 1.4–2; peak displacement with R = the half-diagonal — M 1.6 → 11 %, 2.0 → 15 %, 2.4 → 17 %, 3.0 → 20 % of the short side of the frame (118–210 px at 1080); the profile does not fold over for any M"
  pinch: "the same formula, M 0.5–0.65 (typically 0.55); at M < 0.45 the profile folds into a ring — for 'into a point' add an overall scale ×0.6–0.8 on a black or mirrored field"
  twirl: "φ_src = φ − θ·(1 − u)², θ at the center 180–540° (typically 300°), R 0.8–1.2 of the half-diagonal; A — from 0 to +θ, B — from −θ to 0, the direction of rotation does not change"
  barrel: "r_src = r·(1 + k1·ρ² + k2·ρ⁴), ρ = r / half-diagonal (like ffmpeg lenscorrection, k1 and k2 within ±1); k1 0 → +0.6…+0.9, k2 0…+0.1; a fill push-in ×(1 + 0.5–0.6·k1) with mirrored corners on the 2–3 peak frames (the motion blur hides them) or a full ×(1 + k1 + k2); pincushion — k1 0 → −0.3…−0.5 with no push-in"
  radius: "R as a fraction of the half-diagonal — whole frame 0.9–1.2 (at 1.0 the frame corners stay still), local bubble 0.35–0.6 on track(object)"
  center: "[0.5, 0.5] or track(face|object) at the seam; one center for A and B"
  blur: "motion blur along the deformation — an average of 4–6 sub-frames between the strength of the previous and the current frame; for the vortex sub-frames = Δθ at the center / 12°, within 4–16; sharpness at the seam ×0.15–0.5"
  chroma: "on the 2–3 peak frames the R and B channels are distorted with strength ×(1 ± 0.03–0.05) — a color fringe of 0.5–1.5 % of the short side near the edges; vignette 0.2–0.35"
  letterbox: "if the frame has letterbox bars or burned-in titles — distort only the active picture (crop the bars, distort, put the bars back), otherwise the bars bend into the frame"
  cost: "one pass @1080×1920 — ≈ 70–85 ms when computing the grid from scratch, ≈ 35–40 ms with a precomputed radial profile (cv2.remap itself ≈ 8 ms); a motion blur of 5 sub-frames — only on the 4–6 frames near the seam"
when: |
  Entry into the drop or chorus (seam on the first beat), a change of track section, a bass or 808 hit; a "teleport" between places and
  looks; a trip, a dream, intoxication (soft variant); a product or object "pops out" as a local bubble. By part:
  hook — possible as a single transition on the first downbeat; build — not needed (that is the place for the riser and the speed-up); drop — the main
  place, build-up from a 1/8 note to a beat, seam on the beat; outro — rarely. In UGC and motivation — once, at a block change
  (problem → solution), not on a face during speech. Limits: no more than once every 8 bars (≈ 16 s at 120 BPM), no
  more than 2–3 per 30–60 s video; never the same mode twice in a row; not on cuts adjacent to trans.spin and trans.zoom.
avoid: a close-up face during a line and recognizable features (a bulge disfigures, unless it is deliberate comedy); text, captions, logos, prices — they bend and become unreadable; products where proportions and the label matter (luxury, beauty, tech in close-up); flat frames without lines or texture — the distortion is not visible; a low-resolution source with a bulge of ×2.5 or more — a mushy center; a serious cinematic tone (epic, drama); speech genres; different rotation directions on one seam
sfx: a pitch-bending whoosh on the build-up, peaking at the seam; bulge — a low "whoomp" (a sine 200 → 60 Hz over 150–250 ms) or sfx.sub_drop on the seam; pinch — a reverse whoosh that pulls toward the seam; vortex — a whoosh with rotating stereo panning (2–4 turns per second); landing — sfx.impact on the beat, if the track itself does not hit
genres: {fanedit: signature, viral: allowed, phonk: allowed, sport: allowed, travel: allowed, fashion: allowed, teaser: allowed, product: allowed, ugc: allowed, motivation: allowed, epic: forbidden, drama: forbidden, calm: forbidden, clips: forbidden, explainer: forbidden}
detect: |
  ed_motion (verified on synthetic renders): one cut with a pair of ZOOM events around it, centered at 0.45–0.55 —
  ease-in before the seam, ease-out after. Bulge and barrel with a push-in: ZOOM-IN ×1.3–1.45 (peak ×1.1–1.15/frame) → ZOOM-OUT
  ×0.8–0.95; pinch: ZOOM-OUT ×0.5 (peak ×0.7/frame) → ZOOM-IN ×1.7 (peak ×1.3/frame); the through variant — both
  ZOOM-IN, as in trans.zoom. nonrigid 0.13–1.5, for bulge and vortex conf low on 1–3 pairs near the seam; min sharpness
  ×0.13–0.5. Vortex: ROTATE 25–35° over 4–5 frames after the seam with nonrigid up to 1.1, before the seam the rotation barely registers
  (the edges stay put), on the seam frames a cascade of 2–5 false "cuts". A local bubble (R ≤ 0.6) produces no events at all.
  Custom check — dense optical flow (DIS) between neighboring build-up frames, decomposed around the center:
  radial velocity per unit radius v_r/r in the inner ring (0.08–0.3 of the half-diagonal) relative to the outer one
  (0.55–0.85): bulge ≥ 3 (≈ 0 outside for a local one), pinch ≥ 1.4, barrel ≤ 0.35 (grows toward the edge); for a
  digital zoom 0.9–1.1. Vortex: angular velocity v_θ/r inside relative to outside ≥ 3, for a rigid rotation 0.9–1.1.
  Visually: straight lines bend into arcs around one point, the frame border stays put, mirrored edges at the peak.
  Difference from trans.liquid (the "melt" variant): there the displacement field is noisy, with no center or symmetry, 1–2 % of the width per
  frame, A and B are mixed under ripples for 0.9–1.4 s and B shows through in patches; here it is one smooth axisymmetric field around
  one center, displacements of 10–20 % of the frame, A and B do not mix — a single seam at the peak within 0.4–0.7 s.
  From trans.zoom: there v_r/r is the same across the whole frame (similarity); the ZOOM-IN → ZOOM-OUT pair matches its "rebound" —
  tell them apart only by the flow profile and the bent straight lines. From trans.spin: the rotation is rigid, ROTATE 24–36°/frame on both
  sides. From lens.fisheye: a constant barrel for the whole shot, with no ramp or seam. From look.psychedelic: periodic "breathing" of
  0.3–1.5 % of the width, with no cut. From lens.magnifier: a hard-edged circle stands in the frame. From
  dolly.crash: real parallax, not a distortion around a point.
engine: |
  transition(kind='lens', dur=0.52, params={mode:'bulge'|'pinch'|'twirl'|'barrel'|'pincushion',
             center:[0.5, 0.5]|track(face|object), radius:1.0, out:{frames:6, ease:'inCubic'},
             in:{frames:7, ease:'outCubic', from:'mirror'|'through'},
             peak:{M:2.4}|{M:0.55}|{theta:300, dir:'cw'}|{k1:0.9, k2:0.05, fill:'auto'},
             blur:{samples:5}, chroma:0.04, vignette:0.25, edge:'mirror', active_area:'auto'}) — a new transition kind
  lens_warp(frame, mode, strength, center, radius, profile='poly2') — a new primitive: cv2.remap using the formulas from
    params (compute the grid once per frame size); per-frame strength — M(t) = M_peak^ease(p), θ(t) and k1(t) linear
    in ease; motion blur = the mean of lens_warp sub-frames between neighboring strengths.
  barrel and pincushion = lens_distort(k1, k2, fill_zoom) with time keyframes (ffmpeg lenscorrection) +
    transform(scale=fill) — can be rendered without numpy.
  + chroma_ab(amount=0.01, radial=True) and vignette(amount=0.25) on the 2–3 peak frames
  + sfx('whoosh', at=seam − out, align='attack') + sfx('sub_drop'|'impact', at=seam); seam — beat_sync(grid='1/4').
gen_hint: "transition between <scene A> and <scene B>: the image of <scene A> bulges outward from the center like a giant fisheye bubble with radial motion blur, then <scene B> appears from the same bulge and relaxes back to a normal flat frame; alternatively the frame twists into a swirl vortex and untwists into <scene B>"
commands: ["lens bulge transition between #2 and #3 on the drop", "suck the frame into a point and turn it inside out into the next shot", "clockwise vortex into the next scene at 0:15", "barrel punch on the bass at the start of the chorus", "local bubble on the product with the cut inside it"]
related: [trans.liquid, trans.zoom, trans.spin, lens.fisheye, lens.magnifier, look.psychedelic, fx.refraction, dolly.crash, zoom.crash, trans.portal, shake.beat, sfx.whoosh]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters based on editing practice; verify with a demo render", confidence: medium}
