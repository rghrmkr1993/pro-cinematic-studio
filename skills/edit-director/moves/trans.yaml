id: trans.arc
family: trans
group: transition
level: C
aliases: [orbit transition, arc shot cut, orbit with a cut, orbit the subject and land somewhere else]
what: "a swap of place, partner or look hidden inside an orbit: when the arcing camera's blur, the subject's body or hair fills the frame, everything behind the subject is replaced"
frames: |
  1. Orbit: the camera travels along an arc around the subject (or a couple) — the background runs sideways at 0.25–0.35 frame widths per second
     (slow orbit) or breaks into a fast swing of 1.5–2 widths per second; in 4 of 8 examples the arc carries a 20–40° roll.
  2. Occlusion: for 5–13 frames @25 fps (0.2–0.5 s) the frame loses detail — it is covered by the subject's hair or back,
     a dark foreground object or the orbit's own motion blur; detail ≤0.3 of normal, brightness often drops to 16–35.
  3. Seam inside the occlusion: a cut or a short 4–6 frame dissolve; the histogram changes over 0.25–0.5 s,
     ed_motion usually does not see the cut.
  4. Exit: the orbit continues in the same direction with the same roll, then slows down over 0.3–0.6 s; the subject (usually the same
     person) is back in the center of the frame ±0.1, with a new scene around them.
  Vertical arc: the camera tumbles over the subject from above (sky and ground flip over, ≈2.7 frame heights in 0.55 s),
  the cut lands on the ground's motion blur, the exit lands on the subject in the new scene.
variants:
  - couple orbit: the hair or the back of the head of the nearer subject covers the frame, and behind it the partner and background change
  - fast swing with roll: the frame goes into motion blur and darkness, the exit keeps the same roll into a new location
  - through the foreground: during the orbit a car, a shoulder or a box passes the camera, and behind it is another world
  - vertical tumble: the camera flips over the subject (sky → ground → subject in a new scene)
  - rising orbit: the arc goes up into a top-down view, at the apex 1–2 frames of darkness and a new scene, sometimes with a return (loop)
status: footage
fallback: code — simulate the orbit on static or lateral shots — transform with a shift of 0.3 widths per second + 15–30° roll + directional motion blur for 6–10 frames around the cut, plus a mask of the subject (hybrid, mediapipe) laid over the seam so the subject stays continuous; the best result comes from finding orbits around the same subject in different scenes in the source footage; otherwise generate a pair of orbits with the same direction and speed
params:
  arc_speed: slow orbit 0.25–0.35 frame widths per second (1–1.4 % per frame @25 fps); fast swing 1.5–2 widths per second
  roll: 0 or 20–40° of roll along the arc; the sign of the roll is kept across the seam
  cover: 5–13 frames @25 fps (0.2–0.5 s) of occlusion — detail ≤0.3, brightness 16–35 or solid motion blur (sharpness ×0.03–0.1)
  seam: a cut on the darkest or most blurred frame, or a 4–6 frame dissolve inside the occlusion
  settle: 0.3–0.6 s of orbit deceleration in the new scene, ease outCubic
  anchor: subject in the center of the frame ±0.1 before and after; the same person or a similar silhouette; the subject's height in frame matches ±15 %
  direction: one orbit direction (clockwise or counterclockwise) and one camera height on both sides of the seam
  vertical_flip: ≈2.7 frame heights in 0.55 s, cut on the motion blur
when: a change of place or partner "around" one subject — music video, fashion, love story, sport ("same runner, different track"); a transition from a crowd to a solo; the entry into the chorus; no more than 1–2 times per video, each with a different kind of occlusion
avoid: orbiting in opposite directions on the two sides of the seam; different camera heights and subject scales; occlusion shorter than 4 frames (the jump shows); static shots with no motion of their own — a digital arc without parallax gives the fake away; on-screen text during the orbit
sfx: a soft whoosh over the whole orbit, peaking at the moment of occlusion; fast swing — a short swish and a hit on the exit; the new scene's sound comes in with a 0.2 s overlap
genres: {fashion: signature, fanedit: signature, viral: allowed, drama: allowed, sport: allowed, travel: allowed, teaser: allowed, motivation: allowed, epic: allowed, product: allowed, ugc: allowed}
detect: |
  ed_motion: a long horizontal SHIFT with high nonrigid (0.3–1.0 — orbit parallax: background and subject move
  differently), often ROTATE 10–40°; at the seam 5–13 frames with detail ≤0.3 and/or brightness ≤35 — with no clear cut or
  with 2–3 "cuts" on blurred frames; the background histogram changes while the subject's silhouette stays in the center.
  Difference from trans.whip: a whip transition's shift has almost no parallax and no anchor subject. From trans.spin: there the rotation is
  around the lens axis (ROTATE 90–360°), here the roll is secondary. From trans.wipe: there an object passes a static or
  laterally moving camera, rather than the camera orbiting the subject. From orbit.turntable: there the subject rotates, the camera stays and the scene does not change.
engine: |
  Real orbits: find_motion_peak(A, side='tail', kind='arc'|'shift', nonrigid>0.3) + find_cover_frame(A ∪ B, min_cover=0.7)
  → cut or transition(kind='dissolve', dur=0.2) inside the occlusion; match(on='motion') — one direction and speed ±20 %.
  Simulation: transform(shift=[[0,0],[-0.3,0]], rotate=[0, 20], t=[seam-0.4, seam], ease='inCubic') + blur(kind='directional')
  on A; mirrored on B (shift [[0.3,0],[0,0]], rotate [-20, 0], ease='outCubic'); mask(method='mediapipe_person') of the subject
  over the seam so the anchor does not jump. + sfx('whoosh', at=seam, align='peak').
gen_hint: "two clips for an arc transition — clip A: the camera orbits clockwise around <subject> at chest height, close behind their hair/shoulder, the hair briefly fills the frame; clip B: the same subject, same height and framing, the camera continues orbiting clockwise from behind their hair and reveals <new place or partner>, then slows down"
commands: ["orbit the subject and move them to another location between #3 and #4", "orbit transition through the hair at 0:22", "camera tumble over the runner into the next scene", "rolling swing from the meeting room to the kitchen"]
related: [arc.orbit, orbit.turntable, trans.spin, trans.whip, trans.hidden_cut, trans.wipe]
evidence: {examples: 8, sources: 5, measured: "ed_motion: slow orbit — background shift 0.25–0.32 widths per second at nonrigid 0.3–0.6, fast swing — 0.42 widths in 0.2 s with a 40° roll in 0.2 s; seam profile — detail ≤0.3 for 0.2–0.5 s (hair 0.5 s, blur and darkness 0.32 s, foreground 0.3 s, car and blur 0.25 s), brightness down to 16–35; 20–40° roll in 4 of 8; vertical tumble ≈2.7 heights in 0.55 s", confidence: medium}
