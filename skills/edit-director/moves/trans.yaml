id: trans.hidden_cut
family: trans
group: transition
level: C
aliases: [invisible cut, hidden cut, one-take illusion, seamless transition, as if in one take]
what: a cut the viewer does not notice — the camera moves into a "neutral" frame (darkness, fog, a cloud, a texture up close, an object filling the frame) or into a matching shape and comes out of it already in another scene, without stopping its motion
frames: |
  1. Approach: the camera continues its move (push-in, orbit, rise, tracking) and brings the frame to a "filler" —
     goes behind a dark body, descends into darkness, runs into skin or foam, rises into the clouds, catches smoke.
     Frame detail drops to ≤0.25 of normal over 0.5–1 s (when pushing into a texture — from ×6 to ×0.5).
  2. Filler: for 4–20 frames @25 fps (0.15–0.8 s) the frame belongs to neither scene: darkness (brightness 8–24 of 255),
     even fog or cloud (brightness 110–136, spread ≤25), a texture up close or an object filling the frame. The cut sits
     in the middle of the filler; in clouds, foam and fog — a 0.4–0.9 s dissolve right inside it.
  3. Exit: the next shot starts from the same kind of filler (darkness → darkness, fog → fog, texture → similar texture)
     and continues moving in the same direction; after 0.3–0.6 s the frame is fully revealed.
  4. Shape match (no filler): a round object in one scene dissolves into a round object in the other at the same
     point — the center matches within 0.02 of the frame, the size within 10 %; a two-step dissolve: first the background (≈0.5 s), then the object itself (≈0.5 s).
variants:
  - through darkness: an orbit behind the subject's back or a descent into a dark passage, darkness 0.25–0.8 s, sometimes several cuts in one "take"
  - through texture: a push-in on skin, foam or fabric until it fills the frame, exit from a similar texture in the new scene (coffee foam → sea foam)
  - through fog, smoke, clouds: the frame turns flat gray or white, the new scene emerges from the haze in 0.4–0.6 s
  - object filling the frame: a flag, a back, a jacket at the lens — details in trans.wipe
  - shape match with a dissolve: circle → circle, a match flame → the sun (horizontally within 0.02 of the frame)
  - window and reflection: the scene continues in a window or in the lens of a pair of glasses and the camera flies in or pulls out — details in trans.portal
status: footage
fallback: the engine itself looks for fillers in the tails and heads of clips (dark, even or textureless frames during continuous camera motion) and puts the cut inside; if there are none — code simulates a "pass-through" — a digital push-in ×1.5–3 into a dark or even area at the end of the shot, 3–5 frames of the filler color and a pull-out from a similar area of the next shot; shape match — align the second shot to the detected circle or contour and do a two-step dissolve; with no material — generate a pair of shots that go into darkness or fog
params:
  filler: 4–20 frames @25 fps (0.15–0.8 s), typically 6–10 (0.25–0.4 s)
  filler_dark: brightness 8–24, spread ≤20, detail ≤0.25 of normal
  filler_haze: brightness 110–136, spread ≤25 (fog, clouds, smoke)
  filler_texture: the texture fills the frame; detail drops from ×6 to ×0.5 over ≈1 s of push-in
  cut: on the darkest or most even frame of the filler
  dissolve: 0 (hard cut in darkness) | 0.4–0.9 s inside fog, cloud or texture | two steps of 0.5 s for a shape match
  motion: the direction of camera motion is the same before and after, the motion does not stop at the seam
  shape_match: center of the matching object ±0.02 of the frame, size ±10 %
  reveal: 0.3–0.6 s from the filler to a fully revealed frame
when: the illusion of "one take" in promos, sport, travel, music videos; tying locations, times of day or subjects together with one move; an opener built from a chain of hidden cuts; calm genres — through fog, clouds, foam; 1–3 times per minute, unless it is the concept of the whole video
avoid: a filler shorter than 3 frames (the jump shows); camera motion that changes direction or stops at the seam; a strong jump in brightness or color between the filler and the exit (blue darkness → warm darkness is fine, but fog 115 → darkness 15 is not); frequent repetition of the same method in a row; a shape match offset by more than 5 % — reads as a mistake
sfx: under the filler — air, a hum or wind; start the new scene's sound under the filler 0.2–0.5 s before the reveal (a sound overlap); in darkness — a low hum, in clouds — rising wind
genres: {travel: signature, epic: allowed, calm: allowed, product: allowed, sport: allowed, fashion: allowed, teaser: allowed, motivation: allowed, viral: allowed, ugc: allowed, drama: allowed, fanedit: allowed, explainer: allowed}
detect: |
  A run of 4–20 frames where detail is ≤0.25 of the clip median and brightness ≤24 (or an even 110–140 with a spread ≤25), in the middle
  of continuous camera motion (ed_motion: events in one direction before and after the run); the histogram switches
  from the outgoing scene to the incoming one inside the run. ed_motion may not find a cut at all (dissolve) or may place it
  on one of the dark frames. Shape match: a circle or contour at the same point before and after the dissolve (Hough).
  Difference from a fade to black: in a fade the camera does not move through anything, the frame dims entirely and evenly.
  From trans.wipe: there the edge of an object travels across the frame. From trans.whip: the filler is the motion blur of a jerk, not the object itself.
engine: |
  seam_search(A_tail=1.5, B_head=1.5, kinds=['dark','haze','texture','occluder','shape'], max_window=0.8) →
  the best frame pair (A_out, B_in): minimal difference in brightness, histogram and detail + matching direction of motion;
  then cut(at=A_out) or transition(kind='dissolve', dur=0.4–0.9) inside the filler.
  Simulation: push_through(A, region=darkest|uniform, scale=[1, 2.5], dur=0.4, ease='inCubic') + fade(to=filler_color, dur=0.12)
  + push_through(B, scale=[2.5, 1], dur=0.4, ease='outCubic'); shape: match(on='shape') → transform(B) by the center and size
  of the circle + a two-step dissolve (mask(object) last). sfx('swell', at=middle of the filler).
gen_hint: "two clips for a seamless transition — clip A: <scene A>, the camera keeps moving forward and pushes into <dark doorway | thick fog | the subject's dark jacket> until the frame is completely filled; clip B: starts completely filled by the same <darkness | fog>, the camera keeps moving forward and emerges into <scene B>"
