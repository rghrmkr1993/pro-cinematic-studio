id: trans.double_exposure
family: trans
group: transition
level: B
aliases: [double exposure, frame overlay, superimpose, multi-exposure, semi-transparent overlay, superimposition, multiple exposure, overlay]
what: two (less often three) full frames are superimposed semi-transparently and live together for 1–5 s — a face and a landscape, a person and a second angle of them, a dream over reality; a dissolve whose middle is stretched into an image of its own
frames: |
  1. Entry: the second layer fades in over the first in 0.3–1 s (8–25 frames @25 fps) — or a regular
     dissolve "freezes" at its midpoint.
  2. Hold 1–5 s (25–125 frames): both layers are visible at once, each at ≈35–65 %; the bright parts of one
     fall into the dark parts of the other — a face on a dark background plus foliage, a city, a staircase or a second angle.
     Levels: black point 1–19 of 255 (raised to 8–19 with a soft blend), contrast (σ of brightness)
     22–53 — lower than in a regular frame of the same subject matter.
  3. Motion: one layer is static or nearly so (a portrait, a person lying down), the other lives its own life —
     walks, turns, drifts 0.5–2 % of the frame per second; the camera sometimes slowly pushes in on both.
  4. Exit: the top layer fades out over 0.5–1.2 s, leaving a clean frame — or before it leaves a
     third layer fades in (a chain of overlays).
variants:
  - portrait + space — a close-up face with a landscape, foliage, a room or a city showing through the shadows
  - two angles of one person — front and profile, lying and walking — a split self, an inner voice
  - motion ghost — the same person in two phases, the second layer blurred and semi-transparent (echo)
  - chain of overlays — 2–3 layers at once, a new one enters before the old one leaves (a concert, memories)
  - psychedelic — the color of the layers changes every 1–3 frames, with flashes and color shifts
  - monochrome or duotone — the layers do not clash in color (half of the examples)
status: code
fallback: a pair of "dark close-up + bright texture" is needed — look for it in the source footage (portraits on a dark background, sky, foliage, lights); if there is no texture — generation with the user's consent; bring frames of different colors to black and white or duotone
params:
  layers: 2, at most 3
  opacity: top layer 35–65 % (typically 50 %) with a normal blend; 80–100 % with screen/lighten
  blend: screen or lighten (bright into dark) — the main one; normal 50/50 — soft; multiply — dark, graphic
  hold: 1–5 s (25–125 frames), typically 3 s
  fade: in 0.3–1 s, out 0.5–1.2 s, linear
  drift: one layer is still, the other drifts or rotates 0.5–2 % of the frame per second or has its own action
  grade: monochrome or duotone; black point 8–19 with normal 50/50; contrast σ 22–53
  composition: the main face in one half of the frame, the texture in the other; do not cover the eyes with details of the other layer
  chain: the next layer enters 0.5–1 s before the previous one leaves
when: a memory, a dream, a thought or the subject's inner state; the bond between a person and a place; intro, outro, a lyrical part or the bridge of the track; a mood music video; 1–2 such segments per video, no more
avoid: two layers of equal brightness and detail — mush; faces in both layers in the same place (eyes over eyes) without intent; fast cutting and hits on the beat; bright saturated layers of different colors without a common tone; videos where text or a product has to read clearly
sfx: ambience or a reverb-drenched pad; the second layer's sound (street, nature, crowd) kept quiet, −12…−18 dB under the main one; a soft swell as the layer enters
genres: {drama: signature, fanedit: signature, calm: allowed, travel: allowed, fashion: allowed, motivation: allowed, teaser: allowed, epic: allowed, viral: forbidden, phonk: forbidden, sport: forbidden}
detect: |
  ed_motion: no cuts for 1–5 s, little global motion, but the frames "cannot be explained by a single image":
  two independent sets of contours (a double horizon, semi-transparent silhouettes), high nonrigid,
  stable luma. Custom check: fitting a mix of the neighboring clean frames gives a share of 0.3–0.7
  that holds for more than 1 s (in a dissolve it goes 0→1 monotonically and fast);
  the black point is raised or the contrast is lowered relative to the clean frames.
  Difference from trans.dissolve: there the overlay is only the middle of a 0.5–2.5 s transition.
  Difference from mask.double_exposure: there the second frame sits inside a silhouette on a bright background.
  Difference from time.echo_trail: there it is fading copies of one motion, not two different frames.
engine: |
  composite(layers=[A, B], blend='screen'|'lighten'|'normal', opacity=[1, 0.5], t=[t0, t0+3])
  + fade(layer=B, in=0.6, out=0.8) + transform(layer=B, shift=[[0,0],[0.03,0]], rotate=[0, 3], t=[t0, t0+3], ease='linear')
  + color(params={desaturate: 1.0} | lut='duotone') on both layers
  Chain: overlap_chain(clips[], hold=2.5, overlap=0.8, blend='screen') — a new primitive.
  Psychedelic: + color(hue_shift every 2 frames) + flash(dur=0.04) on the beats.
gen_hint: double exposure, close-up portrait of <subject> on a dark background superimposed with <landscape | city lights | foliage>, both layers semi-transparent, the texture visible through the dark areas of the face, dreamy film double exposure, monochrome
commands: ["double exposure: the subject's face and the night city for 3 seconds", "overlay #2 on #5 semi-transparently in the bridge", "split self: front and profile at the same time", "a chain of overlays in the lyrical part"]
related: [trans.dissolve, mask.double_exposure, time.echo_trail, look.dreamcore, trans.morph]
evidence: {examples: 10, sources: 10, measured: "overlays hold for 1–5.3 s; the second layer fades in or out over 1–1.2 s (share 0→0.93 in 1.0 s, 0→0.98 in 1.2 s); a chain has 2–3 layers, the new layer's share of 0.25–0.5 holds for ≈2.5 s; black point 1–19, contrast σ 22–53; monochrome or duotone in 5 of 10; the psychedelic variant changes color every 1–3 frames", confidence: medium}
