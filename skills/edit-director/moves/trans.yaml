id: trans.metamorphosis
family: trans
group: transition
level: C
aliases: [transformation, transfiguration, werewolf effect, metamorphosis, shapeshift, shape-shifting]
what: a subject or object turns into something else right in the frame — the new form spreads across the body, emerges under a change of light, flashes in with a strobe or swells up, while the background and the shot stay the same
frames: |
  1. Setup: the subject in their normal look, close-up or medium shot, 0.5–2 s; the camera is static
     or pushes in very slowly (×1.2 over 1.2–1.5 s), emphasizing the moment.
  2. Transformation, inside a single shot — one of these techniques:
     - spread: a new texture (scales, decay, glass) flows out from the edge of the face or hand —
       10→90 % in 0.9–1.5 s, faster at the start (half the area already by 0.4 s);
     - one face flowing into another face against a still background — 10→90 % in ≈1.4 s;
     - light change: warm light gives way to cold and "reveals" a different appearance, the face brightness doubles
       (20 → 44) in 1.1 s;
     - swelling of a body part (arm, muscles, finger) — 0.3–0.5 s;
     - strobe: two forms alternate every frame (hand ↔ skeleton) for 0.6 s, with a flash;
     - burst into particles: the appearance scatters into flakes or energy and reassembles in 1.5–2.5 s.
  3. Landing: the new form holds for 1 s or more — often with an edit point to an extreme close-up of the eyes
     or a reaction; sometimes the transformation immediately reverses (a loop).
variants:
  - texture spreading across the skin (scales, feathers, decay, crystal)
  - one person's face flows into another's in the same frame and back
  - reveal by light: a beam or a lighting change uncovers the "true" appearance
  - swelling: muscles, arms, body parts grow before your eyes
  - strobe alternation of two forms, 1 frame each, with flashes
  - disintegration into particles, splashes or energy and reassembly into a new form
  - substitution by cuts: other people in the same pose every 0.25–0.5 s with flashes
status: generation
fallback: if the user has a "before/after" pair from the same camera position (makeup, costume, two takes from a tripod) — a hybrid in code (subject mask + spread, light or strobe); no pair — generate the new look from a frame of the subject (same angle and pose) or a video of the transformation, with the user's consent
params:
  dur: swelling 0.3–0.5 s (8–12 frames); spread and face flow 0.9–1.5 s (22–38 frames), typically 1.1 s; light 1.1 s; disintegration 1.5–2.5 s
  spread: starts at an edge (temple, hand, hairline), a front with a noisy edge; ease outCubic — 50 % of the area by 35–40 % of the duration
  light: warm → cold, face brightness ×1.5–2, in sync with the form; the change travels as a band or as an overall build
  strobe: 1 frame per form, 8–12 frames in a row (0.5–0.7 s), a 1-frame flash in the middle
  push_in: ×1.1–1.2 over 1.2–1.5 s, linear — across the whole transformation
  area: 10–70 % of the frame changes (only the subject or part of them), the background is stable
  hold_after: 1 s or more on the new form; loop — a reverse pass of the same length
when: the climax or a plot twist; the drop (swelling or strobe on the downbeat); "before/after", a transformation in the finale; a horror moment; teaser — to show the subject's "second nature"; no more than 1–2 times per video
avoid: a face in motion or in profile when the new look does not match the pose — the transformation "slides around"; no consent from the person to alter their appearance; a new look in different lighting without a light change — the cut shows immediately; a transformation longer than 2.5 s with no development — it drags
sfx: under the spread — crunching, crackling, rustling; under the light — a rising hum or choir, a hit at the full change; swelling — a stretching sound with a low hit; strobe — rapid clicks or glitch; disintegration — a rising whoosh and a sub_drop on reassembly
