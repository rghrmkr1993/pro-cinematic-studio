id: trans.set_change
family: trans
group: transition
level: C
aliases: [set change, change of scenery, walls fall away, backdrop slides away, scene change, in-camera transition, practical transition, theatrical scene change]
what: a change of place without a cut — the subject stays put while the set around them physically goes away (sinks, rises, falls, slides apart, turns) and reveals a new environment
frames: |
  1. Setup: 0.5–2 s of the subject in the first set; the background (a wall, a backdrop, a screen, the walls of a container) takes up
     30–80 % of the frame, the subject is centered. The camera is static (7 of 14 examples) or slowly pulls out /
     pans along with the subject.
  2. Mechanics: the set moves like a heavy object with a straight edge and a shadow. Sinking and falling
     accelerate: the wall's edge goes down from 15 to 90 % of the frame height in 1.0 s, the speed grows
     from 1.2 to 7 % of the height per frame; a wall falling flat backward disappears in 0.9 s
     (its area goes 53 % → 2.5 % of the frame). Lifting up — ≈0.8 s, slowing down near the top edge.
     Panels sliding apart from the center — slow: the gap grows from 0.5 to 1.2 % of the width per frame and in 2.8 s
     opens half of the frame.
  3. Reveal: the new environment fills the freed part of the frame — fast variants in 0.2–0.3 s
     (5–7 frames @25 fps), "heavy" ones in 0.5–1 s (12–25 frames), ceremonial ones in 2.5–3.5 s
     (60–85 frames). The subject does not change position, the action is not interrupted.
  4. Landing: the set lies down or leaves past the frame edge; an impact, splashes, dust; the subject reacts
     to the new place (looks around, stands up, walks) — 1 s or more in the new environment.
variants:
  - the wall sinks below the floor line or the horizon — an empty sky or space opens up
  - the wall lifts up out of the frame on cables, often as the camera pulls out following a walking subject
  - the wall falls flat backward — the room turns out to be a set in the middle of a street or a field
  - panels or backdrops slide apart from the center, like a curtain — slow, 2.5 s and longer
  - the walls of a container or a box collapse outward with water or dust — a 0.5 s impact + a 1 s splash
  - turntable: a table or floor with people rotates, after the turn there is a different group or a different time (10→90 % in 3.4 s)
  - prop wipe: a foreground object (a column, a plant) crosses the frame in 0.2 s, and the backdrop behind it is already different
  - adjacent stage: the camera glides sideways and skips across the border between two sets (a 0.3–0.4 s jerk)
  - pass through darkness: the subject walks into a black doorway, a wardrobe or a dark scene and comes out in a new set (0.5–3 s of black)
status: hybrid
fallback: a real set change is shot on set — look in the source footage for a continuous shot where the background changes while the subject stays still; without such a shot — a simulation (subject mask + two background plates, the old plate moves away like a wall); no plate of the new environment — generate the background or the whole shot with the user's consent
params:
  kind: sink | lift | fall_back | part | collapse | spin | prop_wipe | pan_adjacent | dark_pass
  reveal_dur: "10→90 % of the reveal: fast 0.2–0.3 s (5–7 frames); heavy 0.5–1.0 s (12–25 frames); slow 2.5–3.5 s (60–85 frames); typically 0.9 s (22 frames)"
  ease: sinking and falling — inQuad/inCubic (accelerating under weight); lifting — outQuad; sliding apart — linear or inOutQuad; turning — inOutCubic
  edge_speed: sinking 1–7 % of the frame height per frame, accelerating (average ≈3 %); sliding apart 0.4–1 % of the width per frame per panel
  area: 30–80 % of the frame changes; the subject takes 20–40 % of the frame, subject shift ≤ 2 %
  edge: a straight panel edge + a dark shadow of 1–2 % of the frame; motion blur along the movement for the fast kinds
  land: for falling and sinking — a 0.5–1 % shake for 2–4 frames at the moment of impact, dust or splashes
  camera: static or a slow pull-out ×0.5 over 1–2 s; with pan_adjacent — a 0.3–0.4 s jerk across the border
  hold_before: 0.5–2 s
  hold_after: 1 s or more in the new environment
  audio: room tone of A → ambience of B following the reveal curve; the muffled sound "opens up"
when: the hook in the first 1–2 s (the walls fall — the real location is revealed); a change of topic or place with a continuous host; a jump in time (turntable — the same table in another era); the impact of a falling wall on a downbeat or the drop; a final reveal "it was a set"; no more than once every 30–60 s, a series of 2–4 changes — only in a single-shot video format
avoid: an unreliable subject mask (hair in the wind, fast movements, transparent objects); backgrounds with different perspective, camera height or light direction; a handheld camera without stabilization — the plates "drift"; the subject's shadow or reflection stays on the old wall; a slow slide-apart in a fast genre; when a plain change of place is needed, an honest cut is better
sfx: sinking and falling — a low rumble or whoosh on the movement and a heavy hit (impact / sub_drop) at the moment of contact; sliding apart — a mechanical rolling sound or a long whoosh; prop wipe — a short whoosh; the ambience of the new environment (wind, sea, crowd) swells with the reveal, the muffled room sound "opens up"
genres: {product: signature, explainer: allowed, viral: allowed, epic: allowed, drama: allowed, travel: allowed, fashion: allowed, teaser: allowed, ugc: allowed, motivation: allowed, sport: allowed, calm: allowed}
detect: |
  ed_motion: no cuts (or the cut does not coincide with the moment of change); global motion is small or
  follows the subject; meanwhile the histograms of the start and the end differ strongly (a different location).
  Custom check — the reveal curve: the share of "changing" pixels (|A−B| is large) that are closer to the
  final frame grows monotonically over 5–85 frames, while the subject's central area stays stable.
  The boundary of the change is a straight edge moving across the frame (a profile by rows or columns),
  with a shadow and perspective; for a fall — a trapezoid shrinking toward the floor.
  Difference from trans.wipe: a graphic wipe's boundary cuts through the subject too, and its edge is perfectly straight with no shadow.
  Difference from a dissolve: there is no semi-transparent overlay of two frames.
  Difference from a mask-based background replacement: the background does not appear at once but physically "opens up".
  Difference from a whip transition: there is no overall motion blur of the frame, only the set moves.
engine: |
  mask(method='mediapipe_person', feather=3) — the subject from shot A (and from B, if the continuation was shot separately)
  + set_reveal(plate_old=A.bg, plate_new=B.bg|generated, subject=A.person, kind='sink'|'lift'|'fall_back'|'part'|'spin'|'prop_wipe',
    dur=0.9, ease='inQuad', edge_shadow=0.015, motion_blur=0.5, land_shake=0.008)
  + sfx('whoosh', at=t0, align='attack') + sfx('impact', at=t0+dur) + ambience_xfade(A, B, t=[t0, t0+dur])
  Swap the subject of A for the subject from B — at the moment the poses match or after the landing; dark_pass — transition(kind='dip(black)', dur=0.5–1)
  + match(on='motion'); pan_adjacent — transform(shift) with a 0.3 s jerk + a seam along a vertical edge.
gen_hint: one continuous locked-off shot, <subject> stands in <room set>, the walls of the set <sink into the floor | fall backward flat | lift up out of frame | slide apart from the center like theater flats>, revealing <new location> behind, the subject stays in place and keeps acting, practical stage effect, no cut
commands: ["the walls fall and we're on the beach, at 0:03", "set change behind the host between #3 and #4", "the wall slides down on the drop", "the backdrop parts like a curtain in the finale"]
related: [trans.wipe, trans.portal, trans.whip, mask.bg_replace, trans.dissolve]
evidence: {examples: 14, sources: 14, measured: "the edge of a sinking wall 15→90 % of the height in 1.0 s, accelerating 1.2→7 %/frame; a wall falling backward — 0.9 s; panels sliding apart — a gap of 52 % of the width in 2.8 s; collapse — 10→80 % in 0.5 s + a 1 s splash; prop wipe and sliding panel — 0.2–0.28 s; turntable — 10→90 % in 3.4 s; a jerk across the border of the adjacent stage 0.3–0.4 s; 32–78 % of the frame changes; 2 of 14 are a camera move through a stage with no clear change", confidence: medium}
