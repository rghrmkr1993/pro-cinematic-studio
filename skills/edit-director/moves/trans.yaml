id: trans.iris
family: trans
group: transition
level: B
aliases: [iris wipe, iris in, iris out, shape wipe, star wipe, iris, shape transition, circle wipe, diamond wipe]
what: a graphic shape wipe — a circle, diamond, star, stripes or shards grow from a point (or shrink to a point) with a hard edge and reveal the next shot
frames: |
  1. Start: a small hard-edged shape appears in the frame (radius 0.05–0.15 of the frame height) — in the center of the frame
     (4 of 7), on a round object in the outgoing shot or on a moving subject (2 of 7); inside it is the next shot at full
     size. Iris from black: the outgoing side is a black frame.
  2. Growth: the shape expands to a size that covers the frame (from the center a radius of ≈1.0 height is needed for 16:9).
     The radius grows linearly by 0.025–0.035 of the height per frame @20 fps (diamond, star) or with acceleration (from an object, shards);
     stripes along the frame diagonal do the opposite — fast at the start.
  3. Finish: the shape goes past the edges and the new shot remains. Duration 0.6–1.9 s (15–48 frames @25 fps), typically 0.7–1.0 s.
  4. Closing iris: a circle holding the outgoing shot shrinks to a point near the center in 0.4 s (10 frames @25 fps),
     radius 0.65 → 0.07 of the height; the picture inside the circle shrinks with it, behind it the new shot is already playing.
variants:
  - circle from an object: the iris starts at exactly the size of a round object in frame (a scoreboard, a lamp, a porthole) and opens up
  - circle on the subject: the circle is "glued" to the moving subject's back and grows for 1.9 s, following them
  - diamond from black: opening of a video or chapter, center of the frame, linear growth over 1.3 s
  - star: a five-pointed star from the center, 0.9 s — a deliberately playful tone
  - diagonal stripes: the stripes run parallel to the frame's main diagonal (handrails, stairs), which matches in both shots, 0.85 s
  - polygon shards: several angular pieces grow with acceleration, 0.7 s
  - closing iris with the picture shrinking: 0.4 s, at the end of a scene
status: code
fallback: the "from an object" and "on the subject" circles require circle detection (Hough) or object tracking; if there is none — the center of the frame or the face (track(face))
params:
  dur: 0.4–1.9 s (10–48 frames @25 fps); opening typically 0.7–1.0 s, closing 0.4 s
  shape: circle | diamond | star(5) | strips(angle = frame diagonal) | polygon
  mode: open (the shape grows, the new shot inside) | close (the shape holding the outgoing shot shrinks)
  center: frame center [0.5, 0.5] (4 of 7) | a round object | track(person|face)
  r_start: 0.05–0.15 of the frame height or the size of the object
  r_end: until the frame is covered — ≈1.0 height from the center for 16:9
  ease: linear in radius (diamond, star); inQuad when starting from an object and for shards; outQuad for stripes
  edge: hard, no feather and no outline (7 of 7)
  content: with open the new shot is not scaled; with close the outgoing shot shrinks together with the circle
when: opening or closing a video or chapter; retro, comedy, a cartoonish and playful tone; a "look here" accent when closing on a face or object; a change of act, product or location in a music video on the beat; no more than once per minute, except for deliberate stylization
avoid: drama and tense scenes (it kills the seriousness); an epic tone; a star shape outside a playful style; a shape center that misses the important object; a soft edge — reads as a mistake, not as a style
sfx: opening — a short pop or whoosh on the growth; star — a sparkly chime; iris close — a comedic "thunk" or a stop chord at the moment it snaps shut
genres: {fanedit: allowed, viral: allowed, ugc: allowed, clips: allowed, explainer: allowed, product: allowed, fashion: allowed, travel: allowed, calm: allowed, drama: forbidden, epic: forbidden, teaser: forbidden, motivation: forbidden}
detect: |
  A sharp geometric boundary between two different images (no blur on the edge), the area of the "new" region
  grows (or shrinks) monotonically over 0.4–1.9 s; the mask has a regular shape: circularity ≈1 (circle), 4 corners (diamond), 10 vertices
  (star), parallel stripes; the center of mass near the frame center or on an object. Iris from black — ed_motion flags
  black frames at the start. Custom check: a per-frame mask of "closer to the incoming frame than to the outgoing one" → area, center,
  equivalent radius. Difference from trans.wipe: there the edge is a blurred real object. From a portal into an object
  (the camera flies into a screen or window): there the boundary is a real object in perspective and moves with the camera.
engine: |
  transition(kind='wipe(shape)', dur=0.8, params={shape:'circle', mode:'open', center:[0.5,0.5]|track(face)|hough_circle(A),
  r0:0.08, r1:1.05, ease:'linear', feather:0, scale_content:false})
  Close: transition(kind='wipe(shape)', dur=0.4, params={shape:'circle', mode:'close', center:track(face),
  r0:0.65, r1:0, scale_content:true}) + sfx('impact', at=end).
  From black: fade(to='black') is not needed — A = a black frame, shape='diamond', dur=1.3.
  + sfx('whoosh', at=start of growth, align='attack').
gen_hint: "for a shape transition generate two ordinary shots; if an in-camera version is wanted: <scene A> with a round object (lamp, porthole, round sign) centered in frame, the camera slowly pushes toward it; the iris mask itself is added in edit"
commands: ["close the scene with an iris on the subject's face", "star transition between #2 and #3", "open the video with a diamond from black", "circle wipe out of the street lamp at 0:21"]
related: [trans.wipe, trans.portal, mask.window_replace, mask.silhouette_window]
evidence: {examples: 7, sources: 2, measured: "per-frame 'new shot' mask: area, center and equivalent radius; opening 0.6–1.9 s (diamond 1.3 s with linear radius growth of 0.03 of the height per frame @20 fps, star 0.9 s, circle from an object 1.0 s with acceleration, stripes 0.85 s, shards 0.7 s, circle on the subject 1.9 s); closing 0.4 s, radius 0.65 → 0.07 of the height; hard edge in all 7; center in the middle of the frame in 4 of 7", confidence: medium}
