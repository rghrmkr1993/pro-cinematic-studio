id: trans.portal
family: trans
group: transition
level: C
aliases: [portal, transition through an object, entering an object, through the screen, through the eye, through the mouth, through a hole, window to another world, rift in the frame, portal transition, through-object transition, hole transition, rift]
what: a transition into another scene through an opening — the camera flies into a screen, a mouth, a pupil, a mirror, a hole or a door and comes out in a new place; or a pull-out shows that the scene was inside an object; or a rift window into another world opens right in the frame
frames: |
  1. Setup: an object with an opening is in frame — a phone or laptop screen, a pocket mirror, a glasses lens, a mouth,
     an eye, a shoe, a bucket, a pit, a door, a hoop; the opening is 5–30 % of the frame, push-in center 0.46–0.54.
  2. Entry: an accelerating push-in (ease-in) into the opening ×2–3.5 over 0.5–0.9 s, peaking at ×1.08–1.2 per frame right
     before it fills the frame; a sharp entry — a crash push-in with radial motion blur or a ≈160° twist in 0.36 s.
  3. Seam — at the moment the opening covers the whole frame, by one of these methods:
     a) a cut on fill — the new scene immediately continues the push-in at the same pace (×3 over 1.4 s);
     b) darkness or a uniform surface (a bottom, an insole, the inside of a pit) for 0.1–0.6 s, 3–15 frames;
     c) a 2-frame flash (0.1 s) or a vortex with motion blur;
     d) nesting — the new scene is already visible inside the opening and simply grows; a chain of such
        nestings gives ×100+ in 1.2 s.
  4. Exit: the motion continues in the new scene, or a pull-out ×0.1–0.65 over 0.8–2.5 s reveals
     a new frame — the scene turns out to be inside a pupil, a mouth, a screen, a map, a hoop.
  Rift in the frame (no object): a rectangular window or opening with a soft glowing edge of 2–4 % of the frame
  hangs in the air with another scene inside; the opening opens or collapses in 0.4–1 s
  (90 % of the area changes within 0.4 s), the subject rides or walks through it. A door — via a burn-out:
  brightness 51 → 150 in 0.45 s, the new world emerges from the light.
variants:
  - entering a screen, mirror or window → exiting into the scene shown in it (the most common)
  - entering a mouth, eye, shoe, bucket or pit → darkness or a uniform mass → a new scene; the shape of the opening matches an arch or a tunnel
  - reveal pull-out — we start inside (stars, a face, a room), the pull-out shows a pupil, a mouth, a screen
  - tunnel — going into a pit or a vortex, 0.2–0.6 s of darkness, exiting from a similar opening in another world
  - magic lens — glasses or a hoop pass in front of the camera, inside the lens is another version of the scene (a different look, time, a rotated world)
  - rift in the air — a window with a glowing edge opens or collapses, the subject rides through it
  - window in a wall — a rectangle with another place inside an interior, a slow push-in ×1.7–3.4 over 3.2–3.7 s until it fills the frame
  - a chain of nested openings (a mouth within a mouth, a frame within a frame) — borderline with the infinite zoom
status: hybrid
fallback: no shot with a suitable opening — generate a short shot of "the camera flies into <object>" or insert the new scene into a track of a screen, window or mirror (a quad or a mask); without a mask — pure code — a rift or a fixed-shape window in the middle of the frame (a rectangle, an oval with a glowing edge); a seam through darkness hides any two shots with a dark edge
params:
  dir: in (fly into the opening) | out (reveal pull-out) | lens (the other scene only inside the object) | rift (a window with no object)
  push: "×2–3.5 over 0.5–0.9 s (13–23 frames), ease inCubic, peak ×1.08–1.2/frame; slow, through a window in a wall, ×1.7–3.4 over 3.2–3.7 s; scale to fill S = 1.1 / the opening's share of the width"
  pull: ×0.1–0.65 over 0.8–2.5 s (20–62 frames), outCubic; a long reveal ×0.03 over 1.4 s
  seam: "cut_at_fill (cut when the opening is ≥ 100 % of the frame) | dark 0.1–0.6 s (3–15 frames) | flash 2 frames | nest (nesting)"
  speed_match: the scale speed matches across the seam (±15 %), the direction of motion is kept
  center: on the opening — track(object) or the screen quad; the center deviates ≤ 0.05 from the center of the opening
  rim: for a rift — a glowing edge of 2–4 % of the frame, a soft feather of 1–2 %; for an object — no edge, a hard mask along the contour
  rift_time: opening or collapsing in 0.4–1 s, 90 % of the area within 0.4 s
  lens_pass: the lens passes through the frame in 0.5–1.1 s
  door_flash: a burn-out up to ×2–3 brightness over 0.3–0.5 s, 0.5–1 s of white before the new scene
