id: fx.volumetric_flythrough
family: fx
group: effect
level: C
aliases: [NeRF, gaussian splatting, gaussian splats, 3D splat, volumetric capture, volumetric video, frozen moment flythrough, flight through a frozen moment, impossible camera]
what: the camera flies freely through a frozen moment reconstructed in 3D — people are frozen mid-action, dust and shards hang in the air, and at the edges the frame stretches into radial rays and "swims" — a digital, dreamlike presentation
frames: |
  1. The moment is frozen: two people lying on a bed, football players mid-kick, shards and papers in the air above a street,
     a person standing in a square; only the camera moves.
  2. The camera path is free, unsupported: a push-in ×5.2 over 3.1 s with acceleration (ease-in) and a +39° roll, then
     a pull-out ×0.27 over 2.6 s with braking (ease-out) and a −45° roll; a gentle pull-out ×0.68 over 2.6 s almost
     linearly; an orbit with push-ins ×1.2–1.7 and a roll of up to 38° over 2.1 s; a shuttle ×1.4 forward over 0.7 s and ×0.86 back.
  3. Artifacts as style: when the camera leaves the captured volume, the edges stretch into radial rays
     (a "star"): the share of radial strokes in the outer ring is 0.5–0.8 versus 0.1–0.3 for regular video;
     the center stays sharp. Also: "clouds" in the sky, a smeared floor, mushy foliage up close.
  4. Transformation: the background breaks up into points and vertical colored stripes, the characters remain on a floating
     diorama island against a sunset.
  5. Volumetric video: people made of white points walk inside a lattice space.
variants:
  - flight through a moment: a frozen scene, the camera dives in and flies back out, a star artifact at the edges
  - hanging debris: an explosion or objects flying apart, a slow pull-out
  - orbit around the subject: a person standing still in a square, the camera circles, blobs float in the sky
  - diorama island: the background falls apart, the scene turns into a floating piece of land
  - volumetric point video: moving people as point clouds
status: generation
fallback: generating a "frozen moment, the camera flies through the scene" video with consent; if the user has an orbit of a static scene (20–60 s of video around it) — training a 3D splat offline (footage); simulation in code from a single frame — 2.5D (depth map + a camera path with a small offset of ±10–15 % of the frame + deliberately stretching the edges into rays)
params:
  freeze: the scene is static; only the camera moves (2.5D — a freeze frame)
  path: push-in ×2–5 over 2.5–3.5 s (ease-in) / pull-out ×0.25–0.7 over 2.5 s (ease-out) / orbit 30–60° over 2 s
  roll: 10–20°/s along the flight, the sign changes at the turnaround
  edge_streak: radial stretching of edge pixels in the outer 20–30 % of the frame, strength by the camera's distance from the starting point; stroke share 0.5–0.8 at the peaks
  floaters: 2–6 soft blobs (blur 2–4 % of the frame) in empty areas
  fps: 10–16 fps in real examples; in the video 25 fps with motion_blur 0.3
  duration: 1.3–6 s (30–150 frames @25 fps)
  depth_warp_limit: 2.5D — camera offset ≤15 % of the frame width, beyond that holes appear — cover them with outpaint or rays
