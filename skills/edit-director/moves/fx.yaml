id: fx.film_overlay
family: fx
group: effect
level: B
aliases: [film overlay, film texture, grain overlay, film grain, grain on top, dust overlay, dust and hairs, organic look, film on top]
what: a procedural film texture over any shot — grain, dust, hairs, scratches, flicker and frame micro-weave — with no change of color, frame border or format; from a barely noticeable "organic" feel to old film, in levels 1–3
frames: |
  Not an event but a layer over the whole episode: every frame gets new grain, the frame "lives" even on a freeze frame, a title or black.
  1. Grain: fine specks of 1.3–2.8 px @1080 over the whole frame, strongest in the midtones, weaker in deep shadows and highlights;
     no two frames share a grain pattern; color stock adds a faint tint to the specks.
  2. Dust: 1–25 dots and clumps of 1–6 px per frame in random places, mostly dark (light ones on a dark background),
     each lives 1 frame; occasionally a clump "sticks" for 2–6 frames.
  3. Hairs: a thin curved line 2–8 % of the frame's short side (S) long flashes for 1–4 frames, sometimes hangs at the frame edge for 1–3 s.
  4. Scratch: a light vertical line 1–2 px wide over 40–100 % of the height appears abruptly, lives 0.3–1.5 s, jitters
     horizontally by 1–3 px, breaks up in places; at level 3 there are 1–3 at once.
  5. Flicker: the brightness of the whole frame wanders by ±0.7–5 % from frame to frame — unevenly, without rhythm.
  6. Gate weave: the whole frame floats with an amplitude of 1–12 px @1080 at 0.5–3 Hz, more noticeably vertically than horizontally.
  Color, contrast, the black point and the frame format do not change — that is the job of look.film.
variants:
  - level 1, organic: only fine grain, micro-flicker and barely noticeable weave — "shot, not rendered"; glues together phone, camera and generated shots
  - level 2, film: noticeable grain, occasional dust, a hair every 3–5 s, a scratch every 4–8 s, light flicker and weave
  - level 3, old film: coarse grain, lots of dust and hairs, 1–3 scratches constantly, strong flicker and weave — flashback, archive, "found footage"
  - grain only: monochrome or colored, without dust or weave — for clean genres and graphics
  - dust on black: a black frame or leader with dust and hairs between parts of the video
status: code
fallback: no special footage or third-party overlay files are needed — everything is synthesized in code from a seed on any video; a night source with heavy digital noise should first go through a denoiser (otherwise the noise doubles), and only then gets the grain
params:
  level: "1 — organic, 2 — film, 3 — old film; the numbers below are given per level 1 / 2 / 3; the level changes only at a boundary between parts of the video"
  grain_sigma: "grain σ in 0–255 levels in the midtones: 2–3 / 4–5 / 7–10; black-and-white old film — 10–14"
  grain_size: "speck width (autocorrelation width at half maximum) @1080: 1.3–1.6 / 1.8–2.2 / 2.2–2.8 px; generation — white noise, Gaussian σ 0.3–0.9 px, then normalization to the target σ; at 4K — ×2"
  grain_response: luminance weight — 1.0 in the midtones (0.3–0.6), 0.6 in deep shadows, 0.3 in highlights above 0.9; add to the frame in gamma, not in linear light
  grain_chroma: colored grain — channels correlated at 0.7–0.85 (mostly luminance), color share 0.2–0.5; for B&W — monochrome
  grain_renew: a new pattern every frame (correlation between adjacent frames 0); the grain lives on a freeze frame too
  dust: "dots per 1080×1920 frame: 0–1 / 3–8 / 10–25; size 1–6 px (mostly 1–3), a clump of 3–5 dots with a 0.5 px blur; 70–80 % dark, 20–30 % light; opacity 0.4–0.9; they live 1 frame, 5 % — 2–6 frames"
  hair: "hairs per second: 0 / 0.2–0.3 / 1–2; length 2–8 % S, thickness 1 px, a curve with 1–2 bends, lives 1–4 frames; 30 % — at the frame edge, hanging for 1–3 s"
  scratch: "at once: 0 / 0–1 / 1–3; width 1–2 px, light (85–95 % white, opacity 0.4–0.7), length 40–100 % of the height with breaks; lives 0.3–1.5 s (8–38 frames @25 fps, 9–45 @30 fps); jitters by ±1–3 px per frame, crawls 0–5 px/s; a new one every 4–8 s (level 2) or 1–3 s (level 3)"
  flicker: "brightness ±0.7 / ±2 / ±4–5 % (per-frame σ), noise with a 6–12 Hz cutoff — not a strobe; optionally the frame edges flicker more than the center"
  weave: "weave amplitude @1080: 0.5–1.5 / 2–5 / 6–12 px, vertical ×1.5–2 relative to horizontal; smooth noise at 0.5–3 Hz plus per-frame scatter of 25 % of the amplitude; rotation ±0.02–0.1°; overscan ×1.01–1.02 so there are no empty edges"
  seed: seed = base + timeline frame number — re-rendering a section gives the same result (project = code)
  speed: a bank of 32–64 grain tiles of 512×512 for the required σ and size, per frame — a random tile with an offset and a flip, never the same tile on two frames in a row; assembling the grain for a 1080×1920 frame ≈ 10 ms versus ≈ 200 ms generating from scratch, luminance-weighted blending ≈ 40 ms on 1 core; draw dust, hairs and scratches in small windows, not with full-frame masks
  delivery: "the platform re-encodes the video: fine grain of 1–1.5 px is wiped out almost completely (≈ 5 % σ remains) and turns into blotches, 2–2.5 px grain keeps 30–40 % σ; so for social media levels 2–3 use size 2–2.5 px and σ 5–8 (≈ 2–3 after re-encoding); level 1 almost disappears on social media — it is for the master and high bitrates; master — H.264 CRF 17–19 with -tune grain"
  order: grade → glow → light leaks → impulse effects (RGB split, shake) → film_overlay → text; level 1 grain can also go over titles (it glues graphics to the picture), dust and scratches — always under text and subtitles
when: |
  Calm, warm and nostalgic videos — level 1–2 for the whole video; a memory, a flashback, archive and old photos —
  level 3 for an episode of 3–15 s; travel, fashion, fan edit, motivation with a dark cinematic grade — level 1–2;
  cutting together mixed sources (phone, camera, generated shots) — level 1 over everything; masking banding in skies and
  gradients — level 1. The layer is not synced to the music: the level changes only on the downbeat of a part boundary (for example,
  verse — 2, drop — 1 for a clean hit, flashback in the bridge — 3). Hook — texture from the first frame, never switched on mid-shot;
  outro — the same level to the end or a move to "dust on black". Dust on black — pauses and leaders between parts, 0.5–1.5 s.
  Limit: level 3 — no longer than 15 s in a row, unless the whole video is styled as old film.
avoid: |
  Infographics, small text, interfaces and screens (dust reads as dirt, grain eats thin lines); product macro shots —
  specks look like real dirt on the product (level 1 only, without dust); beauty close-ups — level 1 grain only;
  mixing with tape noise and digital glitch in one shot (clashing media); a noisy night source without a denoiser (the noise
  doubles); strobe flicker stronger than ±8 % (cheap and dangerous for photosensitive viewers); a looped texture with repeating
  dust — the texture is always procedural and new every frame; a scratch on a face or eyes for longer than 1 s; switching the
  texture on and off between adjacent shots of the same scene.
sfx: level 1 — no sound; levels 2–3 — a quiet projector clatter and film rustle under the episode (synthesis — pink noise in the 1.5–6 kHz band with 18–24 Hz amplitude modulation plus rare 2–5 ms clicks), −30…−24 dB relative to the music, another −6 dB under the voice; on entering a level 3 episode — a mechanism click sfx('click', at=t0, align='attack')
genres: {calm: signature, fanedit: signature, viral: allowed, epic: allowed, drama: allowed, product: allowed, phonk: allowed, sport: allowed, travel: allowed, fashion: allowed, teaser: allowed, clips: allowed, ugc: allowed, motivation: allowed, explainer: forbidden}
detect: |
  Grain: in flat areas the residual "frame minus Gaussian σ 3 px" has σ of 1.5–10 levels, the residual's correlation between adjacent frames ≈ 0
  (less than 0.1), the autocorrelation width is 1.3–2.8 px @1080 and the same in x and y ±15 % (tape noise is stretched horizontally
  1.5–3 times). In videos downloaded from a platform σ is 2–3 times lower and the width 2.5–3.5 px (re-encoding); fine level 1 grain
  may not survive.
  The main sign is "living" freeze frames, titles and black frames: black frames (ed_motion black frames) have noise σ of 1 level or more,
  new every frame (digital black after a codec is flat, σ below 0.3); a frozen frame with level 2–3 grain does not register as
  ed_motion holds — the frame-to-frame difference is 1–4 (from 1 after re-encoding) instead of below 0.6.
  Dust: 1–6 px specks where |frame − median of three adjacent frames| exceeds 40 levels, living 1 frame, 1–25 per frame, 70–80 % darker than the background.
  Scratch: in the column profile of |frame − blur| — a peak 1–2 px wide over 40 % of the height or more, lasting 8–40 frames and shifting by ±1–3 px.
  Flicker: mean brightness jumps by ±0.5–5 % from frame to frame with no cuts and no motion (no flash frames or strobe flips).
  Weave: ed_motion shake jitter_pct 0.02–0.2 % (p90 up to 0.4 %), x_dir_flips 0, no ZOOM, ROTATE or SHIFT events; the weave is present even on
  static titles. Color matches the adjacent clean shots (rgb_med, sat_med), bars ≈ 0.
  Differences: look.film — plus a color change (warm or teal shift, lifted blacks), halation, a film gate with rounded
  corners and perforations (bars 0.03–0.07), white frames on cuts; glitch.film_damage — events: R/B light leaks 3–6, film burn, a frame
  slip with an inter-frame bar (jitter from 8 %), double image, reel tail; glitch.vhs and look.vhs — a soft image, blurred shifted
  color, horizontal interference bands; handheld.shaky — jitter 0.6–4.5 % with directional jerks; fx.night_vision — green monochrome.
engine: |
  film_overlay(level=2, t=[t0, t1], seed, grain={...}, dust={...}, hair={...}, scratch={...}, flicker={...}, weave={...}) =
    grain(sigma=4.5, size=2.0, chroma=0.35, corr=0.8, response='mids', renew=1)                  — extends grain(amount, size)
    + film_dust(per_frame=5, size=[1, 4], dark_share=0.75, opacity=[0.4, 0.9], sticky=0.05)       — new
    + film_hair(per_s=0.25, length=[0.02, 0.08], width=1, life=[1, 4], edge_stick=0.3)            — new
    + film_scratches(max=1, width=[1, 2], polarity='light', opacity=[0.4, 0.7], life=[0.3, 1.5],
                     jitter=2, spawn_every=[4, 8])                                                  — new
    + flicker(amount=0.02, cutoff_hz=8)                                                             — as in look.film, refined
    + gate_weave(amp_px=3, freq=[0.5, 3], y_ratio=1.7, jitter=0.25, rot=0.05, overscan=1.015)        — as in look.film, refined
  presets: level=1 → grain(2.5, 1.5), flicker 0.007, weave 1 px, no dust, hairs or scratches;
           level=3 → grain(8, 2.4), dust 15, hair 1.5 per second, scratches max 2 (a new one every 1–3 s), flicker 0.045, weave 8 px.
  grain: n = N(0, 1) from the tile bank → Gaussian σ_b 0.3–0.9 px → n / std(n) → channels: corr · n + √(1 − corr²) · n_c →
         frame += σ/255 · w(Y) · n in gamma, w(Y) — interpolation [0: 0.6, 0.3–0.6: 1.0, from 0.9: 0.3] → clip to 0–1.
  look.film and glitch.film_damage call the same components (film_damage(dust, scratches) = film_dust + film_hair + film_scratches).
  Export: libx264 -crf 18 -tune grain; QA — do a test re-encode at CRF 28 and check that the grain σ in a flat area stays at 1.5
  levels or more (levels 2–3), otherwise make the grain coarser (size ×1.3) or raise σ.
