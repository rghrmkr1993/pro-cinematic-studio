id: fx.tiny_planet
family: fx
group: effect
level: B
aliases: [tiny planet, little planet, mini planet, stereographic projection, rabbit hole, sky tunnel, polar unwrap]
what: the whole surround view is wrapped into a small planet-ball — the ground in the center, sky all around, the subject standing on top; or the reverse, a "hole" — a circle of sky in the center, the ground as walls around it; the planet slowly rotates
frames: |
  1. The planet is centered in the frame (±5 %), diameter 0.3–0.85 of the frame height (typically 0.6); the ground/sky boundary is
     an almost closed ring, houses, trees and streetlights stick out like rays; sky and clouds all around.
  2. The subject is on the planet's "top" at 12 o'clock, 15–25 % of the frame height tall; a road runs through the ball
     as an elongated lens.
  3. The rotation is even: 16–26°/s (76° over 2.9 s as the subject walks — the planet rolls under their feet);
     breathing in scale ×0.8–1.2 over 1–1.5 s.
  4. The "hole" (inversion): the sky is a circle in the center, 0.4–0.6 of the height, the ground, water or grass recede as walls
     to the edges, people look down into the center from above.
  5. Entry: a normal wide shot folds into a planet or a hole over 2–3.5 s — the horizon bends
     into a ring, with rotation up to 100–157°/s and ZOOM-OUT ×0.4–0.5.
variants:
  - classic little planet: sand or a field as a ball, the subject walks on top, clouds all around
  - hedgehog city: buildings sticking outward as rays, the planet rotates against a blue sky
  - road lens: a highway as an ellipse running through the ball, an autumn forest in a ring
  - hole: a circle of sky in the center, walls of grass or water; people peer in from above
  - folding: a wide view from a boat or a meadow turns into a hole with rotation over 2–3.5 s
  - selfie planet: the subject with the camera in the center, a tunnel or a train car around in a ring
  - catch the planet: a hand reaches for the ball and grabs it — a cut to the camera operator's face (vertical format)
status: code
fallback: best from 360 material (a stereographic projection with the nadir in the center); from regular video — a polar unwrap of a wide panorama or a shot with a level horizon (the seam at the bottom is hidden with a mirrored join); if the source is narrow — outpaint the sides or generation with consent
params:
  diameter: 0.3–0.85 of the frame height, typically 0.6; in vertical 9:16 — 0.5–0.55 of the width
  center: "[0.5, 0.5] ±0.05"
  fov: 360° in azimuth; for a regular shot — the frame width is stretched over 360°, the seam at 6 o'clock
  subject: at 12 o'clock, 15–25 % of the frame height
  rotation: 15–30°/s constant (≈0.6–1.2° per frame @25 fps); during folding — up to 100–160°/s
  breathe: scale ×0.8–1.2 over 1–1.5 s
