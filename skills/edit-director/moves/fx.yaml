id: fx.living_object
family: fx
group: aesthetics
level: C
aliases: [anthropomorphism, personification, living object, object with eyes, googly eyes, wiggly eyes, talking object, object character]
what: an inanimate object gets a face and a personality — eyes, a mouth, facial expressions, a pose and a voice; a stone blinks, a power socket looks surprised, a ball sings, a mountain smiles; comedy, cuteness and a mascot out of any object
frames: |
  1. The object is large and almost centered, the camera is static (jitter 0.02–0.14 % of the frame in 5 of 8) or slowly pushes in
     (×1.35–1.37 over 0.8–2.2 s); the object takes up 20–60 % of the frame height, the background is ordinary, "live".
  2. The face is built from what the object already has (the socket's holes, the ball's seams, the mountain's folds), or added:
     plastic googly eyes, drawn or human eyes and mouth. The eyes are in the upper third of the object, the distance
     between them ≈0.3–0.4 of its width, diameter ≈12–20 % of the width.
  3. Animation: blinking and darting pupils, expression changes ≈2–3 times per second, the mouth sings or talks (≈2 openings/s);
     features can appear one by one — on a plasticine mountain the eyes at 1.35 s, a little tree as a "hairdo" at 2.85 s,
     a smile at 4.2 s.
  4. The object acts like a person: sings, watches what is going on, flies toward the camera with a facial expression while around it
     ordinary life goes on (a game on a playground, a street). Shot 0.9–5.4 s.
variants:
  - googly eyes: real plastic eyes on a stone or an object, the pupils wobble, a ≈0.9 s loop
  - face from the object's details: a socket, headlights, a house's windows turn into eyes and a mouth and change expressions
  - human face on an object: a real person's eyes and mouth set into a ball, a fruit or a mug, singing or talking
  - plasticine and stop-motion: a mountain or an object with sculpted eyes, details appear one by one
  - drawn object characters (a sock, a flower, a potted plant) with eyes and little legs walk among real people on the street
  - puppet animals in human clothes, behaving like people (see fx.talking_animal)
  - living portrait: a person in a framed painting moves, the camera pushes in on the frame
status: hybrid
fallback: |
  googly eyes, drawn eyes and mouth, blinking and simple lip-sync are done in code on top of the object's tracking;
  human eyes and mouth are taken from the user's video (face mesh, cut-out of lips and eyes) with their consent;
  plasticine, puppet and drawn characters, complex expressions built from the object's details — generation.
params:
  target: object 20–60 % of the frame height, tracked every frame (bbox or planar), smoothing over 3 frames
  eyes: in the upper third of the object, spacing 0.3–0.4 of the width, diameter 12–20 % of the width; white + pupil of 40–55 % of the diameter
  googly: a spring-loaded pupil — lag 2–4 frames, overshoot 20–40 %, decay 0.3–0.5 s after the object jerks
  blink: every 2–5 s, 3–4 frames (close 1, hold 1–2, open 1)
  mouth: 3–4 shapes (closed / half-open / open / "o"), openness = voice envelope (attack 1 frame, release 2–3), shape changes on twos (12.5 fps)
  human_features: cut-out of eyes and lips via face mesh, feather 2–3 px, color and grain matched to the object, scaled to the object's size
  expression_rate: 2–3 expression changes per second for "chatter", one expression for 0.3–1 s for a reaction
  feature_reveal: details appear one at a time, 1–1.5 s apart, each with a pop scale 0→1.15→1 over 4–6 frames
  squash: on stressed words, squash-and-stretch of the object's height ×0.92–1.08 over 4–6 frames
when: the hook and comedic inserts, the "object's" reactions to what is happening, a product mascot (the product speaks in the brand's voice), explainer videos with a guide character, kids' and cute topics; the eyes appear on a downbeat or a pause in the track; 1–3 times per video or as a running character
avoid: a serious or tragic tone; the object rotates a lot or leaves the frame (the track breaks, the eyes "float"); eyes that do not match the object's perspective; lip-sync running ahead of the voice by more than 2 frames; a face on a small object (under 15 % of the frame) — the expressions do not read
sfx: a "pop" or a "blink" on the eyes' appearance, a cartoon ting on a blink, the character's voice (can be pitched +2–4 semitones), a creak or a squeaker on the squash
