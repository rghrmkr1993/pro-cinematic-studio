id: fx.omni_360
family: fx
group: effect
level: B
aliases: [360 camera, spherical video, equirectangular, 360 unwrap, invisible selfie stick, invisible stick, 360 reframe, 360 panorama]
what: 360-camera footage unwrapped into an unusual projection — the whole sphere as a flat strip, an ultra-wide "ball", a tunnel, or an orbit around the subject from an invisible stick; the frame bends and spins in ways a normal camera cannot
frames: |
  1. Full unwrap: the whole surround view in one ≈2:1 frame — the left edge continues the right one
     (edge correlation 0.86–1.0), horizontal lines become sinusoids, doors and windows repeat
     across the width; the camera moves, the picture slides sideways; a zoom-in insert into part of the strip ×2–2.6 over 1.9–2.5 s.
  2. Ultra-wide "ball": a 150–220° field of view, strong barrel distortion, the edges curl, verticals in the center stay straight.
  3. Projection morph within a shot: a normal wide view folds into a tunnel or a ball over 1.8–4 s,
     with a simultaneous roll of 55–100°/s (up to 400° over 3.9 s) — a corridor or a train car becomes a tube.
  4. Orbit from an invisible stick: the subject in the center, the camera "floats" around and above them (no operator visible),
     a fly-through push-in ×5.5–5.8 over 1.2–1.4 s from a wide to a medium shot.
  5. Spin transition: a frantic roll and yaw of 4–16° per frame (100–400°/s) with motion blur into radial streaks,
     several flash cuts every 4 frames, landing on the running subject.
variants:
  - unwrapped strip: a whole train car or station in one 2:1 frame, the camera moves
  - ball view: an ultra-wide spherical picture from below or from inside a train car
  - tunnel morph: a corridor folds into a tube with rotation
  - orbit from an invisible stick: a night dance in streetlight, the camera flies around
  - spin transition: a rotation with motion blur between train car scenes, landing on the subject
status: footage
fallback: without 360 material — simulation in code (a spherical or "ball" warp of a wide shot + roll + radial blur); tunnel and tiny planet — a polar unwrap of a wide panorama (see fx.tiny_planet); the orbit from an invisible stick — only 360 footage or generation with consent
params:
  projection: equirectangular 360×180 (2:1 frame) | ultra-wide stereographic 150–220° | rectilinear ≤120° for a "normal" view
  morph: 1.8–4 s (45–100 frames @25 fps) from rectilinear to ball or tunnel, ease inOutCubic
  roll: drift 10–30°/s; in a morph 55–100°/s; spin transition 100–400°/s (4–16° per frame)
  yaw_drift: 10–30°/s for the unwrapped strip
  flythrough: push-in ×3–6 over 1.1–1.4 s toward the subject
  blur: radial/zoom at rotation speeds >5° per frame
  resolution: a 5.7K sphere gives ≈1080p in a 90° rectilinear view — do not crop any tighter
  duration: 1.5–5 s per shot
when: action and sports (skateboarding, cycling, parkour, dance), travel and parties, a music video with an "impossible" camera; spin transition — between locations on a downbeat; tunnel morph — the build-up before the drop; unwrapped strip — the intro or an opening overview of the place. 1–3 times per video
avoid: a talking head and calm interviews; sphere stitching seams and a visible operator; faces at the very edge of the projection (stretched); long spins — they cause motion sickness; low resolution with heavy cropping
sfx: spin and morph — whoosh/reverse_whoosh under the rotation, impact on the landing; fly-through to the subject — riser; unwrap — ambience of the location
genres: {sport: signature, fanedit: allowed, travel: allowed, viral: allowed, phonk: allowed, ugc: allowed, clips: allowed, epic: allowed, teaser: allowed, calm: forbidden}
