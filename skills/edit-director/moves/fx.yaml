  Unwrap: aspect ≈2:1, the left and right edges of the frame match (column correlation >0.8), horizontals are bent into a sinusoid, verticals are straight.
  Ball and tunnel: closed or nearly closed circular lines around the center, verticals converge radially.
  ed_motion: long ROTATE at 55–100°/s centered ≈(0.5, 0.5) together with ZOOM-OUT ×0.4–0.7 — a morph;
