id: fx.bobblehead
family: fx
group: effect
level: B
aliases: [bobblehead, nodding doll, bobbing head, adult head on a child's body, caricature head, chibi proportions]
what: a person's live head is out of proportion to the body — the head is enlarged or the body shrunk to a child's or doll's size; an adult turns into a living toy, a comedic composite
frames: |
  1. The shot is static (8 of 10 measured — jitter 0.01–0.12 % of the frame), medium or wide, the whole figure in frame;
     most often a "toy" setting: a sandbox, a toy piano, a baby stroller, a dollhouse living room.
  2. The head is real — with live facial expressions and lip-sync; the body is a child's, a doll's or shrunk. The head is ≈25–30 % of the height
     of the seated figure versus ≈13 % normally, i.e. ≈×1.8–2.2 relative to the body; head width ≈0.6 of shoulder width (normal ≈0.4).
  3. The character does "adult" things — sings, gestures, plays an instrument — and the contrast between proportions and behavior makes
     the joke. The shot holds for 1.4–3.9 s; camera movement, if any, is a slow push-in or pull-out ×1.05–1.1.
variants:
  - adult head on a toddler's body: in a stroller, at a toy piano, on a slide — the head is composited onto a body double's body
  - marionette doll: thin doll arms, a live head, a doll's room; body movements are jerky, as in stop-motion animation
  - toy world: two people among giant toys in a sandbox — proportions shifted only slightly, the oversaturated warm color does the main work
  - code version without a body swap: head ×1.5–2 right on the original person with a light bobblehead "wobble"
status: hybrid
fallback: |
  without a suitable body — only head enlargement in code on the original shot; the "head on a child's body in a toy
  world" scene — generation from a face photo with the user's consent; shrinking the body while keeping the head requires restoring
  the background (outpaint or a clean plate without the person from the source footage).
params:
  head_scale: ×1.5–2.2 of the original (typically ×1.8); pivot point — the chin or the base of the neck
  mask: head with hair — face contour from face mesh, expanded upward and sideways by 25–40 %, ∩ person mask; feather 2–4 px @1080p
  tracking: every frame; smooth position and scale over 3–5 frames, otherwise the head "floats" separately from the neck
  bobble: optional — the head tilt lags by 2–4 frames, wobble ±4–8° decaying over 0.4–0.6 s
  body_scale: shrunk-body variant ×0.5–0.6 with the head at ×1.0; needs a restored background
  shot: static medium or wide shot, whole figure, 1.5–4 s (38–100 frames)
  look: toy palette — saturation median 90–150 of 255 (measured), warm shift R−B ≈ +25–70, primary colors
when: comedic inserts and punchlines, meme reactions, music videos and fan edits with toy characters, UGC humor; a single accent 1–3 times per video or a running device for a whole scene; the effect appears on a downbeat or a stressed word
avoid: a serious, dramatic or luxury tone; a face in profile beyond ≈60° or covered by hands (the mask breaks); fast head movements and motion blur; a close-up of the face — without the body the effect does not read; several overlapping people without reliable tracking
sfx: a cartoon "boing" or pop on the appearance; for comedy — the voice pitched up 3–5 semitones; without a voice effect — the regular track
genres: {viral: signature, ugc: allowed, fanedit: allowed, clips: allowed, drama: forbidden, epic: forbidden, motivation: forbidden, fashion: forbidden, teaser: forbidden}
detect: |
  ed_motion: usually static (no events, jitter ≤0.12 %), sat_med ≥90 and a warm rgb_med (R−B ≥ 25) in the "toy"
  variant. The key sign is proportions via mediapipe: face height ≥0.6 of torso length (shoulders–pelvis; normal ≈0.35–0.4) or head
  width ≥0.55 of shoulder width; adult facial features (stubble, adult face shape) on a child's body; a mask halo along the hair edge;
  the head slightly "floats" relative to the neck from frame to frame.
  Differences: lens.fisheye — the whole frame is distorted, background lines bend; scene.tiny_people — the person is shrunk as a whole
  with proportions preserved; a real child — childlike facial features.
engine: |
  head = mask(method='face', feather=3) expanded upward by 35 % ∩ mask('mediapipe_person')
  new primitive head_scale(scale=1.8, pivot='chin', smooth=4, bobble={amp: 6, lag: 3, decay: 0.5}) — scales the head
  layer around track(chin) every frame; composite(layers=[plate, head], blend='normal').
  Toy look: color(params={saturation: +40 %, temperature: warm +8, contrast: +10 %}).
  Body variant: mask('mediapipe_person') → transform(scale=0.55, center=track(feet)) over the restored
  background (outpaint) → the head on top at scale 1.0 with the pivot on the new chin.
  sfx('click', at=appearance) or voice pitch +4 semitones.
gen_hint: a grown man's real head on a toddler's body, sitting at a tiny yellow toy piano on a sunny beach, bobblehead proportions, oversaturated warm toy-like colors, static wide shot, comedic music video style
commands: ["give me a big head on #3", "bobblehead on the chorus: head ×2 with a wobble", "my head on a toddler's body in a toy world", "bobblehead on the punchline at 0:15"]
related: [scene.tiny_people, scene.forced_perspective, lens.fisheye, trans.lens_distort]
evidence: {examples: 10, sources: 2, measured: "camera static in 8 of 10 (jitter 0.01–0.12 %), in 2 — a push-in or pull-out ×1.05–1.1 over 0.7–2.4 s; shots 1.4–3.9 s; head ≈25–30 % of the seated figure's height — estimated from frames; saturation median 91–152, warm shift R−B 23–72 in 9 of 10", confidence: medium}
---
id: fx.color_shift
family: fx
group: effect
level: B
aliases: [color change, color shift, hue shift, recolor, colour cycle, RGB cycle, monotone, color pop, color returns, desaturation, relight]
what: the scene's color changes abruptly or smoothly right inside a shot or on a cut — per-channel monotone, a drop to B&W and the return of color, a "creeping" hue, a different light color on the same scene — as an accent on the beat or on a change of meaning
frames: |
  1. Setup: a shot in normal color for 0.3–2 s — the viewer memorizes the "normal" palette.
  2. The shift, in one of three ways:
     jump — within 1 frame on a beat or a cut (the scene stays the same, the geometry does not break);
     hue rotation — 35–95° per second, 0.9–3.2 s (a face turns green in ≈0.9 s, the background goes from pink to blue in 3 s);
     reveal — B&W for 0.3 s, then saturation rises from 0 to 0.5 over 1.2 s almost linearly.
  3. Hold of the new color for 0.3–1 s in cycles or until the end of the shot.
  4. Return the same way, through a short diagonal wipe of 1–2 frames, or with a cut to normal color.
  RGB cycle: red monotone (one channel ≈95 % of the sum, brightness drops to 20–45 % of the original) → green → blue, 0.3–0.45 s each,
  with 0.1 s diagonal wipes between them, then normal color — the whole cycle ≈2 s.
variants:
  - RGB cycle: red → green → blue monotone, 0.3–0.45 s each, through diagonal wipes, then normal
  - color returns: B&W → color over 1–1.5 s ("the world comes alive") or the reverse desaturation
  - creeping hue: one color (green, red) floods the face over ≈1 s — emotion, screen light, nausea
  - background rotation: the background or the light smoothly travels around the hue circle over 3–6 s, the original color shows on white flashes
  - recolor on a cut: the same scene, a different light color (light blue → red) — a cut on the beat
  - treatment changes on beats: color → B&W → hard B&W → cold color, 0.3–1 s per shot
  - color strobe: the light on the characters changes color every 0.15–0.3 s
status: code
fallback: relighting the characters looks more realistic with a mask (hybrid) — the background and the person are tinted differently; if real colored light is needed — look in the source footage for shots with colored lamps or generate them (with consent)
params:
  jump: 1 frame; hold 0.3–1 s (8–25 frames @25 fps) — ½–2 beats at 120 BPM
  hue_sweep: 35–95° per second, 0.9–3.2 s, ease linear or inOutSine
  fade: saturation 0 → normal over 1–1.5 s (25–38 frames), linear; B&W hold up to 0.3 s
  monotint: one channel ≈90–95 % of the RGB sum, brightness ×0.2–0.45 (red brighter than blue)
  cycle: R → G → B → normal, 0.3–0.45 s each; wipe between colors at 45°, 1–2 frames
  mask: whole frame | background only (person mask) | face only
  treatments: color / B&W / B&W with contrast ×1.5–2 / cold color — one per shot
when: the drop and a change of track section, a snare run (cycle), a turn in meaning — desaturation as loss, the return of color as hope; chorus versus verse; dreams and trips; fashion shots on a plain background; big shifts no more than once per 8 bars, a cycle — 3–4 beats in a row
avoid: a product with a brand color and skin in beauty content, if the color matters; small random shifts — they look like a broken white balance; a shift not anchored to the music or the meaning; a long monotone (longer than 1 s) on an important face
sfx: on a jump — a hit or a click on the beat; on a rotation — a filter sweep or a riser; on the return of color — a low-pass filter opening and the music swelling; on a cycle — three identical hits
genres: {fanedit: signature, fashion: signature, viral: allowed, phonk: allowed, motivation: allowed, drama: allowed, teaser: allowed, clips: allowed, sport: allowed, travel: allowed, calm: allowed, product: allowed}
detect: |
  ed_motion: "cuts" without loss of tracking (LK keeps the points, the geometry is continuous), some of them only a color change; black frames
  on the blue monotone; holds while the scene is unchanged.
  Custom code: saturation-weighted circular mean of hue and per-frame channel shares — a hue jump > 60° within 1 frame with
  static geometry; a drift of 35–95° per second; one channel > 80 % of the RGB sum (monotone); saturation rising from 0 to 0.4–0.5 over 1–1.5 s
  at unchanged brightness (return of color).
  Difference from a regular cut: points are tracked across the "seam", only the color changes. Difference from cut.flash: brightness does not spike.
  Difference from a constant grade (look.*): here the color changes over time within the video.
engine: |
  color(params={'hue_rotate': [0, 90], 't': [t0, t0+1.0], 'ease': 'linear'}) — hue rotation
  color(params={'saturation': [0, 1], 't': [t0, t0+1.2]}) — return of color; the reverse — desaturation
  color_cycle(seq=['R', 'G', 'B', 'orig'], hold=0.4, wipe={'angle': 45, 'dur': 0.08}, beat_sync='1/4') — new primitive
  + mask(method='mediapipe_person') to recolor only the background or only the subject
  + sfx('impact', at=beat) on jumps; sfx('riser', t=[t0, t0+1.0]) on a rotation
gen_hint: <subject> in a scene whose lighting color shifts dramatically, the whole frame washes from pink to blue, saturated monochrome color changes, colored light cycling red green blue
commands: ["RGB cycle on the three snares before the drop", "bring the color back into the frame on #5 after the B&W", "face turns green on the line at 0:14", "background shifts from pink to blue over the whole verse"]
related: [fx.glitch, cut.flash, look.film, mask.bg_replace, trans.wipe]
evidence: {examples: 8, sources: 8, measured: "RGB cycle: red 0.4 s (R 95 %), green 0.35 s, blue 0.45 s, wipes 1–2 frames @20 fps, whole cycle ≈1.6 s between normal frames; return of color: saturation 0 → 0.5 over 1.2 s almost linearly; creeping green: hue 27° → 113° over 0.9 s; background rotation: 328° → 216° over 3.2 s (≈35°/s), hold 0.8 s, back to 291° by 6 s; treatment changes from shot to shot every 0.3–0.8 s", confidence: high}
---
id: fx.duplicate
family: fx
group: effect
level: C
aliases: [clone, clone shot, clones, cloning, twins, double, twinning, subject double, clone army, replication, multiplication, time stacking, copy stack, object array]
what: the same person or object appears in the frame several times — a double at the table, a hall full of clones, copies popping up on the beats, an object multiplied into a forest or a flock; the scene is whole, without borders or seams
frames: |
  The basis is a locked-off camera (jitter 0.01–0.13 % of the frame) and several takes combined into one frame over a "clean plate".
  1. Setup: the subject alone in frame for 0.1–1 s, or straight to a wide shot with the copies.
  2. The copies appear in one of these ways:
     one by one on the rhythm: a new copy every 1–2 frames (40–80 ms), in 0.3 s the hall goes from 1 → 14 figures;
     emerging: a copy steps out of the subject offset by ≈10 % of the frame, holds and merges back into them;
     entering the frame: the double walks in from the side and stands next to them;
     on a cut: a close-up of the subject → a wide shot where there are two of them (a dialogue with oneself).
  3. Hold: the copies live independently (different takes, different poses) for 2–10 s; for a pair "holding hands" the seam runs
     through the empty space between the figures.
  Objects: one object multiplied into an array — dozens to hundreds of copies fill a strip or the whole frame (wind turbines, traffic lights, a structure),
  or 10 copies of a chairlift chair stand in a "stack" offset diagonally, or airplanes from different moments in time
  are gathered into one sky (one camera position, different passes).
  Grid: the frame shrinks into a repeating grid of copies — from 1 to 5 across the width in 0.45–0.65 s (zoom-out ×0.36), then holds.
variants:
  - double: two instances of the subject in one shot (a conversation, walking hand in hand, playing four-handed) — a vertical seam between them
  - hall of clones: copies of one or two people appear one at a time on the rhythm and fill the space
  - split-off: a copy separates from the subject, lives on its own and merges back; the camera can move (tracking needed)
  - the double enters the frame: a second instance of the subject walks in from the side or from behind
  - stack: 8–12 copies of an object offset diagonally by ≈4–6 % of the frame, moving together
  - object array: dozens to hundreds of identical objects (graphics) — a surreal landscape
  - stacking in time: one camera position, different passes of an object (planes, cars, passers-by) — all in one frame
  - grid of frame copies: the image recedes into an endless grid of repeats on the drop
  - mirror shards: the face repeated 4–5 times in a fan of mirrors, right in camera
status: hybrid
fallback: needs a static tripod shot and several takes (the subject in different places) — look in the source footage for series shot from one position; if there is only one take — stacking in time from a single clip or a "stack" via a mask; for object arrays and complex scenes — generation (with consent)
params:
  copies: 2 (double), 3–14 (hall), 8–12 (stack), 30–300 (object array); typically 2–5 for people
  camera: tripod or a stabilized frame, jitter < 0.15 %; if moving — tracking and the same trajectory in all takes
  plate: a clean plate without the subject, 1–2 s (or a median of frames) to fill the seams
  seam: a vertical seam through empty space, feather 2–5 % of the width; at overlaps — a person mask
  appear: one by one, 1 copy per 1–2 frames (40–80 ms) or 1 copy per beat; emerging 0.3–0.5 s; entering the frame 1–2 s
  stagger_time: for stacking in time, an offset of 0.3–1 s between copies of one pass
  stack_offset: 4–6 % of the frame per copy diagonally, no fade (unlike an echo)
  grid: 1 → 4–5 copies across the width in 0.45–0.65 s (zoom-out ×0.3–0.4), mirrored joins — optional
  hold: 2–10 s per shot with copies
when: duality and inner dialogue, "me versus myself", comedy, "one person is a whole group" (a choir, a team, an audience), product abundance, a surreal image; the copies appear on the beats before the drop or on the drop; 1–2 times per video
avoid: handheld camera without tracking (the seams drift); different light and shadows between takes; overlapping copies without a mask — ghosts and semi-transparency; identical synchronized movements of the copies — looks cheap (use different takes or offset them in time); a tight frame where the copies have no room to stand
sfx: on each copy's appearance — a click or a "pop" on the beat; on a split-off — a whoosh or a reverse; voice doubling (double-tracking) for the copies; on the grid of copies — a riser into the drop
genres: {fanedit: allowed, viral: allowed, ugc: allowed, fashion: allowed, product: allowed, teaser: allowed, drama: allowed, clips: allowed, motivation: allowed, phonk: allowed, explainer: allowed}
detect: |
  ed_motion: the camera is static (jitter 0.01–0.13 %, holds) while the people move naturally; on the grid of copies — ZOOM-OUT ×0.36 over 0.65 s centered at [0.5, 0.5]
  and nonrigid ≈0.1.
  Custom code: several faces or figures with identical features (face embeddings, clothing histogram) in one frame; the number of
  changed patches relative to the first frame grows by 1 every 1–2 frames (one-by-one appearance); a repeated object — many matches of one template
  (template matching) in one frame; identical trajectories offset in time.
  Difference from time.echo_trail: an echo is a semi-transparent fading trail behind the movement; clones are opaque and independent.
  Difference from split screen: there, visible borders and different spaces; here, one continuous space. Difference from fx.kaleidoscope:
  no mirror symmetry around the center.
engine: |
  clone(takes=[clip_a, clip_b, ...] | time_offsets=[0, 0.6, 1.2], plate='median'|clip_plate, mask='split(x=0.5, feather=0.03)'|'mediapipe_person'|'hf_remove_background',
        appear='pop'|'fade'|'slide', stagger=0.04, t=[t0, t1]) — new primitive: combines takes over a clean plate
  instance_array(mask='hf_remove_background', count=10, offset=[0.05, -0.04], scale_jitter=0.05) — stack and array of object copies
  time_stack(clip, offsets=[0, 0.5, 1.0, ...], plate='median', key='difference') — stacking passes in time from one static clip
  tile_zoom(start=1, end=5, dur=0.6, mirror=False, ease='inOutQuad') — grid of frame copies
  + stabilize(1.0) before combining, if the camera drifts slightly; + sfx('click', at=each appearance, align='attack')
gen_hint: the same person appears five times in one continuous locked-off shot, clones of <subject> sitting in different rows of an empty theater, seamless composite, consistent lighting
commands: ["clones of the subject appear one per beat before the drop", "make a double at the table on #4", "multiply the product into a whole shelf at 0:12", "grid of frame copies on the drop"]
related: [time.echo_trail, fx.kaleidoscope, layout.split_screen, mask.bg_replace, fx.refraction, cut.jump]
evidence: {examples: 15, sources: 13, measured: "camera jitter 0.01–0.13 % in 7 of 9 shots with people and objects; hall: 1 → 14 copies in 0.32 s, one every 1–2 frames @25 fps, starting after 0.12 s; split-off: copy offset ≈10 % of the frame, merge in ≈0.2 s with a moving camera (pull-out ×0.76); grid: zoom-out ×0.36 over 0.65 s, 5 copies across and 3 down; stack — 10 copies; object arrays — dozens to hundreds; 1 example is ambiguous (possibly different people)", confidence: medium}
