id: fx.letterbox
family: fx
group: effect
level: B
aliases: [letterbox, aspect ratio change, animated letterbox, movie bars, cinema bars, black bars, cinematic bars, pillarbox, frame curtains, slit opening]
what: black bars smoothly slide onto the frame or off it — the aspect ratio changes right in the shot (16:9 ↔ 2.2–2.4:1, ↔ 4:3, slit ↔ full frame) to "switch on cinema", open or close a scene, move to another time
frames: |
  1. Start: the original format — full frame, existing bars (2.14–2.37:1) or a black screen.
  2. Bar movement: straight edges, pure black; symmetrical top and bottom (±1 % of the height),
     constant speed (almost linear) — 0.05–0.12 of the frame height per second per bar
     (0.2–0.5 % per frame @25 fps). Duration 0.7–2.6 s; a slow "creep" — 0.03 of the height/s
     over 3.9 s; opening from a slit — 4.6 s, and under intro titles — up to ≈47 s.
  3. The bars ignore cuts: the movement continues through shot changes without a jerk.
  4. Finish: the new format holds to the end of the scene (2.0–2.4:1, 1.33:1 or full frame) or closes
     to black; when closing to the eyes the bottom bar moves twice as fast as the top one (0.25 versus 0.12 of the height/s),
     the slit converges on the eye line at ≈0.33 of the height.
  5. In 4 of 9 examples a slow zoom-in ×1.27–1.69 over 1.5–2.8 s runs at the same time — the format squeeze
     and the zoom work together.
variants:
  - cinema mode (16:9 → 2.2–2.4:1): bars of 9.6–12.8 % of the height each slide in over ≈2 s, often under a title or a key product shot
  - creep: a very slow slide-in of the bars (1.6 → 14 % over 3.9 s) in a tense dialogue — the viewer does not notice it but feels the pressure
  - the frame opens up (2.14–2.37:1 → 16:9): the bars leave over 0.7–2.1 s when the world "opens wide" or after a split screen
  - opening from a slit: black → a strip 4 % of the height → 1.9:1 over 4.6 s (under an intro — stretched over the whole opening montage)
  - closing to the eyes: the full frame shrinks into a slit on the eye line over 2.6 s together with a zoom-in ×1.7, then black
  - orientation change: 2.21:1 → 4:3 over 1.7 s — the top/bottom bars leave, side bars grow; a sign of another time or of archive footage
  - breathing: 1.92 → 1.61 → 1.99:1, ≈1.5 s each way, in time with the camera move
status: code
fallback: if something key (a face, text) falls under a bar — reframe by tracking; if the new format lacks picture at the edges — outpaint
params:
  ratio_169: "16:9 → 2.39:1 bars of 12.8 % of the height each; 2.35:1 — 12.2 %; 2.2:1 — 9.6 %; 2.0:1 — 5.6 %; 1.85:1 — 1.9 %; 4:3 — side bars of 12.5 % of the width each"
  ratio_916: "vertical 9:16 → 4:5 bars of 14.8 % of the height each; 1:1 — 21.9 %; 16:9 — 34.2 %; 2.39:1 — 38.2 %"
  speed: 0.05–0.12 of the height/s per bar (typically 0.06); creep 0.03/s; intro slit 0.01–0.09/s
  duration: 0.7–2.6 s (18–65 frames @25 fps), typically 1.5–2 s; creep 3–4 s; opening from a slit 4–5 s
  ease: linear (all 9 examples); outCubic is allowed for the landing in the last 4–6 frames
  anchor: center; closing to the eyes — the eye line track(face) ≈0.3–0.35 of the height, the bottom bar at ×2 the speed of the top one
  color: "#000000, edge without feathering"
  cuts: the bar animation runs straight through, cuts do not interrupt it
  breathe: amplitude ±3.5–7 % of the height per bar, ≈1.5 s per phase (period ≈3 s or 2 bars of music)
  pair_zoom: optionally a zoom-in ×1.2–1.7 over the same time
  safe_zone: keep titles and faces in the central band of the final format; intro text — centered in the slit
when: intro (opening from a slit, slowly under the titles), entering "cinema" — the drop, an epic moment, a product reveal (the bars slide in); a climax of open space — the bars leave; outro and a dramatic finale — closing to the eyes into black; flashback and archive — 4:3; tension in a conversation — the creep. One format change per scene, 1–3 per video
avoid: jerking the format back and forth for no reason (except rhythmic breathing); covering subtitles, faces and social media UI zones with the bars; a 1–2-frame jump of the bars — reads as a glitch; different bar colors in one video
sfx: opening — a long swell or riser over the whole movement, an impact at the moment it stops; closing to black — a sub_drop or sudden silence; creep — a low drone; breathing — in sync with the bass
genres: {epic: signature, teaser: signature, drama: allowed, motivation: allowed, travel: allowed, fashion: allowed, product: allowed, fanedit: allowed, calm: allowed, clips: allowed, explainer: allowed, sport: allowed, phonk: allowed, viral: forbidden, ugc: forbidden}
detect: |
  Custom calculation: rows (columns) at the frame edges whose 98th percentile of brightness is < 28 of 255; the bar
  thickness changes monotonically by 0.2–0.5 % of the height per frame, equally top and bottom (±1 %), the bars are pure black,
  the border is straight; the bar movement is not interrupted at cuts.
  ed_motion: the bars field is non-zero (median 0.04–0.29); the picture inside does not shrink — no ZOOM-OUT coinciding with the bars growing (otherwise it is the frame shrinking "into a window"); often a parallel ZOOM-IN ×1.2–1.7, almost linear.
  Difference from fade: not the whole frame darkens, the brightness of the center does not change.
  Difference from trans.wipe and iris: the bars are straight, symmetrical and do not reveal a new frame.
  Constant bars that do not change are just the video's format, not a move.
engine: |
  letterbox(ratio=[r0, r1], t=[t0, t0+D], ease='linear', anchor=[0.5, 0.5], color='#000000', through_cuts=True)
  r0/r1 — ratios (2.39 | 2.2 | 1.78 | 1.33 | 0.8 | 1.0); when r1 < the original format, the bars become side bars
  Cinema mode on the drop: letterbox(ratio=[1.78, 2.39], t=[drop-2, drop]) + transform(scale=[1, 1.3], t=[drop-2, drop], ease='linear')
  Closing to the eyes: letterbox(ratio=[1.78, 60], anchor=[0.5, track(eyes).y], t=[t0, t0+2.6]) + transform(scale=[1, 1.7]) + fade(to='black', t=t0+2.6, dur=0.04)
  Breathing: letterbox(ratio=[1.92, 1.61, 1.99], t=[b0, b0+1.5, b0+3], ease='linear') over 2 bars of music
  + sfx('swell', at=t0, align='attack') + sfx('impact', at=t0+D)
gen_hint: cinematic widescreen shot of <scene>, composed for 2.39:1 anamorphic framing with the key action inside the central horizontal band, room above and below for black letterbox bars, film look
commands: ["switch on cinematic bars on the drop", "intro — the frame opens from a narrow slit", "make the flashback 4:3", "at the end, close the bars down to the eyes and go to black", "let the bars breathe in time on the chorus"]
related: [zoom.slow, zoom.in, layout.split_screen, trans.wipe, cut.flash]
evidence: {examples: 9, sources: 9, measured: "bars symmetrical within ±1 % of the height, movement almost linear; speed 0.047–0.124 of the height/s (5 of 9), creep 0.033/s over 3.9 s, slit → 1.91:1 over 4.6 s (0.088/s), intro ≈47 s (0.008/s); cinema mode 1.78→2.30 over 2 s; opening up 2.14→1.78 over 0.72 s and 2.37→1.81 over 2.1 s through a cut; 2.21→1.33 over 1.7 s; closing to the eyes: top 0.12/s, bottom 0.25/s, converging at 0.33 of the height; breathing 1.92→1.61→1.99, ≈1.5 s each; a simultaneous zoom-in ×1.27–1.69 — 4 of 9", confidence: high}
