id: fx.projection
family: fx
group: effect
level: B
aliases: [projection, projector, projection mapping, video mapping, face projection, fabric projection, projected light]
what: another video falls as light onto a face, a body, fabric, palms, water mist or a stage backdrop — the image bends over the relief, darkness all around; a ghostly, dreamy, theatrical image
frames: |
  1. The scene is dark: median L 11–44 (7 of 9 examples); the light comes mostly from the projector — p95 88–207,
     peaks 235–250. Bright areas — 1–19 % of the frame.
  2. The projected image follows the surface: geometric shards run across a face, a face breaks up
     on the folds of a sheet, an image lies in cupped palms, a figure hangs in water mist, threads of light
     cover a person and a wall. On the wall behind the person — their shadow, cut out of the projection.
  3. Light color: cold teal-white ≈RGB (165–175, 200–226, 220–234) for "ghosts" and water
     screens; warm white ≈(180, 180, 155) for fabric and palms; sometimes a solid screen color (red).
  4. The light is alive: mean brightness jitters by 1.5–2.6 levels from frame to frame with occasional jumps of
     15–30; the projected image changes (white → red → darkness) every 0.6–0.9 s.
  5. The equipment is visible: the projector lens as a point with ray flares, a halo around the projection spot, a beam in haze.
variants:
  - face mapping: shards and textures run over a still face on a gray background
  - screen behind the performers: people are dark silhouettes against a bright projection, patches of the image on their faces; the screen color changes on the rhythm
  - fabric projection: a face on a hanging sheet, the folds break the image, the fabric sways and drifts away
  - water screen: a glowing figure in water mist over a lake at night, the projector lens shines into the camera
  - cinema in the palms: a bright rectangle of a film in cupped hands, a child watching nearby
  - stage ghost: a teal glowing figure sits next to a real person
  - light threads: an abstract glowing texture is projected onto a person and a wall in sepia
  - backdrop behind musicians: blurred faces and eyes on the backdrop, the projector beam flares behind the band
status: hybrid
fallback: real projection — footage (look for concert and stage shots in the source footage); simulation in code — a person mask + a depth map for the bend + darkening the scene + a light overlay + a shadow; generation with the user's consent
params:
  ambient: darken the scene by 1.5–2.5 EV, median L 15–45
  blend: screen/add over the surface mask, multiplied by the surface's own brightness (0.4–1.0) — texture and shadows are preserved
  displacement: bend by a depth or luminance map, 1–3 % of the frame; the projection is softer than the base (blur 0.5–1.5 px), keystone 2–6°
  shadow: the person's silhouette on the screen/wall, offset 2–6 % of the frame away from the projector, opacity 70–90 %
  flicker: 1–3 % brightness per frame + rare jumps of 6–12 %
  color: "cold #a5cae0 for the 'ghost' and water; warm #b5b49e for fabric and palms"
  swap: projected image change on the beat — 0.5–0.9 s (12–22 frames @25 fps)
  beam: optionally a lens flare (glow threshold 0.9, 4–8 rays) + haze
  duration: 2–5 s per shot
when: a memory or a "movie in the head", a dreamy intro, ghosts and people who are gone, an art music video and a stage aesthetic, a concert backdrop; projected image changes — on the beat; 1–3 shots per video
avoid: bright surroundings (the projection is not visible); an image slapped on like a sticker without bending or darkening — gives away the fake; small text in a projection on a complex texture; long static shots without a projection change
sfx: a quiet projector hum and clatter (18–24 clicks per second for a film projector), on a projection change — a swell or whoosh, ambience
genres: {fashion: allowed, drama: allowed, calm: allowed, teaser: allowed, fanedit: allowed, product: allowed, motivation: allowed, epic: allowed}
detect: |
  A dark scene (median L ≤45) and bright areas following the shape of a surface (a face, fabric, palms, a curtain),
  inside which a foreign image plays with its own motion that does not match the object's motion;
  the surface's texture and shadows show through the image; mean brightness jitters by 1.5–3 levels per frame;
  the person's shadow on a bright projection; sometimes the projector lens with rays in frame.
  ed_motion: no signature of its own; flash/black frames when the projected image changes.
  Difference from mask.silhouette_window: there the image replaces the object and does not light it; here the image is light over the texture.
  Difference from double exposure: there the layers are blended over the whole frame or within a silhouette on a light background, not over a lit surface in darkness.
engine: |
  color(params={exposure: -2.0})
  + depth_map(model='midas') + mask(method='mediapipe_person'|'face'|'hf_remove_background', feather=0.004)
  + project(src=clip_B, onto=mask, displace=0.02, blend='screen', albedo='luma', blur=1.0, keystone=4, color='#b5b49e')
  + cast_shadow(mask, offset=[0.04, 0], opacity=0.8, on='background')
  + flicker(amount=0.02, spikes=0.08) + glow(threshold=0.9, radius=0.03)
  Projection change: project(src=clip_C, t=beat_i) on every beat, on a black pause — fade(to='black', dur=0.1)
