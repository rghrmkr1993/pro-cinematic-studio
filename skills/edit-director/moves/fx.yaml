id: fx.slit_scan
family: fx
group: effect
level: C
aliases: [slit-scan, slit scanning, time displacement, temporal displacement, time gradient, photo finish, time smear, stretching in time, scan line time warp, light corridor]
what: each row or column of the frame shows its own moment in time — motion turns into twisted, stretched, "rubbery" shapes while static things stay normal; plus a variant with the background unrolled into stripes
frames: |
  Mechanics: the frame is assembled from strips, and each strip has its own delay — "now" at the top, "a second ago" at the bottom
  (or left to right, or from the center). Static things look normal; everything that moves is distorted in proportion to its speed.
  1. Entry: a normal frame, then the delay switches on — at first only moving things are distorted.
  2. Development: the head turns, and the shoulders and chest repeat the turn with a delay — the body twists like a "rope";
     arms passing through the frame leave long continuous arm-ribbons behind them (stretching to 70 % of the width in ≈1 s);
     when the camera moves, verticals bend and stretch like "rubber".
  3. Return: when the motion stops, the lower strips "catch up" with the upper ones — after the full delay the frame is normal again
     (in the example the head finished turning, the bottom of the frame — 1.1–1.4 s later).
  Photo finish: the X axis is time; the static background turns into horizontal stripes (vertical gradients 8–12 times
  stronger than horizontal ones), while the moving subject reads as a figure.
variants:
  - row twist: a vertical time gradient, head and body turns become a spiral
  - long arms: a horizontal gradient, arms and objects stretch behind their motion into continuous ribbons
  - rubber background: the camera moves, verticals bend and stretch, the subject in the center is barely distorted
  - photo-finish background: a clean subject (via a mask), the background unrolled into horizontal colored stripes
  - stretch: facial features and hands stretch sideways in repeating contours
  - displacement map: the delay is set by a blob or a radial gradient — part of the face "lags" behind the rest
  - light corridor: graphic colored stripes fly from the center to the edges along two planes — "a flight through light"
status: code
fallback: a clean subject on a striped background — hybrid (person mask); the light corridor needs graphics or generation (with consent); if the source has no motion, the effect is invisible — add a digital move or pan, look for shots with turns, swings, walk-throughs
params:
  mode: rows (by rows) | cols (by columns) | radial (from the center) | map (delay map) | photo_finish (X axis = time)
  span: delay across the whole frame 0.5–1.5 s (12–38 frames @25 fps); twist — ≈1–1.2 s, long arms — from 1 s
  direction: top to bottom | bottom to top | left to right | right to left | from the center
  smoothness: interpolate the source to 100–200 frames per second (minterpolate or blending adjacent frames), otherwise steps H/span rows high are visible
  photo_finish: a 1–4 px slit in the center; background — horizontal stripes (|dy|/|dx| 8–12)
  mask: optional — the subject clean, only the background distorted (or vice versa)
  preroll: a buffer of at least span before the effect starts
  duration: 1.5–6 s per shot
when: a "time distortion", a dream, a trip, disorientation; dance and body movement (arms, head turns); tracking shots and pans in a music video; intros and art title sequences; a fashion portrait with a head turn; on long sustained parts of the track, not in fast cutting; 1–2 shots per video
avoid: a static frame without motion (nothing happens); fast handheld shake — mush; a face during a line (mouth and eyes swim); short shots < 1 s — the effect does not have time to unfold; product and text
sfx: a viscous sound with a slow-down and stretch effect (time-stretch, a sweeping flanger); at the start — a reverse or a riser; for the light corridor — a rising hum and whistle
genres: {fanedit: allowed, fashion: allowed, teaser: allowed, drama: allowed, viral: allowed, sport: allowed, travel: allowed, motivation: allowed, epic: allowed, explainer: forbidden}
detect: |
  ed_motion: with a static camera — events with nonrigid 0.5–1.3 and conf low, ECC fallbacks, false zooms and rotations; the camera and the seam do not change.
  Custom code: vertical edges that used to be straight are bent in proportion to the motion; the motion of the lower strips repeats the motion of the upper ones
  with a delay (cross-correlation of frame-difference energy across strips); |dy|/|dx| > 5 in the background — photo finish; objects stretch along the scan axis
  and "catch up" with themselves after stopping.
  Difference from time.echo_trail: an echo is semi-transparent whole copies; here, opaque strips from different times stitched into one image.
  Difference from glitch.datamosh: no blocks or color bleeding, the shape stretches smoothly along an axis. Difference from fx.glitch: the strips do not jump
  randomly — the delay is smooth and constant.
engine: |
  slit_scan(mode='rows'|'cols'|'radial'|'map', span=1.0, direction='top_down', interp_fps=150, map=None, mask=None, t=[t0, t1]) — new primitive:
    out[y] = src(t − span·y/H) (rows) — row-by-row sampling from a ring buffer of frames; radial — by distance from the center;
    map — a gray delay map 0..1 (a blob, a gradient, text)
  slit_scan(mode='photo_finish', slit_x=0.5, slit_w=2) — each frame advances the "tape" by slit_w pixels
  + mask(method='mediapipe_person') and composite: the subject over the unrolled background
  + speed(interp='flow') up to 150 frames per second before the scan; + sfx('reverse_whoosh', at=t0)
