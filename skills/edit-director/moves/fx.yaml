id: fx.glow
family: fx
group: effect
level: B
aliases: [glow, bloom, soft glow, neon glow, glow pulse, radiance, edge glow, anamorphic flare]
what: bright areas of the frame spill into a soft glow of their own color — from a light dreamy sheen to a neon halo; constant over an episode or as a pulse on the beat
frames: |
  Constant (a property of the episode):
  1. Source: everything brighter than the threshold — lights, windows, sky, highlights on skin and metal, white clothing, neon; dark areas are untouched.
  2. Around the source — a halo of the same color (in neon — of a set hue): a dense core of 0.3–1 % of the frame's short side (S),
     a middle layer of 1.5–4 % S, a wide tail of 6–15 % S; visible (from 3 levels of 255) at 2–5 % S from the source's edge.
  3. Black stays black: away from the lights the shadows and the black point are not lifted — the frame is not "milky" as in haze, edges are sharp.
  Pulse on the beat:
  4. Attack on the beat frame: within 1 frame the strength rises from a base of 0.2–0.3 to 0.8–1.5, radii ×1.3–2; mean frame brightness +5…+20 %,
     the halo of a point light reaches 8–12 % S.
  5. Exponential decay over 6–12 frames @25 fps (8–15 @30 fps) back to the base; by the next beat the frame is back at the base.
  Build-up and exit: strength 0.1 → 0.6 over 2–4 bars before the drop; in the finale the glow grows to white over 1–2 bars and goes into a fade.
variants:
  - dreamy: threshold 0.6–0.7, strength 0.15–0.35, radii up to 4–6 % S, warm or neutral — romance, travel, sunset, a wedding
  - neon: key on the brightest channel weighted by saturation, strength 0.5–1.0, halo saturation ×1.3–1.6 — a night city, a club, signs
  - pulse on the beat: base 0.2 and pulses up to 1.0–1.5 on the kick of the drop
  - subject contour glow: a glowing outline along the person mask in an accent color, pulsing on the beats — an "aura" in a fan edit
  - horizontal streaks (anamorphic flare): thin bluish streaks stretch from point lights across 10–40 % of the frame width
  - fade to white: the glow grows until the whole frame is blown out — a finale or a transition
status: code
fallback: without bright areas (a flat daytime shot, an overcast sky) the glow only adds overall murk — pick shots from the source footage with practical lights, backlight and highlights, or take the threshold from the shot's percentile (p95–p98) instead of an absolute value; the contour glow needs a mask of the subject (hybrid — mediapipe_person or hf_remove_background)
params:
  threshold: 0.6–0.85 (typically 0.72) with a soft knee of 0.05–0.15; adaptive — the p92–p97 percentile of the shot's brightness, computed once per shot, not per frame (otherwise the glow "breathes" on its own)
  key: "luma — regular glow; value = max(R,G,B) — colored lights; value_sat = max(R,G,B)·(0.5 + 0.5·saturation) — neon glows while skin (V 0.5–0.7, S 0.3–0.5) does not. By luma, an orange streetlight (luma ≈ 0.62) and blue neon (≈ 0.3) do not pass the 0.72 threshold"
  radii: "multi-radius as fractions of the short side S (px at 1080): [0.004, 0.015, 0.04, 0.10] → σ 4, 16, 43, 108 px with weights [0.35, 0.3, 0.2, 0.15]; dreamy — without the last layer; neon and pulse — radii ×1.3–1.6"
  strength: dreamy 0.15–0.35 (typically 0.25), neon 0.5–1.0, pulse peak 0.8–1.5; base between pulses 0–0.3
  blend: screen in linear light (soft, no clipping) — constant; add in linear light with a soft shoulder above 0.9 — neon, pulse, fade to white
  color: "default — the source's color; neon tint — magenta ff3cac, cyan 2de2e6, violet 8a5cff, warm ffb36b, mix 0.3–1.0; halo saturation ×1.0–1.6"
  pulse: attack 0 frames, peak 0–1 frame, exponential decay τ = 3 frames @25 fps (4 @30 fps) — back to the base within 6–12 frames @25 fps (8–15 @30 fps)
  ramp: strength 0.1 → 0.6 over 2–4 bars before the drop (inQuad), a 1.2 pulse on the drop beat, then base 0.25
  breathe: slow "breathing" of the strength ±20–40 % with a period of 1 bar (2 s at 120 BPM), sine — for calm parts
  streak: threshold 0.9 (point lights only), length σx 5–15 % of the width, thickness σy 0.15–0.3 % S, bluish tint 7fb2ff, strength 0.3–0.6
  contour: mask outline 0.3–0.8 % S and glow 1.5–5 % S, strength 0.6–1.2, an accent color that is not present in the scene
  render: compute layers with σ above 2 % S at ¼ resolution, 0.6–2 % S at ½, then upscale; gamma there and back — via lookup tables (LUT), not a per-pixel power; on 1 core ≈ 0.15 s per 1080×1920 frame, preview at ½ resolution ≈ 0.04 s
  scope: one base per scene; do not switch it on or off between adjacent shots of the same scene (except for pulses on the beat)
  limits: "pulses — no more than 1 per beat; strong ones (frame brightness +15 % or more) — no more than 2 per second and no longer than 2 bars in a row; no more than 3 large brightness swings per second over a large area (photosensitivity); constant strength above 0.35 — only for neon on night shots"
when: |
  Night, neon, the city, lights, concerts and clubs, fire and sparks, backlit sun, glints on water, white clothing; a dreamy tone —
  intro and outro, a memory, romance, golden hour, travel, a wedding. Hook — the glow is set from the first frame, or one
  pulse on the first downbeat. Build — strength rising 0.1 → 0.6 over 2–4 bars together with a riser. Drop — a pulse on every kick
  (base 0.2, peak 1.0), the strongest on the beat that enters the drop. Outro — fade to white over 1–2 bars and a fade, or slow breathing on the
  last shot. Contour glow — on the subject's appearance and in a fan edit's drop, 1–4 bars. Limits — in params.limits.
avoid: |
  Flat daytime shots without highlights (the frame just gets murky); a blown-out sky and a white background (the glow floods half the frame with white);
  text, subtitles, UI and infographics — the frame glow goes below the text layer (a glow on the letters themselves is a type.* style);
  products and packaging where contour and color matter (a halo on a white label looks like a defect); skin in close-up at strength above 0.4
  (a plastic face); a heavily compressed source (blocks in bright areas glow as squares — raise the threshold); together with
  light.halation on the same frames without intent (a double halo); pulses off the beats; the same strength on every frame of the video.
sfx: a constant glow needs no sound; pulses — no separate sound, they sit on the kick; the build-up before the drop — sfx.riser peaking on the drop beat; fade to white — a soft 1–2 s swell, −18…−12 dB relative to the music
genres: {fanedit: signature, viral: allowed, epic: allowed, drama: allowed, calm: allowed, product: allowed, phonk: allowed, sport: allowed, travel: allowed, fashion: allowed, teaser: allowed, clips: allowed, ugc: allowed, motivation: allowed, explainer: forbidden}
detect: |
  Visually: around lights, neon, highlights and the sky — a soft halo of the same hue as the source (or of a single tint in neon);
  object edges stay sharp (not defocus), black away from the lights stays deep (not haze).
  Measurement: a mask of cores (brightness from 0.85 or max(R,G,B) from 0.9); the profile of excess brightness in rings around the core — from 3 levels at
  2–5 % S (for a clean image — under 0.5 % S), for a pulse — up to 8–12 % S; in linear light the channel ratios of the excess match
  the source ±15 % (with halation the halo is redder than the source); p1 brightness and the dark channel away from the lights do not change (with haze they rise).
  Pulse: mean brightness +5…+20 % within 1 frame on the beat (the darker the frame, the larger) and an exponential decay over 6–12 frames @25 fps
  without a cut; sharpness (Laplacian variance) simultaneously drops to ×0.45–0.75. ed_motion: no cuts, no ZOOM or SHIFT; when brightness
  rises by more than 30 levels — flash frames, but no strobe flips (the decay is smooth).
  Neon: saturated halos (HSV-S from 150) around colored sources. Streaks: horizontal light bands through point lights across
  10–40 % of the width. Contour: a thin glowing line along the person's edge in a color not present in the scene.
  Differences: light.halation — a red-orange halo redder than the source and a thin red fringe on edges; light.haze — a veil
  lifts the blacks and kills contrast across the whole frame; focus.bokeh — lights turn into discs, the whole frame is soft; light.flash —
  the scene lighting changes with a gradient from the source, 2–4 frames; trans.flash — a flat white frame on a cut, the structure disappears;
  fx.light_leak — a patch at the frame edge, not tied to bright areas.
engine: |
  glow(threshold=0.72, knee=0.1, key='luma'|'value'|'value_sat'|mask, radii=[0.004, 0.015, 0.04, 0.10]·S,
       weights=[0.35, 0.3, 0.2, 0.15], strength=0.3, tint=None|'#ff3cac', tint_mix=0.6, sat=1.0,
       blend='screen'|'add', linear_light=True, soft_clip=0.9, t=[t0, t1]) — extends glow(threshold, radius)
    implementation: lin = sRGB → linear; hi = lin · smoothstep(thr − knee, thr + knee, key); for each radius — Gaussian at ½ or ¼
    resolution → upscale → weighted sum → saturation and tint → screen 1 − (1 − lin)(1 − g) or add lin + g with a shoulder
    k + (1 − k)(1 − exp(−(x − k)/(1 − k))) above k = 0.9 → linear → sRGB.
  beat_pulse(param='glow.strength', events=band_onsets(track, lo=30, hi=150), base=0.2, peak=1.0, attack=0, hold=0, tau=3,
             radius_mul=1.6, max_per_s=2) — the pulse generator from fx.rgb_split; band_onsets (kick attacks) — from shake.beat
  build-up: glow(strength=[0.1, 0.6], t=[drop − 2 bars, drop], ease='inQuad') → beat_pulse(peak=1.2) on the drop beat → base 0.25
  streak_glow(threshold=0.9, length=0.1·W, thickness=0.002·S, tint='#7fb2ff', strength=0.4) — new: anisotropic Gaussian σx = length, σy = thickness
  contour_glow(mask=mask('mediapipe_person', feather=0.002), width=0.005·S, radius=0.03·S, color='#8a5cff', strength=0.8) — new, hybrid:
    mask edge = dilate − erode → glow(key=edge) → add over the frame
  fade to white: glow(strength=[0.3, 3.0], threshold=[0.72, 0.3], t=[t1 − 2.0, t1], blend='add') + fade(to='white', t=t1 − 0.3, dur=0.3)
  Currently in ed_edl.py — fx 'bloom' (thr, r, strength): a single radius, addition in gamma; extend to multi-radius, screen, the value key and tint.
  Order: after the grade, before light leaks, film texture and text.
gen_hint: night city scene with glowing neon signs, strong soft bloom around every light source, dreamy glow on highlights, deep blacks, cinematic, <subject> in the foreground
commands: ["soft glow over the whole intro", "neon bloom on the night shots #4–#9", "make the glow pulse on every kick in the drop", "the subject's outline glows violet on the drop", "horizontal streaks from the streetlights, like an anamorphic lens", "at the end, fade to white through the glow"]
related: [light.halation, light.haze, focus.bokeh, light.flash, fx.light_leak, trans.flash, trans.fade, look.dreamcore, look.psychedelic, fx.night_vision, fx.rgb_split, shake.beat, sfx.riser]
