id: fx.thermal
family: fx
group: effect
level: B
aliases: [thermal, thermal imager, thermal camera, thermal vision, heat vision, infrared thermal imaging]
what: the frame in a thermal imager's palette — cold is black-violet, warm is orange, people and skin glow yellow-white; a soft "sensor" image, a feeling of surveillance or animal vision
frames: |
  1. Palette — one continuous "cold → hot" scale: black #010104 → indigo #10052e, #300657 →
     violet #520969 → purple #8d1f65 → crimson #af2e57 → red-orange #d04442, #e85e29 →
     orange #f67e10, #fa9f0d → yellow #f9bd27, #f3d94d → pale yellow #f3f27f. No green, no
     light blue: in 97 % of pixels the red channel is not below green.
  2. Distribution: ~21 % of the frame — almost black cold areas (L<8: walls, sky, glass, openings);
     median L ≈ 100; skin, faces, hands — the top of the scale (L 200–245), clothing — orange-red, the background — violet.
  3. The image is soft: no more detail than a sensor 160–200 px wide (downscaling to 128–160 px
     and back changes the frame by only 2–5 %); around warm bodies — a halo gradient, blurry outlines.
  4. Shooting: handheld camera, wide angle, lots of motion (roll up to ±17° in 0.75 s, jerks); cuts of
     0.15–1 s in dynamic places, shots of 2–3.5 s in calm ones.
  5. A hot spot covering the whole frame (a lamp, fire, a palm in front of the lens) gives a heat flash: 3 frames
     @20 fps (150 ms, 4 frames @25 fps) of almost solid yellow, L 148–172 — a natural transition between shots.
variants:
  - up-close party: a crowd, handheld camera close to faces, frequent cuts — yellow silhouettes on violet
  - calm shot: static or a slow drift of 1–3.5 s — a portrait in a car, a shoulder and hair in the foreground
  - surveillance camera: a white monospaced timecode at the bottom left, horizontal scan lines, a ragged band of different brightness in the lower third, auto gain "breathes" — mean brightness jumps 90 → 55 → 93 → 28 over 2.85 s
  - device screen: small icons in a corner and a grid icon — the frame reads as a thermal imager's interface
  - heat flash transition: 3–4 frames of solid yellow between two shots
status: hybrid
fallback: without a mask — in code by luminance (bright = hot), but then the sky, windows and lamps "burn" — suppress them manually or with a sky mask; a real thermal imager — search the source footage, generation with consent
params:
  palette: "13 stops (position → color): 0 #010104, 0.1 #10052e, 0.2 #300657, 0.3 #520969, 0.4 #8d1f65, 0.5 #af2e57, 0.6 #d04442, 0.68 #e85e29, 0.76 #f67e10, 0.83 #fa9f0d, 0.9 #f9bd27, 0.95 #f3d94d, 1.0 #f3f27f"
  heat: 0.55 × people mask (feather 3–5 % of the frame) + 0.25 × skin/face + 0.2 × blurred luminance; sky and windows — toward zero
  sensor: downscale to 160–240 px wide, scale back up bicubically + gaussian 1–2 px; noise 0.01–0.02
  black_share: 15–25 % of the frame in the coldest color
  auto_gain: p2–p98 stretch on every frame, smoothing 0.2–0.5 s; for "surveillance" — no smoothing, jumps of ±30–60 L
  flash: "3–4 frames (0.12–0.16 s) of color #f9d94d"
  camera: handheld, roll up to ±15°, jerks of 1–4°/frame
  cuts: 0.15–1 s (4–25 frames @25 fps) in dynamic parts; 2–3.5 s (50–88 frames) in calm places
  cctv: scan lines every 2 px (strength 0.1–0.2), a ragged band 15–35 % of the height 1–2 times per second, a white monospaced timecode 4–5 % of the frame height
when: a "hunter's gaze", surveillance, a night foray, an underground party in a music video, a "you are being watched" teaser; an explainer about heat (leaks, overheating, the body after a workout). An insert of 1–3 s or a whole verse; one thermal episode per video; the heat flash — on a downbeat
avoid: daytime landscapes without people — no hot spots, the frame turns into mush; long static shots over 5 s; small text on top — it drowns in the palette; placing it next to other color effects in one episode
sfx: a low hum of the device and quiet electronic scanner "beeps"; on the heat flash — a whoosh or impact; in the surveillance variant — short interference (glitch) on image jerks
genres: {phonk: allowed, viral: allowed, teaser: allowed, fanedit: allowed, drama: allowed, clips: allowed, explainer: allowed, fashion: allowed, sport: allowed, calm: forbidden}
detect: |
  Color: ≥95 % of pixels with R ≥ G (no green or light blue); the pixels lie on a single curve —
  at L 20–120 blue is above green (violet, purple), above L 120 — R > G > B (orange → yellow);
  ~15–25 % of the frame almost black; the brightest areas are people and skin.
  Low sharpness: downscaling to 160 px wide and back gives an error of ≤5 % of the brightness range.
  ed_motion: no motion markers of its own, usually a handheld camera with rolls; heat flash = 3–4 flash frames in a row with L>145 at a cut.
  Difference from fx.night_vision: there, green monochrome, grain and a round vignette.
  Difference from fx.xray: there, a cold blue, a black background and bones.
  Difference from rainbow "false color": a thermal imager's scale is monotonic (no green or blue tones at the top), details are blurred.
engine: |
  mask(method='mediapipe_person', feather=0.04) + mask(method='face')
  + heat_map(person=0.55, skin=0.25, luma_blur=0.2, sky_cold=True)
  + lowres(width=192, up='bicubic') + blur(kind='gaussian', amount=1.5)
  + auto_gain(percentiles=[2, 98], smooth=0.3)
  + gradient_map(source='heat', stops=[[0,'#010104'],[0.1,'#10052e'],[0.2,'#300657'],[0.3,'#520969'],[0.4,'#8d1f65'],[0.5,'#af2e57'],[0.6,'#d04442'],[0.68,'#e85e29'],[0.76,'#f67e10'],[0.83,'#fa9f0d'],[0.9,'#f9bd27'],[0.95,'#f3d94d'],[1,'#f3f27f']])
  + grain(amount=0.015) + destabilize(profile='handheld')
  Flash between shots: flash(color='#f9d94d', t=cut, dur=0.15)
  Surveillance: auto_gain(smooth=0) + scanlines(gap=2, amount=0.15) + tear_band(rate=1.5, height=[0.15, 0.35]) + text(content=timecode, style='mono_white', position='bottom_left')
gen_hint: thermal camera footage of <scene>, inferno heat palette, people glowing yellow-white against purple and black cold background, soft low-resolution sensor look, handheld wide angle, night surveillance aesthetic
