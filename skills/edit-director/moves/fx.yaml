     still — only the mouth, eyes and ears move; shots of 1.8–3.7 s, dialogue as shot/reverse shot (a cut to the other speaker).
  2. The mouth opens syllable by syllable: for a fish on a cutting board ≈2–3 openings per second, the open state holds
     4–5 frames @20 fps (0.2–0.25 s), the closed one the same; between phrases the mouth stays closed for 0.4–0.6 s.
  3. Expressions on top: a head turn, a squint, ear and brow movement on stressed syllables; for puppet animals the animation is
     mostly "on twos" — change, hold, change (≈12 positions per second).
  4. The body plays along with the voice: a plucked bird on a festive table flaps its wings ≈3.5 times per second (period ≈7
     frames @25 fps) and opens its beak; sometimes a slow push-in ×1.67 over 1.1 s on the climax of the line.
variants:
  - live animal with lip-sync: a pet "talks" in a voiceover, only the mouth is animated
  - talking food: a fish on a board or a plate, a bird on a platter — moving the mouth and fins or wings, absurd humor
  - puppet animals in human clothes: stop-motion animation, shot/reverse-shot dialogues, a warm autumn palette (saturation median 160–197 of 255)
  - inner monologue without lip-sync: the muzzle in close-up, the mouth closed, a voiceover — the cheap option
status: hybrid
