id: fx.recursion
family: fx
group: effect
level: C
aliases: [frame recursion, recursive frame, mise en abyme, in-frame recursion, frame within a frame within a frame, recursive zoom, infinite recursion, screen within a screen, infinity mirror, mirror infinity, video feedback]
what: the frame contains a smaller copy of itself where a picture would naturally sit — on a phone screen, in a photo, in a frame, in a mirror — the copy contains the next one, and so on down to a point; zooming into the copy returns to the start and makes an endless loop
frames: |
  1. Levels: inside the frame there is a "window" (a screen, a post's square, a picture frame, a doorway) in which the same frame is scaled down by r
     per side, and inside it — the same window with the next copy. Visible recursion: r ≈ 0.63–0.79 (≈0.7), 8–9 levels are visible
     until the copy gets smaller than 2 px; the edges of the nested windows add up to an "hourglass" or a tunnel converging
     to a single point (center at 0.49–0.5 of the frame). Rotation between levels — 0° in all examples.
  2. Opening: 1–2 s of static (in the example 1.8 s = 45 frames @25 fps): a finger scrolls the feed to the right frame, the camera holds,
     the viewer has time to realize that inside is the same frame.
  3. Motion — one of two:
     a) dive: a zoom-in into the recursion's vanishing point with acceleration — ×1.016 per frame @25 fps in the first 0.4 s, ×1.08 by the 1st second,
        ×1.15 by the 2nd, ×1.27 by the 3rd; over 3 s (76 frames) ×2900 — that is ≈22 levels; at the end the levels flash by at 15+ per second,
        merging into a flicker, then a cut;
     b) loop: a zoom-in into the phone screen in the subject's hands (a copy of the whole frame ≈4.5 % of the width): approach ×1.6/s for 1.2 s →
        a "plunge" into the screen ×3/s for 2 s → braking ×1.9/s for 0.4 s; after 3.64 s (91 frames @25 fps) the frame matches the first one exactly,
        there is no seam and no cut — the video loops around.
  4. Live variant — mirror infinity: mirrors facing each other or a room of mirrors; copies of the subject recede
     into the depth as a lattice, their height falls by the law s0/(1+0.9n) (0.67 → 0.35 → 0.21 → 0.17 → 0.13 of the frame height), each
     next reflection is darker and colder, thin vertical joins between the mirror panels are visible.
variants:
  - screen within a screen: a phone on a table shows a post with a photo of this same phone — 8–9 levels, then a dive into the recursion
  - loop through a screen: a top view of the subject with a phone → zoom-in into the screen → the screen shows the same top view → frame 0 again (×22 over 3.64 s)
  - mirror room: the heroine among her reflections in every direction; cut in shots of 0.3–1.5 s, camera rises of 15–30 % of the frame over 0.3–0.7 s, the finale — a close-up of the face without copies
  - endless row: a tracking move along a row of seats between mirrors ×1.75/s (×1.023 per frame @25 fps) for 4.75 s, copies of people emerge from the depth every ≈0.37 s (the move itself is dolly.infinite)
  - nested rooms: through an opening in the back wall the next room is visible with the same subject doing something else, the camera passes straight through — a new room every 2.1–2.2 s, the threshold in 0.35–0.6 s, in the last room — a crowd of copies of the subject
  - spiral (the classic graphic variant, not seen in the examples): each level is rotated by 10–30°, the recursion twists
status: hybrid
fallback: |
  The screen variant — in code on any shot with a screen, a picture frame, a painting or a doorway: track the window's 4 corners and recursively
  insert the frame into itself (like layout.screen_in_screen, except the inserted frame is this same one). No suitable window —
  a "frame within a frame" in pure code: the frame shrinks toward the center with a thin border of 1–2 % of the height and repeats down to a point.
  The loop through a screen needs a shot where the camera approaches the subject's screen (search the source footage), or generating such a shot
  with consent. Mirror infinity — only real footage (two mirrors facing each other) or generation; in code — a rough
  imitation with a tunnel of masked copies of the subject, darkened per level.
params:
  ratio: 0.63–0.79 per side per level (typically 0.7) for visible recursion; 0.04–0.06 for a loop through a handheld screen (×17–25 per period)
  levels: until the copy is smaller than 2 px — 8–9 at r ≈ 0.7; in the loop 1 level is visible on the screen, the repetition creates the infinity
  rotate: 0° per level (6 of 6 examples); spiral — 10–30° per level, optional
  center: the window center; the recursion's vanishing point [0.49–0.53, 0.42–0.5]
  hold: 1–2 s of static before the motion (typically 1.8 s = 45 frames @25 fps)
  dive: acceleration from ×1.016 to ×1.27–1.37 per frame @25 fps over 3 s (75 frames), ease inExpo; total ×100–3000, from 1 to 17 levels per second
  loop_period: 3.6 s (90 frames @25 fps) for ×22; the speed at the seam equals the speed at the start (±10 %), no cut and no motion blur
  loop_speed: approach ×1.6/s → plunge ×3/s → braking ×1.9/s; on average ×2.35/s (×1.035 per frame @25 fps)
  mirror_law: copy height s0/(1+k·n), k ≈ 0.9; each reflection ≈20–35 % darker and colder; 4–6 rings before black
  rooms: 2.1–2.2 s (53–55 frames @25 fps) per room, crossing the threshold 0.35–0.6 s (9–15 frames)
  insert: insert edge 1 px; brightness, color and sharpness are identical on all levels (otherwise the seam shows)
when: |
  A "how was this made" hook in the first 1–2 s — the viewer looks for the seam and watches to the end; a loop finale after which the video starts
  over (replays and completed views); themes of social media, the endless feed, "a video inside a video", the creator's self-irony. The dive into
  the recursion — on the riser before the drop, the drop — on the cut out of the flicker. Mirror room — fashion, themes of identity and
  multiplicity, "me among my copies". Nested rooms — "one subject living several lives at once", a self-improvement
  montage. Once per video; the loop — only at the end or as a background under text.
avoid: |
  A window smaller than 4–5 % of the width without a zoom-in — the copy is not visible, the effect is lost. A window on a handheld camera without tracking — the levels
  jitter differently. Different brightness or color between levels, a speed jump at the loop seam. Subtitles and text inside the frame —
  they repeat on every level (put them on top, after the recursion). A dive faster than 15 levels per second for longer than 0.5 s is a
  strobe: dangerous for photosensitive viewers, limit the speed or cut away. If the window shows a different
  scene, it is zoom.infinite instead.
sfx: |
  Dive — a riser or an accelerating whistle over the whole acceleration, a hit or a sub drop on the exit; loop — a steady continuous sound
  (a drone, ambience) with no accents at the seam, the sound is looped too; screen — a quiet tap at the start; mirror room — a shimmering
  reverb and "glassy" bells.
genres: {viral: allowed, ugc: allowed, fashion: allowed, teaser: allowed, fanedit: allowed, product: allowed, calm: allowed, drama: allowed, explainer: allowed}
detect: |
  Visible recursion: a window with straight edges in the frame whose content is the whole frame scaled by 0.6–0.8
  (the shrunk frame matches the window: correlation ≥ 0.7), and inside it another 2 or more such windows converging to a single point;
  the edges of the levels form rows of parallel lines, an "hourglass" or a tunnel.
  ed_motion: dive — an ease-in ZOOM-IN centered ≈[0.5, 0.5], accumulated ×100–3000 over 2–4 s, peak ×1.3+ per frame; at the end
  false "cuts" and ZOOM-OUT (the self-similar image confuses the tracking). Loop — a long near-linear ZOOM-IN or a
  two-phase one (×1.6/s → ×3/s) without cuts; after one period the frame matches the first one (correlation ≥ 0.95) at an accumulated ×17–25.
  Mirrors: many identical figures on a lattice, sizes following s0/(1+0.9n), the far ones darker; the copies move in sync with the subject.
  Nested rooms: a forward move without cuts, brightness changes in steps every 2.1–2.2 s, the same subject in the opening.
  Differences: zoom.infinite — a different scene in the window; dolly.infinite — the space repeats with parallax, not the frame;
  fx.duplicate — copies are the same size and independent; fx.kaleidoscope — angular symmetry around the center;
  layout.screen_in_screen — a different video on the screen.
engine: |
  recursion(clip, quad=track(screen)|rect, levels='auto', min_px=2, rotate=0, feather=1, time_offset=0) — new primitive:
    the frame is corner-pinned into its own window, repeated until the copy is < min_px; time_offset > 0 — the levels show
    the past (video feedback), rotate > 0 — a spiral.
  dive: recursion(...) + transform(scale=[1, 3000], center=fixpoint(quad), t=[t0, t0+3], ease='inExpo') — take the scale
    modulo 1/ratio (self-similarity gives an infinite zoom) + blur(kind='zoom') in the last 0.5 s + cut on the drop.
  loop: screen_loop(clip, quad=track(screen), period=3.6, speeds=[1.6, 3.0, 1.9]) — new primitive: a zoom-in into the screen, the
    screen shows the first frames of this same clip; the last frame equals the first, then loop.end.
  frame within a frame without a screen: recursion(clip, quad=rect(center=[0.5, 0.5], size=0.7), border=0.015).
  mirrors, simulated: mirror_tunnel(mask='mediapipe_person', rings=5, law='harmonic', k=0.9, darken=0.25, tint='cool').
  + sfx('riser', at=t0) + sfx('impact', at=t0+3)
gen_hint: a smartphone lying on a table, its screen shows a post whose photo is the very same phone on the same table, recursive picture-in-picture, nested screens shrinking into a single point, static top-down camera, soft daylight; variant - a person standing in a room made entirely of mirrors, infinite reflections receding in every direction
commands: ["make a frame recursion on #3: the phone screen shows this same frame", "a loop through the screen at the end so the video plays in a circle", "dive into the recursion on the riser before the drop", "an infinite frame within a frame on the intro"]
related: [zoom.infinite, dolly.infinite, layout.screen_in_screen, trans.screen, reflect.mirror, fx.duplicate, fx.kaleidoscope, loop.end]
evidence: {examples: 6, sources: 4, measured: "screen within a screen — 8–9 levels, r 0.63–0.79 per side by the borders of the nested screens, rotation 0° (6 of 6), 1.8 s of static, dive ×2905 over 3.04 s accelerating from ×1.016 to ×1.27–1.37 per frame @25 fps, center 0.5/0.5; loop — frame 52 matches frame 0 (correlation 1.00), ×22.4 over 3.64 s: approach ×1.63/s for 1.2 s, plunge ×3.05/s for 2 s, ×1.87/s into the seam; mirror row ×14.5 over 4.75 s (×1.0286 per frame @20 fps), center 0.53/0.42; mirror room — copies at 0.67/0.35/0.21/0.17/0.13 of the height, darkening per reflection ≈ by eye, shots 0.3–1.5 s; nested rooms — 2.1–2.2 s per room by brightness steps; 3 of 6 examples from one source", confidence: medium}
