genres: {travel: signature, viral: allowed, ugc: allowed, fanedit: allowed, sport: allowed, teaser: allowed, calm: allowed, motivation: allowed, product: allowed}
detect: |
  A compact ball in the center (±0.05) with a closed or nearly closed ground/sky boundary; vertical
  objects point radially outward (planet) or inward toward the circle of sky (hole); sky on all four sides of the frame.
  ed_motion: ROTATE at an almost constant 15–30°/s around the center (0.5, 0.5), no shift; folding — ROTATE up to 400° over 4 s + ZOOM-OUT ×0.4–0.5.
  Difference from lens.fisheye: in a fisheye the horizon is an arc and the frame edges darken; here the horizon is closed into a ring.
  Difference from fx.kaleidoscope: no mirrored sectors, the image is continuous.
  Difference from fx.omni_360: there, unwraps and orbits at the scale of the scene; here the whole ground is squeezed into a small ball.
