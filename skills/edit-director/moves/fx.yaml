id: fx.rgb_split
family: fx
group: effect
level: B
aliases: [rgb split, RGB hit, channel separation, channel splitting, channel shift, chromatic aberration, chromatic fringing, color hit, anaglyph]
what: the frame's R, G and B channels briefly slide apart and immediately come back together — outlines grow red and cyan fringes; a "digital hit" on the beat, a punch or a cut, with the frame geometry intact
frames: |
  1. Before the hit: a clean frame, channels aligned, no fringes.
  2. Attack — exactly on the beat frame (kick, snare, the downbeat entering the drop): R instantly moves px to the left, B — px
     to the right, G stays. Outlines triple: a red and yellow fringe on one side, a teal and blue one on the other. Frame brightness
     does not change (G stays in place), saturation rises slightly. With a 1080 px short side: 8 px per side (16 px between R and B) is
     a distinct hit on a face in a medium shot; 24 px or more — already three separate copies of the outline.
  3. The peak holds for 1 frame @25 fps (1–2 frames @30 fps).
  4. Decay: the channels converge exponentially over 2–6 frames (offset 100 → 50 → 25 → 10 %) or in a single step within 1 frame;
     by the next beat the frame is clean again. The whole pulse is 3–8 frames @25 fps (0.12–0.32 s), 4–10 frames @30 fps.
  5. Series: pulses on every kick or snare for 1–2 bars, the shift side may alternate (left-right), then a pause.
variants:
  - linear: R and B in opposite directions horizontally, G in place — the classic "digital hit"
  - anaglyph: red versus cyan (G and B shifted together) — two-color fringes, like a stereo picture
  - radial: channels at slightly different scales around the center — a clean center, rainbow fringes toward the edges; on a punch and a crash it grows with the zoom
  - motion-based: the channels stretch along the vector of a camera jerk, a whip transition or shake
  - temporal (RGB echo): each channel is taken from its own frame (t, t−1, t−2) — a moving subject gets a rainbow trail, the static background stays clean
  - jittery: 2–4 frames in a row with a shift in a random direction, together with shake on a hit
  - constant micro-aberration: radial, 1–3 px in the corners for the whole episode — a "lens character" rather than a hit
status: code
fallback: no special footage is needed — it is done in code on any video; on a low-resolution or heavily compressed source the split accentuates the compression blocks — halve px, soften the shifted channels (soften 1 px) or use the radial variant
params:
  px: "the offset of each outer channel from G in px for a 1080 short side of the frame (same for 9:16 and 16:9, for other sizes — proportional to the short side): micro 2–4, regular 6–12 (typically 8), heavy 14–24, extreme 30–48 — only for 1–2 frames; distance between R and B = 2·px"
  close_up_cap: a face wider than 40 % of the frame — no more than 10 px; eyes and lips during a line — no more than 4 px
  angle: 0° (horizontal, typical); 90° — vertical; 15–35° — diagonal; motion-based variant — the angle of the jerk vector; the sign can alternate from beat to beat (left, right)
  channels: "linear — R −px, G 0, B +px; anaglyph — R −px/2, G and B +px/2"
  envelope: attack 0 frames (the offset appears right on the beat frame), peak 1 frame @25 fps (1–2 @30 fps), exponential decay τ = 1.5–3 frames — to < 1 px within 2–6 frames @25 fps (3–8 @30 fps); stepped decay — 100 / 50 / 25 % per frame
  radial: k = 0.2–2 % (R scale 1+k, B 1−k around the frame center or the zoom center) — in the corners of a 9:16 frame that is 2–22 px; the constant "lens" variant k = 0.1–0.3 %
  motion: px = 0.5 px for every 1 % of the frame of displacement per frame, capped at 24 px; angle — the direction of motion
  temporal: channel delay d = 1–2 frames (R from t, G from t−d, B from t−2d), a segment of 0.3–1.5 s, only with motion in the frame of at least 1 % of the frame per frame
  jitter: 2–4 frames, a random angle and px × 0.5–1 on each frame
  soften: blur of the shifted channels σ 0–1.5 px (0 — hard digital, 1 — softer, "optical")
  mix: 0.7–1.0 — the share of the shifted channel (lower — semi-transparent fringes)
  energy: px = px_min + (px_max − px_min) × the hit's onset strength (normalized over the track), clipped to the limits above
  edges: frame edges — by reflection, without wraparound or empty strips; at px > 16 — overscan ×(1 + 2·px/W)
  order: grade → glow → light leaks → rgb_split → film texture → text, subtitles and plates (film dust and scratches must not get color fringes)
  limits: "no more than 1 pulse per beat; a series no longer than 2 bars (8 beats), then a pause of at least 1 bar; phonk and fan edit — up to 12 pulses per 10 s, other genres — up to 4; heavy (from 14 px) — no more than once per 2 bars (4 s at 120 BPM); extreme — once per part of the video"
when: |
  Hits in the track: kick or snare in the drop (pick one layer, not both at once); the downbeat entering the drop — the heaviest pulse;
  paired with zoom.punch and shake.beat on the same frame — a "combo hit". Hook — 1–2 pulses on the first downbeats to catch
  the eye. Build — micro-pulses on the snare or px growing 0 → 12 over the last bar together with a riser, a heavy one on the drop beat.
  Fast cutting — a pulse on the first frame of the incoming shot. Whip and crash — the motion-based or radial variant at peak speed.
  "Bass reaction" in phonk — px follows the 30–150 Hz bass envelope in 1/8 steps. Temporal variant — dance and sharp gestures on a
  sustained note. Outro — one final hit on the last downbeat, or no split. Limits — in params.limits.
avoid: |
  Subtitles, text, prices, logos — the split goes only below the text layer; a face during an important line (eyes and lips triple);
  a product, a packshot and a brand color — the fringes spoil the color; a calm, luxury or trust-building tone; low resolution and heavy
  compression (the fringes highlight the blocks); small high-contrast patterns — stripes, grids, fabric (rainbow moiré); a constant heavy split
  longer than 0.5 s (tires the eyes, looks like a broken stereo picture); pulses off the beats; the same strength on every hit
  without pauses; over tape-style blurred color (glitch.vhs, look.vhs) — double separation.
sfx: usually not needed — the pulse sits on the track's kick or snare; outside the drums and in silence — a short digital click or "zap" of 30–80 ms (sfx.glitch, align='attack', −10…−6 dB relative to the music); a heavy split entering the drop — together with sfx.impact; the temporal variant — no sound
genres: {phonk: signature, fanedit: signature, viral: allowed, drama: allowed, sport: allowed, travel: allowed, fashion: allowed, teaser: allowed, clips: allowed, ugc: allowed, motivation: allowed, calm: forbidden, explainer: forbidden, epic: forbidden, product: forbidden}
detect: |
  Custom code per frame: phase correlation of the gradient magnitudes of the R and B channels (phaseCorrelate with a Hanning window) gives the separation
  vector; at rest |d| < 1 px, on a pulse 4–96 px @1080 (= 2·px), the maximum on the beat frame, decaying to < 1 px within 2–8 frames;
  for linear |dx| > 3·|dy|; G lies midway between R and B (for anaglyph, R versus G+B). Frame brightness does not change (|ΔL| < 1
  level), saturation ×1.02–1.2, sharpness (Laplacian variance) ×0.7–0.8 with a hard integer shift and ×0.3–0.6 with a
  subpixel or softened one.
  Radial: ECC (affine) R → B gives a scale of 1 − 2k (0.96–0.996) centered near the frame center; the fringe is 0 in the center and grows toward the corners.
  Temporal: separation only in moving areas — the |R − B| map correlates with the frame-difference map (> 0.6), the background is aligned.
  ed_motion: the split itself produces no events (no ZOOM or SHIFT, no flash frames or strobe flips, no cuts); it often coincides with
  ZOOM-IN ×1.1–1.35 over 1–3 frames (a punch), a shake jitter peak or a cut — the sign of a combo hit.
  Differences: fx.glitch — breaks the geometry (shifted slices, blocks, row smear, negative), RGB fringes there are only part of the burst;
  glitch.vhs and look.vhs — the color is blurred and shifted constantly, only to the right, by 0.3–1 % of the width, the image is soft; glitch.tv_noise —
  color fringes together with scanlines and a line wave; light.halation — only a red halo around bright sources, without a cyan
  partner; fx.refraction (prism) — semi-transparent copies of part of the frame offset by 10–30 % of the width with a rainbow along the mask edge;
  look.psychedelic — the radial aberration is constant, as part of the look; light.flash and trans.flash — brightness spikes, here it does not.
engine: |
  rgb_split(px=8, angle=0, mode='linear'|'anaglyph'|'radial'|'motion'|'temporal', t=[b, b+D],
            env={attack: 0, hold: 1, decay: 'exp', tau: 2}, mix=1.0, soften=0, edge='reflect', overscan=1.0)
    linear — R: warpAffine with an offset of −px·(cos a, sin a), B: +px·(cos a, sin a), G in place; subpixel (INTER_LINEAR,
             BORDER_REFLECT101), not a circular array shift — wrapping the edge brings in a foreign strip from the other side of the frame;
    anaglyph — R: −px/2, G and B: +px/2;
    radial = chroma_ab(amount=k, radial=True, center=[cx, cy]) — R scale 1+k, B 1−k around the center (or the zoom center);
    motion — angle and px from the speed of transform / whip / shake on this frame;
    temporal = channel_delay(frames=[0, d, 2d]) — new: channels from frames t, t−d, t−2d.
  beat_pulse(param='rgb_split.px', events='downbeat'|'snare'|band_onsets(track, lo=30, hi=150)|[t, ...], base=0, peak=[6, 24],
             by='onset_strength', attack=0, hold=1, tau=2, alternate_sign=True, max_per_s=2, burst_max_beats=8, rest_beats=4)
    — a new pulse generator on top of beat_sync (glow.strength is modulated the same way); band_onsets — kick attacks from shake.beat.
  Bass reaction: rgb_split(px=4 + 16·band_envelope(track, lo=30, hi=150, attack=0.005, release=0.12), t=[t0, t1]) with
    quantization to 1/8 (band_envelope is a primitive from shake.beat).
  Combo hit on beat b: beat_punch(times=[b], scale=1.15, mode='hold') (zoom.punch) + rgb_split(px=12, t=[b, b+0.2])
    + beat_shake(times=[b], profile='impact', amp=0.015) (shake.beat) + sfx('impact', at=b) — one attack on the beat frame for all three.
  Rise to the drop: rgb_split(mode='radial', k=[0, 0.01], t=[drop − 1 bar, drop], ease='inQuad') → on the drop beat px=20, tau=3.
  ed_render.py currently has rgb_at(times, px=10, frames=3) — a linear decay with no peak; switch it to the env above and scale px · min(W, H)/1080.
