id: fx.kaleidoscope
family: fx
group: effect
level: B
aliases: [kaleidoscope, mandala, mirror tiles, mirror tiling, mirror symmetry, symmetrical pattern, radial symmetry, mirror fx]
what: the frame folds into a symmetrical pattern — sectors with mirrored copies around the center, mirror tiles or a "tunnel"; the pattern slowly rotates and breathes with zoom, turning any footage into a mandala
frames: |
  1. Entry: a normal frame or straight into the pattern; on a transition the pattern "unfolds" from the center in 0.3–0.6 s.
  2. Pattern: 3–8 sectors around the frame center (symmetry confirmed by angular autocorrelation of 0.6–0.9 at 360/N)
     or 2–4 mirror tiles across the width (left/right match at 0.77–0.9).
  3. Motion: the pattern rotates at 10–135° per second and at the same time slowly zooms in or out
     (×0.63–1.9 over 1.7–2.1 s) — the center is fixed, the image "flows" into the middle or spreads to the edges.
  4. Inside the sectors the original motion continues (dance, a drive-by, waves), so the pattern lives rather than stands still.
  5. Exit: a cut on the beat or a reverse "folding" back into the normal frame.
variants:
  - radial copies: a person shot from above, 4–5 rotated copies around the center, the pattern spins at ≈135°/s with a zoom-out ×0.63 over 1.75 s
  - triangular mirror tunnel: a central triangle and its mirrored neighbors (shot through three mirrors or simulated), a hexagonal lattice
  - mirror tiles: a drone landscape or silhouettes, 2–4 mirrored strips across the width and 2–3 down the height
  - tunnel: the image is wrapped into a tube around the center, the sky is a circle in the middle, a slight zoom-out
  - spiral: small repeats (eyes, faces, flowers) spiral into the center, 8 sectors, rotation ≈10°/s + zoom-in ×1.1 over 0.35 s
  - mandala cutting: a new pattern with 3-fold symmetry every 2 frames and a zoom pulse ×1.05 — for a fast beat
status: code
fallback: a real optical kaleidoscope (a three-mirror prism in front of the lens) is simulated in code in triangle mode; if the optical sheen and vignette specifically are needed — look for such shots in the source footage or generate them (with consent)
params:
  segments: 3–8 (triangle — 3, radial copies — 4–5, hexagon — 6, spiral — 8); typically 6
  mode: radial (sectors with a mirror) | triangle (mirror tunnel) | tile (mirror tiles nx×ny 2–4×2–3) | tunnel (polar wrap)
  rotate: 10–135° per second, constant speed; typically 30–60°/s
  zoom: ×0.6–1.9 over 1.5–2.5 s (slow "breathing") or a ×1.05 pulse over 0.14 s on the beat
  center: frame center [0.5, 0.5]; the source point inside the original frame can be moved along the object so the pattern changes
  duration: 1.5–5 s per shot; mandala cutting — 2–3 frames per pattern
  source: a shot with continuous motion (dance, water, lights, a drone pass); a static frame without motion gives a dead pattern
when: a "trip", a dream, meditation, magic; intro and title sequence; a long sustained part of the track or an ambient bridge; fashion and beauty shots on a plain background; top-down and drone footage; no longer than 5 s in a row and no more than 1–2 times per video, otherwise the pattern gets stale
avoid: faces while delivering a line (the mirror seam cuts through the face); text and logos — they get mirrored and read backwards; explainer and news videos; chaotic shake in the source — the pattern jerks; several different kaleidoscopes in a row
sfx: a sustained pad, a shimmer or a reverberated bell; on the pattern's "unfolding" — a riser or a sweep; in mandala cutting — clicks on the beat
genres: {fashion: signature, fanedit: allowed, viral: allowed, teaser: allowed, travel: allowed, calm: allowed, drama: allowed, phonk: allowed, product: allowed, ugc: allowed, explainer: forbidden, sport: forbidden}
detect: |
