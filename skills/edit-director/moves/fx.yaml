id: fx.mosaic
family: fx
group: effect
level: B
aliases: [pixelation, mosaic, censor mosaic, pixel censorship, pixelate, blocky face blur, pixelate face, 8-bit person]
what: for censorship, anonymity or a joke, one object in live footage is covered with a mosaic of large squares — the subject seems to turn into a character from an old video game
frames: |
  1. Mosaic area: a face or head (often of everyone in the frame), a body part, a detail in the frame or
     the whole person by silhouette; the edge is blocky and hard, no feathering; the rest of the frame is untouched.
  2. Block: a square of 1.8–6.3 % of the frame height — small "censorship" on a detail 1.8 %, faces 2.6–6 %,
     a sprite person ≈3 %, a large art mosaic on the body 3.4–4.4 %. Block color — the average over the square.
  3. The grid is locked to the screen while the area follows the object: a person dances — the squares under them
     "click over", the silhouette is stepped; the mosaic holds for the whole shot (1–5 s), without appearing or disappearing.
  4. Accent: after a shot with mosaic faces — a cut to a shot where the whole frame is in large squares (≈6 % of the height);
     or mosaic together with a negative and a cold tone — an artistic rather than a censoring treatment.
  5. Comedy: a little mosaic square on a dog's "indecent" detail or on an empty spot — a joke about censorship.
variants:
  - face censorship: all faces in the frame are pixelated, the shot holds like a normal one — anonymity, a "documentary" feel
  - detail censorship: a small mosaic square on a body or an object, blocks 1.8–3 % of the height — often as a joke
  - sprite person: a dancing person made entirely of squares ≈3 % of the height on a sharp real background
  - whole frame: the entire shot in large 5–6 % squares — a hit after a shot with pixelated faces
  - art mosaic: negative, cold tone, large squares on body parts, moving with the body
  - relief tiles: the whole frame broken into squares 4–5 % of the height with pyramid facets, like glass tiles (a related filter)
status: hybrid
fallback: without a mask — a rectangular mosaic following face tracking (mediapipe face) or the whole frame in code; a person's silhouette — mediapipe_person or hf_remove_background; if the tracker loses the face — manual keyframes every 3–5 frames
params:
  block: 1.8–6.3 % of the frame height (typically 3–4 %; 1080p — 20–65 px); square pixels
  region: track(face) with a 15–25 % margin | mask(person) expanded by 1 block | a rectangle around the object | the whole frame
  grid: aligned to the screen, not to the object; no feathering
  color: the block average; optionally reduce the palette to 16–32 colors for the "sprite"
  duration: the whole shot 1–5 s; the "whole frame" hit 0.5–1.5 s (12–38 frames @25 fps)
  art: "invert + tone #9cc3d5 + block 4 % — the artistic version"
  tile_relief: block 4–5 %, pyramid facets (diagonal emboss) — the relief tile variant
when: hiding the faces of random people and police in travel and reportage (anonymity); comedic "censorship" on memes and UGC (with a bleep); a music-video accent — a sprite person in the real world over an 8-bit sound; a "whole frame in mosaic" hit on the drop or a glitch pause; as much as needed for anonymity, as a gag — 1–2 times
avoid: small blocks (<1.5 % of the height) — looks like poor quality rather than a device; mosaic with feathering and blur — that is blur censorship instead; a jittery area lagging behind the face; mosaic on the main subject for no reason — the emotion is lost
sfx: censorship — a short 1 kHz bleep on the word or moment; sprite — 8-bit sounds, chiptune; whole frame — a glitch or bitcrush on the hit
genres: {viral: allowed, ugc: allowed, fanedit: allowed, clips: allowed, travel: allowed, explainer: allowed, phonk: allowed, teaser: allowed, drama: allowed}
detect: |
  In part of the frame the image is piecewise constant on a square grid: autocorrelation of the column sums of |dx| and the row sums of |dy|
  in that area peaks at the block period (1.8–6.3 % of the frame height) and its harmonics; the grid is aligned to the screen;
  outside the area normal sharpness. The area's shape — a face, a head, a body or the whole frame; it holds for the whole shot.
  ed_motion: no signature of its own.
  Difference from fx.pixel_art: there the whole frame is stylized as pixel art with a reduced palette and a game aesthetic; here the mosaic is local or for a single hit.
  Difference from blur censorship: mosaic has squares with hard edges.
  Difference from fx.glitch: in a glitch the blocks are displaced and the colors broken; here each block is an average color in its own place.
engine: |
  mask(method='face'|'mediapipe_person'|'hf_remove_background', feather=0, grow=0.2) + pixelate(size=0.035*H, region=mask, grid='screen')
  Whole-frame hit: pixelate(size=0.06*H, t=[beat, beat+1.0])
  Sprite: pixelate(size=0.03*H, region=mask(person)) + posterize(levels=6)
  Art: color(params={invert: true, tint: '#9cc3d5'}) + pixelate(size=0.04*H, region=mask(body_parts))
  + sfx('beep', at=t_word) for censorship
gen_hint: <scene> with <the subject's face / a detail> censored by a coarse square pixel mosaic, hard-edged blocks about 4 percent of the frame height, the rest of the image sharp and normal
commands: ["pixelate the passers-by's faces on #3–#5", "funny square censorship at 0:08 with a bleep", "turn the subject into an 8-bit sprite, keep the background", "whole frame into big pixels on the drop"]
related: [fx.pixel_art, fx.glitch, mask.silhouette_window, glitch.datamosh]
