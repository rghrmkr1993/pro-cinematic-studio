id: fx.pixel_art
family: fx
group: effect
level: B
aliases: [pixel art, pixel graphics, 8-bit, 16-bit, retro game look, retro game, sprite, sprite animation, pixel animation, low-res, voxels, voxel]
what: the whole frame is drawn (or converted) in large square pixels with a reduced palette and no anti-aliasing, and motion steps at 7–17 drawings per second — the aesthetic of old video games — cozy pixel dioramas, character and mascot sprites, game scenes with a game UI
frames: |
  1. Grid: the whole frame is made of square "art" pixels of one size — 0.23–1.85 % of the frame height
     (2.5–20 px at 1080p), mostly 0.5–1.3 % (5–14 px @1080p, a canvas of 75–200 rows). Edges are stepped,
     with no anti-aliasing or blur; the grid is fixed relative to the screen, objects move in whole-pixel steps.
  2. Palette: 3–43 distinguishable colors per frame, mostly 8–17; the 8 most frequent colors cover 85–100 % of the frame
     in 17 of 27 measured examples. Extreme variants — 2 colors (dark + light) with a dot dither, 1 bit
     (black and white), 4 shades of one green. Color is flat, transitions are steps of shades, in 5 of 27 — checkerboard
     dithering (a 2×2 "checker" over 1–8 % of the area, strongest with a 1-bit and 2-color palette).
  3. Motion: characters and sprites change drawings 7–17 times per second — either the video itself runs at 7–12.5 fps,
     or at 25–33 fps frames are held for 2 (12.5 and 16.7 drawings per second), key poses — up to 8 frames;
     background scrolling, rain and lights may update every frame. A character or mascot sprite is
     a loop of 4–11 drawings (0.3–0.8 s; a deliberately choppy version — 2.5 fps, 4.4 s); a pixel diorama is
     a static scene where small things live (rain, a flickering sign, steam, streetlights), a 1.2–7 s loop.
  4. Presentation: a postcard scene or a centered sprite on a plain background, game elements — score pop-ups
     above the action, a dialogue box, a scoreboard, starting lights; if the camera moves at all, it is a smooth scroll.
  5. Pixel size change (rare): a live object bursts into a flash of multicolored cubes in 0.3 s (6 frames @20 fps)
     and reassembles into a blocky copy; a logo assembles from falling pixel drops over ≈2.6 s
     (the last 32 → 94 % of the area — in 1.2 s), holds ≈1.9 s and drips back away over a little more than 1.6 s.
variants:
  - pixel diorama loop — a cozy night street, a bar, a shop, a room in the rain; a static frame with living details, 1.2–7 s on loop (10 of 34)
  - character or mascot sprite — a product or a hero with arms and legs on a plain background, a loop of 4–11 drawings, jumps, somersaults, "breathing" (8 of 34)
  - game scene and "game-style" ad — a race, a fight, score pop-ups, a dialogue box, a scoreboard (6 of 34)
  - extreme palette — 2 colors with dither, 1 bit, 4 shades of green, 4–6 neon colors on black (5 of 34)
  - voxels — a volumetric pixel, a blocky 3D world; a live object turns blocky in 0.3 s (4 of 34)
  - pixel assembly — a logo assembles from falling pixel drops and drips back away; pixel "drips" as a title sequence (3 of 34)
status: code
fallback: converting the user's footage to pixel art — in code (downscale to the canvas, palette, dither, upscale without smoothing); a genuinely drawn pixel scene or a mascot sprite — generation with the user's consent (the style is described precisely in the prompt); a sprite hero over a real background — a person or product mask (mediapipe or hf_remove_background), the sprite itself in code with a large block
params:
  block: "0.5–1.3 % of the frame height (typically 0.8 % — 9 px @1080p, canvas ≈240×135); fine diorama 0.23–0.5 %, large sprite 1.0–1.9 %; a whole number of screen pixels per block — 6, 8, 9, 12 px @1080p"
  canvas: typical 16:9 canvases — 320×180 (6 px @1080p), 240×135 (8 px), 160×90 (12 px); 9:16 — 135×240 (8 px @1920); square — 100×100–140×140
  palette: "8–16 colors (k-means over the scene) or fixed: 4 shades of green #2a5b10 #598516 #83a80b #a8cf34; 2 colors #1c0e2f + #bbd8da (63/37 % of the area); 1 bit #010101 + #fdfdfd; neon on black #05030c #116dca #412b6a #b433cc #ead7f6; the 8 most frequent colors — 85–100 % of the area"
  dither: none (default) | checker 2×2 | bayer 4×4 at the art-pixel level; strength 0.3–0.6, only in gradients and shadows; mandatory with a 2-color and 1-bit palette
  outline: a dark outline of 1 art pixel around the sprite hero (optional)
  aa: no anti-aliasing — upscale with nearest neighbor only; before downscaling — light median filtering so there are no "dirty" stray pixels
  fps: 8–17 drawings per second (typically 12.5) — step_print(hold=2) @25 fps (12.5) or hold=3 (8.3); a key pose up to 8 frames @33 fps (0.24 s)
  loop: sprite 4–11 drawings (0.3–0.8 s at 10–25 fps); diorama 1.2–7 s; a slow "cozy" loop — 7–10 fps
  motion_snap: moves, scrolling and shake — in steps of a whole art pixel
  build: logo assembly from drops ≈2.6 s (the last 32 → 94 % of the area in 1.2 s), hold ≈1.9 s, drip-away ≥1.6 s; turning a live object blocky — 0.3 s (6 frames @20 fps)
  res_ramp: a smooth block growth 1 → 0.8 % H over 0.25–0.5 s (outCubic) as an entry into the effect or an exit from it — from editing practice, not seen in this section's examples
when: game-style intros and outros, "level loaded", a channel intro; a product as a game character — ads for food, drinks, gadgets; an explainer with a game framing (points, levels, lives); fan edits and memes — a "just like in a game" moment, a switch to an "8-bit version" of the hero on the drop; a calm lo-fi loop with a pixel diorama to music; as a whole-shot effect — one episode of 2–8 s, not the whole video unless it is stylized throughout
avoid: large faces and expressions — with a block ≥1 % H the emotion is lost; small text and subtitles over the pixelation (render text separately in a pixel font with the same block); smoothing when upscaling — you get mush, not pixel art; a non-integer block size in the output — uneven pixel widths are glaring; smooth 25 fps motion without holds on a sprite — looks like a cheap filter; drama and epic
