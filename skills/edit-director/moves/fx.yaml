id: fx.wigglegram
family: fx
group: effect
level: B
aliases: [wigglegram, wiggle stereoscopy, 3D wobble, stereo wobble, wiggle 3D, multicam shake, 4-lens wiggle]
what: time freezes while the viewpoint rocks back and forth between 2–4 neighboring angles — the subject stays in place, the background and foreground "float" around them, the volume reads without 3D glasses
frames: |
  1. Classic (5 of 8 examples): 4 angles from a single four-lens camera, a 6-frame loop
     1-2-3-4-3-2 (frame 2 = 6, 3 = 5 — identical pixel for pixel), each 70–100 ms → a 0.42–0.6 s loop.
  2. The pivot is the subject: their mean shift is ±0.7 % of the width, while whatever is nearer and farther moves apart
     in opposite directions — between neighboring angles the spread of shifts (p10…p90) is 1.2–3.8 % of the frame width,
     between the outermost ones — up to ≈10 %. The vertical almost stays put (≤0.3 %), roll ±0.5–1°, scale ±0.8 %.
  3. Film texture: grain, warm analog color, sometimes the frame edges and neighboring film frames are visible,
     the angles have slightly different exposure.
  4. Video variant: the video plays while the angle switches every 2–5 frames (80–200 ms) with a small
     shift of 0.3–1 % — a nervous stereo jitter of the live frame.
  5. Multicam variant: every frame is a different camera around the subject (a switch every 1 frame, 50 ms),
     roll jumps ±5–10°, scale ×0.86–1.16, shift spread 2–12 %; the subject's face is glued to one point in the frame.
variants:
