when: showing a product or an object from all sides, a "digital twin" of a person or a place in a teaser and an intro, an explainer about how something is built and its scale, a music video's tech aesthetic; flying into the model — a transition to real footage of the same place; 1–2 times per video
avoid: showing a model with big holes large and for long when an "expensive" look is needed; skin and faces in close-up — the scan looks creepy; a rotation that is too fast (>150°/s) — the shape does not read; a busy background behind the model
sfx: a quiet digital hum, clicks and a "scanning" sweep as the wireframe or points appear; flying into the model — a whoosh that turns into the location's atmosphere
