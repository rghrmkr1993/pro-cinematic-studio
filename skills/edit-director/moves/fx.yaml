  + transform(rotate=[0, 25*D], t=[t0, t0+D], ease='linear') + transform(scale=[1, 0.85, 1], t=[t0, t0+1.2, t0+2.4])
  Folding: polar_morph(amount=[0, 1], t=[t0, t0+2.5], ease='inOutCubic') + transform(rotate=[0, 180])
  + sfx('swell', at=t0)
