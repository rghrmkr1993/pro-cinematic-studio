id: fx.glitch
family: fx
group: effect
level: B
aliases: [glitch, digital glitch, digital malfunction, rgb split, rgb shift, slice glitch, slice shift, scanline smear, glitch stutter]
what: short bursts of a "broken" digital picture — slices slide sideways, color channels separate, rows smear, the frame inverts or sticks — and then immediately a clean image again
frames: |
  1. Setup: a clean shot of 0.3–2 s or straight to the cut point.
  2. A burst of 1–8 frames (0.05–0.4 s): the frame "breaks" — 3–10 horizontal slices 2–15 % of the frame high slide
     sideways by 2–30 % of the width, R and B separate by 0.5–2.5 % of the width, rows stretch into colored streaks
     (the ratio of vertical to horizontal gradients rises from ≈1.0 to 1.7–2.6), 8–16 px blocks, garbage colors.
  3. Within the burst the glitch state changes every 1–3 frames — no smooth animation, everything jumps.
  4. Landing: back to a clean frame within 1 frame; a pause of 0.3–2 s before the next burst; in intros and loops — a series of 3–5 bursts.
  Time glitches: a stutter — a chunk of 3–4 frames repeats 1–2 times; a jump back 7–8 frames, then playback in steps of
  2–3 frames; a single negative frame among normal ones.
  Glitch transition: over 5–6 frames (≈0.4 s) the columns of the old frame run down in vertical drips, the new scene shows through them.
variants:
  - row smear: rows stretch sideways into rainbow streaks, the figure reads only by its outline; a 0.2–0.4 s loop
  - slice shift: horizontal slices slide sideways, in places with black gaps and wrapping around the edge
  - RGB separation: cyan/magenta fringes on some of the frames, the object jitters and jumps around the frame
  - negative and false color: a 1-frame negative or a palette change of background and skin every 0.25 s on the rhythm
  - stutter: a chunk of 3–4 frames repeats or jumps back, like a scratched disc
  - glitch transition: 0.3–0.4 s of vertical drips or 3–5 frames of abstract "garbage" texture between scenes
  - strobe cutting: every frame is a different shot or a different treatment (negative, a card, a glitch), 0.5–0.6 s in a row
  - soft: one or two frames of a light RGB shift on a hit — an almost unnoticeable accent
status: code
params:
  burst: 1–8 frames (1–10 frames @25 fps, 0.04–0.4 s), typically 3–4
  state_hold: 1–3 frames per glitch state
  gap: 0.3–2 s of clean picture between bursts; no more than 3–5 bursts in a row
  slices: 3–10 slices 2–15 % of the frame high; shift ±2–30 % of the width, typically 5–10 %; wraparound at the edge
  rgb_split: 0.5–2.5 % of the width (10–45 px at 1080p) horizontally, R and B in opposite directions; only on some frames of the burst
  row_smear: 10–40 % of rows — a pixel repeated from a random point to the frame edge
  blocks: 8–32 px, shuffled or noise over 5–20 % of the area
  invert: 1 frame of negative or channel swap per burst, no more than once every 1–2 s
  stutter: a chunk of 2–4 frames repeated 1–2 times, or a jump back of 6–8 frames
  transition: 8–10 frames @25 fps (0.3–0.4 s) on the cut
  palette_jump: a false palette change every 0.25–0.5 s (1/8–1/4 notes at 120 BPM)
when: an accent on a hit or a snare, the drop, a fill and a beat repeat in the track; the theme of "system failure", the digital world, memory, hacking; a transition between scenes; intro and logo; no more than one burst per 2–4 bars in a regular video, denser — only in short series of up to 1 s
avoid: continuous glitching longer than 1 s over something important; a face while it delivers a line; text, prices, subtitles (they become unreadable); calm, luxury, trust-building videos; the same preset on every join; a burst without support in the sound
sfx: glitch clicks, digital crackle or an audio "stutter" in sync with each burst; on a stutter — a repeat of the same bit of audio; on a glitch transition — a short noise sweep
genres: {phonk: signature, fanedit: signature, viral: allowed, clips: allowed, teaser: allowed, sport: allowed, fashion: allowed, motivation: allowed, ugc: allowed, drama: allowed, calm: forbidden, epic: forbidden, product: forbidden, travel: forbidden, explainer: forbidden}
detect: |
  ed_motion: "cuts" on adjacent frames within one shot, fail and ECC fallbacks, single flash/black frames,
  strobe flips, high jitter with a static camera.
  Custom code: ratio of mean |d/dy| to |d/dx| > 1.6 on individual frames (row smear); slices shifted
  horizontally relative to the adjacent frame while the other slices stay in place; R/B edges offset by 0.5–2.5 % of the width;
  brightness correlation with the adjacent frame < −0.5 (negative); a near-exact repeat of a frame 3–8 frames back (stutter).
  Difference from glitch.datamosh: a mosh flows along the motion for 0.5–2 s and does not jump between states; a glitch is discrete bursts of 1–8 frames.
  Difference from cut.flash: what is inserted is not a white or black frame but a distorted version of the same frame.
  Difference from analog interference: there, sinusoidal line waves, snow and vertical frame roll.
engine: |
  glitch(t=[t0, t0+D], kinds=['slices', 'rgb', 'smear', 'blocks', 'invert'], intensity=0.3–1.0, hold=1–3, seed)
    slices: n=3–10, h=2–15 % H, dx=±2–30 % W with wraparound; rgb: rgb_split(px=0.5–2.5 % W, angle=0);
    smear: 10–40 % of rows — a pixel repeated from x0 to the edge; blocks: shuffling 8–32 px blocks over 5–20 % of the area
  stutter(at=t0, chunk=3, repeats=2) | stutter(mode='skip_back', back=8, step=3)
  transition(kind='glitch', dur=0.36, params={streaks: 'vertical'}) — for the glitch transition
  + sfx('glitch', at=t0, align='attack') on each burst; beat_sync(event='snare', grid='1/4')
gen_hint: digital glitch on <subject>, horizontal slices displaced sideways, RGB channel split with cyan and magenta fringes, scanlines smeared into colorful streaks, corrupted pixel blocks, brief glitch bursts between clean frames
commands: ["glitch on every snare in the chorus", "glitch transition between #2 and #3", "RGB shift and slices at 0:15 for 4 frames", "frame stutter on the beat repeat"]
related: [glitch.datamosh, glitch.vhs, glitch.tv_noise, cut.flash, cut.stutter, fx.color_shift]
evidence: {examples: 14, sources: 11, measured: "a heavy burst of 8 frames (0.4 s) after 2 clean ones; row smear: |dy|/|dx| 0.9 → 1.7–2.6; slice shift up to 22–33 % of the width, moderate — 1.6 % on a third of the slices; RGB fringes 0.6–2.4 % of the width on 3 of 12 frames; negative 1 frame (correlation −0.83); stutter — a repeat of 3 frames after 4, a jump back 8 frames in steps of 3; glitch transition 6 frames @14 fps (0.42 s); the false palette changes every 5 frames @20 fps (0.25 s); 3 examples from the section are datamosh", confidence: medium}
