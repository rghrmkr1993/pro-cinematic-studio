id: fx.scan_3d
family: fx
group: effect
level: B
aliases: [photogrammetry, 3D scan, point cloud, wireframe, wireframe mesh, digital twin, 3D model from photos]
what: an object, a person or a place is shown as a scanned 3D model — it hangs on a gray "software screen", rotates on a turntable, breaks down into a wireframe or a point cloud, and the camera flies inside the model
frames: |
  1. Model view: the scan on a flat neutral viewport background — gray RGB 92–141 (#5c5c5c…#8d8b8a), background
     41–82 % of the frame; under the object — an oval "pancake" of scanned ground with a ragged edge; at the edge of
     coverage — holes, torn-off fragments and sparse points (the top of a trunk, the crown of a head).
  2. Model motion: a full turntable rotation in 2.4 s (≈150°/s) in a looped piece; or
     a ±15–20° back-and-forth sway with a period of 2.1 s; or a slow rotation of a top view at 13°/s.
  3. Wireframe: a white triangle mesh on black (background RGB 4, 49 % of the frame), a gentle push-in ×2.07 over 3.5 s,
     at the end a fade to black within 3 frames.
  4. Point cloud: red points on dark red — a pull-out ×0.12 over 2.5 s with a −117° roll, a fast
     start and braking (ease-out): from dense "dust" to a figure on a huge surface; or a night
     street of sparse white points — a fly-through ×5.3 over 0.64 s.
  5. Flying into the model: an exterior view → push-in ×2.06 over 0.84 s → a cut to a photorealistic interior of the same place.
variants:
  - turntable: a tree, a statue, a scanned person on a gray background, a full rotation or a sway
  - building model from above: a dome or a house rotates and the camera dives inside
  - wireframe mesh: white triangles on black, a slow push-in, a fade to black
  - point cloud: colored points on dark, a big pull-out with a roll or a rapid fly-through down a street
  - textured fly-through: a reconstructed scene with blurred near objects and ragged edges (turns into fx.volumetric_flythrough)
status: generation
fallback: an object — generating a 3D model from photos (Higgsfield generate_3d → GLB) and rendering the rotation/wireframe/points in Blender; the user's scans (a phone 3D scan) — footage; simulation in code from a single frame — depth map → point cloud or wireframe (triangulation along edges) with a small orbit of ±10–15°
params:
  viewport_bg: "#5c5c5c–#8d8b8a gray, no gradient; or #000000 for wireframe and points"
  ground_disc: an oval 1.2–1.6 times the object's width, ragged edge
  turntable: 4–12 s per rotation (30–90°/s) in a video; in a short loop down to 2.4 s (150°/s); sway ±15–20°, period 2–3 s
  wireframe: 1 px lines, white at 60–90 % opacity, triangles 1–3 % of the frame width
  points: "points 1–2 px, density 5–20 thousand per frame, a single color (#ff1a1a, #ffffff) or the texture color"
