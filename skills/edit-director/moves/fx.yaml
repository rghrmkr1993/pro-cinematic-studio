id: fx.xray
family: fx
group: effect
level: B
aliases: [x-ray, x-ray effect, x-ray look, skeleton through the body, x-ray vision, see-through]
what: the frame becomes an x-ray image — a black background, a translucent cold-blue body through which the bones and skull glow; an eerie or "inner" look at the subject
frames: |
  1. Background — solid black: 41–88 % of pixels darker than L 20 of 255, median frame brightness 1–28.
  2. The figure is translucent, steel-blue: hue 196–212°, the blue channel higher than red by 22–35
     units, moderate saturation (median 14–38 %). The densest parts are brightest: skull, teeth, ribs,
     spine, hand bones, the body outline; highlights cold white ≈ RGB (135–150, 150–160, 170–180),
     peaks L 170–230.
  3. Clothing — dark transparent layers of a teal shade, the folds visible right through. What stays warm is
     hair, lips, fire, small metal — 1–25 % of the figure's pixels with R > B: the only
     "live" color in the frame.
  4. Presentation — long shots of 2–7.6 s; the camera either stays still or floats: a slow push-in ×2–2.65 over
     4.75–5.2 s with a 30–53° roll. Entry from black over 6–8 frames, exit to black over ~0.75 s.
variants:
  - static portrait shot: a skull inside the head, 3.5 s without camera movement, only the subject moves
  - floating examination: a slow push-in ×2–2.65 over ~5 s with a roll of up to 50°, the frame "scans" the body — ribs, belly, two people's skulls pressed together
  - gesture to the camera: a hand or an object pointed at the viewer, the hand bones show through, metal and fire — a warm accent
  - lite version without anatomy: an object on an almost entirely black background (88 % of the frame), only the edges and the brightest parts glow — negative neon
  - x-ray depth: a foreground figure as a frame, behind it — distant figures in the same style
  - scanner window (not seen in the examples, a typical short-video device): the x-ray is visible only inside a rectangle that travels across the subject
status: hybrid
fallback: without a mask — simplified, in code over the whole frame (negative + a cold gradient map + clipping the shadows to black), works only on a dark background; real bones — overlaying a stylized skeleton by pose (mediapipe pose) or video-to-video generation with the user's consent
params:
  background: black, L ≤ 10; a person or object mask, feather 2–4 px
  invert: luminance negative inside the mask (Y' = 1 − Y), gamma 0.8–1.2
  gradient_map: "0 → #000000, 0.3 → #142834, 0.6 → #5f7080, 0.85 → #96a5b4, 1.0 → #e1eef8 (hue 200–212°, B−R +25…+35 in the midtones)"
  saturation: 15–35 % (typically 25 %)
  edge_glow: high frequencies ×1.5–2 + glow(threshold 0.6, radius 1–2 % of the frame height)
  opacity: body 60–80 %, layers blended with screen — overlaps are brighter
  warm_keep: hair and lips from segmentation — the original tone with saturation ×0.6
  bones: skeleton from the pose — white bones, blur 2–4 px, opacity 0.5–0.7; skull from the face mesh
  camera: static or a push-in ×1.5–2.5 over 4–6 s + roll 20–50°, ease linear
  shot: 2–7 s (50–175 frames @25 fps); entry/exit through black 0.25–0.75 s (6–19 frames)
  scan_window: a window 20–35 % of the frame width, travels across in 1–2 s
when: a teaser and an intro with a mystery; "looking inside" a subject or an object (fear, illness, love "to the bone"); a reality → another world transition; an explainer about how something works; in a music video — a whole verse in x-ray. No more than one x-ray episode per video; the scanner window — a one-off viral accent on the drop
avoid: a light or busy background without a mask (after the negative it turns white); a small figure in a wide shot — the bones do not read; frequent short 0.5 s inserts — the eye does not have time to realize it is an x-ray; calm, warm, family videos
sfx: a low hum or drone under the whole episode; on the appearance — a reverse_whoosh or sub_drop; for the scanner window — an electric hum and a click at the start and end of its pass
genres: {teaser: allowed, fanedit: allowed, phonk: allowed, drama: allowed, viral: allowed, explainer: allowed, product: allowed, fashion: allowed, sport: allowed, calm: forbidden}
detect: |
  Color: share of pixels with L<20 ≥ 0.4; figure pixels (L>40) have hue 195–215°, B−R ≥ +20, saturation
  14–38 %; highlights cold white with B > G > R; inside the silhouette — thin white structures (ribs, teeth,
  finger bones), only hair/lips/fire stay warm (≤25 % of the figure).
  ed_motion: no signature of its own — static or a slow push-in ≤×1.012/frame with roll; at the episode's edges — a fade from/to black.
  Difference from fx.night_vision: there, green monochrome, noise and a vignette, the background is not black.
  Difference from fx.thermal: there, a "heat" palette (violet → yellow/white), no bones visible.
  Difference from a plain negative: a negative has a light background, no black around the figure and no skeleton.
engine: |
  mask(method='mediapipe_person'|'hf_remove_background', feather=3)
  + gradient_map(source='inv_luma', stops=[[0,'#000000'],[0.3,'#142834'],[0.6,'#5f7080'],[0.85,'#96a5b4'],[1,'#e1eef8']], layer='subject')
  + composite(layers=[solid('#000000'), subject_xray(opacity=0.75), hair_keep(sat=0.6)], blend='screen')
  + glow(threshold=0.6, radius=0.015) + grain(amount=0.03)
  + xray_skeleton(pose=track(person), skull=track(face), opacity=0.6, blur=3)  # optional
  + transform(scale=[1, 2], rotate=[0, 30], t=[t0, t0+5], ease='linear')  # floating examination
  + fade(to='black', t=t_in, dur=0.3) / fade(to='black', t=t_out, dur=0.75)
  Scanner window: composite(layers=[orig, xray], mask=window_reveal(rect=[0.3, 1.0], path=[[-0.3,0],[1.3,0]], t=[t0, t0+1.5]))
