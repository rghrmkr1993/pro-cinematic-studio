id: fx.night_vision
family: fx
group: effect
level: B
aliases: [night vision, night vision goggles, night vision device, camera night mode, infrared footage, IR camcorder, green night vision]
what: the frame as seen through a night vision device — green monochrome with grain, dark edges or a round eyepiece, glowing eyes and bloomed lights; the aesthetic of surveillance, hunting, found footage
frames: |
  1. Color — a single shade of green over the whole picture. Military "phosphor": hue 114–152°, saturation
     67–95 %, the green channel 2.5–5.5 times higher than red. A consumer camera's night mode:
     pale teal-green, hue 150–166°, saturation 33–45 %, G/R 1.6–1.7, G/B ≈1.16.
     Highlights almost white with a green cast ≈ RGB (150–195, 218–246, 150–223).
  2. Dark tonality: median L 8–60 (with IR illumination on a face — up to 87); the edges 1.6–5 times darker than the center —
     a strong vignette or an illumination spot in the middle; with an eyepiece — a round field ≈0.88 of the frame wide,
     black outside.
  3. The grain is coarse and alive, details are soft; bright sources (lights, an engine, a flashlight) bloom
     into halos and rays; the eyes of people and animals glow from the reflected IR illumination.
  4. Device interface: a "+" crosshair in the center (5–7 % of the frame height), a battery icon in a corner;
     two examples run at 10–12.5 fps — the jerky motion of a cheap camera.
  5. In music videos — a 1–2-frame whiteout as a cut, sharp camera zoom jerks ×1.2–2.7 over
     2–6 frames, recoloring between cuts (B&W → blue → green), blown-out teeth and jewelry.
variants:
  - military eyepiece: saturated phosphor green, a round field with black around it, star-shaped halos from lights in the sky
  - trail camera: very dark green (median L 9, 64 % of the frame almost black), heavy noise, a static camera, an animal in the grass
  - consumer camera night mode: pale teal, an IR illumination spot in the center, glowing eyes, a crosshair and a battery icon, ragged zooms
  - music-video mix: the same camcorder, but with B&W and blue variants between cuts, whiteouts on transitions
  - outside view: a person wearing a night vision device, filmed with the same device — a glowing eyepiece on the face, 10 fps
status: code
fallback: glowing eyes — hybrid (eye points from the face mesh + glow); real night footage — look for dark shots in the source footage, the effect looks most honest on them
params:
  palette_mil: "0 #000000, 0.25 #0b3d10, 0.5 #1f7a22, 0.75 #4fbf4a, 1.0 #d8ffd0"
  palette_cam: "0 #000000, 0.3 #1c3a33, 0.65 #6fa596, 1.0 #e6fff4"
  saturation: military 65–95 %, camcorder 30–45 %
