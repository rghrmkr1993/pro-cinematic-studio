id: fx.refraction
family: fx
group: effect
level: B
aliases: [distortion, refraction, prism, prism fx, ribbed glass, fluted glass, reeded glass, heat haze, heat shimmer, mirage, warp, edge smear, blurred edges, glass in front of the lens]
what: the picture "through glass" — a prism multiplies parts of the frame and splits them into a rainbow, fluted glass slices it into vertical strips, heat haze ripples the bottom of the frame, soft edges stretch into a smear; the story stays readable in the center
frames: |
  Prism (the most common kind): over the frame, 1–3 semi-transparent copies of the same image offset by ≈10–30 % of the width,
  with a soft wedge-shaped border; at the copies' edges — rainbow fringes 1–2 % of the width. When the camera moves, the copies drift at a different
  speed, and on a jerk they turn into arcs of motion blur; the center of the frame with the subject is clean, the edges are distorted.
  Fluted glass: 40–45 vertical strips across the frame width (period 2.4 % of the width), each strip is its own shifted and squeezed
  piece of the picture; only the silhouette and color patches are recognizable.
  Heat haze: the bottom half of the frame ripples — a local shift of 0.2–0.5 % of the height per frame versus 0.05–0.1 % at the top, near the ground
  a "water" reflection, contrast and saturation reduced.
  Soft edges: sharpness at the edges 0.1–0.35 of the center's, the edges stretch into a radial smear with colored fringing.
variants:
  - prism on a portrait or a dance: ghost copies and a rainbow at the edges, 1–4 s
  - prism transition: on a camera jerk the copies merge into arcs of motion blur and lead into the next shot
  - fluted glass: a silhouette behind vertical strips — intro, a mystery, "a person behind glass"
  - heat haze: a shimmering horizon and cars in a mirage over a road
  - soft edges: a sharp center, the periphery swims — a dream, a memory, intoxication
status: code
fallback: glass strips, heat haze and soft edges are simulated in code; a rich prism with live glints is better shot for real (a prism or glass in front of the lens), found in the source footage as shots through glass or water, or generated (with consent)
params:
  prism_copies: 1–3 copies, offset ≈10–30 % of the width, transparency 30–60 %, blend "lighten" or "screen"
  prism_mask: a wedge or an arc, feather 10–20 % of the width; the frame center (≈40 %) without copies
  prism_fringe: a rainbow fringe 1–2 % of the width along the mask edge (R and B shifted in opposite directions)
  prism_drift: copies drift by ≈2–10 % of the width per second in counter-phase to the camera movement
  fluted: period 2–2.5 % of the width (≈40–50 strips), shift within a strip up to ±1 period, a light blur of 0.2 % of the width
  haze: displacement by a noise map 0.2–0.5 % of the height, blob scale 1–3 % of the height, rising 1–3 % of the height per second; 3–5 times stronger at the bottom than at the top
  edge_smear: radial smear beyond a radius of 0.4–0.5 from the center, edge sharpness 0.1–0.35 of the center's, chromatic fringe 0.5–1.5 % of the width
  duration: 1–4 s per shot; for the whole video — only soft edges or heat haze
when: fashion and beauty shots, a music video, a dream and a memory, a "trip", a mysterious intro, heat and desert (heat haze); prism — on the chorus and sustained notes, prism transition — on a camera jerk in time with the beat; no more than 2–3 shots with a prism in a row
avoid: important text, a detailed product, a face during a line under a heavy prism; explainer videos; heat haze on shots without a horizon or ground (looks like a compression defect); fluted glass for longer than 3 s without a reveal
sfx: prism — a shimmer, a soft sweep or a reverse cymbal as the copies appear; fluted glass — a muffled "behind the glass" sound (high-frequency cut); heat haze — the hum and ringing of heat
genres: {fashion: signature, fanedit: allowed, teaser: allowed, drama: allowed, travel: allowed, calm: allowed, product: allowed, viral: allowed, motivation: allowed, epic: allowed}
detect: |
  ed_motion: the camera is almost still, but nonrigid 0.3–0.5 and conf low; on a prism — false zooms and rotations on jerks; on heat haze — no
  events while the bottom half is "alive".
  Custom code: a spectral peak in the horizontal brightness profile with a period of 2–2.5 % of the width (25–30 times above the median) — fluted glass;
  an edge-to-center sharpness ratio of 0.1–0.35 with a sharp center — soft edges; local optical flow 3–5 times stronger at the bottom
  than at the top, with no global motion — heat haze; semi-transparent repeats of contours offset by 10–30 % and rainbow fringes — prism.
  Difference from fx.kaleidoscope: a kaleidoscope is strictly symmetrical around the center; a prism gives asymmetric partial copies.
  Difference from double exposure: there, two different shots are blended; here, copies of one and the same frame.
  Difference from fx.duplicate: clones are opaque separate copies of the subject in different places in the frame.
