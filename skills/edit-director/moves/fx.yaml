id: fx.light_leak
family: fx
group: effect
level: B
aliases: [light leak, film light leak, warm light leak, edge leak, light patch, leak transition, light leak transition, flare wash, burst leak]
what: warm patches of light drift in from the frame edge and slowly float over the picture, independent of its content — a soft "filmic" glow over an episode or a transition where the cut hides inside a flared-up patch
frames: |
  Ambient (an episode glow):
  1. A glow emerges at the edge or corner of the frame — at first a narrow strip of 5–15 % of the width.
  2. Over 0.6–1.5 s the patch flares up and creeps into the frame: the core at the edge is almost white or pale yellow, further in orange,
     the rim red or magenta; the edge is soft, feathered over 15–40 % of the frame's short side (S), the shape is uneven and slowly
     shimmers. Coverage 10–40 % of the frame, brightness in the patch zone +20…+120 levels of 255, the picture under the patch stays visible.
  3. The patch holds and drifts for 1–4 s at 2–8 % of the width per second, its brightness slowly "breathes" ±5–15 %.
  4. It fades out or floats off the edge over 1–2 s; the next one comes from another side and has another shape, no sooner than 2 bars later.
  Transition:
  5. 6–10 frames @25 fps (8–12 @30 fps) before the cut the patch rapidly grows from the edge and for 2–4 peak frames floods 90–100 % of the frame
     (mean brightness 170–240, the core almost white); the cut — exactly on the peak.
  6. The new shot emerges from the leak: the patch recedes to the opposite edge or fades out over 8–12 frames @25 fps (10–15 @30 fps).
variants:
  - edge wave: a warm wall of light from the left or right edge — the most common kind
  - corner patch: an ellipse from a frame corner, 30–60 % S in size
  - streak flare: a long diagonal streak at 20–40° floats across the frame over 1.2–3 s, like a glint from a window in motion
  - leak transition: the patch floods the frame, the cut on the peak
  - leak flash: a short warm burst of 0.3–0.5 s on a downbeat without a cut
  - cool: a blue or teal leak for a cold grade, night, winter
  - rainbow: a streak with a spectral shimmer (red → yellow → green → light blue) across its width
status: code
fallback: no special footage or third-party overlay files are needed — the leak is entirely synthesized in code (noise, gradients, palette) on any video; if the source is already overexposed, the leak is not visible in screen mode — lower the shot's exposure under the patch by 0.3–0.5 stops or use soft_light mode
params:
  shape: "edge — an ellipse at the edge elongated 1.5–3 along the edge; corner — from a corner; blob — a free-floating patch; streak — a band 15–35 % S wide at 20–40°; burst — from a point on the edge to the full frame (transition)"
  anchor: an edge or corner (left, right, top, bottom, tl, tr, bl, br) or a point [x, y]; neighboring leaks — from different sides
  palette: "amber — core fff1d0 → orange ff6a10 → red rim ff2a0a; magenta — ffe6ea → ff4f7b → d81b60; gold — fff6d8 → ffc84a → f08c0a; peach — ffe8dc → ff9a8b → ff5e62; cool — eefcff → 6fd6ff → 1a4dff; rainbow — hue shimmer 0–300° across the band"
  color_ramp: color is a function of the profile p — ramp(p^0.7) (pale core, saturated rim); opacity is set by the profile itself, do not darken the rim color — otherwise the patch turns brownish over a dark frame
  size: profile size (the distance where it falls to 1/e) 0.25–0.4 S in ambient, 0.6–1.0 S in a transition; falloff exp(−(d/size)^1.4–2)
  peak: layer core intensity 0.75–1.0 in ambient (the visible strength is set by size and envelope, not by a dim color), 1.2–1.5 with add in a transition; soft variant 0.4–0.6 with soft_light
  coverage: ambient 10–40 % of the frame (brightness gain from 20 levels), accent 30–60 %, transition at the peak 90–100 %
  drift: ambient 2–8 % of the width per second, streak flare 30–80 % of the width per second, transition — from the edge to the full frame in 6–10 frames @25 fps (8–12 @30 fps)
  warp: domain warping with fractal noise — 3 octaves, cell 0.4–0.5 S, amplitude 0.08–0.15 S, the field crawls at 3–6 % of the width per second
  envelope: "ambient — attack 0.6–1.5 s, hold 1–4 s, release 1–2 s (inOutSine); accent — attack 3–5 frames, release 8–12 frames @25 fps; transition — attack 6–10 frames, peak 2–4 frames on the cut, release 8–12 frames @25 fps (×1.2 in frame count @30 fps)"
  flicker: patch brightness modulation ±5–15 % at 0.5–3 Hz (filmic unevenness), optional
  blend: screen by default (never darkens) | add in linear light with a soft shoulder (transition, flash) | lighten (weaker, no color mixing) | soft_light (tints without brightening — overexposed sources)
  texture: multiply the layer by (1 + grain 2–4 %), add ±0.5 LSB dithering before converting to 8 bit — without it, steps show on a smooth gradient, especially after the platform re-encodes
  render: synthesis at ¼ resolution and bicubic upscale (the patch is low-frequency); together with compositing ≈ 30–40 ms per 1080×1920 frame on 1 core
  seed: a separate seed for each leak — shape and path never repeat; two identical leaks in a row give away the template
  limits: "leak transition — no more than once per 8 bars (16 s at 120 BPM) and never on two cuts in a row; ambient — no more than 40 % of the video's duration and no more than 2 patches at once; leak flash — no more than once per 4 bars"
when: |
  Warm, nostalgic and dreamy moments: summer, travel, sunset and golden hour, weddings and family, a memory,
  lifestyle, fashion "on film", calm intros and outros. Hook — the video opens by emerging from a leak (blown-out → picture over
  0.5–1 s) or a leak on the first downbeat. Build — ambient patches, one per 2–4 bars, the patch peak on the bar's downbeat.
  Drop (chorus) — one leak transition on the cut into the drop (peak on the beat), then no leaks in the fast part or only
  ambient; in calm genres the chorus gets ambient patches in the same rhythm. Outro — a leak floods the last shot and goes to white or
  black over 1–2 s. Put the transition on a change of place or time, not inside one scene. Limits — in params.limits.
avoid: |
  A face and eyes during an important line (the patch eats the facial expression); the subtitle and text zone — the leak kills the contrast of the letters
  (keep the patch outside the text safe zone or put it under the text); a product and a brand color; aggressive dark genres and
  horror scenes — a warm patch breaks the mood (if needed — a cool leak); already overexposed shots (the effect is not visible);
  a leak on every cut and the same shape from the same side — looks like a template; mixing with digital glitch and tape
  lines (clashing eras); leaks in fast cutting with shots shorter than 0.5 s (they do not have time to read).
sfx: ambient — no sound or a soft airy swell −24…−18 dB relative to the music; transition — a swell or reverse_whoosh of 0.4–0.8 s peaking exactly on the cut (align='peak'), −14…−10 dB; a leak entering the drop — plus sfx.impact on the cut; under a voice everything is pulled down another 6 dB
genres: {travel: signature, viral: allowed, epic: allowed, drama: allowed, calm: allowed, product: allowed, sport: allowed, fashion: allowed, fanedit: allowed, teaser: allowed, motivation: allowed, phonk: forbidden, clips: forbidden, explainer: forbidden, ugc: forbidden}
detect: |
  Custom code: the difference between a frame and its neighbors (or the shot's median) — a smooth warm patch of brightness gain from 20 levels that does not
  follow the scene's contours (Laplacian of the gain map ≈ 0), with its center of mass within 0–25 % of an edge or in a corner; coverage 10–40 %
  of the frame (ambient) or 90–100 % at the peak (transition); in the patch R/B 1.5–2.5 (amber, gold), ≈ 1.0–1.3 (magenta), below 0.8
  (cool); gradient width 15–40 % S. Over time — it grows over 0.6–1.5 s (ambient) or 6–10 frames (transition), the center drifts
  at 2–8 % of the width per second independently of camera movement (the patch stays put when the camera pans, and vice versa). Shadows and the light
  pattern of the scene under the patch do not change — it is a layer over the frame, not light in the scene.
  ed_motion: no cuts in ambient; luma_med +10…+60 % (the darker the frame, the larger) over 0.6–1.5 s and back; rgb_med
  shifts warm (R grows more than B); in a transition — flash or white frames at the peak and a cut within ±1 frame of
  the brightness maximum.
  Differences: glitch.film_damage (a leak on damaged film) — next to it a film gate frame, dust and flicker, the leak is saturated
  (R/B 3–6), grows over 0.1–0.2 s and floods 50–100 %; here — a clean picture, a soft gradient, partial coverage, and gold,
  magenta and cool variants exist. light.halation — a halo around bright objects in the scene; fx.glow — the glow grows out of bright areas of the frame
  and moves with them; light.flash — the scene lighting changes (shadows, a gradient from the source), 2–4 frames; trans.flash — a flat
  fill of the frame for 1–4 frames without a gradient; light.haze — a veil over the whole frame with a depth gradient; a lens flare — ghost
  rings on a line through the frame center.
engine: |
  light_leak(mode='ambient'|'accent'|'transition', t=[t0, t1] | at=t_cut, shape='edge'|'corner'|'blob'|'streak'|'burst',
             anchor='left'|'right'|'top'|'bottom'|'tl'|'tr'|'bl'|'br'|[x, y], palette='amber'|'magenta'|'gold'|'peach'|'cool'|'prism'|[hex, ...],
             peak=0.9, size=0.32·S, falloff=1.5, elong=1.8, drift=[0.04, 0.02] (fractions of W and H per second),
             warp={scale: 0.45·S, amount: 0.1·S, octaves: 3, speed: 0.04}, env={attack: 1.0, hold: 2.0, release: 1.5},
             flicker={amp: 0.08, hz: 1.5}, blend='screen'|'add'|'lighten'|'soft_light', grain=0.03, dither=True, seed)
    — extends light_leak from glitch.film_damage (color → palette, side → anchor, dur and waves → env and leak_track).
    implementation at ¼ resolution: coordinates in fractions of S → + fbm offset (warp) → d = distance to the shape (ellipse at the edge, point,
    |projection onto the normal| for a streak) → p = exp(−(d/size)^falloff) → layer = ramp(p^0.7, palette) · p · peak · env(t) · (1 + flicker)
    · (1 + grain · noise) → bicubic upscale → screen 1 − (1 − frame)(1 − layer) (add — with a soft shoulder above 0.9) → dithering ±0.5 LSB.
  transition(kind='leak', dur=0.6, params={palette: 'amber', shape: 'burst', anchor: 'right', peak: 1.3, size: 0.95·S, blend: 'add'})
    = light_leak(mode='transition', at=t_cut, env={attack: 8, hold: 3, release: 10} in frames @25 fps) — the cut on the maximum.
  leak_track(t=[t0, t1], every='2 bars', count_max=2, sides='alternate', shapes='rotate', peak_on='downbeat', seed) — new:
    a bar-based schedule of ambient leaks without repeating the side or the shape.
  + sfx('swell'|'reverse_whoosh', at=t_cut, align='peak', gain=-12) on a transition.
  Order: after the grade and glow, before film texture and text.
gen_hint: warm orange and red light leaks drifting in from the left edge of the frame over <scene>, soft glowing film light leak, golden hour, dreamy nostalgic summer mood
commands: ["warm light leaks on the intro", "light leak transition between #2 and #3", "subtle floating leaks over the whole wedding verse", "a cool blue leak instead of a warm one on #7", "an edge leak on every second bar in the chorus"]
related: [glitch.film_damage, fx.film_overlay, fx.glow, light.halation, light.flash, light.haze, trans.flash, trans.fade, trans.dissolve, look.film, focus.bokeh, sfx.whoosh]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters from editing practice; verify with a demo render", confidence: medium}
