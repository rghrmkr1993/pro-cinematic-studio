genres: {fanedit: allowed, viral: allowed, ugc: allowed, product: allowed, explainer: allowed, teaser: allowed, calm: allowed, clips: allowed, drama: forbidden, epic: forbidden}
detect: |
  Custom check — edge phase: profiles of strong |dx| changes by column and |dy| by row; phase coherence
  s(P) = |Σ profile·e^(−2πix/P)| / Σ|profile| while sweeping P = 1.6–20 px. Pixel art: the largest P where s ≥ 0.6 of the
  maximum (the true period and its fractions P/2, P/3 give a high s, multiples such as 2P give a low one), the same in X and Y,
  0.2–2 % of the frame height; in clear examples s = 0.4–0.98. Palette on the P grid: the 8 most frequent colors ≥ 85 % of the area.
  Edge sharpness is high, few intermediate (anti-aliasing) tones; characters at 7–12.5 fps or frames held for 2–3.
  ed_motion: no signature of its own; moves in even steps, holds on every other frame.
  Difference from fx.mosaic: there the mosaic is local (a face, a detail) or for a single hit, a block is the average color of the source frame
  (1.8–6.3 % H), the rest is sharp and the palette is not reduced. From look.retro_graphics and look.vhs: a soft image without a grid.
  From look.video_game: there, a clean 3D render and an over-the-shoulder camera, no pixel grid. From glitch.datamosh and fx.glitch:
  blocks are displaced and flow, the grid does not hold its shape.
engine: |
  Footage conversion: pixelate(size=round(0.008*H), grid='screen', prefilter='median3')
  + palette_quantize(colors=12, method='kmeans'|'fixed', palette='green4'|'duo(#1c0e2f,#bbd8da)'|'1bit'|'neon5'|None,
    dither='none'|'checker'|'bayer4', strength=0.4) + pixel_outline(px=1, color='darkest', target=mask('mediapipe_person'))
  + step_print(hold=2) + snap_motion(step=block) + upscale(method='nearest', factor=integer)
  Sprite over a live background: mask('hf_remove_background') → the same stack for the hero only → composite(over=background)
  Logo assembly: pixel_rain_build(mask=logo, block=0.018*H, dur=2.6, drip_colors=['#ce37df','#5ee6a7','#783398'], hold=1.9, reverse=True)
  Effect entry: res_ramp(block=[1, 0.008*H], t=[t0, t0+0.4], ease='outCubic') — on a downbeat
  + sfx('chiptune_blip', at=events), a bitcrush on the track for the duration of the episode.
