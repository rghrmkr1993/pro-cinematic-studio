id: zoom.out
family: zoom
group: camera
level: A
aliases: [zoom out, pull back, zoom pull-out, reveal]
what: moving away from a detail or the subject to a wide shot that reveals the context — often with an unexpected element that was out of frame
frames: |
  Start — a tight framing on the subject or a detail. The scale shrinks evenly by 2–30 times; the surroundings
  and a "surprise" enter the frame: another person in the foreground, the aftermath of an event, the scale of the place.
  Sometimes it turns out the first frame was a picture inside the frame (a window, stained glass, a screen).
  The slow variant — 4–6 s at constant speed; the fast one — 0.7–1.6 s, accelerating toward the end, with motion blur.
  The final composition puts the new element on a third of the frame.
variants:
  - ironic reveal: the subject is calm while around them is chaos or the aftermath
  - scale reveal: person → place → the whole landscape
  - out of the picture: the detail turns out to be an image on a wall or a screen
  - fast: from a fragment (legs, hands) to the full figure in 0.7 s
status: code
fallback: code can only pull out to the full source frame — a starting crop of ×2–3 needs 4K; wider than the source — Higgsfield outpaint/reframe or generation
params:
  scale: starting crop ×2–4, pull-out to 1.0 (for "picture in the frame" — up to ×30 via compositing)
  duration: slow 3–6 s; fast 0.6–1.6 s
  ease: linear for the slow one; inQuad (accelerating toward the end) for the fast reveal
  center: start on the original detail, end — a composition with the new element on a third
  motion_blur: only on the fast variant
when: reveal of the place or the scale, the ending of a story, the irony of "and here is what is really going on", outro; intro of travel and epic videos
avoid: the source is already wide and there is no framing headroom; the drop and the energy peak (a pull-out lowers the tension)
sfx: a soft reverse whoosh or an opening pad; on an ironic reveal — a pause, silence and one accent sound
genres: {epic: signature, travel: signature, teaser: signature, drama: allowed, calm: allowed, motivation: allowed, explainer: allowed, product: allowed, fanedit: allowed, viral: allowed}
detect: "ed_motion: ZOOM-OUT ×0.5 or less, near-linear or ease-in; nonrigid < 0.15 (if higher — a physical camera pull-out, cam.pull_back); new objects appear at the end"
engine: |
  transform(scale=[S0, 1], center=[detail]→[composition], t=[t0, t0+D], ease='linear'|'inQuad') — S0=2–3;
  out of the picture: composite(clip_detail → into the picture's quad) + transform; wider than the source — outpaint.
gen_hint: slow zoom out from a close-up of <detail> revealing <wider context or surprise>, single continuous shot
