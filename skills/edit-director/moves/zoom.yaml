id: zoom.in
family: zoom
group: camera
level: A
aliases: [zoom in, zoom, zoom push-in, optical zoom-in, zooming]
what: smooth zoom-in toward the subject without changing the camera position — only the scale grows, perspective and parallax stay the same
frames: |
  The shot starts as a wide or medium shot. The image enlarges evenly: background and subject grow
  equally, with no parallax — this is what separates a zoom from a camera push-in. The speed is constant, like a
  zoom rocker: no acceleration or deceleration. The zoom center sits on the subject (a face, a figure in a large
  space), so by the end the frame "lands" on it. Motion blur only on the fast variants.
  Ending — a medium shot or close-up with a hold.
variants:
  - toward emotion: zoom-in on the face at the peak moment (a shout, a line), ×3–5 in 1–1.5 s
  - toward a figure in its surroundings: from a facade or landscape to a small person, ×3 in 1.5 s
  - with a rack focus: the foreground goes soft, the zoom heads to the distant subject
status: code
fallback: with a 1080p source and ×2+ — upscale; if honest parallax is needed (a camera push-in) — the cam.dolly_in move from the source footage, or generation
params:
  scale: ×1.5–5 per move (typically ×2.5–3.5)
  duration: 0.8–3.5 s (typically 1–1.5 s)
  rate: 2–10 % of scale per frame @25 fps, constant
  ease: linear; a light inQuad on the first frames is allowed
  center: on the subject, not at the frame center (offset 0.1–0.4)
  motion_blur: off; on only at speeds above 8 % per frame
  resolution: ×2+ on 1080p — ceiling ×1.5–1.8 without visible loss, beyond that upscale or 4K
when: lead into an emotion or a detail, connect a wide shot with the subject, accent a line; build and the lead-in to the drop; after the move hold at least 0.5 s
avoid: choppy editing with shots shorter than 1 s (the move does not read); the subject leaves the frame; two zooms in a row in the same direction; low resolution at ×2+
sfx: usually no SFX; support — the music building up or a soft swell; on the fast version — a quiet whoosh
genres: {drama: signature, epic: allowed, motivation: allowed, teaser: allowed, clips: allowed, explainer: allowed, calm: allowed, fanedit: allowed, travel: allowed}
detect: |
  ed_motion: a single ZOOM-IN ×1.5+ with near-linear ease, peak ≤×1.1/frame; nonrigid < 0.15 (no parallax —
  so it is optics or a digital crop, not camera movement); center stable; no rotation; sharpness barely drops.
engine: |
  transform(scale=[1, S], center=track(subject), t=[t0, t0+D], ease='linear') — S=1.5–3.5, D=0.8–2 s;
  for S>1.8 — upscale the segment first; motion_blur=False.
gen_hint: smooth lens zoom in towards <subject>, constant speed, locked-off camera position, no parallax, starts wide and ends in a close-up
commands: ["zoom on the face from 0:05 to 0:07", "smooth zoom-in on #3", "get closer to the subject by the end of the shot"]
related: [zoom.slow, zoom.crash, zoom.out, dolly.in]
evidence: {examples: 6, sources: 6, measured: "×1.4–5.0 in 0.8–3.4 s; 4 of 6 — constant speed, 1 — accelerating; zoom center at the subject (offset 0.1–0.4); 2 examples have nonrigid 0.2–0.27 — that is already camera movement, moved to cam.*", confidence: high}
