id: zoom.in_out
family: zoom
group: camera
level: B
aliases: [back-and-forth zoom, zoom seesaw, pulsing zoom, zoom bounce]
what: a zoom-in and an immediate return to the original shot size, once or several times in rhythm — the frame "breathes" or "beats"
frames: |
  Start and end at the same shot size. Zoom-in ×1.3–2.5: a fast start and deceleration into the peak (ease-out),
  0.25–0.65 s → a stop of 0–2 frames → a return of the same amplitude, accelerating toward the end (ease-in).
  The in-and-out pairs mirror each other in timing and center. Fast strokes have radial motion blur;
  slow ones are smooth "breaths" of 0.75–2 s each.
variants:
  - single: in-hold-out in 1–1.2 s
  - double in rhythm: two cycles of 0.25–0.3 s per stroke, on the beats of the bar
  - staccato: 3–5 short strokes of ×1.1–1.8, 160 ms each, between cuts
  - breath: a slow in of ×1.5 over 0.75 s and a long return over 2 s
status: code
params:
  scale: peak ×1.3–2.5, return to 1.0
  stroke: fast 0.25–0.5 s per stroke (½–1 beat at 120 BPM); slow 0.75–2 s
  ease: zoom-in outCubic, return inCubic (mirrored)
  hold: 0–80 ms at the peak
  cycles: 1–3 in a row
  center: on the subject, the same for the zoom-in and the return
  motion_blur: zoom_blur for strokes shorter than 0.35 s
when: in on the beat and back on the off-beat; a "heartbeat"; a comedic reaction; emphasizing a repeated phrase; bass accents in phonk and viral
avoid: more than 3–4 cycles in a row (causes motion sickness); calm genres; shots with strong camera movement of their own
sfx: on every zoom-in — a short whoosh or a bass hit, in sync with the kick
genres: {viral: signature, phonk: signature, fanedit: allowed, sport: allowed, fashion: allowed, clips: allowed, ugc: allowed, calm: forbidden, epic: forbidden, drama: forbidden}
