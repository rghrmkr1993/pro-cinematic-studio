engine: |
  transform(scale=[1, S, 1], center=track(target), t=[beat_i, beat_i+½beat, beat_i+1], ease=['outCubic', 'inCubic'])
  + blur(kind='zoom') on short strokes; pattern generator: beat_pulse(S=1.3–2, every='1/2'|'1/4', cycles)
gen_hint: rhythmic zoom in and back out on <subject>, pulsing music-video zoom, returns to the original framing each time
