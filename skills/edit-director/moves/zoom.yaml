id: zoom.infinite
family: zoom
group: camera
level: C
aliases: [infinite zoom, endless zoom, zoom tunnel, recursive zoom]
what: a continuous zoom-in that never ends — when the frame "runs out", it is replaced by the next one, nested in the center of the previous one
frames: |
  Each link is a smooth zoom-in of ×5–25 over 2.5–3.5 s, centered exactly in the middle of the frame or on the vanishing point.
  The seam is hidden in one of three ways: (a) the zoom goes into a dark or blurred surface and comes out
  of it already in a new shot; (b) the new scene is nested inside the old one — a picture, a window, a screen, a collage layer —
  and grows to fill the frame; (c) the vanishing point of a street or corridor matches from cut to cut.
  The speed does not change at the seam, so the join is invisible. The spiral variant — a constant rotation
  of up to 90° per link.
variants:
  - through darkness or motion blur: zoom into a dark part of an object → come out in a new scene
  - nested (picture in picture): the new scene is an image inside the old one
  - along the vanishing point: moving forward, cuts on matching perspective
  - graphic collage: layers of cut-out photos, each emerging from the center of the previous one
  - spiral: zoom + constant roll
status: code
fallback: the nested variant — hybrid (tracking the quad of a screen or window + compositing); if there are no suitable shots — generate the links with a common center
params:
  rate: constant on a log scale, ×1.06–1.13 per frame @25 fps (×4–20 over 3 s)
  link: 2.5–3.5 s per link, 3–8 links
  seam: 12–20 % of the link length; zoom_blur + a dissolve through a dark or flat-colored area; scale and speed match at the seam
  center: fixed — the frame center or the vanishing point
  rotation: optionally a constant 10–30°/s
when: intros, transitions between topics or locations, "immersion", the climax of a music video, visualizing scale
avoid: links with different brightness at the seam without preparation; a choppy rhythm in the track; shots without a clear center — regular cuts work better then
sfx: a continuous riser or "wind" over the whole move; on each seam — a soft whoosh or a hit on the downbeat
genres: {fanedit: signature, teaser: signature, epic: allowed, travel: allowed, viral: allowed, motivation: allowed, fashion: allowed}
detect: "ed_motion: a long series of ZOOM-INs at constant speed; the scale 'resets' without changing direction (a cut inside the move), the center is stable around 0.5; cumulative scale ×50+"
engine: |
  chain_zoom(clips[], per_link=3, rate=ln(10)/3, seam=0.5, seam_kind='zoom_blur_dissolve'|'nest(quad=track(screen))',
  center=[0.5, 0.5]|vanishing_point) — the links are aligned on the center or the vanishing point; the seam — on the downbeat.
gen_hint: seamless infinite zoom, camera continuously zooms into <object> which reveals a new scene inside it, nested worlds, constant speed, perfectly centered
