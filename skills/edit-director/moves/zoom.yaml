id: zoom.crash
family: zoom
group: camera
level: B
aliases: [crash zoom, snap zoom, crash, abrupt zoom-in, zoom hit]
what: a lightning-fast zoom-in from a wide or medium shot onto a face or a detail — in half a second, with motion blur and a hard landing
frames: |
  1. Setup: 0.3–0.7 s of a static wide or medium shot, the target is visible but small.
  2. Snap: over 8–16 frames (25 fps) the scale grows by 2.5–9 times. The fastest frames are in the middle of the move
     (up to ×1.3–1.5 per frame), and that is also where the strong radial motion blur is: sharpness drops by 2–10 times.
  3. Landing: the frame snaps onto a close-up of a face, eyes or an object; the target is often off-center —
     the zoom heads straight for it, and the frame "slides" on the way.
  4. After: a hold on the close-up from 0.4 s — or a cut right at the moment of landing.
variants:
  - crash with a snap-back: immediately the same snap back, the whole cycle 0.8–1 s
  - crash through the target: at peak speed — a cut or a flash into the next scene
  - two-step: two snaps in a row with a pause of 2–4 frames
status: code
fallback: if the target is small, the source is 1080p and ×4+ is needed — upscale the segment, move the landing to a closer shot from the source footage, or generate a close-up and swap it in at the blur peak
params:
  scale: ×2.5–9 (typically ×3–5)
  duration: 8–16 frames @25 fps (0.3–0.65 s), rarely up to 1 s
  peak_rate: ×1.2–1.5 per frame
  ease: inOutCubic or linear, no slow tail
  center: on the target (track(face) / object), offset from the frame center up to 0.3
  motion_blur: zoom_blur, strength follows the speed; maximum in the middle of the move
  hold_before: 0.3–0.7 s of static
  hold_after: from 0.4 s, or a cut on the landing
  resolution: a final ×3 or more — needs 4K or an upscale
when: a punchline, a reaction, a "realization", the entry into the drop or a downbeat hit, an accent on a detail; no more than once every 4 bars
avoid: a calm or luxury tone; the target is blurry or leaves the frame; several crashes in a row (the impact gets lost); a low-resolution source with no headroom
sfx: a short whoosh or riser over the whole snap, an impact at the moment of landing; in comedy — a scratch or a "bonk"
genres: {viral: signature, phonk: signature, fanedit: signature, clips: signature, drama: allowed, sport: allowed, teaser: allowed, ugc: allowed, motivation: allowed, product: allowed, calm: forbidden}
detect: |
  ed_motion: ZOOM-IN ×2.5+ in ≤0.7 s; peak ≥×1.2/frame; min sharpness ≤×0.55 in the middle of the move;
  before the move — static (no events for 0.3+ s), after — a hold or a cut; nonrigid < 0.3.
  Unlike zoom.punch: a punch takes 1–3 frames, an instant change of shot size without motion blur.
  Unlike zoom.in: zoom.in peaks at ≤×1.1/frame and sharpness does not drop.
engine: |
  transform(scale=[1, S], center=track(target), t=[t0, t0+D], ease='inOutCubic')
  + blur(kind='zoom', amount∝speed, center=target, t=[t0, t0+D])
  + sfx('whoosh', at=t0, align='attack') + sfx('impact', at=t0+D)
  S=3–5, D=0.4 s; put the landing (D) on a beat of the track. The snap-back variant — a mirrored transform after 0.3–0.6 s.
gen_hint: aggressive crash zoom from a static wide shot straight into <subject's face>, very fast snap zoom with heavy motion blur, lands in a tight close-up and holds
commands: ["crash zoom at 0:07", "crash zoom on #5 at the moment of impact", "sharp zoom-in on the face on the drop", "crash with a snap-back on the line"]
related: [zoom.punch, zoom.in_out, zoom.in, zoom.extreme]
evidence: {examples: 6, sources: 6, measured: "×2.7–9.2 in 0.42–1.1 s (4 of 6 — 0.42–0.7 s); peak ×1.2–1.5/frame; sharpness in the middle drops to ×0.08–0.53; in 5 of 6 there is 0.3–0.7 s of static before the snap; S-curve or linear", confidence: high}
