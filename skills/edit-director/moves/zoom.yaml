id: zoom.extreme
family: zoom
group: camera
level: C
aliases: [super zoom, extreme zoom, zoom across scales, from wide shot to detail in one move]
what: a zoom-in or zoom-out with a huge scale range (×10–×100 and more) — from a detail to a whole location or the reverse, cut together from several shots into one move
frames: |
  The move goes in stages: each segment is a smooth zoom of ×3–13, with a hidden shot swap between them (motion blur,
  a flash of 1–2 frames, a pass through a dark opening — a mouth, a barrel, a window). The zoom-in accelerates toward the target:
  half of the distance falls in the last third of the time; it ends with a pass through the target into a new
  scene. The zoom-out reveals ever larger surroundings: person → site → building → district.
  No single lens covers such a range — it is an editing illusion.
variants:
  - zoom "inside": into a mouth, an eye, a barrel, a keyhole — coming out in another scene
  - pull-out to the scale of the place: from feet or a face to a stadium, a factory, a city
  - with a crash at the end: an accelerating ×2 zoom-in and a snap through motion blur onto the subject
status: footage
fallback: one shot in code gives at most ×2–3; the other stages — shots of the same place at different shot sizes from the source footage, outpaint for the zoom-out, or generation with the same center
params:
  range: ×10–×100 in total, 2–4 stages of ×3–13
  duration: 1.2–3 s for the whole move
  ease: zoom-in — inExpo toward the target; zoom-out — linear or outQuad
  seams: at maximum speed, motion blur over 2–4 frames, across a dark or flat-colored area
  center: one point through all stages
when: intros and outros showing the scale of the place, a transition into an "inner world", a comic pass into a detail, a final reveal
avoid: there are no shots of the needed sizes and generation has not been agreed; calm and UGC videos
sfx: a long riser or whoosh with rising pitch; on the pass-through — a hit or a "pop"; on the pull-out — the ambience of the place building up
genres: {epic: signature, teaser: signature, fanedit: allowed, travel: allowed, sport: allowed, motivation: allowed, viral: allowed}
detect: "ed_motion: cumulative scale ≥×10 in one direction in ≤3 s; several ZOOM segments with a common center; at the joins — motion blur, a flash or an abrupt histogram change (cuts inside the move)"
engine: |
  multi_scale_zoom(stages=[wide, mid, close], center=track(target), per_stage=0.6–1, ease='inExpo',
  seam=blur(kind='zoom')+flash(dur=2 frames)); missing stages — outpaint (zoom-out) or edit-gen (generation with the same center).
gen_hint: extreme continuous zoom from <a vast wide view> down to <a tiny detail> (or the reverse), orders-of-magnitude scale change in one seamless accelerating move, centered on the same point
commands: ["extreme zoom from the city down to the subject in the intro", "super zoom into the mouth and out into the next scene", "pull out to the scale of the place at the ending"]
related: [zoom.infinite, zoom.crash, zoom.out]
evidence: {examples: 5, sources: 5, measured: "×13–×31 and more in total; stages ×2–4.8; zoom-ins accelerate (50 % of the distance at 0.70–0.76 of the time); 2 of 5 — a pass through a dark opening into a new scene; 2 — pull-outs to the scale of the place", confidence: medium}
