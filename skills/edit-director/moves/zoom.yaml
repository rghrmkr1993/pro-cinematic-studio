related: [zoom.extreme, zoom.crash, trans.zoom]
evidence: {examples: 5, sources: 5, measured: "link ×5–25 in ~3 s; constant speed in 4 of 5; center 0.49–0.54; spiral variant — 86° per link; seams through darkness, a nested picture and the vanishing point", confidence: medium}
