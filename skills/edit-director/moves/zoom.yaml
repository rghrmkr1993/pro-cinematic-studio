id: zoom.punch
family: zoom
group: camera
level: B
aliases: [punch zoom, punch-in, zoom punch, beat zoom, zoom on beat, punch-out, punch, digital punch-in, framing snap]
what: an instant digital zoom-in of ×1.1–1.35 over 1–3 frames exactly on the beat — the shot size "snaps" on the hit and holds or springs back; an accent inside the shot without a cut
frames: |
  1. Before the hit: the shot at its own size (×1.0) — static or with smooth camera movement, 0.3+ s with no other accents.
  2. Hit: the frame on which the beat transient lands (kick, 808, snare, a stressed word) is already enlarged ×1.1–1.35.
     Hard variant — a step over 0 frames (the previous frame is still ×1.0); soft — 1–2 frames of accelerating approach,
     so the biggest jump still falls on the beat frame. Center — the face (the point between the eyes) or the frame center.
     No motion blur, or it is concentrated on the hit frame (radial, 180° shutter) and fades over 3–4 frames of the bounce.
  3. After the hit — one of three: a hold until the next accent, phrase or cut (hold); a return to ×1.0 over 6–10 frames
     @25 (8–12 @30), "fast, then soft" (bounce); a spring — a recoil below the target, a 2–3-frame wobble and settling at ×1.15.
  4. Series: in the drop — a bounce on every beat; in the last bar of the build — a ladder of ×1.10–1.12 steps on every 1/4
     (or 1/8) and a one-frame reset to ×1.0 on the first beat of the drop; in speech — ×1.0 ↔ ×1.2 every other phrase on stressed words.
variants:
  - "hard step with a hold (hold) — a ×1.15–1.3 step on the beat, held until the next event; exit with a cut or a punch-out"
  - "rebound (bounce) — peak on the beat and return over 0.24–0.4 s; a 'heartbeat' on every kick of the drop"
  - "with motion blur — strong radial blur on the hit frame (shutter 180–360°), it fades quickly on the bounce; the heavy hit of velocity edits"
  - "spring (overshoot) — ×1.25 on the beat, recoil to ×1.11, wobble and settle at ×1.15 over 6–8 frames"
  - "ladder (stairs) — 3–4 steps of ×1.10–1.12 on 1/4 or 1/8, total ≤ ×1.5, reset to ×1.0 on the downbeat or the drop"
  - "reverse punch (punch-out) — from ×1.2–1.3 a snap to ×1.0 on the beat: an 'exhale', the exit from a ladder or from a speech punch"
  - "speech — ×1.15–1.25 on the face on a stressed word, a number or a punchline; held until the end of the phrase, no motion blur"
status: code
fallback: |
  Not enough pixels (9:16 from 16:9 1080p — the reframe is already ×1.78): a punch of no more than ×1.15–1.2 with sharpening, or upscale
  the clip (upscale_video, with the user's consent). The face or object is at the edge and the ×S window cannot land on it — punch to the center
  of the frame or use a punch-out (hold the whole segment at ×1.2, reset to ×1.0 on the beat). The source itself shakes — stabilize first,
  otherwise the step drowns in the jitter. Neither a face nor an object — the frame center.
params:
  scale: "×1.1–1.35; typically ×1.15–1.2 on every beat and ×1.25–1.3 on the downbeat, the entry into the drop or a punchline; below ×1.08 it does not read (looks like frame jitter), above ×1.35 it is already cut.insert or zoom.crash"
  peak_frame: "peak (the first frame at full scale) — frame k0 = floor(t_beat·fps + 0.4): the frame start closest to the transient, biased toward the early side — no more than 0.6 frame before the sound (24 ms @25, 20 ms @30), no more than 0.4 frame after it (16 / 13 ms); t_beat — beats from ed_audio (attack onset ±10 ms). Manual adjustment tolerance −2…+1 frame @25, −3…+1 @30: picture ahead of sound goes unnoticed up to about 125 ms, while sound ahead of picture is noticeable from 45 ms — later than +1 frame is not allowed"
  attack: "default 0 frames (a step: frame k0−1 is still ×1.0); a soft approach of 1–2 frames BEFORE the beat with acceleration — fractions of ln S on frames k0−1, k0 = 0.25, 1 or on k0−2, k0−1, k0 = 0.11, 0.44, 1 (at S = 1.25: 1.057 → 1.250 or 1.025 → 1.103 → 1.250); the biggest jump is always on k0"
  release: "bounce — ln s(k) = ln S·(1 − k/D)³ for k = 0…D (outCubic on a log scale, the way ed_render interpolates); D = 8 frames @25 (0.32 s) and 10 frames @30 (0.33 s), range 0.24–0.4 s, but no longer than 0.7 of a beat — by the next hit the frame is already at rest (at 140 BPM D ≤ 7 frames @25); exponential equivalent τ ≈ 0.28·D ≈ 90 ms"
  curve_25: "frames k0−1 | k0 … k0+8: S 1.20, D 8 → 1.000 | 1.200 1.130 1.080 1.046 1.023 1.010 1.003 1.000 1.000; S 1.30, D 8 → 1.000 | 1.300 1.192 1.117 1.066 1.033 1.014 1.004 1.001 1.000; S 1.15, D 6 → 1.000 | 1.150 1.084 1.042 1.018 1.005 1.001 1.000"
  curve_30: "frames k0−1 | k0 … k0+10: S 1.20, D 10 → 1.000 | 1.200 1.142 1.098 1.065 1.040 1.023 1.012 1.005 1.001 1.000 1.000; S 1.30, D 10 → 1.000 | 1.300 1.211 1.144 1.094 1.058 1.033 1.017 1.007 1.002 1.000 1.000"
  hold: "the step holds until the next event: in music 1–4 beats or until the cut, in speech until the end of the phrase (1–4 s); exit — with a cut (default) or a punch-out on the beat (also a step over 0 frames)"
  spring: "s(k) = Sh + (S − Sh)·e^(−k/τ)·cos(π·k/P), S 1.25, Sh 1.15; @25 τ = P = 2.5 frames (0.1 s) → 1.250 1.171 1.114 1.126 1.156 1.164 1.153 1.145 1.147 1.150; @30 τ = P = 3 frames → 1.250 1.186 1.124 1.113 1.137 1.159 1.164 1.155 1.147 1.145 1.150"
  ladder: "3 steps of ×1.12 (1.120 → 1.254 → 1.405) or 4 steps of ×1.10 (1.100 → 1.210 → 1.331 → 1.464); each is a hard step on its own 1/4 (on 1/8 — only the last 2 beats of the bar); total ≤ ×1.5; a one-frame reset to ×1.0 on the first beat of the next bar or of the drop"
  blur: "radial blur only on frames with |Δln s| ≥ 0.02 per frame: an average of 6–8 scales over the last fraction of the interval equal to the shutter; shutter 0 — clean (speech, ugc, product), 0.5 = 180° — default in music, 1.0 — heavy velocity; at ×1.2 and 180° the trail on the hit frame is ≈ 9 % of the distance to the center — 49 px at the side edge of a frame 1080 wide and ≈ 100 px in a 9:16 corner; sharpness of the hit frame drops to ×0.1–0.3, the bounce is blurred less and less and is sharp again from k0+5 (@25 and @30)"
  center: "track(face) — the point between the eyes, after the punch the face sits at 0.33–0.40 of the height from the top; without a face — the frame center or track(object); the ×S window moves from the center no further than (1 − 1/S)/2 (±8 % of the frame at ×1.2); a series and a punch / punch-out pair share one center; on a pan the center is taken in the current window"
  resolution: "total magnification (reframe × punch) ≤ ×2.0–2.2 of the source pixels: 9:16 from 16:9 1080p — punch ≤ ×1.15–1.2 + unsharp 0.3–0.5; from 4K — up to ×1.35 without loss"
  qa: "after render: the peak frame of every punch matches k0 (−1…0 frames), intervals between peaks in a series are multiples of the beat period ±1 frame, total crop ≤ ×2.2"
when: |
  Music (phonk, viral, fan edit, sport, teaser):
  hook — one punch of ×1.25–1.3 on the first downbeat (the first 0.5–1 s) to "switch on" the video;
  build — on the snare (beats 2 and 4) once per bar, or a ladder in the last bar before the drop (at 140+ BPM — on 1/8 only the last two beats);
  drop — a bounce of ×1.12–1.2 on every kick or beat for no longer than 2–4 bars in a row, the downbeat of the bar — ×1.25–1.3;
  then a bar without punches or a change of accent (shake.beat, flash);
  outro — no punches, or one punch-out "exhale" on the last beat.
  Speech (clips, UGC, explainer, motivation): a stressed word, a number, a product name, a punchline, a change of thought — hold ×1.15–1.25
  until the end of the phrase, exit on the next cut; in the hook — a punch on the first stressed word.
  Limits: ≤ 1 punch per beat; outside the drop ≤ 1 per bar; in speech ≤ 1 per 3–6 s and never two in one phrase; in a row on every beat — no more than
  16 punches; within one beat no more than two accents from {punch, shake, flash, RGB split} — except the first beat of the drop.
avoid: |
  A calm or luxury tone, slow music without a pronounced hit. A punch off the beat or later than the transient by more than a frame —
  reads as a mistake. A punch on every beat for the whole video — cheap and nauseating. A punch on the first frame after a cut — the cut
  is already an accent, together they read as a glitch (except a deliberate punch across a cut). A punch on top of a running zoom-in (zoom.in,
  zoom.slow, zoom.crash) — the scale jerks; on top of a whip pan — invisible. A face or object at the edge that the ×S window cannot
  land on — the punch cuts off the main thing. A jump below ×1.08 (looks like jitter) or a crop above ×2.2 of the source (mushy image).
  Subtitles and graphics do not scale with the frame — they are overlaid after the punch. In speech — a punch in the middle of a word and
  alternating ×1.0/×1.2 on every cut over jump cuts (that is already cut.jump, do not double it).
sfx: |
  In music a separate sound is usually not needed: the punch sits on the hit of the track and "shows" it. On a strong punch into the drop —
  sfx.impact (align='attack', 0 ms to frame k0, −6…−9 dB relative to the music) or sfx.sub_drop; on a ladder — a short tick on each
  step, louder toward the last one, over an sfx.riser across the whole bar. In speech — a low short hit of 80–150 ms or a "whoosh" of 0.12–0.2 s
  peaking on k0, 12–18 dB below the voice; in comedy — a scratch or a "bonk".
genres: {viral: signature, phonk: signature, fanedit: signature, clips: signature, ugc: signature, explainer: signature, epic: allowed, product: allowed, sport: allowed, travel: allowed, fashion: allowed, teaser: allowed, motivation: allowed, calm: forbidden, drama: forbidden}
detect: |
  ed_motion (shot without a cut): hard punch — ZOOM-IN over 1 frame ("1 fr", near-linear, 50 % at 0.5), factor = peak_rate =
  ×1.1–1.35, center 0.35–0.65 (face or frame center), nonrigid ≤ 0.05, conf ok; no false cut even at ×1.35.
  Soft approach — ZOOM-IN over 2–3 frames with ease-in (50 % at 0.67–0.7) and a peak of ×1.13–1.18/frame on the last frame (= the beat frame).
  Hold — holds after the event, no ZOOM-OUT. Bounce — an immediate ZOOM-OUT over D − 2 frames (the last steps are below the threshold: 4–8
  frames @25, 5–10 @30; with D 8 / 10 — 6 / 7), ease-out (50 % at 0.28–0.35), peak ×0.94–0.97/frame in the first frame after the beat,
  product of the factors in·out = 1.00 ± 0.03. Spring — after a 1-frame ZOOM-IN
  short ZOOM-OUTs of ×0.88–0.89 and ZOOM-INs of ×1.04–1.06, 2–3 frames each, ending at ≈ ×1.15. Ladder — 2–4 one-frame ZOOM-INs of
  ×1.10–1.15 at an even beat spacing (12 frames @25 at 125 BPM, 15 @30 at 120 BPM) with holds between them and a one-frame ZOOM-OUT
  with factor = 1/(product of the steps). Series — intervals between ZOOM-INs are multiples of the beat period ±1 frame.
  Sharpness of the hit frame: without blur ×0.6–1 (and a step lower for the whole hold — the frame is larger), with 180° blur ×0.1–0.3
  (ed_motion then underestimates the factor: ×1.15 instead of ×1.2). All the signs above were reproduced on a synthetic render of these
  curves at 25 and 30 fps (ed_motion at 320 px). In ed_analyze, a punch that the cut detector took for a cut is labeled
  cut_in = punch_in / punch_out with scale 1.07–1.35.
  Unlike cut.jump (a jump cut with a punch): ed_motion does not tell them apart (the same 1-frame ZOOM-IN, nonrigid ≈ 0.02). Own check:
  align the frames by the found scale and count the share of pixels with a residual > 25/255 — for a punch it is at the level of neighboring pairs
  (synthetic: 0.4 %), for a jump cut it is 3+ times higher and forms a blob on the subject (5–7 %): the pose or position jumps.
  Unlike cut.insert: an insert is a new shot ×1.3–15 on the target: the window moves to a detail (center offset ≥ 0.1 of the frame from the face or center)
  or ×1.4+, holds 0.3–2.8 s and is placed by meaning, not on the beat grid; a ladder of inserts reaches ×2.6+. At the boundary of ×1.3–1.35
  the deciding factors are the center (the same face or frame center) and a repeat on the beat grid or a return A → A′ → A with the same framing — that is a punch.
  Unlike zoom.in_out: the zoom-in is visible for 4+ frames (ZOOM-IN ≥ 4 frames, ease-out, ≤ 40 % of scale per frame), a pause of 0–2 frames and
  a mirrored ZOOM-OUT of the same length with ease-in (synthetic ×1.3: 5 frames in, 5 back); a punch enters in 1–3 frames, and the exit is
  3–6 times longer and ease-out — or there is none. Unlike zoom.crash: ×2.5+ over 8–16 frames with motion blur. Unlike trans.zoom: next to
  the zoom-back there is a cut into a new scene.
engine: |
  beat_punch(times=beats|'downbeats'|'1/4'|'snare'|[t…], scale=1.2, mode='hold'|'bounce'|'spring'|'ladder'|'out',
             attack=0 (frames before the beat, 0–2), release=0.32 (s, outCubic on a log scale), hold_until='next_beat'|'phrase'|'cut'|t,
             spring={settle: 1.15, tau: 0.1, period: 0.2}, ladder={step: 1.12, per: '1/4'|'1/8', reset: 'downbeat'|'drop'},
             center=track(face)|[0.5, 0.5], blur_shutter=0|0.5|1.0, snap='floor(t·fps+0.4)')
    — a new generator primitive; expands frame by frame into transform(scale=[…], center, t, ease)
    + blur(kind='zoom', amount=shutter·|Δln s|, center) on frames with |Δln s| ≥ 0.02.
  In the current ed_render (zoom_at multiplies all zoom.* moves of the clip and outside [t0, t1] holds s0 / s1; tb = k0/fps from the clip start):
    hold   → {id: 'zoom.punch', t0: tb − 1/fps, t1: tb, scale: [1, S], ease: 'hold', blur: false}
    bounce → hold step + {id: 'zoom.punch', t0: tb, t1: tb + D/fps, scale: [1, 1/S], ease: 'outCubic', blur: false}
    blur: true in ed_render averages 6 scales over the whole step (= 360° shutter); 180° needs a shutter parameter.
  Punch across a cut (ed_plan): a continuation clip of the same source with reframe.zoom ×S and cut_in = {id: 'zoom.punch', scale: S}.
  Text and graphics — after the punch, they are not scaled. + sfx('impact', at=tb, align='attack') only on strong accents.
gen_hint: "locked-off static medium shot of <subject> centered in frame, <action with clear rhythmic accents: head nods, stomps, a sharp gesture on every beat>, crisp focus, high resolution with generous headroom around the subject for digital punch-in zooms, no camera movement"
commands: ["punch on every kick in the drop", "zoom punch ×1.25 at 0:07 and hold until the cut", "a ladder of punches in the last bar before the drop", "punch-in on the face on the word 'free'", "zoom bounce on every beat in the chorus, no motion blur", "remove the punches from the verse"]
related: [zoom.in_out, zoom.crash, cut.insert, cut.jump, shake.beat, time.velocity, trans.zoom, time.freeze, trans.flash, fx.rgb_split, shot.close_up]
evidence: {examples: 0, sources: 0, measured: "edit culture: parameters based on editing practice; verify with a demo render", confidence: medium}
---
id: zoom.slow
family: zoom
group: camera
level: A
aliases: [slow zoom, slow push, slow push-in, creeping zoom, bringing a static shot to life]
what: an almost imperceptible constant zoom-in (less often a zoom-out) over the whole shot — builds tension or intimacy without giving the camera away
frames: |
  The frame holds on a face or a figure. The scale grows evenly, 0.2–1 % per frame: over 2–5 s it adds up to ×1.4–2.2.
  No acceleration, no deceleration, no motion blur; the zoom center is on the face. The viewer notices the change in shot size
  only toward the end — it feels like "pressure" or immersion. A rare variant — an equally slow zoom-out.
variants:
  - portrait: one person looks into the camera or past it, ×1.4–1.5 in 3–4 s
  - with action: the subject itself moves in the frame, the zoom runs on top
  - slow pull-out: ×0.6–0.7 in 2 s, a soft reveal of the surroundings
status: code
params:
  scale: ×1.1–1.5 over a typical 3–5 s shot (maximum ×2.2 in 5 s)
  rate: 0.15–0.6 % per frame @25 fps (×1.04–1.16 per second)
  ease: linear; a very soft inOutQuad at the edges is allowed
  center: track(face), a slow drift of the center is allowed
  motion_blur: disabled
  direction: in (main) or out
when: tension, a monologue, a pause before a twist, long notes; bring any static shot longer than 2 s to life in calm and dramatic videos
avoid: fast editing (a shot shorter than 1.5 s — does not read); a shot with its own camera movement; a face at the frame edge without resolution headroom
sfx: no SFX; support — a rising pad or drone, silence
genres: {calm: signature, drama: signature, motivation: signature, epic: allowed, teaser: allowed, explainer: allowed, travel: allowed, product: allowed, ugc: allowed, clips: allowed, fashion: allowed}
detect: "ed_motion: a single ZOOM-IN (or OUT) lasting ≥2 s, peak ≤×1.02/frame, near-linear, nonrigid < 0.1; no other events"
engine: |
  transform(scale=[1, 1.08–1.25], center=track(face), t=whole shot, ease='linear') — by default
  on static shots longer than 2 s in the calm, dramatic and motivation genres; zoom-out — scale=[1.15, 1].
gen_hint: very slow, almost imperceptible zoom in on <subject>, static camera, tense quiet atmosphere
commands: ["slow push-in on all long shots", "slow zoom on the face in #2", "add a creeping zoom to the interview"]
related: [zoom.in, zoom.out, dolly.in]
evidence: {examples: 5, sources: 5, measured: "×1.46–2.17 in 1.6–5 s; 4 of 5 — strictly constant speed (×1.007–1.04/frame); 1 example — a slow zoom-out ×0.63 in 2 s", confidence: high}
