id: focus.attention_shift
family: focus
group: optics
level: C
aliases: [attention shift, in-frame attention hand-off, subject change without a cut, shifting the focus of attention, pass-off shot, single-shot hand-off]
what: within one continuous shot the main subject changes — focus, camera or blocking lead the viewer's eye from character A to character or object B without an edit cut
frames: |
  1. Hold on A: for 0.7–1.8 s the frame "belongs" to A — in focus, centered or in motion; B is already
     in the frame (blurred on another plane, small, at the edge) or is about to appear.
  2. Trigger: A turns away, drives past, leaves the frame; B rises into the frame, enters, takes off a mask;
     in the audio — a line of dialogue or a hit.
  3. Hand-off — by one of three means (often combined):
     a) focus: sharpness flows from A's plane to B's plane — a snap over 3–6 frames (0.12–0.24 s)
        or smoothly over 0.5–1.0 s; zone B becomes 2–10 times sharper, zone A 2–3 times softer;
     b) camera: a pan or tracking move across 110–150 % of the frame width in 1.6–2.2 s, or a push-in ×2.2–4.5
        over 1.9–2.8 s slowing toward the end — the frame comes to rest already on B;
     c) blocking: A leaves the frame or B steps into the foreground while the camera stays static.
  4. Landing: at least 1 s on B. The whole shot 2.2–6.6 s (typically 3–4 s).
variants:
  - focus there-and-back: snap to the background, 1.2 s hold, snap back to the near character
  - passing object: an in-focus car crosses the foreground, after it the focus goes to the scene of the action
  - entering the frame: a blurred character rises or steps into the foreground, focus shifts to them
  - follow shot: the camera follows one character, they leave — the camera stays on a meaningful place or object
  - pan with a push-in: from a couple in the foreground to a lone figure in the distance
  - action: the character takes off a mask or costume — attention shifts to the revealed face
status: footage
fallback: code simulation — animate the blur from A to B using a mask or depth map (mediapipe / depth model); a digital pan or zoom-in between two subjects in a wide 4K frame; without source footage — generation of a single shot with a focus shift (with consent)
params:
  shot: 2.2–6.6 s (55–165 frames @25 fps), typically 3–4 s
  hold_a: 0.7–1.8 s before the hand-off
  rack: snap 0.12–0.24 s (3–6 frames) or smooth 0.5–1.0 s (12–25 frames), ease inOutCubic
  rack_strength: sharpness of B ×2–10, A ×0.3–0.5; blur of the out-of-focus plane 6–14 px at 1080p
  camera: pan across 110–150 % of the width in 1.6–2.2 s; push-in ×2.2–4.5 over 1.9–2.8 s, ease-out
  hold_b: at least 1 s after landing
  return: optional shift back after 1–1.5 s
when: dialogue or a pair of characters without a cut; revealing a second character or a threat in the background; hinting at an important object or place (the camera stays after the character has left); an "object → person" link in product edits; establishing the place after a drive-by. Lands well on a change of phrase or on a downbeat; 1–2 times per minute
avoid: fast cutting with shots shorter than 2 s — the hand-off can't be read in time; deep focus with no separation of planes when simulating in code; a mask or depth map that "jitters" on hair and edges; two shifts in a row without a hold
sfx: a quiet rise of the ambience or an "inhale" on the hand-off; on a focus snap — a short click or whoosh; on a follow shot — footsteps and the location's ambience; the landing on B can be accented with a hit
genres: {drama: signature, teaser: allowed, product: allowed, calm: allowed, epic: allowed, travel: allowed, fashion: allowed, explainer: allowed, motivation: allowed}
detect: |
  No cuts (ed_motion cuts are empty or only false ones on a fast pan), yet the main subject changes. Signatures:
  (1) focus — the camera is almost static (no events, or shake <1 %), but the sharpness map flips: cell A's Laplacian
  energy falls ×0.3–0.5, cell B's grows ×2–10 within 0.12–1.0 s, the frame histogram barely changes;
  (2) camera — a long SHIFT of 100–150 % of the frame or a ZOOM-IN ×2–4.5 with ease-out, after which the motion dies down on the new subject;
  (3) blocking — a static frame with a large local change (a subject exits or enters), often together with (1).
  Difference from focus.rack: there the optical shift itself is the point, here — the change of subject by any means.
  From an ordinary pan: at the end of the movement the frame has a different center of meaning, and the camera stops on it.
engine: |
  focus: depth_map(model='depth_anything') | mask(method='mediapipe_person')
  → focus_pull(from=track(A), to=track(B), t=[t0, t0+0.6], ease='inOutCubic', max_blur=10)
  camera: transform(center=track(A)→track(B), scale=[1, 2.5], t=[t0, t0+2], ease='outCubic') on a 4K or wide source
  blocking: only shot selection (detect) and a music landing point at the moment A exits
  put the hand-off landing on a beat or on the start of B's line.
gen_hint: single continuous shot with shallow depth of field, focus starts on <subject A> in the foreground, then <A turns away / drives out of frame> and the focus smoothly racks to <subject B> in the background, camera holds still, cinematic
commands: ["shift attention from him to her within one shot on #6", "no cut: focus from the car to the sign", "follow the waitress and stay on the family at the table", "on the drop, focus from the foreground to the character behind"]
related: [focus.rack, focus.shallow, focus.split_diopter, track.follow, zoom.in]
evidence: {examples: 12, sources: 12, measured: "whole shot 2.2–6.6 s; there-and-back focus snap 3–6 frames, hold 1.2 s; smooth shifts 0.75–1.0 s, background sharpness ×2.1–10; follow shots −110…−150 % of the frame over 1.6–2.2 s, push-ins ×2.2–4.5 over 1.9–2.8 s with ease-out; 5 of 12 with a focus shift, 6 with camera movement, 6 with a character exiting or entering (often combined)", confidence: medium}
