id: focus.split_diopter
family: focus
group: optics
level: B
aliases: [split diopter, double focus, two planes in focus, split focus]
what: a half lens keeps two planes sharp at once — a close-up face at the edge of the frame and a distant figure in the other half; a soft vertical seam between them
frames: |
  1. Composition: a close-up face (60–100 % of the frame height) takes up 40–55 % of the width at the right (6 of 10)
     or left (4 of 10) edge; in the other half — a distant subject: a full figure, a couple of people, a swimmer
     in the sea, a window with a passer-by (from 5 to 80 % of the frame height). Both are sharp, although meters of distance separate them.
  2. Seam: a vertical (less often slightly slanted) soft band 5–15 % of the frame width wide, at 0.40–0.60 W;
     everything in it is blurred. The seam is hidden along a vertical — a door frame, the edge of a curtain, a post, the edge of hair.
  3. The camera is locked off (8 of 10, jitter ≤0.11 % of the frame; otherwise the seam "slides"), movement only within the frame:
     the far character enters, speaks, leaves; the near one reacts, barely moving.
  4. Shot 2.6–3.5 s (65–90 frames @25 fps), from 1 to 6 s.
variants:
  - face on the right, distant figure on the left — the most common variant
  - face on the left, event on the right — a window, a street, a threat behind their back
  - diagonal seam — the boundary runs at a slant along the edge of hair or a shoulder
  - threat in the depth — the distant subject "closes in", the near character doesn't see it
  - surreal — the far plane is almost as sharp as the face despite a huge difference in distance
status: footage
fallback: simulation from two takes with a static camera — one focused on the face, the other on the far plane — joined by halves with a soft seam 6–10 % of the width; or from one deep-focus frame (phone, wide angle) — blur the seam band and the intermediate depth via a depth map; without source footage — generation with consent
params:
  near_face: 60–100 % of the frame height, 40–55 % of the width, at the edge
  far_subject: in the other half, 5–80 % of the height
  seam: x 0.40–0.60 W, width of the blurred band 5–15 % W (typically 8 %), Gaussian feathering
  seam_blur: σ within the band ≈1–2 % of the width
  angle: 0° (vertical), up to ±15° along the edge of hair or a shoulder
  camera: static, jitter ≤0.1 % of the frame
  shot: 2.6–3.5 s (65–90 frames @25 fps)
when: tension and suspense (the character doesn't notice the threat behind them); two characters in one thought or conflict without a cut; the near one's reaction to what the far one is doing; retro thriller, noir, a pastiche of 70s cinema; 1 per scene — the device is noticeable
avoid: a moving camera; faces at the same distance — no effect; a seam through a face or an important object; frequent repetition; calm, everyday videos without dramatic tension
sfx: silence or a low drone; the sound of the far plane (footsteps, a voice) is heard as clearly as the near one's breathing — "double hearing"
genres: {drama: signature, teaser: allowed, fashion: allowed, fanedit: allowed, epic: allowed, calm: forbidden, explainer: forbidden}
detect: |
  ed_motion — static (no events, shake ≤0.1 %). Column-wise sharpness map: two sharp areas at the sides and a dip
  in Laplacian energy in a vertical band 5–15 % of the width between them (energy in the band 0.4–0.8 of the sides);
  in one half a large face (face ≥60 % of the height), in the other — small sharp details of the far plane.
  Difference from focus.shallow: there one spot is sharp, not two planes at different distances; from split screen: no hard
  border, the background continues through the seam; from deep focus: the middle depth (floor, walls between the characters) is blurred.
engine: |
  split_focus(near=clip_a(focus='near'), far=clip_b(focus='far'), seam_x=0.5, seam_width=0.08, angle=0, feather='gauss')
  — two takes with a static camera; a single deep-focus frame: depth_map → blur(kind='lens', amount=0.015) through the mask
  "seam band + middle depth", the face and the far plane without blur.
gen_hint: split diopter shot, extreme close-up of <person A> on the right edge and <person B> standing far in the background on the left, both in perfect sharp focus, soft blurred vertical seam between them, locked-off camera, 1970s thriller look
commands: ["make a split diopter — face on the right, her in the distance on the left", "on #4 two planes in focus with a soft seam", "join two takes into a double focus"]
related: [focus.shallow, focus.rack, focus.attention_shift, frame.two_shot, layout.split_screen]
evidence: {examples: 10, sources: 10, measured: "face 40–55 % of the width at the right edge in 6, at the left in 4; seam ≈0.40–0.60 W, blurred band ≈5–15 % W (energy in the seam 0.37–0.80 of the sides, estimate partly visual); static in 8 of 10 (shake 0.02–0.11 %), in 2 — 0.5–0.65 %; shot 0.95–6 s, typically 2.6–3.5 s", confidence: high}
