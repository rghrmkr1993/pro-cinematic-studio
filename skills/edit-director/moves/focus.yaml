id: focus.tilt_shift
family: focus
group: optics
level: B
aliases: [tilt-shift, miniature, scale-model effect, miniature faking, toy world, fake tilt-shift]
what: a sharp horizontal band across the middle of a high-angle wide shot, everything above and below smoothly blurred, colors saturated, motion sped up — a real city or landscape looks like a toy scale model
frames: |
  1. Source: a wide shot from a high vantage point or from a drone angled 30–60° down — a city, a port, a construction site,
     a village, a landscape; the objects are small (people and cars 1–5 % of the frame height).
  2. Sharpness band: horizontal, centered at 0.45–0.55 H (sometimes lower, down to 0.7 H — following the main subject),
     height 20–30 % H; the blur grows smoothly toward the top and bottom — from ≈0.05–0.1 % of the width in the band to 0.5–1 %
     (and more) at the edges; the band is 2–6 times sharper than the edges.
  3. Color: saturation raised (in 6 of 8 the median S is 95–195 of 255), higher contrast, often a warm shift —
     "toy paint".
  4. Motion: the camera is locked off (5 of 8) or drifts slowly — an orbit turning ≈18°/s, a push-in ×1.37 over 2.5 s;
     objects inside are sped up (timelapse ≈×4–20): a ship crosses half the frame in 1.5 s, machinery "jerks"
     at 7 fps, cuts every 1.7–3.4 s.
  5. Shot 1.5–4.8 s; a series of timelapses — up to 14 s.
variants:
  - static timelapse of a city or port with the band on a road or an embankment
  - drone orbit — the band holds on the main subject, the frame edges swim
  - construction site or production — sped-up machinery, cuts every 2–3 s
  - a "game" world — computer graphics or a game with simulated tilt-shift
  - opening shot under a title — a calm landscape with a small house in the band
status: code
fallback: needs a high-angle wide shot with small objects — look in the source footage for drone shots, rooftops, viewpoints (detect by high angle); on an eye-level shot the effect doesn't read; without source footage — generation of an aerial shot or stock timelapses
params:
  band_center: 0.45–0.55 H (move it onto the main subject, up to 0.7 H)
  band_height: 20–30 % H, transition to blur 15–25 % H on each side
  max_blur: 0.6–1.5 % of the frame width at the edges (σ ≈12–30 px at 1920), kernel — a disc
  angle: 0° (horizontal), up to ±10° along the line of a road or shore
  saturation: +20–40 %, contrast +10 %, a slight warm shift
  speed: ×4–12 (timelapse) or frame-step down to 8–12 fps for "puppet-like" motion
  camera: static, or a slow orbit, or a push-in ≤×1.4 over 2.5 s
  shot: 1.5–5 s (38–125 frames @25 fps)
when: an establishing shot of the place at the start of the video or a chapter; travel and city — "look from above"; an ironic display of bustle (construction, traffic, a crowd); an intro under a title; a transition between locations; a childlike, playful tone; 1–3 shots in a row in one section
avoid: close-ups and people near the camera — the effect doesn't read; an eye-level frame or a centered horizon without depth; the band cuts through the main subject; equal blur at the top and bottom with strong upward perspective; dramatic and serious moments — the effect is toy-like
sfx: a light toy-like or musical texture (celesta, xylophone, a wind-up mechanism), sped-up city noise; clicks and a "tick-tock" under the sped-up motion
genres: {travel: signature, viral: allowed, explainer: allowed, product: allowed, calm: allowed, ugc: allowed, fanedit: allowed, teaser: allowed, drama: forbidden}
detect: |
  Sharpness profile across horizontal bands (Laplacian energy normalized by contrast): a peak in one band
  20–30 % of the height near the middle, a 2–6 times falloff toward the top and bottom; the edge-based blur estimate rises monotonically from the band
  to the edges (≈0.05 → 0.5–1 % of the width). High angle, small objects, saturation above the video's average.
  ed_motion: static or a slow ZOOM/ROTATE (orbit), often cuts every 1.7–3.4 s and a low frame rate (7–14 fps)
  in timelapses; objects move too fast for their scale.
  Difference from focus.shallow: what is sharp is not a spot around the subject but a horizontal band across the full width; from vignette and
  haze — the top and bottom are blurred, not the corners or the whole frame.
engine: |
  tilt_shift(center_y=0.5, band=0.25, transition=0.2, max_blur=0.01, angle=0, kernel='disc')
  + color(params={saturation: 1.3, contrast: 1.1, warmth: 0.05}) + speed(rate=6, interp='drop') or step_print(hold=2)
  ffmpeg: two copies — gblur(sigma≈20 at 1920) and the original, alphamerge along a vertical gradient mask; then eq=saturation=1.3.
gen_hint: tilt-shift miniature effect, high angle aerial view of <a busy town / harbor / construction site>, narrow horizontal band of sharp focus in the middle, strong blur at top and bottom, saturated toy-like colors, time-lapse motion
commands: ["tilt-shift on the drone shot at the start", "scale-model effect on all wide shots of the city", "miniature with a speed-up on the construction site", "toy city under the title in the intro"]
related: [focus.shallow, drone.aerial, time.speed_ramp, time.timelapse, scene.diorama]
evidence: {examples: 8, sources: 7, measured: "sharpness band at 0.41–0.69 H (typically 0.44–0.53), height 0.25–0.5 H; band sharpness ×1.5–5.8 relative to the edges; blur on large frames grows from 0.03–0.11 % to 0.5–1.04 % of the width at the edges (edge-based estimate, large values underestimated); saturation 92–195 of 255 in 7 of 8; static 5 of 8, orbit 66° over 3.8 s, push-in ×1.37 over 2.5 s; timelapse 7 fps with cuts every 1.7–3.4 s", confidence: high}
