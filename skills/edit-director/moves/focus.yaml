id: focus.bokeh
family: focus
group: optics
level: B
aliases: [bokeh, defocus into lights, bokeh circles, out-of-focus lights, defocus transition]
what: out-of-focus point lights turn into soft glowing discs — a background behind the character, an abstract backdrop, or a transition through defocus
frames: |
  1. Discs: diameter 3–30 % of the frame width, typically 6–12 %; on pure abstract backdrops 12–23 %,
     "giant" ones — up to 30 %. Soft edges, the circles are almost regular (aspect ratio >0.6), the colors of the lights
     are preserved, bright discs overlap and add up in light.
  2. Portrait on bokeh: the character is sharp, behind or in front of them 1–8 large discs; in slow-motion footage
     of a walking character the discs slowly drift.
  3. Defocus transition: sharpness of the whole frame drops by 80–90 % over 1–2 s (almost linearly or with a fast
     start), city lights become a scatter of discs 2–5 % of the width (up to 8 per frame); there is also the reverse
     move — focus gathering back over 0.9–1.5 s.
  4. Pulse: in focus → defocus over ≈1.9 s → hold blurred for 2–2.5 s → back into focus over ≈1.5 s.
variants:
  - portrait on bokeh — the face is sharp, large colored discs to the side or behind
  - through bokeh — the character behind a blurred colored "veil" in the foreground
  - pure backdrop — only discs of light without a subject, 1–3 s
  - defocus into lights — a night street or club smoothly dissolves into discs (ending, transition)
  - pulse — defocus and return within one shot
  - macro detail on a creamy background — the object is sharp, the background uniform with 1 disc
status: code
fallback: the lights must be in the frame itself — without point sources defocus only gives "mush"; a portrait on bokeh without source footage — a mask of the character + an overlaid backdrop of lights, or generation; the backdrop can be a separate clip
params:
  disc: diameter 6–12 % of the width (backdrops 12–25 %, accent up to 30 %); kernel — a disc, a slight "cat's-eye" shape toward the edges optional
  highlights: before blurring, boost highlights above 0.85 brightness ×2–4, otherwise the discs are dull
  defocus: 1–2 s (25–50 frames), linear or outCubic; return 0.9–1.5 s, inOutCubic
  pulse: 1.9 s out of focus, 2–2.5 s hold, 1.5 s back
  plate: 1–3 s of backdrop under a title or between scenes
  motion: discs drift 0.5–2 % of the frame per frame — a camera move or a "breathing" zoom
when: intros and endings (dissolving into lights), a transition between scenes (defocus → cut → focus), a backdrop under a title or song lyrics, night, festive, club and romantic scenes, a memory or a "floating" state; a glamour walk of the character in slow motion. Once per section, no more often
avoid: daytime shots without point lights; small high-contrast text over busy discs; a long defocused pause without music; a cheap overlaid backdrop that doesn't match the frame in color and perspective
sfx: on the defocus — a soft swell or whoosh, the music can be "taken underwater" with a low-pass in step with the blur; on the focus return — a reverse sweep or a click
genres: {fashion: signature, teaser: allowed, drama: allowed, calm: allowed, product: allowed, travel: allowed, fanedit: allowed, motivation: allowed, epic: allowed, viral: allowed}
detect: |
  Bright spots (above the 92nd percentile and 150/255) — round (aspect ratio >0.6, bounding-box fill 0.6–0.9),
  diameter 3–30 % of the width; overall frame sharpness is low. Transition: Laplacian energy of the whole frame falls by 80–90 %
  over 1–2 s at constant brightness and without global motion (ed_motion — no events), the histogram doesn't jump;
  pulse — a fall and a rise within one shot. Difference from halation/glow: there the glow surrounds a sharp source, no discs;
  from focus.rack: the whole frame goes out of focus, there is no new plane of sharpness; from motion blur — the spots are round, not stretched.
engine: |
  blur(kind='lens', kernel='disc', radius=curve([[t0, 0], [t0+1.5, 0.05]]), highlight_boost=3, threshold=0.85)
  — defocus transition; transition(kind='defocus', dur=1.0, params={radius: 0.05}) between clips.
  Portrait on bokeh: mask(method='mediapipe_selfie') → background blur(kind='lens', radius=0.04, highlight_boost=3) → composite.
  Backdrop: the same blur on a night shot with lights, radius 0.06–0.12, slow transform(scale=[1, 1.05]).
gen_hint: dreamy night scene dissolving into large soft circular bokeh, colorful out-of-focus city lights, <subject> sharp in the foreground, 50mm f/1.2, slow drifting light orbs
commands: ["dissolve into lights at the end", "defocus transition between #5 and #6", "bokeh backdrop under the text in the intro", "blur the background into colored circles on the close-up"]
related: [focus.shallow, focus.rack, light.halation]
evidence: {examples: 9, sources: 9, measured: "disc diameter 3–30 % of the width, per-clip median 3.2–30 % (typically 6–12 %), backdrops 12–23 %; defocus into lights over ≈2 s, final discs 2–5 % of the width, up to 8 per frame; pulse 1.9 s out of focus, return ≈1.5 s; reverse focus gathering 0.9 s; shots 0.8–6.2 s", confidence: medium}
