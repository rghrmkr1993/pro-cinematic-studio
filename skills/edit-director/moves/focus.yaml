id: focus.rack
family: focus
group: optics
level: B
aliases: [rack focus, focus shift, refocus, focus pull, follow focus, snap focus]
what: within one shot the plane of focus travels from one subject to another — the foreground blurs, the background turns sharp (or vice versa); guides the eye without a cut
frames: |
  1. Hold: for 0.4–1.6 s subject A (a face, hands, an object) is in focus, B on another plane is blurred.
  2. Shift: B's sharpness grows, A melts away; the B/A sharpness ratio flips by a factor of 6–40.
     Speed — three modes: a snap of 0.24–0.27 s (6–7 frames @25 fps, almost linear),
     normal 0.6–0.7 s (15–17 frames), slow 1.2–1.4 s (30–35 frames, S-curve: slow
     start, fast middle, soft landing).
  3. Lens "breathing": the frame scale changes in sync by 3–8 % — when shifting to the far plane
     the picture shrinks slightly (×0.93–0.95), to the near plane — it enlarges (×1.05–1.16).
  4. Landing: at least 0.6 s on B; in the there-and-back variant — 2–2.5 s on B and a return over 0.6–3.4 s.
     The camera is usually locked off or drifts slightly (shake <1 % of the frame).
variants:
  - background reveal — the large foreground character melts away, behind them a crowd or a hall snaps sharp
  - to the near plane — from the far conversation partner to the near one, from banknotes to a scoreboard, from the background to a hand
  - following an object — focus follows a weapon or an object being brought toward the lens, and returns to the face
  - there-and-back — shift to the far plane, hold, return to the character, who has turned around again
  - the "breath" — the same subject drifts out of focus and comes back (0.3 s out, 1.4 s back) as a rhythmic accent
status: footage
fallback: simulation — a depth map (depth model) or two masks A and B, A's blur grows, B's falls along a curve + 3–5 % scale for the "breathing"; works if A and B are on different planes; a single-plane frame cannot be racked — generation with consent or another shot from the source footage
params:
  duration: snap 0.25 s (6 frames), normal 0.65 s (16 frames), slow 1.3 s (32 frames); return 0.6–3.4 s
  ease: inOutCubic for ≥0.5 s, linear for a snap
  hold_before: 0.4–1.6 s
  hold_after: at least 0.6 s; there-and-back — 2–2.5 s on the second plane
  blur: out-of-focus plane σ ≈0.5–1.5 % of the frame width, disc kernel
  breathing: scale ×0.95 when shifting far, ×1.05 when shifting closer, in sync with the focus curve
  swing: B/A sharpness changes by a factor of 6–40
when: revealing a threat, a crowd or a place behind the character; dialogue without a cut (from the speaker to the listener); an "object → person" link in product and drama edits; a reaction; a focus snap on a downbeat or a hit in the music; 1–3 times per minute, snaps — as a series in a verse
avoid: deep focus with no separation of planes; a shift between subjects at almost the same distance — no visible difference; unmotivated focus "hunting"; fast cutting shorter than 1.5 s; a simulation with a ragged mask and equal sharpness across the whole depth
sfx: on a snap — a quiet click or tick; on a slow shift — a swell; a "sound rack" — together with the focus, bring up the sound of the new plane (crowd, location noise) and duck the old one
genres: {drama: signature, teaser: allowed, product: allowed, calm: allowed, fashion: allowed, epic: allowed, explainer: allowed, travel: allowed, motivation: allowed, ugc: allowed}
detect: |
  The camera is almost static (ed_motion without large events, shake <1 %), but two zones of the sharpness map swap places:
  Laplacian energy (normalized by contrast) falls in zone A and rises in zone B, the B/A ratio changes by a factor of 6–40
  within 0.24–1.4 s; the histogram is stable, no cut. Breathing signature: a synchronous small ZOOM ×0.92–0.95 or ×1.05–1.16
  centered near the middle of the frame with nonrigid <0.35. Difference from focus.bokeh (defocus): a new plane becomes sharp,
  rather than the whole frame going soft; from zoom.in — the scale changes by less than 10 %, while sharpness is redistributed;
  from focus.attention_shift — that one is broader: attention can be handed off by the camera and by blocking as well.
engine: |
  focus_pull(from=track(A), to=track(B), t=[t0, t0+0.65], ease='inOutCubic', depth='depth_anything',
  max_blur=0.012, kernel='disc', breathing=0.04)
  — internally: blur by |depth − focus depth(t)| + transform(scale=[1, 0.96]) in sync when shifting far.
  Snap on the beat: focus_pull(..., t=[beat−0.12, beat+0.12], ease='linear'). There-and-back — two focus_pull calls with a 2 s hold.
gen_hint: rack focus shot, <subject A> sharp in the foreground with <subject B> blurred behind, then focus smoothly pulls to <subject B> as A turns away, shallow depth of field, locked-off camera, subtle lens breathing
commands: ["rack focus from the foreground to the crowd on #7", "shift focus from the bottle to the face on the drop", "focus snap on every downbeat in the verse", "focus there and back in the dialogue at 0:42"]
related: [focus.attention_shift, focus.shallow, focus.bokeh, focus.split_diopter, zoom.in]
evidence: {examples: 12, sources: 12, measured: "shifts within the fragment in 10 of 12 (2 — an already held end frame): snaps 0.24–0.27 s, normal 0.6–0.7 s, slow 1.2–1.4 s with an S-curve, very slow returns up to 3.4 s; hold before the shift 0.4–1.6 s, there-and-back — 2–2.5 s on the second plane; B/A sharpness ×6–40; breathing ×0.93–0.95 far and ×1.05–1.16 closer; camera static, shake 0.03–1 %", confidence: high}
