id: focus.shallow
family: focus
group: optics
level: B
aliases: [shallow depth of field, shallow DOF, blurred background, portrait mode, cinematic blur, shooting through the foreground]
what: shallow depth of field — only the character or object is sharp, the foreground and background are softly blurred; isolates the subject and guides the eye without editing
frames: |
  1. Sharp zone — 20–45 % of the frame area (a face, hands, an object); the rest is soft: blur ≈ a Gaussian with
     σ 0.5–1.5 % of the frame width (≈10–30 px at 1920), on macro details up to ≈3 % (≈60 px).
  2. Three depth schemes (8 examples):
     a) the character sharp against a blurred background, background highlights — discs (1);
     b) the character behind a blurred foreground — foliage, the edge of furniture, another person's head,
        soft "dirt" covers 40–60 % of the frame, a peeping point of view (4);
     c) a sharp object in the foreground, the person behind it blurred — the detail matters more than the face (3).
  3. The camera is static or drifts slowly; in a lateral tracking move the blurred foreground "flies past"
     across 100–130 % of the width in 2.7 s while the character almost stands still — strong parallax.
  4. Shot 2.1–4.5 s; a blurred foreground object may leave the frame and reveal the character.
variants:
  - portrait isolation — the face is sharp, the background with disc highlights
  - through the foreground — the character seen through blurred foliage, glass, objects
  - object first — a badge, a glass, souvenirs are sharp, their owner behind them blurred
  - reveal — a blurred head or figure in the foreground moves away and reveals the sharp character
status: hybrid
fallback: real shallow DOF from the source footage is better (detect); simulation — a person mask or a depth map + disc blur of the background; a blurred foreground can't be created in code — look for a shot through objects or generate one
params:
  focus_area: 20–45 % of the frame area
  bg_blur: σ ≈0.5–1.5 % of the width (10–30 px @1920), macro up to ≈3 %; kernel — a disc (highlights into circles), not a Gaussian
  fg_blur: blurred foreground 40–60 % of the frame, stronger than the background (σ from 1.5 % of the width)
  falloff: blur grows with distance from the plane of focus — via a depth map, not a binary mask
  mask_feather: 1–2 % of the width along the character's edge, hair — with a separate soft mask
  shot: 2–4.5 s (50–110 frames @25 fps)
  camera: static or a drift of ≤1 % of the frame per frame; a tracking move along the foreground adds depth
when: emotional close-ups and intimate moments; singling out an object or a product; peeping through the foreground; details and B-roll; interviews and talking heads; calm and "cinematic" stretches between dynamic ones. Works almost anywhere; contrast with the deep focus of neighboring shots strengthens the effect
avoid: when the location or a group of people is itself the subject of the frame; fast action where focus misses; a simulation with ragged mask edges on hair; the same blur across the whole depth (gives the fake away); titles and numbers in the blurred zone
sfx: no sound of its own; "sound focus" — duck the ambience and music (low-pass, −3…−6 dB), leaving the voice or the sound of the in-focus object clean
genres: {product: signature, fashion: signature, drama: signature, calm: allowed, travel: allowed, epic: allowed, explainer: allowed, ugc: allowed, motivation: allowed, teaser: allowed, fanedit: allowed}
detect: |
  Sharpness map of 16×9 cells (Laplacian energy normalized by the cell's contrast): the sharp area is a compact
  spot of 20–45 % of the frame, the energy ratio of sharp cells to soft ones 2.3–5.1; blur estimate from the strongest edge
  in a cell: sharp ≤0.15 % of the width, soft ≥0.5 %. Bright points in the soft zone are round discs.
  ed_motion: camera static or a slow SHIFT; if a blurred foreground dominates — a large SHIFT
  (100 %+ of the frame) while the character stays still. Compare with neighboring shots: with deep focus, sharpness is even across the frame.
  Difference from focus.tilt_shift: the sharpness is a spot around the subject, not a horizontal band; from focus.rack — the plane
  of focus doesn't move; from lens.vignette — the edges are soft in sharpness, not in brightness.
engine: |
  dof(focus=track(face|object:<name>), depth='depth_anything', kernel='disc', max_blur=0.012, fg_blur=0.02,
  highlight_boost=2) — synthetic DOF; without a depth model: mask(method='mediapipe_selfie', feather=0.015)
  + blur(kind='lens', amount=0.01) on the background only + composite. On a 4K source, blur before downscaling.
gen_hint: cinematic shot with very shallow depth of field, <subject> in sharp focus, foreground <leaves/objects> and background melted into soft bokeh, 85mm lens wide open at f/1.4
commands: ["blur the background on #3, keep the character sharp", "make a shallow depth of field shot on the product", "as if shot through foliage in the intro", "portrait mode on all close-ups"]
related: [focus.bokeh, focus.rack, focus.attention_shift, focus.tilt_shift, focus.split_diopter]
evidence: {examples: 8, sources: 8, measured: "sharp zone ≈20–45 % of the frame; sharp/soft energy ×2.3–5.1 (through foliage ×1.7); blur of the soft zone ≈0.3–1.3 % of the width, macro ≈3 % (edge-based estimate, calibrated on synthetic data, large values underestimated); shot 2.1–4.5 s; foreground during a tracking move −132 % of the frame over 2.7 s; schemes: background 1, foreground 4, object first 3", confidence: medium}
