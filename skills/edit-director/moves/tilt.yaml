id: tilt.basic
family: tilt
group: camera
level: A
aliases: [tilt, tilt up, tilt down, vertical pan, pan up, pan down, camera tilt, tilt reveal]
what: the camera stays in place and tilts up or down — the eye glides from one point of interest to another and reveals it (detail → face, top → people, face → hands)
frames: |
  1. Start: 0–0.6 s of stillness on the first point — an object, shoes, the floor, the ceiling, the sky or a face.
  2. Tilt: the picture travels strictly vertically by 0.35–1.7 of the frame height (typically 0.6–1).
     A slow tilt — 10–32 % of the frame height per second (at the peak 0.5–2 % per frame @25 fps), lasts 3–3.5 s.
     A fast one — 65–270 %/s (at the peak 6–18 % per frame), 0.6–1 s, with vertical motion blur: sharpness in the middle
     drops to ×0.35–0.45. The curve — an S (acceleration and deceleration) or acceleration with a hard stop on the target.
  3. Landing: the frame settles on the second point — a face, a group of people, a window, hands — and holds for 0.6–1.5 s.
  The camera position doesn't change, so there is no parallax; only the perspective changes: verticals converge,
  and on an ultra-wide lens the picture also "pulls out" along the way (×0.6–0.7) and rotates by up to 50°.
variants:
  - up "detail → face": from an object in the hand or the shoes to the character's face, fast (0.6–0.9 s), landing on a close-up or medium shot
  - down "top → onlookers": from a figure or object above to the people looking at it; reveals the reaction
  - down "face → hands": a slow (≈3 s) move from the face to what the hands are doing
  - slow reveal of the space: ≈10 %/s from the floor to a window or the horizon, then a long hold
  - wide-angle: a tilt on an ultra-wide lens with roll and a "pull-out" — more dynamic, suits interiors
status: footage
fallback: |
  Code simulation — a crop with vertical headroom: the source must be taller than the frame by a factor of (1 + shift) —
  a vertical video or photo in a horizontal video (×3 headroom), 4K → 1080p (×2 headroom), a panorama.
  Without perspective change a digital tilt is honest only on a short shift (≤0.3 of the frame) or a telephoto shot;
  for a wide angle — a slight vertical keystone. No source — generation with the user's consent.
params:
  direction: up | down
  travel: 0.35–1.7 of the frame height (typically 0.6–1.0)
  speed_slow: 10–32 %/s (0.4–1.3 % per frame @25 fps, peak up to 2 %), duration 3–3.5 s (75–88 frames)
  speed_fast: 65–270 %/s (2.6–11 % per frame, peak 6–18.5 %), duration 0.6–1 s (15–25 frames)
  ease: inOutCubic (main); fast to a detail — inCubic with a hard stop; slow — almost linear with a soft outQuad landing
  hold_before: 0–0.6 s (0–15 frames)
  hold_after: 0.6–1.5 s (15–38 frames) on the target
  motion_blur: only on the fast one — vertical directional motion blur ∝ speed; off on the slow one
  target: the final point — a face in the upper third or a group of people in the center
  digital_reserve: source height ≥ (1 + travel) × frame height; upscale ceiling ×1.5
when: |
  Reveal who a detail belongs to (object → face), show the onlookers' reaction (object above → onlookers),
  connect a face and an action (face → hands), show the full look (shoes → face), the scale of a place (from a person upward).
  Intro and hook — a fast tilt landing on a downbeat; build and calm parts — a slow one.
  No more than one tilt reveal per scene; a fast one — no more often than once every 4–8 bars.
avoid: |
  No second point of interest — the camera "runs into" an empty wall or sky; a landing that misses the target (face cut off
  or drifting out); a cut in the middle of a slow tilt; tilting straight back; a digital tilt without vertical headroom
  (mush from upscaling); a slow tilt in choppy editing with shots shorter than 1.5 s — it doesn't have time to read.
sfx: slow — no SFX, or a pad / soft riser on the way up; fast — a short whoosh on the snap and an accent (impact, bass) on the landing
genres: {fashion: signature, travel: signature, epic: allowed, drama: allowed, calm: allowed, product: allowed, ugc: allowed, teaser: allowed, motivation: allowed, explainer: allowed, clips: allowed, sport: allowed, viral: allowed}
detect: |
  ed_motion: SHIFT "content moves UP (camera tilts down)" or "content moves DOWN (camera tilts up)" by 35–170 %
  of the frame; horizontal shift no more than a third of the vertical; nonrigid 0.09–0.18 (camera rotation, no parallax).
  On an ultra-wide lens the shift comes with a ZOOM-OUT ×0.6–0.7 and a ROTATE of up to 50° — this is distortion, not
  separate moves. Fast variant: peak 6–18 %/frame, sharpness ×0.35–0.45.
  Difference from a vertical camera lift (pedestal, crane): there the foreground moves faster than the background, nonrigid > 0.3.
  Difference from tilt.whip: a whip peaks above 20 %/frame @25 fps and 2–5 consecutive frames are unreadable (sharpness < ×0.3,
  tracking is lost — ed_motion marks "cuts" there); a fast tilt with ×0.35–0.45 blur remains readable.
  A digital "tilt" by cropping: verticals stay parallel, nonrigid < 0.05.
engine: |
  footage: find a shot with vertical shift in the source footage (ed_motion SHIFT along Y, nonrigid < 0.2) and cut it by
  hold_before / hold_after; place a fast tilt so that the landing falls on a beat.
  code: transform(scale=[S, S], shift=[[0, +a], [0, -a]], t=[t0, t0+D], ease='inOutCubic') — shift in fractions of the frame,
  2a = travel, S ≥ 1 + travel in height; fast — + blur(kind='directional', angle=90, amount∝speed);
  for a wide-angle look — keystone(axis='v', amount=0.05–0.12, t) in sync with the shift.
gen_hint: smooth cinematic tilt up from <detail, e.g. shoes on a wooden floor> to reveal <subject's face>, camera stays in place and only rotates vertically, gentle start, settles and holds on the face
commands: ["tilt up from the shoes to the face at the start of #2", "slow pan down from the sky to the people in the intro", "camera tilt from the face to the hands at 0:14", "fast tilt to the character on the drop"]
related: [tilt.whip, zoom.in, zoom.slow]
evidence: {examples: 6, sources: 6, measured: "shift 0.34–1.7 of the frame height; 3 up, 3 down; slow ones 10–32 %/s over 3.2–3.5 s, fast ones 65–270 %/s over 0.6–1 s (peak 6–18.5 %/frame @25 fps, sharpness ×0.35–0.44); S-curve in 3 of 6, acceleration with a hard stop in 1; hold afterwards 0.6–1.5 s; nonrigid 0.09–0.18; wide-angle example — ×0.68 and a 52° roll over 3.2 s", confidence: high}
