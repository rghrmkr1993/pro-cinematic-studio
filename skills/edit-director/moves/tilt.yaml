id: tilt.whip
family: tilt
group: camera
level: B
aliases: [whip tilt, swish tilt, vertical swish, snap tilt, camera whip up, camera whip down, vertical whip]
what: a lightning-fast camera whip up or down with solid vertical motion blur — in half a second it throws the eye to a target above or below, or takes it out of the scene
frames: |
  1. Hold of 0.3–2.2 s on the first subject (a hand on a ring, the horizon, the character); sometimes a slow pull-out runs on top.
  2. Acceleration over 2–5 frames: vertical speed grows 2 → 6 → 13 → 18 % of the frame height per frame.
  3. Core of 2–5 frames (0.1–0.25 s): solid vertical motion blur, the picture is unreadable, sharpness ×0.03–0.3 of the static value,
     speed 16–35 % of the frame height per frame (@20 fps; 13–28 % @25 fps). Brightness may jump — sky or lamps flying past.
  4. Deceleration over 3–6 frames with residual blur (11 → 7 → 5 %/frame) and a hard stop on the new target: a person
     above, a street or a threat below. Then a hold of at least 1 s. Total travel 0.8–3 frame heights in 0.5–0.65 s.
  Exit variant: the whip goes into darkness or the sky and the clip cuts off in the blur — the next shot enters with the same whip.
variants:
  - reveal up: from a detail (hands, an object) to the person above it, a hard landing on a low angle
  - reveal down: from a calm top (the horizon, the character) to what is below — a street, a crowd, a threat
  - scene exit: a whip up into the ceiling or the sky → darkness → cut; the pair "exit upward — enter from above" changes the location
status: code
fallback: |
  Code: a vertical whip transition between two shots — the outgoing shot accelerates with blur, the cut lands at the blur peak,
  the incoming one decelerates from the same direction; reads as a single camera whip if the second shot "lies" above or below the first.
  A whip within one shot — footage (search by the blur signature) or a tall source: vertical video, a 4K crop.
  Generation — only if a reveal is needed that the source footage doesn't have.
params:
  direction: up (the picture moves down) | down (the picture moves up)
  duration: 0.5–0.65 s in total (12–16 frames @25 fps); blur core 2–5 frames (0.1–0.25 s)
  travel: 0.8–3 frame heights (in code 0.6 of the height per shot is enough)
  peak_speed: 13–28 % of the frame height per frame @25 fps (≈ ×2 or more of a fast tilt)
  ease: acceleration inExpo 2–5 frames → deceleration outExpo 3–6 frames, no bounce
  blur: directional vertical, length at the peak ≈ 20–50 % of the frame height; sharpness ×0.03–0.3
  cut_at: in a transition — on the frame of maximum blur (the middle of the core)
  hold_before: 0.3–2 s
  hold_after: at least 1 s on the target; on an exit — cut right in the blur
when: |
  Revealing a character or a threat above/below on a downbeat or the drop; an energetic vertical scene change
  ("went up into the sky — came down from the sky in a new place"); a final exit from the scene. No more than 1–2 times per minute;
  in a series of transitions keep one direction.
avoid: calm and contemplative videos; a landing that misses the target; whips in random directions in a row; 24–30 fps source without motion blur — without blur the whip strobes, add the blur in code; a long hold before the whip in fast-paced editing
sfx: a whoosh peaking in the middle of the blur; on the landing — a hit or bass; a whip up — a rising whistle, down — a falling whoosh or sub_drop
genres: {viral: allowed, phonk: allowed, fanedit: allowed, sport: allowed, travel: allowed, teaser: allowed, clips: allowed, ugc: allowed, epic: allowed, calm: forbidden}
detect: |
  ed_motion: before the whip a SHIFT along Y with growing speed (6 → 18 %/frame), then 1–3 pairs marked as "cuts"
  (tracking loses points in the blur), after that a SHIFT in the same direction with decreasing speed; or the clip ends in the blur.
  Own measurement: 2–5 consecutive frames with sharpness < ×0.3 of the static value; gradient anisotropy Gy/Gx drops to ×0.3–0.65
  of its static value (the blur is vertical; for pan.whip it is Gx/Gy that drops). A brightness jump in the blur — sky or a light flying past.
  Difference from tilt.basic: there all frames are readable, peak ≤ 18 %/frame. From zoom.crash: the blur is radial, there is a ZOOM ×2.5+.
  From a cut with a flash: the blur shows streaks, not a white field.
engine: |
  transition: transition(kind='whip', dur=0.4, params={dir: 'up'|'down', axis: 'v', travel: 0.6, blur: 'directional',
  angle: 90, cut_at: 'peak'}) = A: transform(shift=[[0, 0], [0, ±0.6]], t=[tc-0.2, tc], ease='inExpo')
  + blur(kind='directional', angle=90, amount∝speed) → cut at tc → B: transform(shift=[[0, ∓0.6], [0, 0]],
  t=[tc, tc+0.24], ease='outExpo') + decreasing blur; sfx('whoosh', at=tc, align='peak') + sfx('impact', at=tc+0.24).
  Put tc on a beat; the landing of B — on the next downbeat or earlier.
  footage: search the source footage by the signature from detect and cut with hold_before ≤ 0.5 s.
gen_hint: fast whip tilt up from <a hand gripping something> to reveal <a person above>, the camera snaps vertically with heavy vertical motion blur for a few frames, then stops hard and holds on the subject
commands: ["snap tilt up to the character on the drop", "whip tilt between #3 and #4", "whip up into the sky at the end of #6 and come in from above in #7", "camera whip down to the threat at 0:21"]
related: [tilt.basic, pan.whip, trans.whip, zoom.crash]
evidence: {examples: 4, sources: 4, measured: "whole whip 0.5–0.65 s (10–13 frames @20 fps), blur core 2–5 frames; peak 16–35 % of the frame height per frame @20 fps; travel 0.8–3 frame heights; sharpness in the core ×0.03–0.3; Gy/Gx drops to ×0.3–0.65; 2 up, 2 down; 3 — a reveal within the shot with a hard landing and a hold of ≥1 s, 1 — going into darkness as a scene exit", confidence: medium}
