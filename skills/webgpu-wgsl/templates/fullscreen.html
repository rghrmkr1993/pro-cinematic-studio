<!doctype html>
<meta charset="utf-8">
<title>WebGPU fullscreen template</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c" role="img" aria-label="Animated concentric colour rings"></canvas>
<p id="msg" hidden style="color:#fff;font:16px system-ui;padding:1rem">WebGPU is not available in this browser.</p>
<script type="module">
// Inline copy of fullscreen.wgsl so the file runs standalone from a local server (WebGPU needs a secure context).
const wgsl = `
struct U { res: vec2f, time: f32, _pad: f32 };
@group(0) @binding(0) var<uniform> u: U;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}
@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let uv = (fc.xy * 2.0 - u.res) / min(u.res.x, u.res.y);
  let d = length(uv);
  let ring = 0.5 + 0.5 * cos(8.0 * d - 2.0 * u.time + vec3f(0.0, 2.0, 4.0));
  return vec4f(ring * smoothstep(1.4, 0.2, d), 1.0);
}`;
const canvas = document.getElementById("c");
const adapter = navigator.gpu && await navigator.gpu.requestAdapter();
if (!adapter) { document.getElementById("msg").hidden = false; throw new Error("no webgpu"); }
const device = await adapter.requestDevice();
const ctx = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({ device, format, alphaMode: "opaque" });
const module = device.createShaderModule({ code: wgsl });
const pipeline = device.createRenderPipeline({ layout: "auto",
  vertex: { module, entryPoint: "vs" }, fragment: { module, entryPoint: "fs", targets: [{ format }] } });
const ubuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const bg = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
new ResizeObserver(() => { const d = Math.min(devicePixelRatio, 2);
  canvas.width = Math.max(1, Math.round(canvas.clientWidth * d)); canvas.height = Math.max(1, Math.round(canvas.clientHeight * d)); }).observe(canvas);
const u = new Float32Array(4);
function draw(t) {
  u.set([canvas.width, canvas.height, t, 0]); device.queue.writeBuffer(ubuf, 0, u);
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
  pass.setPipeline(pipeline); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
}
function loop(now) { draw(reduce.matches ? 0 : now / 1000); if (!reduce.matches) requestAnimationFrame(loop); }
requestAnimationFrame(loop);
reduce.addEventListener("change", () => requestAnimationFrame(loop));
</script>
