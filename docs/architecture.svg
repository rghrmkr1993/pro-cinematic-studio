<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1170" width="1400" height="1170" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="ti de"><title id="ti">Pro Cinematic Studio architecture</title><desc id="de">Five layers: owner, creative-studio entry point, 14-agent crew pipeline, 70-skill library, and engines. Guardrails and example job flow.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FBBF24"/></marker></defs>
<rect width="1400" height="1170" fill="#0F172A"/>
<text x="30" y="38" font-size="24" fill="#F1F5F9" font-weight="700" text-anchor="start">Pro Cinematic Studio 1.0.0: layers, wiring and job flow</text>
<text x="30" y="60" font-size="13" fill="#CBD5E1" font-weight="400" text-anchor="start">70 skills, 14 crew agents, 3 engines. A brief goes in, a graded, scored and delivered film comes out.</text>
<rect x="30" y="78" width="1060" height="66" rx="12" fill="#162033" stroke="#475569" stroke-width="1.2"/>
<text x="48" y="100" font-size="12" fill="#FBBF24" font-weight="700" text-anchor="start">1  YOU (THE OWNER)</text>
<text x="560" y="123" font-size="16" fill="#F1F5F9" font-weight="600" text-anchor="middle">Describe a scene, a brief, or upload images</text>
<line x1="560" y1="144" x2="560" y2="170" stroke="#FBBF24" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="170" width="1060" height="100" rx="12" fill="#162033" stroke="#475569" stroke-width="1.2"/>
<text x="48" y="192" font-size="12" fill="#FBBF24" font-weight="700" text-anchor="start">2  ENTRY POINT: creative-studio skill</text>
<rect x="50" y="200" width="240" height="56" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.2"/>
<text x="64" y="222" font-size="13" fill="#F1F5F9" font-weight="700" text-anchor="start">Intake</text>
<text x="64" y="242" font-size="12" fill="#CBD5E1" font-weight="400" text-anchor="start">brief filled from the request</text>
<rect x="310" y="200" width="240" height="56" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.2"/>
<text x="324" y="222" font-size="13" fill="#F1F5F9" font-weight="700" text-anchor="start">Router</text>
<text x="324" y="242" font-size="12" fill="#CBD5E1" font-weight="400" text-anchor="start">picks the lane and skills</text>
<rect x="570" y="200" width="240" height="56" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.2"/>
<text x="584" y="222" font-size="13" fill="#F1F5F9" font-weight="700" text-anchor="start">Quality bar</text>
<text x="584" y="242" font-size="12" fill="#CBD5E1" font-weight="400" text-anchor="start">85 drafts / 90 finals</text>
<rect x="830" y="200" width="240" height="56" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.2"/>
<text x="844" y="222" font-size="13" fill="#F1F5F9" font-weight="700" text-anchor="start">Credit gate</text>
<text x="844" y="242" font-size="12" fill="#CBD5E1" font-weight="400" text-anchor="start">proofs first, finals after yes</text>
<line x1="560" y1="270" x2="560" y2="296" stroke="#FBBF24" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="296" width="1060" height="300" rx="12" fill="#162033" stroke="#475569" stroke-width="1.2"/>
<text x="48" y="318" font-size="12" fill="#FBBF24" font-weight="700" text-anchor="start">3  CREW PIPELINE: 14 agents, creative-director leads and signs off</text>
<rect x="50.0" y="340" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="60.0" y="360" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 1</text>
<text x="60.0" y="378" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">producer</text>
<text x="60.0" y="393" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">schedule, credit budget</text>
<rect x="257.5" y="340" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="267.5" y="360" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 2</text>
<text x="267.5" y="378" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">screenwriter</text>
<text x="267.5" y="393" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">script, scene breakdown</text>
<rect x="465.0" y="340" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="475.0" y="360" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 3 (parallel)</text>
<text x="475.0" y="378" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">production-designer</text>
<text x="475.0" y="393" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">+ cinematographer</text>
<text x="475.0" y="408" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">+ performance-director</text>
<rect x="672.5" y="340" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="682.5" y="360" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 4</text>
<text x="682.5" y="378" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">prompt-engineer</text>
<text x="682.5" y="393" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">model-ready prompts</text>
<rect x="712.5" y="330" width="144" height="18" rx="9" fill="#FBBF24"/>
<text x="784.5" y="343" font-size="10.5" fill="#0F172A" font-weight="700" text-anchor="middle">credits after your yes</text>
<rect x="880.0" y="340" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="890.0" y="360" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 5 (parallel)</text>
<text x="890.0" y="378" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">vfx-artist</text>
<text x="890.0" y="393" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">+ voice-director</text>
<text x="890.0" y="408" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">+ composer-sound-designer</text>
<rect x="920.0" y="330" width="144" height="18" rx="9" fill="#FBBF24"/>
<text x="992.0" y="343" font-size="10.5" fill="#0F172A" font-weight="700" text-anchor="middle">credits after your yes</text>
<rect x="50.0" y="470" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="60.0" y="490" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 6</text>
<text x="60.0" y="508" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">editor</text>
<text x="60.0" y="523" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">assembly and edit</text>
<rect x="257.5" y="470" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="267.5" y="490" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 7 (parallel)</text>
<text x="267.5" y="508" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">colorist</text>
<text x="267.5" y="523" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">+ title-designer</text>
<rect x="465.0" y="470" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="475.0" y="490" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 8</text>
<text x="475.0" y="508" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">continuity-supervisor</text>
<text x="475.0" y="523" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">QA across shots</text>
<rect x="672.5" y="470" width="190" height="78" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="682.5" y="490" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start">STEP 9</text>
<text x="682.5" y="508" font-size="12" fill="#F1F5F9" font-weight="600" text-anchor="start">creative-director</text>
<text x="682.5" y="523" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">final review, sign-off</text>
