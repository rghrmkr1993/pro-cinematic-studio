<rect x="310" y="652" width="240" height="128" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="324" y="676" font-size="13" fill="#FBBF24" font-weight="700" text-anchor="start">Camera</text>
<text x="324" y="698" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">cinematography</text>
<text x="324" y="714" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">(+ signature shots)</text>
<rect x="570" y="652" width="240" height="128" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="584" y="676" font-size="13" fill="#FBBF24" font-weight="700" text-anchor="start">People &amp; culture</text>
<text x="584" y="698" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">photoreal-humans</text>
<text x="584" y="714" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">asian-human-reference</text>
<text x="584" y="730" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">indic-languages</text>
<rect x="830" y="652" width="240" height="128" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="844" y="676" font-size="13" fill="#FBBF24" font-weight="700" text-anchor="start">Generation</text>
<text x="844" y="698" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">higgsfield-master</text>
<text x="844" y="714" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">higgsfield-timed-prompts</text>
