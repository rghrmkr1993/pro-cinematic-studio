<text x="952.0" y="493" font-size="10.5" fill="#0F172A" font-weight="700" text-anchor="middle">credits after your yes</text>
<text x="880.0" y="518" font-size="11.5" fill="#CBD5E1" font-weight="400" text-anchor="start">= the 3 roles that spend</text>
<text x="880.0" y="534" font-size="11.5" fill="#CBD5E1" font-weight="400" text-anchor="start">credits: prompt-engineer,</text>
<text x="880.0" y="550" font-size="11.5" fill="#CBD5E1" font-weight="400" text-anchor="start">voice-director, composer</text>
<line x1="560" y1="596" x2="560" y2="622" stroke="#FBBF24" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="622" width="1060" height="320" rx="12" fill="#162033" stroke="#475569" stroke-width="1.2"/>
<text x="48" y="644" font-size="12" fill="#FBBF24" font-weight="700" text-anchor="start">4  SKILL LIBRARY: 70 skills, loaded on demand by the router</text>
