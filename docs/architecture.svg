<text x="1166" y="332" font-size="12.5" fill="#F1F5F9" font-weight="700" text-anchor="start">Originals only,</text>
<text x="1166" y="352" font-size="12" fill="#CBD5E1" font-weight="400" text-anchor="start">no copying existing work</text>
<rect x="1126" y="430" width="228" height="124" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
