<text x="1166" y="632" font-size="12.5" fill="#F1F5F9" font-weight="700" text-anchor="start">Nothing published</text>
<text x="1166" y="652" font-size="12" fill="#CBD5E1" font-weight="400" text-anchor="start">without your yes</text>
<rect x="1126" y="730" width="228" height="124" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<circle cx="1146" cy="754" r="10" fill="#FBBF24"/>
