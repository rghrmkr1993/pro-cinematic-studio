<text x="64" y="838" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">voice-studio</text>
<text x="64" y="854" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">music-and-sound</text>
<rect x="310" y="792" width="240" height="128" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="324" y="816" font-size="13" fill="#FBBF24" font-weight="700" text-anchor="start">Post</text>
<text x="324" y="838" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">edit-director, edit-gen,</text>
<text x="324" y="854" font-size="12" fill="#F1F5F9" font-weight="400" text-anchor="start">edit-voice, color-grading,</text>
