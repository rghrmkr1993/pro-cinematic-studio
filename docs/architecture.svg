<text x="1166" y="202" font-size="12" fill="#CBD5E1" font-weight="400" text-anchor="start">your yes</text>
<text x="1140" y="230" font-size="11.5" fill="#CBD5E1" font-weight="400" text-anchor="start">Proofs about 20 percent</text>
<rect x="1126" y="280" width="228" height="124" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<circle cx="1146" cy="304" r="10" fill="#FBBF24"/>
